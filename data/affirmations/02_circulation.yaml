- id: aff-l-4-voies-double-sens
  contexte: Route à double sens, sans terre-plein central, comme sur ce plan.
  affirmation: Je dépasse par la voie de gauche de mon sens, pas par celles d'en face.
  verdict: vrai
  pourquoi: 'Chaque sens dispose de deux voies : celle de gauche sert au dépassement, puis je me replace à droite. La voie
    la plus à gauche de la chaussée m’est interdite pour dépasser (R414-8) ; ici, la ligne axiale est continue, comme c’est
    la règle à quatre voies en rase campagne : la franchir est interdit (R412-19 : 135 €, 3 points).'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-19 et R414-8 ; IISR 7e partie, art. 114-2
