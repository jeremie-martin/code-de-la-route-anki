- id: aff-l-sens-unique-gauche
  contexte: En agglomération, rue à sens unique, sans marquage ni panneau de stationnement.
  affirmation: Je peux stationner du côté gauche de la chaussée.
  verdict: vrai
  pourquoi: 'R417-1 : dans une rue à sens unique, le stationnement est admis à droite comme à gauche, sauf arrêté ou signalisation contraire. Sur une chaussée à double sens, seul le côté droit est permis.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-1
  comparaisons:
  - ref: c12
    legende: 'Sens unique : en agglomération, arrêt et stationnement à droite ou à gauche.'
- id: aff-l-bau-appel
  contexte: Sur autoroute, mon téléphone sonne ; la bande d'arrêt d'urgence est dégagée.
  affirmation: Je peux m'y arrêter le temps de l'appel, feux de détresse allumés.
  verdict: faux
  pourquoi: 'La BAU n''est ouverte qu''à la nécessité absolue (panne, malaise, secours) : s''y arrêter pour téléphoner est un arrêt gênant (35 €), et c''est l''un des endroits les plus meurtriers de l''autoroute.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R421-7 et R417-10
- id: aff-l-arret-moteur-tournant
  contexte: J'attends quelqu'un dix minutes au volant, moteur tournant, le long du trottoir.
  affirmation: Il s'agit d'un arrêt, pas d'un stationnement.
  verdict: faux
  pourquoi: "R110-2 définit l'arrêt comme une immobilisation momentanée le temps d'une montée, d'une descente ou d'un chargement. Attendre, même au volant et moteur tournant, est un stationnement. Les interdictions de stationner s'appliquent donc."
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R110-2
- id: aff-l-arret-chargement
  contexte: Je charge des cartons dans mon coffre, à côté de mon véhicule, pendant cinq minutes.
  affirmation: Il s'agit d'un arrêt, tant que je reste à proximité pour pouvoir déplacer le véhicule.
  verdict: vrai
  pourquoi: L’arrêt couvre une montée, une descente, un chargement ou un déchargement immédiat, conducteur aux commandes ou à proximité. Il reste interdit le long d’une ligne jaune continue ou devant un panneau interdisant l’arrêt.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R110-2
- id: aff-l-trottoir-moto
  contexte: Une moto est garée en travers sur un large trottoir.
  affirmation: Pour une moto garée sur le trottoir, le barème est le même que pour une voiture.
  verdict: faux
  pourquoi: Pour une voiture, le trottoir est très gênant (135 €) ; pour une moto ou un cyclomoteur, c’est un stationnement
    gênant (35 €), avec fourrière possible dans les deux cas (R417-10 et R417-11).
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-10
- id: aff-l-genant-fourriere
  contexte: Mon véhicule est en stationnement seulement « gênant » (35 €).
  affirmation: Il peut malgré tout être emmené en fourrière.
  verdict: vrai
  pourquoi: 'La fourrière est possible pour tout stationnement gênant, très gênant, dangereux ou abusif (plus de 7 jours au même point) : les frais d''enlèvement et de garde s''ajoutent à l''amende.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-9 à R417-12 ; L325-1
- id: aff-l-zone-rencontre-stationnement
  contexte: Dans une zone de rencontre, la chaussée est large et dégagée.
  affirmation: Je peux y stationner ailleurs que sur les emplacements marqués si je ne gêne personne.
  verdict: faux
  pourquoi: 'R417-10 : en zone de rencontre, le stationnement en dehors des emplacements aménagés est gênant (35 €). Les piétons peuvent y circuler sur la chaussée et ont priorité sur les véhicules.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-10 et R110-2
  comparaisons:
  - ref: b52
    legende: 'Entrée de zone de rencontre : 20 km/h, piétons prioritaires, stationnement sur les emplacements seulement.'
- id: aff-l-90-departement
  contexte: Route hors agglomération à double sens, une voie par sens, sans séparateur central ni panneau relevant
    la limitation.
  affirmation: Sans panneau, la vitesse maximale sur cette route est de 90 km/h.
  verdict: faux
  pourquoi: 'Depuis le 1er juillet 2018, la limite par défaut est de 80 km/h (R413-2). Les départements qui l''ont
    relevée à 90 doivent le signaler par des panneaux : sans panneau, c''est 80.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-2
- id: aff-l-creneau-90
  contexte: Temps sec, permis hors période probatoire, hors agglomération, sur cette section.
  affirmation: Je peux y rouler à 90 km/h sur ces voies.
  verdict: vrai
  pourquoi: R413-2 relève la vitesse à 90 km/h sur les sections comportant au moins deux voies affectées au même sens, sur ces seules voies. Ces sections sont signalées (panneau 90 à leur début) ; c’est la présence de deux voies dans mon sens qui les caractérise. Le sens à une voie reste à 80, et le permis probatoire aussi.
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-2 I 3° et R413-5
  image:
    gen: road
    params:
      lanes: 3
      up_lanes: 2
