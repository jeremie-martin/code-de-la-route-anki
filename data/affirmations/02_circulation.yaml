- id: aff-l-depassement-intersection-prioritaire
  contexte: Je circule sur cette route et j’approche d’un carrefour, bonne visibilité.
  affirmation: Je peux y dépasser la voiture qui me précède.
  verdict: vrai
  pourquoi: R414-11 interdit de dépasser aux intersections, sauf un deux-roues ; l’interdiction ne vaut pas pour celui qui
    y est prioritaire (route prioritaire, ou STOP et cédez-le-passage pour les autres), ni aux carrefours à feux ou réglés
    par un agent.
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-11
