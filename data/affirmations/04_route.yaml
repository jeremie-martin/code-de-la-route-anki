# R : La route : affirmations à juger VRAI/FAUX.
- id: aff-r-descente-150m
  contexte: Route de montagne hors agglomération ; je passe ce panneau.
  affirmation: Le danger annoncé commence à environ 150 m.
  verdict: vrai
  pourquoi: Hors agglomération, un panneau de danger est implanté à environ 150 m de ce qu'il annonce (50 m en agglomération),
    sauf panonceau de distance.
  theme: R
  sous_theme: montagne
  source: "Sécurité routière, Exemples de nouvelles questions (Q18) ; IISR, 1re partie"
  image_ref: a16
- id: aff-r-pn-150m
  contexte: Route hors agglomération ; je passe ce panneau.
  affirmation: Le passage à niveau se situe à environ 150 m.
  verdict: vrai
  pourquoi: Hors agglomération, un panneau de danger est implanté à environ 150 m de ce qu’il annonce, sauf panonceau de distance. Des balises à trois, deux puis une bande rouge décomptent l’approche (150, 100, 50 m).
  theme: R
  sous_theme: passages_a_niveau
  source: "Sécurité routière, Exemples de nouvelles questions (Q19) ; IISR"
  image:
    commons: France road sign A7 + M9z Signal Automatique.svg
    signal: true
  comparaisons:
  - ref: j10
    legende: 'Balises à 3, 2 puis 1 bande rouge : 150, 100, 50 m avant le passage.'
- id: aff-r-pn-feux-rouges-possibles
  contexte: Un passage à niveau est annoncé par ce panneau et son panonceau.
  affirmation: À ce passage à niveau, je peux rencontrer des feux rouges clignotants.
  verdict: vrai
  pourquoi: 'A7 annonce des barrières ; le panonceau « signal automatique » précise qu’elles sont automatiques : de chaque côté, un feu rouge clignotant et une sonnerie précèdent la fermeture des demi-barrières.'
  theme: R
  sous_theme: passages_a_niveau
  source: Sécurité routière, Exemples de nouvelles questions (Q19) ; IISR, 4e partie (signal G2)
  image:
    commons: France road sign A7 + M9z Signal Automatique.svg
    signal: true
  illustration:
    gen: pn_face
    params:
      barriere: haute
    legende: 'Au passage : le feu rouge clignote avant que la demi-barrière ne s’abaisse.'
- id: aff-r-pn-barriere-contourner
  affirmation: 'Une demi-barrière ne ferme que ma moitié de chaussée : je peux la contourner si je ne vois pas de
    train.'
  verdict: faux
  pourquoi: Aucun usager ne doit s'engager quand les barrières sont fermées, en cours de fermeture ou d'ouverture (R422-3 II). Un train peut en cacher un autre, et un train lancé à 100 km/h peut avoir besoin d’environ 1 km pour s'arrêter.
  theme: R
  sous_theme: passages_a_niveau
  source: Code de la route, art. R422-3 ; SNCF Réseau
  image:
    gen: pn_plan
    params:
      barrieres: basses
- id: aff-r-insertion-prioritaire
  contexte: Sur l'autoroute, la voiture rouge arrive par la voie d'accélération.
  affirmation: 'Je dois lui laisser le passage : celui qui s''insère est prioritaire.'
  verdict: faux
  pourquoi: L’entrant cède le passage (R421-3). Je facilite si possible en ajustant mon allure ou en changeant de
    voie après contrôles. Ma priorité ne dispense pas de freiner si cela évite une collision.
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R421-3
  image:
    gen: bretelle
    params:
      vehicles:
      - lane: droite
        x: 150
        me: true
      - lane: bretelle
        x: 190
        colour: rouge
- id: aff-r-autoroute-voie-gauche-80
  prerequis: [l-vitesse-minimale-autoroute]
  contexte: Autoroute à trois voies, circulation fluide, pluie battante ; sur la voie de gauche, je dépasse à 70 km/h
    un camion plus lent.
  affirmation: Je suis en infraction, puisque le minimum est de 80 km/h sur cette voie.
  verdict: faux
  pourquoi: 'R413-19 n’impose 80 km/h sur la voie la plus à gauche que si la circulation est fluide et que la visibilité
    et l’adhérence sont suffisantes. Sous une pluie battante, adapter sa vitesse prime (R413-17) : je dépasse plus
    lentement, puis je me rabats.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R413-19
- id: aff-r-autoroute-vitesse-pluie
  contexte: Autoroute normalement limitée à 130 km/h, sous une forte averse.
  affirmation: Sous la pluie, la limitation passe à 110 km/h, y compris pour un conducteur en permis probatoire.
  verdict: vrai
  pourquoi: 'Par temps de pluie, l''autoroute est limitée à 110 km/h pour tous (R413-2) : l''écart entre le probatoire
    (110) et le permis définitif (130) disparaît donc sous la pluie.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R413-2 et R413-5
- id: aff-r-autoroute-cyclo
  affirmation: Un cyclomoteur de 50 cm³ immatriculé peut emprunter l'autoroute.
  verdict: faux
  pourquoi: 'R421-2 interdit l''accès de l''autoroute aux cyclomoteurs, aux voiturettes, aux vélos, aux piétons,
    aux animaux et aux engins agricoles, immatriculés ou non : ils ne peuvent pas tenir l''allure du trafic.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R421-2
- id: aff-r-autoroute-aac
  affirmation: Un élève en conduite accompagnée n'a pas le droit de circuler sur autoroute.
  verdict: faux
  pourquoi: L'autoroute est autorisée en conduite accompagnée ; l'élève est seulement soumis aux vitesses du permis
    probatoire (110 km/h sur autoroute, 100 sur chaussées séparées, 80 ailleurs).
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R413-5 ; service-public.fr F2390
- id: aff-r-autoroute-bouchon-detresse
  contexte: Sur autoroute, je découvre un bouchon et je suis le dernier véhicule de la file.
  affirmation: J'allume mes feux de détresse tout en ralentissant.
  verdict: vrai
  pourquoi: 'Les feux de détresse sont obligatoires quand on est contraint de circuler momentanément à allure fortement
    réduite (R416-18) : c''est ce qui évite le suraccident par l''arrière à 130 km/h.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R416-18
- id: aff-r-peage-reculer
  affirmation: Si je me trompe de voie au péage, je peux reculer pour changer de file.
  verdict: faux
  pourquoi: La marche arrière est interdite sur autoroute, péage compris (R421-6). On s'arrête, on appelle par l'interphone
    de la borne et un agent règle la situation à distance.
  theme: R
  sous_theme: autoroute
  source: "Code de la route, art. R421-6 ; ASFA, Le péage"
- id: aff-r-brouillard-arriere-pluie
  dedup_ok:
  - aff-r-brouillard-avant-pluie
  contexte: Forte pluie sur une route à double sens, en plein jour.
  affirmation: J'allume mes feux de brouillard arrière pour être mieux vu.
  verdict: faux
  pourquoi: 'Les feux arrière de brouillard ne peuvent être utilisés qu''en cas de brouillard ou de chute de neige
    (R416-7 II) : sous la pluie, ils éblouissent ceux qui suivent (135 €). Les feux de brouillard avant, eux, sont
    admis.'
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R416-7
- id: aff-r-brouillard-avant-pluie
  affirmation: Par forte pluie, les feux de brouillard avant peuvent remplacer mes feux de croisement.
  verdict: vrai
  pourquoi: 'R416-7 I : en cas de brouillard, de chute de neige ou de forte pluie, les feux avant de brouillard
    peuvent remplacer ou compléter les feux de croisement.'
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R416-7
- id: aff-r-brouillard-avant-sinueuse
  contexte: Hors agglomération, de nuit, sur une petite route étroite et sinueuse, personne en face.
  affirmation: Je peux allumer mes feux de brouillard avant en plus de mes feux de route.
  verdict: vrai
  pourquoi: 'R416-7 I : hors agglomération, sur les routes étroites et sinueuses, les feux avant de brouillard peuvent
    compléter les feux de route ; leur faisceau large éclaire les bas-côtés. Dès qu’un usager risque d’être ébloui,
    je repasse en feux de croisement. Les feux arrière de brouillard restent réservés au brouillard et à la neige.'
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-7
- id: aff-r-brouillard-feux-route
  affirmation: Dans le brouillard, les feux de route éclairent plus loin que les feux de croisement.
  verdict: faux
  pourquoi: Leur faisceau se réfléchit sur les gouttelettes et forme un mur blanc qui réduit encore la visibilité
    ; R416-6 impose d'ailleurs les feux de croisement par visibilité réduite.
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R416-6
- id: aff-r-visibilite-50-autoroute
  affirmation: La limitation à 50 km/h en cas de visibilité inférieure à 50 m ne s'applique pas sur autoroute.
  verdict: faux
  pourquoi: R413-4 abaisse la vitesse à 50 km/h « sur l'ensemble des réseaux routier et autoroutier ». C'est un
    article distinct de celui des vitesses par temps de pluie (R413-2).
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R413-4
- id: aff-r-aquaplaning-freiner
  affirmation: En cas d'aquaplaning, il faut freiner fermement pour retrouver l'adhérence.
  verdict: faux
  pourquoi: 'Les roues ne touchent plus la route : freiner ou braquer met la voiture en travers. On lève le pied
    progressivement, volant tenu fermement et roues droites, jusqu''au retour du contact.'
  theme: R
  sous_theme: intemperies
  source: "Ornikar, L'aquaplaning ; securite-routiere.gouv.fr, Conduire sous la pluie"
- id: aff-r-montagne-ms
  affirmation: Des pneus marqués seulement « M+S » suffisent pour satisfaire à l'obligation d'équipement en zone
    montagne.
  verdict: faux
  pourquoi: Depuis le 1er novembre 2024, un pneu hiver doit porter le symbole alpin 3PMSF (le flocon) en plus du
    marquage M+S ; le M+S seul ne convient plus, sauf à détenir des chaînes ou des chaussettes à bord.
  theme: R
  sous_theme: intemperies
  source: Décret n° 2020-1264 ; service-public.fr F19459
  illustration:
    gen: pneu_flanc
    legende: '1 : M+S seul. 2 : M+S et symbole alpin, exigé depuis le 1er novembre 2024.'
    params:
      mode: comparaison
- id: aff-r-montagne-4-pneus
  contexte: Route enneigée, panneau d'entrée de zone montagne, en pleine période hivernale.
  affirmation: Sans chaînes ni chaussettes à bord, il me faut quatre pneus hiver pour circuler ici.
  verdict: vrai
  pourquoi: 'L''obligation hivernale se remplit au choix par les pneus ou par un équipement amovible : privé de chaînes
    et de chaussettes, il ne reste que les quatre pneus marqués 3PMSF.'
  theme: R
  sous_theme: intemperies
  source: "Sécurité routière, Exemples de nouvelles questions (Q10) ; décret n° 2020-1264"
  comparaisons:
  - ref: b58
    legende: Entrée de zone où l’équipement hivernal est obligatoire pendant la période indiquée.
- id: aff-r-verglas-pont
  affirmation: Un pont peut être verglacé alors que la route qui y mène ne l'est pas.
  verdict: vrai
  pourquoi: 'Un tablier de pont se refroidit par-dessus et par-dessous : il gèle avant le reste de la chaussée.
    Même piège dans les zones d''ombre, les sous-bois et près des cours d''eau.'
  theme: R
  sous_theme: intemperies
  source: "En Voiture Simone, Le verglas ; Roole, Neige et verglas"
- id: aff-r-verglas-temperature-positive
  contexte: Aube d’hiver ; le thermomètre extérieur de la voiture indique +2 °C.
  affirmation: Avec une température positive, la route n’est pas verglacée.
  verdict: faux
  pourquoi: 'Le revêtement peut être plus froid que l’air, surtout sur les ponts, dans les zones d’ombre et près
    des cours d’eau : du verglas est possible avec une température affichée positive. Aucune valeur du thermomètre
    ne garantit l’absence de glace.'
  theme: R
  sous_theme: intemperies
  source: "Codes Rousseau, Neige et brouillard ; En Voiture Simone, Le verglas"
- id: aff-r-neige-depassement-pl
  affirmation: Sur une chaussée enneigée, un poids lourd de plus de 3,5 t ne peut ni dépasser ni changer de file.
  verdict: vrai
  pourquoi: 'R414-17 : dès qu''une voie au moins est couverte de neige ou de verglas, le dépassement et le changement
    de file sont interdits aux véhicules de plus de 3,5 t et aux ensembles de plus de 7 m.'
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R414-17
- id: aff-r-nuit-feux-position-agglo
  contexte: La nuit, en agglomération, sur une avenue bien éclairée.
  affirmation: En voiture, je peux me contenter de mes feux de position.
  verdict: faux
  pourquoi: 'R416-6 II 2° : la nuit, en agglomération sur une route suffisamment éclairée, une voiture circule en feux de croisement (pas en feux de route). Les feux de position seuls ne sont admis, en agglomération bien éclairée, que lorsque la visibilité est réduite par la météo, en pratique de jour sous la pluie, et jamais pour une moto.'
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-6 et R416-8
  comparaisons:
  - ref: voyant-position
    legende: 'Feux de position : se faire voir, pas éclairer.'
  - ref: voyant-croisement
    legende: 'Feux de croisement : obligatoires la nuit en ville.'
- id: aff-r-nuit-feux-route-arret
  affirmation: À l'arrêt ou en stationnement, l'usage des feux de route est interdit.
  verdict: vrai
  pourquoi: 'R416-5 : les feux de route sont interdits véhicule arrêté ou stationné (135 €). La nuit, hors agglomération, le véhicule arrêté sur la chaussée reste signalé par ses feux de position, même si la route est éclairée.'
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-5
- id: aff-r-nuit-pieton-sombre
  dedup_ok:
  - aff-u-pieton-nuit-croisement
  contexte: Nuit, hors agglomération, feux de croisement ; un piéton en vêtements sombres marche sur le bas-côté.
  affirmation: Je le distingue à peu près aussi loin qu'un piéton portant un gilet rétroréfléchissant.
  verdict: faux
  pourquoi: En vêtements sombres, il se détache à peine du fond et n’apparaît que tard dans le faisceau des feux de croisement ; un gilet rétroréfléchissant renvoie la lumière et le signale bien plus tôt.
  theme: R
  sous_theme: nuit
  source: "securite-routiere.gouv.fr, Conduire de nuit ; Code de la route, art. R313-3"
- id: aff-r-tunnel-demi-tour
  affirmation: Si un bouchon se forme dans le tunnel, je peux faire demi-tour pour ressortir.
  verdict: faux
  pourquoi: Demi-tour et marche arrière sont interdits en tunnel. On s'arrête en gardant la distance affichée, moteur
    coupé, radio allumée ; si une évacuation est nécessaire, elle se fait à pied par les issues de secours.
  theme: R
  sous_theme: tunnels
  source: CETU, Conduire en tunnel ; IISR (panneau C111, règles de circulation en tunnel)
- id: aff-r-tram-station-pieton
  affirmation: Un tramway arrêté à sa station peut masquer un piéton qui traverse devant lui.
  verdict: vrai
  pourquoi: 'Les voyageurs descendus rejoignent le trottoir en coupant la chaussée devant ou derrière la rame :
    on ralentit à l''approche d''une station, et on ne dépasse pas du côté où ils descendent.'
  theme: R
  sous_theme: tramways
  source: "Code de la route, art. R414-13 ; coursdecode.com, Les tramways"
- id: aff-r-chantier-sans-ouvriers
  contexte: Chantier autoroutier un dimanche, signalé ainsi ; aucun engin ni ouvrier en vue.
  affirmation: 'Personne ne travaille : je peux reprendre 130 km/h.'
  verdict: faux
  pourquoi: 'Tant que les panneaux temporaires sont en place, ils s''imposent et priment sur la signalisation permanente
    : la chaussée reste rétrécie ou dévoyée, et les contrôles de vitesse y fonctionnent aussi le dimanche.'
  theme: R
  sous_theme: chantiers
  source: IISR, 8e partie ; Code de la route, art. R411-25
  image:
    gen: support_panneaux
    params:
      signs:
      - kind: sign
        file: France road sign AK5.svg
        w: 130
      - kind: sign
        file: France road sign B14 (90).svg
        w: 110
- id: aff-r-vent-deux-roues
  affirmation: Par vent latéral, je laisse un écart plus grand au motard que je dépasse.
  verdict: vrai
  pourquoi: Deux-roues, caravanes, fourgons et véhicules à coffre de toit sont les plus sensibles au vent ; la rafale
    surprend surtout à la sortie d'une zone abritée (tunnel, pile de pont, rideau d'arbres).
  theme: R
  sous_theme: intemperies
  source: "securite-routiere.gouv.fr, Le vent ; En Voiture Simone, Le vent"
