- id: aff-u-pieton-telephone
  contexte: Un piéton debout au bord d'un passage protégé consulte son téléphone, puis pose un pied sur la chaussée.
  affirmation: Il bénéficie de la priorité et je dois m'arrêter pour le laisser traverser.
  verdict: vrai
  pourquoi: 'R415-11 : dès qu''un piéton s''engage ou manifeste clairement l''intention de traverser, je cède le passage, au besoin en m''arrêtant. Son inattention ne me dispense de rien (refus : 135 €, 6 points).'
  theme: U
  sous_theme: pietons
  source: 'Code de la route, art. R415-11 ; Ornikar — Priorité piéton'
- id: aff-u-pieton-imprudent
  contexte: Un piéton traverse en courant hors passage, alors qu'un passage protégé se trouve à 20 m.
  affirmation: Comme il est en tort, je ne suis pas tenu de ralentir.
  verdict: faux
  pourquoi: 'R412-6 impose une prudence accrue envers les usagers vulnérables, y compris lorsqu''ils se montrent imprudents : je ralentis et je le laisse passer. Son amende de 4 € ne m''exonère de rien.'
  theme: U
  sous_theme: pietons
  source: 'Code de la route, art. R412-6 et R412-37 ; securite-routiere.gouv.fr — Réglementation des piétons'
- id: aff-u-pieton-passage-50m
  contexte: Je suis piéton à un carrefour ordinaire, hors zone de rencontre et aire piétonne.
    Aucun passage piéton n’est aménagé à proximité ; il n’y a ni feu ni agent.
  affirmation: L’absence de passage à moins de 50 m m’autorise à traverser le carrefour en diagonale.
  verdict: faux
  pourquoi: Je contourne le carrefour en traversant dans le prolongement des trottoirs, après avoir vérifié
    la circulation. L’absence de passage proche ne permet pas de choisir n’importe quelle trajectoire.
  theme: U
  sous_theme: pietons
  source: Code de la route, R412-37 et R412-39 — https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177125/
- id: aff-u-place-pmr
  contexte: Je dépose un passager devant un commerce ; la seule place libre porte le marquage « personnes handicapées ».
  affirmation: Un arrêt de deux minutes y est admis.
  verdict: faux
  pourquoi: 'R417-11 vise « l''arrêt ou le stationnement » sur ces emplacements : 135 € et fourrière. Ils sont réservés aux porteurs de la carte mobilité inclusion « stationnement », qui y stationnent gratuitement (durée limitable par la commune, mais au moins 12 h).'
  theme: U
  sous_theme: pietons
  source: 'Code de la route, art. R417-11 ; service-public.fr F2891'
- id: aff-u-fauteuil-roulant-pieton
  affirmation: Une personne en fauteuil roulant motorisé qui circule à l'allure du pas est assimilée à un piéton.
  verdict: vrai
  pourquoi: 'R412-34 : sont des piétons les personnes en chaise roulante, celles qui poussent une poussette et celles qui conduisent à la main un vélo, un cyclomoteur ou une trottinette électrique.'
  theme: U
  sous_theme: pietons
  source: 'Code de la route, art. R412-34 et R412-35'
- id: aff-u-car-scolaire-depassement
  contexte: Un car de transport d'enfants est arrêté sur le bas-côté, feux de détresse allumés.
  affirmation: Je peux le dépasser à allure très réduite, à condition de pouvoir m'arrêter si un enfant surgit.
  verdict: vrai
  pourquoi: 'Aucun texte n''interdit ce dépassement : R413-17 impose de réduire fortement sa vitesse au croisement
    comme au dépassement d''un transport d''enfants à l''arrêt. Un enfant peut surgir devant le car. L''interdiction
    de dépasser vise le tramway ou le train à l''arrêt, du côté où des voyageurs montent ou descendent.'
  theme: U
  sous_theme: pietons
  source: 'Code de la route, art. R413-17 III 3° et R414-13'
- id: aff-u-pieton-nuit-croisement
  contexte: Je marche la nuit sur une route non éclairée, avec des vêtements sombres.
  affirmation: Je peux être découvert trop tard par un conducteur en feux de croisement.
  verdict: vrai
  pourquoi: La distance de détection dépend du contraste, de l’éclairage et de la météo. Les 30 m de portée
    minimale réglementaire ne sont pas une distance garantie de détection d’un piéton. Me rendre visible et
    ne pas présumer avoir été vu.
  theme: U
  sous_theme: pietons
  source: Code de la route, R413-17 — https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000047794480/
    ; R313-3
- id: aff-u-velo-bande-obligatoire
  contexte: Je suis à vélo ; une bande cyclable signalée par un panneau carré bleu longe la chaussée.
  affirmation: Je dois l'emprunter et quitter la chaussée.
  verdict: faux
  pourquoi: Pour un cycliste, le carré bleu conseille la piste ; le rond bleu la rend obligatoire. En agglomération, une trottinette électrique doit emprunter la piste ou la bande cyclable lorsqu’elle existe.
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R431-9 et R412-43-1 ; IISR (B22a, C113)'
  comparaisons:
  - ref: c113
    legende: 'Carré : conseillé aux cyclistes.'
  - ref: b22a
    legende: 'Rond : obligatoire pour les cyclistes.'
- id: aff-u-velo-front-nuit
  contexte: Je roule à vélo avec un ami, hors agglomération, à la tombée du jour.
  affirmation: Nous pouvons rester à deux de front tant qu'aucune voiture n'arrive.
  verdict: faux
  pourquoi: 'R431-7 : deux de front au maximum, mais la file simple s''impose dès la chute du jour, et dès qu''un véhicule annonce son dépassement. Exceptions : aire piétonne, voie verte, zone de rencontre.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R431-7 (décret n° 2024-1074)'
- id: aff-u-velo-enfant-trottoir
  affirmation: Un enfant de 8 ans peut circuler à vélo sur le trottoir, à l'allure du pas.
  verdict: faux
  pourquoi: 'La tolérance ne vaut que pour les enfants de moins de 8 ans (R412-34 I bis). À 8 ans révolus, l''enfant roule sur la chaussée ou sur les aménagements cyclables, comme un adulte.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R412-34 I bis'
- id: aff-u-velo-casque-enfant-adulte
  contexte: J'emmène mon neveu de 6 ans sur un siège vélo, sans casque.
  affirmation: En tant qu'adulte qui le transporte, je suis moi-même verbalisable.
  verdict: vrai
  pourquoi: 'R431-1-3 : le casque attaché est exigé pour tout cycliste ou passager de moins de 12 ans, et c''est l''adulte qui transporte ou accompagne l''enfant qui paie l''amende de 135 €.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R431-1-3'
- id: aff-u-velo-ecouteurs
  contexte: Je suis à vélo en ville, écouteurs dans les oreilles.
  affirmation: C'est toléré, puisqu'un vélo n'est pas un véhicule à moteur.
  verdict: faux
  pourquoi: 'R412-6-1 interdit à tout conducteur le port à l''oreille d''un dispositif émettant du son, vélo et trottinette électrique compris : 135 €. Sans permis en jeu, il n''y a simplement pas de retrait de points.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R412-6-1 ; securite-routiere.gouv.fr — Règles de circulation pour les cyclistes'
- id: aff-u-velo-double-sens-zone30
  contexte: Je suis à vélo dans une zone 30 ; la rue est à sens unique pour les voitures.
  affirmation: Je peux la remonter à contresens, même sans panonceau « sauf vélos ».
  verdict: vrai
  pourquoi: 'R412-28-1 : dès que la vitesse maximale est de 30 km/h ou moins, la chaussée est à double sens pour les cycles et les EDPM, sauf décision contraire. L''automobiliste doit donc attendre des vélos en face.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R412-28-1 et R110-2'
- id: aff-u-velo-m12
  contexte: Sous le feu tricolore, un petit triangle inversé porte un vélo jaune et une flèche vers la droite.
  affirmation: Le cycliste peut franchir le feu rouge vers la droite sans céder le passage.
  verdict: faux
  pourquoi: Ce panonceau autorise les usagers concernés à franchir le feu dans la seule direction fléchée, en cédant aux piétons et aux véhicules qui ont le vert. Il ne donne aucune priorité.
  theme: U
  sous_theme: cyclistes
  source: 'IISR (panonceau M12) ; Cerema — Doctrine cédez-le-passage cycliste au feu'
  comparaisons:
  - ref: m12
    legende: Passage autorisé uniquement dans les directions fléchées, en cédant.
- id: aff-u-velo-ecart-portieres
  contexte: En ville, un cycliste roule à un bon mètre de la file de voitures stationnées.
  affirmation: Il a le droit de s'écarter ainsi, et j'en tiens compte pour le dépasser.
  verdict: vrai
  pourquoi: 'R412-9 : sur les voies limitées à 50 km/h au plus, un cycliste ou un EDPM peut s''écarter des véhicules stationnés de la distance nécessaire à sa sécurité (portières). Je le dépasse à 1 m, sinon j''attends.'
  theme: U
  sous_theme: cyclistes
  source: 'Code de la route, art. R412-9 et R414-4'
# ---------- EDPM (trottinettes électriques) ----------
- id: aff-u-edpm-trottoir
  contexte: Je suis en trottinette électrique et la chaussée me paraît dangereuse.
  affirmation: Je peux emprunter le trottoir, dès lors que je roule à l'allure du pas.
  verdict: faux
  pourquoi: 'Le trottoir est interdit aux EDPM (135 €), sauf autorisation expresse du maire. Pour l''emprunter, je descends et je pousse l''engin à la main : je redeviens alors un piéton.'
  theme: U
  sous_theme: edpm
  source: 'Code de la route, art. R412-43-1 et R412-34 ; service-public.fr F308'
- id: aff-u-edpm-pousse-main
  contexte: Je descends de ma trottinette électrique et je la pousse à la main.
  affirmation: Je suis alors considéré comme un piéton.
  verdict: vrai
  pourquoi: 'R412-34 assimile aux piétons ceux qui conduisent à la main un EDPM, un cycle ou un cyclomoteur : trottoir autorisé, passages protégés, règles des piétons. Sur l''engin, moteur sous les pieds, c''est un véhicule.'
  theme: U
  sous_theme: edpm
  source: 'Code de la route, art. R412-34 II 2°'
- id: aff-u-edpm-gilet-agglo
  contexte: Je rentre en trottinette électrique, de nuit, dans une rue éclairée en agglomération.
  affirmation: Le gilet ou l'équipement rétro-réfléchissant m'est imposé, même en ville.
  verdict: vrai
  pourquoi: 'Le cycliste ne porte le gilet que hors agglomération ; l''utilisateur d''EDPM, lui, doit un gilet ou un équipement rétro-réfléchissant partout, la nuit ou de jour par visibilité insuffisante (35 €).'
  theme: U
  sous_theme: edpm
  source: 'Code de la route, art. R412-43-2 et R431-1-1 ; service-public.fr F308'
# ---------- Motos et cyclomoteurs ----------
- id: aff-u-interfiles-vitesse
  contexte: Je suis motard, en inter-files sur une autoroute saturée ; les deux files avancent à 40 km/h.
  affirmation: Je peux remonter les files à 70 km/h.
  verdict: faux
  pourquoi: 'R412-11-3 : 50 km/h au maximum en inter-files, et 30 km/h dès que l''une des deux files est à l''arrêt. Hors de ces conditions : 135 € et 3 points.'
  theme: U
  sous_theme: motos
  source: 'Code de la route, art. R412-11-3 (décret n° 2025-33)'
- id: aff-u-interfiles-files-gauche
  contexte: Je suis motard sur une autoroute à trois voies, circulation dense en files ininterrompues.
  affirmation: Je ne peux remonter qu'entre les deux files les plus à gauche.
  verdict: vrai
  pourquoi: 'R412-11-3 : l''inter-files se pratique entre les deux voies les plus à gauche de la chaussée, après avoir averti les autres usagers ; je reprends ma place dès qu''une file roule plus vite que moi.'
  theme: U
  sous_theme: motos
  source: 'Code de la route, art. R412-11-3 (décret n° 2025-33)'
- id: aff-u-interfiles-panneau-autos
  contexte: Sur une voie rapide, un panneau « 50 » est surmonté du panonceau « EN INTER-FILES ».
  affirmation: Cette limitation s'applique aussi aux automobilistes quand la circulation est dense.
  verdict: faux
  pourquoi: 'Elle ne vise que les deux-roues circulant en inter-files. Les automobilistes restent soumis à la vitesse normalement autorisée sur leur voie.'
  theme: U
  sous_theme: motos
  source: 'Sécurité routière — Exemples de nouvelles questions (Q16) ; Code de la route, art. R412-11-3'
- id: aff-u-moto-vitesse-approche
  contexte: Je suis motard ; en face, une voiture attend pour tourner à gauche devant moi.
  affirmation: Son conducteur évalue ma vitesse d'approche aussi bien que celle d'une voiture.
  verdict: faux
  pourquoi: 'Un phare unique et une silhouette étroite font paraître la moto plus loin et plus lente qu''elle ne l''est : c''est le mécanisme du « je ne l''ai pas vue arriver si vite ». Je couvre mes freins et je me rends visible.'
  theme: U
  sous_theme: motos
  source: 'securite-routiere.gouv.fr — Être visible à moto'
- id: aff-u-moto-feux-jour
  affirmation: Une moto ou un cyclomoteur doit circuler feux de croisement (ou feux de jour) allumés, même en plein soleil.
  verdict: vrai
  pourquoi: 'R416-17 : l''allumage de jour est imposé aux deux-roues motorisés pour compenser leur faible surface visible. Cela ne suffit pas à les rendre détectables : l''automobiliste doit regarder deux fois.'
  theme: U
  sous_theme: motos
  source: 'Code de la route, art. R416-17 ; securite-routiere.gouv.fr — Être visible à moto'
# ---------- Poids lourds, bus, tramways ----------
- id: aff-u-pl-retroviseur
  contexte: Arrêté au feu à côté d'un camion, je ne distingue pas le visage de son conducteur dans son rétroviseur.
  affirmation: Je dois considérer qu’il peut ne pas me voir.
  verdict: vrai
  pourquoi: 'L’absence de contact visuel m’alerte sur un angle mort. Même si je vois le conducteur, rien ne garantit
    qu’il m’a remarqué : je reste hors de sa trajectoire et évite de me placer à côté.'
  theme: U
  sous_theme: poids_lourds
  source: 'securite-routiere.gouv.fr — Vrai ou faux : les angles morts'
- id: aff-u-pl-voie-gauche
  contexte: Autoroute à trois voies dans mon sens ; un poids lourd rattrape deux véhicules plus lents.
  affirmation: Il peut utiliser la voie de gauche le temps de les dépasser.
  verdict: faux
  pourquoi: 'R412-25 : sur une chaussée à trois voies ou plus dans le même sens, les véhicules de plus de 3,5 t ou de plus de 7 m sont cantonnés aux deux voies de droite. Sur une 2×2 voies, ils peuvent doubler.'
  theme: U
  sous_theme: poids_lourds
  source: 'Code de la route, art. R412-25'
- id: aff-u-bus-hors-agglo
  contexte: Hors agglomération, un autocar met son clignotant gauche pour quitter son arrêt.
  affirmation: Je dois ralentir et, au besoin, m'arrêter pour le laisser repartir.
  verdict: faux
  pourquoi: 'R412-11 ne vaut qu''« en agglomération » : hors agglomération, c''est au car d''attendre un créneau. Je peux lui faciliter le passage, mais il n''a aucune priorité — piège classique de l''épreuve.'
  theme: U
  sous_theme: transports_commun
  source: 'Code de la route, art. R412-11'
# ---------- Véhicules d'intérêt général, convois ----------
- id: aff-u-prioritaire-sans-avertisseur
  contexte: Une voiture de police me suit, sans gyrophare ni sirène.
  affirmation: Elle reste prioritaire et je dois lui céder le passage.
  verdict: faux
  pourquoi: 'R415-12 n''impose de céder qu''aux véhicules d''intérêt général prioritaires « annonçant leur approche » (gyrophare bleu + deux tons). Hors intervention signalée, ils appliquent le code comme tout le monde.'
  theme: U
  sous_theme: vehicules_prioritaires
  source: 'Code de la route, art. R415-12 et R313-27'
- id: aff-u-prioritaire-feu-rouge-radar
  contexte: Je suis arrêté au rouge ; les pompiers annoncent leur approche derrière moi.
  affirmation: Leur sirène suffit à me permettre de traverser tout le carrefour sans vérifier les autres usagers.
  verdict: faux
  pourquoi: Je facilite leur passage en contrôlant la circulation, sans créer un nouveau danger. Ne pas confondre
    dégager prudemment le passage et traverser aveuglément au rouge ; une consigne d’un agent prime.
  theme: U
  sous_theme: vehicules_prioritaires
  source: Code de la route, R415-12 et R411-28
- id: aff-u-prioritaire-route-prioritaire
  contexte: Je circule sur une route à caractère prioritaire ; une ambulance du SAMU arrive de ma droite, gyrophare et deux tons.
  affirmation: Ma priorité de passage l'emporte sur la sienne.
  verdict: faux
  pourquoi: 'R415-12 : on cède le passage « en toutes circonstances » au véhicule d''intérêt général prioritaire qui annonce son approche, même quand on est soi-même prioritaire. Refus : 135 € et 4 points.'
  theme: U
  sous_theme: vehicules_prioritaires
  source: 'Code de la route, art. R415-12'
- id: aff-u-convoi-feu-vert
  contexte: Un convoi exceptionnel engagé dans l'intersection la franchit lentement ; mon feu passe au vert.
  affirmation: Il doit s'arrêter pour me laisser passer.
  verdict: faux
  pourquoi: 'R412-33 : le feu vert n''autorise à s''engager que si un transport exceptionnel ou un de ses véhicules d''accompagnement n''est pas déjà engagé ; la priorité lui appartient alors. J''attends qu''il soit passé.'
  theme: U
  sous_theme: vehicules_lents_animaux
  source: 'Code de la route, art. R412-33 et R433-17'
- id: aff-u-pieton-engage-lent
  contexte: Passage piéton sans feux ; une personne âgée traverse lentement.
  affirmation: Je dois attendre qu'elle ait fini de traverser, puisqu'elle est engagée.
  verdict: vrai
  pourquoi: 'R415-11 : je cède le passage au piéton engagé ou qui manifeste l''intention de traverser, quelle que
    soit sa lenteur ; le contourner ou le presser est une infraction à 6 points.'
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R415-11
