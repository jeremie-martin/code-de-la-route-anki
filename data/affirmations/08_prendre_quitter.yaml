# P — Prendre et quitter son véhicule : affirmations à juger VRAI/FAUX (cf. docs/05-audit-v2.md §2.2).
# Les fausses sont les idées reçues réelles du thème (knowledge-facts « Pièges U et S ») ; le verso donne la raison.
- id: aff-p-reglage-en-roulant
  contexte: Je m'aperçois en roulant que mon rétroviseur droit est mal orienté.
  affirmation: Je le rectifie sans m'arrêter, en gardant un œil sur la route.
  verdict: faux
  pourquoi: "Les réglages du poste de conduite se font véhicule à l'arrêt : chercher la commande détourne le regard et une main. Je m'arrête en sécurité, je règle, puis je repars."
  theme: P
  sous_theme: installation
  source: Code en Poche — Prendre et quitter son véhicule ; REMC
- id: aff-p-retro-interieur-nuit
  contexte: De nuit, les phares du véhicule qui me suit m'éblouissent dans le rétroviseur intérieur.
  affirmation: Je bascule le rétroviseur en position nuit pour atténuer le reflet.
  verdict: vrai
  pourquoi: "La manette sous le miroir incline une seconde surface : l'image s'assombrit sans que je perde la vue de l'arrière. Rabattre le rétroviseur, lui, m'en priverait."
  theme: P
  sous_theme: installation
  source: En Voiture Simone — S'installer ; Codes Rousseau — Les rétroviseurs
- id: aff-p-ceinture-sous-le-bras
  contexte: La sangle d'épaule me gêne au niveau du cou.
  affirmation: Je peux la faire passer sous mon bras pour être plus à l'aise.
  verdict: faux
  pourquoi: "Sous le bras, la sangle n'appuie plus sur le sternum : au choc, le buste part en avant et les côtes cèdent. Je règle plutôt la hauteur du point d'ancrage supérieur."
  theme: P
  sous_theme: installation
  source: securite-routiere.gouv.fr — Comment positionner la ceinture de sécurité
- id: aff-p-ceinture-blouson
  contexte: Je monte en voiture par grand froid, avec une doudoune épaisse.
  affirmation: Cette doudoune réduit l'efficacité de ma ceinture.
  verdict: vrai
  pourquoi: "L'épaisseur laisse du jeu entre la sangle et le corps : au choc, le buste parcourt cette distance avant d'être retenu. Mieux vaut retirer le blouson et bien tendre la sangle."
  theme: P
  sous_theme: installation
  source: securite-routiere.gouv.fr — La ceinture de sécurité
- id: aff-p-volant-bras-croises
  contexte: Je braque fortement pour prendre un virage serré.
  affirmation: Croiser les bras sur le volant me permet de braquer plus vite.
  verdict: faux
  pourquoi: "Bras croisés, je perds de la force, je ne peux plus corriger, et l'airbag me projetterait les avant-bras au visage. Les mains restent de part et d'autre du cerceau."
  theme: P
  sous_theme: installation
  source: REMC ; securite-routiere.gouv.fr — S'installer au poste de conduite
- id: aff-p-pied-gauche-frein
  contexte: Je conduis une voiture à boîte manuelle.
  affirmation: Je peux freiner du pied gauche pour gagner du temps en cas d'urgence.
  verdict: faux
  pourquoi: "En boîte manuelle le pied gauche ne sert qu'à l'embrayage et se repose sur le repose-pied ; le pied droit bascule du talon entre accélérateur et frein, ce qui garantit un appui franc."
  theme: P
  sous_theme: installation
  source: En Voiture Simone — S'installer au poste de conduite
- id: aff-p-quitter-documents
  contexte: Je laisse ma voiture sur un parking pour la journée.
  affirmation: Je laisse le certificat d'immatriculation dans la boîte à gants, sa place est dans le véhicule.
  verdict: faux
  pourquoi: "Les documents du véhicule repartent avec le conducteur : laissés à bord, ils facilitent la revente d'une voiture volée. Objets de valeur hors de vue, vitres fermées, véhicule verrouillé."
  theme: P
  sous_theme: quitter
  source: En Voiture Simone — Précautions pour quitter son véhicule
- id: aff-p-neige-toit
  contexte: Après une nuit de neige, j'ai dégagé le pare-brise et les vitres.
  affirmation: Je dois aussi déneiger le toit avant de partir.
  verdict: vrai
  pourquoi: "Au premier freinage, la plaque glisse sur le pare-brise et m'aveugle ; en roulant, elle s'envole sur ceux qui suivent. Je dégage également les feux et les plaques."
  theme: P
  sous_theme: verifications
  source: Cours de code — Entrer et sortir de son véhicule ; securite-routiere.gouv.fr — Conduire en hiver
- id: aff-p-vehicule-emprunte
  contexte: J'emprunte la voiture d'un proche pour la première fois.
  affirmation: Je vérifie que le gilet est à portée de main et le triangle à bord.
  verdict: vrai
  pourquoi: "Ils sont obligatoires et c'est le conducteur qui est sanctionné, pas le propriétaire. J'en profite pour repérer les commandes (feux, essuie-glaces, détresse) et le niveau de carburant."
  theme: P
  sous_theme: verifications
  source: "Code de la route, art. R416-19 ; Code en Poche — Prendre et quitter son véhicule"
- id: aff-p-entrer-face-circulation
  contexte: Ma voiture est garée le long d'une rue passante, portière conducteur côté chaussée.
  affirmation: Je m'approche face à la circulation pour monter à bord.
  verdict: vrai
  pourquoi: "Faire face aux véhicules qui arrivent permet de les voir venir et d'attendre. J'ouvre peu, je m'installe vite et je ne reste pas debout sur la chaussée."
  theme: P
  sous_theme: verifications
  source: Cours de code — Entrer et sortir de son véhicule en sécurité
- id: aff-p-sortie-stationnement-priorite
  contexte: Je quitte ma place de stationnement le long d'une rue.
  affirmation: Les véhicules qui circulent dans la rue doivent me laisser reprendre ma place dans le trafic.
  verdict: faux
  pourquoi: "C'est moi qui cède le passage : je reprends la circulation après un stationnement, ce qui n'ouvre aucune priorité. J'avertis au clignotant et je m'insère sans forcer (R412-10)."
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R412-10 ; Sécurité routière — Exemples de nouvelles questions (Q14)"
- id: aff-p-portiere-responsabilite
  contexte: J'ouvre ma portière côté chaussée ; un cycliste la heurte.
  affirmation: C'est le cycliste qui est en tort, il devait anticiper l'ouverture.
  verdict: faux
  pourquoi: "R417-7 interdit à tout occupant d'ouvrir une portière quand la manœuvre constitue un danger : la faute est celle de qui ouvre sans avoir contrôlé rétroviseur et angle mort."
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-7 ; securite-routiere.gouv.fr — Portière gauche, main droite"
- id: aff-p-boite-auto-position-p
  contexte: Je stationne dans une rue en pente, avec une boîte automatique.
  affirmation: La position P dispense de serrer le frein de stationnement.
  verdict: faux
  pourquoi: "Le cliquet de la position P n'est qu'un doigt d'acier bloquant la transmission : en pente il encaisse tout le poids du véhicule. Frein de stationnement serré en plus, et roues braquées vers le trottoir en descente."
  theme: P
  sous_theme: quitter
  source: En Voiture Simone — Précautions pour quitter son véhicule ; Codes Rousseau
