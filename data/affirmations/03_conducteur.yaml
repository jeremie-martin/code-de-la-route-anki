- id: aff-c-champ-visuel-vitesse-pieton
  contexte: Je roule vite dans une rue bordée de trottoirs.
  affirmation: Plus ma vitesse est élevée, plus je risque de ne pas voir un piéton qui s'apprête à traverser
    depuis le trottoir.
  verdict: vrai
  pourquoi: À vitesse élevée, l’attention se concentre davantage vers l’avant et laisse moins de temps pour
    explorer les côtés. Réduire l’allure et balayer du regard ; pas de table d’angles garantie pour chaque
    vitesse.
  theme: C
  sous_theme: perception
  source: securite-routiere.gouv.fr — Dépliant La vue ; Conduire sur autoroute
- id: aff-c-vision-peripherique
  affirmation: C'est ma vision périphérique, peu précise, qui me permet de détecter un mouvement sur le côté, comme un piéton qui descend du trottoir.
  verdict: vrai
  pourquoi: 'La vision centrale est précise (lire un panneau) mais étroite ; la vision périphérique est sensible aux mouvements et aux contrastes : elle détecte, la vision centrale identifie ensuite. D''où l''intérêt de balayer du regard.'
  theme: C
  sous_theme: perception
  source: Code en Poche — Le champ visuel ; securite-routiere.gouv.fr — Dépliant La vue
- id: aff-c-nuit-distances
  contexte: Je conduis de nuit.
  affirmation: 'La perception du relief et des contrastes est atténuée : je risque de mal estimer les distances.'
  verdict: vrai
  pourquoi: L’éclairage et les contrastes réduits compliquent la détection et l’estimation des distances. Réduire
    l’allure et augmenter les marges ; ne pas supposer que toutes les erreurs d’estimation vont dans le même
    sens.
  theme: C
  sous_theme: perception
  source: securite-routiere.gouv.fr — Conduire la nuit ; Dépliant La vue
- id: aff-c-regard-obstacle
  affirmation: Fixer du regard un obstacle que je veux éviter augmente le risque de le heurter.
  verdict: vrai
  pourquoi: 'Le véhicule va où le regard se porte : on regarde la trajectoire d''évitement (l''espace libre), pas l''obstacle — ni les phares du véhicule que l''on croise.'
  theme: C
  sous_theme: perception
  source: REMC ; Codes Rousseau — L'exploration visuelle
- id: aff-c-temps-reaction-vitesse
  affirmation: Si je roule deux fois plus vite, mon temps de réaction est deux fois plus long.
  verdict: faux
  pourquoi: 'Le temps de réaction dépend de moi (attention, fatigue, alcool), pas de la vitesse : environ une seconde.
    Ce qui double, c''est la distance parcourue pendant ce temps : ~14 m à 50 km/h, ~28 m à 100 km/h.'
  theme: C
  sous_theme: distances
  source: Code en Poche — Temps de réaction ; securite-routiere.gouv.fr — La vitesse et la conduite
- id: aff-c-reaction-vehicule-ralentit
  affirmation: Pendant mon temps de réaction, la voiture a déjà commencé à ralentir.
  verdict: faux
  pourquoi: 'Tant que je n''ai pas freiné, la voiture garde sa vitesse : la distance de réaction s''ajoute entièrement
    à la distance de freinage. Distance d''arrêt = réaction + freinage.'
  theme: C
  sous_theme: distances
  source: En Voiture Simone — Temps de réaction ; securite-routiere.gouv.fr — La vitesse et la conduite
- id: aff-c-vitesse-double-freinage-double
  affirmation: Si je double ma vitesse, ma distance de freinage double aussi.
  verdict: faux
  pourquoi: 'Sous ces hypothèses, doubler la vitesse multiplie la distance de freinage par quatre. La réaction
    est une autre composante : ne pas appliquer ce facteur à toute la distance d’arrêt.'
  theme: C
  sous_theme: distances
  source: securite-routiere.gouv.fr — La vitesse et la conduite ; Ornikar — Énergie cinétique
  contexte: 'Modèle simplifié : même adhérence et même décélération de freinage.'
- id: aff-c-pieton-detectable-motard
  contexte: Je suis piéton. Une moto arrive près du passage où je veux traverser.
  affirmation: Si je vois le motard, je peux présumer qu’il m’a déjà repéré.
  verdict: faux
  pourquoi: 'La visibilité réciproque n’est pas garantie : masque, angle mort ou attention ailleurs. Je m’assure
    que le véhicule ralentit et peut s’arrêter avant de traverser. Ni le type de véhicule ni le regard apparent
    ne prouvent que j’ai été vu.'
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q11)
- id: aff-c-enfant-percoit-adulte
  affirmation: Un enfant perçoit les dangers de la circulation de la même façon qu'un adulte.
  verdict: faux
  pourquoi: La petite taille masque l’enfant et limite sa vue. Son attention et son estimation des vitesses
    sont encore en développement. Je ralentis et anticipe un mouvement imprévu, sans supposer un âge exact
    de maîtrise.
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q3) ; securite-routiere.gouv.fr — Enfants piétons
- id: aff-c-enfant-croit-vu
  affirmation: Un enfant qui voit ma voiture peut croire que je l’ai vu lui aussi.
  verdict: vrai
  pourquoi: 'Voir ne signifie pas être vu. J’anticipe une traversée imprévue et je réduis l’allure : je ne
    peux pas compter sur l’enfant pour vérifier que je l’ai repéré.'
  theme: C
  sous_theme: vigilance
  source: securite-routiere.gouv.fr — Enfants piétons ; REMC
- id: aff-c-indice-danger-certain
  affirmation: 'Je ne ralentis que lorsque le danger est certain : un simple indice, comme un ballon ou une
    portière entrouverte, ne justifie pas de lever le pied.'
  verdict: faux
  pourquoi: 'Un indice permet d''anticiper avant de voir le danger : un ballon annonce un enfant, une portière entrouverte
    un occupant qui descend. J''adapte l''allure à ce que la scène ne permet pas d''exclure.'
  theme: C
  sous_theme: vigilance
  source: Code en Poche — Anticiper ; REMC
- id: aff-c-klaxon-ecole
  contexte: Je passe devant une école à l'heure de la sortie.
  affirmation: Je klaxonne pour prévenir les enfants de mon arrivée.
  verdict: faux
  pourquoi: 'Le klaxon est interdit en agglomération hors danger immédiat (R416-1) et peut faire sursauter un enfant. La réponse attendue : je ralentis fortement et je me tiens prêt à m''arrêter.'
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R416-1 ; securite-routiere.gouv.fr — Enfants piétons
- id: aff-c-retros-suffisent
  affirmation: 'Mes rétroviseurs sont bien réglés : ils me suffisent pour changer de voie en sécurité.'
  verdict: faux
  pourquoi: 'Ils ne montrent pas l''angle mort, où un deux-roues tient entièrement. Avant de se déporter, un regard direct par-dessus l''épaule du côté de la manœuvre est indispensable ; s''il y a quelqu''un, on ne commence pas.'
  theme: C
  sous_theme: vigilance
  source: Codeclic — L'angle mort ; securite-routiere.gouv.fr — Les angles morts
- id: aff-c-pause-sans-signe
  contexte: Long trajet sur autoroute, je me sens en forme.
  affirmation: Une pause s'impose toutes les deux heures, même sans signe de fatigue.
  verdict: vrai
  pourquoi: Les pauses régulières préviennent l’accumulation de fatigue. La recommandation est une pause au
    moins toutes les deux heures, et plus tôt dès les signes de fatigue. Aucun temps de réaction fixe ne découle
    automatiquement de deux heures de conduite.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite ; En Voiture Simone — Fatigue
- id: aff-c-micro-sommeil
  affirmation: Un micro-sommeil de quelques secondes suffit à provoquer un accident mortel sur autoroute.
  verdict: vrai
  pourquoi: À 130 km/h, quatre secondes représentent environ 144 m parcourus sans surveillance. Il suffit de
    quelques instants pour sortir de sa voie ou manquer un obstacle ; s’arrêter pour dormir dès les signes
    de somnolence.
  theme: C
  sous_theme: deficiences
  source: Sécurité routière — https://www.securite-routiere.gouv.fr/sites/default/files/2023-05/sets_fatigue.pdf
- id: aff-c-repas-copieux
  affirmation: Un repas copieux avant de reprendre la route favorise la somnolence.
  verdict: vrai
  pourquoi: 'Repas copieux, alcool, dette de sommeil, chaleur et médicaments aggravent la somnolence, surtout en début d''après-midi (13 h-15 h) et entre 2 h et 5 h : repas léger et pause avant de repartir.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite ; Départ en vacances
- id: aff-c-nuit-trafic-fluide
  affirmation: De nuit, le risque d'accident mortel est plus faible que de jour.
  verdict: faux
  pourquoi: La fluidité ne supprime ni visibilité réduite ni somnolence. Il faut adapter l’allure à la distance
    visible et interrompre le trajet si l’on n’est plus en état de conduire, sans déduire le risque du seul
    nombre de véhicules.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Conduire la nuit
- id: aff-c-senior-reaction
  affirmation: Avec l’âge, la réaction et la récupération après éblouissement peuvent devenir plus lentes.
  verdict: vrai
  pourquoi: L’avancée en âge peut modifier vision et réflexes, avec de grandes différences individuelles. Pas
    de délai de récupération universel après un éblouissement ; adapter l’allure, faire contrôler sa vue et
    tenir compte de ses capacités réelles.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Conseils pour les seniors ; Dépliant La vue
- id: aff-c-lunettes-points
  contexte: Mon permis porte la mention 01 (port de verres correcteurs).
  affirmation: Conduire sans mes lunettes me coûte une amende, mais aucun point.
  verdict: faux
  pourquoi: 'Ne pas respecter une restriction d''usage du permis est une contravention de 4e classe : 135 € et 3 points, suspension possible (R221-1-1). La mention 01 conditionne la validité du permis.'
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R221-1-1
- id: aff-c-doses-maison
  affirmation: Le plus souvent, les doses d'alcool servies à la maison sont plus importantes que celles servies dans un bar.
  verdict: vrai
  pourquoi: 'Réponse attendue à l''épreuve : « à la maison ». Au bar, le verre standard est dosé (≈ 10 g d''alcool
    pur) ; chez soi, on sert sans mesure : un verre maison peut en valoir deux ou trois.'
  theme: C
  sous_theme: deficiences
  source: Sécurité routière — Exemples de nouvelles questions (Q17) ; securite-routiere.gouv.fr — L'alcool et la conduite
- id: aff-c-biere-whisky
  affirmation: Un demi de bière fait moins monter mon alcoolémie qu'un verre de whisky servi au bar.
  verdict: faux
  pourquoi: À dose standard, ces boissons apportent des quantités comparables d’alcool pur. La boisson ne rend
    donc pas la conduite sûre ; le taux obtenu varie avec la personne, la dose réellement servie et les conditions.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Santé publique France
- id: aff-c-alcool-sous-seuil
  affirmation: Sous 0,5 g/L, l'alcool n'a pas d'effet sur la conduite.
  verdict: faux
  pourquoi: 'Le seuil légal n’est pas un seuil de sécurité : l’alcool peut altérer l’attention, le jugement
    et les réflexes avant de le dépasser. En probatoire, le seuil interdit est déjà 0,2 g/L. Prévoir un retour
    sans conduire après avoir bu.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; En Voiture Simone — Alcool au volant
- id: aff-c-alcool-jugement
  affirmation: Après deux verres, je reste capable de juger moi-même si je suis en état de conduire.
  verdict: faux
  pourquoi: 'L’alcool dégrade aussi le jugement : se sentir lucide ne prouve pas être apte à conduire. Un nombre
    de verres ni un calcul d’attente ne garantissent d’être sous le seuil ; prévoir un conducteur sobre ou
    un autre retour.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite
- id: aff-c-alcool-eblouissement
  affirmation: L'alcool rend plus sensible à l'éblouissement.
  verdict: vrai
  pourquoi: 'L’alcool peut perturber vision, adaptation à la lumière et coordination. La nuit cumule ces difficultés
    avec une visibilité réduite : rester sous un seuil légal ne supprime pas le risque.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite
- id: aff-c-dernier-verre-depart
  affirmation: 'Aussitôt mon dernier verre bu, mon alcoolémie commence à baisser : mieux vaut partir tout de
    suite.'
  verdict: faux
  pourquoi: Le taux peut encore monter après la dernière absorption, avec un pic moyen vers trente minutes
    à jeun ou une heure au cours d’un repas. Ces repères ne fixent pas une heure sûre de départ.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite
- id: aff-c-cafe-dessoule
  affirmation: Un café serré ou une douche froide accélèrent l'élimination de l'alcool.
  verdict: faux
  pourquoi: Café, douche et sport ne rendent pas l’élimination plus rapide. Les valeurs moyennes par heure
    ne permettent pas de promettre une heure de retour sous le seuil, ni un délai fixe par verre.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Vinci Autoroutes — Idées reçues
- id: aff-c-lendemain-matin
  contexte: Soirée arrosée terminée vers 2 h du matin.
  affirmation: À 8 h, je peux encore être au-dessus de 0,5 g/L.
  verdict: vrai
  pourquoi: Une alcoolémie excessive peut persister après une nuit de sommeil. Les quantités réellement bues
    et l’élimination varient ; dormir n’accélère pas cette élimination. Ne pas présumer être apte à conduire
    au réveil.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Code en Poche — Conduite en état d'ivresse
- id: aff-c-probatoire-un-verre
  contexte: Je suis en permis probatoire.
  affirmation: Un seul verre standard peut suffire à atteindre le seuil d’alcool interdit.
  verdict: vrai
  pourquoi: En probatoire, le seuil interdit commence à 0,2 g/L de sang. L’effet d’un verre varie selon la personne
    ; je ne calcule pas un nombre de verres autorisés. Le choix sûr est zéro alcool.
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R234-1 ; securite-routiere.gouv.fr — L'alcool et la conduite
- id: aff-c-cannabis-veille
  affirmation: Un joint fumé la veille au soir peut encore être détecté par un test salivaire le lendemain
    matin.
  verdict: vrai
  pourquoi: La détection peut persister après disparition des effets ressentis. Le délai varie selon le produit
    et l’usage ; se sentir normal ne rend pas la conduite autorisée. Un résultat de dépistage positif appelle
    une vérification.
  theme: C
  sous_theme: deficiences
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2886
- id: aff-c-medicament-sans-ordonnance
  affirmation: Un médicament acheté sans ordonnance ne peut pas être incompatible avec la conduite.
  verdict: faux
  pourquoi: 'L''automédication (antihistaminiques, antitussifs, antalgiques…) peut porter un pictogramme de niveau 2, voire 3 : vérifier la boîte et la rubrique « conducteurs » de la notice, et ne pas associer à l''alcool.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Les médicaments et la conduite ; ANSM
- id: aff-c-somnifere-soir
  affirmation: Un somnifère pris le soir n'a plus d'effet sur ma conduite le lendemain matin.
  verdict: faux
  pourquoi: 'Somnifères et anxiolytiques (benzodiazépines) ont des effets prolongés : somnolence résiduelle, réflexes ralentis, vision faussée au réveil ; ils portent un pictogramme de niveau 2 ou 3. Vérifier la notice avant de conduire.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Les médicaments et la conduite ; Vidal — Médicaments et conduite
- id: aff-c-medicament-alcool
  affirmation: Associer un médicament de niveau 1 (pictogramme jaune) à un verre d'alcool peut rendre la conduite dangereuse.
  verdict: vrai
  pourquoi: 'Alcool et médicaments additionnent leurs effets (somnolence, temps de réaction) : un traitement compatible avec la conduite quand il est pris seul peut devenir incompatible avec de l''alcool — de même avec le cannabis.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Les médicaments et la conduite ; Code en Poche — Médicaments
- id: aff-c-mains-libres-passager
  affirmation: Téléphoner avec le kit mains-libres intégré au véhicule est aussi peu risqué que discuter avec
    un passager.
  verdict: faux
  pourquoi: La conversation téléphonique mobilise l’attention alors que l’interlocuteur ne voit pas la circulation.
    Le kit intégré évite la tenue en main mais ne supprime pas la distraction. Différer l’appel, même avec
    un dispositif autorisé.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Le téléphone et la conduite
- id: aff-c-oreillette
  affirmation: Je peux téléphoner avec une oreillette Bluetooth, sans tenir le téléphone en main.
  verdict: faux
  pourquoi: 'Le port à l''oreille de tout dispositif émettant du son (oreillette, écouteurs, casque) est interdit au conducteur depuis 2015 : 135 € et 3 points (R412-6-1). Seuls le kit intégré au véhicule et les appareils auditifs sont admis.'
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R412-6-1
- id: aff-c-gps-roulant
  affirmation: En roulant, je peux entrer une adresse dans le GPS, à condition de rester sur ma voie.
  verdict: faux
  pourquoi: 'Quitter la route des yeux 5 s, c''est 70 m parcourus à l''aveugle à 50 km/h. On programme le GPS à l''arrêt et on suit ses consignes vocales en roulant.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — Le téléphone et la conduite ; Ornikar — Vigilance
- id: aff-c-ecran-video
  affirmation: Un écran vidéo en fonctionnement dans mon champ de vision est interdit, même si je ne le manipule pas.
  verdict: vrai
  pourquoi: 'Tout écran en marche dans le champ de vision du conducteur, hors aide à la conduite ou navigation, est interdit : contravention de 5e classe, 3 points et confiscation de l''appareil (R412-6-2).'
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R412-6-2
- id: aff-c-jeune-reflexes
  affirmation: Grâce à leurs meilleurs réflexes, les jeunes conducteurs ont moins d'accidents mortels que la
    moyenne.
  verdict: faux
  pourquoi: De bons réflexes ne compensent pas l’inexpérience ni la surconfiance. Les novices doivent encore
    apprendre à reconnaître les dangers ; vitesse, nuit, substances et pression des passagers peuvent augmenter
    leur risque.
  theme: C
  sous_theme: deficiences
  source: ONISR — Bilan définitif 2024 ; securite-routiere.gouv.fr — Conseils aux conducteurs novices
- id: aff-c-alcool-un-sur-trois
  affirmation: L'alcool est en cause dans près d'un accident mortel sur trois.
  verdict: vrai
  pourquoi: Chiffre de campagne de la Sécurité routière (« près de 30 % ») ; l'ONISR compte 28 % des tués dans un
    accident impliquant un conducteur alcoolisé. Le risque d'être responsable d'un accident mortel est multiplié
    par environ 18 avec un taux illégal.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; ONISR, bilan 2025
- id: aff-c-jeunes-risque-double
  affirmation: Les 18-24 ans ont un risque d'être tués sur la route environ deux fois plus élevé que la moyenne.
  verdict: vrai
  pourquoi: '16 % des tués pour 8 % de la population : inexpérience, nuit, vitesse, alcool et pression du groupe.
    D''où le permis probatoire, ses vitesses réduites et son seuil d''alcool à 0,2 g/L.'
  theme: C
  sous_theme: vigilance
  source: ONISR, bilan 2025 ; securite-routiere.gouv.fr — Conducteurs novices
- id: aff-c-musique-forte
  contexte: Vitres fermées, musique à fort volume.
  affirmation: Je reste capable d'entendre aussi bien une sirène, un klaxon ou un deux-roues qui arrive.
  verdict: faux
  pourquoi: L'ouïe complète la vue pour détecter ce qui n'est pas encore visible (véhicule prioritaire, moto qui
    remonte). Le volume sonore et les écouteurs (interdits) suppriment cette information ; la musique n'est pas
    non plus un remède à la somnolence.
  theme: C
  sous_theme: perception
  source: securite-routiere.gouv.fr — Distracteurs ; Code de la route, art. R412-6-1
- id: aff-c-senior-visite-70
  affirmation: À partir de 70 ans, conserver son permis B impose une visite médicale périodique.
  verdict: faux
  pourquoi: Aucune visite liée à l'âge n'existe pour le permis B en France ; seules certaines affections, restrictions
    ou activités professionnelles imposent un contrôle médical. Chacun doit cependant faire vérifier sa vue et adapter
    sa conduite.
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R221-10 et R226-1 ; service-public F2882
