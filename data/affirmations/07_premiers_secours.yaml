# A : Porter secours : affirmations à juger VRAI/FAUX.
- id: aff-a-dae-formation
  contexte: Une victime est en arrêt cardiaque ; un DAE est accroché au mur du magasin voisin.
  affirmation: Avant d'utiliser un DAE, je dois avoir suivi une formation.
  verdict: faux
  pourquoi: "Depuis 2007, toute personne, même non formée, peut se servir d'un défibrillateur automatisé externe : il s'allume, parle et guide pas à pas. Hésiter fait perdre des minutes décisives."
  theme: A
  sous_theme: secourir
  source: "Sécurité routière, Exemples de nouvelles questions (Q6) ; décret n° 2007-705 ; Croix-Rouge française"
- id: aff-a-pls-avec-casque
  contexte: Après sa chute, un motard est inconscient, allongé sur le dos, et respire normalement. Il se met à vomir.
  affirmation: Je le tourne sur le côté malgré sa chute.
  verdict: vrai
  pourquoi: 'Les vomissements menacent ses voies aériennes : je le tourne sur le côté malgré le traumatisme, en maintenant
    si possible l’axe tête-cou-tronc, avec de l’aide, sans retirer le casque. J’alerte, je suis les consignes des secours
    et je surveille la respiration.'
  theme: A
  sous_theme: secourir
  source: "Sécurité civile, PSC juillet 2026, p. 36–38, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf ; Sécurité routière, secours au motard"
  prerequis:
  - a-traumatisme-respiration
- id: aff-a-compressions-seules
  contexte: La victime ne respire pas ; le bouche-à-bouche me rebute.
  affirmation: Je peux me limiter aux compressions thoraciques en attendant les secours.
  verdict: vrai
  pourquoi: "Des compressions seules, commencées tout de suite et poursuivies sans interruption, valent bien mieux que l'inaction. L'opérateur du 15 guide le rythme au téléphone jusqu'à l'arrivée des secours."
  theme: A
  sous_theme: secourir
  source: "Croix-Rouge française, Arrêt cardiaque"
- id: aff-a-donner-a-boire
  contexte: Un blessé conscient me demande à boire en attendant les secours.
  affirmation: Je peux lui donner un peu d'eau pour le soulager.
  verdict: faux
  pourquoi: Je ne donne rien à boire à un blessé sans consigne des secours. Je le rassure, surveille son état
    et le protège du froid comme de la chaleur, selon les conditions.
  theme: A
  sous_theme: secourir
  source: Sécurité civile, PSC juillet 2026, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf
    ; securite-routiere.gouv.fr, Accident de la route
- id: aff-a-contact-vehicules-accidentes
  contexte: Deux voitures accidentées sont immobilisées au milieu d'un carrefour.
  affirmation: Laisser leur contact mis ne présente pas de risque particulier.
  verdict: faux
  pourquoi: "On coupe le contact des véhicules accidentés : carburant et circuit électrique font un risque d'incendie. Le balisage est assuré par mes propres feux de détresse et par le triangle."
  theme: A
  sous_theme: proteger
  source: "Ornikar, Protéger la zone ; Croix-Rouge française"
- id: aff-a-triangle-autoroute
  contexte: Accident sur autoroute ; poser le triangle m'obligerait à marcher sur les voies de circulation.
  affirmation: Je renonce au triangle et je me mets à l'abri derrière la glissière.
  verdict: vrai
  pourquoi: 'La mise en place du triangle n''est pas exigée quand elle met manifestement en danger la vie du conducteur (arrêté du 30 septembre 2008) : feux de détresse et mise à l''abri priment. Ailleurs, environ 30 m en amont, davantage si nécessaire.'
  theme: A
  sous_theme: proteger
  source: "Code de la route, art. R416-19 ; arrêté du 30 septembre 2008 ; Ornikar, Protéger la zone"
  illustration:
    gen: autoroute_attente
    legende: Sur autoroute, l’abri derrière la glissière passe avant le triangle.
- id: aff-a-18-secours-personne
  contexte: Un conducteur est coincé dans sa voiture après un choc ; il n'y a pas d'incendie.
  affirmation: Le 18 est un bon numéro à composer dans cette situation.
  verdict: vrai
  pourquoi: "Les sapeurs-pompiers assurent aussi le secours à personne et la désincarcération, pas seulement les incendies. Le 15 et le 112 conviennent également : les services se transmettent l'appel."
  theme: A
  sous_theme: alerter
  source: "service-public.fr, Numéros d'urgence ; Croix-Rouge française"
- id: aff-a-rester-sur-place
  contexte: Témoin d'un accident avec blessés, j'ai alerté les secours ; rien ne me menace sur place.
  affirmation: 'Une fois l''alerte donnée, je peux repartir : les secours sont prévenus.'
  verdict: faux
  pourquoi: 'Je reste sur place : joignable pour les secours, je surveille les victimes et je les guide à leur arrivée.
    Un conducteur impliqué doit de toute façon rester et prévenir la police (R231-1).'
  theme: A
  sous_theme: obligations
  source: "Croix-Rouge française, Alerter ; Code de la route, art. R231-1"
- id: aff-a-constat-signature
  contexte: Accrochage sans blessé ; nous sommes d'accord sur les circonstances.
  affirmation: Signer le constat amiable revient à reconnaître ma responsabilité dans l'accident.
  verdict: faux
  pourquoi: "Le constat décrit les faits ; ce sont les assureurs qui répartissent ensuite les responsabilités. En revanche on ne signe pas un constat inexact, et rien ne se modifie après signature."
  theme: A
  sous_theme: obligations
  source: "service-public.fr, Constat amiable"
- id: aff-a-degagement-urgence
  contexte: 'Voiture accidentée : des flammes apparaissent sous le capot. Le conducteur, conscient, ne parvient pas à sortir
    seul ; je peux l’atteindre facilement.'
  affirmation: Je le sors moi-même de la voiture, sans attendre les secours.
  verdict: vrai
  pourquoi: 'Danger réel, immédiat et non contrôlable (incendie), victime qui ne peut s’y soustraire seule et facile à atteindre
    : c’est le cas du dégagement d’urgence, exception à la règle « ne pas déplacer un blessé ». Je l’éloigne vers un lieu
    sûr sans m’exposer moi-même, puis j’alerte.'
  theme: A
  sous_theme: proteger
  source: "Sécurité civile, PSC juillet 2026, Dégagement d’urgence"
- id: aff-a-dae-sans-danger
  contexte: Une victime ne répond pas et ne respire pas normalement ; un témoin apporte un DAE.
  affirmation: Le DAE peut décider qu’aucun choc n’est nécessaire ; je reprends alors immédiatement les compressions.
  verdict: vrai
  pourquoi: 'C’est le DAE qui analyse le rythme et décide du choc : je l’allume dès qu’il arrive, sans retarder la réanimation.
    « Pas de choc conseillé » ne signifie pas que la victime est réanimée : je poursuis les compressions jusqu’à ce que
    le DAE demande de les interrompre ou que les secours prennent le relais.'
  theme: A
  sous_theme: secourir
  source: "Sécurité civile, PSC juillet 2026, p. 26–34, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf"
- id: aff-a-transport-blesse
  contexte: Après un accident, un blessé conscient dit qu’il va bien ; l’hôpital est à dix minutes.
  affirmation: Je l’y conduis moi-même, c’est plus rapide que d’attendre les secours.
  verdict: faux
  pourquoi: 'Je ne transporte pas un blessé : une lésion invisible peut s’aggraver pendant le trajet, sans soins possibles.
    J’alerte, je décris son état et je suis les consignes des secours.'
  theme: A
  sous_theme: secourir
  source: "Sécurité civile, PSC juillet 2026, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf"
