- id: aff-d-probatoire-alcool
  contexte: Je suis en première année de permis probatoire (6 points).
  affirmation: Contrôlé à 0,3 g/L de sang, je risque une amende mais je garde mon permis.
  verdict: faux
  pourquoi: 'En probatoire, le seuil est de 0,2 g/L. À 0,3 g/L, la sanction est de 135 € et 6 points. Si mon capital est de 6 points, je les perds tous : le permis est invalidé et je ne peux pas obtenir de nouveau permis avant 6 mois.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R234-1 et L223-5
- id: aff-d-disque-a-duree
  contexte: Permis B obtenu il y a dix-huit mois en filière classique, sans formation post-permis.
  affirmation: Je peux maintenant retirer le disque « A » de l’arrière de ma voiture.
  verdict: faux
  pourquoi: 'Le disque « A » reste obligatoire pendant tout le délai probatoire : 3 ans dans mon cas (filière classique,
    sans formation post-permis). Il suit la durée du probatoire, pas une durée fixe ; son absence est une contravention
    de 2e classe.'
  theme: D
  sous_theme: permis
  source: Code de la route, art. R413-5 II et III ; L223-1
- id: aff-d-invalidation-capital
  affirmation: Le permis que l'on repasse après une invalidation redémarre avec un capital de 12 points.
  verdict: faux
  pourquoi: Il repart à 6 points, comme un premier permis, et un nouveau délai probatoire s'applique. Le capital de 12 points
    ne se retrouve qu'au terme de ce probatoire, sans aucune infraction avec retrait de points.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 et R223-1
- id: aff-d-recuperation-delai
  contexte: Permis obtenu il y a dix ans. Un excès de vitesse de 25 km/h m'a retiré 2 points ; je n'ai rien commis depuis.
  affirmation: Je retrouve mon capital de 12 points au bout de deux ans.
  verdict: faux
  pourquoi: Il faut trois ans, parce qu'un excès de 20 à 49 km/h est une contravention de 4e classe. Le délai de deux ans
    ne vaut que si toutes les infractions sont des contraventions de 1re à 3e classe.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6 ; service-public.fr F1685
- id: aff-d-velo-points
  contexte: Je me déplace à vélo et je franchis un feu rouge.
  affirmation: Je perds 4 points sur mon permis de conduire.
  verdict: faux
  pourquoi: Aucun retrait de points pour une infraction commise avec un véhicule qui n'exige pas le permis (vélo, trottinette,
    à pied) ; l'amende de 135 €, elle, reste due.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 ; service-public.fr F20443
- id: aff-d-aac-points-eleve
  contexte: 'Conduite accompagnée : l''élève, qui n''a encore aucun permis, commet un excès de vitesse, l''accompagnateur est à côté de lui.'
  affirmation: Les points sont retirés à l'élève, auteur de l'infraction.
  verdict: faux
  pourquoi: Sans permis, l'élève n'a pas de capital de points à perdre ; l'amende reste due. L'accompagnateur répond de
    ses propres manquements (alcool, stupéfiants) et doit rester apte à reprendre la conduite.
  theme: D
  sous_theme: permis
  source: Code de la route, L121-1 et L223-1 ; art. L234-1, L235-1 et L224-1 II
- id: aff-d-clignotant-points
  affirmation: Tourner sans mettre le clignotant se solde par une amende de 35 €, sans retrait de points.
  verdict: faux
  pourquoi: 'L''amende est bien de 35 € (2e classe), mais l''infraction retire 3 points et expose à une suspension. Petite
    amende, gros retrait : c''est un piège classique de l''épreuve.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-10
- id: aff-d-telephone-retention
  contexte: Je suis intercepté pour un excès de vitesse, téléphone tenu en main.
  affirmation: Les forces de l'ordre peuvent retenir mon permis sur place.
  verdict: vrai
  pourquoi: Le téléphone tenu en main cumulé à une autre infraction (vitesse, priorité, feu, ligne continue…) autorise la
    rétention immédiate du permis, puis une suspension préfectorale allant jusqu'à 6 mois.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-6-1, L224-1 et L224-2
  prerequis:
  - d-telephone-sanction
- id: aff-d-video-verbalisation
  affirmation: Je peux quand même recevoir une amende par courrier.
  verdict: vrai
  pourquoi: La vidéo-verbalisation constate sans interception notamment le téléphone tenu en main, le non-port de la ceinture,
    le feu rouge, le STOP et la ligne continue. L’avis arrive par courrier au titulaire de la carte grise.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L121-3 et R130-11 ; securite-routiere.gouv.fr, Contrôle automatisé
  contexte: Je téléphone au volant, téléphone en main ; aucun agent ne m’arrête.
- id: aff-d-alcool-contravention
  affirmation: Contrôlé à 0,9 g/L de sang, je risque une contravention de 135 € et 6 points.
  verdict: faux
  pourquoi: 'À partir de 0,8 g/L (0,40 mg/L d''air expiré), c''est un délit : 6 points, peines de prison et d''amende encourues. Le permis est retenu, puis le préfet doit le suspendre ; le juge peut ensuite le suspendre plus longtemps ou l''annuler. La contravention s''arrête sous 0,8 g/L.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L234-1 et R234-1
- id: aff-d-sans-assurance-points
  affirmation: Conduire sans assurance est un délit, mais ne fait perdre aucun point.
  verdict: vrai
  pourquoi: Le défaut d’assurance expose à une amende délictuelle, à une suspension et à une confiscation, sans retrait
    de points. La responsabilité civile reste obligatoire pour tout véhicule à moteur, même immobilisé.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L324-2 ; Code des assurances, art. L211-1
- id: aff-d-vignette-assurance
  affirmation: Le certificat d'assurance doit rester collé en bas à droite de mon pare-brise.
  verdict: faux
  pourquoi: 'Vignette et carte verte ont disparu le 1er avril 2024 : l''assurance se vérifie dans le fichier des véhicules
    assurés. Seule la vignette Crit''Air se colle encore sur le pare-brise.'
  theme: D
  sous_theme: documents
  source: Décret n° 2023-1152 du 8 décembre 2023 ; service-public.fr F1362
- id: aff-d-plaque-sale
  contexte: Retour d’un chemin boueux ; la plaque arrière est illisible.
  affirmation: Tant que la plaque est en place, sa lisibilité importe peu.
  verdict: faux
  pourquoi: Une plaque sale, masquée ou non conforme est sanctionnée de 135 €, sans retrait de points, avec immobilisation
    possible. Je la nettoie avant de repartir, comme les feux et les vitres.
  theme: D
  sous_theme: documents
  source: Code de la route, art. R317-8
- id: aff-d-ct-defaillance-majeure
  contexte: Mon contrôle technique relève une défaillance majeure.
  affirmation: Je peux continuer à rouler en attendant la contre-visite.
  verdict: vrai
  pourquoi: 'Une défaillance majeure laisse 2 mois pour la contre-visite, véhicule utilisable. C''est la défaillance critique
    qui limite la validité au jour du contrôle : dès le lendemain, le véhicule ne doit plus circuler.'
  theme: D
  sous_theme: documents
  source: service-public.fr F2878 ; arrêté du 18 juin 1991
- id: aff-d-assurance-tiers
  contexte: Je suis responsable d'un accident et je suis assuré au tiers.
  affirmation: Mon assurance prendra en charge la réparation de ma propre voiture.
  verdict: faux
  pourquoi: La responsabilité civile ne couvre que les dommages causés aux autres. Les dégâts de mon véhicule et mes blessures
    relèvent de garanties facultatives (dommages tous accidents, garantie du conducteur).
  theme: D
  sous_theme: documents
  source: Code des assurances, art. L211-1 ; service-public.fr F2655
- id: aff-d-gilet-coffre
  affirmation: Mon gilet de haute visibilité peut être rangé dans le coffre, avec le triangle.
  verdict: faux
  pourquoi: Le gilet doit rester à portée de main dans l'habitacle, pour être enfilé avant de sortir d'un véhicule immobilisé
    sur la chaussée. Seul le triangle peut voyager dans le coffre.
  theme: D
  sous_theme: documents
  source: Code de la route, art. R416-19 ; service-public.fr F19459
