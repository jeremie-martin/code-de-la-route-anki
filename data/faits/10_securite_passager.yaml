- id: s-enfant-chiffres
  explication: 'Exceptions pour l''avant : siège dos à la route avec airbag passager désactivé ; pas de sièges arrière ou
    sièges arrière sans ceinture ; sièges arrière momentanément inutilisables ou tous occupés par des enfants de moins de
    10 ans, chaque enfant restant dans un dispositif adapté. Sanction : 135 € pour le conducteur, sans points. La limite
    légale est l''âge, pas la taille.'
  theme: S
  sous_theme: enfants
  source: Code de la route, art. R412-2 et R412-3 ; règlement ONU R129
  rappels:
  - Sauf exceptions prévues, un enfant de moins de {{c1::10 ans}} voyage à l’arrière dans un dispositif homologué
    adapté à sa morphologie.
  - Avec un siège i-Size homologué R129, la position dos à la route s’impose au moins jusqu’à {{c2::15 mois}}.
  - Un enfant de moins de {{c3::3 ans}} ne peut pas être transporté sur un siège dépourvu de ceinture de sécurité.
- id: s-chargement-chiffres
  explication: Aucun dépassement à l’avant. Mesurer le véhicule chargé ; vérifier aussi le gabarit des ponts et parkings,
    et arrimer le chargement.
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R312-19 à R312-21 ; arrêté du 16 juillet 1954 (signalisation des chargements)
  rappels:
  - Le dépassement maximal du chargement à l’arrière est {{c1::3 m}}.
  - Un chargement dépassant de plus de {{c2::1 m}} à l’arrière doit porter une signalisation spécifique.
  illustration:
    gen: chargement_arriere
    params:
      depasse: 2
      limites: true
    legende: Au-delà de 1 m, l’extrémité est signalée ; jamais plus de 3 m.
- id: s-remorque-chiffres
  prerequis: [d-masses-definitions]
  explication: 'Toujours respecter les capacités du véhicule tracteur (masse remorquable, PTRA). Au-delà de 4 250 kg de somme des PTAC : permis BE. Une remorque de plus de 500 kg de PTAC a sa propre carte grise.'
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R221-4, R317-8, R413-8 ; service-public.fr F2827
  rappels:
  - Avec le permis B, une remorque de PTAC au plus égal à {{c1::750 kg}} est autorisée derrière un véhicule de catégorie
    B, sous réserve des masses admissibles du véhicule.
  - Avec le permis B seul, si la remorque dépasse ce seuil de PTAC, la somme des PTAC ne doit pas dépasser {{c2::3 500 kg}}.
  - 'Remorque au-delà de ce seuil, somme des PTAC dépassant la limite du permis B seul sans excéder 4 250 kg : le permis
    B suffit après la formation {{c3::B96}} (7 heures, sans examen).'
