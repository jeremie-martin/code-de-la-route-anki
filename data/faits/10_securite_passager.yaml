- id: s-enfant-chiffres
  texte: Un enfant de moins de {{c1::10 ans}} voyage dans un dispositif de retenue homologué adapté, à l'arrière ; avec un siège homologué i-Size (R129), l'enfant voyage dos à la route jusqu'à {{c2::15 mois}} au moins ; un enfant de moins de {{c3::3 ans}} ne peut pas voyager sur un siège sans ceinture.
  explication: 'Exceptions pour l''avant : siège dos à la route avec airbag passager désactivé, absence de sièges arrière ou sièges arrière tous occupés par des enfants de moins de 10 ans. Sanction : 135 € pour le conducteur, sans points. La limite légale est l''âge, pas la taille.'
  theme: S
  sous_theme: enfants
  source: Code de la route, art. R412-2 et R412-3 ; règlement ONU R129
- id: s-chargement-chiffres
  texte: 'Chargement : aucun dépassement à l''{{c1::avant}} ; jusqu''à {{c2::3 m}} de dépassement à l''arrière, signalé (dispositif réfléchissant, feu rouge la nuit) dès qu''il dépasse de plus de {{c3::1 m}} ; largeur totale maximale {{c4::2,55 m}}.'
  explication: 'Pas de limite générale de hauteur pour une voiture (ponts et parkings signalés). Arrimage défaillant : 68 € et immobilisation ; dépassement arrière excessif : 135 €.'
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R312-19 à R312-22
- id: s-remorque-chiffres
  texte: 'Avec le permis B : remorque de PTAC ≤ {{c1::750 kg}} sans condition ; au-delà si la somme des PTAC ≤ {{c2::3 500 kg}} ; formation B96 (7 h) jusqu''à {{c3::4 250 kg}} ; permis BE au-delà. Une remorque de plus de {{c4::500 kg}} de PTAC a sa propre carte grise et sa propre plaque.'
  explication: Au-delà de 750 kg, la remorque doit être freinée. Le poids réel de la remorque ne doit pas dépasser 1,3 fois celui du véhicule tracteur. Vitesses réduites (90/80/80) seulement si l'ensemble dépasse 3,5 t.
  theme: S
  sous_theme: chargement
  importance: utile
  source: Code de la route, art. R221-4, R317-8, R413-8 ; service-public.fr F2827
- id: s-airbag-chiffres
  texte: Pour que l'airbag protège sans blesser, le conducteur garde au moins {{c1::25 cm}} environ entre son sternum et le volant ; l'airbag se déploie en quelques dizaines de {{c2::millisecondes}} et ne se déclenche qu'une fois (à remplacer, comme les prétensionneurs de ceinture, après un choc).
  explication: 'Il complète la ceinture et ne la remplace jamais. Siège dos à la route devant un airbag frontal activé : interdit (135 €).'
  theme: S
  sous_theme: passagers
  source: securite-routiere.gouv.fr — Airbags ; Code de la route, art. R412-3
- id: s-ceinture-efficacite
  texte: La ceinture divise par {{c1::2 à 3}} le risque d'être tué ; environ {{c2::1 occupant tué sur 5}} ne la portait pas ; un choc peut être mortel sans ceinture dès {{c3::20 km/h}}.
  explication: À 50 km/h, un adulte de 75 kg non attaché est projeté avec une force d'environ 2,5 tonnes ; un enfant de 20 kg devient un projectile d'une demi-tonne. Obligatoire à toutes les places depuis le 1er octobre 1990.
  theme: S
  sous_theme: passagers
  source: securite-routiere.gouv.fr — La ceinture de sécurité ; dépliant ceinture 2022 (données 2021)
