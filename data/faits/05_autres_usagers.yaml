# Thème U — Les autres usagers : chiffres à connaître
- id: u-edpm-chiffres
  texte: "Trottinette électrique (EDPM) : âge minimum {{c1::14 ans}} (depuis le 1er septembre 2023), vitesse maximale par construction {{c2::25 km/h}}, {{c3::une seule}} personne à bord, trottoir interdit, assurance obligatoire."
  explication: "Passager, trottoir ou écouteurs : 135 € ; engin débridé : jusqu'à 1 500 €. Gilet réfléchissant obligatoire la nuit, casque recommandé (obligatoire hors agglomération sur les routes autorisées). Avant septembre 2023 : 12 ans."
  theme: U
  sous_theme: edpm
  tags: [nouveau::2023]
  source: "Code de la route, art. R412-43-1 à R412-43-3 ; décret n° 2023-848"
- id: u-velo-chiffres
  texte: "À vélo : casque obligatoire pour les moins de {{c1::12 ans}} ; gilet réfléchissant obligatoire hors agglomération {{c2::la nuit}} ; un enfant de moins de {{c3::8 ans}} peut rouler sur le trottoir au pas ; jamais plus de {{c4::deux}} de front."
  explication: "En file simple dès la chute du jour ou quand un véhicule annonce son dépassement. Pas de retrait de points à vélo, mais les amendes s'appliquent. Un VAE (≤ 250 W, assistance coupée à 25 km/h) reste un vélo."
  theme: U
  sous_theme: cyclistes
  source: "Code de la route, art. R431-1-1, R431-1-3, R412-34, R431-7"
- id: u-velo-equipement-chiffres
  texte: "Équipement obligatoire d'un vélo : {{c1::deux}} freins, un feu avant {{c2::blanc ou jaune}} et un feu arrière {{c3::rouge}} (la nuit ou par visibilité insuffisante), des catadioptres (orange sur les côtés et les pédales) et un avertisseur audible à {{c4::50 m}}."
  explication: "Défaut d'éclairage ou d'équipement : 11 €. Les catadioptres, eux, sont exigés en permanence : ce sont eux qui font voir le vélo de côté dans les phares d'une voiture qui débouche."
  theme: U
  sous_theme: cyclistes
  importance: utile
  source: "Code de la route, art. R313-4 et s. ; securite-routiere.gouv.fr — Équipements obligatoires vélo"
- id: u-interfiles-chiffres
  texte: "Circulation inter-files des motos (généralisée le 11 janvier 2025) : uniquement sur autoroutes et routes à chaussées séparées limitées à {{c1::70 km/h}} ou plus, en circulation dense, entre les deux files les plus à gauche, à {{c2::50 km/h}} maximum ({{c3::30 km/h}} si une file est arrêtée)."
  explication: "Interdit de dépasser un autre deux-roues en inter-files, interdit par neige, verglas ou travaux. Infraction : 135 €, 3 points. L'automobiliste reste dans sa file et vérifie ses angles morts avant de se décaler."
  theme: U
  sous_theme: motos
  tags: [nouveau::2025]
  source: "Code de la route, art. R412-11-3 (décret n° 2025-33)"
- id: u-moto-equipements-chiffres
  texte: "À moto ou en cyclomoteur : casque homologué attaché (conducteur : 135 € et {{c1::3 points}}), {{c2::gants}} certifiés CE obligatoires depuis 2016 (conducteur et passager), et un gilet de haute visibilité {{c3::à bord}}, à revêtir en cas d'arrêt d'urgence."
  explication: "Un cyclomoteur (≤ 50 cm³, 45 km/h) se conduit dès 14 ans avec le permis AM ; une 125 cm³ avec le permis A1, ou le permis B depuis 2 ans + 7 h de formation."
  theme: U
  sous_theme: motos
  source: "Code de la route, art. R431-1, R431-1-2, R416-17, R416-19"
- id: u-motos-mortalite
  texte: "Les deux-roues motorisés représentent moins de {{c1::2 %}} du trafic mais environ un tué sur cinq ; à moto, le risque d'être tué par kilomètre parcouru est environ {{c2::27 fois}} celui d'une voiture."
  explication: "Chiffre de campagne Sécurité routière (× 27) ; les autres sources donnent 20 à 30 fois. Pas de carrosserie, pas de ceinture, pas d'airbag : la moindre chute se paie comptant, et plus d'un blessé sur deux est touché à la tête."
  theme: U
  sous_theme: motos
  importance: utile
  source: "ONISR 2025 ; securite-routiere.gouv.fr — 27 fois plus de risques"
- id: u-pietons-mortalite
  texte: "Plus de la {{c1::moitié}} des piétons tués ont 65 ans ou plus, et environ {{c2::deux tiers}} des piétons tués le sont en agglomération."
  explication: "D'où le refus de priorité à un piéton porté à 6 points en 2018. Les seniors traversent lentement et évaluent mal les vitesses ; en ville, c'est la vitesse qui fait la gravité du choc."
  theme: U
  sous_theme: pietons
  importance: utile
  source: "ONISR 2025 (bilan définitif, p. 17-18)"
- id: u-pl-angles-morts-chiffres
  texte: "Un poids lourd a {{c1::4}} zones d'angle mort (devant, derrière, les deux côtés — surtout à droite) ; depuis 2021, les véhicules de plus de {{c2::3,5 t}} portent des autocollants « angles morts » ; hors agglomération, deux poids lourds qui se suivent gardent au moins {{c3::50 m}}."
  explication: "Les autocollants sont apposés sur les côtés et à l'arrière du véhicule (R313-32-1). Un camion qui tourne à droite se déporte d'abord à gauche : ne jamais se glisser dans l'espace qu'il semble libérer."
  theme: U
  sous_theme: poids_lourds
  source: "securite-routiere.gouv.fr — Angles morts ; Code de la route, art. R313-32-1 et R412-12"
