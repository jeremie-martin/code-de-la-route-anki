- id: u-edpm-chiffres
  explication: Assurance de responsabilité civile obligatoire ; casque recommandé (obligatoire sur une route ouverte par
    autorisation locale hors agglomération).
  theme: U
  sous_theme: edpm
  source: Code de la route, art. R412-43-1 à R412-43-3 ; décret n° 2023-848
  rappels:
  - 'Âge minimal national pour conduire une trottinette électrique : {{c1::14 ans}}.'
  - 'Vitesse maximale par construction d’une trottinette électrique : {{c2::25 km/h}}.'
  - 'Sur une trottinette électrique, nombre de personnes autorisées à bord : {{c3::une seule}}.'
- id: u-velo-chiffres
  explication: En agglomération, le gilet n'est pas imposé au cycliste, alors que l'utilisateur d'une trottinette électrique
    porte la nuit un gilet ou un équipement rétroréfléchissant. Le casque reste recommandé pour tous ; l'adulte qui transporte
    un enfant non casqué, ou qui accompagne un enfant cycliste dont il a la charge, est verbalisé (135 €).
  theme: U
  sous_theme: cyclistes
  source: Code de la route, art. R431-1-1, R431-1-3, R412-34, R431-7
  rappels:
  - À vélo, le casque attaché est obligatoire pour un conducteur ou passager de moins de {{c1::12 ans}}.
  - À vélo, le gilet de haute visibilité est obligatoire la nuit ou par visibilité insuffisante {{c2::hors agglomération}}.
- id: u-velo-equipement-chiffres
  explication: 'Équipement permanent : deux freins, des catadioptres (arrière rouge, avant blanc, orange sur les côtés et
    les pédales) et un avertisseur sonore. Un catadioptre ne renvoie que la lumière des phares qui l’éclairent : hors de
    ce faisceau, il ne signale rien.'
  theme: U
  sous_theme: cyclistes
  source: "Code de la route, art. R313-4 et s. ; securite-routiere.gouv.fr, Équipements obligatoires vélo"
  rappels:
  - 'De nuit ou par visibilité insuffisante, les catadioptres ne suffisent pas : un vélo doit avoir {{c1::un feu avant (blanc
    ou jaune) et un feu arrière rouge}} allumés.'
- id: u-interfiles-chiffres
  explication: Files ininterrompues sur toutes les voies ; motos et tricycles L3e/L5e d’au plus 1 m de large, entre les deux
    voies les plus à gauche. Pas de neige, verglas ou travaux sur la chaussée ; espace suffisant. La limitation locale plus
    basse ne suffit pas à exclure l’inter-files.
  theme: U
  sous_theme: motos
  source: "Code de la route, R412-11-3, https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000050963583/"
  rappels:
  - L'inter-files est réglementée sur les autoroutes et routes à chaussées séparées (au moins deux voies par sens) normalement
    limitées à {{c1::70 km/h}} ou plus.
  - 'Lorsque toutes les conditions de l''inter-files sont réunies et qu''aucune des deux files n''est arrêtée, vitesse maximale
    de la moto en inter-files : {{c2::50 km/h}}.'
  - 'En inter-files, dès qu''une des deux files est arrêtée, vitesse maximale : {{c3::30 km/h}}.'
- id: u-moto-equipements-chiffres
  explication: Un gilet de haute visibilité doit être à bord, à revêtir en cas d’arrêt d’urgence.
  theme: U
  sous_theme: motos
  source: Code de la route, art. R431-1, R431-1-2, R416-17, R416-19
  rappels:
  - 'Conduire un deux-roues motorisé sans casque homologué attaché : 135 € et {{c1::3 points}}.'
  - Depuis 2016, des {{c2::gants}} certifiés CE sont obligatoires à moto et en cyclomoteur, pour le conducteur et le passager.
- id: u-pl-angles-morts-chiffres
  texte: Depuis 2021, les véhicules de plus de {{c1::3,5 t}} portent des autocollants « angles morts » sur les côtés et à
    l’arrière.
  explication: 'Ils rappellent de ne pas s’attarder dans ces zones, surtout à droite de la cabine. Leur absence ne prouve
    pas l’absence d’angle mort : une camionnette en a aussi.'
  theme: U
  sous_theme: poids_lourds
  source: "securite-routiere.gouv.fr, Angles morts ; Code de la route, art. R313-32-1 et R412-12"
- id: u-pl-vitesses-chiffres
  theme: U
  sous_theme: poids_lourds
  rappels:
  - Sur autoroute, hors limitation plus basse, un camion de marchandises de plus de 3,5 t est limité à {{c1::90 km/h}}.
  - Sur une route ordinaire hors agglomération, à une voie par sens et sans limitation plus basse,
    un camion rigide de 7,5 t sans remorque est limité à {{c2::80 km/h}}.
  explication: 'Ne pas généraliser le 80 : sur une route non prioritaire, un véhicule articulé ou avec remorque
    de plus de 12 t est limité à 60 km/h. Sur une route prioritaire à chaussées séparées par terre-plein central,
    le plafond est de 90 km/h jusqu’à 12 t. Ces limites différentes peuvent expliquer l’allure du véhicule devant moi ;
    elles ne garantissent pas qu’un dépassement soit possible.'
  source: 'Code de la route, art. R413-8, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028436426'
