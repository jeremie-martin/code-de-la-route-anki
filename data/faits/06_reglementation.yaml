- id: d-points-capital
  explication: Le capital de 6 points s'applique au premier permis et à tout permis obtenu après invalidation ou annulation.
    Ajouter une catégorie (moto) à un permis ancien ne fait pas repasser en probatoire.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 et R223-1
  rappels:
  - Le capital maximal ordinaire du permis de conduire est {{c1::12 points}}.
  - Un premier permis probatoire démarre avec {{c2::6 points}}.
- id: d-probatoire-duree
  explication: 'La progression est donc 6 → 8 → 10 → 12 en filière classique et 6 → 9 → 12 après AAC ; une seule infraction
    avec retrait de points l''interrompt. Pendant le probatoire : disque A à l''arrière, vitesses réduites (110/100/80), alcool
    0,2 g/L.'
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 et R223-1 ; service-public.fr F2390
  rappels:
  - Sans formation complémentaire post-permis ni conduite accompagnée (AAC), le délai probatoire ordinaire dure {{c1::3
    ans}}.
  - Après une conduite accompagnée (AAC), sans formation post-permis, le délai probatoire ordinaire dure {{c2::2 ans}}.
  - Sans infraction avec retrait de points, en filière classique, le capital probatoire augmente normalement de {{c3::2 points}}
    par année.
  - Sans infraction avec retrait de points, après une conduite accompagnée (AAC), le capital probatoire augmente normalement
    de {{c4::3 points}} par année.
- id: d-formation-post-permis
  texte: La formation complémentaire « post-permis » (une journée, entre le 6e et le 12e mois) ramène le délai probatoire
    de 3 ans à {{c1::2 ans}}.
  explication: 'Après AAC, elle le ramène de 2 ans à 1 an et 6 mois. Volontaire, dans une école labellisée, réservée au premier permis, sans infraction avec retrait de points ni suspension ou restriction du droit de conduire. Avec elle : 12 points après 2 ans au lieu de 3.'
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 ; arrêté d'application de la formation complémentaire (R223-4-1 II et III abrogés par le décret n° 2025-1437) ; service-public.fr F2390
- id: d-points-delit-cumul
  texte: Pour plusieurs infractions constatées en même temps, le retrait de points est plafonné à {{c1::8 points}} ; seul
    le cumul alcool + stupéfiants peut en retirer 9.
  theme: D
  sous_theme: points
  source: "Code de la route, L223-2, L235-1 ; Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F31551"
- id: d-probatoire-3-points
  texte: En permis probatoire, une infraction retirant au moins {{c1::3 points}} entraîne l’obligation de suivre un stage
    de sensibilisation.
  explication: Le stage, à suivre dans les 4 mois, rend jusqu’à 4 points dans la limite du capital. L’amende est remboursée
    (ou n’est plus recouvrée) sur demande envoyée dans les 15 jours ouvrables après le stage ; passé ce délai, la demande
    est rejetée.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6, R223-4, R223-8 (décret 2025-1437), L223-5
- id: d-invalidation-delai
  texte: Après une invalidation pour solde de points nul, il est interdit d’obtenir un nouveau permis pendant {{c1::6 mois}}
    (1 an en cas de nouvelle invalidation dans les cinq ans).
  explication: Le permis est à remettre sous 10 jours ; examens médical et psychotechnique sont requis.
  theme: D
  sous_theme: points
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F1704"
- id: d-recuperation-points
  explication: 'Piège : la plupart des infractions courantes (téléphone, ceinture, feu rouge, excès de 20 à 49 km/h, et
    tout excès de moins de 50 km/h là où la limite est de 50 km/h ou moins) sont de 4e classe → c’est souvent 3 ans ; un
    excès de 50 km/h ou plus est un délit, 3 ans aussi. Pendant le probatoire, le capital se reconstitue surtout par la
    majoration annuelle (sans infraction) ou par un stage.'
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6 ; service-public.fr F1685
  rappels:
  - Après le retrait d’un seul point, le délai de récupération sans nouvelle infraction donnant lieu à retrait est {{c1::6
    mois}}.
  - 'Hors règles particulières du probatoire, reconstitution des 12 points après seules contraventions des classes 1 à 3 :
    {{c2::2 ans}} sans nouvelle infraction donnant lieu à retrait.'
  - 'Hors règles particulières du probatoire, reconstitution des 12 points si une infraction est de classe 4 ou 5 ou un délit
    : {{c3::3 ans}} sans nouvelle infraction donnant lieu à retrait.'
- id: d-stage-points
  explication: Les points sont crédités le lendemain du dernier jour de stage.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6 et R223-8 ; service-public.fr F14208
  rappels:
  - Un stage volontaire de sensibilisation (2 jours consécutifs) permet de récupérer jusqu’à {{c1::4 points}}, dans la limite
    du capital.
  - Le stage volontaire de récupération de points est possible au plus {{c2::une fois par an}} (date à date), permis encore
    valide.
- id: d-aac-conditions
  explication: 'Avantages : taux de réussite plus élevé, probatoire réduit à 2 ans, assurance moins chère. Conduite à l’étranger
    interdite pendant l’AAC.'
  theme: D
  sous_theme: permis
  source: Code de la route, art. R211-3 et R211-5 ; service-public.fr F2826
  rappels:
  - L’apprentissage anticipé de la conduite (AAC) est possible dès {{c1::15 ans}}.
  - En AAC, après la formation initiale, la conduite accompagnée dure au moins {{c2::1 an et 3 000 km}}, avec deux
    rendez-vous pédagogiques.
- id: d-permis-17-ans
  texte: En France, le permis B peut être obtenu et utilisé pour conduire seul dès {{c1::17 ans}}.
  explication: Règle applicable depuis le 1er janvier 2024. Le délai probatoire, ses vitesses réduites et le seuil de 0,2
    g/L s’appliquent normalement.
  theme: D
  sous_theme: permis
  source: Décret n° 2023-1214 du 20 décembre 2023 ; Code de la route, art. R221-5
- id: d-permis-validite-15-ans
  texte: Le titre de permis de conduire de catégorie B a une durée de validité administrative de {{c1::15 ans}}
    ; son renouvellement ne comporte ni examen ni visite médicale.
  explication: Le renouvellement se demande en ligne ; il ne remet pas en cause le droit de conduire, qui dépend
    des points et des restrictions. Les catégories poids lourds ont une validité de cinq ans.
  theme: D
  sous_theme: permis
  source: Code de la route, art. R221-1-1
- id: d-accompagnateur
  explication: L'accompagnateur répond de ses propres manquements et doit rester apte à reprendre la conduite. Il est personnellement
    soumis aux règles sur l'alcool et les stupéfiants (rétention possible de son permis, L224-1 II).
  theme: D
  sous_theme: permis
  source: Code de la route, R211-3 et R234-1 ; Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2826
    ; art. L234-1, L235-1 et L224-1 II
  rappels:
  - Pour accompagner un élève, il faut notamment le permis B depuis {{c1::5 ans}} sans interruption.
  - Pour accompagner un élève, il faut l’accord de {{c2::l’assureur}} du véhicule pour cet apprentissage.
- id: d-telephone-sanction
  texte: 'Téléphone tenu en main, oreillette, écouteurs ou casque audio au volant : 135 € et {{c1::3 points}}.'
  explication: Un système intégré qui n’est ni tenu en main ni porté à l’oreille reste autorisé, mais la conversation distrait
    quand même.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-6-1, R412-6-2, L224-1 et L224-2
- id: d-ceinture-sanction
  explication: 'Passager majeur non attaché : 135 € pour lui, sans point. Passager mineur ou enfant mal retenu : 135 € pour le conducteur, sans point (R412-2).'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-1 et R412-2
  texte: 'Conducteur non attaché : 135 € et {{c1::3 points}}.'
- id: d-feu-rouge-stop-sanction
  explication: La priorité piéton est passée de 4 à 6 points le 19 septembre 2018. Suspension possible jusqu'à 3 ans pour
    le feu rouge, le STOP et la priorité.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-30, R412-31, R415-5 à R415-11
  rappels:
  - 'Franchir un feu rouge, un STOP ou refuser une priorité (cédez-le-passage, priorité à droite, giratoire) : 135 € et {{c1::4
    points}}.'
  - 'Refuser la priorité à un piéton : 135 € et {{c2::6 points}}.'
  - 'Ne pas s’arrêter à un feu jaune fixe alors que c’était possible : {{c3::35 €}}, sans retrait de points.'
- id: d-vitesse-bareme
  explication: Le retrait pour les excès de moins de 5 km/h a été supprimé le 1er janvier 2024 ; l’amende reste. Les excès
    portent sur la vitesse retenue, après la marge propre au dispositif de contrôle.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R413-14 ; décret n° 2023-1150 du 6 décembre 2023
  rappels:
  - 'Retrait de points selon l’excès de vitesse retenu : moins de 5 km/h, {{c1::0 point}} ; de 5 à 19 km/h, {{c1::1 point}}
    ; de 20 à 29 km/h, {{c1::2 points}} ; de 30 à 39 km/h, {{c1::3 points}}.'
- id: d-grand-exces
  explication: 'Depuis le 29 décembre 2025 (loi du 9 juillet 2025), c''est un délit dès la première fois : 6 points, peines judiciaires encourues ou amende forfaitaire délictuelle de 300 €, suspension, annulation ou confiscation possibles. Auparavant, c''était une contravention de 5e classe, délit seulement en récidive.'
  theme: D
  sous_theme: sanctions
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F19460"
  rappels:
  - En 2026, un excès de vitesse retenu d’au moins 50 km/h constitue un {{c1::délit dès la première fois}}.
  - Un excès de vitesse retenu d’au moins 50 km/h entraîne le retrait de {{c2::6 points}}.
- id: d-alcool-contravention
  texte: 'Alcoolémie au moins égale à 0,5 g/L et inférieure à 0,8 g/L (seuil bas 0,2 en probatoire) : amende forfaitaire de
    135 € et retrait de {{c1::6 points}}.'
  explication: L’égalité au seuil bas suffit à constituer l’infraction. À 0,8 g/L ou plus, c’est un délit. En dessous, pas de rétention immédiate du permis ; le juge peut le suspendre (jusqu’à 3 ans) et le véhicule peut être immobilisé.
  theme: D
  sous_theme: sanctions
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2881"
  prerequis:
  - c-alcool-seuils-sang
- id: d-alcool-delit
  explication: 'Le seuil est inclus. Des peines de prison et d’amende sont encourues ; après rétention, le préfet doit suspendre
    le permis. Le refus de vérification est aussi un délit. Depuis 2026, L237-1 réprime l’ivresse manifeste, l’usage manifeste
    de stupéfiants et la consommation manifeste, détournée ou excessive, d’une substance psychoactive figurant sur une liste
    fixée par décret (liste pas encore publiée en septembre 2026) : délit, 6 points.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L234-1, L234-2, L234-8, L237-1 (lois n° 2025-622 et n° 2026-798)
  rappels:
  - Le seuil d’alcoolémie qui fait de la conduite un délit est {{c1::0,8 g/L de sang}} (0,40 mg/L d’air expiré).
  - La conduite avec une alcoolémie délictuelle entraîne le retrait de {{c2::6 points}}.
- id: d-stupefiants-delit
  explication: L’analyse établit l’usage ; le dépistage n’est pas un test d’aptitude. Alcool et stupéfiants cumulent les risques
    et aggravent les sanctions. Des peines de prison, d’amende et des mesures sur le permis sont encourues.
  theme: D
  sous_theme: sanctions
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2886"
  rappels:
  - Conduire après usage de stupéfiants est un {{c1::délit}}, même sans signe d’altération ressenti.
  - 'Conduite après usage de stupéfiants : retrait de {{c2::6 points}} ; en cumul avec une alcoolémie interdite, 9 points.'
- id: d-homicide-routier
  texte: Causer involontairement la mort d’autrui au volant avec une circonstance aggravante prévue par la loi peut constituer
    un {{c1::homicide routier}}.
  explication: Alcool, stupéfiants ou excès de vitesse d’au moins 30 km/h figurent parmi les circonstances prévues. C’est
    une qualification pénale, pas la preuve d’une intention de tuer ; les peines dépendent des circonstances.
  theme: D
  sous_theme: sanctions
  source: "Code pénal, art. 221-18 ; Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2886"
- id: d-sans-permis-sans-assurance
  explication: 'Le Fonds protège les victimes, pas le responsable : cette dette peut atteindre des montants considérables
    et s’ajoute aux sanctions du délit de défaut d’assurance.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L221-2 et L324-2 ; Code des assurances, art. L211-1 ; Fonds de garantie, Nos missions (https://www.fondsdegarantie.fr/nos-missions)
  texte: 'Un conducteur non assuré cause un accident : le Fonds de garantie des assurances obligatoires (FGAO) indemnise
    les victimes, puis {{c1::lui réclame les sommes versées}}.'
- id: d-refus-obtemperer
  texte: 'Je n’ai rien d’autre à me reprocher, mais je ne m’arrête pas à la sommation d’un agent en uniforme ou portant
    ses insignes : c’est {{c1::un délit (refus d’obtempérer)}}.'
  explication: Je m’arrête à l’endroit indiqué sans créer de danger. Des peines judiciaires, un retrait de points et des mesures
    sur le permis et le véhicule sont encourus ; mettre autrui en danger aggrave les faits.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L233-1, L233-1-1, L236-1, L224-16
- id: d-autres-bareme-3-points
  explication: Franchir entièrement la ligne continue retire trois points. Le chevauchement autorisé pour dépasser un cycle,
    un EDPM ou un cyclomobile léger reste soumis aux conditions de sécurité et d’écart latéral.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-19, R412-12, R414-4, R412-8, R412-9, R412-10, R412-28, R421-6, R416-11, R417-9
  rappels:
  - Un dépassement dangereux entraîne un retrait de {{c1::3 points}}.
  - Hors exception autorisée, chevaucher une ligne continue entraîne le retrait de {{c2::1 point}}.
- id: d-detecteur-radar
  texte: 'Entre un avertisseur de zones de danger (application d’aide à la conduite) et un détecteur de radars, seul {{c1::le
    détecteur (ou brouilleur) de radars}} est interdit : 5e classe, 6 points, confiscation de l’appareil.'
  explication: La confiscation peut viser aussi le véhicule.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R413-15
- id: d-retention-suspension
  explication: 'Cas de rétention, notamment : alcoolémie délictuelle ou ivresse, stupéfiants, refus de dépistage, excès ≥ 40 km/h avec interception, téléphone cumulé à une autre infraction, accident corporel avec infraction, refus d’obtempérer. Depuis la loi du 18 août 2026, après rétention pour alcoolémie délictuelle, stupéfiants, refus de vérification ou conduite sous emprise manifeste, le préfet doit prononcer la suspension ; dans les autres cas, elle reste possible. Le tribunal peut ensuite suspendre plus longtemps ou annuler le permis.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L224-1, L224-2, L224-7 ; service-public.fr F1040
  rappels:
  - Les forces de l’ordre peuvent retenir le permis sur place pendant {{c1::72 heures}} (120 h si des analyses sont en cours).
  - Après une rétention, la suspension administrative du préfet dure au plus {{c2::6 mois}} (1 an notamment pour alcool,
    stupéfiants, refus de vérification ou accident corporel ou mortel).
- id: d-documents-bord
  explication: 'L’attestation d’assurance n’est plus à présenter depuis le 1er avril 2024 : les agents vérifient l’assurance
    dans le fichier des véhicules assurés. Permis physique ou numérique admis. Les agents peuvent aussi demander à voir
    le gilet et le triangle (R233-1).'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R233-1 ; décret n° 2023-1152 du 8 décembre 2023 ; service-public.fr F1362
  rappels:
  - Au contrôle routier, je présente mon permis de conduire et {{c1::le certificat d’immatriculation (carte grise)}}.
- id: d-carte-grise-delais
  explication: 'Démarches sur l’ANTS ou chez un professionnel habilité. Défaut : 135 €. Le vendeur remet aussi un certificat
    de situation administrative de moins de 15 jours ; le certificat provisoire vaut 1 mois.'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R322-4, R322-5, R322-7 ; service-public.fr F21031
  rappels:
  - Après l’achat d’un véhicule, le nouveau propriétaire a {{c1::1 mois}} pour faire établir le certificat d’immatriculation
    à son nom (même délai pour un changement d’adresse).
  - Après la vente d’un véhicule, le vendeur déclare la cession sous {{c2::15 jours}}.
- id: d-controle-technique
  explication: Pour vendre à un particulier une voiture de plus de quatre ans, contrôle de moins de six mois ; si une contre-visite
    est prescrite, son délai ne doit pas être dépassé. Ne pas confondre périodicité et validité pour la vente.
  theme: D
  sous_theme: documents
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2878"
  rappels:
  - 'Voiture particulière : le premier contrôle technique se fait dans les 6 mois précédant le {{c1::4e anniversaire}}
    de sa première mise en circulation.'
  - 'Voiture particulière, après un contrôle favorable : les contrôles suivants ont lieu tous les {{c2::2 ans}}.'
- id: d-assurance-garanties
  texte: 'L''assurance automobile obligatoire est la {{c1::responsabilité civile (« au tiers »)}} : elle couvre les dommages
    causés aux autres, pas ceux du conducteur responsable ni de son véhicule.'
  explication: 'Garanties facultatives : dommages tous accidents (« tous risques »), vol, incendie, bris de glace, garantie
    du conducteur, assistance. Jeune conducteur : surprime jusqu’à 100 % (50 % après AAC), réduite de moitié chaque année
    sans sinistre.'
  theme: D
  sous_theme: documents
  source: Code des assurances, art. L211-1, A121-1 et A121-1-1 ; service-public.fr F2655
- id: d-constat-declaration
  explication: 'Vérifier le contrat : un délai plus long peut être prévu (deux jours ouvrés au minimum pour un vol).
    Le constat décrit les faits ; ne pas signer une description inexacte. Déclarer rapidement sans attendre de régler
    un désaccord.'
  theme: D
  sous_theme: documents
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2149 ; https://www.service-public.gouv.fr/particuliers/vosdroits/F2685"
  rappels:
  - Après un accident, le délai usuel pour déclarer le sinistre à l’assureur est {{c1::5 jours ouvrés}}.
- id: d-equipements-obligatoires
  explication: 'Le triangle présignale un véhicule immobilisé dangereux : environ 30 m en amont, davantage si nécessaire,
    sauf si le poser expose manifestement le conducteur au danger.'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R416-19 ; décret n° 2020-605 ; service-public.fr F19459
  texte: 'Équipements de sécurité obligatoires à bord d’une voiture : {{c1::un gilet de haute visibilité et un triangle
    de présignalisation}} ; l’éthylotest ne l’est plus depuis 2020.'
- id: d-vitres-teintees
  texte: Le pare-brise et les vitres latérales avant doivent laisser passer au moins {{c1::70 %}} de la lumière.
  explication: 'Infraction : 135 € et 3 points, immobilisation possible. Les vitres arrière peuvent être teintées librement.
    Le pare-brise doit rester propre et sans fissure dans le champ de vision.'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R316-3-1
- id: d-permis-am-14-ans
  texte: Un cyclomoteur (50 cm³, 45 km/h) ou une voiturette (quadricycle léger) se conduit dès {{c1::14 ans}}, avec
    le permis AM.
  explication: Le permis AM (ancien BSR) s'obtient après une formation de 8 heures ; il n'a pas de points. Une trottinette
    électrique se conduit aussi dès 14 ans, sans permis.
  theme: D
  sous_theme: permis
  source: Code de la route, art. R211-1 III et R211-2 ; securite-routiere.gouv.fr, Permis cyclomoteur – catégorie AM
- id: d-permis-b-perimetre
  prerequis: [d-masses-definitions]
  rappels:
  - Le permis B autorise un véhicule dont le PTAC ne dépasse pas {{c1::3,5 t}}.
  - Le permis B autorise un véhicule conçu pour au plus {{c2::8 passagers}} en plus du conducteur.
  explication: 'Soit 9 places au total. Au-delà : permis C1/C (poids) ou D1/D (personnes). Remorque : 750 kg de PTAC,
    ou davantage si la somme des PTAC reste sous 3,5 t (B96 jusqu''à 4,25 t, puis le permis BE).'
  theme: D
  sous_theme: permis
  source: Code de la route, art. R221-4 (catégorie B)
- id: d-masses-definitions
  theme: D
  sous_theme: documents
  rappels:
  - La masse maximale autorisée du véhicule chargé, passagers et bagages compris, est le {{c1::PTAC}}.
  - La charge utile est la différence entre la masse maximale autorisée du véhicule et son {{c2::poids à vide}}.
  - La masse maximale autorisée de l'ensemble véhicule + remorque est le {{c3::PTRA}}.
  explication: 'Sur la carte grise : PTAC en F.2, PTRA en F.3, poids à vide en G.1 (à lire, pas à apprendre). Pour le permis
    B, ce sont les PTAC, pas les masses réelles, qui se comparent aux 3 500 kg.'
  source: Code de la route, art. R311-1 et R221-4 ; arrêté du 9 février 2009 (certificat d'immatriculation, rubriques
    F.2, F.3, G.1)
