- id: d-points-capital
  explication: Le capital de 6 points s'applique au premier permis et à tout permis obtenu après invalidation
    ou annulation. Ajouter une catégorie (moto) à un permis ancien ne fait pas repasser en probatoire.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 et R223-1
  rappels:
  - Le capital maximal ordinaire du permis de conduire est {{c1::12 points}}.
  - Un premier permis probatoire démarre avec {{c2::6 points}}.
  tags:
  - revision::v4
- id: d-probatoire-duree
  explication: 'La progression est donc 6 → 8 → 10 → 12 en filière classique et 6 → 9 → 12 après AAC ; une
    seule infraction avec retrait de points l''interrompt. Pendant le probatoire : disque A à l''arrière, vitesses
    réduites (110/100/80), alcool 0,2 g/L.'
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-1 et R223-1 ; service-public.fr F2390
  rappels:
  - Sans formation post-permis ni AAC, le délai probatoire ordinaire dure {{c1::3 ans}}.
  - Après AAC, sans formation post-permis, le délai probatoire ordinaire dure {{c2::2 ans}}.
  - Sans infraction avec retrait de points, en filière classique, le capital probatoire augmente normalement
    de {{c3::2 points}} par année.
  - Sans infraction avec retrait de points, après AAC, le capital probatoire augmente normalement de {{c4::3
    points}} par année.
  tags:
  - revision::v4
- id: d-formation-post-permis
  texte: La formation complémentaire « post-permis » (1 journée de 7 h, entre le 6e et le 12e mois après le permis) ramène le délai probatoire de 3 ans à {{c1::2 ans}} (et de 2 ans à {{c2::1 an et 6 mois}} après AAC).
  explication: 'Volontaire, dans une école labellisée, réservée au premier permis, et à condition de n''avoir commis aucune infraction avec retrait de points. Avec elle : 12 points après 2 ans au lieu de 3.'
  theme: D
  sous_theme: points
  importance: utile
  source: Code de la route, art. L223-1 et R223-4-1 ; décret n° 2018-715 ; service-public.fr F2390
- id: d-points-delit-cumul
  texte: Le délit de conduite après usage de stupéfiants retire {{c1::6 points}} ; le cumul d’infractions est normalement
    plafonné à {{c2::8 points}}, sauf le cumul alcool + stupéfiants qui peut retirer {{c3::9 points}}.
  explication: 'Tous les délits ne retirent pas six points : défaut d’assurance et conduite sans permis n’ont pas
    ce barème. Distinguer délit, amende et retrait de points.'
  theme: D
  sous_theme: points
  source: Code de la route, L223-2, L235-1 ; Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F31551
  tags:
  - revision::v3
- id: d-probatoire-3-points
  texte: En permis probatoire, une infraction retirant au moins {{c1::3 points}} entraîne l'obligation de suivre un stage de sensibilisation dans les {{c2::4 mois}} (lettre 48N) ; la perte de la totalité des points (6 la 1re année) entraîne l'{{c3::invalidation}} du permis (lettre 48SI).
  explication: Le stage obligatoire remplace l'amende et rend jusqu'à 4 points, dans la limite du capital. La première année, un seul délit ou une contravention à 6 points (alcool ≥ 0,2 g/L, priorité piéton) suffit à invalider le permis.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6, R223-4, R223-8, L223-5
- id: d-invalidation-delai
  texte: Après invalidation, remettre le permis sous {{c1::10 jours}} ; interdiction d’obtenir un nouveau permis
    pendant {{c2::6 mois}}, ou {{c3::1 an}} en cas de nouvelle invalidation dans les cinq ans. La dispense de conduite
    est conditionnelle.
  explication: La dispense de conduite exige aussi une interdiction inférieure à un an et une réinscription dans
    le délai applicable ; examens médical et psychotechnique requis. Vérifier la procédure à la réception de la
    décision.
  theme: D
  sous_theme: points
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F1704
  tags:
  - revision::v3
- id: d-recuperation-points
  explication: 'Piège : la plupart des infractions courantes (téléphone, ceinture, feu rouge, excès ≥ 20 km/h)
    sont de 4e classe → c''est souvent 3 ans. Pendant le probatoire, pas de reconstitution automatique : on
    récupère par la majoration annuelle ou par un stage.'
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6 ; service-public.fr F1685
  rappels:
  - Après le retrait d’un seul point, le délai de récupération sans nouvelle infraction donnant lieu à retrait
    est {{c1::6 mois}}.
  - 'Hors règles particulières du probatoire, reconstitution des 12 points après seules contraventions des
    classes 1 à 3 : {{c2::2 ans}} sans nouvelle infraction donnant lieu à retrait.'
  - 'Hors règles particulières du probatoire, reconstitution des 12 points si une infraction est de classe
    4 ou 5 ou un délit : {{c3::3 ans}} sans nouvelle infraction donnant lieu à retrait.'
  tags:
  - revision::v4
- id: d-stage-points
  texte: Un stage volontaire de sensibilisation à la sécurité routière ({{c1::2 jours}} consécutifs, ~200 €) permet de récupérer jusqu'à {{c2::4 points}}, dans la limite du capital, au plus {{c3::une fois par an}} (date à date), à condition que le permis soit encore valide.
  explication: Avant la loi LOPPSI 2 (2011), c'était une fois tous les 2 ans. Les points sont crédités le lendemain du dernier jour de stage.
  theme: D
  sous_theme: points
  source: Code de la route, art. L223-6 et R223-8 ; service-public.fr F14208
- id: d-consulter-points
  texte: Le permis B au format carte est valable {{c1::15 ans}} administrativement (renouvellement sans examen ni visite médicale) ; on consulte son solde de points sur le téléservice « Mes Points Permis ».
  explication: Le téléservice a remplacé Télépoints en novembre 2023. Le permis dématérialisé est disponible dans l'application France Identité depuis février 2024 et accepté aux contrôles en France (pas à l'étranger).
  theme: D
  sous_theme: documents
  importance: utile
  source: Arrêté du 13 novembre 2023 ; service-public.fr F17970 et F31133
- id: d-aac-conditions
  texte: 'Apprentissage anticipé de la conduite (AAC) : possible dès {{c1::15 ans}} ; après la formation initiale, au moins {{c2::1 an}} et {{c3::3 000 km}} de conduite accompagnée, avec 2 rendez-vous pédagogiques ; épreuve pratique dès 17 ans.'
  explication: 'Avantages : taux de réussite plus élevé, probatoire réduit à 2 ans, assurance moins chère. L''accompagnateur doit avoir le permis B depuis au moins 5 ans sans interruption et l''accord écrit de l''assureur. Conduite à l''étranger interdite pendant l''AAC.'
  theme: D
  sous_theme: permis
  source: Code de la route, art. R211-3 et R211-5 ; service-public.fr F2826
- id: d-permis-17-ans
  texte: En France, le permis B peut être obtenu et utilisé pour conduire seul dès {{c1::17 ans}}.
  explication: Règle applicable depuis le 1er janvier 2024. L’âge ne dispense ni de réussir le permis ni des
    restrictions probatoires ; l’AAC a ses propres conditions.
  theme: D
  sous_theme: permis
  source: Décret n° 2023-1214 du 20 décembre 2023 ; Code de la route, art. R221-5
  tags:
  - revision::v4
- id: d-formation-minimale
  texte: 'Premier permis B en auto-école : formation pratique minimale ordinaire de {{c1::20 heures}} sur boîte
    manuelle, ou {{c2::13 heures}} pour une formation limitée à la boîte automatique.'
  explication: 'Hors simulateur : au moins 15 h en circulation sur boîte manuelle, 10 h sur boîte automatique.
    Le simulateur peut réduire ces parties à 10 h et 7 h sous conditions. Le minimum réglementaire n’est pas
    une promesse d’être prêt ; exceptions selon permis déjà détenu.'
  theme: D
  sous_theme: permis
  importance: utile
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2828
  tags:
  - revision::v4
- id: d-accompagnateur
  texte: Pour accompagner un élève, il faut notamment le permis B depuis {{c1::5 ans}} sans interruption et l’accord
    de {{c2::l’assureur}} pour cet apprentissage.
  explication: Ne pas enseigner un transfert automatique des points de l’élève vers l’accompagnateur. Les responsabilités
    dépendent de l’infraction ; l’accompagnateur est personnellement soumis aux règles sur alcool et stupéfiants.
  theme: D
  sous_theme: permis
  source: Code de la route, R211-3 et R234-1 ; Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2826
  tags:
  - revision::v3
- id: d-classes-amendes
  texte: 'Amendes forfaitaires par classe de contravention : 1re {{c1::11 €}}, 2e {{c2::35 €}}, 3e {{c3::68 €}}, 4e {{c4::135 €}} ; 5e classe : jusqu''à 1 500 € (forfaitisée à 200 € pour certaines depuis 2024).'
  explication: Les contraventions relèvent du tribunal de police, les délits du tribunal correctionnel (prison possible). Les 4 premières classes ne figurent pas au casier judiciaire.
  theme: D
  sous_theme: sanctions
  source: Code pénal, art. 131-13 ; Code de procédure pénale, art. R49 ; service-public.fr F18509
- id: d-amende-minoree-majoree
  texte: 'Une amende de 4e classe (135 €) est minorée à {{c1::90 €}} si elle est payée dans les 15 jours (30 jours en ligne) et majorée à {{c2::375 €}} au-delà de 45 jours (60 jours en ligne) ; pour une 3e classe (68 €) : 45 € minorée, 180 € majorée ; 2e classe (35 €) : 22 € / 75 €.'
  explication: Pas de minoration en 1re classe ni pour le stationnement. La contestation se fait dans les 45 jours (30 jours pour une majorée).
  theme: D
  sous_theme: sanctions
  source: Code de procédure pénale, art. R49-7 et R49-9 ; service-public.fr F18509
- id: d-telephone-sanction
  texte: 'Téléphone tenu en main, oreillette, écouteurs ou casque audio au volant : {{c1::135 €}} et {{c2::3 points}} ; si l''infraction est commise en même temps qu''une autre (vitesse, feu, priorité, ligne continue…), le permis peut être retenu immédiatement puis suspendu jusqu''à 6 mois.'
  explication: 'L''interdiction vaut dès que le véhicule est en circulation, même arrêté au feu ou dans un bouchon (Cass. 2018). Le kit mains libres intégré au véhicule est toléré. Un écran vidéo dans le champ de vision : 5e classe et 3 points.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-6-1, R412-6-2, L224-1 et L224-2
- id: d-ceinture-sanction
  dedup_ok: [aff-d-ceinture-passager-adulte]
  texte: 'Ceinture non attachée : le conducteur perd {{c1::3 points}} et paie 135 € ; un passager majeur non attaché paie {{c2::135 €}} lui-même, sans points ; pour un passager de moins de 18 ans (ou un enfant sans siège adapté), c''est le {{c3::conducteur}} qui paie 135 €, sans retrait de points.'
  explication: 'Piège fréquent : beaucoup de supports affichent « 3 points » pour l''enfant non attaché ; l''article R412-2 ne prévoit aucun retrait. Une ceinture par personne ; enfant de moins de 3 ans interdit sur un siège sans ceinture.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-1 et R412-2
- id: d-feu-rouge-stop-sanction
  texte: 'Franchir un feu rouge (fixe ou clignotant), un STOP, ou refuser une priorité (cédez-le-passage, priorité à droite, giratoire, sortie de parking) : 135 € et {{c1::4 points}} ; refuser la priorité à un piéton : 135 € et {{c2::6 points}} ; ne pas respecter un feu jaune fixe : {{c3::35 €}} sans points.'
  explication: La priorité piéton est passée de 4 à 6 points le 19 septembre 2018. Suspension possible jusqu'à 3 ans pour le feu rouge, le STOP et la priorité.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-30, R412-31, R415-5 à R415-11
- id: d-vitesse-bareme
  explication: 'Le retrait pour les excès < 5 km/h a été supprimé le 1er janvier 2024. 40 à 49 km/h : 4 points,
    135 €, rétention et suspension possibles selon la procédure. Les excès portent sur la vitesse retenue,
    après la marge propre au dispositif de contrôle.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R413-14 ; décret n° 2023-1150 du 6 décembre 2023
  rappels:
  - Un excès de vitesse retenu de moins de 5 km/h entraîne le retrait de {{c1::0 point}} ; l’amende reste applicable.
  - Un excès de vitesse retenu de 5 à 19 km/h entraîne le retrait de {{c2::1 point}}.
  - Un excès de vitesse retenu de 20 à 29 km/h entraîne le retrait de {{c3::2 points}}.
  - Un excès de vitesse retenu de 30 à 39 km/h entraîne le retrait de {{c4::3 points}}.
  tags:
  - revision::v4
- id: d-grand-exces
  dedup_ok: [aff-d-grand-exces-delit]
  texte: 'Un excès de vitesse de {{c1::50 km/h}} ou plus est, depuis le 29 décembre 2025, un {{c2::délit}} dès la première fois : 3 mois de prison, 3 750 € d''amende, {{c3::6 points}}, suspension jusqu''à 3 ans et confiscation possible (obligatoire en récidive).'
  explication: 'Avant (banque de questions 2023) : contravention de 5e classe (1 500 €, 6 points), délit seulement en récidive. Un excès ≥ 30 km/h est aussi l''une des circonstances aggravantes de l''homicide routier (loi du 9 juillet 2025).'
  theme: D
  sous_theme: sanctions
  tags:
  - nouveau::2025
  source: Code de la route, art. L413-1 (loi n° 2025-622 du 9 juillet 2025 ; décret n° 2025-1269 du 22 décembre 2025)
- id: d-alcool-contravention
  texte: 'Alcoolémie au moins égale à 0,5 g/L et inférieure à 0,8 g/L (seuil bas 0,2 en probatoire) : amende
    forfaitaire de {{c1::135 €}} et retrait de {{c2::6 points}}.'
  explication: L’égalité au seuil bas suffit à constituer l’infraction. À 0,8 g/L ou plus, il s’agit d’un délit.
    Suspension possible ; ne pas présenter la rétention immédiate comme automatique pour toute alcoolémie contraventionnelle.
  theme: D
  sous_theme: sanctions
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2881
  tags:
  - revision::v4
- id: d-alcool-delit
  texte: Conduire avec au moins 0,8 g/L de sang (0,40 mg/L d'air) ou en état d'ivresse manifeste est un délit puni de {{c1::3 ans}} de prison et {{c2::9 000 €}} d'amende, {{c3::6 points}}, suspension jusqu'à 5 ans, annulation possible avec interdiction de repasser le permis jusqu'à 5 ans, confiscation du véhicule.
  explication: 'Valeurs relevées par la loi du 9 juillet 2025 (avant : 2 ans et 4 500 €, que la banque 2023 peut encore afficher). L''ivresse manifeste est, depuis août 2026, un délit distinct (L237-1) aux mêmes peines, comme le refus de dépistage.'
  theme: D
  sous_theme: sanctions
  tags:
  - nouveau::2025
  source: Code de la route, art. L234-1, L234-2, L234-8, L237-1 (lois n° 2025-622 et n° 2026-798)
- id: d-stupefiants-delit
  texte: 'Conduire après usage de stupéfiants (toute trace, sans seuil) : délit puni de {{c1::3 ans}} de prison et {{c2::9 000 €}}, 6 points, suspension jusqu''à 5 ans ; combiné à l''alcool : {{c3::5 ans}}, {{c4::15 000 €}} et 9 points.'
  explication: 'Valeurs de la loi du 9 juillet 2025 (avant : 2 ans et 4 500 €). Aucun seuil : toute trace suffit. Dépistage salivaire possible à tout moment, obligatoire après un accident corporel ; le refus est puni comme un test positif.'
  theme: D
  sous_theme: sanctions
  tags:
  - nouveau::2025
  source: Code de la route, art. L235-1 et L235-3 ; service-public.fr F2886
- id: d-homicide-routier
  texte: 'La loi du 9 juillet 2025 a créé l''« {{c1::homicide routier}} » (code pénal, art. 221-18) : 7 ans de prison et 100 000 € d''amende avec une circonstance aggravante (alcool, stupéfiants, excès ≥ 30 km/h, téléphone en main, délit de fuite, refus d''obtempérer, sans permis…), 10 ans et 150 000 € avec deux ou plus.'
  explication: 'Les « blessures routières » (ITT > 3 mois) : 5 ans et 75 000 €. Peine complémentaire : annulation du permis, interdiction de le repasser pendant 5 à 10 ans. Sans circonstance aggravante, on reste dans l''homicide involontaire.'
  theme: D
  sous_theme: sanctions
  tags:
  - nouveau::2025
  importance: utile
  source: Loi n° 2025-622 du 9 juillet 2025 ; Code pénal, art. 221-18 à 221-21
- id: d-delit-fuite
  texte: Le délit de fuite (ne pas s'arrêter après un accident que l'on a causé ou provoqué) est puni de {{c1::3 ans}} de prison et {{c2::75 000 €}} d'amende, {{c3::6 points}}, suspension jusqu'à 5 ans, annulation possible.
  explication: S'arrêter est obligatoire même sans blessé (constat). En cas de blessés, s'ajoute la non-assistance à personne en danger (5 ans, 75 000 €). Les peines des blessures ou de l'homicide sont doublées en cas de fuite.
  theme: D
  sous_theme: sanctions
  source: Code pénal, art. 434-10 ; Code de la route, art. L231-1
- id: d-sans-permis-sans-assurance
  texte: 'Conduire sans permis : délit, {{c1::1 an}} de prison et {{c2::15 000 €}} (amende forfaitaire délictuelle 800 €), confiscation. Conduire sans assurance : délit, {{c3::3 750 €}} (amende forfaitaire 500 €), suspension jusqu''à 3 ans, confiscation ; sans retrait de points.'
  explication: L'assurance responsabilité civile est obligatoire pour tout véhicule terrestre à moteur, même s'il ne roule pas, y compris trottinettes électriques, voiturettes et remorques. Le Fonds de garantie (FGAO) indemnise les victimes d'un non-assuré puis se retourne contre lui.
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. L221-2 et L324-2 ; Code des assurances, art. L211-1
- id: d-refus-obtemperer
  texte: Le refus d'obtempérer (ne pas s'arrêter à la sommation d'un agent) est un délit puni de {{c1::2 ans}} de prison et {{c2::15 000 €}}, 6 points, suspension jusqu'à 3 ans et confiscation obligatoire du véhicule ; 5 ans et 75 000 € s'il met en danger la vie d'autrui.
  explication: 'Le rodéo motorisé est puni de 2 ans et 30 000 € depuis août 2026 (avant : 1 an, 15 000 €). Conduire malgré une suspension ou une invalidation : 2 ans, 4 500 €, 6 points.'
  theme: D
  sous_theme: sanctions
  importance: utile
  source: Code de la route, art. L233-1, L233-1-1, L236-1, L224-16
- id: d-autres-bareme-3-points
  texte: 'Infractions à {{c1::3 points}} (135 €) : dépassement dangereux, non-respect des distances de sécurité, franchissement d''une ligne continue, circulation sur la bande d''arrêt d''urgence, circulation à gauche, vitres avant trop teintées, stationnement dangereux, non-port du casque à moto ; le chevauchement d''une ligne continue ne retire que {{c2::1 point}}.'
  explication: 'Changement de direction sans clignotant : amende de 35 € seulement, mais 3 points. Accélérer quand on est dépassé : 135 € et 2 points. Sens interdit, marche arrière ou demi-tour sur autoroute, circuler de nuit sans éclairage : 4 points.'
  theme: D
  sous_theme: sanctions
  source: Code de la route, art. R412-19, R412-12, R414-4, R412-8, R412-9, R412-10, R412-28, R421-6, R416-11, R417-9
- id: d-detecteur-radar
  texte: 'Détenir, transporter ou utiliser un détecteur ou brouilleur de radars : contravention de 5e classe (jusqu''à 1 500 €, forfait 200 €), {{c1::6 points}}, confiscation de l''appareil et éventuellement du véhicule.'
  explication: 'Les avertisseurs de « zones de danger » (Coyote, Waze) restent tolérés. Une plaque absente ou illisible : 135 €, sans points, immobilisation.'
  theme: D
  sous_theme: sanctions
  importance: utile
  source: Code de la route, art. R413-15 et R317-8
- id: d-retention-suspension
  texte: Les forces de l'ordre peuvent retenir le permis sur le bord de la route pendant {{c1::72 heures}} (120 h si des analyses sont en cours) ; le préfet peut ensuite prononcer une suspension administrative jusqu'à {{c2::6 mois}} ({{c3::1 an}} pour alcool, stupéfiants, refus de dépistage, accident mortel ou corporel).
  explication: 'Cas de rétention : alcool, stupéfiants, refus, excès ≥ 40 km/h avec interception, téléphone cumulé à une autre infraction, accident grave avec infraction, refus d''obtempérer. Le tribunal peut ensuite suspendre jusqu''à 3 ans (5 ans pour alcool/stupéfiants) ou annuler le permis.'
  theme: D
  sous_theme: sanctions
  importance: utile
  source: Code de la route, art. L224-1, L224-2, L224-7 ; service-public.fr F1040
- id: d-documents-bord
  explication: Pour une voiture immatriculée en France, l’assurance est contrôlée via le Fichier des véhicules
    assurés ; la suppression de la carte verte n’a pas supprimé l’obligation d’assurance. Gilet et triangle
    sont des équipements, pas des documents.
  theme: D
  sous_theme: documents
  tags:
  - nouveau::2024
  - revision::v4
  source: Code de la route, art. R233-1 ; décret n° 2023-1152 du 8 décembre 2023 ; service-public.fr F1362
  rappels:
  - Au contrôle routier, le document prouvant mon droit de conduire est le {{c1::permis de conduire}} (physique
    ou numérique admis).
  - Au contrôle routier d’une voiture immatriculée, son document d’identification est le {{c2::certificat d’immatriculation}}
    (carte grise).
- id: d-carte-grise-delais
  texte: Après l'achat d'un véhicule, le nouveau propriétaire a {{c1::1 mois}} pour faire établir le certificat d'immatriculation à son nom (même délai pour déclarer un changement d'adresse) ; le vendeur déclare la cession sous {{c2::15 jours}} et remet un certificat de situation administrative de moins de 15 jours.
  explication: 'Démarches sur l''ANTS ou chez un professionnel habilité (plus de guichet en préfecture). Défaut : 135 €. Le certificat provisoire (CPI) vaut 1 mois. Format des plaques SIV AA-123-AA, numéro attribué à vie au véhicule.'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R322-4, R322-5, R322-7 ; service-public.fr F21031
- id: d-controle-technique
  explication: Pour vendre à un particulier une voiture de plus de quatre ans, contrôle de moins de six mois
    ; si une contre-visite est prescrite, son délai ne doit pas être dépassé. Ne pas confondre périodicité
    et validité pour la vente.
  theme: D
  sous_theme: documents
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2878
  tags:
  - revision::v3
  - revision::v4
  rappels:
  - 'Voiture particulière : le premier contrôle technique se fait dans les {{c1::6 mois}} précédant le quatrième
    anniversaire de sa première mise en circulation.'
  - 'Voiture particulière : le premier contrôle technique doit être réalisé avant le {{c2::4e anniversaire}}
    de sa première mise en circulation.'
  - 'Voiture particulière, après un contrôle favorable : périodicité ordinaire des contrôles techniques suivants,
    {{c3::2 ans}}.'
- id: d-assurance-garanties
  texte: 'L''assurance obligatoire est la {{c1::responsabilité civile (« au tiers »)}} : elle couvre les dommages causés aux autres, jamais ceux du conducteur responsable ni de son véhicule (garanties facultatives : dommages tous accidents/« tous risques », vol, incendie, bris de glace, garantie du conducteur, assistance).'
  explication: 'Bonus-malus : coefficient 1 au départ, −5 % par an sans accident responsable (jusqu''à 0,50), +25 % par accident responsable (jusqu''à 3,50). Jeune conducteur : surprime jusqu''à 100 % (50 % après AAC), réduite de moitié chaque année sans sinistre.'
  theme: D
  sous_theme: documents
  source: Code des assurances, art. L211-1, A121-1 et A121-1-1 ; service-public.fr F2655
- id: d-constat-declaration
  texte: Après un accident matériel, on remplit un constat amiable (papier ou e-constat) — sans le signer en cas de désaccord — et on déclare le sinistre à son assureur sous {{c1::5 jours ouvrés}} ({{c2::2 jours}} en cas de vol).
  explication: 'Le constat n''est pas obligatoire mais évite les litiges : un exemplaire par conducteur, croquis, croix dans les cases, signatures des deux. Ne jamais quitter les lieux sans échanger les identités : ce serait un délit de fuite.'
  theme: D
  sous_theme: documents
  source: Code des assurances, art. L113-2 ; service-public.fr F2149
- id: d-critair-prix
  texte: 'Crit’Air se commande sur {{c1::certificat-air.gouv.fr}} ; la vignette reste valable {{c2::tant qu’elle
    est lisible et que les informations du véhicule ne changent pas}}. Défaut de vignette dans une zone où elle
    est exigée : {{c3::68 €}} pour une voiture.'
  explication: Ne pas apprendre le prix d’envoi, variable et sans intérêt pour décider au volant. Vérifier les règles
    locales avant d’entrer dans une ZFE.
  theme: D
  sous_theme: documents
  tags:
  - nouveau::2026
  - revision::v3
  source: Code de la route, art. R318-2 et R411-19-1 ; service-public.fr F33371 ; décision CC n° 2026-903 DC
- id: d-equipements-obligatoires
  texte: 'Équipements obligatoires à bord d''une voiture : un {{c1::gilet de haute visibilité}} à portée de
    main (à revêtir avant de sortir après un arrêt d''urgence) et un {{c2::triangle de présignalisation}} (à
    placer à ≈ 30 m, sauf si sa pose met en danger) ; l''{{c3::éthylotest}} n''est plus obligatoire depuis
    mai 2020.'
  explication: 'Le triangle présignale un véhicule immobilisé dangereux : environ 30 m en amont, davantage
    si nécessaire, sauf si le poser expose manifestement le conducteur au danger. Cette exception ne se limite
    pas à l’autoroute.'
  theme: D
  sous_theme: documents
  source: Code de la route, art. R416-19 ; décret n° 2020-605 ; service-public.fr F19459
  tags:
  - revision::v4
- id: d-vitres-teintees
  texte: 'Depuis 2017, le pare-brise et les vitres latérales avant doivent laisser passer au moins {{c1::70 %}} de la lumière ; infraction : 135 € et {{c2::3 points}}, immobilisation possible.'
  explication: Les vitres arrière peuvent être teintées librement. Un pare-brise doit rester propre et sans fissure dans le champ de vision du conducteur.
  theme: D
  sous_theme: documents
  importance: utile
  source: Code de la route, art. R316-3-1
- id: d-fourriere-abandon
  texte: Un véhicule en fourrière est réputé abandonné {{c1::15 jours}} après la mise en demeure adressée au propriétaire (10 jours s'il est de faible valeur marchande) ; le stationnement abusif est constitué au-delà de {{c2::7 jours}} consécutifs au même endroit (35 €, fourrière possible).
  explication: 'La fourrière est possible pour tout stationnement gênant, très gênant, dangereux ou abusif. Anciens manuels : « 45 jours » — dépassé.'
  theme: D
  sous_theme: documents
  importance: utile
  source: Code de la route, art. L325-7 et R417-12
