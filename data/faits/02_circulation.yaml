- id: l-vitesse-agglo
  texte: Du panneau d'entrée d'agglomération au panneau de sortie, la vitesse maximale par défaut est de {{c1::50 km/h}}.
  explication: 'Une autorité locale peut abaisser la limite. Le relèvement à 70 exige notamment des accès riverains et traversées
    piétonnes en nombre limité et protégés. Zone 30 : 30 ; zone de rencontre : 20 ; aire piétonne : allure du pas, sans seuil
    légal universel de 6 km/h.'
  theme: L
  sous_theme: vitesse
  source: "Code de la route, art. R413-3 et R110-2, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600"
- id: l-vitesse-hors-agglo
  dedup_ok:
  - aff-l-90-departement
  explication: 'Les sections à au moins deux voies dans un même sens ont un régime particulier à 90 sur ces voies. Pluie et
    permis probatoire : 80. Une limitation locale plus basse prévaut toujours.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-2 ; CGCT, art. L3221-4-1 (relèvement à 90 par le département)
  rappels:
  - 'Route 1 (double sens, une voie par sens, sans terre-plein), hors agglomération, temps sec, permis définitif : je ne dépasse pas {{c1::80 km/h}}.'
  - 'Route 1 : le département peut relever le plafond à {{c2::90 km/h}}, signalé par des panneaux.'
  image:
    gen: types_routes
    verso: true
- id: l-vitesse-separateur-autoroute
  explication: Le terre-plein central sépare deux chaussées ; le nombre de voies ne suffit pas. Je lis la configuration, les limitations et les conditions.
  theme: L
  sous_theme: vitesse
  source: "Code de la route, art. R413-2, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600"
  rappels:
  - 'Route 2 (deux chaussées séparées par un terre-plein central), hors agglomération, temps sec, permis définitif : je ne dépasse pas {{c1::110 km/h}}.'
  - 'Autoroute (3), temps sec, permis définitif : le plafond général est de {{c2::130 km/h}}.'
  image:
    gen: types_routes
    verso: true
- id: l-vitesse-pluie
  explication: 'Les limites locales plus basses restent applicables : 80 reste 80, 70 reste 70. En ville, 50 par défaut. Visibilité
    inférieure à 50 m : plafond de 50 km/h, sans relever une limite à 30.'
  theme: L
  sous_theme: vitesse
  source: "Code de la route, art. R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
  rappels:
  - Il pleut. Sur une autoroute limitée à 130 par temps sec, je ne dépasse pas {{c1::110 km/h}}.
  - Il pleut. Sur une autoroute limitée à 110, ou sur une route à chaussées séparées par un terre-plein (110 par temps
    sec), je ne dépasse pas {{c2::100 km/h}}.
  - Il pleut. Sur une route de campagne relevée à 90 par temps sec, je ne dépasse pas {{c3::80 km/h}}.
- id: l-vitesse-visibilite-50
  explication: 'C’est un plafond, pas une allure conseillée : je dois pouvoir m’arrêter dans la distance que je vois, souvent
    bien en dessous de 50 km/h (R413-17).'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-4 et R413-17, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600
  rappels:
  - 'Brouillard : quand la visibilité est inférieure à {{c1::50 m}}, sur autoroute comme ailleurs, je ne dépasse pas {{c1::50 km/h}} (une limite plus basse reste plus basse).'
- id: l-vitesse-probatoire
  explication: 'Une limitation locale plus basse reste applicable. Pluie et permis probatoire ne se cumulent pas par soustractions
    : appliquer le plafond le plus bas qui concerne la situation. Sur une autoroute normalement limitée à 130,
    pluie et permis probatoire donnent le même plafond de 110 ; sur une section normalement limitée à 110, c’est 100.'
  theme: L
  sous_theme: vitesse
  source: "Code de la route, art. R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
  rappels:
  - Permis probatoire (ou élève), temps sec. Sur autoroute (130 pour les autres), je ne dépasse pas {{c1::110 km/h}}.
  - Permis probatoire (ou élève), temps sec. Sur une autoroute limitée à 110, ou une route à chaussées séparées (110
    pour les autres), je ne dépasse pas {{c2::100 km/h}}.
  - Permis probatoire (ou élève). Sur une route de campagne relevée à 90 pour les autres, je ne dépasse pas {{c3::80
    km/h}}.
- id: l-vitesse-minimale-autoroute
  texte: Sur autoroute, par circulation fluide et bonnes conditions, la vitesse minimale sur la voie la plus à gauche est
    de {{c1::80 km/h}}.
  explication: Ce minimum ne s'applique que sur la voie la plus à gauche et dans les conditions indiquées ; il n'autorise
    pas à maintenir 80 face à un danger. Ailleurs, circuler sans raison à une vitesse anormalement réduite est aussi sanctionné
    (35 €).
  theme: L
  sous_theme: vitesse
  source: "Code de la route, art. R413-19, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600"
- id: l-vitesse-engins
  explication: 'Un EDPM est bridé à 25 km/h (voir la carte dédiée). Sur un vélo à assistance électrique conforme, l’assistance se coupe à 25 km/h mais
    on peut pédaler plus vite : ce n’est pas un cyclomoteur. Une assistance débridée change sa conformité.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R311-1
  rappels:
  - 'Vitesse maximale par construction d’un cyclomoteur ou d’une voiturette (quadricycle léger) : {{c1::45 km/h}}.'
- id: l-stationnement-categories
  explication: Gênant, très gênant et abusif ne retirent pas de points à eux seuls ; le stationnement dangereux, si. Fourrière
    possible. Pour décider où s’arrêter, lire les lieux et les panneaux avant de penser au montant de l’amende.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-9 à R417-12 ; service-public.fr F34212
  rappels:
  - 'Arrêt ou stationnement dangereux par visibilité insuffisante : retrait de {{c1::3 points}}, en plus de l’amende.'
  - Sauf délai local plus court, laisser un véhicule au même endroit plus de {{c2::7 jours consécutifs}} constitue un stationnement
    abusif.
- id: l-stationnement-5m-passage
  texte: Pour une voiture, arrêt et stationnement sont interdits sur un passage piéton et dans les {{c1::5 m}} en
    amont, en dehors des emplacements matérialisés.
  explication: La loi impose au gestionnaire de la voie d’avoir supprimé les emplacements matérialisés dans ces 5
    m au 31 décembre 2026 ; tant qu’une place marquée existe, elle reste utilisable.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-11 ; Code de la voirie routière, art. L118-5-1
  illustration:
    gen: rue_stationnement
    params:
      crossing: 80
      no_parking: true
      parked:
      - 262
      - 356
    legende: 'Les 5 m en amont du passage restent libres : piétons et conducteurs s’y voient.'
- id: l-stationnement-alterne
  explication: 'Je lis les dates d’interdiction sur les panneaux : du 1er au 15, ou du 16 à la fin du mois. Un arrêté local
    peut fixer d’autres horaires, et une prescription de zone peut imposer ce régime.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-2
  rappels:
  - 'Stationnement unilatéral alterné semi-mensuel : du 1er au 15 du mois, côté des numéros {{c1::impairs}}.'
  - 'Stationnement unilatéral alterné semi-mensuel : le dernier jour de chaque période, changement de côté entre {{c2::20
    h 30 et 21 h}}.'
  comparaisons:
  - ref: b6a2
    legende: Placé du côté interdit du 1er au 15 (numéros pairs).
  - ref: b6a3
    legende: Placé du côté interdit du 16 à la fin du mois (numéros impairs).
- id: l-stationnement-cote
  explication: Stationner à gauche d’une rue à double sens en agglomération est interdit (R417-1, 35 €) ; la nuit, le véhicule
    y est aussi moins visible.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-1
  rappels:
  - 'Rue à double sens en agglomération : stationner du côté {{c1::droit}} dans son sens de circulation.'
- id: l-zone-bleue
  texte: En zone bleue, j’indique sur le disque mon heure {{c1::d’arrivée}} ; la durée autorisée se lit sur la signalisation
    locale.
  explication: La durée est locale (souvent 1 h 30, parfois moins). Respecter horaires et durée indiqués ; déplacer
    le disque pour rester plus longtemps est une infraction.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-3 ; service-public.fr F34440
  comparaisons:
  - ref: b6b3
    legende: 'Entrée de zone bleue : stationnement de durée limitée avec disque.'
  - ref: marq-zone-bleue
    legende: Places délimitées en bleu.
  illustration:
    gen: disque_stationnement
    width: 240
    signal: true
    legende: 'Disque de stationnement : j’y règle mon heure d’arrivée.'
- id: l-feux-detresse-usage
  texte: À l’approche d’un fort ralentissement, le {{c1::dernier véhicule de la file}} doit utiliser les feux de détresse
    pour avertir ceux qui arrivent.
  explication: 'R416-18 : conducteur momentanément contraint à une allure fortement réduite ; en file ininterrompue,
    obligation limitée au dernier véhicule. Les feux de détresse présignalent aussi une immobilisation dangereuse,
    mais n’autorisent pas le stationnement.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R416-18 et R416-19
- id: l-depassement-laterale
  explication: 'Ces écarts protègent aussi les autres usagers mentionnés par R414-4 : piétons, cavaliers, animaux, deux ou
    trois-roues. L’exception de chevauchement d’une ligne continue concerne les cycles, EDPM et cyclomobiles légers ; ne pas
    l’étendre à tous ces usagers.'
  theme: L
  sous_theme: depassement
  source: "Code de la route, R414-4 et R412-19, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842138/"
  rappels:
  - Pour dépasser un cycliste en agglomération, l’écart latéral minimal est {{c1::1 m}}.
  - Pour dépasser un cycliste hors agglomération, l’écart latéral minimal est {{c2::1,50 m}}.
- id: l-ligne-continue-sanction
  explication: 'Hors exception légale : franchissement, 3 points ; chevauchement, 1 point ; amende forfaitaire de 135 €. Ne
    pas confondre les deux gestes pour appliquer l’exception de dépassement des cycles, EDPM et cyclomobiles légers.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-18 à R412-20
  rappels:
  - Passer entièrement de l’autre côté d’une ligne continue, c’est la {{c1::franchir}}.
  - Empiéter sur une ligne continue sans passer entièrement de l’autre côté, c’est la {{c2::chevaucher}}.
  illustration:
    gen: ligne_continue_gestes
    params: {}
    legende: 'Chevaucher : les roues passent sur la ligne. Franchir : le véhicule passe entièrement de l’autre côté.'
- id: l-croisement-largeur
  explication: 'Il doit réduire sa vitesse et, au besoin, s’arrêter ou se garer pour laisser passer. Exception : les transports
    en commun en agglomération.'
  theme: L
  sous_theme: croisement
  source: Code de la route, R414-2
  rappels:
  - Sur chaussée étroite, un véhicule de plus de {{c1::2 m}} de large (ou de plus de 7 m de long) doit faciliter le
    croisement avec un plus petit.
- id: l-implantation-danger
  dedup_ok:
  - aff-r-descente-150m
  explication: Distances usuelles d’implantation (200 m sur autoroute), pas des mesures de la scène. Le panonceau
    de distance indique l’éloignement réel annoncé ; un panonceau d’étendue décrit la longueur concernée.
  theme: L
  sous_theme: signalisation
  source: IISR 2e partie, art. 25 ; Sécurité routière, Exemples de nouvelles questions (Q18, Q19)
  rappels:
  - Hors agglomération, sans panonceau de distance, un panneau de danger est généralement placé à environ {{c1::150 m}} du
    danger.
  - En agglomération, sans panonceau de distance, un panneau de danger est généralement placé à environ {{c2::50 m}} du danger.
- id: l-passage-pieton-50m
  texte: Hors aire piétonne et zone de rencontre, un piéton doit utiliser un passage prévu à son intention
    s’il en existe un à moins de {{c1::50 m}}.
  explication: Sans passage proche, il tient compte de la visibilité, de la distance et de la vitesse des véhicules
    ; à une intersection, il traverse dans le prolongement du trottoir. Je cède à celui qui s’engage régulièrement
    ou manifeste clairement cette intention. Même face à un piéton en infraction, je dois éviter l’accident.
  theme: L
  sous_theme: priorites
  source: Code de la route, R412-37, R415-11 et R413-17
- id: l-signalisation-hierarchie
  explication: 'Un feu vert ne lève que les panneaux de priorité placés au même carrefour : sens interdit, interdiction
    de tourner et ligne continue restent valables.'
  theme: L
  sous_theme: signalisation
  source: "Code de la route, R411-25 et R411-28 ; IISR, 8e partie, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842087"
  rappels:
  - 'Un agent règle la circulation à un carrefour à feux : je suis {{c1::ses gestes, pas les feux}}.'
  - 'Feux en fonctionnement et panneau STOP au même carrefour : je suis {{c2::les feux}}.'
  - 'Un panneau jaune de chantier contredit le panneau habituel : je suis {{c3::le panneau jaune (temporaire)}}.'
  debut: true
