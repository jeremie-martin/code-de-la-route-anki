- id: l-vitesse-agglo
  texte: En agglomération, la vitesse maximale par défaut est de {{c1::50 km/h}} — dès le panneau d'entrée d'agglomération (EB10), jusqu'au panneau de sortie (EB20).
  explication: 'Le maire peut abaisser (30 km/h généralisé) ou relever à 70 km/h sur des sections sans accès riverains ni traversées piétonnes. Zone 30 : 30 km/h ; zone de rencontre : 20 km/h ; aire piétonne : allure du pas (≈ 6 km/h).'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-3 et R110-2
- id: l-vitesse-hors-agglo
  dedup_ok:
  - aff-l-90-departement
  explication: 'Les sections à au moins deux voies dans un même sens ont un régime particulier à 90 sur ces
    voies. Pluie et permis probatoire : 80. Une limitation plus basse prévaut.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-1 à R413-5 — https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/
  tags:
  - revision::v3
  - revision::v4
  rappels:
  - 'Voiture, permis hors probatoire, temps sec : sur route hors agglomération à double sens, une voie par
    sens, sans séparateur ni relèvement signalé, le plafond est {{c1::80 km/h}}.'
  - 'Voiture, permis hors probatoire, temps sec : sur route hors agglomération à double sens, une voie par
    sens, le plafond peut être relevé et signalé à {{c2::90 km/h}}.'
- id: l-vitesse-separateur-autoroute
  explication: 'Le critère est le terre-plein central, pas le nombre de voies. Une « route à accès réglementé
    » (panneau bleu avec une voiture, C107) n''est pas une autoroute : 110 km/h par défaut, mêmes interdictions
    (piétons, vélos, demi-tour…).'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-2
  rappels:
  - 'Voiture, temps sec, permis hors probatoire, hors agglomération, sans limite locale plus basse : sur une
    route à deux chaussées séparées par terre-plein central, le plafond est {{c1::110 km/h}}.'
  - 'Voiture, temps sec, permis hors probatoire et sans limite locale plus basse : sur autoroute, le plafond
    général est {{c2::130 km/h}}.'
  tags:
  - revision::v4
- id: l-vitesse-pluie
  explication: 'Les limites locales plus basses restent applicables : 80 reste 80, 70 reste 70. En ville, 50
    par défaut. Visibilité inférieure à 50 m : plafond de 50 km/h, sans relever une limite à 30.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-1 à R413-5 — https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/
  tags:
  - revision::v3
  - revision::v4
  rappels:
  - 'Voiture, hors probatoire, sous la pluie, visibilité d’au moins 50 m : autoroute normalement à 130, sans
    limite locale plus basse, plafond {{c1::110 km/h}}.'
  - 'Voiture, hors probatoire, sous la pluie, visibilité d’au moins 50 m : autoroute normalement à 110 ou route
    à chaussées séparées, sans limite locale plus basse, plafond {{c2::100 km/h}}.'
  - 'Voiture, hors probatoire, sous la pluie : route hors agglomération à double sens sans séparateur, normalement
    à 90, sans autre restriction, plafond {{c3::80 km/h}}.'
- id: l-vitesse-visibilite-50
  explication: 'Article R413-4. Règle des trois 50 : visibilité 50 m = 50 km/h = 50 m d''intervalle. Feux de
    croisement obligatoires ; feux de brouillard avant admis ; feux de brouillard arrière seulement par brouillard
    ou chute de neige, jamais sous la pluie (R416-7).'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-4
  rappels:
  - Le plafond spécial lié à une visibilité très réduite s’applique quand on voit à moins de {{c1::50 m}}.
  - 'Visibilité inférieure à 50 m : sur autoroute comme sur les autres réseaux, plafond {{c2::50 km/h}}, sans
    relever une limite plus basse et en ralentissant davantage si nécessaire.'
  tags:
  - revision::v4
- id: l-vitesse-probatoire
  explication: 'Une limitation locale plus basse reste applicable. Pluie et permis probatoire ne se cumulent
    pas par soustractions : appliquer le plafond le plus bas qui concerne la situation.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-1 à R413-5 — https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/
  tags:
  - revision::v3
  - revision::v4
  rappels:
  - 'Élève ou permis probatoire, temps sec et sans limite locale plus basse : autoroute normalement à 130,
    plafond {{c1::110 km/h}}.'
  - 'Élève ou permis probatoire, temps sec et sans limite locale plus basse : autoroute normalement à 110 ou
    route à chaussées séparées, plafond {{c2::100 km/h}}.'
  - 'Élève ou permis probatoire, route hors agglomération à double sens sans séparateur, normalement à 90 :
    plafond {{c3::80 km/h}}.'
- id: l-vitesse-minimale-autoroute
  texte: Sur autoroute, par circulation fluide et bonnes conditions, la vitesse minimale sur la voie la plus à gauche est de {{c1::80 km/h}} ; circuler sans raison à une vitesse anormalement réduite est sanctionné (35 €).
  explication: 'Aucune vitesse minimale ailleurs, mais l''obligation de ne pas gêner. Véhicules > 3,5 t : 90 sur autoroute, 80 sur les autres routes.'
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-19 et R413-8
- id: l-vitesse-engins
  texte: 'Vitesses maximales par construction : EDPM {{c1::25 km/h}} ; cyclomoteur et voiturette légère {{c2::45
    km/h}}. Sur un VAE conforme, l’assistance se coupe à {{c1::25 km/h}}, mais on peut pédaler plus vite.'
  explication: 'Un VAE conforme coupe seulement son assistance à 25 km/h : pédaler ou descendre plus vite ne le
    transforme pas en cyclomoteur. Une assistance débridée change en revanche sa conformité.'
  theme: L
  sous_theme: vitesse
  importance: utile
  source: Code de la route, art. R311-1
  tags:
  - revision::v3
- id: l-vitesse-peripherique
  texte: Le boulevard périphérique de Paris est limité à {{c1::50 km/h}} depuis le 1er octobre 2024 (auparavant 70 km/h, valeur que le Code de la route mentionne encore).
  explication: Mesure municipale (arrêté de la Ville de Paris). Sa voie de gauche est réservée au covoiturage (losange lumineux) aux heures de pointe depuis mars 2025.
  theme: L
  sous_theme: vitesse
  importance: rare
  source: Arrêté Ville de Paris n° 2024 P 15981 ; Code de la route, art. R413-3
- id: l-stationnement-categories
  texte: 'Stationnement gênant : {{c1::35 €}} ; très gênant : {{c2::135 €}} ; dangereux (visibilité insuffisante : virage, sommet de côte, intersection, passage à niveau) : 135 € et {{c3::3 points}} ; abusif (plus de {{c4::7 jours}} au même endroit) : 35 €. Fourrière possible dans tous les cas.'
  explication: 'Seul le stationnement dangereux retire des points. « Très gênant » : trottoir, passage piéton et 5 m en amont, piste ou bande cyclable, voie de bus, place PMR, bouche d''incendie, devant les feux ou panneaux masqués.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-9 à R417-12 ; service-public.fr F34212
- id: l-stationnement-5m-passage
  dedup_ok:
  - aff-l-5m-passage
  texte: Pour une voiture, arrêt et stationnement interdits sur un passage piéton et dans les {{c1::5 m}} en amont
    ; en 2026, une exception subsiste en amont pour les emplacements matérialisés à cet effet.
  explication: Les places matérialisées existant dans ces 5 m sont tolérées jusqu'au 31 décembre 2026 ; à partir
    du 1er janvier 2027, l'exception disparaît (loi LOM).
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-11 ; Code de la voirie routière, art. L118-5-1
  tags:
  - revision::v3_1
- id: l-stationnement-alterne
  explication: 'Piège : le changement a lieu le soir (20 h 30), pas le matin. Signalé par les panneaux B6a2
    (stationnement interdit du 1er au 15 : posé côté des numéros pairs) et B6a3 (interdit du 16 à la fin du
    mois : côté impair), ou par le panneau de zone B6b2.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-2
  rappels:
  - 'Stationnement unilatéral alterné semi-mensuel : du 1er au 15 du mois, côté des numéros {{c1::impairs}}.'
  - 'Stationnement unilatéral alterné semi-mensuel : du 16 au dernier jour du mois, côté des numéros {{c2::pairs}}.'
  - 'Stationnement unilatéral alterné semi-mensuel : le dernier jour de chaque période, changement de côté
    entre {{c3::20 h 30 et 21 h}}.'
  tags:
  - revision::v4
- id: l-stationnement-cote
  explication: 'Stationner à contresens (côté gauche d''une rue à double sens) est un stationnement gênant
    (35 €) et dangereux la nuit (feux non visibles). La nuit sur chaussée non éclairée : feux de position allumés.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-1, R417-4 et R416-12
  rappels:
  - 'Rue à double sens en agglomération : stationner du côté {{c1::droit}} dans son sens de circulation.'
  - Hors agglomération, stationner autant que possible {{c2::hors de la chaussée}}, sans créer de danger ni
    enfreindre une autre interdiction.
  tags:
  - revision::v4
- id: l-zone-bleue
  texte: 'En zone bleue, le disque de stationnement (modèle européen) est obligatoire, avec l''heure d''arrivée affichée ; la durée autorisée est fixée par arrêté municipal (souvent 1 h 30) ; défaut ou dépassement : {{c1::35 €}} (contravention de 2e classe).'
  explication: Signalée par le panneau B6b3 (zone à stationnement de durée limitée) ou C1b, avec un marquage bleu au sol possible. Le stationnement payant impayé relève du forfait post-stationnement (FPS, montant communal), sans points.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-3 ; service-public.fr F34440
- id: l-feux-detresse-usage
  texte: 'Les feux de détresse (warning) sont obligatoires quand on circule momentanément à allure fortement
    réduite ({{c1::dernier véhicule d''un bouchon}}) — ne pas les allumer : {{c2::35 €}} — et, avec le triangle,
    pour présignaler un véhicule immobilisé dangereux — défaut de présignalisation : {{c3::135 €}}.'
  explication: 'Les warnings signalent un danger ; ils ne créent aucune autorisation de stationnement. Distinguer
    l’arrêt pour montée, descente ou manutention, conducteur disponible, du stationnement en attente. R416-18
    : allure fortement réduite ; R416-19 : immobilisation dangereuse.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R416-18 et R416-19
  tags:
  - revision::v4
- id: l-depassement-laterale
  explication: 'Ces écarts protègent aussi les autres usagers mentionnés par R414-4 : piétons, cavaliers, animaux,
    deux ou trois-roues. L’exception de chevauchement d’une ligne continue concerne les cycles, EDPM et cyclomobiles
    légers ; ne pas l’étendre à tous ces usagers.'
  theme: L
  sous_theme: depassement
  source: Code de la route, R414-4 et R412-19 — https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842138/
  rappels:
  - Pour dépasser un cycliste en agglomération, l’écart latéral minimal est {{c1::1 m}}.
  - Pour dépasser un cycliste hors agglomération, l’écart latéral minimal est {{c2::1,50 m}}.
  tags:
  - revision::v4
- id: l-ligne-continue-sanction
  explication: 'Hors exception légale : franchissement, 3 points ; chevauchement, 1 point ; amende forfaitaire
    de 135 €. Ne pas confondre les deux gestes pour appliquer l’exception de dépassement des cycles, EDPM et
    cyclomobiles légers.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-18 à R412-20
  rappels:
  - Passer entièrement de l’autre côté d’une ligne continue, c’est la {{c1::franchir}}.
  - Empiéter sur une ligne continue sans passer entièrement de l’autre côté, c’est la {{c2::chevaucher}}.
  tags:
  - revision::v4
- id: l-croisement-largeur
  texte: 'Sur chaussée étroite, un véhicule de plus de {{c1::2 m}} de large ou {{c2::7 m}} de long facilite le croisement
    avec un plus petit (exception : transport en commun en ville). En montagne, le {{c3::descendant}} s’arrête le
    premier.'
  explication: 'S’arrêter et reculer sont deux questions différentes. Pour reculer : véhicule seul avant ensemble,
    léger avant lourd ; à catégorie égale, descendant sauf si le refuge est plus accessible au montant.'
  theme: L
  sous_theme: croisement
  source: Code de la route, R414-2 et R414-3
  tags:
  - revision::v3
- id: l-depasse-serrer-droite
  texte: Quand on est dépassé, on serre à droite sans accélérer ; accélérer pendant qu'on est dépassé coûte 135 € et {{c1::2 points}}.
  explication: Le dépassement se fait à gauche, sauf pour dépasser un véhicule qui a signalé qu'il tourne à gauche, ou un tramway (par la droite si la place suffit).
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-6 et R414-16
- id: l-implantation-danger
  dedup_ok:
  - aff-l-implantation-agglo-50
  - aff-r-descente-150m
  explication: Ce sont des distances usuelles d’implantation, pas des mesures de la scène. Le panonceau de
    distance indique l’éloignement réel annoncé ; un panonceau d’étendue décrit la longueur concernée. Cas
    particuliers selon le signal et la configuration.
  theme: L
  sous_theme: signalisation
  source: IISR 2e partie, art. 28 ; Sécurité routière — Exemples de nouvelles questions (Q18, Q19)
  rappels:
  - Hors agglomération, sans panonceau de distance, un panneau de danger est généralement placé à environ {{c1::150
    m}} du danger.
  - En agglomération, sans panonceau de distance, un panneau de danger est généralement placé à environ {{c2::50
    m}} du danger.
  tags:
  - revision::v4
- id: l-balises-j10
  dedup_ok:
  - aff-r-pn-150m
  explication: 'Elles n''existent pas toujours en agglomération. Croix de Saint-André simple (G1) = une voie
    ; double (G1 bis) = plusieurs voies : un train peut en cacher un autre.'
  theme: L
  sous_theme: signalisation
  source: IISR 2e partie, art. 28 et 34
  rappels:
  - 'Passage à niveau hors agglomération annoncé à 150 m : la première balise J10 porte {{c1::3 bandes}} rouges.'
  - Dans une implantation J10 à 150, 100 et 50 m, la balise à 100 m porte {{c2::2 bandes}} rouges.
  - Dans une implantation J10 à 150, 100 et 50 m, la dernière balise porte {{c3::1 bande}} rouge.
  tags:
  - revision::v4
- id: l-passage-pieton-50m
  texte: Un piéton doit emprunter le passage piéton s'il en existe un à moins de {{c1::50 m}} ; le conducteur doit céder le passage au piéton {{c2::engagé}} ou qui manifeste clairement l'intention de traverser (135 €, {{c3::6 points}}).
  explication: Dans une aire piétonne ou une zone de rencontre, le piéton est prioritaire partout. Ne jamais s'arrêter sur le passage ni dépasser un véhicule arrêté devant un passage piéton.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-37 et R415-11
- id: l-signalisation-hierarchie
  texte: Les ordres de l’{{c1::agent}} prévalent. Les {{c2::feux}} remplacent les panneaux réglant la priorité,
    pas les autres interdictions. En cas de conflit, la signalisation {{c3::temporaire}} remplace la permanente.
  explication: Un feu vert ne permet ni un sens interdit ni le franchissement d’une ligne continue. Éviter la fausse
    hiérarchie « tous les panneaux > tous les marquages ».
  theme: L
  sous_theme: signalisation
  source: Code de la route, R411-25 et R411-28 ; IISR, 8e partie — https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842087
  tags:
  - revision::v3
