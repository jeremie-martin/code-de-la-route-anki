- id: p-desembuage-clim
  texte: Pour désembuer rapidement le pare-brise, je mets la {{c1::climatisation}} en marche, ventilation dirigée vers le
    vitrage.
  explication: Buée = humidité condensée sur une vitre froide. La climatisation assèche l’air, qui absorbe cette humidité
    ; attendre que la vue soit dégagée avant de partir.
  theme: P
  sous_theme: verifications
  source: securite-routiere.gouv.fr, Conduire par mauvais temps ; notices constructeurs (désembuage)
