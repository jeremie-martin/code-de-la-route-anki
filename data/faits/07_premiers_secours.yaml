- id: pas-ordre
  explication: Protéger évite le suraccident. Faire alerter par un témoin permet de secourir en parallèle ; ne pas retarder
    un geste vital pour réciter une séquence rigide.
  theme: A
  sous_theme: pas
  source: "Sécurité civile, PSC juillet 2026, Protection, Alerte et Hémorragies, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf"
  texte: Face à un accident, les trois priorités de l’aide sont {{c1::protéger, alerter, secourir}}.
- id: numeros-urgence
  explication: 'Le 112 est le bon réflexe si l''on hésite : il redirige vers le service compétent. Il fonctionne depuis un
    téléphone verrouillé ou sans crédit, via n''importe quel réseau disponible.'
  theme: A
  sous_theme: alerter
  source: "service-public.fr, Numéros d'urgence ; Code pénal, art. 223-6"
  rappels:
  - 'Numéros d’urgence en France : SAMU {{c1::15}} ; police ou gendarmerie {{c1::17}} ; sapeurs-pompiers {{c1::18}} ; numéro
    d’urgence européen {{c1::112}}.'
- id: numero-114
  texte: Le numéro d’urgence accessible par SMS ou visio aux personnes ayant des difficultés à entendre ou à parler est le {{c1::114}}.
  explication: Une personne entendante qui ne peut pas parler à voix haute sans se mettre en danger peut aussi envoyer
    un SMS au 114. Si je peux téléphoner, j’appelle le 112, le 15, le 17 ou le 18 selon l’urgence.
  theme: A
  sous_theme: alerter
  source: "Ministère de l’Intérieur, https://www.masecurite.interieur.gouv.fr/fr/fiches-pratiques/famille-et-aides-aux-victimes/114-service-urgence-personnes-sourdes-sourdaveugles-malentendantes-aphasiques"
- id: borne-appel-autoroute
  texte: Sur autoroute, les bornes d'appel d'urgence (orange) sont implantées environ tous les {{c1::2 km}} ; elles localisent
    automatiquement l'appel et mettent en relation avec le poste de sécurité.
  explication: Pour la rejoindre, marcher derrière la glissière, jamais sur la chaussée ni sur la bande d'arrêt d'urgence.
    En tunnel, les postes d'appel sont dans les niches de sécurité.
  theme: A
  sous_theme: alerter
  source: "securite-routiere.gouv.fr, Bien se comporter sur autoroute ; ASFA"
  comparaisons:
  - ref: ce2a
    legende: Panneau d’un poste d’appel d’urgence.
- id: triangle-distance
  texte: Sur route, si sa pose ne me met pas en danger, le triangle se place environ {{c1::30 m}} avant l'obstacle, ou davantage
    pour être visible à temps.
  explication: 'L''exception pour mise en danger vaut sur toute route : le triangle doit avertir ceux qui arrivent
    sur la même voie, pas exposer celui qui le pose. Sur autoroute, se protéger derrière la glissière et alerter.'
  image:
    gen: triangle_distance
    verso: true
    params:
      label: '?'
  theme: A
  sous_theme: proteger
  source: "Arrêté du 30 septembre 2008, art. 2, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000019566252/"
- id: rcp-rythme
  prerequis: [a-rcp-dae]
  explication: Si les insufflations sont impossibles, je poursuis les compressions. Je fais alerter les secours et apporter un défibrillateur, puis suis ses consignes.
  theme: A
  sous_theme: secourir
  source: "Sécurité civile, PSC juillet 2026, Arrêt cardiaque, https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf"
  texte: Chez l’adulte, quand j’alterne compressions thoraciques et bouche-à-bouche, je fais {{c1::30 compressions puis 2 insufflations}} par cycle.
