# C — Le conducteur : faits à trous (v2). Un chiffre vit ici et nulle part ailleurs dans le thème.
- id: c-temps-reaction
  texte: Le repère pédagogique du temps de réaction d’un conducteur attentif est {{c1::1 seconde}} environ. Fatigue,
    alcool ou distraction peuvent le porter à {{c2::2 secondes ou davantage}}, sans valeur fixe garantie.
  explication: Pendant la réaction, le véhicule continue d’avancer. À réaction identique, une vitesse plus élevée
    augmente la distance parcourue.
  theme: C
  sous_theme: distances
  source: securite-routiere.gouv.fr — La vitesse et la conduite ; Codeclic — Temps de réaction
  tags:
  - revision::v3
- id: c-distance-reaction-formule
  dedup_ok: [aff-c-temps-reaction-vitesse]
  texte: 'Distance parcourue pendant 1 s de réaction ≈ chiffre des dizaines de la vitesse × {{c1::3}} : à 50 km/h → {{c2::15 m}}, à 90 km/h → {{c3::27 m}}, à 130 km/h → {{c4::39 m}}.'
  explication: 'C''est la convention des auto-écoles (V × 3/10). Valeur physique (V ÷ 3,6) : 14 m, 25 m, 36 m — les deux jeux de valeurs peuvent apparaître, ils sont proches.'
  theme: C
  sous_theme: distances
  source: Codeclic ; En Voiture Simone ; securite-routiere.gouv.fr — Dépliant vitesse
- id: c-distance-arret-formule
  texte: 'Distance d''arrêt sur sol sec ≈ (dizaines de la vitesse)² : à 50 km/h → {{c1::25 m}}, à 90 km/h → {{c2::81
    m}}, à 130 km/h → {{c3::169 m}}.'
  explication: Repères mnémotechniques approximatifs, pas mesures garanties ni barème officiel unique. La distance
    réelle dépend de la réaction, de l’adhérence et du véhicule. Si un exercice fournit des distances, les utiliser
    ; arrêt = réaction + freinage.
  theme: C
  sous_theme: distances
  source: Ornikar ; En Voiture Simone ; Stych ; securite-routiere.gouv.fr — Dépliant vitesse
  tags:
  - revision::v3
- id: c-distance-mouillee
  texte: Sur chaussée mouillée, l'adhérence est environ {{c1::2}} fois moins bonne et la distance de freinage environ {{c1::2}} fois plus longue (question officielle 2023) ; sur neige ou verglas, la distance de freinage peut être multipliée par {{c2::10}}.
  explication: 'Q13 officielle : autoroute mouillée → « l''adhérence est 2 fois moins bonne » OUI, « la distance de freinage est 2 fois plus longue » OUI. Certaines écoles enseignent plutôt « distance d''arrêt × 1,5 » : l''ordre de grandeur suffit. Conséquence pratique : on double l''intervalle et on réduit la vitesse.'
  theme: C
  sous_theme: distances
  source: Sécurité routière — Exemples de nouvelles questions (Q13) ; Ornikar ; Codes Rousseau
- id: c-vitesse-double-freinage
  dedup_ok: [aff-c-vitesse-double-freinage-double]
  texte: Quand la vitesse double, la distance de freinage est multipliée par {{c1::4}} (l'énergie cinétique croît avec le carré de la vitesse).
  explication: 'À 100 km/h, on freine 4 fois plus long qu''à 50. Et masse ×2 → énergie ×2 seulement : la vitesse pèse plus que le poids.'
  theme: C
  sous_theme: distances
  source: securite-routiere.gouv.fr — La vitesse et la conduite ; Ornikar — Énergie cinétique
- id: c-intervalle-2s
  texte: 'Entre deux véhicules qui se suivent, l''intervalle de sécurité minimal est de {{c1::2 secondes}} (art. R412-12), soit en mètres ≈ dizaines de la vitesse × {{c2::6}} : 50 km/h → {{c3::30 m}}, 130 km/h → {{c4::78 m}}.'
  explication: 'Méthode : quand le véhicule qui précède passe un repère fixe, compter « un crocodile, deux crocodiles » ; si j''atteins le repère avant, je suis trop près. Pluie, nuit, chargement, débutant : 3 à 4 s. Sanction : 135 €, 3 points.'
  theme: C
  sous_theme: distances
  source: Code de la route, art. R412-12 ; Codes Rousseau — Calcul des distances
- id: c-intervalle-pl-tunnel
  texte: Hors agglomération, deux véhicules de plus de {{c1::3,5 t}} ou de plus de 7 m qui se suivent à la même
    vitesse gardent au moins {{c2::50 m}}. En tunnel, respecter la distance {{c3::signalée pour la situation}}.
  explication: 'Il n’existe pas de minimum universel de 150 m dans tous les tunnels. Les consignes peuvent distinguer
    circulation et arrêt : lire panneaux et repères.'
  theme: C
  sous_theme: distances
  source: Code de la route, R412-12 ; CETU — sécurité des usagers en tunnel
  tags:
  - revision::v3
- id: c-autoroute-deux-traits
  texte: 'Sur autoroute, l''intervalle de sécurité se contrôle avec la ligne de rive de la bande d''arrêt d''urgence : garder au moins {{c1::2 traits}} entre soi et le véhicule qui précède (trait 39 m + espace 13 m + trait ≈ {{c2::90 m}}).'
  explication: '« Un trait = danger, deux traits = sécurité ». À 130 km/h, 2 s = 78 m, d''où les 2 traits (IISR, modulation T4 : trait 39 m, vide 13 m).'
  theme: C
  sous_theme: distances
  source: securite-routiere.gouv.fr — La vitesse et la conduite ; IISR 7e partie, art. 113-1
- id: c-telephone-5s
  texte: Lire un SMS détourne les yeux de la route environ {{c1::5 secondes}}, soit {{c2::70 m}} parcourus à 50 km/h (≈ 180 m à 130 km/h) ; le risque d'accident est multiplié par {{c3::3}} au téléphone et par {{c4::23}} en lisant ou en écrivant un message.
  explication: 'Le smartphone cumule 4 distractions : visuelle, cognitive, auditive et physique, et réduit le champ de vision de 30 à 50 %.'
  theme: C
  sous_theme: vigilance
  source: securite-routiere.gouv.fr — Le téléphone et la conduite
- id: c-champ-visuel-chiffres
  texte: 'Champ visuel du conducteur : environ {{c1::180°}} à l''arrêt, 100° à 40 km/h, 75° à 70 km/h, {{c2::45°}} à 100 km/h et seulement {{c3::30°}} à 130 km/h.'
  explication: 'Barème enseigné par les auto-écoles ; la Sécurité routière ne cite explicitement que 180° à l''arrêt, 45° à 100 km/h et 30° à 130 km/h. À grande vitesse, seule la vision centrale reste utile : les piétons et véhicules sur les côtés ne sont plus perçus (« effet tunnel »).'
  theme: C
  sous_theme: perception
  source: securite-routiere.gouv.fr — Dépliant La vue ; Conduire sur autoroute ; En Voiture Simone — Champ visuel
- id: c-vue-90-pourcent
  texte: Environ {{c1::90 %}} des informations utiles à la conduite passent par la vue ; l'acuité visuelle exigée pour le permis B est d'au moins {{c2::5/10}} avec les deux yeux (avec correction).
  explication: 'Arrêté du 28 mars 2022 : acuité binoculaire ≥ 5/10 (si un œil voit moins de 1/10, l''autre doit atteindre 5/10) et champ visuel horizontal ≥ 120°. Avec lunettes ou lentilles obligatoires, le permis porte le code 01 : conduire sans, c''est 135 € et 3 points. La baisse de la vue est progressive et passe inaperçue : contrôle régulier conseillé.'
  theme: C
  sous_theme: perception
  source: Arrêté du 28 mars 2022 ; En Voiture Simone — Acuité visuelle ; Code de la route, art. R221-1-1
- id: c-fatigue-pause-chiffres
  texte: 'Sur long trajet : une pause de {{c1::15 à 20 min}} au moins toutes les {{c2::2 heures}} ; en cas de somnolence, une sieste d''environ {{c3::20 min}} est le seul remède efficace.'
  explication: 'Micro-sommeils de 1 à 4 s, bâillements, paupières lourdes = somnolence : on s''arrête et on dort. Fatigue (nuque raide, regard fixe, picotements) = pause. Heures à risque : 2 h-5 h et 13 h-15 h.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite
- id: c-somnolence-stats
  texte: 'La somnolence est la première cause d''accident mortel sur autoroute : environ {{c1::1 sur 3}} ; {{c2::17 h}} de veille active équivalent à une alcoolémie de 0,5 g/L.'
  explication: Dès les premiers signes de somnolence, le risque d'accident est multiplié par 3 à 4 dans la demi-heure. Chiffre de campagne ASFA/Sécurité routière ; l'ONISR (facteurs relevés par les forces de l'ordre) ne relève la somnolence que chez 4 % des présumés responsables (8 à 14 % sur autoroute) — l'examen retient « 1 sur 3 ».
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite ; ASFA
- id: c-nuit-risque
  texte: La nuit, la {{c1::visibilité réduite}} et la {{c2::somnolence}} rendent la conduite plus risquée, même
    quand le trafic paraît faible.
  explication: Réduire l’allure selon la distance visible et interrompre le trajet dès les signes de somnolence.
    Les trajets familiers exigent la même vigilance que les autres.
  theme: C
  sous_theme: deficiences
  source: Sécurité routière — conduite de nuit et somnolence
  tags:
  - revision::v3
- id: c-verre-standard
  texte: Un verre « standard » (25 cl de bière à 5°, 10 cl de vin à 12°, 3 cl d'alcool à 40°) contient environ {{c1::10 g}} d'alcool pur et élève l'alcoolémie d'environ {{c2::0,20 à 0,25 g/L}} ; deux verres suffisent pour atteindre 0,5 g/L.
  explication: Plus chez une femme ou une personne mince (jusqu'à 0,30 g/L par verre). Les doses servies à la maison sont plus généreuses qu'au bar (question officielle 2023).
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Code en Poche
- id: c-alcool-elimination
  texte: Le foie élimine l'alcool à raison de {{c1::0,10 à 0,15 g/L}} par heure (≈ 2 h 30 par verre) ; le pic d'alcoolémie survient {{c2::15 à 30 min}} après le dernier verre à jeun, {{c3::1 h}} au cours d'un repas.
  explication: Rien n'accélère l'élimination (ni café, ni douche, ni sport). Après une soirée, on peut être positif le lendemain matin.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Codeclic
- id: c-alcool-risque-multiplie
  texte: 'Risque d''accident mortel selon l''alcoolémie : ×{{c1::2}} à 0,5 g/L, ×{{c2::10}} à 0,8 g/L, ×35 à 1,2 g/L ; l''alcool est présent dans près de {{c3::30 %}} des accidents mortels.'
  explication: 'Barème enseigné (En Voiture Simone, Vinci). Sécurité routière : un conducteur alcoolisé a 18 fois plus de risque d''être responsable d''un accident mortel ; plus de 1 000 tués par an.'
  theme: C
  sous_theme: deficiences
  source: En Voiture Simone — Alcool au volant ; securite-routiere.gouv.fr — L'alcool et la conduite
- id: c-conversion-air-sang
  texte: 'Seuils légaux correspondants : 0,5 g/L dans le sang ↔ {{c1::0,25 mg/L}} d’air expiré ; 0,2 g/L ↔ {{c2::0,10
    mg/L}} ; 0,8 g/L ↔ {{c3::0,40 mg/L}}.'
  explication: Ce sont des correspondances réglementaires avec des unités différentes, pas une division entre deux
    concentrations de même unité. Lire sang ou air avant de répondre.
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — L'alcool et la conduite ; Code de la route, art. R234-1
  tags:
  - revision::v3
- id: c-stupefiants-stats
  texte: Les stupéfiants sont en cause dans environ {{c1::1 accident mortel sur 5}} ; le cannabis multiplie le risque d'accident mortel par près de {{c2::2}}, et l'association alcool + cannabis par environ {{c3::29}} (chiffre Sécurité routière).
  explication: 'Valeurs Sécurité routière : cannabis ×1,65 (×1,8 dans certains QCM), alcool + cannabis ×29 (×15 dans les anciens films). Le dépistage salivaire est possible à tout moment, même sans infraction ; il concerne aussi cyclistes, trottinettes et accompagnateur en conduite accompagnée.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La drogue et la conduite ; ONISR 2024
- id: c-medicaments-niveaux
  texte: 'Pictogramme « médicaments et conduite » sur la boîte : niveau 1 (jaune) → {{c1::lire la notice avant de conduire}} ; niveau 2 (orange) → {{c2::ne pas conduire sans l''avis d''un professionnel de santé}} ; niveau 3 (rouge) → {{c3::ne pas conduire}} (avis médical pour reprendre).'
  explication: 'Somnifères et anxiolytiques (benzodiazépines), certains antihistaminiques, antitussifs et antalgiques sont concernés ; environ un tiers des médicaments portent un pictogramme, y compris sans ordonnance. Ne jamais associer à l''alcool.'
  theme: C
  sous_theme: deficiences
  source: ANSM — Médicaments et conduite ; arrêté du 8 août 2008 (CSP, art. R5121-139) ; securite-routiere.gouv.fr — Les médicaments et la conduite
- id: c-retro-7s
  texte: Je consulte le rétroviseur intérieur {{c1::régulièrement}} et avant un {{c2::ralentissement anticipé ou
    un changement de direction}}. Un danger immédiat exige de freiner sans retarder l’action pour ce contrôle.
  explication: 'Il n’existe pas de chronomètre universel : la fréquence des contrôles s’adapte à la circulation.
    Regard direct vers l’angle mort avant tout déport.'
  theme: C
  sous_theme: vigilance
  source: Stych — Les contrôles ; Codeclic — L'angle mort
  tags:
  - revision::v3
