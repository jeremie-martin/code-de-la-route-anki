- id: c-temps-reaction
  texte: Pour un exercice sans autre indication, le repère pédagogique du temps de réaction d’un conducteur attentif est d’environ
    {{c1::1 seconde}}.
  explication: La durée réelle varie avec la personne, la tâche et l’état de vigilance. Fatigue, alcool ou distraction peuvent
    l’allonger ; deux secondes n’est pas une valeur fixe pour ces états.
  theme: C
  sous_theme: distances
  source: "securite-routiere.gouv.fr, La vitesse et la conduite ; Codeclic, Temps de réaction"
  prerequis:
  - c-distance-arret-composantes
- id: c-distance-reaction-formule
  texte: 'À vitesse constante, distance parcourue en mètres = {{c1::vitesse en km/h ÷ 3,6 × durée en secondes}}.'
  explication: 'Diviser par 3,6 convertit les km/h en m/s. À 90 km/h pendant 2 s : 90 ÷ 3,6 × 2 = 50 m.
    Le raccourci « dizaines × 3 » estime seulement la distance en une seconde ; multiplier ensuite par la durée.'
  theme: C
  sous_theme: distances
  source: "Conversion km/h en m/s ; Cerema, Évaluation V80 (2020), annexe 2, https://www.onisr.securite-routiere.gouv.fr/sites/default/files/2020-07/Cerema-EvaluationV80-Juillet2020-Vdef3.pdf"
  prerequis:
  - c-distance-arret-composantes
- id: c-distance-mouillee
  texte: Dans un exercice qui retient une adhérence divisée par deux sur sol mouillé, à vitesse égale, la distance
    de freinage est {{c1::doublée}}.
  explication: 'C’est l’hypothèse de l’exemple officiel de 2023, pas un multiplicateur garanti pour toute pluie.
    Revêtement, pneus et hauteur d’eau changent l’adhérence réelle. La distance d’arrêt additionne réaction et freinage
    : seule la composante freinage double dans ce modèle.'
  theme: C
  sous_theme: distances
  source: Sécurité routière, exemple public Q13 (2023) ; repère et limites du modèle
  prerequis:
  - c-distance-arret-composantes
- id: c-vitesse-double-freinage
  texte: À adhérence et décélération identiques dans un modèle simplifié, doubler la vitesse multiplie la distance de freinage
    par {{c1::4}}.
  explication: La distance de réaction, elle, double si le temps de réaction reste identique. La distance d’arrêt totale ne
    quadruple donc pas automatiquement ; voir les exercices sur les deux composantes.
  theme: C
  sous_theme: distances
  source: "securite-routiere.gouv.fr, La vitesse et la conduite ; Ornikar, Énergie cinétique"
  prerequis:
  - c-distance-arret-composantes
- id: c-intervalle-2s
  explication: 'La règle est temporelle : deux secondes au minimum, davantage selon les conditions. Le calcul physique donne environ 28 m à 50 km/h et 72 m à 130 km/h ; le raccourci « dizaines × 3 » par seconde (30 et 78 m) n’est qu’une approximation.'
  theme: C
  sous_theme: distances
  source: "Code de la route, art. R412-12 ; Codes Rousseau, Calcul des distances"
  rappels:
  - Entre deux voitures qui se suivent, l’intervalle minimal réglementaire correspond à la distance parcourue pendant
    au moins {{c1::2 secondes}}.
  - 'Ne pas respecter la distance de sécurité : 135 € et un retrait de {{c2::3 points}}.'
- id: c-intervalle-pl-tunnel
  texte: Hors agglomération, ma voiture tractant une caravane forme un ensemble de plus de 7 m ; derrière un poids lourd
    ou un autre long ensemble roulant à la même vitesse, je garde au moins {{c1::50 m}}.
  explication: 'En tunnel, respecter la distance affichée : elle diffère souvent en circulation et à l’arrêt.'
  theme: C
  sous_theme: distances
  source: "Code de la route, R412-12 ; CETU, sécurité des usagers en tunnel"
- id: c-autoroute-deux-traits
  texte: 'Sur autoroute, repère visuel usuel d''intervalle : laisser au moins {{c1::2 traits}} complets de la ligne de rive
    de la bande d''arrêt d''urgence, davantage selon les conditions.'
  explication: 'Deux traits de rive complets et leur intervalle font 39 + 13 + 39 = 91 m, soit environ 90 m. À 130 km/h, deux
    secondes représentent environ 72 m : le repère des traits laisse une marge. Augmenter encore l’intervalle si nécessaire.'
  theme: C
  sous_theme: distances
  source: "securite-routiere.gouv.fr, La vitesse et la conduite ; IISR 7e partie, art. 113-1"
  comparaisons:
  - ref: marq-ligne-bau-t4
    legende: 'Ligne de rive de la bande d’arrêt d’urgence : longs traits espacés.'
- id: c-acuite-5-10
  texte: Pour le permis B, le seuil d’acuité visuelle binoculaire est d’au moins {{c1::5/10}}, avec correction si nécessaire.
  explication: 'Arrêté du 28 mars 2022 : acuité binoculaire ≥ 5/10 (si un œil voit moins de 1/10, l''autre doit atteindre
    5/10) et champ visuel horizontal ≥ 120°. Avec lunettes ou lentilles obligatoires, le permis porte le code 01 : conduire
    sans, c''est 135 € et 3 points. La baisse de la vue est progressive et passe inaperçue : contrôle régulier conseillé.'
  theme: C
  sous_theme: perception
  source: "Arrêté du 28 mars 2022 ; En Voiture Simone, Acuité visuelle ; Code de la route, art. R221-1-1"
- id: c-fatigue-pause-chiffres
  explication: 'Une pause de 15 à 20 minutes est un repère, pas une garantie : elle ne permet pas de continuer malgré les
    paupières lourdes. Une courte sieste ne compense pas toute dette de sommeil ; changer de conducteur ou interrompre le
    trajet si nécessaire.'
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, La fatigue et la conduite"
  rappels:
  - Sur un long trajet, une pause est recommandée au moins toutes les {{c1::2 heures}}, avant tout signe de fatigue.
  - En cas de somnolence au volant, s’arrêter en sécurité sans attendre et dormir {{c2::15 à 20 min}} ; ne repartir
    qu’en état de conduire.
- id: c-verre-standard
  texte: Un verre standard (demi de bière, verre de vin, dose de whisky servis au bar) contient environ {{c1::10 g}} d’alcool
    pur.
  explication: 'Bière 25 cl à 5°, vin 10 cl à 12°, whisky 3 cl à 40° : doses différentes, même quantité d’alcool pur.
    Changer de boisson ne change donc rien à l’alcoolémie ; à la maison, les verres sont souvent plus remplis qu’au
    bar.'
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, L'alcool et la conduite ; Code en Poche"
- id: c-verre-alcoolemie
  texte: 'Repère moyen : chaque verre standard fait monter l''alcoolémie d''environ {{c1::0,20 à 0,25 g/L}}.'
  explication: Davantage à jeun, pour une personne légère ou une femme ; deux verres peuvent donc suffire à atteindre 0,5 g/L, et un seul le seuil probatoire de 0,2 g/L.
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, L’alcool et la conduite"
  prerequis:
  - c-alcool-seuils-sang
  - c-verre-standard
- id: c-alcool-elimination
  explication: Le taux varie selon la personne et les conditions ; pas de règle fixe « heures par verre ». Café, douche ou
    sport n’accélèrent pas l’élimination. Une alcoolémie peut rester excessive le lendemain.
  theme: C
  sous_theme: deficiences
  source: "Sécurité routière, https://www.securite-routiere.gouv.fr/sites/default/files/2024-03/depliant_alcool-conduite-070823.pdf"
  rappels:
  - 'Repère moyen, sans garantie individuelle : l’alcoolémie baisse d’environ {{c1::0,10 à 0,15 g/L}} par heure.'
  - Le pic d’alcoolémie survient environ {{c2::30 min}} après absorption à jeun (environ 1 h au cours d’un repas).
- id: c-conversion-air-sang
  explication: 'Le chiffre en mg/L d’air est la moitié du chiffre en g/L de sang : 0,2 g/L ↔ 0,10 mg/L, 0,8 g/L ↔
    0,40 mg/L. Ce sont des correspondances réglementaires entre deux unités. Lire « sang » ou « air » avant de répondre.'
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, L'alcool et la conduite ; Code de la route, art. R234-1"
  rappels:
  - Au seuil de 0,5 g/L de sang correspond le seuil légal de {{c1::0,25 mg/L}} d’air expiré.
  prerequis:
  - c-alcool-seuils-sang
- id: c-medicaments-niveaux
  explication: Somnifères et anxiolytiques (benzodiazépines), certains antihistaminiques, antitussifs et antalgiques sont
    concernés ; environ un tiers des médicaments portent un pictogramme, y compris sans ordonnance. Ne jamais associer à l'alcool.
  theme: C
  sous_theme: deficiences
  source: "ANSM, Médicaments et conduite ; arrêté du 8 août 2008 (CSP, art. R5121-139) ; securite-routiere.gouv.fr, Les médicaments et la conduite"
  rappels:
  - 'Pictogramme médicaments de niveau 1 (jaune) : {{c1::lire la notice}} avant de conduire.'
  - 'Pictogramme médicaments de niveau 2 (orange) : ne pas conduire sans {{c2::l’avis d’un professionnel de santé}}.'
  - 'Pictogramme médicaments de niveau 3 (rouge) : {{c3::ne pas conduire}} ; demander un avis médical pour reprendre.'
- id: c-alcool-seuils-sang
  theme: C
  sous_theme: deficiences
  rappels:
  - 'Conducteur de voiture hors probatoire, sans restriction EAD : la conduite est interdite dès {{c1::0,5
    g/L}} d’alcool dans le sang.'
  - 'Élève conducteur ou permis probatoire : la conduite est interdite dès {{c2::0,2 g/L}} d’alcool dans le
    sang.'
  explication: 'Le seuil est inclus : il faut être en dessous. Lire sang ou air expiré ; aucun nombre de verres
    ne garantit le résultat. Zéro alcool reste le choix sûr.'
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2881"
- id: c-energie-choc
  texte: Heurter un obstacle à 50 km/h équivaut à une chute d’environ {{c1::10 m}}, soit un troisième étage.
  explication: 'L’énergie du choc croît avec le carré de la vitesse : à vitesse doublée, elle est multipliée par quatre.
    À 50 km/h (14 m/s), la hauteur de chute équivalente vaut v²/2g ≈ 10 m. C’est pourquoi quelques km/h de moins
    réduisent fortement la gravité d’un choc, surtout pour un piéton.'
  theme: C
  sous_theme: distances
  source: 'Relation physique : énergie cinétique ½mv², hauteur équivalente v²/2g'
