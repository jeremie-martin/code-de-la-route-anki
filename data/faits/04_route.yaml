- id: r-train-distance-arret
  texte: 'Ordre de grandeur SNCF : un train lancé à 100 km/h peut avoir besoin d’environ {{c1::1 km}} pour s’arrêter.'
  explication: 'Ce n’est pas une garantie de freinage pour tout train. Il ne peut pas s’écarter : respecter les
    signaux et vérifier qu’on peut dégager entièrement les rails avant de s’engager.'
  theme: R
  sous_theme: passages_a_niveau
  source: "SNCF Réseau, Sécurité aux passages à niveau ; securite-routiere.gouv.fr, Passage à niveau"
- id: r-loi-montagne-periode
  texte: Dans les communes concernées par l’obligation saisonnière d’équipements hiver, la période annuelle est
    du {{c1::1er novembre au 31 mars}}.
  explication: Pendant cette période, dans la zone signalée, une voiture doit avoir quatre pneus hiver marqués du symbole alpin (3PMSF), ou
    des dispositifs antidérapants amovibles (chaînes, chaussettes) pour au moins deux roues motrices.
  theme: R
  sous_theme: intemperies
  source: Décret n° 2020-1264 du 16 octobre 2020 ; service-public.fr F19459
  comparaisons:
  - ref: b58
    legende: Entrée de zone d’équipement hivernal.
- id: r-tunnel-niches
  texte: 'Incendie dans un tunnel : pour me protéger de la fumée, je rejoins {{c1::une issue de secours}}, pas une niche
    d’appel.'
  explication: Les niches de sécurité servent à alerter et à trouver un extincteur ; elles ne protègent pas de la fumée.
    Repérer les flèches et distances vers les issues ; leur espacement varie selon le tunnel.
  theme: R
  sous_theme: tunnels
  source: "CETU, Conduire en tunnel"
  comparaisons:
  - ref: ce30a
    legende: Issue de secours.
  - ref: ce2a
    legende: Poste d’appel d’urgence.
- id: r-autoroute-sortie-annonces
  explication: La manœuvre doit être achevée au plus tard au début de la bretelle. Chaque sortie porte un numéro repris
    sur les panneaux.
  theme: R
  sous_theme: autoroute
  source: IISR, 5e partie (art. 83 et 84) ; Code de la route, art. R421-4
  rappels:
  - Sur autoroute, quand les sorties sont espacées, une sortie est d’abord annoncée à environ {{c1::2 000 m}}.
  - Sur autoroute, une sortie est présignalée à environ {{c2::1 000 m}}, puis signalée au début de la voie de décélération.
  comparaisons:
  - ref: d50
    legende: 'Avertissement : la sortie approche (environ 2 000 m) ; la présignalisation suit vers 1 000 m.'
