- id: m-pneus-chiffres
  explication: '« À froid » : après deux heures d’arrêt ou moins de 3 km ; un pneu chaud affiche plus, on ne le dégonfle
    pas. Roue de secours comprise. Véhicule chargé : appliquer la pression prévue par le constructeur pour cette charge.'
  theme: M
  sous_theme: pneus
  source: Michelin, https://www.michelin.fr/auto/conseils/pression-pneus/gonfler-pneus ; notices constructeurs (étiquette
    de pression)
  rappels:
  - Pour comparer la pression d’un pneu à la valeur de référence du constructeur, la mesurer à {{c1::froid}}.
  - 'Repère d’entretien : vérifier la pression au moins une fois par {{c2::mois}} et avant un long trajet.'
- id: m-pneus-hiver-chiffres
  explication: Les pneus cloutés ne sont autorisés que pendant une période hivernale fixée par arrêté. Des pneus hiver ordinaires (3PMSF) n’imposent pas de plafond particulier.
  theme: M
  sous_theme: pneus
  source: Code de la route, art. R413-7 et R314-3 ; Stych
  texte: Avec des pneus cloutés, la vitesse est plafonnée à {{c1::90 km/h}}, sans relever une limite plus basse.
- id: m-feux-portees
  explication: Distinguer « être visible » (position) et « éclairer » (croisement, route). Ces minima réglementaires
    par temps clair ne décrivent pas une portée réelle garantie en pluie, brouillard ou face à un obstacle sombre.
  theme: M
  sous_theme: feux
  source: Code de la route, art. R313-2 à R313-4
  rappels:
  - De nuit par temps clair, les feux de position avant doivent être visibles à {{c1::150 m}}.
  - De nuit par temps clair, les feux de croisement doivent éclairer efficacement à au moins {{c2::30 m}}.
  - De nuit par temps clair, les feux de route doivent éclairer efficacement à au moins {{c3::100 m}}.
  comparaisons:
  - ref: voyant-position
    legende: 'Feux de position : être vu.'
  - ref: voyant-croisement
    legende: 'Feux de croisement : éclairer sans éblouir.'
  - ref: voyant-route
    legende: 'Feux de route : éclairer loin ; ils éblouissent.'
