  image:
    commons: France road sign C1a.svg
  nom: Lieu aménagé pour le stationnement
  signification: Indique un parking ou un emplacement aménagé pour le stationnement (gratuit, sauf indication).
  conduite: Se garer uniquement sur les emplacements ; des panonceaux (M4, M6, M3b) précisent catégories, conditions et direction.
  complement: En position (à l'entrée du parking) ou en présignalisation avec panonceau de direction M3b.
