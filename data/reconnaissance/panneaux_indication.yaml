- id: c4a
  type: panneau
  code: C4a
  image:
    commons: France road sign C4a (50).svg
  nom: Vitesse conseillée
  signification: Indique la vitesse à laquelle il est conseillé de circuler si les circonstances le permettent (ex. virage, sortie). Ce n'est pas une obligation.
  conduite: Adapter sa vitesse à la valeur conseillée ; on peut rouler moins vite, et légalement plus vite dans la limite réglementaire, mais c'est déconseillé.
  complement: 'En position uniquement. Fin : C4b. Carré bleu = indication (conseil) ; rond rouge = interdiction (maximum) ; rond bleu = obligation (minimum).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
