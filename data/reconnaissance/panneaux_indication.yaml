  nom: Voie verte
  signification: 'Voie réservée à la circulation des piétons et des véhicules non motorisés (cycles, rollers, cavaliers selon arrêté) : interdite à tous les véhicules à moteur (créé en 2008).'
  conduite: 'En voiture : ne pas s''y engager.'
