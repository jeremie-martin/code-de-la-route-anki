  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Le triangle annonce un passage pour piétons plus loin ; le carré bleu en indique l’emplacement.
  comparaisons:
  - ref: a13b
    legende: 'Triangle : passage pour piétons plus loin.'
