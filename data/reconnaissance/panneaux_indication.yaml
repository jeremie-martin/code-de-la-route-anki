  code: C20c
  image:
    commons: France road sign C20c.svg
  nom: Traversée de tramways
  signification: Indique la position d'une traversée de voies de tramway ; le tramway est prioritaire.
  conduite: Céder le passage au tramway, ne pas s'immobiliser sur les rails.
