- id: c18
  type: panneau
  code: C18
  image:
    commons: France road sign C18.svg
  nom: Priorité par rapport à la circulation venant en sens inverse
  signification: Dans ce passage étroit, j’ai la priorité sur les véhicules venant en sens inverse.
  conduite: 'S''engager en restant prudent : la priorité ne dispense pas de vérifier que l''autre a bien cédé le passage.'
  complement: En face, le panneau rond bordé de rouge impose aux autres véhicules de me céder le passage.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Ma direction est celle de la flèche vers le haut. La flèche rouge descendante représente le sens opposé : c’est lui qui cède.'
  comparaisons:
  - ref: b15
    legende: 'De l’autre côté : le sens opposé doit céder.'
- id: c20a
  type: panneau
  code: C20a
  image:
    commons: France road sign C20a.svg
  nom: Passage pour piétons (panneau de position)
  signification: Position d'un passage pour piétons matérialisé au sol.
  conduite: Céder le passage aux piétons engagés ou qui manifestent l'intention de traverser ; ne pas dépasser devant un passage.
  complement: Arrêt et stationnement interdits dans les 5 m en amont du passage, hors emplacements matérialisés ; ces emplacements doivent avoir disparu au 31 décembre 2026.
