- id: c65a
  type: panneau
  code: C65a
  image:
    commons: France road sign C65a.svg
  nom: 'Péage en flux libre : moyens de paiement'
  signification: 'Péage « en flux libre » (sans barrière, plaques lues sous un portique) : indique les moyens de paiement.'
  conduite: Ne pas s'arrêter sous le portique ; payer sous 72 h en ligne, en point de vente ou par télépéage.
  complement: Aux portiques de péage en flux libre (A79, A13/A14). Signalisation récente, généralisée depuis 2022-2024.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c65b
