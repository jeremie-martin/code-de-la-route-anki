  nom: Lieu aménagé pour le stationnement gratuit à durée limitée avec contrôle par disque
  signification: Parking gratuit mais à durée limitée, contrôlé par disque de stationnement (zone bleue).
  conduite: Apposer le disque (heure d'arrivée) et respecter la durée indiquée.
  complement: La version ancienne (C1b-ancien) montrait un disque marqué 1 h 30.
