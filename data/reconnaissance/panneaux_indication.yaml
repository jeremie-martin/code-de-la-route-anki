    commons: France road sign C62.svg
  nom: Présignalisation d'une borne de retrait de ticket de péage
  signification: Annonce une borne où l'on prend un ticket de péage à l'entrée d'une section payante (système fermé).
  conduite: Ralentir, s'arrêter à la borne et prendre le ticket ; ne pas le perdre.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
