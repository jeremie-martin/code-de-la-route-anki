  signification: Indique une voie de péage où le paiement s'effectue auprès d'un agent (péagiste), tous moyens de paiement.
  conduite: Emprunter cette voie si l'on paie en espèces ou en cas de doute.
  complement: Au-dessus de chaque voie de péage.
