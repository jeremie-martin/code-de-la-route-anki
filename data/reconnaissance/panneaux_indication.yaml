  type: panneau
  code: C20b
  image:
    commons: France road sign C20b.svg
  nom: Traversée de voie de véhicules de transport en commun
  signification: Indique la position d'une traversée de voie réservée aux bus (site propre), créé en 2018.
  conduite: Céder le passage aux bus, respecter les feux R24 éventuels.
  complement: À hauteur de la traversée ; annonce par A9a.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
