- id: c65a
  type: panneau
  code: C65a
  image:
    commons: France road sign C65a.svg
  nom: 'Péage en flux libre : moyens de paiement'
  signification: 'Panneau signalant un péage « en flux libre » (sans barrière : les plaques sont lues au passage sous un portique) et indiquant les moyens de paiement : paiement dématérialisé (internet, application), paiement physique (borne, bureau de tabac partenaire) et télépéage par abonnement.'
  conduite: Ne pas s'arrêter sous le portique ; payer dans le délai imparti (72 h en général) en ligne, en point de vente ou automatiquement avec un badge de télépéage, sous peine de majoration.
  complement: En amont et au niveau des portiques de péage en flux libre (ex. A79, A13/A14, A4). Signalisation récente (péage en flux libre généralisé depuis 2022-2024). Dans les anciennes versions de l'IISR, C65a/C65b désignaient la présignalisation des aires annexes (aujourd'hui assurée par les panneaux D46).
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c65b
  type: panneau
  code: C65b
  image:
    commons: France road sign C65b.svg
  nom: 'Péage en flux libre : délai et modalités de paiement pour les non-abonnés'
  signification: Panneau indiquant, pour les usagers sans badge de télépéage, le délai de paiement du péage en flux libre et les solutions de paiement (dématérialisé ou physique).
  conduite: Noter le délai (généralement 72 h après le passage) et payer à temps.
  complement: Sur les sections à péage en flux libre.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
