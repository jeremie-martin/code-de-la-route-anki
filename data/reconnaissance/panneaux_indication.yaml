  type: panneau
  code: C20c
  image:
    commons: France road sign C20c.svg
  nom: Traversée de tramways
  signification: Indique la position d'une traversée de voies de tramway ; le tramway est prioritaire.
  conduite: Céder le passage au tramway, ne pas s'immobiliser sur les rails.
  complement: À hauteur de la traversée ; annonce par A9b.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c23
  type: panneau
  code: C23
  image:
    commons: France road sign C23.svg
  nom: Stationnement réglementé pour les caravanes et les autocaravanes
  signification: Indique un emplacement où le stationnement des caravanes et camping-cars est réglementé (durée, période) selon le panonceau.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c24a
  type: panneau
  code: C24a
  image:
    commons: France road sign C24a.svg
  nom: Conditions particulières de circulation par voie sur la route suivie
  signification: 'Indique, voie par voie, des conditions particulières de circulation sur la route suivie : voie réservée (bus, vélos), voie à contresens, double-sens cyclable, voie réservée aux véhicules lents, etc.'
  conduite: Se placer dans la voie qui correspond à son véhicule et à sa direction ; ne pas emprunter une voie réservée.
  complement: En position, au début de la section. Utilisé notamment pour signaler un double-sens cyclable (voie avec vélo à contresens) et les couloirs bus à contresens.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c24b
  type: panneau
  code: C24b
  image:
    commons: France road sign C24b.svg
  nom: Voies affectées à l'approche d'une intersection
  signification: Indique les voies affectées aux différentes directions à l'approche d'une intersection (présélection).
  conduite: Se placer à l'avance dans la voie correspondant à la direction voulue ; une fois engagé dans une voie de présélection, on doit suivre sa direction.
  complement: En amont de l'intersection.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c24c
  type: panneau
  code: C24c
  image:
    commons: France road sign C24c.svg
  nom: Conditions particulières de circulation sur la route ou la voie embranchée
  signification: Indique les conditions de circulation (sens unique, double-sens cyclable, voie bus…) sur la route que l'on va rejoindre ou croiser.
  conduite: Tenir compte, avant de tourner, de la présence éventuelle d'usagers à contresens sur la voie embranchée (cyclistes).
  complement: Avant l'intersection.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c25a
  type: panneau
  code: C25a
  image:
    commons: France road sign C25a.svg
  nom: Limitations générales de vitesse en France
  signification: Rappel, aux frontières, des vitesses maximales autorisées sur le territoire français par type de route (agglomération 50, route 80, route à chaussées séparées 110, autoroute 130).
  conduite: 'Mémoriser les limitations générales ; par temps de pluie : 110 sur autoroute, 100 sur 2×2 voies, 80 sur route.'
  complement: Aux points d'entrée en France. Depuis le 1er juillet 2018, 80 km/h sur les routes bidirectionnelles sans séparateur (90 possible par décision départementale depuis 2020). Le dessin ci-contre est simplifié (le panneau réel comporte aussi la ligne 110 km/h des routes à chaussées séparées).
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c25b
  type: panneau
  code: C25b
  image:
    commons: France road sign C25b.svg
  nom: Rappel des limitations de vitesse sur autoroute
  signification: 'Rappel des limites de vitesse sur autoroute : 130 km/h par temps sec, 110 km/h par temps de pluie (ou 110/100 sur certaines sections).'
  conduite: Réduire à 110 dès que la chaussée est mouillée (essuie-glaces en marche).
  complement: 'Sur autoroute, après les péages et échangeurs. Jeune conducteur (permis probatoire) : 110 sur autoroute, 100 sur 2×2 voies, 80 sur route, quelles que soient les conditions.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c26a
  type: panneau
  code: C26a
  image:
    commons: France road sign C26a.svg
  nom: Voie de détresse à droite
  signification: Indique une voie de détresse (lit d'arrêt en gravier remontant) située à droite, permettant d'arrêter un véhicule dont les freins ont lâché dans une descente.
  conduite: En cas de défaillance des freins, s'y engager sans hésiter ; sinon ne jamais s'y arrêter ni y stationner.
  complement: En position et en présignalisation, en fin de descente dangereuse ; damier rouge et blanc au sol à l'entrée.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c26b
  type: panneau
  code: C26b
  image:
    commons: France road sign C26b.svg
  nom: Voie de détresse à gauche
  signification: Voie de détresse située à gauche de la chaussée.
  conduite: Même conduite que C26a.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c27
  type: panneau
  code: C27
  image:
    commons: France road sign C27.svg
  nom: Surélévation de chaussée
  signification: Indique la position d'un ralentisseur (dos-d'âne, plateau surélevé, coussin) ; souvent limité à 30 km/h.
  conduite: Franchir à vitesse très réduite (30 km/h maximum, souvent moins) ; ne pas dépasser sur le ralentisseur.
  complement: 'En position, au niveau du ralentisseur, sans panonceau. Annonce préalable par A2b (sauf en zone 30 où la signalisation est facultative). Triangle A2b = annonce ; carré bleu C27 = position. Marquage au sol : trois triangles blancs sur le dos-d''âne (« dents de requin »).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c28
  type: panneau
  code: C28
  image:
    commons: France road sign C28.svg
  nom: Réduction du nombre de voies
  signification: Indique une réduction du nombre de voies sur une route à chaussées séparées ou un créneau de dépassement (ex. passage de 3 à 2 voies, de 2 à 1).
  conduite: Se rabattre à temps sur la voie qui subsiste (généralement la droite), en alternant courtoisement (fermeture éclair) en cas de bouchon.
  complement: 'En présignalisation puis en position ; un panonceau M1 peut préciser la distance. Version temporaire jaune : KD10. En cas de rétrécissement, celui qui reste dans sa voie qui continue est prioritaire ; celui dont la voie disparaît doit s''insérer.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c29a
  type: panneau
  code: C29a
  image:
    commons: France road sign C29a.svg
  nom: Présignalisation d'un créneau de dépassement
  signification: Annonce, avec la distance, un créneau de dépassement (section à trois voies avec deux voies dans un sens, ou passage à chaussées séparées).
  conduite: Se préparer à dépasser sur le créneau plutôt qu'avant.
  complement: Avant le créneau, avec distance.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c29b
  type: panneau
  code: C29b
  image:
    commons: France road sign C29b.svg
  nom: 'Créneau de dépassement à trois voies : deux voies dans mon sens'
  signification: 'Début d''un créneau de dépassement : la chaussée comporte trois voies dont deux affectées à mon sens de circulation ; le dépassement y est facilité.'
  conduite: Utiliser la voie de gauche uniquement pour dépasser, puis se rabattre avant la fin du créneau (annoncée par C30).
  complement: 'Au début du créneau ; panonceau M2 possible (longueur). Fin : C30.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c29c
  type: panneau
  code: C29c
  image:
    commons: France road sign C29c.svg
  nom: 'Section de route à trois voies : une voie dans mon sens, deux dans l''autre'
  signification: 'La chaussée comporte trois voies dont une seule dans mon sens : les deux autres sont affectées au sens inverse. Interdiction d''utiliser la voie centrale pour dépasser.'
  conduite: Rester dans sa voie ; pas de dépassement (ligne continue en général).
  piege: 'Piège classique : sur une route à trois voies, la voie du milieu appartient au sens qui a deux flèches ; ne pas s''y engager si l''on n''a qu''une flèche.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c30
  type: panneau
  code: C30
  image:
    commons: France road sign C30.svg
  nom: Fin d'un créneau de dépassement à trois voies affectées
  signification: 'Annonce la fin du créneau de dépassement : les deux voies du même sens se réduisent à une.'
  conduite: Se rabattre à droite en toute sécurité avant la fin du créneau (flèches de rabattement au sol).
  complement: En présignalisation (avec M1) puis en position.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c50
  type: panneau
  code: C50
  image:
    commons: France road sign C50.svg
  nom: Indications diverses
  signification: Panneau d'indication portant une inscription ou un pictogramme non prévu ailleurs (ex. « Zone de covoiturage », « Contrôle radar », « Nouveau régime de priorité »).
  conduite: Lire l'information.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  complement: 'Exemple ci-contre : mention locale autorisant l''arrêt sur le trottoir — cas exceptionnel, l''arrêt sur trottoir étant sinon très gênant (135 €).'
