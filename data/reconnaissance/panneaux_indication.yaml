  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c14
  type: panneau
  code: C14
  image:
    commons: France road sign C14.svg
  nom: Praticabilité d'une section de route
  signification: Présignale l'état (ouvert / fermé, chaînes obligatoires) d'un col, d'un tunnel ou d'une route de montagne, sur des volets amovibles.
  conduite: Choisir un autre itinéraire si la section est fermée ; prévoir l'équipement indiqué.
  complement: Avant le dernier carrefour permettant d'éviter la section. Jamais complété d'un panonceau.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c18
  type: panneau
  code: C18
  image:
    commons: France road sign C18.svg
  nom: Priorité par rapport à la circulation venant en sens inverse
  signification: Dans un passage étroit, le conducteur a la priorité par rapport aux véhicules venant en sens inverse (qui, eux, voient le panneau B15 et doivent céder le passage).
  conduite: 'S''engager en restant prudent : la priorité ne dispense pas de vérifier que l''autre a bien cédé le passage.'
  complement: En position, à l'entrée du passage étroit, côté prioritaire. C18 = carré bleu = je suis prioritaire ; B15 = rond rouge = je cède. La flèche rouge est celle de l'usager qui cède.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c20a
  type: panneau
  code: C20a
  image:
    commons: France road sign C20a.svg
  nom: Passage pour piétons (panneau de position)
  signification: Indique la position d'un passage pour piétons (panneau de position, à hauteur du passage matérialisé au sol).
  conduite: Céder le passage aux piétons engagés ou qui manifestent l'intention de traverser ; ne pas dépasser un véhicule arrêté devant un passage ; ne pas s'arrêter sur le passage (ni stationner à moins de 5 m en amont).
  complement: 'À hauteur du passage piéton ; l''annonce se fait 150 m avant avec A13b. Panonceau M9d si passage surélevé. Triangle A13b = annonce (danger) ; carré bleu C20a = position. Arrêt et stationnement interdits 5 m en amont d''un passage piéton, hors emplacements matérialisés (R417-11, décret 2015-808 : très gênant, 135 €) ; la loi LOM impose la suppression de ces emplacements d''ici fin 2026.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
