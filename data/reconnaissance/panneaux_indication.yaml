- id: c1a
  type: panneau
  code: C1a
  image:
    commons: France road sign C1a.svg
  nom: Lieu aménagé pour le stationnement
  signification: Indique un parking ou un emplacement aménagé pour le stationnement (gratuit, sauf indication).
  conduite: 'Je me gare sur les emplacements autorisés et lis les panonceaux : usagers concernés, conditions et direction du parking.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: c4a
  type: panneau
  code: C4a
  image:
    commons: France road sign C4a (50).svg
  nom: Vitesse conseillée
  signification: Indique la vitesse à laquelle il est conseillé de circuler si les circonstances le permettent (ex. virage, sortie). Ce n'est pas une obligation.
  conduite: Adapter sa vitesse à la valeur conseillée ; on peut rouler moins vite, et légalement plus vite dans la limite réglementaire, mais c'est déconseillé.
  complement: Carré bleu = indication (conseil) ; rond rouge = interdiction (maximum) ; rond bleu = obligation (minimum).
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: c6
  type: panneau
  code: C6
  image:
    commons: France road sign C6.svg
  nom: Arrêt d'autobus ou d'autocar
  signification: Indique un arrêt de bus ou de car de ligne régulière ; l'arrêt et le stationnement des autres véhicules y sont interdits (zigzag jaune au sol).
  conduite: Ne pas s'arrêter sur l'emplacement. En agglomération, ralentir et au besoin s'arrêter pour laisser le bus quitter son arrêt (R412-11) ; son clignotant annonce ce départ.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: c8
  type: panneau
  code: C8
  image:
    commons: France road sign C8.svg
  nom: Emplacement d'arrêt d'urgence
  signification: Indique un emplacement (refuge) où l'arrêt d'urgence est possible sur une route sans bande d'arrêt d'urgence (autoroute, route à chaussées séparées, tunnel).
  conduite: Je n’y stationne qu’en cas de panne ou d’urgence ; les panonceaux peuvent signaler un poste d’appel ou un extincteur.
  complement: Un arrêt hors urgence sur cet emplacement est interdit.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: c12
  type: panneau
  code: C12
  image:
    commons: France road sign C12.svg
  nom: Circulation à sens unique
  signification: 'La chaussée est à sens unique : tous les véhicules circulent dans le sens de la flèche ; le demi-tour y est interdit, puisqu''il ferait circuler à contresens.'
  conduite: Rester à droite, sauf pour tourner à gauche ou dépasser ; attention aux cyclistes à contresens si double-sens cyclable.
  complement: À l’autre extrémité, un sens interdit empêche les véhicules d’entrer face à moi.
  piege: La flèche sur fond bleu carré indique un sens unique ; dans un rond bleu, elle impose d’aller tout droit.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: b21b
    legende: 'Rond bleu : tout droit obligatoire.'
