- id: c207
  type: panneau
  code: C207
  image:
    commons: France road sign C207.svg
  nom: Début d'une section d'autoroute
  signification: 'Début d''autoroute : route réservée aux véhicules à moteur rapides (interdite aux piétons, cycles, cyclomoteurs, tracteurs, véhicules ne pouvant dépasser 40 km/h), sans croisement à niveau. Vitesse maximale 130 km/h (110 par temps de pluie, 110 permis probatoire, 50 si visibilité < 50 m), minimale 80 km/h sur la voie la plus à gauche par conditions normales. Interdits : arrêt, stationnement, marche arrière, demi-tour, circulation sur la bande d''arrêt d''urgence.'
  conduite: S'insérer via la voie d'accélération en cédant le passage aux véhicules déjà sur l'autoroute, rouler à droite, ne dépasser que par la gauche, respecter les distances (règle des « deux traits » de la ligne de rive ; 2 s ≈ 73 m à 130 km/h).
  complement: 'Au début de l''autoroute, en position. Fin : C208.'
  piege: 'autoroute = pictogramme du pont (C207) ; route pour automobiles = voiture de face (C107). Sur autoroute, l''arrêt même bref sur la BAU hors urgence est interdit ; en cas de panne : feux de détresse, gilet, tout le monde derrière la glissière, borne d''appel d''urgence (tous les 2 km).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c208
  type: panneau
  code: C208
  image:
    commons: France road sign C208.svg
  nom: Fin d'une section d'autoroute
  signification: 'Fin de l''autoroute : retour aux règles ordinaires (intersections, usagers lents, vitesse 80/90 ou 110).'
  conduite: 'Ralentir en conséquence : l''impression de lenteur après l''autoroute est trompeuse (contrôler le compteur).'
  complement: À la fin de la section ; souvent précédé d'une présignalisation avec distance.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
