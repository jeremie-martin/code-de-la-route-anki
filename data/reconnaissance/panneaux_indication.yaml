- id: c64d
  type: panneau
  code: C64d
  image:
    commons: France road sign C64d2.svg
  nom: 'Voie de péage : paiement par abonnement (télépéage)'
  signification: Voie réservée aux véhicules équipés d'un badge de télépéage ; passage sans arrêt à vitesse réduite (30 km/h).
  conduite: N'emprunter cette voie qu'avec un badge ; rouler à 30 km/h maximum, ne pas talonner le véhicule précédent.
  theme: L
  sous_theme: panneaux
  importance: utile
