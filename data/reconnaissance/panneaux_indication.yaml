  nom: 'Péage en flux libre : rappel de paiement en sortie de zone'
  signification: Panneau rappelant à l'usager qui sort d'une zone à péage en flux libre qu'il doit penser à payer son péage.
  conduite: Payer le péage dans les délais si ce n'est pas fait automatiquement.
  complement: En sortie de zone à péage en flux libre.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c107
  type: panneau
  code: C107
  image:
    commons: France road sign C107.svg
  nom: Route à accès réglementé
  signification: 'Début d''une route (voie express, route pour automobiles) réservée aux véhicules à moteur : interdite aux piétons, cycles, cyclomoteurs, tracteurs et véhicules lents, véhicules à traction animale. Interdiction d''arrêt, de stationnement, de demi-tour et de marche arrière. Vitesse maximale 110 km/h si 2×2 voies avec séparateur (100 par temps de pluie), 80 sur route bidirectionnelle.'
  conduite: S'insérer à l'aide de la voie d'accélération ; ne pas s'arrêter sur la chaussée ; respecter la limite (souvent 110 ou 90 selon panneau).
  complement: 'Au début de la section, après le dernier accès ouvert à tous. Fin : C108.'
  piege: 'C107 (voiture de face, bleu) = route pour automobiles à accès réglementé (110 max) ≠ C207 (autoroute : pont blanc sur fond bleu, 130 max). Un panonceau M11a peut porter des dérogations.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c108
  type: panneau
  code: C108
  image:
    commons: France road sign C108.svg
  nom: Fin de route à accès réglementé
  signification: Fin de la route à accès réglementé ; retour aux règles ordinaires (usagers lents admis, vitesse 80/90, intersections).
  conduite: Réduire la vitesse, se méfier des usagers lents et des intersections.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c111
  type: panneau
  code: C111
  image:
    commons: France road sign C111.svg
  nom: Entrée d'un tunnel
  signification: 'Indique l''entrée d''un tunnel. Obligations liées : allumer les feux de croisement, interdiction de faire demi-tour, de s''arrêter ou de stationner hors emplacements d''arrêt d''urgence ; respecter les distances de sécurité (souvent B17).'
  conduite: Allumer les feux de croisement, retirer les lunettes de soleil, garder ses distances (au moins 2 s ; ou l'intervalle du B17), ne pas dépasser si interdit, en cas d'arrêt d'urgence couper le moteur et allumer les feux de détresse.
  complement: 'À l''entrée des tunnels de plus de 300 m (obligatoire) ; panonceau M10z avec le nom du tunnel, M2 avec la longueur. Fin : C112. Bien que carré bleu (indication), C111 emporte des obligations et interdictions (feux de croisement, pas de demi-tour, pas d''arrêt). Souvent enseigné comme « C9 » dans d''anciens supports : le code correct est C111.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c112
  type: panneau
  code: C112
  image:
    commons: France road sign C112.svg
  nom: Sortie de tunnel
  signification: Indique la sortie du tunnel ; fin des règles spécifiques.
  conduite: Attention à l'éblouissement et au vent latéral en sortie.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c113
  type: panneau
  code: C113
  image:
    commons: France road sign C113.svg
  nom: Piste ou bande cyclable conseillée et réservée aux cycles
  signification: 'Piste ou bande cyclable conseillée : les cyclistes peuvent l''emprunter (pas d''obligation) ; elle leur est réservée : interdiction pour les autres véhicules d''y circuler ou stationner.'
  conduite: 'En voiture : ne pas y rouler ni y stationner ; attention aux cyclistes qui peuvent aussi choisir la chaussée.'
  complement: 'Au début de l''aménagement. Fin : C114. Carré bleu = conseillé (C113) ; rond bleu = obligatoire (B22a).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
