- id: c3
  type: panneau
  code: C3
  image:
    commons: France road sign C3.svg
  nom: Risque d'incendie
  signification: 'Indique une zone (forêt) exposée aux incendies : « Attention au feu ».'
  conduite: Ne pas jeter de mégot, ne pas allumer de feu, ne pas stationner sur l'herbe sèche (pot d'échappement).
  complement: En position, dans les massifs forestiers.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c4a
  type: panneau
  code: C4a
  image:
    commons: France road sign C4a (50).svg
  nom: Vitesse conseillée
  signification: Indique la vitesse à laquelle il est conseillé de circuler si les circonstances le permettent (ex. virage, sortie). Ce n'est pas une obligation.
  conduite: Adapter sa vitesse à la valeur conseillée ; on peut rouler moins vite, et légalement plus vite dans la limite réglementaire, mais c'est déconseillé.
  complement: 'En position uniquement. Fin : C4b. Carré bleu = indication (conseil) ; rond rouge = interdiction (maximum) ; rond bleu = obligation (minimum).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c4b
  type: panneau
  code: C4b
  image:
    commons: France road sign C4b (50).svg
  nom: Fin de vitesse conseillée
  signification: Fin de la section à vitesse conseillée.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c5
  type: panneau
  code: C5
  image:
    commons: France road sign C5.svg
  nom: Station de taxis
  signification: Indique une station de taxis ; l'arrêt et le stationnement des autres véhicules y sont interdits.
  conduite: Ne pas s'arrêter ni stationner sur l'emplacement réservé.
  complement: En position, au début (et éventuellement à la fin) de la zone réservée.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c6
  type: panneau
  code: C6
  image:
    commons: France road sign C6.svg
  nom: Arrêt d'autobus ou d'autocar
  signification: Indique un arrêt de bus ou de car de ligne régulière ; l'arrêt et le stationnement des autres véhicules y sont interdits (zigzag jaune au sol).
  conduite: Ne pas s'arrêter sur l'emplacement ; en agglomération, ralentir et au besoin s'arrêter pour laisser le bus quitter son arrêt (R412-11) — il annonce son départ par le clignotant.
  complement: En position, à l'arrêt. En agglomération, on doit ralentir et au besoin s'arrêter pour laisser un bus quitter son arrêt.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c8
  type: panneau
  code: C8
  image:
    commons: France road sign C8.svg
  nom: Emplacement d'arrêt d'urgence
  signification: Indique un emplacement (refuge) où l'arrêt d'urgence est possible sur une route sans bande d'arrêt d'urgence (autoroute, route à chaussées séparées, tunnel).
  conduite: N'y stationner qu'en cas de panne ou d'urgence ; panonceaux M9e/M9f signalent un poste d'appel d'urgence et/ou un extincteur.
  complement: En position. Un arrêt hors urgence sur un tel emplacement est interdit.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c9
  type: panneau
  code: C9
  image:
    commons: France road sign C9.svg
  nom: Station d'autopartage
  signification: Emplacement d'arrêt et de stationnement réservé aux véhicules bénéficiant du label « autopartage » (créé par l'arrêté du 31 décembre 2012).
  conduite: Ne pas y stationner avec un véhicule personnel.
  piege: 'Attention : dans certains cours de code, « C9 » est utilisé à tort pour le tunnel ; le tunnel est C111.'
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c12
  type: panneau
  code: C12
  image:
    commons: France road sign C12.svg
  nom: Circulation à sens unique
  signification: 'Indique que la chaussée est à sens unique : tous les véhicules circulent dans le sens de la flèche ; on peut se placer dans la voie de gauche pour tourner à gauche ou dépasser (les deux côtés sont dans le même sens) ; le demi-tour y est impossible.'
  conduite: Se placer dans la voie adaptée à sa direction (on peut rouler à gauche pour tourner à gauche) ; ne pas faire demi-tour ; attention aux cyclistes en contresens si double-sens cyclable.
  complement: En position, à l'entrée de la voie à sens unique (l'autre extrémité porte un B1).
  piege: C12 (rectangle bleu, flèche) = sens unique (indication) ; B21b (rond bleu, flèche) = tout droit obligatoire. La fin du sens unique peut être signalée par A18 (circulation dans les deux sens).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c13a
  type: panneau
  code: C13a
  image:
    commons: France road sign C13a.svg
  nom: Impasse
  signification: Indique que la voie est une impasse (sans issue) pour les véhicules.
  conduite: Ne pas s'y engager si l'on ne s'y rend pas ; attention aux demi-tours des autres.
  complement: En position, à l'entrée de l'impasse.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c13b
  type: panneau
  code: C13b
  image:
    commons: France road sign C13b.svg
  nom: Présignalisation d'une impasse
  signification: Annonce qu'une voie adjacente (à droite ou à gauche) est une impasse.
  conduite: Ne pas emprunter la voie latérale si l'on cherche un itinéraire de passage.
  complement: Avant l'intersection avec l'impasse.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
