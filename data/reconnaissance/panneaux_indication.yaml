  nom: Impasse comportant une issue pour les piétons
  signification: Impasse pour les véhicules, mais avec une issue pour les piétons (créé en 2011).
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c13d
  type: panneau
  code: C13d
  image:
    commons: France road sign C13d.svg
  nom: Impasse comportant une issue pour les piétons et les cyclistes
  signification: Impasse pour les véhicules motorisés, avec issue pour les piétons et les cyclistes (créé en 2011).
