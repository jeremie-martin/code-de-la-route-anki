- id: c12
  type: panneau
  code: C12
  image:
    commons: France road sign C12.svg
  nom: Circulation à sens unique
  signification: 'La chaussée est à sens unique : tous les véhicules circulent dans le sens de la flèche ; le demi-tour y est impossible.'
  conduite: Rester à droite, sauf pour tourner à gauche ou dépasser ; attention aux cyclistes à contresens si double-sens cyclable.
  complement: L’autre extrémité de la voie porte un sens interdit (B1).
  piege: C12 (rectangle bleu) = sens unique ; B21b (rond bleu) = tout droit obligatoire.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
