- id: c117
  type: panneau
  code: C117
  image:
    commons: France road sign C117-B21b.svg
  nom: Présignalisation d'un tunnel interdit à certains véhicules transportant des marchandises dangereuses
  signification: Indique aux conducteurs de véhicules transportant des marchandises dangereuses les directions conseillées au prochain carrefour pour éviter un tunnel qui leur est interdit (catégorie du tunnel B à E sur panonceau M11c). Six variantes (C117-b21b à C117-b21e) reprenant les flèches des B21.
  conduite: Ne concerne pas les voitures particulières.
  complement: Avant le carrefour, avec panonceau M11c.
