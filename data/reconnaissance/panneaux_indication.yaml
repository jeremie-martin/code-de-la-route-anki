  conduite: Se placer dans la voie qui correspond à son véhicule et à sa direction ; ne pas emprunter une voie réservée.
  complement: Ici, trois voies dans mon sens, sans voie particulière. Le même panneau sert à signaler un double-sens cyclable (vélo à contresens) ou un couloir bus à contresens.
