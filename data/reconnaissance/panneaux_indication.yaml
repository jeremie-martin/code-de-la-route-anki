  nom: 'Péage en flux libre : délai et modalités de paiement pour les non-abonnés'
  signification: 'Pour les usagers sans télépéage : délai et solutions de paiement du péage en flux libre.'
  conduite: Payer dans le délai indiqué (généralement 72 h).
  complement: Sur les sections à péage en flux libre.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c65c
  type: panneau
  code: C65c
  image:
    commons: France road sign C65c.svg
  nom: 'Péage en flux libre : rappel de paiement en sortie de zone'
  signification: Panneau rappelant à l'usager qui sort d'une zone à péage en flux libre qu'il doit penser à payer son péage.
  conduite: Payer le péage dans les délais si ce n'est pas fait automatiquement.
  complement: En sortie de zone à péage en flux libre.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c107
  type: panneau
  code: C107
  image:
    commons: France road sign C107.svg
  nom: Route à accès réglementé
  signification: 'Début d''une route pour automobiles réservée aux véhicules à moteur : interdite aux piétons, cycles, cyclomoteurs et véhicules lents.'
  conduite: S'insérer par la voie d'accélération ; ni arrêt, ni stationnement, ni demi-tour, ni marche arrière.
  complement: 'Vitesse maximale 110 km/h si 2×2 voies avec séparateur (100 sous la pluie), 80 sur route bidirectionnelle. Fin : C108.'
  piege: C107 (voiture de face) = route pour automobiles, 110 max ; C207 (pont blanc) = autoroute, 130 max.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c108
  type: panneau
  code: C108
  image:
    commons: France road sign C108.svg
  nom: Fin de route à accès réglementé
  signification: Fin de la route à accès réglementé ; retour aux règles ordinaires (usagers lents admis, vitesse 80/90, intersections).
  conduite: Réduire la vitesse, se méfier des usagers lents et des intersections.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c111
  type: panneau
  code: C111
  image:
    commons: France road sign C111.svg
  nom: Entrée d'un tunnel
  signification: 'Entrée d''un tunnel : feux de croisement obligatoires, demi-tour, arrêt et stationnement interdits hors aires d''urgence.'
  conduite: Allumer les feux de croisement, retirer les lunettes de soleil, garder ses distances (2 s ou l'intervalle du B17).
  complement: 'Aux tunnels de plus de 300 m ; panonceau M10z (nom), M2 (longueur). Fin : C112.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Carré bleu (indication) mais il emporte de vraies obligations : feux de croisement, pas de demi-tour, pas d''arrêt.'
- id: c112
  type: panneau
  code: C112
  image:
    commons: France road sign C112.svg
  nom: Sortie de tunnel
  signification: Indique la sortie du tunnel ; fin des règles spécifiques.
  conduite: Attention à l'éblouissement et au vent latéral en sortie.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: c113
  type: panneau
  code: C113
  image:
    commons: France road sign C113.svg
  nom: Piste ou bande cyclable conseillée et réservée aux cycles
  signification: 'Piste ou bande cyclable conseillée : les cyclistes peuvent l''emprunter (pas d''obligation) ; elle leur est réservée : interdiction pour les autres véhicules d''y circuler ou stationner.'
  conduite: 'En voiture : ne pas y rouler ni y stationner ; attention aux cyclistes qui peuvent aussi choisir la chaussée.'
  complement: 'Au début de l''aménagement. Fin : C114. Carré bleu = conseillé (C113) ; rond bleu = obligatoire (B22a).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
