- id: a15c
  type: panneau
  code: A15c
  image:
    commons: France road sign A15c.svg
  nom: Passage de cavaliers
  signification: Annonce un endroit où des cavaliers sont susceptibles de traverser ou de circuler.
  conduite: Ralentir, ne pas klaxonner ni effrayer les chevaux, dépasser avec un large écart et à faible vitesse.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a16
  type: panneau
  code: A16
  image:
    commons: France road sign A16.svg
  nom: Descente dangereuse
  signification: Annonce une descente à forte pente ; le pourcentage indiqué (ex. 10 %) est la pente (dénivelé de 10 m pour 100 m parcourus).
  conduite: Rétrograder pour utiliser le frein moteur, ne pas surchauffer les freins, contrôler sa vitesse ; en montagne, le véhicule descendant facilite le croisement (il doit s'arrêter/reculer si nécessaire).
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Le pourcentage est la pente, pas une vitesse. 10 % = 10 m de dénivelé pour 100 m. Le frein moteur est recommandé.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a17
  type: panneau
  code: A17
  image:
    commons: France road sign A17.svg
  nom: Annonce de feux tricolores
  signification: Annonce des feux de signalisation tricolores (carrefour à feux) souvent masqués ou inattendus (hors agglomération, sortie de virage).
  conduite: Ralentir, se préparer à s'arrêter ; anticiper le passage au jaune.
  complement: 'Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Version temporaire jaune : AK17 (feux de chantier). Un feu jaune clignotant R1 peut être ajouté au sommet du panneau pour renforcer l''alerte.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a18
  type: panneau
  code: A18
  image:
    commons: France road sign A18.svg
  nom: Circulation dans les deux sens
  signification: Annonce qu'après une section à sens unique ou à chaussées séparées, la circulation se fait à nouveau dans les deux sens sur la même chaussée.
  conduite: Serrer à droite, ne plus utiliser la partie gauche de la chaussée comme une voie de circulation dans son sens.
  complement: Implanté au début de la section à double sens (à hauteur du danger), et non 150 m avant comme les autres panneaux de danger.
  piege: 'C''est le seul panneau de danger implanté à l''endroit même du danger (pas à 150 m). Il n''existe pas de panneau « fin de sens unique » : c''est A18 qui signale qu''une voie à sens unique ou à chaussées séparées redevient bidirectionnelle. Ne pas confondre avec C24a (conditions particulières par voie).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a19
  type: panneau
  code: A19
  image:
    commons: France road sign A19.svg
  nom: Risque de chute de pierres
  signification: Annonce un risque de chute de pierres depuis un talus ou une falaise, ou la présence de pierres sur la chaussée.
  conduite: Ralentir, surveiller la chaussée et le talus, ne pas s'arrêter dans la zone.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Le côté du talus dessiné indique d'où viennent les pierres.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a20
  type: panneau
  code: A20
  image:
    commons: France road sign A20.svg
  nom: Débouché sur un quai ou une berge
  signification: Annonce que la route débouche sur un quai, une berge ou un plan d'eau non protégé (risque de chute dans l'eau).
  conduite: Ralentir fortement, ne pas manœuvrer ou stationner près du bord.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a21
  type: panneau
  code: A21
  image:
    commons: France road sign A21.svg
  nom: Débouché de cyclistes venant de droite ou de gauche
  signification: Annonce un endroit où des cyclistes débouchent fréquemment sur la chaussée (sortie de piste cyclable, traversée).
  conduite: Ralentir, contrôler les côtés ; laisser au moins 1 m (agglo) ou 1,5 m (hors agglo) lors du dépassement d'un cycliste.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  piege: triangle = danger (cyclistes qui débouchent) ; rond bleu = piste obligatoire (B22a) ; carré bleu = piste conseillée (C113) ; rond rouge = interdit aux cycles (B9b).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a23
  type: panneau
  code: A23
  image:
    commons: France road sign A23.svg
  nom: Traversée d'une aire de danger aérien
  signification: 'Annonce la traversée d''une zone où des aéronefs volent à basse altitude (proximité d''un aérodrome) : risque de surprise ou d''effet de souffle.'
  conduite: Ne pas se laisser distraire ni s'arrêter ; respecter les feux rouges clignotants s'il y en a.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a24
  type: panneau
  code: A24
  image:
    commons: France road sign A24.svg
  nom: Vent latéral
  signification: Annonce une zone exposée à des vents latéraux violents (pont, viaduc, plaine, sortie de tunnel) ; le panneau est souvent complété par une manche à air (J7) qui montre la force et la direction du vent.
  conduite: Ralentir, tenir fermement le volant à deux mains, garder ses distances des véhicules hauts (poids lourds, caravanes) et des deux-roues, anticiper la fin d'un abri (pile de pont, camion).
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Le symbole du panneau est rouge (exception parmi les symboles noirs des panneaux de danger). La manche à air J7 balise l'endroit précis.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
