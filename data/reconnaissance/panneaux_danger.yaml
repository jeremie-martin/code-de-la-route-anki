- id: a1a
  type: panneau
  code: A1a
  image:
    commons: France road sign A1a.svg
  nom: Virage à droite
  signification: Annonce un virage à droite dangereux (visibilité réduite, rayon serré).
  conduite: Ralentir avant le virage, serrer à droite, ne pas dépasser, adapter l'allure à la visibilité.
  complement: Le sens de la flèche indique le sens du virage.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a1b
  type: panneau
  code: A1b
  image:
    commons: France road sign A1b.svg
  nom: Virage à gauche
  signification: Annonce un virage à gauche dangereux.
  conduite: Ralentir, serrer à droite (ne pas couper le virage), ne pas dépasser.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a1c
  type: panneau
  code: A1c
  image:
    commons: France road sign A1c.svg
  nom: Succession de virages dont le premier est à droite
  signification: Annonce une succession de virages, le premier étant à droite.
  conduite: Ralentir, rester à droite sur toute la section ; un panonceau M2 peut préciser la longueur de la section sinueuse.
  piege: c'est le premier virage dessiné (en bas) qui donne le sens ; ici le premier est à droite.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a1d
  type: panneau
  code: A1d
  image:
    commons: France road sign A1d.svg
  nom: Succession de virages dont le premier est à gauche
  signification: Annonce une succession de virages, le premier étant à gauche.
  conduite: Ralentir, rester à droite sur toute la section.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a2a
  type: panneau
  code: A2a
  image:
    commons: France road sign A2a.svg
  nom: Cassis ou dos-d'âne
  signification: Annonce une déformation naturelle ou accidentelle de la chaussée (creux « cassis » ou bosse « dos-d'âne ») qui n'est pas un aménagement volontaire.
  conduite: Ralentir fortement ; risque de perte d'adhérence et de dommages au véhicule.
  complement: A2a (deux bosses) = déformation de la route ; A2b (une bosse) = ralentisseur construit volontairement.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a2b
  type: panneau
  code: A2b
  image:
    commons: France road sign A2b.svg
  nom: Ralentisseur de type dos-d'âne
  signification: Annonce un ralentisseur aménagé de type dos-d'âne (bosse) destiné à faire ralentir les véhicules.
  conduite: Ralentir à la vitesse indiquée par le panneau B14 qui l'accompagne généralement (30 km/h).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: A2b = annonce (triangle) ; C27 = position (carré bleu).
- id: a3
  type: panneau
  code: A3
  image:
    commons: France road sign A3.svg
  nom: Chaussée rétrécie
  signification: Annonce un rétrécissement de la chaussée par les deux côtés.
  conduite: Ralentir et se replacer au centre de sa voie ; à une seule voie, appliquer la règle du croisement (B15/C18).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a3a
  type: panneau
  code: A3a
  image:
    commons: France road sign A3a.svg
  nom: Chaussée rétrécie par la droite
  signification: Annonce un rétrécissement de la chaussée par la droite.
  conduite: Ralentir, contrôler le rétroviseur gauche avant de se décaler, ne pas dépasser.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a3b
  type: panneau
  code: A3b
  image:
    commons: France road sign A3b.svg
  nom: Chaussée rétrécie par la gauche
  signification: Annonce un rétrécissement de la chaussée par la gauche.
  conduite: Ralentir ; les usagers venant en face peuvent être déportés vers ma voie.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a4
  type: panneau
  code: A4
  image:
    commons: France road sign A4.svg
  nom: Chaussée particulièrement glissante
  signification: Annonce une section de route où l'adhérence est particulièrement réduite (pluie, verglas, gravillons, boue, feuilles, revêtement lisse).
  conduite: Ralentir avant la section, éviter les freinages et accélérations brusques, augmenter les distances de sécurité.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a6
  type: panneau
  code: A6
  image:
    commons: France road sign A6.svg
  nom: Pont mobile
  signification: Annonce un pont mobile (pont levant, tournant, basculant) susceptible d'interrompre la circulation.
  conduite: Ralentir, se préparer à s'arrêter ; respecter les feux rouges clignotants (R24) et barrières.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a7
  type: panneau
  code: A7
  image:
    commons: France road sign A7.svg
  nom: Passage à niveau muni de barrières ou demi-barrières
  signification: Annonce un passage à niveau gardé par des barrières ou demi-barrières (automatiques ou manuelles).
  conduite: Ralentir, être prêt à s'arrêter ; ne jamais s'engager si l'on risque d'être immobilisé sur les voies.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Le dépassement n'est interdit qu'aux passages à niveau SANS barrière ni demi-barrière (R414-12).
- id: a8
  type: panneau
  code: A8
  image:
    commons: France road sign A8.svg
  nom: Passage à niveau sans barrière ni demi-barrière
  signification: Annonce un passage à niveau non gardé (sans barrières), avec ou sans signalisation automatique lumineuse.
  conduite: Ralentir fortement, regarder et écouter ; ne franchir que si aucun train n'est visible ni audible.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  complement: La croix de Saint-André marque le passage lui-même ; un STOP peut la surmonter.
- id: a9a
  type: panneau
  code: A9a
  image:
    commons: France Road Sign A9a.png
  nom: Traversée de voie de véhicules routiers des services réguliers de transport en commun
  signification: Annonce une traversée de voie réservée aux bus.
  conduite: Ralentir, regarder des deux côtés ; les bus circulant sur le site propre peuvent surgir.
  complement: Lire les feux ou les priorités applicables ; le panneau de danger seul ne les attribue pas.
  theme: L
  sous_theme: panneaux
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  tags:
