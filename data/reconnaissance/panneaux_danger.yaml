- id: a2a
  type: panneau
  code: A2a
  image:
    commons: France road sign A2a.svg
  nom: Cassis ou dos-d'âne
  signification: Annonce une déformation naturelle ou accidentelle de la chaussée (creux « cassis » ou bosse « dos-d'âne ») qui n'est pas un aménagement volontaire.
  conduite: Ralentir fortement ; risque de perte d'adhérence et de dommages au véhicule.
  complement: 'Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. A2a (deux bosses) = déformation de la route ; A2b (une bosse) = ralentisseur construit volontairement. Version temporaire : AK2.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a2b
  type: panneau
  code: A2b
  image:
    commons: France road sign A2b.svg
  nom: Ralentisseur de type dos-d'âne
  signification: Annonce un ralentisseur aménagé de type dos-d'âne (bosse) destiné à faire ralentir les véhicules.
  conduite: Ralentir à la vitesse indiquée par le panneau B14 qui l'accompagne généralement (30 km/h).
  complement: 'Utilisé exclusivement en agglomération (le ralentisseur dos-d''âne n''est autorisé qu''en agglomération) : 0 à 50 m avant le ralentisseur, le plus souvent 50 m. Hors zone 30, il est suivi du panneau de position C27 au niveau du ralentisseur. Un ralentisseur dos-d''âne se trouve uniquement en agglomération (ou sur voies limitées à 30 km/h). A2b = annonce (danger), C27 = position (indication carrée bleue).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
