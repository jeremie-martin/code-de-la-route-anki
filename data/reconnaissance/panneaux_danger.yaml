- id: a9b
  type: panneau
  code: A9b
  image:
    commons: France road sign A9.svg
  nom: Traversée de voies de tramways
  signification: 'Annonce la traversée de voies de tramways : le tramway est prioritaire, il ne peut ni freiner court ni s''écarter.'
  conduite: Ralentir, regarder des deux côtés et lui céder le passage, même sur une route prioritaire.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a13a
  type: panneau
  code: A13a
  image:
    commons: France road sign A13a.svg
  nom: Endroit fréquenté par les enfants
  signification: Annonce un endroit fréquenté par les enfants (école, colonie, terrain de jeux).
  conduite: Ralentir fortement (souvent limité à 30 km/h), être prêt à s'arrêter ; les enfants sont imprévisibles.
  piege: 'Piège classique : A13a (enfants) ≠ A13b (passage pour piétons).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a13b
  type: panneau
  code: A13b
  image:
    commons: France road sign A13b.svg
  nom: Passage pour piétons (annonce du danger)
  signification: Annonce un passage pour piétons (passage protégé) situé 150 m plus loin hors agglomération (50 m en agglomération).
  conduite: Ralentir, être prêt à s'arrêter pour laisser traverser les piétons engagés ou manifestant l'intention de traverser ; ne pas dépasser un véhicule qui ralentit ou s'arrête devant le passage.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a14
  type: panneau
  code: A14
  image:
    commons: France road sign A14.svg
  nom: Autres dangers
  signification: Annonce un danger qui n'a pas de panneau spécifique ; le panonceau M9 en précise la nature.
  conduite: Ralentir et lire le panonceau ; sans panonceau, redoubler de vigilance.
  complement: C'est le seul panneau de danger permanent qui doit normalement être complété par un panonceau explicatif.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a15a1
  type: panneau
  code: A15a1
  image:
    commons: France road sign A15a1.svg
  nom: Passage d'animaux domestiques (bovins)
  signification: Annonce un endroit fréquenté par des animaux domestiques (troupeaux de vaches, moutons) susceptibles de traverser.
  conduite: Ralentir, être prêt à s'arrêter ; un troupeau peut occuper toute la chaussée.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a15a2
  type: panneau
  code: A15a2
  image:
    commons: France road sign A15a2.svg
  nom: Passage d'animaux domestiques (moutons)
  signification: 'Variante du panneau A15a représentant un mouton : passage d''animaux domestiques.'
  conduite: Ralentir, être prêt à s'arrêter.
  complement: Même signification que A15a1 ; le symbole varie selon l'animal local (vache, mouton, cheval).
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a15b
  type: panneau
  code: A15b
  image:
    commons: France road sign A15b.svg
  nom: Passage d'animaux sauvages
  signification: Annonce un endroit fréquenté par des animaux sauvages (cerfs, sangliers, chevreuils) susceptibles de traverser, surtout à l'aube et au crépuscule.
  conduite: Ralentir, surveiller les bas-côtés ; en cas d'animal sur la route, freiner sans donner de coup de volant brusque.
  piege: animaux sauvages (cerf) vs domestiques (vache). Une variante avec un lynx existe localement.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a15c
  type: panneau
  code: A15c
  image:
    commons: France road sign A15c.svg
  nom: Passage de cavaliers
  signification: Annonce un endroit où des cavaliers sont susceptibles de traverser ou de circuler.
  conduite: Ralentir, ne pas klaxonner ni effrayer les chevaux, dépasser avec un large écart et à faible vitesse.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a16
  type: panneau
  code: A16
  image:
    commons: France road sign A16.svg
  nom: Descente dangereuse
  signification: Annonce une descente dangereuse ; le nombre indiqué (ex. 10 %) est le pourcentage de pente.
  conduite: Rétrograder pour utiliser le frein moteur ; en montagne, le véhicule qui descend facilite le croisement.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Le pourcentage est la pente, pas une vitesse : 10 % = 10 m de dénivelé pour 100 m.'
- id: a17
  type: panneau
  code: A17
  image:
    commons: France road sign A17.svg
  nom: Annonce de feux tricolores
  signification: Annonce des feux de signalisation tricolores (carrefour à feux) souvent masqués ou inattendus (hors agglomération, sortie de virage).
  conduite: Ralentir, se préparer à s'arrêter ; anticiper le passage au jaune.
  complement: Un feu jaune clignotant peut être ajouté au sommet du panneau pour renforcer l’alerte.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a18
  type: panneau
  code: A18
  image:
    commons: France road sign A18.svg
  nom: Circulation dans les deux sens
  signification: Annonce qu'après une section à sens unique ou à chaussées séparées, la circulation redevient bidirectionnelle sur la même chaussée.
  conduite: 'Serrer à droite : la partie gauche de la chaussée n''est plus une voie dans mon sens.'
  complement: Seul panneau de danger implanté à l'endroit même du danger, et non 150 m avant.
  piege: 'Il n''existe pas de panneau « fin de sens unique » : c''est A18 qui l''annonce. Ne pas confondre avec C24a.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a19
  type: panneau
  code: A19
  image:
    commons: France road sign A19.svg
  nom: Risque de chute de pierres
  signification: Annonce un risque de chute de pierres depuis un talus ou une falaise, ou la présence de pierres sur la chaussée.
  conduite: Ralentir, surveiller la chaussée et le talus, ne pas s'arrêter dans la zone.
  complement: Le côté du talus dessiné indique d'où viennent les pierres.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a20
  type: panneau
  code: A20
  image:
    commons: France road sign A20.svg
  nom: Débouché sur un quai ou une berge
  signification: Annonce que la route débouche sur un quai, une berge ou un plan d'eau non protégé (risque de chute dans l'eau).
  conduite: Ralentir fortement, ne pas manœuvrer ou stationner près du bord.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a21
  type: panneau
  code: A21
  image:
    commons: France road sign A21.svg
  nom: Débouché de cyclistes venant de droite ou de gauche
  signification: Annonce un endroit où des cyclistes débouchent fréquemment sur la chaussée (sortie de piste cyclable, traversée).
  conduite: Ralentir, contrôler les côtés ; laisser au moins 1 m (agglo) ou 1,5 m (hors agglo) lors du dépassement d'un cycliste.
  piege: triangle = danger (cyclistes qui débouchent) ; rond bleu = piste obligatoire (B22a) ; carré bleu = piste conseillée (C113) ; rond rouge = interdit aux cycles (B9b).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a24
  type: panneau
  code: A24
  image:
    commons: France road sign A24.svg
  nom: Vent latéral
  signification: 'Annonce une zone exposée à des vents latéraux violents : pont, viaduc, plaine, sortie de tunnel.'
  conduite: Ralentir, tenir le volant à deux mains, garder ses distances des véhicules hauts et des deux-roues.
  complement: Souvent complété par une manche à air (J7), qui balise l'endroit précis.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Le symbole est ROUGE, exception parmi les symboles noirs des panneaux de danger.
