  nom: Chaussée particulièrement glissante
  signification: Annonce une section de route où l'adhérence est particulièrement réduite (pluie, verglas, gravillons, boue, feuilles, revêtement lisse).
  conduite: Ralentir avant la section, éviter les freinages et accélérations brusques, augmenter les distances de sécurité.
