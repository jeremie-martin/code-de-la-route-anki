- id: a1a
  type: panneau
  code: A1a
  image:
    commons: France road sign A1a.svg
  nom: Virage à droite
  signification: Annonce un virage à droite dangereux (visibilité réduite, rayon serré).
  conduite: Ralentir avant le virage, serrer à droite, ne pas dépasser, adapter l'allure à la visibilité.
  complement: Le sens de la flèche indique le sens du virage.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a1b
  type: panneau
  code: A1b
  image:
    commons: France road sign A1b.svg
  nom: Virage à gauche
  signification: Annonce un virage à gauche dangereux.
  conduite: Ralentir, serrer à droite (ne pas couper le virage), ne pas dépasser.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a1c
  type: panneau
  code: A1c
  image:
    commons: France road sign A1c.svg
  nom: Succession de virages dont le premier est à droite
  signification: Annonce une succession de virages, le premier étant à droite.
  conduite: Je ralentis et reste à droite sur toute la section ; un panonceau peut préciser la longueur de la succession de virages.
  piege: c'est le premier virage dessiné (en bas) qui donne le sens ; ici le premier est à droite.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a1d
  type: panneau
  code: A1d
  image:
    commons: France road sign A1d.svg
  nom: Succession de virages dont le premier est à gauche
  signification: Annonce une succession de virages, le premier étant à gauche.
  conduite: Ralentir, rester à droite sur toute la section.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a2a
  type: panneau
  code: A2a
  image:
    commons: France road sign A2a.svg
  nom: Cassis ou dos-d'âne
  signification: Annonce un cassis (creux) ou un dos-d'âne (bosse) marqué, dangereux à franchir vite, qui n'est pas un ralentisseur.
  conduite: Ralentir fortement ; risque de perte d'adhérence et de dommages au véhicule.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: a2b
    legende: 'Une seule bosse : ralentisseur aménagé.'
  piege: 'Deux bosses : déformation de la chaussée ; une seule bosse : ralentisseur aménagé.'
- id: a2b
  type: panneau
  code: A2b
  image:
    commons: France road sign A2b.svg
  nom: Ralentisseur de type dos-d'âne
  signification: Annonce un ralentisseur aménagé de type dos-d'âne (bosse) destiné à faire ralentir les véhicules.
  conduite: Je ralentis avant le ralentisseur et respecte la limitation affichée, souvent 30 km/h.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Le triangle annonce le ralentisseur ; le carré bleu en indique l’emplacement.
  comparaisons:
  - ref: c27
    legende: 'Carré bleu : le ralentisseur est ici.'
- id: a3
  type: panneau
  code: A3
  image:
    commons: France road sign A3.svg
  nom: Chaussée rétrécie
  signification: Annonce un rétrécissement de la chaussée par les deux côtés.
  conduite: Je ralentis et reste dans ma voie. Si deux véhicules ne peuvent pas se croiser, je lis les panneaux de priorité et ne m’engage que si je peux dégager.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a3a
  type: panneau
  code: A3a
  image:
    commons: France road sign A3a.svg
  nom: Chaussée rétrécie par la droite
  signification: Annonce un rétrécissement de la chaussée par la droite.
  conduite: Ralentir, contrôler le rétroviseur gauche avant de se décaler, ne pas dépasser.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a3b
  type: panneau
  code: A3b
  image:
    commons: France road sign A3b.svg
  nom: Chaussée rétrécie par la gauche
  signification: Annonce un rétrécissement de la chaussée par la gauche.
  conduite: Ralentir ; les usagers venant en face peuvent être déportés vers ma voie.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a4
  type: panneau
  code: A4
  image:
    commons: France road sign A4.svg
  nom: Chaussée particulièrement glissante
  signification: Annonce une section de route où l'adhérence est particulièrement réduite (pluie, verglas, gravillons, boue, feuilles, revêtement lisse).
  conduite: Ralentir avant la section, éviter les freinages et accélérations brusques, augmenter les distances de sécurité.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a6
  type: panneau
  code: A6
  image:
    commons: France road sign A6.svg
  nom: Pont mobile
  signification: Annonce un pont mobile (pont levant, tournant, basculant) susceptible d'interrompre la circulation.
  conduite: Ralentir, se préparer à s'arrêter ; respecter les feux rouges clignotants et les barrières.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a7
  type: panneau
  code: A7
  image:
    commons: France road sign A7.svg
  nom: Passage à niveau muni de barrières ou demi-barrières
  signification: Annonce un passage à niveau gardé par des barrières ou demi-barrières (automatiques ou manuelles).
  conduite: Ralentir, être prêt à s'arrêter ; ne jamais s'engager si l'on risque d'être immobilisé sur les voies.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: L'interdiction propre de dépasser vise les passages sans barrière ; ici, un dépassement reste soumis aux règles générales, et je ne m'engage jamais si je risque de m'immobiliser sur les voies.
- id: a8
  type: panneau
  code: A8
  image:
    commons: France road sign A8.svg
  nom: Passage à niveau sans barrière ni demi-barrière
  signification: Annonce un passage à niveau non gardé (sans barrières), avec ou sans signalisation automatique lumineuse.
  conduite: Ralentir fortement, regarder et écouter ; ne franchir que si aucun train n'est visible ni audible.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  complement: La croix de Saint-André marque le passage lui-même ; un STOP peut être placé sous la croix.
- id: a9b
  type: panneau
  code: A9b
  image:
    commons: France road sign A9.svg
  nom: Traversée de voies de tramways
  signification: 'Annonce la traversée de voies de tramways : le tramway est prioritaire, il ne peut ni freiner court ni s''écarter.'
  conduite: Ralentir, regarder des deux côtés et lui céder le passage, même sur une route prioritaire.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a13a
  type: panneau
  code: A13a
  image:
    commons: France road sign A13a.svg
  nom: Endroit fréquenté par les enfants
  signification: Annonce un endroit fréquenté par les enfants (école, colonie, terrain de jeux).
  conduite: Ralentir fortement (souvent limité à 30 km/h), être prêt à s'arrêter ; les enfants sont imprévisibles.
  piege: 'Deux enfants qui courent : lieu fréquenté par des enfants. Le piéton sur des bandes annonce, lui, un passage pour piétons.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: a13b
    legende: 'Un piéton sur des bandes : passage pour piétons annoncé.'
- id: a13b
  type: panneau
  code: A13b
  image:
    commons: France road sign A13b.svg
  nom: Passage pour piétons (annonce du danger)
  signification: Annonce un passage pour piétons situé en général à environ 150 m hors agglomération (50 m en agglomération), sauf panonceau de distance.
  conduite: Ralentir, être prêt à s'arrêter pour laisser traverser les piétons engagés ou manifestant l'intention de traverser ; ne pas dépasser un véhicule qui ralentit ou s'arrête devant le passage.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: c20a
    legende: 'Carré bleu : le passage est ici.'
  - ref: a13a
    legende: 'Deux enfants : lieu fréquenté par des enfants.'
  piege: Le triangle annonce le passage ; le carré bleu le situe.
- id: a14
  type: panneau
  code: A14
  image:
    commons: France road sign A14.svg
  nom: Autres dangers
  signification: Annonce un danger sans symbole spécifique ; le texte du panonceau en précise la nature.
  conduite: Ralentir et lire le panonceau ; sans panonceau, redoubler de vigilance.
  complement: C'est le seul panneau de danger permanent qui doit normalement être complété par un panonceau explicatif.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a15a1
  type: panneau
  code: A15a1
  image:
    commons: France road sign A15a1.svg
  nom: Passage d'animaux domestiques (bovins)
  signification: Annonce un endroit fréquenté par des animaux domestiques (troupeaux de vaches, moutons) susceptibles de traverser.
  conduite: Ralentir, être prêt à s'arrêter ; un troupeau peut occuper toute la chaussée.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a15b
  type: panneau
  code: A15b
  image:
    commons: France road sign A15b.svg
  nom: Passage d'animaux sauvages
  signification: Annonce un endroit fréquenté par des animaux sauvages (cerfs, sangliers, chevreuils) susceptibles de traverser, surtout à l'aube et au crépuscule.
  conduite: Ralentir, surveiller les bas-côtés ; en cas d'animal sur la route, freiner sans donner de coup de volant brusque.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a15c
  type: panneau
  code: A15c
  image:
    commons: France road sign A15c.svg
  nom: Passage de cavaliers
  signification: Annonce un endroit où des cavaliers sont susceptibles de traverser ou de circuler.
  conduite: Ralentir, ne pas klaxonner ni effrayer les chevaux, dépasser avec un large écart et à faible vitesse.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a16
  type: panneau
  code: A16
  image:
    commons: France road sign A16.svg
  nom: Descente dangereuse
  signification: Annonce une descente dangereuse ; le nombre indiqué (ex. 10 %) est le pourcentage de pente.
  conduite: Rétrograder pour utiliser le frein moteur ; en montagne, le véhicule qui descend facilite le croisement.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Le pourcentage est la pente, pas une vitesse : 10 % = 10 m de dénivelé pour 100 m.'
- id: a17
  type: panneau
  code: A17
  image:
    commons: France road sign A17.svg
  nom: Annonce de feux tricolores
  signification: Annonce des feux de signalisation tricolores (carrefour à feux) souvent masqués ou inattendus (hors agglomération, sortie de virage).
  conduite: Ralentir, se préparer à s'arrêter ; anticiper le passage au jaune.
  complement: Un feu jaune clignotant peut être ajouté au sommet du panneau pour renforcer l’alerte.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a18
  type: panneau
  code: A18
  image:
    commons: France road sign A18.svg
  nom: Circulation dans les deux sens
  signification: Annonce qu'après une section à sens unique ou à chaussées séparées, la circulation redevient bidirectionnelle sur la même chaussée.
  conduite: 'Serrer à droite : la partie gauche de la chaussée n''est plus une voie dans mon sens.'
  complement: Seul panneau de danger implanté à l'endroit même du danger, et non 150 m avant.
  piege: 'Les deux flèches opposées dans le triangle annoncent une circulation à double sens : je dois désormais attendre des véhicules en face.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a19
  type: panneau
  code: A19
  image:
    commons: France road sign A19.svg
  nom: Risque de chute de pierres
  signification: Annonce un risque de chute de pierres depuis un talus ou une falaise, ou la présence de pierres sur la chaussée.
  conduite: Ralentir, surveiller la chaussée et le talus, ne pas s'arrêter dans la zone.
  complement: Le côté du talus dessiné indique d'où viennent les pierres.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a20
  type: panneau
  code: A20
  image:
    commons: France road sign A20.svg
  nom: Débouché sur un quai ou une berge
  signification: Annonce que la route débouche sur un quai, une berge ou un plan d'eau non protégé (risque de chute dans l'eau).
  conduite: Ralentir fortement, ne pas manœuvrer ou stationner près du bord.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: a21
  type: panneau
  code: A21
  image:
    commons: France road sign A21.svg
  nom: Débouché de cyclistes venant de droite ou de gauche
  signification: Annonce un endroit où des cyclistes débouchent fréquemment sur la chaussée (sortie de piste cyclable, traversée).
  conduite: Ralentir, contrôler les côtés ; laisser au moins 1 m (agglo) ou 1,5 m (hors agglo) lors du dépassement d'un cycliste.
  piege: 'Avec un vélo, la forme change le sens : triangle = danger ; rond bleu = piste obligatoire ; carré bleu = piste conseillée ; rond rouge = accès interdit.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: b9b
    legende: 'Rond rouge : accès interdit aux cycles.'
  - ref: b22a
    legende: 'Rond bleu : piste obligatoire.'
  - ref: c113
    legende: 'Carré bleu : piste conseillée.'
- id: a24
  type: panneau
  code: A24
  image:
    commons: France road sign A24.svg
  nom: Vent latéral
  signification: 'Annonce une zone exposée à des vents latéraux violents : pont, viaduc, plaine, sortie de tunnel.'
  conduite: Ralentir, tenir le volant à deux mains, garder ses distances des véhicules hauts et des deux-roues.
  complement: Une manche à air peut préciser l’endroit exposé et montrer la direction et la force du vent.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
