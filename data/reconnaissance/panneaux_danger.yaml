- id: a6
  type: panneau
  code: A6
  image:
    commons: France road sign A6.svg
  nom: Pont mobile
  signification: Annonce un pont mobile (pont levant, tournant, basculant) susceptible d'interrompre la circulation.
  conduite: Ralentir, se préparer à s'arrêter ; respecter les feux rouges clignotants (R24) et barrières.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a7
  type: panneau
  code: A7
  image:
    commons: France road sign A7.svg
  nom: Passage à niveau muni de barrières ou demi-barrières
  signification: Annonce un passage à niveau gardé par des barrières ou demi-barrières (automatiques ou manuelles).
  conduite: Ralentir, être prêt à s'arrêter ; ne jamais franchir quand le feu rouge clignote ou que les barrières s'abaissent ; ne pas s'engager si l'on risque d'être immobilisé sur les voies.
  complement: 'Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Sur les voies électrifiées, un panonceau M9b « voie ferrée électrifiée » peut compléter A7/A8. Dépassement interdit aux traversées de voies ferrées non munies de barrières ou de demi-barrières (R414-12) : avec barrières, l''interdiction générale ne s''applique pas.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a8
  type: panneau
  code: A8
  image:
    commons: France road sign A8.svg
  nom: Passage à niveau sans barrière ni demi-barrière
  signification: Annonce un passage à niveau non gardé (sans barrières), avec ou sans signalisation automatique lumineuse.
  conduite: Ralentir fortement, regarder et écouter ; s'arrêter à la croix de Saint-André (G1) si un train approche ou si un STOP (AB4) l'exige ; ne franchir que si aucun train n'est visible ni audible.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a9b
  type: panneau
  code: A9b
  image:
    commons: France road sign A9.svg
  nom: Traversée de voies de tramways
  signification: 'Annonce la traversée de voies de tramways (le tramway est prioritaire : il ne peut ni freiner court ni s''écarter).'
  conduite: Ralentir, regarder des deux côtés et céder le passage au tramway, qui est toujours prioritaire (même sur une route à caractère prioritaire).
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Fichier Commons nommé A9 (ancien code A9, devenu A9b en 2018). Le tramway est prioritaire à toutes les intersections sauf signalisation contraire (feux).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a13a
  type: panneau
  code: A13a
  image:
    commons: France road sign A13a.svg
  nom: Endroit fréquenté par les enfants
  signification: Annonce un endroit fréquenté par les enfants (école, colonie, terrain de jeux).
  conduite: Ralentir fortement (souvent limité à 30 km/h), être prêt à s'arrêter ; les enfants sont imprévisibles.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente.
  piege: 'Piège classique : A13a (enfants) ≠ A13b (passage pour piétons).'
  theme: L
