  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a13b
  type: panneau
  code: A13b
  image:
    commons: France road sign A13b.svg
  nom: Passage pour piétons (annonce du danger)
  signification: Annonce un passage pour piétons (passage protégé) situé 150 m plus loin hors agglomération (50 m en agglomération).
  conduite: Ralentir, être prêt à s'arrêter pour laisser traverser les piétons engagés ou manifestant l'intention de traverser ; ne pas dépasser un véhicule qui ralentit ou s'arrête devant le passage.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Le piéton régulièrement engagé ou manifestant clairement l'intention de traverser a la priorité (R415-11).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: a14
  type: panneau
  code: A14
  image:
    commons: France road sign A14.svg
  nom: Autres dangers
  signification: Annonce un danger qui n'est pas représenté par un panneau spécifique ; la nature du danger est précisée par un panonceau M9 (« sortie d'usine », « route inondable », « nids de poule »...).
  conduite: Ralentir et lire le panonceau ; sans panonceau, redoubler de vigilance.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. C'est le seul panneau de danger permanent qui doit normalement être complété par un panonceau explicatif.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
