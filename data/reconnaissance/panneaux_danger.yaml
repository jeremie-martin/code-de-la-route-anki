- id: a1a
  type: panneau
  code: A1a
  image:
    commons: France road sign A1a.svg
  nom: Virage à droite
  signification: Annonce un virage à droite dangereux (visibilité réduite, rayon serré).
  conduite: Ralentir avant le virage, serrer à droite, ne pas dépasser, adapter l'allure à la visibilité.
  complement: Implanté à ~150 m du danger hors agglomération (200 m sur autoroute), ~50 m en agglomération ; un panonceau M1 précise une distance différente. Le sens de la flèche indique le sens du virage. Le danger commence 150 m après le panneau hors agglomération (50 m en agglomération).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
