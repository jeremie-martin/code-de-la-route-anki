- id: m1
  type: panonceau
  code: M1
  image:
    commons: France road sign M1.svg
  nom: Panonceau de distance
  signification: Indique la distance entre le panneau et le début du danger, de la zone réglementée ou du point indiqué (ex. « 150 m », « 2 km »).
  conduite: Le danger ou la prescription ne commence qu'à la distance indiquée, pas au panneau.
  complement: 'Sous un panneau de danger : distance différente des 150 m / 50 m habituels. Sous un AB3a : signal avancé (AB3b). Sous CE : distance jusqu''au service.'
  theme: L
  sous_theme: panonceaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
