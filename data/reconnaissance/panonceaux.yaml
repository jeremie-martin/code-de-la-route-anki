- id: m1
  type: panonceau
  code: M1
  image:
    commons: France road sign M1.svg
  nom: Panonceau de distance
  signification: Indique la distance entre le panneau et le début du danger, de la zone réglementée ou du point indiqué (ex. « 150 m », « 2 km »).
  conduite: Le danger ou la prescription ne commence qu'à la distance indiquée, pas au panneau.
  complement: Le nombre indique la distance jusqu’au danger ou au lieu annoncé. Sous un cédez-le-passage, il annonce l’intersection plus loin ; sous un panneau de service, il indique la distance jusqu’au service.
  theme: L
  sous_theme: panonceaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: m2
  type: panonceau
  code: M2
  image:
    commons: France road sign M2.svg
  nom: Panonceau d'étendue
  signification: 'Indique la longueur de la section dangereuse ou soumise à la réglementation (ex. « 3 km ») : la prescription s''applique sur toute cette longueur, même au-delà d''intersections.'
  conduite: Maintenir la prescription (vitesse, interdiction de dépasser) sur toute la distance indiquée.
  piege: Sans flèches, « 150 m » indique où commence le danger. Avec les deux flèches, « 150 m » indique la longueur de la section concernée.
  theme: L
  sous_theme: panonceaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  comparaisons:
  - ref: m1
    legende: 'Sans flèches : distance avant le danger.'
