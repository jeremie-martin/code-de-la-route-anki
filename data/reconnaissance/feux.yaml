# Généré par build/import_signs.py depuis data/signs_inventory.yaml (13 entrées). Corrections manuelles : data/_meta/sign_overrides.yaml
- id: feu-rouge
  type: feu
  image:
    gen: feu_tricolore
    params:
      state: rouge
  nom: Feu rouge fixe
  signification: 'Arrêt absolu : interdiction de franchir la ligne d''effet des feux, y compris pour tourner à droite.'
  conduite: S'arrêter avant la ligne d'arrêt, sans empiéter sur le passage piéton ni le sas vélo ; attendre le vert.
  complement: Sans ligne au sol, je m'arrête avant le passage piéton s'il précède le feu, sinon à l'aplomb du feu.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Pas de « tourne à droite au rouge » en France. Les roues au-delà de la ligne, c'est déjà un feu grillé.
- id: feu-jaune-fixe
  type: feu
  image:
    gen: feu_tricolore
    params:
      state: orange
  nom: Feu jaune fixe
  signification: 'Annonce l''imminence du rouge : arrêt obligatoire, sauf si l''on ne peut plus s''arrêter dans des conditions de sécurité suffisantes.'
  conduite: Freiner et s'arrêter si c'est possible sans danger ; sinon franchir sans accélérer.
  complement: 'Officiellement « jaune » : le Code ne parle pas d''orange. Franchir alors qu''on pouvait s''arrêter : 35 €, sans retrait de points.'
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Ne jamais accélérer pour « passer à l''orange » : le jaune impose l''arrêt, sauf impossibilité.'
- id: feu-vert
  type: feu
  image:
    gen: feu_tricolore
    params:
      state: vert
  nom: Feu vert
  signification: Passage autorisé, à condition que l'intersection soit dégagée et en cédant le passage aux piétons engagés.
  conduite: Ne s'engager que si l'on peut dégager le carrefour ; en tournant, céder aux piétons, et à gauche aux véhicules d'en face.
  piege: Le vert ne donne pas la priorité sur les piétons ; il prévaut sur un STOP ou un cédez-le-passage placé dessous.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  complement: Il n'existe pas de feu vert clignotant en France.
- id: feu-jaune-clignotant
  type: feu
  image:
    gen: feu_tricolore
    params:
      state: orange_clignotant
  nom: Feu jaune clignotant
  signification: Passage prudent, en respectant les panneaux de priorité et les autres règles de priorité.
  conduite: Ralentir et appliquer le panneau placé sous le feu (STOP, cédez-le-passage) ou, à défaut, la priorité à droite.
  piege: Un feu jaune clignotant seul sur un panneau (R1) n'est qu'un renfort d'attention, pas un régime de priorité.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  complement: 'Le plus souvent, c’est la lampe du milieu qui clignote (parfois celle du bas, notamment aux feux de chantier) ; certains carrefours fonctionnent ainsi la nuit ou en dehors des heures de pointe : ce n’est pas forcément une panne.'
- id: feu-rouge-clignotant
  type: feu
  image:
    gen: feu_rouge_clignotant
    params:
      twin: true
  nom: Feu rouge clignotant (signal d'arrêt R24)
  signification: 'Un ou deux feux rouges alternés imposent l''arrêt absolu devant un danger : passage à niveau, pont mobile, sortie de pompiers ou traversée de tram.'
  conduite: S'arrêter avant le feu et attendre son extinction ; au passage à niveau, ne jamais contourner les demi-barrières.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Ne jamais franchir même si rien n''est visible : le train peut arriver dans quelques secondes.'
- id: r12
  type: feu
  code: R12
  image:
    gen: feu_pieton
    params:
      state: vert
  nom: Signal bicolore pour piétons
  signification: 'Feux pour piétons à deux couleurs, sans jaune : silhouette rouge = traversée interdite, silhouette verte = traversée autorisée.'
  conduite: 'En voiture : céder le passage aux piétons engagés, même si leur feu vient de passer au rouge.'
  theme: L
  sous_theme: feux
  source: Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25
  piege: Vert autorise à commencer la traversée ; au rouge, ne pas s’engager. En voiture, laisser finir les piétons déjà engagés.
- id: r13
  type: feu
  code: R13
  image:
    gen: feu_velo
    params:
      state: vert
  nom: Signaux tricolores modaux (bus R13b, cyclistes R13c)
  signification: Le symbole du vélo ou du bus indique à quels usagers ce feu s’adresse.
  conduite: En voiture, je suis le feu destiné à ma voie, pas le feu portant un vélo ou un bus. À vélo, je suis le feu avec le symbole vélo.
  complement: 'Un feu pour les vélos peut leur donner le départ avant les autres véhicules : je ne démarre pas en voiture tant que mon propre feu reste rouge.'
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: r14
  type: feu
  code: R14
  image:
    gen: feu_tricolore
    params:
      state: vert
      arrow: left
  nom: Signaux tricolores directionnels (feux à flèches)
  signification: 'Feux tricolores dont les trois feux portent une flèche : ils ne concernent que les usagers qui vont dans cette direction.'
  conduite: Se placer dans la voie de sa direction et obéir au feu fléché ; au vert, les flux qui me coupent ont en principe le rouge, mais je laisse finir un piéton encore engagé.
  piege: Ne pas confondre avec R16, la flèche jaune clignotante (passer en cédant le passage).
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: r16
  type: feu
  code: R16
  image:
    gen: feu_fleche_composite
    params:
      colour: orange
      direction: right
      blink: true
  nom: Signal d'anticipation directionnel (flèche jaune clignotante)
  signification: 'Flèche jaune clignotante à côté d''un feu tricolore : les usagers allant dans cette direction peuvent passer, même au rouge, sans aucune priorité.'
  conduite: Céder le passage aux piétons et aux véhicules qui ont le vert avant de tourner ; s'arrêter si nécessaire.
  complement: Souvent pour le tourne-à-droite. Sans R16, tourner à droite au rouge reste interdit.
  theme: L
  sous_theme: feux
  source: Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25
  piege: 'Flèche jaune clignotante : autorisation conditionnelle, sans priorité sur les usagers dont on coupe la trajectoire.'
- id: r17
  type: feu
  code: R17
  image:
    gen: feu_bus
    params:
      bar: vertical
  nom: Signal pour véhicules de transport en commun (feux à barres blanches)
  signification: 'Feux réservés aux bus et tramways, en barres blanches : barre verticale = passage, disque = arrêt imminent, barre horizontale = arrêt.'
  conduite: 'En voiture, suivre son propre feu ; se méfier d''un bus dont la barre est verticale : il va passer.'
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: r21a
  type: feu
  code: R21a
  image:
    gen: signal_affectation
    params:
      lanes:
      - croix
      - fleche
      - fleche
      me_lane: 0
  nom: 'Signal d''affectation de voie : croix rouge'
  signification: 'Croix de Saint-André rouge fixe placée au-dessus d''une voie (autoroute, tunnel, péage, pont) : interdiction d''emprunter cette voie.'
  conduite: Quitter la voie dès que possible en sécurité ; ne jamais y circuler tant que la croix est allumée.
  complement: Sur portique au-dessus de chaque voie. Croix rouge = voie fermée ; flèche verte vers le bas = voie ouverte ; flèche jaune oblique clignotante = se rabattre sur la voie indiquée.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: r21b
  type: feu
  code: R21b
  image:
    gen: signal_affectation
    params:
      lanes:
      - fleche
      - fleche
      - fleche
  nom: 'Signal d''affectation de voie : flèche verte vers le bas'
  signification: 'Flèche verte fixe pointant vers le bas au-dessus d''une voie : autorisation de circuler sur cette voie.'
  conduite: Rester ou se placer dans cette voie.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: r21c
  type: feu
  code: R21c
  image:
    gen: signal_affectation
    params:
      lanes:
      - rabattement_droite
      - fleche
      - fleche
      me_lane: 0
  nom: 'Signal d''affectation de voie : flèche jaune oblique clignotante'
  signification: 'Flèche jaune clignotante inclinée vers le bas au-dessus d''une voie : cette voie est fermée, se rabattre du côté indiqué.'
  conduite: Changer de voie dans le sens de la flèche dès que possible, sans manœuvre brusque.
  theme: L
  sous_theme: feux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
