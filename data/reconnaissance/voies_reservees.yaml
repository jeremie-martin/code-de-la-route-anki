- id: vr-losange-debut
  type: panneau
  image:
    commons: Panneau de début de voie réservée aux véhicules à occupation multiple.svg
  nom: Début de voie réservée (panneau à losange blanc)
  signification: 'Losange blanc au-dessus d''une voie : voie réservée, aux heures indiquées, aux bus, aux taxis et au covoiturage (« 2+ » ou « 3+ »).'
  conduite: Ne pas l'emprunter seul à bord (135 €) ; losange éteint ou hors horaires, la voie est ouverte à tous.
  complement: Un panonceau précise le nombre minimal d’occupants et les horaires.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
