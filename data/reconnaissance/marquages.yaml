# Généré par build/import_signs.py depuis data/signs_inventory.yaml (31 entrées). Corrections manuelles : data/_meta/sign_overrides.yaml
- id: marq-ligne-continue
  type: marquage
  image:
    gen: ligne_axiale
    params:
      style: continue
  nom: Ligne continue (axiale ou séparative de voies)
  signification: 'Ligne blanche continue : interdiction de la franchir et de la chevaucher.'
  conduite: 'Je ne la franchis pas : ni pour dépasser, ni pour tourner ou faire demi-tour.'
  complement: 'Seule exception : la chevaucher, sans la franchir, pour dépasser un cycle, un EDPM ou un cyclomobile léger.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Franchir une ligne continue : 135 € et 3 points ; la chevaucher : 135 € et 1 point.'
- id: marq-ligne-discontinue-t1
  type: marquage
  image:
    gen: ligne_axiale
    params:
      style: discontinue
      dash: 3
      gap: 10
  nom: Ligne discontinue axiale T1 (3 m de trait, 10 m de vide)
  signification: 'Ligne discontinue à grands intervalles : je peux la franchir pour dépasser ou changer de direction si les autres conditions le permettent.'
  conduite: Dépasser seulement si la visibilité le permet, et terminer avant la ligne d'annonce ou la ligne continue.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Une ligne discontinue autorise le franchissement mais n''oblige à rien : le dépassement reste soumis aux règles générales.'
- id: marq-ligne-dissuasion
  type: marquage
  image:
    gen: ligne_axiale
    params:
      style: dissuasion
      dash: 3
      gap: 1.33
  nom: Ligne de dissuasion T3 (3 m de trait, 1,33 m de vide)
  signification: 'Ligne discontinue à intervalles courts : elle dissuade de dépasser. Je ne dépasse qu’un véhicule lent, avec assez de visibilité et de place.'
  conduite: Ne pas dépasser un véhicule à allure normale ; dépasser un tracteur, un cyclomoteur ou un engin lent reste possible.
  complement: Fréquente sur routes sinueuses ou en rampe, où les dépassements sont délicats.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ligne-annonce
  type: marquage
  image:
    gen: fleches
    params:
      kind: rabattement
  nom: Ligne d'annonce d'une ligne continue (T3) avec flèches de rabattement
  signification: 'Traits longs et intervalles courts, accompagnés de flèches obliques : une ligne continue commence bientôt, il faut se rabattre à droite et ne plus entreprendre de dépassement.'
  conduite: Je termine ou j’abandonne mon dépassement et je me rabats avant le début de la ligne continue.
  complement: Avant chaque ligne continue, sur une centaine de mètres.
  piege: 'Même tracé que la ligne de dissuasion : ce sont les flèches de rabattement qui en font une ligne d’annonce.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: marq-ligne-dissuasion
    legende: 'Sans flèches : ligne de dissuasion.'
- id: marq-ligne-mixte
  type: marquage
  image:
    gen: ligne_axiale
    params:
      style: mixte_moi
  nom: Ligne mixte (continue doublée d'une discontinue)
  signification: 'Ligne continue accolée à une ligne discontinue : c''est la ligne la plus proche de mon véhicule qui s''applique.'
  conduite: 'Discontinue de mon côté : je peux dépasser ; continue de mon côté : c''est interdit.'
  complement: La ligne discontinue doit être la plus proche AU DÉBUT de la manœuvre, qui doit s’achever avant la fin de la partie discontinue.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-fleches-directionnelles
  type: marquage
  image:
    gen: fleches
    params:
      kind: directionnelles
  nom: Flèches directionnelles (de sélection / d'affectation de voie)
  signification: 'Flèches blanches peintes dans une voie avant une intersection : elles imposent la direction à suivre depuis cette voie.'
  conduite: Choisir sa voie à l'avance ; trompé de voie, suivre la direction imposée et faire demi-tour plus loin.
  complement: Voies de présélection et de sortie. Avec une ligne continue entre les voies, changer de voie est interdit.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ligne-stop
  type: marquage
  image:
    gen: transversale
    params:
      kind: stop
  nom: 'Ligne d''arrêt (STOP) : ligne transversale continue'
  signification: 'Large ligne blanche continue (50 cm) en travers de la voie : c''est à elle, et non au panneau STOP, que l''arrêt se fait.'
  conduite: S'arrêter complètement les roues avant la ligne, sans la dépasser, puis céder le passage.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Ligne transversale CONTINUE = STOP ; ligne transversale DISCONTINUE = cédez-le-passage.
- id: marq-ligne-cedez
  type: marquage
  image:
    gen: transversale
    params:
      kind: cedez
  nom: 'Ligne de cédez-le-passage : ligne transversale discontinue'
  signification: 'Ligne blanche discontinue en travers de la voie : je cède le passage avant de la franchir, sans arrêt obligatoire si la voie est libre.'
  conduite: Ralentir, contrôler, s'arrêter à la ligne si un véhicule arrive, sinon passer sans s'arrêter.
  complement: Se trouve notamment aux entrées de giratoire.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Un grand triangle blanc isolé, pointe vers moi, peut précéder cette ligne ; trois petits triangles pointés dans mon sens, sur une rampe, signalent un ralentisseur.
- id: marq-ligne-effet-feux
  type: marquage
  image:
    gen: transversale
    params:
      kind: effet_feux
  nom: Ligne d'effet des feux (ligne d'arrêt aux feux)
  signification: 'Ligne blanche discontinue fine, en travers de la voie avant un feu : c''est là que l''on s''arrête au rouge.'
  conduite: S'arrêter avant cette ligne au rouge ou au jaune, sans empiéter sur le passage piéton ni le sas vélo.
  complement: Sans marquage, l'arrêt se fait avant le passage piéton, sinon à l'aplomb du feu.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Franchir la ligne d'effet des feux au rouge = feu grillé (135 €, 4 points), même en s'arrêtant ensuite.
- id: marq-passage-pietons
  type: marquage
  image:
    gen: passage
    params:
      kind: pieton
  nom: Passage pour piétons (marquage au sol)
  signification: Bandes blanches parallèles à l'axe de la chaussée matérialisant la traversée des piétons ; s'y arrêter ou y stationner est interdit.
  conduite: Ralentir et céder le passage au piéton qui traverse ; ne pas dépasser un véhicule arrêté devant le passage.
  complement: 'Arrêt et stationnement interdits dans les 5 m en amont du passage, hors emplacements matérialisés. Refus de priorité à un piéton : 135 € et 6 points.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Le piéton qui attend au bord en montrant qu’il va traverser a déjà la priorité, même sans avoir posé le pied sur la chaussée.
- id: marq-passage-cyclistes
  type: marquage
  image:
    gen: passage
    params:
      kind: cycliste
  nom: Traversée cyclable (passage pour cyclistes)
  signification: Traversée de chaussée réservée aux cyclistes, matérialisée par des bandes blanches étroites (ou, sur d'anciens marquages, deux rangées de carrés blancs).
  conduite: Je contrôle la traversée avant de tourner et respecte les priorités indiquées, notamment un éventuel cédez-le-passage.
  complement: En prolongement des pistes cyclables aux intersections.
  piege: En ligne droite, c’est la signalisation du carrefour qui fixe la priorité, pas le marquage. Mais en tournant, je cède aux cyclistes de la piste que je coupe.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-zebra
  type: marquage
  image:
    gen: passage
    params:
      kind: zebra
  nom: Zébra (hachures blanches)
  signification: 'Zone hachurée blanche : surface non circulable (îlot peint, biseau, musoir).'
  conduite: Ne pas y circuler, ni s'y arrêter, ni s'en servir pour dépasser ou tourner.
  complement: Elle est normalement bordée d'une ligne continue, qui ne se franchit pas.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ligne-rive
  type: marquage
  image:
    gen: ligne_rive
    params:
      style: discontinue
      dash: 3
      gap: 3.5
  nom: 'Ligne de rive (T2 : 3 m de trait, 3,5 m de vide) et rive continue'
  signification: 'Ligne discontinue au bord de la chaussée : elle sépare la chaussée de l’accotement.'
  conduite: Rester à gauche de la ligne ; on peut la franchir pour s'arrêter sur l'accotement ou entrer dans une propriété.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ligne-bau-t4
  type: marquage
  image:
    gen: ligne_rive
    params:
      style: bau
  nom: 'Ligne délimitant la bande d''arrêt d''urgence (T4 : 39 m de trait, 13 m de vide)'
  signification: Ligne discontinue à très longs traits (39 m) et vides de 13 m délimitant la bande d'arrêt d'urgence.
  conduite: Ne pas circuler sur la BAU ; garder deux traits avec le véhicule précédent (un trait = danger).
  complement: À 130 km/h, deux traits (environ 90 m) valent un peu plus de deux secondes.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-chevrons
  type: marquage
  image:
    gen: chevrons
    params: {}
  nom: Chevrons de distance de sécurité
  signification: Chevrons blancs peints dans l'axe des voies (autoroutes, tunnels) pour matérialiser la distance de sécurité.
  conduite: Garder deux chevrons visibles entre son véhicule et celui de devant.
  complement: Sections d'autoroute et tunnels où les accidents en chaîne sont fréquents.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-voie-insertion
  type: marquage
  image:
    gen: voie_insertion
    params: {}
  nom: Ligne de délimitation des voies d'insertion, de décélération et d'entrecroisement (T2 5u)
  signification: Ligne discontinue large séparant une voie d’insertion ou de sortie de la chaussée principale.
  conduite: 'Voie d''accélération : prendre la vitesse du trafic et s''insérer en cédant le passage. Voie de décélération : freiner dedans.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Une voie qui rejoint la circulation et une voie qui la quitte ne demandent pas la même manœuvre : je regarde où elle mène.'
- id: marq-bande-cyclable
  type: marquage
  image:
    gen: bande_cyclable
    params:
      green: true
  nom: Bande cyclable (ligne T3 5u + pictogramme vélo)
  signification: Voie réservée aux cyclistes sur la chaussée, repérée par une ligne discontinue large et un symbole de vélo.
  conduite: Ne pas y rouler ni y stationner ; contrôler l'angle mort avant de la couper pour tourner à droite.
  complement: Pour les cyclistes, le rond bleu rend l’aménagement obligatoire ; le carré bleu le conseille. La bande peut être à contresens de la circulation générale.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Bande cyclable = sur la chaussée ; piste cyclable = séparée de la chaussée. S''y arrêter : 135 €.'
- id: marq-couloir-bus
  type: marquage
  image:
    gen: voie_texte
    params:
      text: BUS
  nom: Couloir réservé aux bus (ligne T3 5u + inscription BUS)
  signification: Voie réservée aux autobus, repérée par une ligne large et l’inscription « BUS ».
  conduite: Ne pas y circuler ni y stationner ; la traverser seulement pour tourner, si la ligne est discontinue.
  complement: 'Le panneau de voie réservée précise les usagers autorisés ; certains couloirs sont à contresens. Y circuler : 135 € ; s’y arrêter ou y stationner : très gênant, 135 €.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-damier-blanc
  type: marquage
  image:
    gen: damier
    params:
      colour: blanc
  nom: Damier blanc (continuité d'un couloir bus dans un carrefour)
  signification: Damier blanc peint dans un carrefour pour matérialiser la continuité d'un couloir de bus ou d'une voie de tramway à travers l'intersection.
  conduite: 'Ne pas bloquer la traversée. Lire les feux et les priorités : le damier seul ne donne pas une priorité générale au bus.'
  complement: Dans les carrefours traversés par un site propre.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ligne-jaune-continue
  type: marquage
  image:
    gen: ligne_jaune
    params:
      style: continue
  nom: 'Ligne jaune continue (sur bordure ou en rive) : arrêt interdit'
  signification: 'Ligne jaune continue sur la bordure ou en rive de chaussée : arrêt et stationnement interdits.'
  conduite: Ne pas s'immobiliser le long de cette bordure.
  complement: Jaune continue = arrêt et stationnement interdits ; jaune discontinue = stationnement interdit, arrêt possible.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  prerequis:
  - l-arret-vs-stationnement
- id: marq-ligne-jaune-discontinue
  type: marquage
  image:
    gen: ligne_jaune
    params:
      style: discontinue
  nom: 'Ligne jaune discontinue (sur bordure) : stationnement interdit'
  signification: 'Ligne jaune discontinue sur la bordure ou en rive : stationnement interdit, arrêt autorisé.'
  conduite: On peut s'arrêter brièvement (dépose, chargement) mais pas stationner.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  prerequis:
  - l-arret-vs-stationnement
- id: marq-ligne-jaune-zigzag
  type: marquage
  image:
    gen: ligne_jaune
    params:
      style: zigzag
  nom: 'Ligne jaune en zigzag : arrêt de bus'
  signification: 'Ligne jaune en zigzag le long du trottoir, qui matérialise un arrêt d''autobus : les autres véhicules ne s''y arrêtent ni n''y stationnent pendant la période où circulent les bus.'
  conduite: Laisser l’emplacement libre ; ne pas gêner le bus qui repart.
  complement: 'S’y arrêter ou y stationner est gênant : fourrière possible.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: Même le temps de déposer quelqu’un, s’y arrêter est interdit.
  comparaisons:
  - ref: marq-ligne-jaune-discontinue
    legende: 'Jaune discontinue : l’arrêt reste permis.'
- id: marq-livraison
  type: marquage
  image:
    gen: livraison
    params: {}
  nom: Aire de livraison (ligne jaune discontinue + inscription LIVRAISON)
  signification: 'Emplacement réservé à l''arrêt des véhicules qui chargent ou déchargent des marchandises : ligne jaune discontinue et inscription « LIVRAISON ».'
  conduite: Aux heures où elle est réservée, ne pas y stationner.
  complement: 'Ligne discontinue : réservée aux livraisons les jours ouvrables de 7 h à 20 h, sauf autres horaires affichés ; en dehors, on peut y stationner. Double ligne continue : réservée en permanence.'
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-marquage-temporaire-jaune
  type: marquage
  image:
    gen: marquage_temporaire
    params: {}
  nom: Marquage temporaire jaune (chantier)
  signification: 'En zone de travaux, les lignes et flèches temporaires sont peintes en jaune : elles remplacent le marquage blanc permanent, même si celui-ci reste visible, et prévalent sur lui.'
  conduite: Suivre les lignes jaunes et ignorer les lignes blanches contradictoires.
  complement: Zones de chantier, basculements de chaussée.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-zone-bleue
  type: marquage
  image:
    gen: zone_bleue
    params: {}
  nom: Marquage bleu (zone bleue)
  signification: 'Emplacements délimités en bleu : stationnement gratuit à durée limitée, avec disque. Je lis les horaires et la durée autorisée sur les panneaux.'
  conduite: Apposer son disque de stationnement et respecter la durée maximale.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-damier-rouge-blanc
  type: marquage
  image:
    gen: damier
    params:
      colour: rouge
  nom: Damier rouge et blanc (voie de détresse)
  signification: Damier rouge et blanc peint au début d'une voie de détresse (lit d'arrêt) en fin de descente dangereuse.
  conduite: N'y entrer qu'en cas de défaillance des freins ; ne jamais s'y arrêter ou stationner.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-ralentisseur-triangles
  type: marquage
  image:
    gen: ralentisseur
    params:
      kind: dos_d_ane
  nom: Marquage d'un ralentisseur (triangles blancs)
  signification: Trois triangles blancs (« dents de requin »), pointes dans le sens de la circulation, peints sur la rampe d'un ralentisseur.
  conduite: 'Ralentir fortement avant de franchir : ces ralentisseurs se trouvent en agglomération, souvent en zone 30.'
  complement: Ne pas confondre avec le grand triangle isolé, pointe vers le conducteur, qui peut précéder une ligne de cédez-le-passage.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-plateau-sureleve
  type: marquage
  image:
    gen: ralentisseur
    params:
      kind: plateau
  nom: Ralentisseur de type trapézoïdal (plateau surélevé)
  signification: 'Ralentisseur trapézoïdal : rampes d''accès et plateau plat sur toute la largeur de la chaussée, souvent avec passage piéton surélevé.'
  conduite: Ralentir fortement ; céder le passage aux piétons si le plateau porte un passage.
  complement: Rencontré en agglomération, zones 30 et zones de rencontre.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-sas-velo
  type: marquage
  image:
    gen: passage
    params:
      kind: sas_velo
  nom: Sas vélo (sas cyclable)
  signification: Espace réservé aux cycles (et aux trottinettes électriques) entre deux lignes d'effet des feux (3 à 5 m), à un carrefour à feux.
  conduite: 'En voiture ou à moto : s''arrêter à la première ligne, jamais dans le sas.'
  complement: Il permet aux cyclistes de se placer devant, bien visibles, et de démarrer les premiers.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'S’engager dans le sas quand on risque d’y rester bloqué est une infraction ; franchir la ligne d’arrêt des voitures au rouge, c’est un feu grillé : 135 € et 4 points.'
- id: marq-cvcb
  type: marquage
  image:
    gen: cvcb
    params: {}
  nom: Chaussée à voie centrale banalisée (« chaucidou »)
  signification: 'Chaussée étroite sans ligne axiale : une voie centrale à double sens pour les véhicules et deux rives pour les cyclistes.'
  conduite: Rouler au centre, pas sur la rive ; pour croiser, se déporter après avoir vérifié l'absence de cycliste.
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: marq-losange-vr
  type: marquage
  image:
    gen: losange_sol
    params: {}
  nom: Losange blanc au sol (voie réservée)
  signification: Losange blanc peint dans l'axe d'une voie réservée (covoiturage, transports en commun, taxis) sur voie rapide, en complément du panneau à losange.
  conduite: Ne pas emprunter la voie si l'on n'appartient pas aux catégories autorisées (aux heures indiquées).
  theme: L
  sous_theme: marquages
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
