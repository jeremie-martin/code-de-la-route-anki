# Généré par build/import_signs.py depuis data/signs_inventory.yaml (5 entrées). Corrections manuelles : data/_meta/sign_overrides.yaml
- id: agent-bras-leve
  type: geste
  image:
    gen: agent
    params:
      pose: bras_leve
  nom: 'Agent : bras levé verticalement'
  signification: 'Bras levé verticalement : « attention, arrêt » pour tous, sauf ceux déjà engagés dans l''intersection, qui la dégagent, et ceux qui ne peuvent plus s''arrêter sans danger.'
  conduite: Je m’arrête avant l’intersection et j’attends le geste suivant.
  complement: Équivalent du jaune puis du rouge pour tout le monde. Les injonctions de l'agent prévalent sur les feux et les panneaux.
  theme: L
  sous_theme: agents
  source: Convention de Vienne sur la circulation routière (1968), art. 6 ; Code de la route, art. R411-28
- id: agent-bras-tendu-face
  type: geste
  image:
    gen: agent
    params:
      pose: bras_tendus
  nom: 'Agent : bras tendu(s) horizontalement, vu de face ou de dos'
  signification: 'Bras tendu(s) à l''horizontale : les usagers qui voient l''agent de face ou de dos s''arrêtent ; ceux qui le voient de profil passent.'
  conduite: Je m’arrête avant l’intersection et j’attends le geste suivant ; déjà engagé, je dégage le carrefour.
  complement: L’ordre reste valable quand l’agent baisse les bras.
  theme: L
  sous_theme: agents
  source: Convention de Vienne sur la circulation routière (1968), art. 6 ; Code de la route, art. R411-28
- id: agent-profil
  type: geste
  image:
    gen: intersection
    params:
      approaches:
        S:
          vehicle:
            colour: bleu
            me: true
          goes: straight
        E:
          vehicle:
            colour: rouge
      agent: bras_tendus_NS
    width: 800
  nom: Agent vu de profil (bras tendus ou baissés)
  signification: 'Je le vois de profil (dans l''alignement de ses bras tendus, ou de ses épaules bras baissés) : je suis autorisé à passer.'
  conduite: Passer prudemment, en suivant les gestes de l'agent ; céder le passage aux piétons.
  theme: L
  sous_theme: agents
  source: Convention de Vienne sur la circulation routière (1968), art. 6 ; Code de la route, art. R411-28
  question: Que dois-je faire à l'approche de cet agent ?
- id: agent-geste-avancer
  type: geste
  image:
    gen: agent
    params:
      pose: avancer
  nom: 'Agent : geste d''appel / de balancement du bras (avancer, accélérer)'
  signification: 'Geste d''usage, non défini par les textes : un va-et-vient du bras dans le sens de la circulation invite à avancer ou à accélérer ; un bras pointé indique où aller.'
  conduite: Avancer sans hésiter dans la direction indiquée, à allure modérée.
  theme: L
  sous_theme: agents
  source: Usage des agents ; Code de la route, art. R411-28 (les indications de l'agent prévalent)
- id: sr3a
  type: panneau
  code: SR3a
  image:
    commons: France road sign SR3a.svg
  nom: Panneau d'annonce de radar automatique fixe (« Pour votre sécurité, contrôles automatiques »)
  signification: 'Panneau d''information annonçant une zone de contrôle automatisé de la vitesse : « Pour votre sécurité, contrôles automatiques ».'
  conduite: Vérifier et respecter la limitation en vigueur ; ce panneau ne permet pas de déduire la distance exacte jusqu’au radar.
  complement: 'Panneau non obligatoire : les radars ne sont plus systématiquement annoncés. Les panneaux SR informent sans rien prescrire.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
