# Généré par build/import_signs.py depuis data/signs_inventory.yaml — 9 entrées. Corrections manuelles : data/_meta/sign_overrides.yaml
- id: ab1
  type: panneau
  code: AB1
  image:
    commons: France road sign AB1.svg
  nom: Intersection où s'applique la priorité à droite
  signification: 'Annonce une intersection où s''applique la priorité à droite : je cède aux véhicules venant de ma droite.'
  conduite: Ralentir, contrôler à droite et céder le passage ; ne pas compter sur sa propre priorité.
  complement: 'Signal avancé : environ 150 m avant l''intersection hors agglomération, 0 à 30 m en agglomération.'
  piege: 'Le panneau ne crée pas la règle, il la rappelle : la priorité à droite s''applique aussi sans panneau.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ab2
  type: panneau
  code: AB2
  image:
    commons: France road sign AB2.svg
  nom: Intersection avec une route non prioritaire (priorité ponctuelle)
  signification: Annonce une intersection où je suis prioritaire sur les routes transversales, pour cette intersection seulement.
  conduite: 'Continuer sans ralentir inutilement, mais rester vigilant : un usager peut griller son STOP.'
  complement: 'Signal avancé : environ 150 m avant l''intersection hors agglomération, 0 à 30 m en agglomération. Panonceau M7 possible.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Priorité PONCTUELLE (une seule intersection), contrairement à AB6 qui vaut sur toute la route.
- id: ab3a
  type: panneau
  code: AB3a
  image:
    commons: France road sign AB3a.svg
  nom: Cédez le passage
  signification: À l'intersection, céder le passage aux véhicules circulant sur la route croisée ou rejointe, sans obligation de s'arrêter.
  conduite: Ralentir, contrôler, s'arrêter à la ligne discontinue si nécessaire, et ne s'engager qu'en sécurité.
  complement: À hauteur de l'intersection, au niveau de la ligne discontinue T'2 (obligatoire). Aussi en fin de voie d'insertion et aux entrées de giratoire.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Triangle pointe en bas, reconnaissable de dos (comme AB3b/AB5 et le panonceau M12). Aux feux, le feu prévaut.
- id: ab3b
  type: panneau
  code: AB3b
  image:
    commons: France road sign AB3b.svg
  nom: Signal avancé de cédez-le-passage
  signification: Annonce un cédez-le-passage (AB3a) situé à la distance indiquée par le panonceau M1 (le plus souvent 150 m).
  conduite: Ralentir progressivement, se préparer à céder le passage à l'intersection annoncée.
  complement: Environ 150 m avant l'intersection hors agglomération (répété à mi-distance si placé à plus de 200 m). Distance sur panonceau M1.
  piege: AB3b = AB3a + panonceau de distance M1. Ne pas confondre avec AB5 (STOP à 150 m, panonceau M5).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ab4
  type: panneau
  code: AB4
  image:
    commons: France road sign AB4.svg
  nom: Arrêt à l'intersection (STOP)
  signification: Arrêt absolu obligatoire à la limite de la chaussée abordée, puis céder le passage aux véhicules circulant sur l'autre route.
  conduite: S'arrêter roues immobilisées à la ligne continue, même si la voie semble libre.
  complement: L'arrêt se fait à la ligne (largeur 50 cm), pas au panneau ; sans ligne, à l'aplomb du panneau. Aux feux, le feu prévaut.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Seul panneau octogonal en France : reconnaissable de dos. Non-respect : 135 € et 4 points.'
- id: ab5
  type: panneau
  code: AB5
  image:
    commons: France road sign AB5.svg
  nom: Signal avancé de STOP
  signification: Annonce un panneau STOP (AB4) situé à la distance indiquée par le panonceau M5 (le plus souvent 150 m).
  conduite: Ralentir, se préparer à marquer l'arrêt à l'intersection annoncée.
  complement: Environ 150 m avant le STOP hors agglomération ; distance portée par le panonceau M5.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'AB5 ne demande pas de s''arrêter à son niveau : l''arrêt se fait au STOP, 150 m plus loin.'
- id: ab6
  type: panneau
  code: AB6
  image:
    commons: France road sign AB6.svg
  nom: Route à caractère prioritaire
  signification: 'La route suivie est prioritaire : à toutes les intersections jusqu''au panneau AB7, les routes transversales cèdent le passage.'
  conduite: Continuer sans ralentir inutilement ; céder quand même aux piétons, tramways et véhicules prioritaires en intervention.
  complement: 'Au début de la route prioritaire, rappelé après les intersections importantes et à l''entrée d''agglomération. Fin : AB7.'
  piege: 'Un STOP ou un cédez-le-passage rencontré ensuite l''emporte : le panneau le plus récent s''applique.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ab7
  type: panneau
  code: AB7
  image:
    commons: France road sign AB7.svg
  nom: Fin de route à caractère prioritaire
  signification: Indique la fin du caractère prioritaire de la route ; à partir de là, sauf signalisation contraire, la règle générale de la priorité à droite s'applique.
  conduite: 'Redoubler de vigilance aux intersections suivantes : céder le passage aux véhicules venant de droite en l''absence de signalisation.'
  complement: Implanté à l'endroit où cesse le caractère prioritaire ; souvent à l'entrée d'agglomération, sur le même support qu'EB10.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ab25
  type: panneau
  code: AB25
  image:
    commons: France road sign AB25.svg
  nom: Carrefour à sens giratoire
  signification: 'Annonce un carrefour à sens giratoire : les usagers déjà engagés dans l''anneau sont prioritaires.'
  conduite: Ralentir, céder le passage à l'anneau, clignotant gauche si je dépasse la moitié, clignotant droit avant de sortir.
  complement: Signal avancé 150 m avant hors agglomération ; en position, AB3a et ligne discontinue à chaque entrée.
  piege: Carrefour à sens giratoire (AB25 + AB3a) = priorité à l'anneau ; rond-point sans cédez-le-passage = priorité à droite, celui qui entre passe.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
