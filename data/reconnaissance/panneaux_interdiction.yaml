- id: b2c
  type: panneau
  code: B2c
  image:
    commons: France road sign B2c.svg
  nom: Interdiction de faire demi-tour
  signification: Interdiction de faire demi-tour sur la route suivie, jusqu'à la prochaine intersection.
  conduite: Ne pas faire demi-tour ; continuer et changer de direction plus loin.
  complement: Placé avant la section où s'applique l'interdiction. Sans panneau, le demi-tour est interdit sur autoroute et route express (R421-6, R432-3) et dans les tunnels (C111) ; il est de toute façon impossible sur une voie à sens unique et dangereux partout où la visibilité est insuffisante (virage, sommet de côte).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b3
  type: panneau
  code: B3
  image:
    commons: France road sign B3.svg
  nom: Interdiction de dépasser tous les véhicules à moteur autres que ceux à deux roues sans side-car
  signification: Interdiction de dépasser les véhicules à moteur, à l'exception des deux-roues motorisés sans side-car. On peut donc encore dépasser un cycliste, un cyclomoteur, une moto solo ou un véhicule à traction animale.
  conduite: Rester derrière les voitures, camions, tracteurs, motos avec side-car ; dépasser uniquement les deux-roues sans side-car et les véhicules sans moteur, si les conditions le permettent.
  complement: 'Placé à l''endroit où commence l''interdiction ; répété après chaque intersection (sauf voies privées et chemins de terre). Peut être complété par un panonceau M2 (étendue) ou M9 « rappel ». Fin : B34, B31, ou à la prochaine intersection si le panneau n''est pas répété. Sur les panneaux d''interdiction de dépasser, la voiture ROUGE est à gauche (celle qui dépasserait).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b3a
  type: panneau
  code: B3a
  image:
    commons: France road sign B3a.svg
  nom: Interdiction de dépasser pour les véhicules de transport de marchandises de plus de 3,5 t
  signification: Interdiction, pour les véhicules affectés au transport de marchandises dont le PTAC ou le PTRA dépasse 3,5 t, de dépasser les véhicules à moteur autres que les deux-roues sans side-car.
  conduite: Ne concerne pas le conducteur d'une voiture ; les poids lourds doivent rester dans leur voie.
  complement: 'Placé à l''endroit où commence l''interdiction ; répété après chaque intersection (sauf voies privées et chemins de terre). Fin : B34a. Un panonceau M4f peut modifier le seuil de tonnage.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
