- id: b0
  type: panneau
  code: B0
  image:
    commons: France road sign B0.svg
  nom: Circulation interdite à tout véhicule dans les deux sens
  signification: Interdiction de circuler à tout véhicule (avec ou sans moteur, y compris les cycles), dans les deux sens. Seuls les piétons peuvent passer.
  conduite: Ne pas s'engager. Un panonceau peut prévoir des exceptions (« sauf riverains », « sauf livraisons »).
  piege: 'Le cercle est vide : l’interdiction vaut dans les deux sens, pas seulement à l’entrée.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  comparaisons:
  - ref: b1
    legende: 'Barre blanche : entrée interdite par ce côté.'
- id: b1
  type: panneau
  code: B1
  image:
    commons: France road sign B1.svg
  nom: Sens interdit à tout véhicule
  signification: 'Interdiction de s''engager : la voie est à sens unique dans l''autre sens. Tous les véhicules, cycles compris, sauf panonceau.'
  conduite: Je ne m’engage pas. Une exception « sauf vélos » peut autoriser les cyclistes à emprunter cette entrée.
  complement: Dans les zones 30 et zones de rencontre, des cyclistes peuvent arriver en face (double-sens cyclable).
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'La barre blanche ne vise que l’entrée par ce côté : la rue est circulée dans l’autre sens.'
  comparaisons:
  - ref: b0
    legende: 'Cercle vide : circulation interdite dans les deux sens.'
- id: b1j
  type: panneau
  code: B1j
  image:
    commons: France road sign B1j.svg
  nom: Sens interdit sur bretelle (fond jaune)
  signification: 'Sens interdit sur fond jaune, renforcé pour être vu : je ne m’engage pas.'
  conduite: 'Ne jamais s''engager : on remonte une bretelle de sortie à contresens.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
  piege: 'Ici le fond jaune n''est pas une signalisation temporaire : c''est un renforcement (carré, exception à la forme ronde des B).'
- id: b2a
  type: panneau
  code: B2a
  image:
    commons: France road sign B2a.svg
  nom: Interdiction de tourner à gauche à la prochaine intersection
  signification: Il est interdit de tourner à gauche à la prochaine intersection.
  conduite: Continuer tout droit ou tourner à droite ; ne pas tourner à gauche même si la voie paraît libre.
  piege: L’interdiction vise la prochaine intersection. Une flèche dans un rond rouge interdit une direction ; dans un rond bleu, elle impose une direction.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: b2b
  type: panneau
  code: B2b
  image:
    commons: France road sign B2b.svg
  nom: Interdiction de tourner à droite à la prochaine intersection
  signification: Il est interdit de tourner à droite à la prochaine intersection.
  conduite: Continuer tout droit ou tourner à gauche.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: b2c
  type: panneau
  code: B2c
  image:
    commons: France road sign B2c.svg
  nom: Interdiction de faire demi-tour
  signification: Interdiction de faire demi-tour sur la route suivie, jusqu'à la prochaine intersection.
  conduite: Ne pas faire demi-tour ; continuer et changer de direction plus loin.
  complement: Même sans ce panneau, le demi-tour est interdit sur autoroute, sur route express et dans un tunnel signalé par le panneau tunnel. Il ferait aussi circuler à contresens dans une rue à sens unique.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
