  signification: Interdiction d'accès aux véhicules transportant des marchandises dangereuses (signalés par des plaques orange), typiquement à l'entrée de certains tunnels et zones urbaines.
  complement: Placé à l'endroit où commence l'interdiction ; répété après chaque intersection (sauf voies privées et chemins de terre).
