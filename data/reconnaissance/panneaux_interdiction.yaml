  nom: Stationnement interdit du 16 à la fin du mois
  signification: Stationnement interdit, du côté du panneau, du 16 à la fin du mois ; autorisé de ce côté du 1er au 15.
  conduite: 'Du 16 à la fin du mois : se garer de l''autre côté ; changement de côté le 15 et le dernier jour du mois entre 20 h 30 et 21 h.'
