- id: b6d
  type: panneau
  code: B6d
  image:
    commons: France road sign B6d.svg
  nom: Arrêt et stationnement interdits
  signification: Interdiction de s'arrêter et de stationner du côté du panneau, jusqu'à la prochaine intersection (sauf panonceau). Même une immobilisation brève est interdite (hors nécessité absolue).
  conduite: Ne pas s'immobiliser, même pour déposer quelqu'un ; continuer.
  complement: 'Placé du côté où l''interdiction s''applique ; panonceaux M8 et M6a (« gênant » : fourrière) possibles. Fin : Prochaine intersection ou panonceau M8b. Se rencontre devant les arrêts de bus, casernes de pompiers, écoles… Une ligne jaune CONTINUE sur la bordure du trottoir signifie la même chose (arrêt interdit) ; une ligne jaune discontinue = stationnement interdit seulement.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
