  signification: 'Dans un passage étroit, céder le passage aux véhicules venant en sens inverse : la priorité est à ceux d''en face.'
  conduite: Ralentir, s'arrêter avant le rétrécissement si un véhicule arrive en face, et ne s'engager que lorsque la voie est libre.
