  nom: Interdiction de faire demi-tour
  signification: Interdiction de faire demi-tour sur la route suivie, jusqu'à la prochaine intersection.
  conduite: Ne pas faire demi-tour ; continuer et changer de direction plus loin.
  complement: Sans panneau, le demi-tour est interdit sur autoroute et route express (R421-6, R432-3) et dans les tunnels (C111) ; il est impossible en sens unique.
