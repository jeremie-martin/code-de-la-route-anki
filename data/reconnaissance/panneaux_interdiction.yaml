- id: b0
  type: panneau
  code: B0
  image:
    commons: France road sign B0.svg
  nom: Circulation interdite à tout véhicule dans les deux sens
  signification: Interdiction de circuler à tout véhicule (avec ou sans moteur, y compris les cycles), dans les deux sens. Seuls les piétons peuvent passer.
  conduite: Ne pas s'engager. Un panonceau peut prévoir des exceptions (« sauf riverains », « sauf livraisons »).
  complement: Placé à l'endroit où commence l'interdiction ; répété après chaque intersection (sauf voies privées et chemins de terre).
  piege: 'B0 (blanc, cercle rouge vide) = interdit à TOUT véhicule dans les DEUX sens ; B1 (rouge, barre blanche) = sens interdit dans UN sens. Ne pas confondre avec B31 (fin de toutes interdictions : blanc, barre noire oblique).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b1
  type: panneau
  code: B1
  image:
    commons: France road sign B1.svg
  nom: Sens interdit à tout véhicule
  signification: 'Interdiction de s''engager dans cette voie : elle est à sens unique dans l''autre sens. Concerne tous les véhicules, cycles compris, sauf panonceau.'
  conduite: 'Ne pas s''engager. Avec le panonceau M9v1/M9v2 (« sauf vélo »), les cyclistes peuvent l''emprunter à contresens (double-sens cyclable) : attention en croisant ou en tournant.'
  complement: 'Placé à l''entrée de la voie (à l''endroit où commence l''interdiction), généralement des deux côtés de la chaussée. L''autre extrémité de la rue porte un C12 (sens unique). Le double-sens cyclable est la règle par défaut dans les zones 30 et zones de rencontre depuis le décret 2008-754 (généralisation au 1er juillet 2010), étendue en 2015 (décret 2015-808) à toutes les voies limitées à 30 km/h ou moins : le B1 y est complété par M9v2. Fichier Commons « France road sign B1+M9.svg » existe pour le B1 + panonceau.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b1j
  type: panneau
  code: B1j
  image:
    commons: France road sign B1j.svg
  nom: Sens interdit sur bretelle (fond jaune)
  signification: 'Panneau B1 inscrit dans un carré jaune : rappel renforcé du sens interdit sur les bretelles de sortie d''autoroute ou de route à chaussées séparées, pour éviter les prises à contresens.'
  conduite: 'Ne jamais s''engager : on remonte une bretelle de sortie à contresens.'
  complement: Sur les bretelles de sortie d'autoroute/route à chaussées séparées, face aux usagers qui pourraient s'y engager par erreur. Le fond jaune n'indique pas ici une signalisation temporaire mais un renforcement (panneau carré, exception à la forme ronde des B). Créé en 2008 pour lutter contre les contresens.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b2a
  type: panneau
  code: B2a
  image:
    commons: France road sign B2a.svg
  nom: Interdiction de tourner à gauche à la prochaine intersection
  signification: Il est interdit de tourner à gauche à la prochaine intersection.
  conduite: Continuer tout droit ou tourner à droite ; ne pas tourner à gauche même si la voie paraît libre.
  complement: Placé avant l'intersection concernée (à une distance appropriée), et non à l'endroit même.
  piege: l'interdiction ne vaut que pour LA prochaine intersection. Rond rouge = interdiction ; rond bleu (B21) = obligation.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
