- id: b19
  type: panneau
  code: B19
  image:
    commons: France road sign B19.svg
  nom: Autre interdiction (par inscription)
  signification: Interdiction dont la nature est indiquée par une inscription sur le panneau (ex. « interdit aux quads », « interdit aux trottinettes »).
  conduite: Lire l'inscription et s'y conformer.
  complement: 'Placé à l''endroit où commence l''interdiction ; répété après chaque intersection (sauf voies privées et chemins de terre). Fin : B39.'
