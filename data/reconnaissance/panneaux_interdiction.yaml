- id: b0
  type: panneau
  code: B0
  image:
    commons: France road sign B0.svg
  nom: Circulation interdite à tout véhicule dans les deux sens
  signification: Interdiction de circuler à tout véhicule (avec ou sans moteur, y compris les cycles), dans les deux sens. Seuls les piétons peuvent passer.
  conduite: Ne pas s'engager. Un panonceau peut prévoir des exceptions (« sauf riverains », « sauf livraisons »).
  piege: B0 (cercle rouge vide) = interdit dans les DEUX sens ; B1 (rouge à barre blanche) = sens interdit.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b1
  type: panneau
  code: B1
  image:
    commons: France road sign B1.svg
  nom: Sens interdit à tout véhicule
  signification: 'Interdiction de s''engager : la voie est à sens unique dans l''autre sens. Tous les véhicules, cycles compris, sauf panonceau.'
  conduite: Ne pas s'engager. Avec un panonceau M9v1/M9v2 (« sauf vélo »), les cyclistes l'empruntent à contresens.
  complement: À l'entrée de la voie, souvent des deux côtés ; l'autre extrémité porte un C12. Double-sens cyclable par défaut sous 30 km/h.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Ne pas confondre avec B0 (cercle rouge vide), qui interdit la circulation dans les deux sens.
- id: b1j
  type: panneau
  code: B1j
  image:
    commons: France road sign B1j.svg
  nom: Sens interdit sur bretelle (fond jaune)
  signification: 'Panneau B1 inscrit dans un carré jaune : rappel renforcé du sens interdit sur les bretelles de sortie.'
  conduite: 'Ne jamais s''engager : on remonte une bretelle de sortie à contresens.'
  complement: Sur les bretelles de sortie, face aux usagers qui pourraient s'y engager par erreur.
