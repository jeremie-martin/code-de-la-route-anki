- id: b6a1
  type: panneau
  code: B6a1
  image:
    commons: France road sign B6a1.svg
  nom: Stationnement interdit
  signification: Interdiction de stationner du côté de la route où le panneau est implanté, jusqu'à la prochaine intersection (sauf panonceau). L'arrêt (immobilisation brève, conducteur au volant ou à proximité, prêt à repartir) reste autorisé.
  conduite: Ne pas stationner ; on peut s'arrêter le temps de déposer un passager ou charger/décharger rapidement. Le stationnement de l'autre côté reste possible sauf interdiction.
  complement: 'Placé du côté où le stationnement est interdit ; panonceaux M8 (flèches de début/fin/rappel), M6a « gênant » (fourrière), M6b (jours), M6f (précisions), M4 (catégories). Fin : prochaine intersection ou panonceau M8b (fin de section) ; en zone (B6b1), la fin est le panneau B50a.'
  piege: 1 barre = stationnement interdit (arrêt possible) ; 2 barres en croix (B6d) = arrêt ET stationnement interdits. L'interdiction vaut jusqu'à la prochaine intersection, même sans panonceau. B31 ne met PAS fin à une interdiction de stationner (il ne concerne que les véhicules en mouvement).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6a2
  type: panneau
  code: B6a2
  image:
    commons: France road sign B6a2.svg
  nom: Stationnement interdit du 1er au 15 du mois
  signification: Stationnement interdit, du côté du panneau, du 1er au 15 de chaque mois (stationnement unilatéral à alternance semi-mensuelle) ; autorisé de ce côté du 16 à la fin du mois.
  conduite: 'Du 1er au 15 : se garer de l''autre côté. Le changement de côté se fait le 15 et le dernier jour du mois entre 20 h 30 et 21 h.'
  complement: Placé du côté concerné ; souvent complété du panonceau M6b « du 1er au 15 ». Les chiffres portés sont les jours où c'est INTERDIT de ce côté.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
