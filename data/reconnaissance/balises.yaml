# Généré par build/import_signs.py depuis data/signs_inventory.yaml — 13 entrées. Corrections manuelles : data/_meta/sign_overrides.yaml
- id: j1
  type: balise
  code: J1
  image:
    gen: balise_piquet
    params:
      kind: j1
  nom: Balise de virage
  signification: Balise blanche portant une bande (collier) rétroréfléchissante blanche, implantée sur l'extérieur d'un virage pour en matérialiser le tracé, surtout de nuit ou par mauvaise visibilité.
  conduite: Ralentir avant le virage ; les balises montrent où va la route.
  complement: À l'extérieur des virages mal perçus ; J1bis (sommet rouge) sur routes enneigées.
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Mémo des balises-piquets : J1 (virage) = bande BLANCHE ; J3 (intersection) = bande ROUGE ; J6 (délinéateur) = bande noire oblique avec catadioptre. J1bis = sommet rouge (routes enneigées).'
- id: j1bis
  type: balise
  code: J1bis
  image:
    gen: balise_piquet
    params:
      kind: j1bis
  nom: Balise de virage pour routes enneigées
  signification: Balise de virage dont la partie située au-dessus de la bande rétroréfléchissante est rouge, pour rester visible sur les routes fréquemment enneigées.
  theme: L
  sous_theme: balises
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j3
  type: balise
  code: J3
  image:
    gen: balise_piquet
    params:
      kind: j3
  nom: Balise d'intersection
  signification: Balise implantée de part et d'autre d'une intersection (hors agglomération) pour en signaler la position, quel que soit le régime de priorité.
  conduite: 'Une intersection est proche : réduire l''allure et contrôler les côtés.'
  complement: En position, à l'intersection.
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Bande ROUGE = intersection (J3) ; bande blanche = virage (J1). Le J3 ne dit rien du régime de priorité : il signale seulement qu''une intersection est là.'
- id: j4
  type: balise
  code: J4
  image:
    commons: FR road beacon J4.svg
  nom: Balise de virage à chevrons
  signification: Balise rectangulaire à chevron(s) blanc(s) sur fond bleu, implantée à l'extérieur d'un virage dangereux ; la pointe des chevrons indique le sens du virage. Existe en mono-chevron et multi-chevrons.
  conduite: 'Ralentir fortement : le virage est serré ; suivre la direction des chevrons.'
  complement: À l'extérieur du virage, face aux usagers ; peut être surmontée d'un feu jaune clignotant R1. Chevrons blancs sur fond BLEU = J4 (virage) ; chevrons blancs sur fond VERT = J14b (musoir, divergence).
  theme: L
  sous_theme: balises
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j5
  type: balise
  code: J5
  image:
    commons: France road sign J5.svg
  nom: Balise de tête d'îlot (contournement par la droite)
  signification: 'Balise carrée à fond bleu portant une large flèche blanche oblique pointant vers le bas à droite, implantée en tête d''un îlot directionnel ou d''un terre-plein : passer à droite.'
  conduite: Passer à droite de la balise (comme B21a1).
  complement: En tête d'îlot, souvent à l'entrée des giratoires.
  theme: L
  sous_theme: balises
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j6
  type: balise
  code: J6
  image:
    commons: FR road beacon J6.svg
  nom: Délinéateur (balise de délimitation de chaussée)
  signification: Piquets blancs trapézoïdaux (1 m) espacés régulièrement le long des accotements, portant une bande noire oblique munie d'un catadioptre blanc, pour matérialiser les limites de la chaussée la nuit et par brouillard.
  conduite: S'en servir pour évaluer le tracé et garder sa trajectoire de nuit.
  complement: En bord de chaussée, tous les 50 à 100 m (plus rapprochés en virage).
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: J1 (virage) = bande blanche ; J3 (intersection) = bande rouge ; J6 (délinéateur) = bande noire oblique + catadioptre blanc.
- id: j7
  type: balise
  code: J7
  image:
    commons: FR road beacon J7.svg
  nom: Manche à air
  signification: Manche à air indiquant l'endroit où souffle fréquemment un vent latéral violent, ainsi que sa direction et son intensité (manche horizontale = vent fort).
  conduite: Tenir fermement le volant, ralentir, anticiper les rafales à la sortie d'un abri ; attention aux deux-roues et véhicules hauts.
  complement: À l'endroit exposé, en complément du panneau A24.
  theme: L
  sous_theme: balises
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j10
  type: balise
  code: J10
  image:
    commons: France road sign J10 3 barres.svg
  nom: Balise de passage à niveau
  signification: Balises rectangulaires blanches portant trois, deux, puis une bande rouge oblique, placées respectivement à 150 m, 100 m et 50 m du passage à niveau (hors agglomération) ; elles décomptent la distance restante. La première (3 bandes) est fixée sous le panneau A7 ou A8.
  conduite: Ralentir progressivement ; à la balise à une bande, le passage à niveau est à 50 m.
  complement: 'Sur le support de A7/A8 puis aux 2/3 et 1/3 de la distance ; facultatives en agglomération (où A7/A8 est à 50 m). Fichiers Commons : « France road sign J10 3 barres.svg », « … 2 barres », « … 1 barre ». Nombre de bandes = nombre de tiers de distance restants (3 = 150 m, 2 = 100 m, 1 = 50 m).'
  theme: L
  sous_theme: balises
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j11
  type: balise
  code: J11
  image:
    commons: FR road beacon J11.svg
  nom: Balise de renforcement d'un marquage continu
  signification: Balise blanche souple implantée sur une ligne continue pour en renforcer la perception et empêcher son franchissement (ex. approche d'un carrefour, terre-plein).
  conduite: 'Ne pas franchir : la ligne continue reste infranchissable.'
  complement: Sur l'axe, en renforcement du marquage.
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j12
  type: balise
  code: J12
  image:
    commons: FR road beacon J12.svg
  nom: Balise de renforcement d'un marquage en divergent
  signification: Balise verte implantée sur le marquage d'une divergence (séparation de deux chaussées, bretelle de sortie) pour renforcer la perception du musoir.
  conduite: Choisir sa direction à l'avance ; ne pas franchir le divergent au dernier moment.
  complement: Sur le marquage divergent.
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j13
  type: balise
  code: J13
  image:
    commons: FR road beacon J13.svg
  nom: Balise de signalisation d'obstacle
  signification: Balise à bandes obliques alternées bleues et blanches signalant un obstacle permanent (pile de pont, mur, îlot, borne) proche de la chaussée.
  conduite: Garder ses distances avec l'obstacle signalé.
  complement: Sur l'obstacle. Bandes bleues/blanches = obstacle permanent (J13) ; bandes rouges/blanches = obstacle temporaire (K5c, K8).
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j14a
  type: balise
  code: J14a
  image:
    commons: FR road beacon J14a.svg
  nom: Balise de musoir (divergence de voies)
  signification: 'Balise en demi-cercle à fond vert portant deux flèches blanches divergentes, implantée en tête de musoir (séparation de deux chaussées : sortie d''autoroute, bifurcation). J14b : série de chevrons blancs sur fond vert.'
  conduite: Décider tôt de sa direction ; ne jamais franchir le musoir ni faire marche arrière si l'on a raté sa sortie.
  complement: En tête de musoir.
  theme: L
  sous_theme: balises
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j14b
  type: balise
  code: J14b
  image:
    commons: FR road beacon J14b.svg
  nom: Balise de musoir à chevrons
  signification: Série d'éléments à chevron blanc sur fond vert matérialisant la divergence des voies (musoir).
  theme: L
  sous_theme: balises
  importance: rare
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
