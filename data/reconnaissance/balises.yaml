# Généré par build/import_signs.py depuis data/signs_inventory.yaml — 9 entrées. Corrections manuelles : data/_meta/sign_overrides.yaml
- id: j1
  type: balise
  code: J1
  image:
    gen: balise_piquet
    params:
      kind: j1
  nom: Balise de virage
  signification: Balise blanche à collier rétroréfléchissant blanc, implantée à l'extérieur d'un virage pour en matérialiser le tracé.
  conduite: Ralentir avant le virage ; les balises montrent où va la route.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: J1 (virage) = bande BLANCHE ; J3 (intersection) = bande ROUGE ; J6 (délinéateur) = bande noire oblique.
- id: j3
  type: balise
  code: J3
  image:
    gen: balise_piquet
    params:
      kind: j3
  nom: Balise d'intersection
  signification: Balise implantée de part et d'autre d'une intersection (hors agglomération) pour en signaler la position, quel que soit le régime de priorité.
  conduite: 'Une intersection est proche : réduire l''allure et contrôler les côtés.'
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Bande ROUGE = intersection (J3) ; bande blanche = virage (J1). Le J3 ne dit rien du régime de priorité : il signale seulement qu''une intersection est là.'
- id: j4
  type: balise
  code: J4
  image:
    commons: FR road beacon J4.svg
  nom: Balise de virage à chevrons
  signification: 'Balise à chevron(s) blanc(s) sur fond bleu, à l''extérieur d''un virage dangereux : la pointe indique le sens du virage.'
  conduite: 'Ralentir fortement : le virage est serré ; suivre la direction des chevrons.'
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Chevrons blancs sur fond BLEU = J4 (virage) ; sur fond VERT = J14b (musoir, divergence).
- id: j5
  type: balise
  code: J5
  image:
    commons: France road sign J5.svg
  nom: Balise de tête d'îlot (contournement par la droite)
  signification: 'Balise carrée bleue à large flèche blanche oblique, en tête d''un îlot ou d''un terre-plein : passer à droite.'
  conduite: Passer à droite de la balise (comme B21a1).
  complement: En tête d’îlot, souvent à l’entrée d’un giratoire.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j6
  type: balise
  code: J6
  image:
    commons: FR road beacon J6.svg
  nom: Délinéateur (balise de délimitation de chaussée)
  signification: Piquets blancs (1 m) espacés le long de l'accotement, portant une bande noire oblique et un catadioptre blanc.
  conduite: S'en servir pour évaluer le tracé et garder sa trajectoire de nuit.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: J1 (virage) = bande blanche ; J3 (intersection) = bande rouge ; J6 (délinéateur) = bande noire oblique + catadioptre blanc.
- id: j7
  type: balise
  code: J7
  image:
    commons: FR road beacon J7.svg
  nom: Manche à air
  signification: Manche à air indiquant l'endroit où souffle fréquemment un vent latéral violent, ainsi que sa direction et son intensité (manche horizontale = vent fort).
  conduite: Tenir fermement le volant, ralentir, anticiper les rafales à la sortie d'un abri ; attention aux deux-roues et véhicules hauts.
  complement: Signale l’endroit précis exposé au vent, en complément du panneau A24.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j10
  type: balise
  code: J10
  image:
    commons: France road sign J10 3 barres.svg
  nom: Balise de passage à niveau
  signification: Balises blanches à trois, deux puis une bande rouge oblique, placées à 150 m, 100 m et 50 m du passage à niveau (hors agglomération).
  conduite: 'Ralentir progressivement : à la balise à une seule bande, le passage à niveau est à 50 m.'
  complement: La première balise (3 bandes) est sous le panneau A7 ou A8. Elles peuvent manquer en agglomération.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j13
  type: balise
  code: J13
  image:
    commons: FR road beacon J13.svg
  nom: Balise de signalisation d'obstacle
  signification: Balise à bandes obliques bleues et blanches signalant un obstacle permanent proche de la chaussée.
  conduite: Garder ses distances avec l'obstacle signalé.
  complement: Bandes bleues/blanches = obstacle permanent ; rouges/blanches = obstacle temporaire (K5c, K8).
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: j14a
  type: balise
  code: J14a
  image:
    commons: FR road beacon J14a.svg
  nom: Balise de musoir (divergence de voies)
  signification: Balise en demi-cercle vert à deux flèches blanches divergentes, en tête de musoir (sortie d'autoroute, bifurcation).
  conduite: Décider tôt de sa direction ; ne jamais franchir le musoir ni faire marche arrière.
  theme: L
  sous_theme: balises
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
