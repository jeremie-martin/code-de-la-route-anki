  nom: Panneau de direction à fond marron (site touristique / culturel)
  signification: 'Fond marron : indication d''un site ou d''un itinéraire d''intérêt culturel ou touristique (château, musée, parc naturel), avec pictogramme (idéogramme ID).'
  theme: L
  sous_theme: panneaux
