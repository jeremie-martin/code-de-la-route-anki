  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: d50
  type: panneau
  code: D50
  image:
    commons: France road sign D52a.svg
  nom: Panneau d'avertissement de sortie ou de bifurcation (D51/D52)
  signification: Sur autoroute, panneau annonçant à 2 000 m / 1 000 m / 500 m la proximité d'un échangeur ou d'une bifurcation ; variante Da50 avec affectation de voies.
  conduite: Se rabattre à droite progressivement pour sortir ; la sortie est signalée par un numéro (cartouche M10b).
  complement: 2 000 m, 1 000 m et 500 m avant l'échangeur.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: d60
  type: panneau
  code: D60
  image:
    commons: France road sign D61b.svg
  nom: Panneau de confirmation (D61/D62)
  signification: Panneau placé après un carrefour ou un échangeur confirmant les directions desservies par la route et leurs distances (kilomètres).
  conduite: Vérifier qu'on est sur le bon itinéraire.
  complement: Après le carrefour ou l'échangeur.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
