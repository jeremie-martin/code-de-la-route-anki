- id: d-couleur-jaune
  type: panneau
  image:
    gen: direction_panel
    params:
      colour: jaune
      text: DÉVIATION
      dist: ''
  nom: Panneau de direction à fond jaune (temporaire / déviation)
  signification: 'Fond jaune : indication de direction à caractère temporaire ou d''exploitation (déviation, itinéraire de substitution, chantier).'
  conduite: Suivre l'itinéraire jaune de déviation ; il prime sur les indications permanentes contradictoires.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
