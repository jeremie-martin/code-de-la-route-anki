# Généré par build/import_signs.py depuis data/signs_inventory.yaml — 7 entrées. Corrections manuelles : data/_meta/sign_overrides.yaml
- id: d-couleur-bleu
  type: panneau
  image:
    gen: direction_panel
    params:
      colour: bleu
      text: LYON
      dist: '45'
  nom: Panneau de direction à fond bleu (autoroute)
  signification: 'Fond bleu : la direction indiquée est desservie par une autoroute (ou l''on se trouve sur le réseau autoroutier).'
  conduite: Suivre les panneaux bleus pour rejoindre ou rester sur l'autoroute ; anticiper le choix de voie.
  complement: 'Code des couleurs : bleu = autoroute ; vert = grande liaison (pôle vert) par route ordinaire ; blanc = itinéraire local ; jaune = temporaire (déviation) ; marron = touristique/culturel ; noir sur blanc/vert = itinéraire vélo (Dv) selon réseau.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: d-couleur-vert
  type: panneau
  image:
    gen: direction_panel
    params:
      colour: vert
      text: PARIS
      dist: '12'
  nom: Panneau de direction à fond vert (grande liaison)
  signification: 'Fond vert : la direction est un « pôle vert » (grande agglomération ou pôle générateur de trafic) desservi par une route ordinaire (nationale/départementale) sans emprunter l''autoroute.'
  conduite: Suivre le vert pour les longs trajets hors autoroute.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
