- id: d20
  type: panneau
  code: D21a
  image:
    commons: D21a.svg
  nom: Panneau de position (D21)
  signification: 'Panneau de direction en position : la pointe indique la voie à prendre au carrefour.'
  conduite: Tourner au niveau du panneau dans la direction de la pointe.
  theme: L
  sous_theme: panneaux
