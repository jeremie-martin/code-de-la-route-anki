- id: d40
  type: panneau
  code: D43
  image:
    commons: D43.svg
  nom: Panneau de présignalisation (D42/D43)
  signification: Annonce avant l’intersection la direction à suivre pour les destinations indiquées ; je prépare ma voie à l’avance.
  conduite: Choisir sa direction et sa voie à l'avance.
  complement: Lire la flèche et, si elle est affichée, la distance. Ne pas confondre l’annonce avec le panneau de position au carrefour.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: da40
  type: panneau
  code: Da40
  image:
    gen: direction_voies
  nom: Affectation des voies par direction (schéma simplifié)
  signification: 'Les flèches vers le bas désignent les voies : sur ce schéma, deux voies pour Paris et la voie de droite pour Lyon.'
  conduite: Choisir sa voie assez tôt, après contrôles ; ne pas couper les autres voies au dernier moment.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
- id: d50
  type: panneau
  code: D52a
  image:
    commons: France road sign D52a.svg
  nom: Panneau d'avertissement de sortie ou de bifurcation (D51/D52)
  signification: Sur autoroute, panneau annonçant à 2 000 m / 1 000 m / 500 m la proximité d'un échangeur ou d'une bifurcation ; variante Da50 avec affectation de voies.
  conduite: Je prépare ma sortie et me rabats progressivement à droite après contrôles ; je repère le numéro de sortie.
  complement: 2 000 m, 1 000 m et 500 m avant l'échangeur.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR, signalisation routière en France
