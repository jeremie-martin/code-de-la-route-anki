- id: b31
  type: panneau
  code: B31
  image:
    commons: France road sign B31.svg
  nom: Fin de toutes les interdictions précédemment signalées
  signification: Fin des interdictions signalées imposées aux véhicules en mouvement.
  conduite: Reprendre la vitesse réglementaire de la route et les manœuvres à nouveau autorisées.
  piege: Ne met pas fin aux interdictions d’arrêt ou de stationnement ; les règles générales restent applicables.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: Arrêté du 24 novembre 1967, art. 4, 5 et 7 — https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25
  tags:
  - revision::v3_1
- id: b33
  type: panneau
  code: B33
  image:
    commons: France road sign B33 (50).svg
  nom: Fin de limitation de vitesse
  signification: Fin de la limitation de vitesse indiquée ; la vitesse maximale redevient celle du régime général de la route (agglomération 50, route 80/90, 2×2 voies 110, autoroute 130).
  conduite: Reprendre la vitesse réglementaire applicable, sans dépasser celle qui est adaptée aux conditions.
  complement: 'Après un B33, ce n''est pas « vitesse libre » : c''est la limite générale du type de route qui s''applique. Variantes courantes : 30, 50, 70, 90, 110.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
