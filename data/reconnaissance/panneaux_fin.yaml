  sous_theme: panneaux
  source: Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25
- id: b33
  type: panneau
  code: B33
  image:
    commons: France road sign B33 (50).svg
  nom: Fin de limitation de vitesse
  signification: 'Fin de la limitation de vitesse indiquée : la vitesse maximale redevient celle du régime général de la route (agglomération 50, route 80 ou 90 selon la section, chaussées séparées par un terre-plein 110, autoroute 130).'
  conduite: Reprendre la vitesse réglementaire applicable, sans dépasser celle qui est adaptée aux conditions.
  complement: 'Après la fin de limitation, la vitesse n’est pas libre : la limite générale de la route et les autres limitations applicables restent à respecter.'
  theme: L
  sous_theme: panneaux
