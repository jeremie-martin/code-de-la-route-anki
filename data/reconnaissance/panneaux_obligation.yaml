  code: B21-2
  image:
    commons: France road sign B21-2.svg
  nom: Obligation de tourner à gauche avant le panneau
  signification: Le conducteur doit tourner à gauche avant le panneau.
  conduite: Tourner à gauche au niveau du panneau.
  complement: Placé en face de l'usager, au-delà de l'endroit où il doit tourner.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b21a1
  type: panneau
  code: B21a1
  image:
    commons: France road sign B21a1.svg
  nom: Contournement obligatoire par la droite
  signification: Obligation de contourner par la droite l'obstacle ou l'îlot devant lequel le panneau est placé (refuge, terre-plein, îlot central de giratoire, chantier).
  conduite: Passer à droite du panneau/obstacle.
  complement: 'Placé sur l''obstacle lui-même (tête d''îlot), souvent avec la balise J5. Se rencontre à l''entrée des giratoires (îlot central) et sur les refuges. Version temporaire jaune : sur balise K8.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b21a2
  type: panneau
  code: B21a2
  image:
    commons: France road sign B21a2.svg
  nom: Contournement obligatoire par la gauche
  signification: Obligation de contourner par la gauche l'obstacle devant lequel le panneau est placé.
  conduite: Passer à gauche du panneau/obstacle.
  complement: Placé sur l'obstacle lui-même.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b21b
  type: panneau
  code: B21b
  image:
    commons: France road sign B21b.svg
  nom: 'Direction obligatoire à la prochaine intersection : tout droit'
  signification: À la prochaine intersection, le conducteur doit continuer tout droit (interdiction de tourner à droite ou à gauche).
  conduite: Rester dans la voie qui va tout droit.
  complement: Placé avant l'intersection concernée, à distance appropriée (contrairement aux autres panneaux d'obligation placés à l'endroit où commence l'obligation).
  piege: B21b (rond bleu, flèche vers le haut) = obligation d'aller tout droit ; C12 (carré bleu, flèche vers le haut) = sens unique (indication).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
