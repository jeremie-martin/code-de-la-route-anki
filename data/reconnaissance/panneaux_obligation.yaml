- id: b21-1
  type: panneau
  code: B21-1
  image:
    commons: France road sign B21-1.svg
  nom: Obligation de tourner à droite avant le panneau
  signification: Le conducteur doit tourner à droite avant le panneau (le panneau est implanté en face, sur l'îlot ou le mur de fond).
  conduite: Tourner à droite au niveau du panneau ; clignotant, contrôle rétroviseur droit.
  complement: Placé en face de l'usager, au-delà de l'endroit où il doit tourner (sur l'îlot, le mur d'en face). Flèche horizontale = tourner AVANT le panneau (B21-1/-2) ; flèche coudée = tourner à la PROCHAINE intersection (B21c1/c2) ; flèche oblique vers le bas = contourner l'obstacle (B21a1/a2).
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b21-2
