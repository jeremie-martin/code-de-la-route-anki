- id: b25
  type: panneau
  code: B25
  image:
    commons: France road sign B25 (30).svg
  nom: Vitesse minimale obligatoire
  signification: Obligation de circuler au moins à la vitesse indiquée (ex. 30 km/h), sauf si les conditions (trafic, météo) ne le permettent pas. Concerne en pratique la voie sur laquelle il est implanté (voie de gauche d'une chaussée à plusieurs voies).
  conduite: Ne pas emprunter cette voie si l'on ne peut pas atteindre cette vitesse (véhicule lent, remorque).
  complement: 'Placé à l''endroit où commence l''obligation ; répété après chaque intersection. Fin : B43. Rond BLEU avec chiffre = vitesse MINIMALE ; rond rouge = maximale.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b26
  type: panneau
  code: B26
  image:
    commons: France road sign B26.svg
  nom: Chaînes à neige obligatoires
  signification: Obligation d'équiper d'au moins deux roues motrices de chaînes à neige (ou dispositifs équivalents) sur les routes enneigées à partir du panneau.
  conduite: 'S''arrêter sur l''aire de chaînage pour monter les chaînes ; sans chaînes, ne pas s''engager. Vitesse maxi avec chaînes : 50 km/h en général.'
  complement: 'Placé à l''endroit où commence l''obligation ; répété après chaque intersection. Fin : B44. Un panonceau M9 peut préciser « pneus neige admis ». Les pneus hiver marqués 3PMSF ne dispensent PAS d''obéir au B26 sauf mention sur panonceau. Depuis 2021, en zone B58, chaînes dans le coffre OU pneus hiver.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b27a
  type: panneau
  code: B27a
  image:
    commons: France road sign B27a.svg
  nom: Voie réservée aux véhicules des services réguliers de transport en commun
  signification: 'Voie (couloir) réservée aux autobus et cars de lignes régulières ; les autres véhicules ne peuvent pas y circuler (sauf catégories autorisées par panonceau : taxis, vélos, véhicules d''urgence, VTC selon arrêté local).'
  conduite: 'En voiture : ne pas y circuler ni y stationner ; on peut la traverser pour tourner ou accéder à un immeuble sans y circuler longitudinalement.'
  complement: 'Placé à l''endroit où commence l''obligation ; répété après chaque intersection. Fin : B45a. Exception à la règle « rond bleu = obligation » : les bus ne sont pas obligés de l''emprunter. Le couloir est délimité au sol par une ligne large T3 5u (traits longs rapprochés) et l''inscription BUS ; la ligne CONTINUE le rend infranchissable.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b27b
  type: panneau
  code: B27b
  image:
    commons: France road sign B27b.svg
  nom: Voie réservée aux tramways
  signification: Voie réservée aux tramways ; interdite aux autres véhicules.
  conduite: Ne pas y circuler ni s'y arrêter ; le tramway est prioritaire.
  complement: Placé à l'endroit où commence l'obligation ; répété après chaque intersection. Le panneau de fin B45b a été supprimé en 2009.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b29
  type: panneau
  code: B29
  image:
    commons: France road sign B29.svg
  nom: Autre obligation (par inscription)
  signification: Obligation dont la nature est indiquée par une inscription (ex. « Allumez vos feux », « Véhicules lents », « Pneus neige »).
  conduite: Lire l'inscription et s'y conformer.
  complement: 'Placé à l''endroit où commence l''obligation ; répété après chaque intersection. Fin : B49. « Allumez vos feux » à l''entrée d''un tunnel : obligation d''allumer les feux de croisement (pas seulement les feux de position).'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
