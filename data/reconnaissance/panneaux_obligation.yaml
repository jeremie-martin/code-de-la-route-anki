- id: b22a
  type: panneau
  code: B22a
  image:
    commons: France road sign B22a.svg
  nom: Piste ou bande cyclable obligatoire
  signification: Piste ou bande obligatoire pour les cycles sans side-car ni remorque ; les cyclistes doivent l'emprunter et les autres véhicules ne peuvent pas y circuler ni y stationner. Un panonceau M4d2 peut l'ouvrir aux cyclomoteurs.
  conduite: 'En voiture : ne pas y rouler ni s''y arrêter ; attention aux cyclistes en la coupant pour tourner (leur céder le passage si elle est prioritaire). À vélo : obligation de l''utiliser.'
  complement: 'Placé à l''endroit où commence l''obligation ; répété après chaque intersection. Fin : B40. Rond bleu = OBLIGATOIRE (B22a) ; carré bleu = CONSEILLÉ (C113). Interdit d''y stationner ou de s''y arrêter (stationnement très gênant : 135 €).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
