# Thème M : Voyants du tableau de bord (symboles ISO 7000 / ISO 2575, domaine public sur Commons)
# La couleur oriente ; lire le symbole, le message et la notice pour décider.
# Teintes : rouge #e53935, orange #fb8c00, vert #43a047, bleu #1e88e5.

# ---------- ROUGE ----------
- id: voyant-huile
  type: voyant
  code: ISO 7000-0248
  image: {commons: "ISO 7000 - Ref-No 0248.svg", tint: "#e53935"}
  question: En roulant, ce voyant rouge s’allume. Que signale-t-il et que faire ?
  nom: Pression d'huile moteur (rouge)
  signification: Alerte de pression d’huile insuffisante ; la lubrification du moteur est menacée.
  conduite: Je m’arrête en sécurité et coupe le moteur ; je suis la notice et fais appel à l’assistance.
    Un niveau normal ne suffit pas à autoriser le redémarrage.
  piege: Il signale la pression, pas seulement le niveau. Son allumage au contact, moteur arrêté, peut être
    normal ; c’est l’allumage en roulant qui est testé ici.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Renault, témoins lumineux, https://www.user-manual.renault.com/fr/chapitre1-faites-connaissance-avec-votre-v%C3%A9hicule/temoins-lumineux"
- id: voyant-batterie
  type: voyant
  code: ISO 7000-0247
  image:
    commons: ISO 7000 - Ref-No 0247.svg
    tint: '#e53935'
  question: En roulant, ce voyant rouge s’allume. Que signale-t-il et que faire ?
  nom: Charge de la batterie (rouge)
  signification: 'Défaut du circuit de charge : la batterie peut ne plus se recharger correctement.'
  conduite: Je gagne un endroit sûr et consulte les messages et la notice ; si le message « STOP » s’affiche aussi, arrêt impératif en sécurité.
  piege: 'L''autonomie restante est inconnue : les consommateurs (feux, climatisation) épuisent la batterie ; je n''ai
    aucune garantie de rejoindre un garage.'
  theme: M
  sous_theme: voyants
  source: "Renault, témoins lumineux (exemple constructeur ; consulter la notice du véhicule), https://www.user-manual.renault.com/fr/content/xfk/getting-know-your-vehicle/temoins-lumineux"
- id: voyant-temperature
  type: voyant
  code: ISO 7000-0246
  image: {commons: "ISO 7000 - Ref-No 0246.svg", tint: "#e53935"}
  nom: Température du liquide de refroidissement (rouge)
  signification: "Le moteur surchauffe : manque de liquide, fuite ou ventilateur en panne, par exemple. Cela risque d'endommager le joint de culasse ou de casser le moteur."
  conduite: Je m’arrête en sécurité et suis la notice pour le moteur (arrêt ou bref ralenti selon le véhicule) ;
    je n’ouvre jamais le vase d’expansion à chaud, car le liquide sous pression peut brûler.
  piege: En bleu au démarrage sur certains véhicules = moteur froid, sans gravité.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Renault, témoins lumineux, https://www.user-manual.renault.com/fr/chapitre1-faites-connaissance-avec-votre-v%C3%A9hicule/temoins-lumineux"
- id: voyant-frein
  type: voyant
  code: ISO 7000-0239
  image: {commons: "ISO 7000 - Ref-No 0239.svg", tint: "#e53935"}
  nom: Alerte de freinage (rouge)
  signification: Alerte du système de freinage (niveau de liquide trop bas, défaut du circuit) ; sur certains modèles, il signale aussi le frein de stationnement serré.
  conduite: "Si le voyant reste allumé frein à main desserré, je m'arrête dès que possible : le freinage peut être dégradé."
  piege: "Ce cercle « (!) » est le voyant de **freinage** ; le « (P) » cerclé est le frein de stationnement seul."
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les voyants"
- id: voyant-frein-stationnement
  type: voyant
  code: ISO 7000-0238
  image: {commons: "ISO 7000 - Ref-No 0238.svg", tint: "#e53935"}
  nom: Frein de stationnement serré (rouge)
  signification: Le frein à main (ou le frein de parking électrique) est serré ou incomplètement desserré.
  conduite: Je desserre complètement le frein de stationnement avant de rouler ; s'il reste allumé en roulant, je m'arrête pour vérifier (échauffement des freins arrière, liquide de frein).
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les voyants"
- id: voyant-ceinture
  type: voyant
  code: ISO 7000-0249
  image: {commons: "ISO 7000 - Ref-No 0249.svg", tint: "#e53935"}
  nom: Ceinture non bouclée (rouge)
  signification: Un occupant (conducteur, et sur les véhicules récents chaque passager) n'a pas attaché sa ceinture ; un signal sonore s'ajoute quand on roule.
  conduite: "Avant de partir, je boucle ma ceinture et je m'assure que tous les passagers sont attachés. Le conducteur est responsable de l'attache des mineurs."
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Code de la route, art. R412-1"
- id: voyant-airbag
  type: voyant
  code: ISO 7000-2108
  image:
    commons: ISO 7000 - Ref-No 2108.svg
    tint: '#e53935'
  nom: Défaut du système airbag
  signification: 'Voyant restant allumé : défaut possible des airbags ou prétensionneurs ; leur protection peut
    être compromise.'
  conduite: Je fais contrôler rapidement selon la notice.
  piege: Ne pas confondre ce défaut avec le témoin spécifique « airbag passager OFF », à vérifier pour un siège
    dos à la route.
  theme: M
  sous_theme: voyants
  source: "Renault, témoins lumineux (exemple constructeur ; consulter la notice du véhicule), https://www.user-manual.renault.com/fr/content/xfk/getting-know-your-vehicle/temoins-lumineux"
- id: voyant-direction
  type: voyant
  code: ISO 7000-2305
  image: {gen: voyant_direction, params: {}}
  nom: Défaut de direction assistée
  signification: "L'assistance de direction est en panne : le volant devient très dur, surtout à basse vitesse et en manœuvre."
  conduite: Je conserve le contrôle (la direction fonctionne, mais avec effort) et je fais dépanner ; en orange sur certains véhicules = anomalie mineure.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; notices constructeurs"
- id: voyant-detresse
  type: voyant
  code: ISO 7000-0085
  image: {commons: "ISO 7000 - Ref-No 0085.svg", tint: "#e53935"}
  nom: Feux de détresse (warning) en fonction
  signification: Les quatre clignotants fonctionnent ensemble pour signaler un danger ou un véhicule immobilisé.
  conduite: "Je les utilise en cas de panne, d'arrêt forcé, de ralentissement brusque ou de remorquage. Ils ne m'autorisent pas à stationner."
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-18 ; ISO 2575"

# ---------- ORANGE ----------
- id: voyant-moteur
  type: voyant
  code: ISO 7000-0640
  image: {commons: "ISO 7000 - Ref-No 0640.svg", tint: "#fb8c00"}
  nom: Défaut moteur / diagnostic (orange)
  signification: Le calculateur a détecté une anomalie du moteur ou du système antipollution (injection, allumage, sonde, catalyseur).
  conduite: Fixe, je roule en douceur et fais contrôler rapidement. Clignotant (ratés d'allumage, catalyseur menacé), je réduis aussitôt le régime et l'allure et je suis la notice ; je m'arrête en sécurité si le moteur fonctionne mal.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les voyants"
- id: voyant-abs
  type: voyant
  code: ISO 7000-1407
  image:
    commons: ISO 7000 - Ref-No 1407.svg
    tint: '#fb8c00'
  nom: Défaut ABS (orange)
  signification: 'Voyant restant allumé : défaut de l’antiblocage des roues (ABS). Les roues peuvent se bloquer au freinage.'
  conduite: Si le freinage ordinaire est normal et sans autre alerte, j’adapte l’allure et fais contrôler. Sinon,
    arrêt en sécurité.
  piege: L’absence d’ABS seule n’impose pas un arrêt sur-le-champ ; un défaut du circuit de freinage est différent.
  theme: M
  sous_theme: voyants
  source: "Sécurité routière, Exemples de nouvelles questions (Q5) ; ISO 2575"
- id: voyant-esp
  type: voyant
  code: ESP / ESC
  image: {commons: "Kontrollleuchte ESP 2.svg", tint: "#fb8c00"}
  nom: ESP / contrôle de stabilité (orange)
  signification: "Clignotant : l'ESP (contrôle électronique de stabilité) intervient (perte d'adhérence détectée). Fixe : ESP désactivé ou en défaut."
  conduite: "S'il clignote, je lève le pied et je garde une trajectoire souple, la chaussée est glissante. S'il est fixe alors que je ne l'ai pas désactivé, je fais contrôler."
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les aides à la conduite"
- id: voyant-pression-pneus
  type: voyant
  code: ISO 7000-1434A
  image: {commons: "ISO 7000 - Ref-No 1434A.svg", tint: "#fb8c00"}
  nom: Pression des pneus (orange)
  signification: "Le système de surveillance de la pression détecte qu'au moins un pneu est sous-gonflé, éventuellement à cause d'une crevaison lente. Ce système est obligatoire sur les véhicules neufs depuis 2014."
  conduite: 'Je réduis ma vitesse, je m''arrête pour contrôler les quatre pneus et je regonfle à la valeur de l''étiquette (pneus chauds : selon la notice) ; je réinitialise le système si nécessaire.'
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; règlement (CE) 661/2009"
- id: voyant-prechauffage
  type: voyant
  code: ISO 7000-0457
  image: {commons: "ISO 7000 - Ref-No 0457.svg", tint: "#fb8c00"}
  nom: Préchauffage (diesel)
  signification: Les bougies de préchauffage chauffent la chambre de combustion (moteur diesel froid).
  conduite: J'attends que le voyant s'éteigne avant d'actionner le démarreur ; s'il clignote en roulant, je fais contrôler le moteur selon la notice.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les voyants"
- id: voyant-brouillard-arriere
  type: voyant
  code: ISO 7000-0634
  image: {commons: "ISO 7000 - Ref-No 0634.svg", tint: "#fb8c00"}
  nom: Feu de brouillard arrière allumé (orange)
  signification: Le feu arrière de brouillard (très puissant) est en fonction.
  conduite: "Je ne l'utilise que par brouillard ou chute de neige ; sous la pluie et dès que la visibilité revient, je l'éteins."
  piege: "Brouillard **arrière** : faisceau vers la droite, voyant orange ; **avant** : faisceau vers la gauche, voyant vert."
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-7 ; ISO 2575"
- id: voyant-plaquettes
  type: voyant
  code: ISO 7000-1408
  image: {commons: "ISO 7000 - Ref-No 1408.svg", tint: "#fb8c00"}
  nom: Usure des plaquettes de frein (orange)
  signification: Les plaquettes ont atteint leur témoin d'usure.
  conduite: Je fais remplacer les plaquettes rapidement ; le freinage reste possible mais se dégrade et les disques s'abîment.
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les voyants"
- id: voyant-fap
  type: voyant
  code: FAP / DPF
  image: {commons: "Kontrollleuchte DPF.svg", tint: "#fb8c00"}
  nom: Filtre à particules (diesel)
  signification: Le filtre à particules est encrassé et a besoin d'une régénération.
  conduite: Selon la notice, je roule une vingtaine de minutes à allure soutenue et régulière (route ou voie rapide) pour permettre la régénération ; si le voyant persiste, garage.
  theme: M
  sous_theme: voyants
  source: "Notices constructeurs ; Codes Rousseau"
# ---------- VERT / BLEU ----------
- id: voyant-position
  type: voyant
  code: ISO 7000-0456
  image: {commons: "ISO 7000 - Ref-No 0456.svg", tint: "#43a047"}
  nom: Feux de position allumés (vert)
  signification: "Les feux de position (veilleuses) sont allumés. Ils servent à être vu, pas à éclairer la route."
  conduite: "Obligatoires à l'arrêt ou en stationnement la nuit sur la chaussée, sauf en agglomération suffisamment éclairée. Pour rouler la nuit, ils ne suffisent jamais, même en ville éclairée : feux de croisement."
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-1 et s. ; ISO 2575"
- id: voyant-croisement
  type: voyant
  code: ISO 7000-0083
  image: {commons: "ISO 7000 - Ref-No 0083.svg", tint: "#43a047"}
  nom: Feux de croisement allumés (vert)
  signification: Les feux de croisement (codes) sont allumés. Ils doivent éclairer à au moins 30 m sans éblouir.
  conduite: "La nuit dès que les feux de route éblouiraient ou que la route est éclairée ; par visibilité réduite ; dans les tunnels ; conseillés de jour hors agglomération."
  piege: "Faisceau incliné vers le bas = croisement ; faisceau horizontal (bleu) = route."
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-4 et s. ; ISO 2575"
- id: voyant-route
  type: voyant
  code: ISO 7000-0082
  image: {commons: "ISO 7000 - Ref-No 0082.svg", tint: "#1e88e5"}
  nom: Feux de route allumés (bleu)
  signification: Les feux de route (pleins phares) sont allumés. Ils doivent éclairer à au moins 100 m, mais éblouissent les autres usagers.
  conduite: Je les utilise la nuit sur route non éclairée ; je repasse en croisement dès que je croise ou suis un véhicule.
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-5 et s. ; ISO 2575"
- id: voyant-brouillard-avant
  type: voyant
  code: ISO 7000-0633
  image: {commons: "ISO 7000 - Ref-No 0633.svg", tint: "#43a047"}
  nom: Feux de brouillard avant allumés (vert)
  signification: Les feux de brouillard avant sont en fonction.
  conduite: "Par brouillard, neige ou forte pluie, à la place ou en plus des feux de croisement ; hors agglomération sur route étroite et sinueuse, avec les feux de route. Je les éteins dès que la visibilité revient (ils éblouissent)."
  theme: M
  sous_theme: voyants
  source: "Code de la route, art. R416-7 ; ISO 2575"
- id: voyant-feux-jour
  type: voyant
  code: ISO 7000-2611
  image: {commons: "ISO 7000 - Ref-No 2611.svg", tint: "#43a047"}
  nom: Feux de jour (vert)
  signification: Les feux de circulation diurne sont allumés (automatiques sur les voitures neuves depuis 2011-2012).
  conduite: Ils ne remplacent pas les feux de croisement la nuit ou par mauvaise visibilité ; selon le véhicule, ils n'allument pas les feux arrière.
  theme: M
  sous_theme: voyants
  source: "Règlement (CE) 661/2009 ; ISO 2575"
- id: voyant-regulateur
  type: voyant
  code: ISO 7000-2047
  image: {commons: "ISO 7000 - Ref-No 2047.svg", tint: "#43a047"}
  nom: Régulateur de vitesse actif
  signification: Le régulateur de vitesse est actif et maintient automatiquement la vitesse choisie.
  conduite: "Je reste maître du véhicule : un appui sur le frein (ou l'embrayage) le désactive ; je ne l'utilise pas en trafic dense, sur route sinueuse ou glissante."
  theme: M
  sous_theme: voyants
  source: "ISO 2575 ; Codes Rousseau, Les aides à la conduite"
