# Généré par build/import_signs.py depuis data/signs_inventory.yaml — 23 entrées. Corrections manuelles : data/_meta/sign_overrides.yaml
- id: ak2
  type: panneau
  code: AK2
  image:
    commons: France road sign AK2.svg
  nom: Cassis ou dos-d'âne (temporaire)
  signification: Annonce temporairement une déformation de la chaussée (tranchée, cassis, dos-d'âne) liée à des travaux.
  conduite: Ralentir fortement.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak3
  type: panneau
  code: AK3
  image:
    commons: France road sign AK3.svg
  nom: Chaussée rétrécie (temporaire)
  signification: Annonce un rétrécissement temporaire de la chaussée (chantier) ; variantes AK3a (par la droite) et AK3b (par la gauche).
  conduite: Ralentir, se replacer, ne pas dépasser ; appliquer les règles de croisement (B15/C18, K10, feux KR11).
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak4
  type: panneau
  code: AK4
  image:
    commons: France road sign AK4.svg
  nom: Chaussée glissante (temporaire)
  signification: Annonce une chaussée temporairement glissante (boue de chantier, gravillons, enrobé frais, verglas localisé).
  conduite: Ralentir, éviter freinages et accélérations brusques.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak5
  type: panneau
  code: AK5
  image:
    commons: France road sign AK5.svg
  nom: Travaux
  signification: 'Annonce une zone de travaux (chantier) sur ou près de la chaussée : présence d''ouvriers, d''engins, de modifications de la circulation.'
  conduite: Ralentir (souvent 70 ou 50 par B14 jaune), respecter les balises et les signaleurs.
  complement: 'Sur autoroute, souvent répété à 1 000 m et 500 m. AK5 seul n''impose aucune vitesse : c''est le B14 associé.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak14
  type: panneau
  code: AK14
  image:
    commons: France road sign AK14.svg
  nom: Autres dangers (temporaire)
  signification: Annonce un danger temporaire non prévu par un autre panneau, précisé par le panonceau KM9 (« sortie de camions », « bande rugueuse », « déviation »...).
  conduite: Ralentir et lire le panonceau.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak17
  type: panneau
  code: AK17
  image:
    commons: France road sign AK17.svg
  nom: Annonce de signaux lumineux temporaires
  signification: Annonce des feux tricolores temporaires (feux de chantier KR11) réglant une circulation alternée.
  conduite: Ralentir, se préparer à s'arrêter ; ne pas passer au rouge même si la voie semble libre.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak22
  type: panneau
  code: AK22
  image:
    commons: France road sign AK22.svg
  nom: Projection de gravillons
  signification: 'Annonce un risque de projection de gravillons (chaussée fraîchement gravillonnée) : danger pour les pare-brise et adhérence réduite.'
  conduite: Ralentir (souvent B14 50 associé), augmenter les distances, éviter de dépasser ou de croiser à vive allure.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak30
  type: panneau
  code: AK30
  image:
    commons: France road sign AK30.svg
  nom: Bouchon
  signification: Annonce un ralentissement ou un bouchon (file de véhicules à l'arrêt) à proximité, souvent sur panneau lumineux ou remorque.
  conduite: Ralentir immédiatement, allumer brièvement les feux de détresse pour prévenir ceux qui suivent, garder ses distances.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak31
  type: panneau
  code: AK31
  image:
    commons: France road sign AK31.svg
  nom: Accident
  signification: Annonce un accident sur la route à proximité (signalisation d'urgence).
  conduite: Ralentir fortement, ne pas se laisser distraire, se préparer à une circulation alternée ou à un arrêt.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: ak32
  type: panneau
  code: AK32
  image:
    commons: France road sign AK32.svg
  nom: Nappes de brouillard ou de fumées épaisses
  signification: Annonce des nappes de brouillard ou de fumées (incendie, écobuage) réduisant la visibilité, souvent sur panneau à messages variables (XAK32).
  conduite: Ralentir (50 km/h maximum si visibilité < 50 m), allumer feux de croisement et feux de brouillard avant, augmenter les distances.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: k2
  type: panneau
  code: K2
  image:
    gen: barriere_k2
  nom: Barrage (barrière de chantier)
  signification: Barrière rouge et blanche matérialisant la fermeture totale ou partielle de la chaussée ou la position d'un obstacle temporaire (route barrée, chantier).
  conduite: Ne pas franchir ; suivre la déviation ou la partie de chaussée laissée libre.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: k5a
  type: equipement
  code: K5a
  image:
    gen: cone
    params: {}
  nom: Cône de signalisation
  signification: Cône rouge et blanc délimitant un chantier ou un obstacle temporaire, posé en file pour guider.
  conduite: Rester dans l'espace laissé libre ; ne pas franchir la file de cônes.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: k8
  type: panneau
  code: K8
  image:
    commons: K8e1.svg
  nom: Balise de position de déviation ou de rétrécissement (chantier)
  signification: 'Balise blanche à chevron rouge implantée en tête de chantier ou de déviation : elle indique de quel côté contourner.'
  conduite: Se déporter du côté indiqué par la flèche.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: k10a
  type: panneau
  code: K10a
  image:
    commons: K10a.svg
  nom: Signal manuel « passage » (piquet K10, face verte)
  signification: 'Face verte du piquet mobile K10 tenu par un signaleur de chantier : autorisation de passer (circulation alternée réglée manuellement).'
  conduite: Passer prudemment en respectant les limitations du chantier ; obéir au signaleur comme à un agent.
  complement: 'Piquet K10 à deux faces : K10a = VERTE (passer), K10b = ROUGE (arrêt). Le signaleur a autorité pour arrêter la circulation.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: k10b
  type: panneau
  code: K10b
  image:
    commons: K10b.svg
  nom: Signal manuel « arrêt » (piquet K10, face rouge)
  signification: 'Face rouge du piquet K10 tenu par un signaleur : arrêt obligatoire.'
  conduite: S'arrêter à hauteur du signaleur et attendre qu'il présente la face verte.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kc1
  type: panneau
  code: KC1
  image:
    commons: KC1 route barrée.svg
  nom: Panneau d'indication temporaire (route barrée, circulation alternée…)
  signification: 'Panneau rectangulaire jaune à inscription informant d''une situation temporaire : « ROUTE BARRÉE », « CIRCULATION ALTERNÉE », « CHAUSSÉE DÉFORMÉE »…'
  conduite: 'Lire et appliquer : « route barrée » = déviation ; « absence de marquage » = serrer à droite.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kd8
  type: panneau
  code: KD8
  image:
    commons: KD8e3.svg
  nom: Présignalisation de changement de chaussée ou de trajectoire
  signification: Panneau jaune schématisant un basculement de circulation (passage sur la chaussée opposée, déport de voies).
  conduite: 'Suivre la trajectoire indiquée et ralentir : on peut rouler sur la chaussée opposée.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kd9
  type: panneau
  code: KD9
  image:
    commons: KD9e3.svg
  nom: Affectation de voies (temporaire)
  signification: Panneau jaune indiquant l'affectation temporaire des voies (voies neutralisées ou affectées à une direction) en zone de chantier.
  conduite: Se placer dans la voie indiquée.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kd10
  type: panneau
  code: KD10
  image:
    commons: KD10e1.svg
  nom: Annonce de la réduction du nombre de voies (temporaire)
  signification: 'Panneau jaune annonçant (avec distance) la réduction du nombre de voies laissées libres sur route à chaussées séparées : KD10a (une voie neutralisée), KD10b (plusieurs voies, signalisation d''urgence).'
  conduite: Se rabattre à temps sur les voies restantes en respectant l'alternance (une voiture sur deux) en cas de bouchon.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kd22
  type: panneau
  code: KD22
  image:
    commons: KD22a.svg
  nom: Direction de déviation
  signification: Panneau de direction jaune en forme de flèche portant la mention « Déviation » (ou le symbole KS1 numéroté) indiquant le chemin de la déviation.
  conduite: Suivre la déviation.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kd42
  type: panneau
  code: KD42
  image:
    commons: KD42.svg
  nom: Présignalisation de déviation
  signification: Panneau jaune annonçant avant le carrefour la direction de la déviation (schéma ou flèche), avec éventuellement la ville et la distance.
  conduite: Se préparer à tourner dans la direction indiquée.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: kr11
  type: panneau
  code: KR11
  image:
    gen: feu_chantier
    params:
      state: rouge
  nom: Feux tricolores temporaires (feux de chantier)
  signification: Feux tricolores mobiles réglant une circulation alternée sur voie unique en chantier ; mêmes règles que les feux permanents.
  conduite: S'arrêter au rouge même sans personne en face ; ne pas s'engager au vert si la voie n'est pas dégagée.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: triangle-presignalisation
  type: equipement
  image:
    gen: triangle_seul
    params: {}
  nom: Triangle de présignalisation (véhicule en panne ou accidenté)
  signification: Triangle rouge rétroréfléchissant à placer sur la chaussée pour signaler un véhicule immobilisé. Obligatoire à bord avec le gilet.
  conduite: Gilet avant de sortir, feux de détresse, triangle au moins 30 m en amont — sauf si cela m'expose.
  complement: 'Sur autoroute, ne pas poser le triangle si cela met en danger : priorité à l''évacuation derrière la glissière.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Absence à bord = 11 € ; ne pas revêtir le gilet ou ne pas présignaler = 135 €.
