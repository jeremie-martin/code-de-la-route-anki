- id: b6b1
  type: panneau
  code: B6b1
  image:
    commons: France road sign B6b1.svg
  nom: Entrée d'une zone à stationnement interdit
  signification: Entrée d'une zone où le stationnement est interdit dans toutes les rues, sauf emplacements aménagés ou signalisation contraire.
  conduite: Ne stationner que sur les emplacements matérialisés.
  complement: 'À chaque entrée de la zone ; la prescription vaut dans toutes les rues de la zone jusqu''au panneau de sortie, sans être répétée après les intersections. Fin : B50a. Catégorie officielle IISR : prescription zonale (entrée de zone).'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b2
  type: panneau
  code: B6b2
  image:
    commons: France road sign B6b2.svg
  nom: Entrée d'une zone à stationnement unilatéral à alternance semi-mensuelle
  signification: 'Entrée d''une zone où le stationnement est autorisé alternativement d''un côté puis de l''autre (1er-15 : côté des numéros impairs ; 16-fin : côté des numéros pairs), sauf indications contraires.'
  conduite: Du 1er au 15, se garer côté impair ; du 16 à la fin du mois, côté pair. Changement de côté le dernier jour de chaque période entre 20 h 30 et 21 h.
  complement: 'À chaque entrée de la zone ; la prescription vaut dans toutes les rues de la zone jusqu''au panneau de sortie, sans être répétée après les intersections. Fin : B50b. Règle R417-2 : 1er au 15 → côté des numéros IMPAIRS ; 16 au 31 → côté des numéros PAIRS (mémo : « 1 » est impair).'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b3
  type: panneau
  code: B6b3
  image:
    commons: France road sign B6b3.svg
  nom: Entrée d'une zone à stationnement de durée limitée (zone bleue)
  signification: Entrée d'une zone où le stationnement est gratuit mais limité dans le temps, avec contrôle par disque de stationnement (« zone bleue »).
  conduite: Apposer le disque européen derrière le pare-brise, indiquant l'heure d'arrivée ; respecter la durée maximale (souvent 1 h 30) et les horaires du panonceau.
  complement: 'À chaque entrée de la zone ; la prescription vaut dans toutes les rues de la zone jusqu''au panneau de sortie, sans être répétée après les intersections. Fin : B50c. Le marquage au sol de la zone bleue peut être bleu.'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b4
  type: panneau
  code: B6b4
  image:
    commons: France road sign B6b4.svg
  nom: Entrée d'une zone à stationnement payant
  signification: Entrée d'une zone où le stationnement est payant (horodateur, parcmètre, paiement mobile) selon les horaires indiqués.
  conduite: Payer et afficher le ticket ; sinon forfait post-stationnement (FPS).
  complement: 'À chaque entrée de la zone ; la prescription vaut dans toutes les rues de la zone jusqu''au panneau de sortie, sans être répétée après les intersections. Fin : B50d.'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
