- id: b30
  type: panneau
  code: B30
  image:
    commons: France road sign B30 (30).svg
  nom: Entrée d'une zone 30
  signification: Entrée d'une zone où la vitesse est limitée à 30 km/h dans toutes les rues. Par défaut, les voies à sens unique y sont à double sens pour les cyclistes (double-sens cyclable, décret 2008-754) et les ralentisseurs ne sont pas forcément signalés.
  conduite: Rouler à 30 km/h maximum dans toute la zone ; s'attendre à des cyclistes à contresens et à des aménagements (plateaux, chicanes).
  complement: 'À chaque entrée de zone ; peut être sur le même support qu''EB10 (vaut alors pour toute l''agglomération). Non répété après les intersections. Fin : B51. Différence : B14 30 (rond seul) = 30 km/h sur cette rue jusqu''à la prochaine intersection ; B30 (ZONE 30) = 30 km/h dans toute la zone jusqu''au B51.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b51
  type: panneau
  code: B51
  image:
    commons: France road sign B51 (30).svg
  nom: Sortie d'une zone 30
  signification: Fin de la zone 30 ; la vitesse redevient celle du régime général (50 km/h en agglomération).
  conduite: Reprendre 50 km/h maximum si en agglomération.
  complement: À chaque sortie de zone.
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b52
  type: panneau
  code: B52
  image:
    commons: France road sign B52.svg
  nom: Entrée d'une zone de rencontre
  signification: 'Entrée d''une zone de rencontre : espace partagé où les piétons sont prioritaires sur tous les véhicules (sauf tramways) et peuvent circuler sur toute la chaussée ; vitesse limitée à 20 km/h ; double-sens cyclable par défaut ; stationnement uniquement sur les emplacements aménagés.'
  conduite: Rouler à 20 km/h maximum, céder le passage aux piétons (sans qu'ils aient à s'écarter), ne pas stationner hors emplacements.
  complement: 'À chaque entrée de zone ; peut être sur le même support qu''EB10. Fin : B53. Trois vitesses à retenir : aire piétonne = allure du pas (≈ 6 km/h) ; zone de rencontre = 20 km/h ; zone 30 = 30 km/h. Le piéton est prioritaire en zone de rencontre mais doit néanmoins ne pas gêner inutilement.'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b53
  type: panneau
  code: B53
  image:
    commons: France road sign B53.svg
  nom: Sortie d'une zone de rencontre
  signification: Fin de la zone de rencontre ; retour aux règles générales (priorité des véhicules sur la chaussée, 50 km/h en agglomération).
  complement: À chaque sortie de zone.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b54
  type: panneau
  code: B54
  image:
    commons: France road sign B54.svg
  nom: Entrée d'une aire piétonne
  signification: 'Entrée d''une aire piétonne : zone affectée aux piétons, où ils sont prioritaires. Seuls les véhicules autorisés (desserte, livraisons, riverains selon panonceau M11b) peuvent y circuler, à l''allure du pas ; les cyclistes y roulent au pas sans gêner les piétons. Arrêt et stationnement interdits (sauf desserte).'
  conduite: 'En voiture : ne pas y entrer sauf autorisation (panonceau) ; sinon rouler au pas et laisser la priorité absolue aux piétons.'
  complement: 'À chaque entrée de l''aire ; panonceau M11b1 (période) ou M11b2 (dérogations). Fin : B55.'
  piege: 'Aire piétonne ≠ zone de rencontre : dans l''aire piétonne la voiture est l''exception (allure du pas) ; dans la zone de rencontre elle est admise à 20 km/h. Piège de forme : B52/B54 sont des carrés BLEUS (comme des indications) alors que B30/B56/B58 sont blancs bordés de rouge ; B54/B55 ont remplacé C109/C110 en 2008 (arrêté du 7 novembre 2008).'
  theme: L
  sous_theme: panneaux
  importance: essentiel
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b55
  type: panneau
  code: B55
  image:
    commons: France road sign B55.svg
  nom: Sortie d'une aire piétonne
  signification: Fin de l'aire piétonne.
  complement: À chaque sortie.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b56
  type: panneau
  code: B56
  image:
    commons: France road sign B56.svg
  nom: Entrée d'une zone à circulation restreinte (ZFE)
  signification: 'Entrée d''une zone à circulation restreinte / zone à faibles émissions mobilité (ZFE-m) : l''accès est interdit aux véhicules ne répondant pas aux critères d''émissions indiqués sur le panonceau M11d (vignette Crit''Air), aux horaires indiqués.'
  conduite: Vérifier la vignette Crit'Air de son véhicule et les catégories/horaires du panonceau ; ne pas entrer si le véhicule est concerné par la restriction (amende 68 €).
  complement: 'À chaque entrée de zone, complété du panonceau M11d (catégories concernées, jours et heures). Fin : B57. Créé vers 2016-2017 sous le nom « zone à circulation restreinte » (ZCR, loi de transition énergétique de 2015 ; les ZCR sont devenues ZFE-m avec la loi LOM (2019). La vignette Crit''Air est obligatoire pour y circuler.'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b57
  type: panneau
  code: B57
  image:
    commons: France road sign B57.svg
  nom: Sortie d'une zone à circulation restreinte (ZFE)
  signification: Fin de la zone à circulation restreinte.
  complement: À chaque sortie.
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b58
  type: panneau
  code: B58
  image:
    commons: France road sign B58.svg
  nom: Entrée d'une zone d'obligation d'équipements en période hivernale
  signification: Entrée d'une zone (communes de montagne désignées par le préfet) où, du 1er novembre au 31 mars, les véhicules doivent être équipés de pneus hiver marqués 3PMSF (le seul marquage M+S ne suffit plus depuis le 1er novembre 2024) ou détenir des chaînes/chaussettes à neige pour au moins deux roues motrices.
  conduite: 'Vérifier son équipement avant d''entrer : pneus hiver sur les 4 roues, ou chaînes/chaussettes dans le coffre.'
  complement: 'À chaque entrée de zone, complété du panonceau M11b1 « du 01/11 au 31/03 » ; peut être utilisé en présignalisation avec M1. Fin : B59. Créé par l''arrêté du 23 juin 2021 (« loi Montagne II », décret 2020-1264), applicable depuis le 1er novembre 2021. Différent de B26 : B26 impose de MONTER les chaînes ici et maintenant ; B58 impose de les DÉTENIR (ou d''avoir des pneus hiver).'
  theme: L
  sous_theme: panneaux
  importance: utile
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
