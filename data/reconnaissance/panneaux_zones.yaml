- id: b6b1
  type: panneau
  code: B6b1
  image:
    commons: France road sign B6b1.svg
  nom: Entrée d'une zone à stationnement interdit
  signification: Entrée d'une zone où le stationnement est interdit dans toutes les rues, sauf emplacements aménagés ou signalisation contraire.
  conduite: Ne stationner que sur les emplacements matérialisés.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b2
  type: panneau
  code: B6b2
  image:
    commons: France road sign B6b2.svg
  nom: Entrée d'une zone à stationnement unilatéral à alternance semi-mensuelle
  signification: 'Entrée d''une zone à stationnement alterné semi-mensuel : du 1er au 15 côté impair, du 16 à la fin côté pair.'
  conduite: Changer de côté le 15 et le dernier jour du mois, entre 20 h 30 et 21 h.
  complement: 'Mémo : « 1 » est impair.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b3
  type: panneau
  code: B6b3
  image:
    commons: France road sign B6b3.svg
  nom: Entrée d'une zone à stationnement de durée limitée (zone bleue)
  signification: Entrée d'une zone où le stationnement est gratuit mais limité dans le temps, avec contrôle par disque de stationnement (« zone bleue »).
  conduite: Apposer le disque européen derrière le pare-brise, indiquant l'heure d'arrivée ; respecter la durée maximale (souvent 1 h 30) et les horaires du panonceau.
  complement: Le marquage au sol de la zone bleue peut être bleu.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b6b4
  type: panneau
  code: B6b4
  image:
    commons: France road sign B6b4.svg
  nom: Entrée d'une zone à stationnement payant
  signification: Entrée d'une zone où le stationnement est payant (horodateur, parcmètre, paiement mobile) selon les horaires indiqués.
  conduite: Payer et afficher le ticket ; sinon forfait post-stationnement (FPS).
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b30
  type: panneau
  code: B30
  image:
    commons: France road sign B30 (30).svg
  nom: Entrée d'une zone 30
  signification: 'Entrée d’une zone 30 : 30 km/h dans les rues de la zone, jusqu’au panneau de sortie de zone.'
  conduite: Rouler à 30 km/h maximum ; s'attendre à des cyclistes à contresens et à des aménagements (plateaux, chicanes).
  complement: Double-sens cyclable par défaut.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: Le rond « 30 » limite la vitesse sur la section concernée ; le panneau « ZONE 30 » s’applique aussi après les intersections, jusqu’à la sortie de zone.
  comparaisons:
  - ref: b14
    legende: 'Rond de vitesse : une section, sans portée de zone.'
- id: b51
  type: panneau
  code: B51
  image:
    commons: France road sign B51 (30).svg
  nom: Sortie d'une zone 30
  signification: Fin de la zone 30 ; la vitesse redevient celle du régime général (50 km/h en agglomération).
  conduite: Reprendre 50 km/h maximum si en agglomération.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b52
  type: panneau
  code: B52
  image:
    commons: France road sign B52.svg
  nom: Entrée d'une zone de rencontre
  signification: 'Entrée d''une zone de rencontre : piétons prioritaires sur toute la chaussée, vitesse limitée à 20 km/h, stationnement sur emplacements seulement.'
  conduite: Rouler à 20 km/h maximum et céder le passage aux piétons, sans qu'ils aient à s'écarter.
  complement: Double-sens cyclable par défaut.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  piege: 'Trois vitesses : aire piétonne = allure du pas ; zone de rencontre = 20 ; zone 30 = 30.'
- id: b54
  type: panneau
  code: B54
  image:
    commons: France road sign B54.svg
  nom: Entrée d'une aire piétonne
  signification: 'Entrée d''une aire piétonne : zone affectée aux piétons, qui y sont prioritaires ; seuls les véhicules autorisés y circulent, à l''allure du pas.'
  conduite: Ne pas y entrer sans autorisation (panonceau) ; sinon rouler au pas, priorité absolue aux piétons.
  piege: 'L’aire piétonne se parcourt à l’allure du pas pour les véhicules autorisés. Dans une zone de rencontre, le panneau montre aussi une voiture et « 20 » : les véhicules y circulent à 20 km/h au maximum.'
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
  comparaisons:
  - ref: b52
    legende: 'Zone de rencontre : 20 km/h, piétons prioritaires.'
- id: b56
  type: panneau
  code: B56
  image:
    commons: France road sign B56.svg
  nom: Entrée d'une zone à circulation restreinte (ZFE)
  signification: 'Entrée d’une zone à faibles émissions : l’accès dépend de la vignette Crit’Air et des conditions indiquées sur le panonceau.'
  conduite: Vérifier sa vignette Crit'Air et les horaires du panonceau ; ne pas entrer si le véhicule est concerné (68 €).
  complement: Un panonceau précise les catégories, jours et heures concernés.
  theme: L
  sous_theme: panneaux
  source: IISR (Instruction interministérielle sur la signalisation routière) ; Wikipédia FR — signalisation routière en France
- id: b58
  type: panneau
  code: B58
  image:
    commons: France road sign B58.svg
  nom: Entrée d'une zone d'obligation d'équipements en période hivernale
  signification: Zone de montagne où, du 1er novembre au 31 mars, il faut des pneus hiver marqués 3PMSF ou détenir des chaînes pour deux roues motrices.
  conduite: 'Vérifier son équipement avant d''entrer : pneus hiver, ou chaînes/chaussettes dans le coffre.'
  complement: Le marquage M+S seul ne suffit plus depuis le 1er novembre 2024.
  theme: L
  sous_theme: panneaux
  source: Arrêté du 23 juin 2021, art. 7 (IISR 67-1) ; D314-8 — https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12
  piege: 'La zone impose un équipement hivernal pendant la période indiquée. Le panneau rond bleu avec une roue chaînée porte sur l’équipement à utiliser sur la section : je lis aussi son éventuel complément.'
  comparaisons:
  - ref: b26
    legende: 'Roue chaînée : équipement en service sur la section.'
