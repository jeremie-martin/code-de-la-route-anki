- id: conf-a13a-a13b
  a: a13a
  b: a13b
  difference: '**A** : deux enfants qui courent, sans bandes → endroit fréquenté par les enfants (école, aire
    de jeux) : je ralentis fortement, un enfant peut surgir. **B** : un adulte sur des bandes → annonce d''un
    passage pour piétons (environ 150 m hors agglomération, 50 m en ville).'
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie
- id: conf-a15a1-a15b
  a: a15a1
  b: a15b
  difference: "**A** (vache) annonce le passage d'animaux **domestiques** : troupeaux, sorties de fermes. Je ralentis et je ne klaxonne pas. **B** (cerf bondissant) annonce le passage d'animaux **sauvages** : gibier, surtout à l'aube et au crépuscule, en forêt. Je ralentis et je scrute les bas-côtés."
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie
- id: conf-a2a-a2b
  a: a2a
  b: a2b
  difference: '**A**, deux bosses : déformation de la chaussée, cassis ou dos-d’âne. **B**, une bosse : ralentisseur aménagé. Dans les deux cas, je ralentis avant l’obstacle.'
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie
- id: conf-a7-a8
  a: a7
  b: a8
  difference: '**A (barrière) : passage à niveau avec barrières ou demi-barrières.** **B (locomotive) : sans barrière**,
    parfois avec des feux rouges clignotants : je regarde et j’écoute avant de m’engager, et je ne dépasse pas sur le passage.'
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie ; Code de la route, art. R422-3
- id: conf-a14-ak14
  a: a14
  b: ak14
  difference: Même symbole (point d'exclamation), mais **A** (fond blanc) est un panneau permanent d'« autres
    dangers », précisé par un panonceau, tandis que **B** (fond jaune) est temporaire (chantier, incident)
    et prime sur la signalisation permanente.
  theme: L
  sous_theme: panneaux
  source: IISR 1re et 8e parties
- id: conf-ab1-ab2
  a: ab1
  b: ab2
  difference: "**A** (croix) annonce une intersection où la **priorité à droite** s'applique : je cède aux véhicules venant de ma droite. **B** (barre verticale épaisse) annonce une intersection où **je suis prioritaire**, ponctuellement : les autres ont un STOP ou un cédez-le-passage. Les deux sont des triangles de danger implantés avant l'intersection."
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie ; Code de la route, art. R415-5 et R415-7
- id: conf-ab3a-ab4
  a: ab3a
  b: ab4
  difference: '**A : céder le passage**, sans arrêt obligatoire si la voie est libre ; ligne discontinue. **B
    : arrêt complet obligatoire**, même si la voie est libre, puis céder le passage ; ligne continue.'
  theme: L
  sous_theme: panneaux
  source: Code de la route, art. R415-6 et R415-7
- id: conf-ab3b-ab5
  a: ab3b
  b: ab5
  difference: 'Deux signaux **avancés** implantés à ~150 m : **A** (triangle inversé + panonceau de distance)
    annonce un cédez-le-passage ; **B** (triangle inversé + panonceau « STOP 150 m ») annonce un STOP. Ni l''un
    ni l''autre n''impose de s''arrêter à son niveau.'
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie
- id: conf-ab6-ab7
  a: ab6
  b: ab7
  difference: '**A** (losange jaune) : je suis sur une route à caractère prioritaire, à toutes les intersections
    jusqu''au **B** (losange barré de noir), qui annonce la fin de ce régime : ensuite, priorité à droite sauf
    signalisation.'
  theme: L
  sous_theme: panneaux
  source: IISR 1re partie
- id: conf-b0-b1
  a: b0
  b: b1
  difference: '**A : circulation interdite aux véhicules dans les deux sens. B : entrée interdite par ce côté.**
    En B, des véhicules peuvent venir vers moi.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b1-c12
  a: b1
  b: c12
  difference: A interdit d’entrer par ce sens. B indique le sens unique des véhicules concernés ; des catégories autorisées,
    notamment cycles et EDPM, peuvent venir en face.
  theme: L
  sous_theme: panneaux
  source: IISR 4e et 5e parties
- id: conf-b3-b3a
  a: b3
  b: b3a
  difference: '**A (voiture rouge) : je ne dépasse aucun véhicule à moteur**, sauf deux-roues sans side-car. **B (camion
    rouge) : la même interdiction, pour les seuls véhicules de marchandises de plus de 3,5 t** ; en voiture, elle ne me
    concerne pas.'
  theme: L
  sous_theme: panneaux
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: conf-b7a-b7b
  a: b7a
  b: b7b
  difference: '**A** (voiture + moto) : accès interdit aux véhicules à moteur **sauf cyclomoteurs**. **B**
    (voiture + moto + cyclomoteur) : accès interdit à **tous** les véhicules à moteur, cyclomoteurs compris.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b9g-b9h
  a: b9g
  b: b9h
  difference: '**A** (petit deux-roues à pédales/plateau) : accès interdit aux **cyclomoteurs** (≤ 50 cm³,
    45 km/h). **B** (moto) : accès interdit aux **motocyclettes** et motocyclettes légères (125). Les silhouettes
    se ressemblent : regarder la taille de la machine.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b11-b12
  a: b11
  b: b12
  difference: '**A : largeur maximale. B : hauteur maximale.** Les flèches horizontales et verticales indiquent
    la dimension à vérifier sur mon véhicule, chargement compris.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b14-c4a
  a: b14
  b: c4a
  difference: "**A** (rond rouge) impose une vitesse **maximale**, jusqu'à la prochaine intersection ou au panneau de fin. **B** (carré bleu) indique une vitesse **conseillée**, par exemple pour un virage ou une descente. La dépasser n'est pas une infraction en soi, mais peut être dangereux."
  theme: L
  sous_theme: panneaux
  source: IISR 4e et 5e parties
- id: conf-b14-b25
  a: b14
  b: b25
  difference: '**A : vitesse maximale**, je ne roule pas plus vite. **B : vitesse minimale obligatoire**, dans
    des conditions normales de circulation.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b15-c18
  a: b15
  b: c18
  difference: '**A : je cède le passage** aux véhicules en face. **B : je suis prioritaire** dans le passage
    étroit. La flèche vers le haut représente mon sens ; la flèche rouge désigne celui qui cède.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e et 5e parties
- id: conf-b21-1-b21c1
  a: b21-1
  b: b21c1
  difference: '**A : tourner à droite avant le panneau. B : tourner à droite à la prochaine intersection.**
    La flèche coudée annonce le changement de direction à venir.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b21a1-b21c1
  a: b21a1
  b: b21c1
  difference: '**A** (flèche oblique vers le bas à droite) : **contournement** obligatoire par la droite d''un
    obstacle ou d''un îlot (je passe à droite du panneau). **B** (flèche coudée) : direction obligatoire à
    **droite à la prochaine intersection**.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-b22a-c113
  a: b22a
  b: c113
  difference: 'Pour un cycliste concerné : A impose la piste ou la bande, B la conseille sans l’imposer. Dans les deux cas,
    une voiture ordinaire n’y circule pas.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e et 5e parties ; Code de la route, art. R431-9
- id: conf-b26-b58
  a: b26
  b: b58
  difference: 'A, rond bleu avec une roue chaînée : équipement en service sur la section (chaînes montées, ou pneus
    hiver conformes sauf panonceau « Chaînes à neige obligatoires »). B, panneau rectangulaire de zone avec une montagne
    : pendant la période indiquée, quatre pneus hiver ou des chaînes à bord.'
  theme: L
  sous_theme: panneaux
  source: "Arrêté du 23 juin 2021, art. 7 (IISR 67-1) ; D314-8, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12"
- id: conf-b31-b33
  a: b31
  b: b33
  difference: A met fin aux interdictions signalées pour les véhicules en mouvement ; il ne lève pas une interdiction
    de stationner. B termine seulement la limitation de vitesse indiquée. Les règles générales restent applicables.
  theme: L
  sous_theme: panneaux
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: conf-b52-b54
  a: b52
  b: b54
  difference: '**A**, piéton, cycliste, voiture et « 20 » : zone de rencontre, piétons prioritaires et 20 km/h au maximum. **B**, adulte et enfant : aire piétonne ; seuls les véhicules de desserte, les cycles et les trottinettes électriques y circulent (sauf interdiction locale), à l’allure du pas.'
  theme: L
  sous_theme: panneaux
  source: Code de la route, art. R110-2, R412-43-1 et R431-9
- id: conf-b30-b56
  a: b30
  b: b56
  difference: '**A** affiche « ZONE 30 » : la vitesse est limitée à 30 km/h dans la zone, même après une intersection. **B** annonce une zone à faibles émissions : le panonceau précise les véhicules et vignettes Crit’Air admis. Ces règles valent jusqu’à la sortie de leur zone.'
  theme: L
  sous_theme: panneaux
  source: IISR 4e partie
- id: conf-c13a-c13c
  a: c13a
  b: c13c
  difference: '**A : impasse. B : impasse avec issue pour les piétons.** Le symbole piéton indique qui peut
    continuer au-delà.'
  theme: L
  sous_theme: panneaux
  source: IISR 5e partie
- id: conf-a13b-c20a
  a: a13b
  b: c20a
  difference: '**A** (triangle) : **annonce** un passage pour piétons à environ 150 m (50 m en ville). **B** (carré
    bleu) : indique la **position** du passage pour piétons, à hauteur des bandes. Dans les deux cas, on cède
    le passage aux piétons engagés ou qui s''apprêtent à traverser.'
  theme: L
  sous_theme: panneaux
  source: IISR 1re et 5e parties
- id: conf-c107-c207
  a: c107
  b: c207
  difference: '**A (voiture de face) : route pour automobiles**, interdite aux piétons, cycles et véhicules lents ; la vitesse
    dépend de la chaussée : 110 avec terre-plein central, sinon 80 (90 sur les sections signalées). **B (pont au-dessus
    de la chaussée) : autoroute**, 130 par temps sec.'
  theme: L
  sous_theme: panneaux
  source: Code de la route, R413-2 à R413-5 ; arrêté signalisation, C107 et C207
- id: conf-c8-c26a
  a: c8
  b: c26a
  difference: "**A** (route avec encoche) indique un emplacement d'arrêt d'urgence, aménagé pour s'arrêter en cas de panne sur une route sans bande d'arrêt d'urgence ou en tunnel. **B** (voie qui monte, damier) indique une voie de détresse : son lit de gravier permet d'arrêter un véhicule dont les freins ont lâché en descente."
  theme: L
  sous_theme: panneaux
  source: IISR 5e partie
- id: conf-eb10-e31
  a: eb10
  b: e31
  difference: '**A** (nom en lettres droites noires sur fond blanc, **bordure rouge**) marque l''entrée d''agglomération : la limite par défaut de 50 km/h et les règles d''agglomération s''appliquent jusqu''au panneau de sortie (le même, barré). **B** (nom en lettres **italiques blanches sur fond noir**) localise simplement un lieu-dit ou un hameau, sans changer les règles.'
  theme: L
  sous_theme: panneaux
  source: IISR 5e partie ; Code de la route, art. R110-2
- id: conf-e42-e43
  a: e42
  b: e43
  difference: '**A, rouge : route nationale ou autoroute. B, jaune : route départementale.** Le cartouche identifie
    la route, sans donner de priorité.'
  theme: L
  sous_theme: panneaux
  source: IISR 5e partie
- id: conf-m1-m2
  a: m1
  b: m2
  difference: '**A** (« 50 m ») : la prescription ou le danger commence **à** cette distance. **B** (flèches
    verticales encadrant la distance) : la prescription s''applique **sur** cette longueur (étendue), par exemple
    « limitation à 50 sur 2 km ».'
  theme: L
  sous_theme: panonceaux
  source: IISR 1re partie, art. 9
- id: conf-m8a-m8b
  a: m8a
  b: m8b
  difference: 'Pour l’arrêt ou le stationnement : **A, flèche vers le haut, l’interdiction commence au panneau et vaut au-delà**
    ; **B, flèche vers le bas, elle valait avant le panneau et s’arrête ici.**'
  theme: L
  sous_theme: panonceaux
  source: IISR 1re partie, art. 9
- id: conf-j1-j3
  a: j1
  b: j3
  difference: '**A : balise de virage**, bande blanche. **B : balise d’intersection**, bande rouge. La balise
    d’intersection ne donne aucune priorité.'
  theme: L
  sous_theme: balises
  source: IISR 1re partie (balises J1, J3, J6)
- id: conf-j4-j5
  a: j4
  b: j5
  difference: "**A** (chevron blanc sur fond bleu, pointant vers l'intérieur du virage) est une balise qui indique le sens du virage. **B** (flèche blanche oblique sur fond bleu) est une balise de tête d'îlot : elle impose de contourner l'îlot ou le refuge par la droite."
  theme: L
  sous_theme: balises
  source: IISR 1re partie
- id: conf-continue-dissuasion
  a: marq-ligne-continue
  b: marq-ligne-dissuasion
  difference: 'Ligne continue : franchissement interdit ; chevauchement seulement pour dépasser cycles, EDPM et cyclomobiles
    légers dans les conditions légales. Dissuasion : ligne discontinue à intervalles courts ; dépassement à éviter, sauf
    véhicule très lent et conditions sûres.'
  theme: L
  sous_theme: marquages
  source: Code de la route, R412-19 ; IISR, 7e partie
- id: conf-annonce-dissuasion
  a: marq-ligne-annonce
  b: marq-ligne-dissuasion
  difference: '**A, traits avec flèches de rabattement : une ligne continue arrive**, je me rabats et je ne commence plus
    de dépassement. **B, mêmes traits sans flèches : dépassement déconseillé**, encore possible pour un véhicule lent si
    la visibilité le permet.'
  theme: L
  sous_theme: marquages
  source: IISR, 7e partie, art. 113
- id: conf-t1-dissuasion
  a: marq-ligne-discontinue-t1
  b: marq-ligne-dissuasion
  difference: '**A**, grands intervalles : ligne discontinue ordinaire, franchissable si la manœuvre est sûre. **B**, intervalles courts : ligne de dissuasion ; je réserve le dépassement aux véhicules lents et seulement si la visibilité le permet. Je reconnais l’espacement, sans mesurer les traits.'
  theme: L
  sous_theme: marquages
  source: IISR 7e partie, art. 113
- id: conf-stop-cedez-lignes
  a: marq-ligne-stop
  b: marq-ligne-cedez
  difference: '**Ligne d''arrêt (STOP)** : ligne transversale **continue**, large : arrêt complet obligatoire à
    son niveau. **Ligne de cédez-le-passage** : ligne transversale **discontinue** (traits de 50 cm) : céder le
    passage, sans obligation d''arrêt si la voie est libre ; un grand triangle blanc, pointe vers moi, peut la
    précéder.'
  theme: L
  sous_theme: marquages
  source: IISR 7e partie
- id: conf-jaune-fixe-clignotant
  a: feu-jaune-fixe
  b: feu-jaune-clignotant
  difference: '**Jaune fixe** : je dois m''arrêter (comme au rouge) sauf si l''arrêt est impossible en sécurité.
    **Jaune clignotant** : passage prudent en appliquant les panneaux et les règles de priorité ; il ne signifie
    pas systématiquement une panne.'
  theme: L
  sous_theme: feux
  source: Code de la route, art. R412-31 et R412-32
- id: conf-r14-r16
  a: r14
  b: r16
  difference: 'Flèche verte A : passage autorisé dans sa direction, en respectant les priorités restantes et
    sans bloquer. Flèche jaune clignotante B : passage conditionnel dans sa direction malgré le rouge, en cédant
    aux autres usagers.'
  theme: L
  sous_theme: feux
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: conf-voyant-frein-stationnement
  a: voyant-frein
  b: voyant-frein-stationnement
  difference: "**(!)** rouge signale une alerte de freinage : niveau de liquide de frein bas ou défaut du circuit. Sur certains modèles, il signale aussi le frein à main serré. S'il reste allumé après desserrage du frein à main, je m'arrête. **(P)** rouge indique que le frein de stationnement est serré : je le desserre complètement avant de rouler."
  theme: M
  sous_theme: voyants
  source: ISO 2575
- id: conf-voyant-brouillard-av-ar
  a: voyant-brouillard-avant
  b: voyant-brouillard-arriere
  difference: "**Vert, faisceau vers la gauche, rayons obliques** : feux de brouillard **avant**, utilisables par brouillard, neige ou forte pluie. **Orange, faisceau vers la droite, rayons horizontaux** : feu de brouillard **arrière**, utilisable uniquement par brouillard ou neige, jamais sous la pluie. Je l'éteins dès que la visibilité revient."
  theme: M
  sous_theme: voyants
  source: ISO 2575 ; Code de la route, art. R416-7
- id: conf-voyant-croisement-route
  a: voyant-croisement
  b: voyant-route
  difference: 'Voyant vert, rayons inclinés : feux de croisement. Bleu, rayons horizontaux : feux de route. Repasser
    en croisement si les feux de route risquent d’éblouir, si la route est suffisamment éclairée ou si la météo
    réduit la visibilité.'
  theme: M
  sous_theme: voyants
  source: "Code de la route, R416-4 à R416-7, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159603"
