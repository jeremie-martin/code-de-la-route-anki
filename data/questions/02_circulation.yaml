# L : Circulation : cartes de décision (situation → décision + raison). Voir docs/research/brief-v2-redaction.md.
# Les listes de la v1 ont été découpées en décisions et en affirmations (data/affirmations/02_circulation.yaml).
- id: l-priorite-droite-defaut
  question: Intersection sans panneau ni feu ; deux véhicules arrivent en même temps par des routes ordinaires. À
    qui dois-je céder le passage ?
  reponse: À celui qui vient de ma droite, même si c'est un vélo ou une trottinette.
  explication: Sans panneau, feu ni agent, la priorité à droite s'applique, quelle que soit la largeur des rues. Une
    sortie de parking, un chemin de terre ou un véhicule prioritaire annoncé changent l'analyse.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-5
  debut: true
- id: l-sortie-parking-priorite
  question: 'Je sors d''un parking de supermarché : je dois franchir le trottoir puis m''engager dans la rue. Qui passe avant
    moi ?'
  reponse: Les piétons du trottoir et tous les véhicules de la rue, qu’ils viennent de gauche ou de droite.
  explication: 'R415-9 vise séparément la sortie d’une aire de stationnement, d’un chemin de terre, d’un accès
    non ouvert à la circulation publique et le franchissement d’un trottoir. Un parking de supermarché peut être
    ouvert au public : cela ne donne aucune priorité à sa sortie.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, R415-9, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000023095968 ; R415-11"
- id: l-stop-arret
  question: Au STOP, où exactement dois-je immobiliser mon véhicule ?
  reponse: À la ligne d’arrêt continue (sinon à la limite de la chaussée abordée), roues immobiles, avant de céder le passage.
  explication: L'arrêt s'impose même si la route paraît libre (135 €, 4 points). Une fois arrêté, je peux avancer au pas pour
    améliorer ma visibilité, puis je cède le passage des deux côtés.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-6
- id: l-tourner-gauche-regle
  question: Je tourne à gauche à une intersection sans feu. Quels véhicules peuvent avoir priorité sur moi ?
  reponse: Ceux qui viennent en face (tout droit ou tournant à droite) et, si la priorité à droite s’applique, ceux qui arrivent
    de ma droite.
  explication: Vérifier aussi les piétons qui traversent la chaussée abordée et les pistes cyclables traversées. La réponse
    cible ici les conflits avec les véhicules ; tourner n’accorde aucune priorité sur ces autres usagers.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-4 et R412-10
- id: l-giratoire-vs-rond-point
  question: Quelle différence entre un carrefour à sens giratoire et un simple rond-point, pour les priorités ?
  reponse: 'Giratoire (panneau « cédez le passage » avec les flèches en anneau) : priorité à ceux qui sont déjà dans
    l''anneau. Rond-point sans panneau : priorité à droite, donc à ceux qui entrent.'
  explication: 'La forme ronde ne suffit pas à attribuer la priorité : lire les signaux aux entrées. Les changements de voie
    imposent contrôles, signalement et respect des usagers de la voie rejointe. Ne pas déduire une interdiction générale de
    dépasser du seul mot giratoire.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-10 ; IISR (AB25)
  debut: true
- id: l-giratoire-clignotant
  question: Dans un giratoire, je vais sortir. Quand allumer mon clignotant droit ?
  reponse: Après la sortie précédente, assez tôt pour annoncer la mienne ; pour la première sortie, dès l’approche
    du giratoire.
  explication: Je contrôle rétroviseur et angle mort avant de me rabattre ou de sortir. Le clignotant annonce
    la manœuvre, il ne donne pas priorité. Tout changement de voie dans l’anneau doit aussi être signalé.
  theme: L
  sous_theme: priorites
  source: "Code de la route, R412-9 et R412-10 ; Association Prévention Routière, https://www.preventionroutiere.asso.fr/le-carrefour-giratoire-commen-bien-lemprunter/"
- id: l-giratoire-placement
  question: Giratoire à deux voies, sans flèches imposant une voie ; ma sortie est à gauche de mon axe d’entrée.
    Sur quelle voie entrer, et comment en sortir ?
  reponse: Je peux rester à droite ou emprunter la voie intérieure. Depuis l’intérieur, je cède aux usagers de
    la voie extérieure avant de me rabattre et de sortir.
  explication: C’est la position de la sortie par rapport à l’axe d’entrée qui compte, pas son numéro. La voie
    intérieure est facultative. Contrôles et clignotant à chaque changement de voie ; si je ne peux pas me rabattre
    sans danger, je refais un tour.
  theme: L
  sous_theme: priorites
  source: "Code de la route, R412-9, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000050965688"
- id: l-bus-quitte-arret
  question: En agglomération, un bus met son clignotant pour quitter son arrêt. Que dois-je faire ?
  reponse: "Ralentir et, au besoin, m'arrêter pour le laisser reprendre sa place, sans freiner brusquement ni forcer le passage."
  explication: 'R412-11 : en agglomération seulement, « ralentir si nécessaire et au besoin s''arrêter » pour laisser un véhicule
    de transport en commun quitter un arrêt signalé. Hors agglomération, le car attend une interruption du trafic.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-11
- id: l-insertion-autoroute-priorite
  question: Sur une voie d'accélération (entrée d'autoroute ou de voie rapide), comment m'insérer ?
  reponse: 'Je cède le passage à ceux qui circulent déjà et j''adapte ma vitesse pour entrer dans un créneau : rien
    ne les oblige à se déporter.'
  explication: J’utilise la voie pour adapter mon allure au trafic, avec clignotant et contrôles, sans attendre
    systématiquement son extrémité. Je m’insère dès qu’un créneau sûr le permet ; à défaut, je cède, au besoin en
    m’arrêtant avant la fin de la voie.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R421-3
- id: l-entrecroisement
  question: Sur une voie d'entrecroisement (l'entrée d'un échangeur rejoint la sortie du suivant), qui doit céder
    le passage ?
  reponse: Celui qui change de voie cède ; entrant et sortant ajustent leur vitesse pour se faciliter mutuellement
    le passage. La priorité à droite ne s’y applique pas.
  explication: 'J’anticipe les trajectoires et ajuste mon allure pour éviter un conflit. La coopération ne crée
    pas de priorité : l’entrant doit céder aux véhicules sur l’autoroute. Si aucun créneau sûr ne se présente, je
    ralentis et, au besoin, m’arrête avant la fin de ma voie ; je ne force pas l’insertion.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, R421-3, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842314 ; R412-10"
- id: l-intersection-encombree
  question: Le feu est vert mais l'intersection est bouchée derrière. Que fais-je ?
  reponse: 'J''attends avant l''intersection : je ne m''engage que si je suis sûr de la dégager sans bloquer les voies
    transversales.'
  explication: 'Article R412-33. Même règle aux passages à niveau, aux passages piétons et aux traversées de tramway : ne
    jamais s''y arrêter.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-33
- id: l-sortie-stationnement
  question: Je quitte ma place de stationnement le long du trottoir pour reprendre la circulation. Qui a la priorité ?
  reponse: 'Les véhicules qui circulent : clignotant, contrôle des rétroviseurs et de l’angle mort, et je ne m’engage que
    si la voie est libre.'
  explication: R412-10 impose d'avertir avant de reprendre sa place dans le courant de la circulation. Celui qui sort d'un
    stationnement ne bénéficie d'aucune priorité, pas même la priorité à droite.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-10
- id: l-depassement-conditions
  question: Avant de me déporter pour dépasser, de quoi dois-je m'être assuré ?
  reponse: Visibilité et marquage compatibles ; personne ne me dépasse ; écart de vitesse suffisant ; espace pour m’écarter
    puis me rabattre sans gêner.
  explication: Une ligne discontinue autorise une manœuvre sous conditions ; elle ne garantit ni la visibilité ni la place
    nécessaire.
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-4
- id: l-depassement-rabattement
  question: Pendant un dépassement, à quel moment puis-je revenir à droite ?
  reponse: Quand je vois le véhicule dépassé en entier dans mon rétroviseur intérieur ; clignotant droit, sans l’obliger à
    ralentir.
  explication: 'R414-10 : se rabattre sans provoquer le ralentissement du véhicule dépassé. Se rabattre trop tôt est la faute
    classique, surtout après un poids lourd, dont le gabarit trompe sur la distance.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-10
- id: l-depassement-interdit-lieux
  question: Sur une route à double sens, je veux dépasser une voiture en empruntant la voie opposée. Quels indices peuvent
    interdire cette manœuvre ?
  reponse: Une visibilité insuffisante, une ligne continue de mon côté ou un panneau d’interdiction de dépasser. Même sans eux, je dois pouvoir me rabattre sans gêner.
  explication: Ce cas concerne le dépassement d’une voiture en utilisant le sens opposé ; ne pas en déduire une interdiction
    générale de tout dépassement sur une chaussée à plusieurs voies.
  theme: L
  sous_theme: depassement
  source: "Code de la route, R414-4 et R414-11, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177131/"
- id: l-depassement-interdit-lieux-2
  question: J’aborde une intersection sans signalisation, où s’applique la priorité à droite. La visibilité est
    bonne et personne n’arrive à droite. Puis-je y dépasser la voiture devant moi ?
  reponse: 'Non : à cette intersection, le dépassement d’une voiture reste interdit, même si aucune voiture n’arrive
    à droite.'
  explication: R414-11 distingue les intersections où les autres routes doivent céder (STOP, cédez-le-passage,
    route prioritaire), celles réglées par des feux ou un agent, et le dépassement d’un deux-roues. Ces exceptions
    ne dispensent jamais des autres conditions de sécurité.
  theme: L
  sous_theme: depassement
  source: "Code de la route, R414-11, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177131/"
- id: l-depassement-droite
  question: Dans quels cas dépasse-t-on par la droite ?
  reponse: Un véhicule dont le conducteur a signalé qu’il tourne à gauche, et un tramway en marche si la place à droite suffit.
  explication: 'En files parallèles denses (sens unique, routes à plusieurs voies dans le même sens), avancer plus vite que
    la file de gauche n''est pas un dépassement. Hors de ces cas : 135 €, 3 points, et interdit sur autoroute.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-6 et R414-15
- id: l-position-chaussee
  question: Où doit-on circuler sur la chaussée en marche normale ?
  reponse: À droite, sur la voie la plus à droite, près du bord, en laissant de la place aux cyclistes et aux portières des
    véhicules stationnés.
  explication: 'Sur les routes à plusieurs voies dans le même sens, les voies de gauche servent à dépasser ; rester à gauche
    sans raison est sanctionné (35 €, R412-9). Circuler à gauche sur une chaussée à double sens : 135 €, 3 points.'
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R412-9 et R412-23
- id: l-tourner-droite-serrer
  question: En ville, je m'apprête à tourner à droite dans la rue suivante. Comment me placer sur la chaussée ?
  reponse: Après contrôle des rétroviseurs et de l’angle mort droit, je me place près du bord droit sans couper un cycliste.
  explication: Le placement prépare le virage ; il ne sert pas à bloquer un deux-roues. Je cède aux usagers de la piste cyclable
    que je dois traverser.
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R412-9, R412-23 et R415-14
- id: l-file-changement
  question: Avenue à sens unique à trois voies, circulation à l'arrêt sur toutes les files ; la file voisine avance
    un peu plus vite. Que fais-je ?
  reponse: 'Je reste dans ma file : en files ininterrompues, on n''en change que pour préparer un changement de direction.'
  explication: 'R412-24. Dans ces conditions, une file qui avance plus vite qu''une autre n''est pas un dépassement (R414-15)
    : je n''ai rien à me reprocher, mais je ne zigzague pas non plus.'
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R412-24 et R414-15
- id: l-demi-tour-marche-arriere
  question: J'ai raté une sortie d'autoroute ; la bande d'arrêt d'urgence est libre et le terre-plein comporte une
    interruption. Que fais-je ?
  reponse: 'Je poursuis jusqu''à la prochaine sortie : marche arrière et demi-tour sont interdits sur autoroute.'
  explication: 'Sur route ordinaire, examiner séparément les règles de chaque manœuvre : une ligne axiale continue interdit
    son franchissement, pas toute marche arrière dans sa propre voie.'
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R421-6 et R412-19
- id: l-ligne-rive-franchir
  question: Une ligne continue borde le côté droit de la chaussée (ligne de rive). Puis-je la franchir pour m'arrêter sur
    l'accotement ?
  reponse: 'Oui : une ligne de rive n’est pas une ligne axiale ; on la franchit pour s’arrêter hors chaussée, tourner ou accéder
    à une propriété.'
  explication: 'Exception : la ligne de rive d''une bande d''arrêt d''urgence d''autoroute (traits très longs) ne se franchit
    qu''en cas de nécessité absolue (R412-22).'
  theme: L
  sous_theme: positionnement
  source: IISR 7e partie ; Code de la route, art. R412-22
- id: l-vocab-chaussee-voie
  question: Quelle différence entre la chaussée, une voie et l'accotement ?
  reponse: 'La chaussée : partie de la route où circulent les véhicules ; la voie : subdivision de la chaussée large d’une
    file ; l’accotement : partie latérale hors chaussée.'
  explication: Vocabulaire des énoncés d'examen. La partie revêtue de l'accotement est la bande dérasée ; sur autoroute, c'est
    la bande d'arrêt d'urgence. Le trottoir, surélevé, est réservé aux piétons.
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R110-2 ; IISR 7e partie
  debut: true
- id: l-clignotant-quand
  question: En dehors des changements de direction à une intersection, quand le clignotant est-il obligatoire ?
  reponse: Avant tout déport ou changement de voie, avant un dépassement et son rabattement, et pour reprendre la circulation
    après un arrêt.
  explication: 'R412-10 : avertir « tout changement dans la direction » du véhicule. Défaut de clignotant : 35 € et 3 points.
    Il s''allume assez tôt pour être compris, et s''éteint dès la manœuvre terminée.'
  theme: L
  sous_theme: positionnement
  source: Code de la route, art. R412-10
- id: l-vitesse-adaptee
  question: Le panneau indique 50 km/h. Que représente cette valeur pour moi ?
  reponse: 'Un maximum pour des conditions optimales : pluie, virage sans visibilité ou rue animée imposent de rouler
    moins vite.'
  explication: R413-17 impose de réduire sa vitesse au croisement de piétons ou de cyclistes, devant un transport d'enfants
    à l'arrêt, dans les virages et descentes, par visibilité insuffisante. Rouler « à la limite » peut donc être verbalisé.
  theme: L
  sous_theme: vitesse
  source: Code de la route, art. R413-17
- id: l-retrecissement-croisement
  question: Un obstacle occupe ma voie sur une route plate à double sens, sans signalisation de priorité. Une voiture arrive
    en face. Qui attend ?
  reponse: 'J’attends : je dois empiéter sur sa voie pour contourner l’obstacle, je ne peux pas la forcer à s’arrêter.'
  explication: 'Un pont simplement étroit, sans obstacle d’un côté, ne permet pas de déduire cette priorité : observer l’engagement
    et les possibilités de croisement.'
  theme: L
  sous_theme: croisement
  source: Code de la route, art. R414-1 ; règle de conduite (programme REMC)
- id: l-arret-vs-stationnement
  question: Quelle différence entre un arrêt et un stationnement ?
  reponse: 'L’arrêt : immobilisation brève pour monter, descendre, charger ou décharger, conducteur prêt à déplacer le véhicule.
    Toute autre immobilisation est un stationnement.'
  explication: Une ligne jaune continue ou un panneau bleu barré d’une croix rouge interdit même un arrêt d’une minute, moteur tournant. Une ligne jaune discontinue ou un panneau à une seule barre interdit seulement le stationnement.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R110-2
  comparaisons:
  - ref: b6a1
    legende: 'Une barre : stationnement interdit.'
  - ref: b6d
    legende: 'Une croix : arrêt et stationnement interdits.'
- id: l-stationnement-trottoir
  question: Je gare ma voiture avec deux roues sur le trottoir en laissant de la place aux piétons. Est-ce autorisé ?
  reponse: 'Non : pour une voiture, l’arrêt ou le stationnement sur un trottoir est très gênant (135 €), même si les piétons
    peuvent passer.'
  explication: Les deux-roues motorisés ont un autre barème ; cela ne rend pas leur stationnement sur trottoir autorisé.
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-11
- id: l-stationnement-bande-cyclable
  question: Puis-je m'arrêter deux minutes sur une bande cyclable, feux de détresse allumés, pour déposer un passager ?
  reponse: 'Non : arrêt et stationnement sur une bande ou une piste cyclable sont très gênants (135 €) : ils renvoient le
    cycliste dans le trafic.'
  explication: 'L’interdiction vise l’arrêt autant que le stationnement ; les feux de détresse ne l’annulent
    pas. Ne pas assimiler toutes les places réservées : une place de livraison peut permettre un arrêt pour charger,
    contrairement à une bande cyclable.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-11
- id: l-double-file
  question: Je stationne en double file en attendant un passager, feux de détresse allumés. Est-ce autorisé ?
  reponse: 'Non : stationner en double file est gênant. Les feux de détresse ne donnent aucune autorisation.'
  explication: 'Distinguer ce stationnement d’un arrêt réel pour une montée ou descente immédiate : R417-10 III vise le stationnement
    en double file. Un arrêt ne doit pas gêner ni mettre en danger.'
  theme: L
  sous_theme: stationnement
  source: "Code de la route, R110-2 et R417-10, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045025551"
- id: l-entree-carrossable
  question: Puis-je stationner devant mon propre garage, sur la voie publique ?
  reponse: 'Non : le stationnement devant une entrée carrossable sur la voie publique est gênant, même devant
    mon propre garage.'
  explication: La propriété du garage ne réserve pas la chaussée à mon usage. Un véritable arrêt pour monter,
    descendre, charger ou décharger reste distinct du stationnement, sous réserve de ne pas gêner ni mettre en
    danger.
  theme: L
  sous_theme: stationnement
  source: "Code de la route, R417-10, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045025551 ; R110-2 ; Cass. crim., 20 juin 2017, n° 16-86.838"
- id: l-stationnement-dangereux
  question: Sur une route de campagne, je laisse ma voiture sur la chaussée juste avant un sommet de côte. Comment est-ce
    qualifié ?
  reponse: 'Stationnement dangereux : 135 €, 3 points et fourrière possible, parce que la visibilité est insuffisante pour
    ceux qui arrivent.'
  explication: 'R417-9 : même qualification près d''une intersection, dans un virage ou à l''approche d''un passage à niveau.
    C''est la seule infraction de stationnement qui retire des points.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-9
- id: l-stationnement-hors-agglo-nuit
  question: Je dois m'arrêter sur une route de campagne. Où placer mon véhicule ?
  reponse: Hors de la chaussée si l’accotement le permet ; sinon à droite, dans mon sens de marche, au plus près du bord.
  explication: 'R417-4. La nuit, sur chaussée non éclairée, les feux de position restent allumés ; si le véhicule constitue
    un danger, feux de détresse et triangle à 30 m. S''arrêter sans signalisation la nuit : 135 €, 3 points.'
  theme: L
  sous_theme: stationnement
  source: Code de la route, art. R417-4 et R416-12
- id: l-feu-hors-service-panneaux
  question: Les feux d'un carrefour sont éteints (panne) et un panneau STOP est fixé sur le même poteau. Que faire ?
  reponse: 'Appliquer le panneau : m''arrêter au STOP et céder le passage. Sans panneau, priorité à droite.'
  explication: 'Les panneaux placés sous les feux ne valent que quand les feux sont éteints ou au jaune clignotant. Feux en
    fonctionnement : ils priment sur les panneaux.'
  theme: L
  sous_theme: feux
  source: Code de la route, art. R411-25 ; IISR 6e partie
- id: l-agent-ralentir-avancer
  question: Un agent qui règle la circulation balance un bras de haut en bas dans ma direction. Que me demande-t-il ?
  reponse: 'De ralentir : il ne m''arrête pas, mais je réduis nettement mon allure et je reste prêt à m''immobiliser.'
  explication: À distinguer du bras levé (arrêt pour tous) et du geste d'appel (avancer). Le geste s'adresse à l'usager que
    l'agent regarde ; ses injonctions priment sur les feux et les panneaux.
  image:
    gen: agent
    params:
      pose: ralentir
  theme: L
  sous_theme: agents
  source: "Code de la route, art. R411-28 ; Codes Rousseau, Les agents"
- id: l-formes-couleurs-panneaux
  question: Que signifient les formes et couleurs des panneaux de danger, d'interdiction, d'obligation et d'indication ?
  reponse: 'Triangle bordé de rouge : danger. Rond bordé de rouge : interdiction. Rond bleu : obligation. Carré bleu : indication.
    Ronds barrés : fin d’interdiction (blanc) ou d’obligation (bleu).'
  explication: Les panneaux de danger sont implantés à 150 m du danger hors agglomération, 50 m en agglomération ; une interdiction
    ou une obligation vaut jusqu'à la prochaine intersection ou jusqu'au panneau de fin.
  theme: L
  sous_theme: signalisation
  source: IISR 1re partie
  debut: true
- id: l-formes-priorite-temporaire
  question: À quoi reconnaît-on les panneaux de priorité et la signalisation temporaire ?
  reponse: 'STOP : octogone rouge. Cédez-le-passage : triangle pointe en bas. Route prioritaire : losange jaune. Dangers temporaires
    : triangles à fond jaune.'
  explication: 'Jaune ne signifie pas toujours temporaire : le losange de route prioritaire est jaune lui aussi. Les prescriptions
    de chantier gardent généralement leur forme habituelle.'
  theme: L
  sous_theme: signalisation
  source: IISR 1re et 3e parties
  debut: true
- id: l-portee-prescription
  question: Une limitation à 30 km/h par un panneau rond isolé (hors zone 30 et hors panneau d'agglomération) est
    suivie d'une intersection. Elle n'est pas répétée après. Que devient-elle ?
  reponse: Elle cesse après l’intersection ; j’applique ensuite la limitation propre à la route et aux autres panneaux.
  explication: 'Ne pas généraliser à toute prescription : une zone 30 traverse les intersections ; une limitation associée
    au panneau d’entrée d’agglomération peut concerner toute l’agglomération.'
  theme: L
  sous_theme: signalisation
  source: IISR 1re partie, art. 8 ; Code de la route, art. R110-2
- id: l-panonceau-portee
  question: À quoi s'applique un panonceau (petit rectangle blanc) placé sous un panneau ?
  reponse: Au panneau qu’il complète ; symbole, mentions et position sur le support disent quels usagers ou quelle portée
    sont visés.
  explication: 'Un panonceau de catégorie peut concerner plusieurs prescriptions groupées : ne pas mémoriser « toujours le
    seul panneau juste au-dessus ».'
  theme: L
  sous_theme: signalisation
  source: IISR 1re partie, art. 9
- id: l-signalisation-temporaire
  question: Un chantier impose temporairement 50 km/h alors que la limitation permanente est de 90. Quel plafond respecter
    ?
  reponse: '50 km/h : je respecte la prescription temporaire du chantier.'
  explication: 'Le jaune caractérise notamment les dangers temporaires, les directions et les marquages. Les panneaux de prescription
    temporaires peuvent garder leur aspect habituel : ne pas se fier à la couleur seule.'
  theme: L
  sous_theme: signalisation
  source: IISR 8e partie ; Code de la route, art. R411-25
- id: l-agglomeration-panneau
  question: Ce panneau d’entrée d’agglomération est posé seul, sans autre limitation. Quel plafond de vitesse commence ici
    ?
  reponse: 50 km/h par défaut, avec une allure plus basse si la situation l’exige.
  explication: Le panneau fixe la limite de l’agglomération, même si les premières maisons sont éloignées.
  theme: L
  sous_theme: signalisation
  source: Code de la route, art. R110-2, R413-3, R416-1 ; IISR
  image_ref: eb10
- id: l-vocab-routes-lettres
  question: Que signifient les lettres A, N, D et C (ou M) devant un numéro de route ?
  reponse: A = autoroute ; N = route nationale ; D = route départementale ; C = voie communale (M = voie métropolitaine).
  explication: 'Les cartouches sont rouges pour A et N, jaunes pour D, blancs pour C. La lettre ne fixe pas la vitesse : je regarde la configuration de la route, les panneaux et les conditions de circulation.'
  theme: L
  sous_theme: signalisation
  source: Code de la route, art. L110-3 et s. ; IISR 5e partie (cartouches E42-E44)
- id: l-klaxon-danger-agglo
  question: En ville, un enfant s'apprête à traverser en courant sans me voir. Puis-je klaxonner ?
  reponse: 'Oui : en agglomération, l''avertisseur sonore est permis en cas de danger immédiat, et seulement dans
    ce cas.'
  explication: Hors agglomération, il sert aussi à annoncer un dépassement ou un croisement difficile ; la nuit,
    les appels de phares le remplacent sauf danger immédiat (R416-1 à R416-3).
  theme: L
  sous_theme: signalisation
  source: Code de la route, art. R416-1
- id: l-probatoire-autoroute-110
  theme: L
  sous_theme: vitesse
  question: 'Permis probatoire, temps sec, section d’autoroute normalement limitée à 110 km/h : quel est mon maximum
    ?'
  reponse: 100 km/h.
  explication: La limite probatoire de 110 ne concerne que les sections normalement à 130.
  source: "Code de la route, R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
- id: l-pluie-autoroute-110
  theme: L
  sous_theme: vitesse
  question: 'Permis hors période probatoire, autoroute normalement limitée à 110 km/h : il pleut. Quel est le maximum
    ?'
  reponse: 100 km/h sous la pluie.
  explication: Si un panneau impose moins, c’est ce plafond inférieur qui s’applique.
  source: "Code de la route, R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
- id: l-brouillard-zone30
  theme: L
  sous_theme: vitesse
  question: Zone 30, visibilité réduite à 40 m. La règle du brouillard me permet-elle de rouler à 50 ?
  reponse: 'Non : 30 km/h reste le maximum, et je ralentis davantage si nécessaire.'
  explication: Le plafond de 50 ne relève jamais une limitation locale plus basse.
  source: "Code de la route, R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
- id: l-pluie-route80
  theme: L
  sous_theme: vitesse
  question: Route hors agglomération limitée à 80 km/h, il pleut. La limite devient-elle automatiquement 70 ?
  reponse: 'Non : le plafond reste 80 km/h ; mon allure réelle peut devoir être bien plus basse.'
  explication: 'Ne pas soustraire systématiquement 10 ou 20 : identifier le type de route et les plafonds applicables.'
  source: "Code de la route, R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
- id: l-feu-vert-interdiction-tourner
  theme: L
  sous_theme: signalisation
  question: Le feu est vert mais un panneau interdit de tourner à gauche. Puis-je tourner à gauche ?
  reponse: 'Non : le vert ne supprime pas cette interdiction.'
  explication: Les feux prévalent sur les panneaux qui règlent la priorité, pas sur toutes les prescriptions.
  source: "Code de la route, R411-25, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842087"
- id: l-giratoire-sortie-impossible
  theme: L
  sous_theme: priorites
  question: Dans la voie intérieure d’un giratoire, ma sortie arrive mais un cycliste circule à ma droite sur la
    voie extérieure. Que faire ?
  reponse: Je lui cède le passage et, si je ne peux pas me rabattre sans le couper, je refais un tour.
  explication: Être dans l’anneau ne donne pas priorité pour changer de voie.
  source: Code de la route, R412-9 et R412-10
- id: l-cycliste-ligne-espace
  theme: L
  sous_theme: depassement
  question: Hors agglomération, dépasser le cycliste en laissant 1,50 m exigerait de franchir entièrement la ligne
    continue. Que faire ?
  reponse: Je reste derrière jusqu’à pouvoir dépasser légalement et sans danger.
  explication: L’exception autorise le chevauchement, pas le franchissement complet ; la distance latérale reste
    obligatoire.
  source: Code de la route, R412-19 et R414-4
- id: l-feu-alerte-r1
  question: Un feu jaune clignotant est fixé au-dessus d'un panneau de danger. Que signifie-t-il ?
  reponse: Il renforce l'alerte du panneau (danger fréquent ou peu visible) ; il ne change rien aux règles de priorité.
  explication: Distinguer le feu de renforcement d’un panneau du fonctionnement d’un carrefour au jaune clignotant.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-feu-modal-anticipation
  question: Mon feu automobile est rouge. À côté, un petit feu jaune clignotant porte le mot BUS. Puis-je le suivre
    en voiture particulière ?
  reponse: 'Non : cette autorisation vise les usagers auxquels le signal modal s’adresse, pas ma voiture.'
  explication: Lire le destinataire du feu avant sa couleur ; les véhicules autorisés doivent encore céder le passage.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-feu-cycliste-r19
  question: À vélo, un feu jaune clignotant porte un vélo et une flèche à droite à côté du rouge. Puis-je tourner
    à droite ?
  reponse: Oui, après avoir cédé aux piétons et aux autres usagers ; je m’arrête si nécessaire.
  explication: La direction représentée et le symbole vélo limitent l’autorisation. Ce signal ne donne pas de priorité.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-feu-acces-regule
  question: Un feu tricolore sur ma bretelle d’accès à l’autoroute est rouge alors qu’un créneau semble libre. Puis-je
    m’insérer ?
  reponse: 'Non : je respecte le rouge. Au passage autorisé, je dois encore céder au trafic de l’autoroute.'
  explication: Le feu régule le débit d’entrée ; il ne transforme pas la bretelle en voie prioritaire.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-feu-pieton-tram
  question: À pied, devant une traversée de tramway, le signal piéton affiche STOP en rouge clignotant. Aucun tram
    n’est encore visible. Puis-je traverser ?
  reponse: 'Non : je m’arrête avant la traversée et attends la fin de l’interdiction.'
  explication: La visibilité de l’usager ne remplace pas le signal d’arrêt. Le tram peut être masqué ou arriver
    rapidement.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-decompte-pieton
  question: Le décompteur piéton indique quelques secondes avant la fin du rouge. Quand puis-je traverser ?
  reponse: 'Au signal vert seulement : le décompte informe, il n''autorise rien.'
  explication: Ne pas anticiper une autorisation qui n’est pas encore donnée.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-pmv-limitation
  question: Sur autoroute normalement limitée à 130, un panneau lumineux affiche un disque rouge « 90 ». Est-ce
    un simple conseil ?
  reponse: 'Non : c’est une limitation à 90 km/h, à respecter comme un panneau fixe.'
  explication: 'Lire la forme et le contenu : un message de prudence et une prescription de vitesse ne demandent
    pas la même interprétation.'
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-quadrillage-carrefour
  question: Mon feu est vert mais la sortie du carrefour est bloquée ; un quadrillage au sol matérialise la zone centrale.
    Que fais-je ?
  reponse: 'J''attends avant l''intersection de pouvoir la dégager : le quadrillage doit rester libre.'
  explication: Le marquage rappelle une obligation déjà valable même sans quadrillage.
  theme: L
  sous_theme: signalisation
  source: Code de la route, R415-2
- id: l-bandes-rugueuses
  question: Des bandes transversales font vibrer la voiture à l'approche d'un carrefour. Que signalent-elles ?
  reponse: 'L''approche d''un danger ou d''une intersection : je ralentis et je cherche ce qui est annoncé (STOP,
    virage, passage).'
  explication: Un dispositif d’alerte n’est ni un STOP ni une règle de priorité.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-voie-lents
  question: Une voie à droite est signalée pour les véhicules lents. Ma voiture tractant une remorque n’arrive pas
    à dépasser 60 km/h dans la montée. Dois-je l’utiliser ?
  reponse: 'Oui : cette voie concerne les véhicules lents, pas seulement les camions.'
  explication: Lire la prescription et ses conditions ; à sa fin, se réinsérer après contrôles et sans forcer le
    passage.
  theme: L
  sous_theme: signalisation
  source: Code de la route, R422-1
- id: l-jalonnement-destinataire
  question: Un panneau directionnel porte un pictogramme vélo. À qui s'adresse-t-il ?
  reponse: 'Aux cyclistes : il jalonne un itinéraire cyclable ; ma voiture suit les panneaux de direction ordinaires.'
  explication: 'Même principe pour le jalonnement piéton : le destinataire compte autant que le nom de la destination.'
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-itineraire-bis
  question: Quelle différence entre un itinéraire « Bis » et une déviation de chantier ?
  reponse: 'Le Bis est une alternative conseillée ; la déviation s''impose : la route habituelle est fermée.'
  explication: Un itinéraire conseillé ne m’autorise jamais à ignorer un sens interdit ou une route barrée.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-cartouche-vitesse
  question: Le cartouche de la route passe de D à M, sans changement de chaussée ni de panneau. Quelle vitesse maximale
    s'applique ?
  reponse: 'La même : ce sont la configuration de la route et les panneaux qui fixent le plafond, pas la catégorie
    administrative.'
  explication: De même, un numéro européen ou une limite départementale ne crée pas seul une limitation.
  theme: L
  sous_theme: signalisation
  source: Code de la route, R413-1 à R413-5
- id: l-guidage-reflecteurs
  question: De nuit, des plots réfléchissants bordent la voie le long d'une ligne continue. Que changent-ils pour
    moi ?
  reponse: 'Rien aux règles : ils rendent le tracé visible ; la ligne continue reste infranchissable.'
  explication: Distinguer guidage visuel, affectation de voie et autorisation de changer de voie.
  theme: L
  sous_theme: signalisation
  source: "Arrêté du 24 novembre 1967, art. 5 et 7 ; IISR, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
- id: l-fleche-jaune-droite-rouge
  question: Mon feu est rouge ; à côté, une flèche jaune clignotante pointe vers la droite. Puis-je tourner à droite
    ?
  reponse: 'Oui, avec prudence : je cède le passage aux piétons et aux véhicules qui ont le vert.'
  explication: Cette flèche autorise le mouvement indiqué malgré le rouge, sans donner la priorité. Sans flèche,
    tourner à droite au feu rouge reste interdit en France.
  theme: L
  sous_theme: feux
  source: Code de la route, art. R412-30 et R412-32 ; arrêté du 24 novembre 1967 (signal R16)
- id: l-visuel-distance
  theme: L
  sous_theme: applications
  question: Sous un panneau de chaussée rétrécie, je lis ce panonceau. Où le danger annoncé commence-t-il ?
  reponse: À 50 m du panneau ; je me prépare avant d’y arriver.
  explication: L’absence de flèches verticales indique une distance jusqu’au danger, pas sa longueur.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: m1
- id: l-visuel-etendue
  theme: L
  sous_theme: applications
  question: Sous un panneau de chaussée rétrécie placé au début du danger, je lis ce panonceau. Sur quelle
    longueur dois-je prévoir le rétrécissement ?
  reponse: Sur 50 m à partir du début du danger.
  explication: Les flèches verticales indiquent l’étendue. Ce n’est pas une invitation à attendre 50 m pour
    ralentir.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: m2
- id: l-visuel-arret-b6a1
  theme: L
  sous_theme: applications
  question: De ce côté de la rue, après ce panneau, aucun autre motif d’interdiction ni danger. Puis-je déposer
    immédiatement mon passager en restant aux commandes ?
  reponse: 'Oui : ce panneau interdit le stationnement, pas cet arrêt pour descente immédiate.'
  explication: Un arrêt reste interdit s’il est gênant, dangereux ou interdit par une autre règle, même sous
    ce panneau.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: b6a1
- id: l-visuel-arret-b6d
  theme: L
  sous_theme: applications
  question: De ce côté de la rue, après ce panneau, aucun autre motif d’interdiction ni danger. Puis-je déposer
    immédiatement mon passager en restant aux commandes ?
  reponse: 'Non : ce panneau interdit aussi l’arrêt volontaire.'
  explication: La brièveté, la présence du conducteur et les warnings ne lèvent pas l’interdiction.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: b6d
- id: l-visuel-attendre-b6a1
  theme: L
  sous_theme: applications
  question: Après ce panneau, je reste au volant en attendant un ami qui n’est pas encore arrivé. Est-ce autorisé
    de ce côté de la rue ?
  reponse: 'Non : cette attente est un stationnement, interdit ici.'
  explication: L’arrêt réglementaire correspond à une montée, descente, opération de chargement ou déchargement,
    pas à toute immobilisation courte.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/ ; R110-2"
  image_ref: b6a1
- id: l-visuel-jaune-continu
  theme: L
  sous_theme: applications
  question: En bordure de cette chaussée, puis-je m’immobiliser pour charger immédiatement une valise, conducteur
    disponible, sans autre danger ?
  reponse: 'Non : la ligne jaune continue interdit l’arrêt et le stationnement.'
  explication: 'La couleur seule ne tranche pas : lire aussi la continuité de la ligne.'
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: marq-ligne-jaune-continue
- id: l-visuel-jaune-discontinu
  theme: L
  sous_theme: applications
  question: En bordure de cette chaussée, puis-je m’immobiliser pour charger immédiatement une valise, conducteur
    disponible, sans autre interdiction ni danger ?
  reponse: 'Oui : ce marquage interdit le stationnement, mais permet cet arrêt de chargement.'
  explication: Si j’attends sans charger, il s’agit d’un stationnement. Les autres interdictions continuent
    de s’appliquer.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: marq-ligne-jaune-discontinue
- id: l-visuel-b14-position
  theme: L
  sous_theme: applications
  question: J’approche de ce panneau isolé, sans panonceau. Dois-je commencer à freiner au panneau ou avoir
    déjà atteint le plafond à son niveau ?
  reponse: Avoir déjà atteint au plus 50 km/h à son niveau.
  explication: Préparer le ralentissement en amont, selon le trafic et sans freinage brutal.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: b14
- id: l-visuel-b14-adaptation
  theme: L
  sous_theme: applications
  question: Après ce panneau, des enfants jouent près du bord et pourraient surgir. La valeur affichée m’autorise-t-elle
    à conserver cette vitesse ?
  reponse: 'Non : c’est un plafond ; je ralentis davantage pour pouvoir réagir aux enfants.'
  explication: Le maximum autorisé et l’allure adaptée sont deux décisions différentes.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/ ; R413-17"
  image_ref: b14
- id: l-visuel-fin-interdictions
  theme: L
  sous_theme: applications
  question: 'Hors agglomération, route à une voie par sens, sans terre-plein. Après une limitation à 50, je passe
    ce panneau et rien ne suit. Voiture, temps sec, permis définitif : à combien puis-je rouler ?'
  reponse: '80 km/h : la limitation ponctuelle cesse, mais la règle générale de cette route demeure.'
  explication: Une fin d’interdiction ne signifie pas vitesse libre. Vérifier le type de route et les conditions.
  source: "Arrêté du 24 novembre 1967, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/ ; R413-2"
  image_ref: b31
- id: l-cavalier-ligne-continue
  theme: L
  sous_theme: applications
  question: 'Hors agglomération, un cavalier avance devant moi. L’écart de 1,50 m demanderait de chevaucher
    une ligne continue. Bonne visibilité : puis-je invoquer l’exception prévue pour les vélos ?'
  reponse: 'Non : cette exception ne concerne pas le cavalier ; j’attends une possibilité légale et sûre.'
  explication: L’obligation d’écart latéral couvre plusieurs usagers, mais l’exception de chevauchement ne
    couvre que cycles, EDPM et cyclomobiles légers.
  source: "Code de la route, R412-19, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842138/"
- id: l-visuel-m12-edpm
  theme: L
  sous_theme: applications
  question: Je conduis une trottinette électrique (EDPM). Le feu est rouge et porte ce panonceau. Puis-je franchir
    la ligne d’effet du feu dans la direction fléchée ?
  reponse: Oui, dans la direction fléchée, en cédant aux piétons et aux véhicules bénéficiant du vert.
  explication: Ce panonceau concerne les vélos, trottinettes électriques et cyclomobiles légers. Il autorise seulement les directions fléchées, en cédant le passage ; il ne donne aucune priorité.
  source: "Arrêté du 24 novembre 1967, article 2-1, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: m12
- id: l-visuel-m12-voiture
  theme: L
  sous_theme: applications
  question: Je conduis une voiture. Le feu est rouge et porte ce panonceau. Puis-je franchir la ligne d’effet
    du feu dans la direction fléchée ?
  reponse: Non. Le panonceau ne m’autorise pas à franchir le rouge ; j’attends le vert.
  explication: Ce panonceau concerne les vélos, trottinettes électriques et cyclomobiles légers, pas les voitures. Même pour les usagers autorisés, il faut suivre les flèches et céder le passage.
  source: "Arrêté du 24 novembre 1967, article 2-1, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/"
  image_ref: m12
- id: l-c107-route-simple
  theme: L
  sous_theme: applications
  question: 'Ce panneau est à l’entrée d’une route hors agglomération : une voie par sens, sans terre-plein
    central, ni relèvement signalé. Voiture, temps sec, hors probatoire : quel plafond ?'
  reponse: 80 km/h. Le panneau réglemente l’accès, pas un plafond automatique de 110.
  explication: Une route réservée aux véhicules motorisés n’est pas nécessairement une autoroute ni une route
    à chaussées séparées. Lire la configuration avant d’attribuer une vitesse.
  source: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600
  image_ref: c107
- id: l-c107-route-separee
  theme: L
  sous_theme: applications
  question: 'Ce même panneau est à l’entrée d’une route à deux chaussées séparées par terre-plein central,
    hors agglomération. Voiture, temps sec, hors probatoire, sans limite plus basse : quel plafond ?'
  reponse: 110 km/h, du fait des chaussées séparées par un terre-plein central.
  explication: C’est la configuration donnée qui distingue ce cas de la route à une voie par sens, pas le dessin
    de la voiture sur le panneau.
  source: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600
  image_ref: c107
- id: l-priorite-prudence
  theme: L
  sous_theme: applications
  question: Je circule sous ce régime de priorité. À une intersection, une voiture arrive vite de droite sans ralentir.
    Que fais-je ?
  reponse: 'Je ralentis et me tiens prêt à m''arrêter : ma priorité ne garantit pas que l''autre l''a comprise.'
  explication: Le droit de passer n’établit pas que l’autre conducteur l’a compris ou peut s’arrêter. Il faut
    observer son comportement.
  source: Code de la route, R415-1 et R413-17
  image_ref: ab6
