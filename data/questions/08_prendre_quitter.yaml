# Thème P : Prendre et quitter son véhicule (≈ 3 questions) : vérifier, s'installer, démarrer, quitter.
# Cartes de décision : une situation, une décision et sa raison (brief v2). Les repères chiffrés sont dans
# data/faits/08, les idées reçues de l'épreuve dans data/affirmations/08.
- id: p-verif-tour-vehicule
  question: Avant de monter, je fais le tour de ma voiture. Qu'est-ce que ce tour me montre que je ne verrais pas
    du poste de conduite ?
  reponse: Un pneu affaissé ou abîmé, une fuite, un feu ou une plaque sale, et tout obstacle bas invisible du siège
    (un enfant accroupi).
  explication: Ce contrôle repère des anomalies et des obstacles avant de bouger ; il ne garantit pas l’absence
    de panne. L’aspect du pneu ne remplace pas la mesure de sa pression.
  theme: P
  sous_theme: verifications
  source: "REMC (compétence 1) ; securite-routiere.gouv.fr, Bien préparer son trajet"
- id: p-verif-chargement-important
  question: 'Je charge le coffre de valises pour partir en vacances : qu''est-ce que je règle avant de démarrer ?'
  reponse: Je règle la pression à la valeur prévue pour cette charge et j’adapte la hauteur des feux selon la notice, sauf
    correction automatique.
  explication: La valeur constructeur décide ; ne pas ajouter une pression fixe ni supposer que tous les véhicules ont le
    même réglage manuel.
  theme: P
  sous_theme: verifications
  source: "Sécurité routière, Exemples de nouvelles questions (Q1) ; notices constructeurs"
- id: p-verif-pare-brise
  question: 'Matin d''hiver, je suis pressé : le pare-brise est givré sauf un hublot dégagé devant moi. Que fais-je
    ?'
  reponse: 'Je dégivre et désembue toute la surface vitrée, rétroviseurs compris : un champ de vision partiel est
    dangereux et sanctionnable.'
  explication: Le givre, la buée et la neige se traitent avant de partir, pas en roulant. En hiver, le lave-glace doit contenir
    un liquide antigel pour ne pas geler sur la vitre.
  theme: P
  sous_theme: verifications
  source: "Code de la route, art. R412-6 ; securite-routiere.gouv.fr, Conduire en hiver"
- id: p-verif-gps-passagers
  question: Je pars vers une adresse inconnue, avec deux passagers à l'arrière. À quel moment est-ce que je programme
    le GPS ?
  reponse: 'Avant de démarrer, à l’arrêt : le régler en roulant détourne les yeux de la route plusieurs secondes.'
  explication: Cinq secondes les yeux sur l’écran à 90 km/h, ce sont 125 m parcourus en aveugle. J’en profite pour vérifier
    que tout le monde est attaché. Une modification d’itinéraire se fait sur une aire ou un parking.
  theme: P
  sous_theme: verifications
  source: "securite-routiere.gouv.fr, Bien préparer son trajet ; REMC"
- id: p-siege-reglage
  question: Je m’installe au volant d’une voiture à boîte manuelle. Comment vérifier l’avancée du siège ?
  reponse: Pédale d’embrayage enfoncée à fond, ma jambe reste légèrement fléchie. Je dois aussi pouvoir freiner à fond sans
    déplacer mon bassin.
  explication: Avec une boîte automatique, vérifier l’accès et l’enfoncement complet de la pédale de frein. Les réglages doivent
    laisser les commandes accessibles sans étirer les jambes.
  theme: P
  sous_theme: installation
  source: "REMC ; securite-routiere.gouv.fr, S'installer au poste de conduite"
- id: p-dossier-reglage
  question: Le siège est à la bonne distance. Comment je vérifie l'inclinaison du dossier ?
  reponse: Bras tendus, poignets posés sur le haut du volant sans décoller les épaules du dossier ; en conduite, les bras
    seront alors semi-fléchis.
  explication: 'Un dossier trop incliné éloigne les épaules : on tire sur le volant au lieu de le tourner, et la ceinture
    ne plaque plus le buste.'
  theme: P
  sous_theme: installation
  source: "En Voiture Simone, S'installer ; REMC"
- id: p-appuie-tete
  question: Je viens de régler mon siège. À quelle hauteur je place l'appuie-tête ?
  reponse: Son sommet au niveau du sommet de ma tête, le plus près possible de la nuque ; trop bas, il fait pivot et aggrave
    la lésion.
  explication: Il se règle pour chaque occupant, passagers arrière compris, et se contrôle à chaque fois que l'on reprend
    un véhicule partagé.
  theme: P
  sous_theme: installation
  source: "securite-routiere.gouv.fr, Bien régler son appuie-tête ; Euro NCAP"
- id: p-retro-interieur
  question: Assis en position de conduite, je règle un rétroviseur intérieur à miroir classique. Quelle vue dois-je
    obtenir ?
  reponse: La totalité de la lunette arrière, sans bouger la tête ni les épaules.
  explication: Ce miroir donne une vue centrale vers l’arrière ; il ne couvre pas les angles morts. Les rétroviseurs
    extérieurs et le contrôle direct complètent l’observation avant une manœuvre.
  theme: P
  sous_theme: installation
  source: "REMC ; Codes Rousseau, Les rétroviseurs"
- id: p-retro-exterieurs
  question: À l’arrêt sur terrain plat, assis en position de conduite, quelle vue rechercher dans les rétroviseurs
    extérieurs ?
  reponse: Une vue dégagée vers l’arrière et les côtés, avec peu de carrosserie et l’horizon vers le milieu du miroir.
  explication: 'Ces repères servent à éviter de viser surtout la voiture ou le ciel ; ils s’adaptent au véhicule.
    Le miroir peut faire paraître un usager plus éloigné : apprécier sa distance et contrôler l’angle mort avant
    de se déporter.'
  theme: P
  sous_theme: installation
  source: "REMC ; Renault, rétroviseurs, https://www.user-manual.renault.com/fr/r%C3%A9trovision/retroviseurs-1"
- id: p-ceinture-position
  question: 'Je boucle ma ceinture : par où doivent passer les deux sangles ?'
  reponse: Sangle basse sur les os du bassin, sangle haute au milieu de l’épaule puis sur le sternum ; à plat, non vrillée,
    bien tendue.
  explication: Sur le ventre, la sangle basse provoque des lésions internes ; à la base du cou, la sangle haute blesse. Le
    point d'ancrage supérieur se règle en hauteur.
  theme: P
  sous_theme: installation
  source: "securite-routiere.gouv.fr, Comment positionner la ceinture de sécurité"
- id: p-volant-mains
  question: 'Je vais démarrer : où je place mes mains sur le volant, et pourquoi là ?'
  reponse: 'À 9 h 15 (ou 10 h 10), pouces à l’extérieur des branches : je braque vite des deux côtés sans me blesser si l’airbag
    se déploie.'
  explication: Une seule main sur le volant allonge la réaction en urgence. Le volant se tient souplement et on le laisse
    revenir en le guidant, sans lâcher prise.
  theme: P
  sous_theme: installation
  source: "REMC ; securite-routiere.gouv.fr, S'installer au poste de conduite"
- id: p-ordre-installation
  question: J’ai réglé mes rétroviseurs, puis avancé et remonté mon siège. Puis-je garder le réglage des miroirs
    sans le vérifier ?
  reponse: 'Non : ma position d’observation a changé. Je vérifie et, si besoin, règle à nouveau les rétroviseurs.'
  explication: 'Je fixe d’abord ma position de conduite : siège, dossier et volant, avec accès complet aux pédales.
    Puis je vérifie appuie-tête, rétroviseurs et ceinture. L’important est leur adaptation à ma position finale,
    pas la récitation d’un ordre unique.'
  theme: P
  sous_theme: installation
  source: "REMC ; Renault, réglage de la position de conduite, https://www.user-manual.renault.com/fr/content/renault-trafic/getting-know-your-vehicle/seat-belts/ceintures-de-securite-avant"
- id: p-demarrage-point-mort
  question: Tout est réglé, je vais mettre le contact. Où doit être le levier de vitesses ?
  reponse: 'Au point mort, embrayage enfoncé (boîte automatique : P, pied sur le frein), frein de stationnement serré : le
    véhicule ne peut pas bondir.'
  explication: >-
    Je suis la procédure de démarrage de la notice : certains témoins ne s’éteignent qu’une fois
    le moteur lancé. Je vérifie alors les alertes restantes avant de partir ; je ne desserre le frein de
    stationnement qu’au moment de rouler.
  theme: P
  sous_theme: installation
  source: "REMC ; Renault, témoins lumineux, https://www.user-manual.renault.com/fr/chapitre1-faites-connaissance-avec-votre-v%C3%A9hicule/temoins-lumineux"
- id: p-quitter-checklist
  question: Je me gare et je vais m'éloigner de ma voiture. Que fais-je avant de sortir ?
  reponse: Je coupe le moteur et le contact, serre le frein de stationnement et sécurise la transmission selon la
    notice (rapport engagé ou position P). Je vérifie l’immobilisation avant de sortir.
  explication: Un moteur momentanément arrêté par le Stop & Start n’est pas un véhicule mis hors service. Je retire
    et emporte la clé ou la carte ; les contrôles avant d’ouvrir la portière restent nécessaires.
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-8 ; Nissan Juke 2024, stationnement, https://www.nissan.fr/etre-proprietaire-d-une-nissan/manuels-utilisation/manuels/iom/juke/0f16/e0/2024/stationnement-3.shtml"
- id: p-quitter-objets
  question: Je laisse ma voiture sur un parking de gare pour la journée ; mon sac est sur le siège passager. Je
    le laisse là ?
  reponse: 'Non : j’emporte le sac, surtout s’il contient des valeurs ou des documents. Je ferme les vitres et verrouille
    le véhicule.'
  explication: Si je dois laisser des affaires sans valeur, je les mets hors de vue dans le coffre fermé, de préférence
    avant d’arriver. Cela réduit la tentation sans garantir contre le vol.
  theme: P
  sous_theme: quitter
  source: "Ministère de l’Intérieur, prévention des vols dans les véhicules, https://www.interieur.gouv.fr/fr/Archives/Archives-de-la-rubrique-Ma-securite/Avec-votre-vehicule/Contre-les-vols-de-voitures-et-d-accessoires-les-bons-reflexes"
- id: p-pente-roues
  question: Je stationne à droite, en forte pente, contre une bordure de trottoir. Comment orienter les roues ?
  reponse: 'En descente vers le trottoir, en montée vers la chaussée : si le frein lâche, le pneu bute contre la
    bordure au lieu de partir.'
  explication: Ce repère suppose une bordure pouvant retenir le pneu. Sans bordure, orienter pour limiter un départ
    vers la circulation ; appliquer le frein de stationnement et la procédure de la notice.
  theme: P
  sous_theme: quitter
  source: "Nissan Juke 2024, stationnement, https://www.nissan.fr/etre-proprietaire-d-une-nissan/manuels-utilisation/manuels/iom/juke/0f16/e0/2024/stationnement-3.shtml"
- id: p-pente-vitesse
  question: Je stationne une voiture à boîte manuelle en pente. Quel rapport laisser engagé en complément du frein
    de stationnement ?
  reponse: Le repère habituel est la première en montée et la marche arrière en descente ; je suis la notice du
    véhicule.
  explication: Le rapport engagé ajoute une retenue par la transmission ; il ne remplace pas le frein de stationnement.
    Avec une boîte automatique équipée d’une position P, je sélectionne P et serre aussi ce frein.
  theme: P
  sous_theme: quitter
  source: "Renault Megane 4, levier de vitesses et frein à main, https://www.user-manual.renault.com/fr/chapitre-2-la-conduite/levier-de-vitesses-frein-main ; Nissan Juke 2024, stationnement, https://www.nissan.fr/etre-proprietaire-d-une-nissan/manuels-utilisation/manuels/iom/juke/0f16/e0/2024/stationnement-3.shtml"
- id: p-ouvrir-portiere
  question: Au siège conducteur d’une voiture à volant à gauche, garée à droite, je vais ouvrir côté circulation. Quels contrôles
    et quelle main utiliser ?
  reponse: 'Rétroviseur puis angle mort par-dessus l’épaule, et j’ouvre de la main droite : la main opposée fait pivoter le
    buste vers l’arrière.'
  explication: Le geste de la main opposée facilite le regard arrière, sans remplacer les contrôles. Pour une autre place,
    adapter le côté et la main ; attention aux vélos même sur un trottoir ou une piste.
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-7 ; securite-routiere.gouv.fr, Portière gauche, main droite"
- id: p-passagers-descendre
  question: Je m'arrête le long d'une rue pour déposer mes enfants assis à l'arrière. Par où doivent-ils descendre
    ?
  reponse: Côté trottoir, après avoir vérifié qu’aucun vélo ni trottinette n’arrive ; sécurité enfant active, c’est moi qui
    ouvre depuis l’extérieur.
  explication: Un enfant n'a pas le réflexe de regarder avant d'ouvrir. R417-7 vise tout occupant du véhicule ; avec des enfants
    à l'arrière, c'est au conducteur d'organiser la descente.
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-7 ; securite-routiere.gouv.fr, Enfants en voiture"
- id: p-enfants-seuls
  question: Je m'arrête cinq minutes devant une boulangerie ; mon enfant dort à l'arrière. Je le laisse dans la
    voiture ?
  reponse: 'Non : je l’emmène avec moi. Un enfant sans surveillance peut être en danger même pendant une courte
    absence.'
  explication: Par chaleur, l’habitacle peut vite devenir dangereux ; une vitre entrouverte ne sécurise pas l’absence.
    Il existe aussi des risques liés aux commandes, aux portières ou à un malaise. Ne pas attendre une température
    ou une durée précise pour agir ; même précaution pour un animal.
  theme: P
  sous_theme: quitter
  source: "Nissan Juke 2024, stationnement, https://www.nissan.fr/etre-proprietaire-d-une-nissan/manuels-utilisation/manuels/iom/juke/0f16/e0/2024/stationnement-3.shtml ; Sécurité civile, fortes chaleurs, https://www.securite-civile.interieur.gouv.fr/actualites/actualites/fortes-chaleurs-canicule-quels-sont-bons-reflexes-a-adopter-pour-preserver-sa-sante"
- id: p-quitter-stationnement-surveiller
  question: Garé à droite dans une rue à double sens, je quitte ma place pour rejoindre la voie à ma gauche. Quel angle mort
    contrôler juste avant le déport ?
  reponse: 'L’angle mort gauche, en plus des rétroviseurs : c’est le côté où je rejoins la circulation ; je signale et je
    cède aux usagers.'
  explication: Le côté du contrôle dépend de la manœuvre et de la configuration ; ne pas mémoriser « toujours à droite » d’après
    une seule photo.
  theme: P
  sous_theme: quitter
  source: "Sécurité routière, Exemples de nouvelles questions (Q14) ; Code de la route, art. R412-10"
- id: p-vehicule-emprunte-equipements
  question: J'emprunte la voiture d'un proche ; le gilet et le triangle manquent. Qui est sanctionné en cas de contrôle
    ?
  reponse: 'Moi, le conducteur : les équipements obligatoires sont vérifiés avant de partir, quel que soit le propriétaire.'
  explication: 'Gilet à portée de main et triangle à bord (11 € chacun s''ils manquent). Avant de partir avec un
    véhicule inconnu, repérer aussi les commandes : feux, essuie-glaces, détresse.'
  theme: P
  sous_theme: verifications
  source: Code de la route, art. R416-19
