# Thème P — Prendre et quitter son véhicule (≈ 3 questions) : vérifier, s'installer, démarrer, quitter.
# Cartes de décision : une situation, une décision et sa raison (brief v2). Les repères chiffrés sont dans
# data/faits/08, les idées reçues de l'épreuve dans data/affirmations/08.
- id: p-verif-tour-vehicule
  question: "Avant de monter, je fais le tour de ma voiture. Qu'est-ce que ce tour me montre que je ne verrais pas du poste de conduite ?"
  reponse: "Un pneu affaissé ou abîmé, une fuite sous le véhicule, un feu ou une plaque sale, et tout obstacle bas invisible depuis le siège comme un enfant accroupi."
  explication: "Trente secondes qui évitent une crevaison sur autoroute ou un écrasement en marche arrière. Ces vérifications extérieures sont aussi demandées à l'épreuve pratique."
  theme: P
  sous_theme: verifications
  source: "REMC (compétence 1) ; securite-routiere.gouv.fr — Bien préparer son trajet"
- id: p-verif-chargement-important
  question: 'Je charge le coffre de valises pour partir en vacances : qu''est-ce que je règle avant de démarrer
    ?'
  reponse: Je règle la pression à la valeur prévue pour cette charge et j’adapte la hauteur des feux selon la notice,
    sauf correction automatique.
  explication: La valeur constructeur décide ; ne pas ajouter une pression fixe ni supposer que tous les véhicules
    ont le même réglage manuel.
  theme: P
  sous_theme: verifications
  source: Sécurité routière — Exemples de nouvelles questions (Q1) ; notices constructeurs
  tags:
  - revision::v3_1
- id: p-verif-pare-brise
  question: "Matin d'hiver, je suis pressé : le pare-brise est givré sauf un hublot dégagé devant moi. Je pars ?"
  reponse: "Non : je dégivre et je désembue toute la surface vitrée, rétroviseurs compris, avant de démarrer. Un champ de vision réduit masque piétons et deux-roues (R412-6)."
  explication: "Le givre, la buée et la neige se traitent avant de partir, pas en roulant. En hiver, le lave-glace doit contenir un liquide antigel pour ne pas geler sur la vitre."
  theme: P
  sous_theme: verifications
  source: "Code de la route, art. R412-6 ; securite-routiere.gouv.fr — Conduire en hiver"
- id: p-verif-gps-passagers
  question: "Je pars vers une adresse inconnue, avec deux passagers à l'arrière. Quand je programme le GPS ?"
  reponse: "Avant de démarrer, à l'arrêt : le régler en roulant détourne les yeux de la route plusieurs secondes. J'en profite pour vérifier que tout le monde est attaché."
  explication: "Cinq secondes les yeux sur l'écran à 90 km/h, ce sont 125 m parcourus en aveugle. Une modification d'itinéraire se fait sur une aire ou un parking."
  theme: P
  sous_theme: verifications
  source: "securite-routiere.gouv.fr — Bien préparer son trajet ; REMC"
- id: p-siege-reglage
  question: "Je m'installe au volant d'une voiture que je ne connais pas. Comment je règle l'avancée du siège ?"
  reponse: "J'enfonce la pédale d'embrayage à fond : ma jambe gauche doit rester légèrement fléchie. Jambe tendue, le siège est trop loin et je ne pourrais pas écraser le frein en urgence."
  explication: "Je m'assois au fond du siège, puis je règle la hauteur pour voir loin devant et lire le tableau de bord sans que mes genoux touchent le volant."
  theme: P
  sous_theme: installation
  source: "REMC ; securite-routiere.gouv.fr — S'installer au poste de conduite"
- id: p-dossier-reglage
  question: "Le siège est à la bonne distance. Comment je vérifie l'inclinaison du dossier ?"
  reponse: "Bras tendus, je pose les poignets sur le haut du volant sans décoller les épaules du dossier ; mes bras seront alors semi-fléchis, mains sur le cerceau."
  explication: "Un dossier trop incliné éloigne les épaules : on tire sur le volant au lieu de le tourner, et la ceinture ne plaque plus le buste."
  theme: P
  sous_theme: installation
  source: "En Voiture Simone — S'installer ; REMC"
- id: p-appuie-tete
  question: "Je viens de régler mon siège. À quelle hauteur je place l'appuie-tête ?"
  reponse: "Son sommet au niveau du sommet de ma tête et le plus près possible de la nuque ; réglé trop bas, il fait pivot et aggrave la lésion au lieu de la prévenir."
  explication: "Il se règle pour chaque occupant, passagers arrière compris, et se contrôle à chaque fois que l'on reprend un véhicule partagé."
  theme: P
  sous_theme: installation
  source: "securite-routiere.gouv.fr — Bien régler son appuie-tête ; Euro NCAP"
- id: p-retro-interieur
  question: "Assis en position de conduite, je règle le rétroviseur intérieur : qu'est-ce que je dois y voir ?"
  reponse: "La totalité de la lunette arrière, sans bouger la tête ni les épaules."
  explication: "C'est le seul rétroviseur qui ne déforme pas les distances : il sert à juger un véhicule qui suit, et à savoir quand se rabattre (le véhicule dépassé y apparaît en entier)."
  image:
    gen: retroviseur
    params:
      kind: interieur
  theme: P
  sous_theme: installation
  source: "REMC ; Codes Rousseau — Les rétroviseurs"
- id: p-retro-exterieurs
  question: "Toujours assis en position de conduite, comment je règle mes rétroviseurs extérieurs ?"
  reponse: "Un petit bord de carrosserie visible au bord intérieur du miroir, et l'horizon à mi-hauteur : autant de route que de ciel."
  explication: "Trop de carrosserie agrandit l'angle mort ; trop de ciel fait disparaître les deux-roues. Le réglage se fait à l'arrêt, une fois la position du siège définitive."
  image:
    gen: retroviseur
    params:
      kind: exterieur
  theme: P
  sous_theme: installation
  source: "REMC ; Codes Rousseau — Les rétroviseurs"
- id: p-ceinture-position
  question: "Je boucle ma ceinture : par où doivent passer les deux sangles ?"
  reponse: "La sangle basse sur les os du bassin et la sangle haute au milieu de l'épaule puis sur le sternum ; à plat, non vrillée et bien tendue."
  explication: "Sur le ventre, la sangle basse provoque des lésions internes ; à la base du cou, la sangle haute blesse. Le point d'ancrage supérieur se règle en hauteur."
  theme: P
  sous_theme: installation
  source: "securite-routiere.gouv.fr — Comment positionner la ceinture de sécurité"
- id: p-volant-mains
  question: "Je vais démarrer : où je place mes mains sur le volant, et pourquoi là ?"
  reponse: "À 9 h 15 (ou 10 h 10), les deux mains sur le cerceau et les pouces à l'extérieur des branches : je braque vite des deux côtés sans me blesser si l'airbag sort."
  explication: "Une seule main sur le volant allonge la réaction en urgence. Le volant se tient souplement et on le laisse revenir en le guidant, sans lâcher prise."
  theme: P
  sous_theme: installation
  source: "REMC ; securite-routiere.gouv.fr — S'installer au poste de conduite"
- id: p-ordre-installation
  question: "Je monte dans une voiture qu'un autre conducteur vient d'utiliser. Dans quel ordre je fais mes réglages ?"
  reponse: "Siège et dossier → appuie-tête → rétroviseurs → ceinture, puis le contact. Les rétroviseurs viennent après le siège, sinon ils seront faux."
  explication: "Tous ces réglages se font à l'arrêt. Les écoles placent le volant tantôt avant, tantôt après l'appuie-tête ; ce qui est attendu : le siège d'abord, rétroviseurs et ceinture en dernier."
  theme: P
  sous_theme: installation
  source: "REMC ; Code en Poche — Prendre et quitter son véhicule ; En Voiture Simone — S'installer"
- id: p-demarrage-point-mort
  question: "Tout est réglé, je vais mettre le contact. Où doit être le levier de vitesses ?"
  reponse: "Au point mort, embrayage enfoncé (en boîte automatique : position P et pied sur le frein), frein de stationnement encore serré : le véhicule ne peut pas bondir au démarrage."
  explication: "J'attends l'extinction des voyants avant de lancer le moteur, et je ne desserre le frein de stationnement qu'au moment de partir."
  theme: P
  sous_theme: installation
  source: "Code en Poche — Prendre et quitter son véhicule ; REMC"
- id: p-quitter-checklist
  question: "Je me gare et je vais m'éloigner de ma voiture. Que fais-je avant de sortir ?"
  reponse: "Je coupe le moteur et je retire la clé, je serre le frein de stationnement et j'engage un rapport (ou P) : rien ne doit pouvoir bouger en mon absence."
  explication: "R417-8 : on ne s'éloigne du lieu de stationnement qu'après avoir pris les précautions utiles pour prévenir tout risque d'accident du fait de son absence."
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-8 (précautions avant de s'éloigner du véhicule)"
- id: p-quitter-objets
  question: "Je laisse ma voiture sur un parking de gare pour la journée ; mon sac est sur le siège passager. Je le laisse là ?"
  reponse: "Non : je l'emporte ou je le range dans le coffre avant d'arriver, je ferme les vitres et je verrouille. Un objet visible suffit à provoquer une effraction."
  explication: "Les papiers du véhicule et les objets de valeur partent avec moi. Ranger le sac une fois garé, sous les yeux d'un guetteur, ne sert à rien."
  theme: P
  sous_theme: quitter
  source: "En Voiture Simone — Précautions pour quitter son véhicule ; securite-routiere.gouv.fr"
- id: p-pente-roues
  question: "Je stationne dans une rue en forte pente, le long d'un trottoir. Dans quel sens je braque les roues ?"
  reponse: "En descente vers le trottoir, en montée vers la chaussée : si le frein lâche, le pneu vient buter contre la bordure au lieu de partir seul."
  explication: "En montée, la voiture reculerait : roues avant braquées vers la route, l'arrière du pneu avant droit vient s'appuyer contre le trottoir. Sans trottoir, roues vers l'accotement dans les deux cas."
  image:
    gen: roue_position
    params:
      pente: descente
  theme: P
  sous_theme: quitter
  source: "securite-routiere.gouv.fr ; Codes Rousseau — Stationner en pente"
- id: p-pente-vitesse
  question: "Même rue en pente, boîte manuelle : quel rapport j'engage en plus du frein à main ?"
  reponse: "La première en montée, la marche arrière en descente : le moteur retient le véhicule dans le sens où il pourrait partir. En boîte automatique, position P."
  explication: "Le frein de stationnement peut se desserrer ou lâcher ; le rapport engagé est la deuxième sécurité, le braquage des roues vers le trottoir la troisième."
  theme: P
  sous_theme: quitter
  source: "Codes Rousseau — Stationner en pente ; En Voiture Simone — Quitter son véhicule"
- id: p-ouvrir-portiere
  question: "Je suis garé le long d'une rue bordée d'une bande cyclable. Que fais-je avant d'ouvrir ma portière ?"
  reponse: "Je contrôle le rétroviseur puis l'angle mort par-dessus l'épaule, et j'ouvre de la main droite : la main opposée oblige le buste à pivoter vers l'arrière."
  explication: "L'emportiérage d'un cycliste ou d'un motard est un accident grave ; R417-7 interdit d'ouvrir une portière quand la manœuvre constitue un danger. Je descends côté trottoir quand c'est possible."
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-7 ; securite-routiere.gouv.fr — Portière gauche, main droite"
- id: p-passagers-descendre
  question: "Je m'arrête le long d'une rue pour déposer mes enfants assis à l'arrière. Comment ils descendent ?"
  reponse: "Côté trottoir, après avoir vérifié qu'aucun vélo ni trottinette n'arrive ; la sécurité enfant étant active, c'est moi qui leur ouvre depuis l'extérieur, portière peu entrebâillée."
  explication: "Un enfant n'a pas le réflexe de regarder avant d'ouvrir. R417-7 vise tout occupant du véhicule ; avec des enfants à l'arrière, c'est au conducteur d'organiser la descente."
  theme: P
  sous_theme: quitter
  source: "Code de la route, art. R417-7 ; securite-routiere.gouv.fr — Enfants en voiture"
- id: p-enfants-seuls
  question: "Je m'arrête cinq minutes devant une boulangerie ; mon enfant dort à l'arrière. Je le laisse dans la voiture ?"
  reponse: "Non : l'habitacle chauffe très vite même vitre entrouverte, et l'enfant peut desserrer un frein ou ouvrir une portière sur la chaussée."
  explication: "L'habitacle d'une voiture au soleil peut atteindre 70 °C en 20 minutes. Même consigne pour un animal, qui ne transpire pas."
  theme: P
  sous_theme: quitter
  source: "securite-routiere.gouv.fr — Enfants en voiture"
- id: p-quitter-stationnement-surveiller
  question: Garé à droite dans une rue à double sens, je quitte ma place pour rejoindre la voie à ma gauche. Quel
    angle mort contrôler juste avant le déport ?
  reponse: 'L’angle mort gauche, en plus des rétroviseurs : c’est le côté où je rejoins la circulation. Je signale
    et je cède aux usagers qui circulent.'
  explication: Le côté du contrôle dépend de la manœuvre et de la configuration ; ne pas mémoriser « toujours à
    droite » d’après une seule photo.
  theme: P
  sous_theme: quitter
  source: Sécurité routière — Exemples de nouvelles questions (Q14) ; Code de la route, art. R412-10
  tags:
  - revision::v3
