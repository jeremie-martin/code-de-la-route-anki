- id: l-c107-route-simple
  theme: L
  sous_theme: applications
  question: 'Ce panneau est à l’entrée d’une route hors agglomération : une voie par sens, sans terre-plein
    central, ni relèvement signalé. Voiture, temps sec, hors probatoire : quel plafond ?'
  reponse: 80 km/h. Le panneau réglemente l’accès, pas un plafond automatique de 110.
  explication: Une route réservée aux véhicules motorisés n’est pas nécessairement une autoroute ni une route
    à chaussées séparées. Lire la configuration avant d’attribuer une vitesse.
  source: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600
  tags:
  - revision::v5
  - competence::application
  - competence::lecture_image
  image_ref: c107
- id: l-c107-route-separee
  theme: L
  sous_theme: applications
  question: 'Ce même panneau est à l’entrée d’une route à deux chaussées séparées par terre-plein central,
    hors agglomération. Voiture, temps sec, hors probatoire, sans limite plus basse : quel plafond ?'
  reponse: 110 km/h, du fait des chaussées séparées par un terre-plein central.
  explication: C’est la configuration donnée qui distingue ce cas de la route à une voie par sens, pas le dessin
    de la voiture sur le panneau.
  source: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159600
  tags:
  - revision::v5
  - competence::application
  - competence::lecture_image
  image_ref: c107
- id: l-priorite-prudence
  theme: L
  sous_theme: applications
  question: Je circule sous ce régime de priorité. À une intersection, une voiture arrive vite de droite sans
    ralentir. Puis-je maintenir mon allure en comptant sur ma priorité ?
  reponse: 'Non : je ralentis et me tiens prêt à m’arrêter pour éviter la collision.'
  explication: Le droit de passer n’établit pas que l’autre conducteur l’a compris ou peut s’arrêter. Il faut
    observer son comportement.
  source: Code de la route, R415-1 et R413-17
  tags:
  - revision::v5
  - competence::application
  - competence::lecture_image
  image_ref: ab6
- id: a-objet-plaie
  theme: A
  sous_theme: applications
  question: Un morceau de métal est planté dans une plaie du bras qui saigne abondamment. Puis-je l’enlever
    puis appuyer dessus ?
  reponse: 'Non : je ne retire pas l’objet et n’appuie pas dessus. Je fais alerter immédiatement et suis les
    consignes pour arrêter l’hémorragie.'
  explication: 'Un objet planté peut empêcher la compression directe : un garrot sur le membre peut être nécessaire.
    Ce cas demande un geste adapté, pas la répétition aveugle de « comprimer toute plaie ».'
  source: https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf
  tags:
  - revision::v5
  - competence::application
- id: a-traumatisme-respiration
  theme: A
  sous_theme: applications
  question: Après un choc routier, une victime ne répond pas mais respire normalement, allongée sur le dos,
    sans vomissement. La PLS est-elle automatique ?
  reponse: 'Non : j’alerte, limite les mouvements et surveille continuellement la respiration en suivant les
    consignes des secours.'
  explication: Une perte de connaissance traumatique ne se traite pas comme un malaise sans traumatisme. Vomissement
    ou respiration anormale change la conduite à tenir.
  source: https://www.securite-civile.interieur.gouv.fr/sites/securitecivile/files/medias/documents/2026-07/References-techniques-nationales-PSC_juillet-2026.pdf
  tags:
  - revision::v5
  - competence::application
- id: c-fatigue-apres-pause
  theme: C
  sous_theme: applications
  question: Après vingt minutes de pause, mes paupières sont encore lourdes. Puis-je repartir parce que j’ai
    respecté la durée conseillée ?
  reponse: Non. Je diffère le départ, dors ou passe le volant à une personne apte.
  explication: Le critère est le rétablissement de la vigilance, pas le nombre de minutes écoulées.
  source: https://www.securite-routiere.gouv.fr/sites/default/files/2023-05/sets_fatigue.pdf
  tags:
  - revision::v5
  - competence::application
- id: e-budget-trajet-tableau
  theme: E
  sous_theme: applications
  question: Sur ces deux trajets de même longueur, lequel économise du carburant, et combien au total ?
  reponse: 'Le trajet B : 2 litres de moins sur 200 km.'
  explication: Écart de 1 L/100 km, appliqué à 200 km. Ce sont des données fictives d’exercice, pas une promesse
    d’économie pour un véhicule réel.
  source: Calcul sur données fictives explicites
  tags:
  - revision::v5
  - competence::application
  - competence::lecture_document
