- id: s-remorque-masse-reelle
  theme: S
  sous_theme: applications
  question: 'La somme des PTAC dépasse 3 500 kg, avec une remorque de PTAC 1 000 kg. La remorque est vide :
    cela suffit-il à autoriser le permis B seul ?'
  reponse: 'Non : pour cette règle de permis, on additionne les PTAC, pas les masses réelles du jour.'
  explication: Le permis et les capacités techniques sont deux contrôles différents. Vider la remorque ne modifie
    pas son PTAC.
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2828
  tags:
  - revision::v5
  - competence::application
