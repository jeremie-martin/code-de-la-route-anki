- id: c-regarder-loin
  question: Pourquoi conseille-t-on de regarder loin devant soi en conduisant ?
  reponse: 'Pour anticiper : voir les dangers tôt, adapter l’allure en douceur et stabiliser la trajectoire (le véhicule va
    où le regard se porte).'
  explication: 'Regarder juste devant le capot oblige à réagir tard et brutalement. La règle : regarder loin, balayer (près,
    côtés) et contrôler le rétroviseur intérieur toutes les 5 à 10 secondes environ.'
  theme: C
  sous_theme: perception
  source: "REMC ; Codes Rousseau, L'exploration visuelle"
- id: c-croisement-nuit-regard
  question: De nuit, un véhicule arrive en face avec ses phares. Où porter le regard pour le croiser en sécurité
    ?
  reponse: Vers la droite, le plus loin possible, sans fixer ses feux ; et je ralentis.
  explication: Fixer les phares gêne la perception. Le regard vers le bord droit aide à suivre sa voie ; ralentir
    permet de tenir compte de la visibilité réduite. Je passe aussi en feux de croisement pour ne pas éblouir l’autre
    conducteur.
  theme: C
  sous_theme: perception
  source: "Sécurité routière, Exemples de nouvelles questions (Q20)"
- id: c-angle-mort-definition
  question: Qu'est-ce que l'angle mort et comment le contrôle-t-on ?
  reponse: La zone latérale arrière invisible dans les rétroviseurs ; on la contrôle d’un regard direct par-dessus l’épaule,
    dernier geste avant de se déporter.
  explication: Un deux-roues tient entièrement dans l'angle mort. Le contrôle est bref (moins d'une seconde) pour ne pas perdre
    la route de vue ; si un usager s'y trouve, on ne commence pas la manœuvre.
  theme: C
  sous_theme: perception
  source: "REMC ; securite-routiere.gouv.fr, Les angles morts"
  illustration:
    gen: angles_morts
    legende: 'Zones indicatives : elles varient selon le véhicule et le réglage des rétroviseurs.'
- id: c-ordre-controles-changement-file
  question: Sur une route à deux voies dans mon sens, je veux passer sur la voie de gauche. Dans quel ordre est-ce
    que je procède ?
  reponse: Rétroviseur intérieur puis gauche, clignotant, angle mort gauche (tête tournée), puis déport progressif à vitesse
    constante.
  explication: Les contrôles vérifient que la voie est libre ; le clignotant avertit sans donner la priorité. Recontrôler juste avant le déport, et renoncer si un usager arrive. La sécurité de la manœuvre compte davantage qu’une séquence récitée.
  theme: C
  sous_theme: vigilance
  source: "Codeclic, L'angle mort ; Stych, Les contrôles ; Code de la route, art. R412-10"
- id: c-clignotant-avant-ralentir
  question: Je vais tourner à droite à la prochaine intersection. Je mets mon clignotant avant ou après avoir ralenti ?
  reponse: 'Avant de ralentir, juste après le contrôle des rétroviseurs : ceux qui me suivent sont prévenus avant mon freinage.'
  explication: 'R412-10 : avertir avant tout changement de direction ou ralentissement. Un clignotant mis trop tôt (avant
    une autre rue ou une sortie intermédiaire) est ambigu : assez tôt, mais après la dernière intersection.'
  theme: C
  sous_theme: vigilance
  source: "Code de la route, art. R412-10 ; En Voiture Simone, Angle mort et contrôles"
- id: c-zone-attention-pluie
  question: 'Sous la pluie, en ville : un piéton s’approche du bord du trottoir à droite, une voiture roule loin devant à allure constante, une autre est garée en face. Lequel de ces éléments exige mon attention immédiate ?'
  reponse: 'Le piéton qui approche de la chaussée : je réduis l’allure et me tiens prêt à m’arrêter, sans cesser de surveiller
    le reste.'
  explication: 'La position « à droite » ne suffit pas : c’est le mouvement du piéton et la possibilité de conflit qui rendent
    ce danger prioritaire.'
  theme: C
  sous_theme: vigilance
  source: "Sécurité routière, Exemples de nouvelles questions (Q9)"
- id: c-enfant-masque
  question: Devant une école ou une rangée de voitures stationnées, quel risque spécifique lié aux enfants faut-il anticiper
    ?
  reponse: 'Un enfant, plus petit qu’un capot et masqué par les voitures, peut surgir entre deux véhicules : je ralentis fortement,
    prêt à m’arrêter.'
  explication: 'Sortie d’école, adultes qui attendent, car scolaire : ces indices imposent d’arriver déjà lent. Un exemple
    public de question (2023) valide « un enfant peut être masqué par des véhicules en stationnement ».'
  theme: C
  sous_theme: vigilance
  source: "Sécurité routière, Exemples de nouvelles questions (Q3)"
  illustration:
    gen: rue_stationnement
    params:
      parked:
      - 40
      - 150
      - 300
      child: 225
      me: 330
    legende: Plus petit qu’un capot, l’enfant entre deux voitures reste caché jusqu’au dernier moment (en médaillon, vu de côté).
- id: c-trottinette-vulnerable
  question: Pourquoi un usager de trottinette électrique est-il particulièrement vulnérable ?
  reponse: Équilibre précaire (petites roues, freinage inégal) et faible gabarit peu détectable, surtout dans les
    angles morts et de nuit.
  explication: Je prévois un écart possible et diffère le dépassement si la place manque. Pour dépasser un EDPM,
    l’écart latéral minimal est de 1 m en agglomération et 1,50 m hors agglomération (R414-4).
  theme: C
  sous_theme: vigilance
  source: "Sécurité routière, Exemples de nouvelles questions (Q4)"
- id: c-cycliste-devant-depassement
  question: Je suis en train de dépasser un cycliste ; un véhicule arrive en face et je ne pourrai pas terminer en sécurité.
    Que fais-je ?
  reponse: Je renonce au dépassement et me replace derrière le cycliste, en gardant une distance de sécurité.
  explication: Je dois pouvoir terminer le dépassement sans danger. Accélérer pour forcer le passage mettrait le cycliste
    et le véhicule en face en danger.
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R414-4 (conditions du dépassement).
- id: c-retro-avant-freiner
  question: Avant un ralentissement que je peux anticiper, pourquoi contrôler le rétroviseur intérieur ?
  reponse: Pour connaître le trafic derrière et préparer un ralentissement progressif.
  explication: Ce contrôle accompagne un ralentissement anticipé. En danger immédiat, ne pas différer le freinage d’urgence
    pour consulter le rétroviseur.
  theme: C
  sous_theme: vigilance
  source: "Ornikar, Pièges à éviter ; REMC"
- id: c-indice-feux-recul
  question: Cette voiture est stationnée devant moi. Qu’est-ce que j’anticipe ?
  reponse: 'Qu’elle va reculer ou quitter sa place : je ralentis, prêt à m’arrêter, et je garde mes distances plutôt que de
    la frôler.'
  explication: 'Les feux de recul ne s''allument qu''en marche arrière (R416-20) : c''est un indice fiable. Mêmes indices
    d''un départ imminent : roues braquées vers la chaussée, conducteur installé au volant, clignotant. Celui qui quitte un
    stationnement doit avertir de son intention (R412-10) et céder le passage, mais l''ETG attend que j''anticipe.'
  theme: C
  sous_theme: vigilance
  source: "Code de la route, art. R416-20 et R412-10 ; REMC, Anticiper"
  image:
    gen: feux_recul
    params: {}
- id: c-indice-bus-arrete
  question: Un bus est arrêté à son arrêt, à droite, en ville. Quels dangers j'anticipe ?
  reponse: 'Des piétons masqués qui traversent devant ou derrière le bus, et son redémarrage : je ralentis, je m’écarte et
    je le laisse repartir s’il l’annonce.'
  explication: 'En agglomération, je dois ralentir et au besoin m''arrêter pour laisser un véhicule de transport en commun
    quitter son arrêt (R412-11) : ce n''est pas une priorité du bus, c''est une obligation pour moi.'
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R412-11
- id: c-indice-ballon
  question: Un ballon roule sur la chaussée depuis le trottoir. Que fais-je ?
  reponse: 'Je réduis immédiatement mon allure et je me tiens prêt à m’arrêter : un enfant peut surgir derrière le ballon.'
  explication: Si un enfant surgit, je freine en urgence sans retarder le freinage pour regarder le rétroviseur. Sinon, j’adapte
    mon freinage au risque et au trafic arrière.
  theme: C
  sous_theme: vigilance
  source: "REMC, Anticiper ; securite-routiere.gouv.fr, Enfants"
- id: c-indice-cycliste-regard
  question: Devant moi, un cycliste regarde par-dessus son épaule gauche. Qu'est-ce que cela annonce ?
  reponse: 'Un déport ou un virage à gauche : je ralentis, je garde de la place et je diffère le dépassement tant que sa manœuvre
    n’est pas claire.'
  explication: Un cycliste signale ses intentions par le bras et le regard, pas par un clignotant. Il peut aussi s'écarter
    pour éviter une plaque d'égout, des gravillons ou une portière.
  theme: C
  sous_theme: vigilance
  source: "En Voiture Simone, Les vélos ; REMC"
- id: c-indice-vehicule-stationne-portiere
  question: Je longe une file de voitures stationnées en ville. Où je me place et à quelle allure ?
  reponse: 'À au moins une largeur de portière (≈ 1 m) des véhicules et à vitesse réduite : portière qui s’ouvre, piéton entre
    deux voitures, véhicule qui sort.'
  explication: Je surveille les habitacles (têtes, feux de recul, roues braquées). L'emportiérage est un accident grave et
    fréquent pour les cyclistes ; à 30 km/h, la distance d'arrêt est bien plus courte qu'à 50.
  theme: C
  sous_theme: vigilance
  source: "securite-routiere.gouv.fr, Emportiérage ; REMC"
  illustration:
    gen: rue_stationnement
    params:
      parked:
      - 60
      - 156
      - 252
      - 348
      door: 1
      door_label: portière ≈ 1 m
      me: 330
    legende: Je garde la place d’une portière qui s’ouvre.
- id: c-routine-monotonie
  question: Pourquoi les trajets quotidiens et les longues lignes droites sont-ils dangereux pour la vigilance ?
  reponse: 'La familiarité fait baisser l’attention : on manque un changement de signalisation, un piéton ou un obstacle inhabituel.'
  explication: Continuer à observer activement la route connue et ses intersections. Une statistique sur la proximité du domicile
    ne permet pas d’évaluer le risque de la scène.
  theme: C
  sous_theme: vigilance
  source: "securite-routiere.gouv.fr, Port de la ceinture (trajets courts) ; Ornikar, Vigilance"
- id: c-somnolence-que-faire
  question: Sur autoroute, je bâille, mes paupières sont lourdes et ma trajectoire flotte. Que fais-je ?
  reponse: Je gagne dès que possible un lieu d’arrêt sûr pour dormir ; je ne poursuis pas en luttant contre le sommeil.
  explication: Prévoir les pauses avant d’être somnolent. Une sieste de 15 à 20 minutes est un repère, pas une autorisation
    automatique de repartir. Si la vigilance reste insuffisante, différer le trajet ou passer le volant à un conducteur apte.
  theme: C
  sous_theme: deficiences
  source: "Sécurité routière, https://www.securite-routiere.gouv.fr/sites/default/files/2023-05/sets_fatigue.pdf"
- id: c-fatigue-remedes-faux
  question: 'Je suis somnolent au volant. Café, fenêtre ouverte, musique forte : que vaut chacun de ces remèdes ?'
  reponse: 'Rien de durable : la seule solution est de m''arrêter en sécurité pour dormir, et de ne repartir qu''une
    fois réellement apte.'
  explication: Une courte sieste peut aider mais ne garantit pas la récupération. Une fenêtre ouverte ou la musique ne remplace
    pas le sommeil. Le café ne justifie pas de continuer à lutter contre l’endormissement.
  theme: C
  sous_theme: deficiences
  source: "Sécurité routière, https://www.securite-routiere.gouv.fr/sites/default/files/2023-05/sets_fatigue.pdf"
- id: c-vitesse-fatigue
  question: Rouler vite fatigue-t-il plus que rouler lentement ?
  reponse: 'Oui : à vitesse élevée, le cerveau traite plus d’informations en moins de temps ; stress, fatigue et perte de
    vigilance arrivent plus vite.'
  explication: 'Idée reçue : « rouler lentement endort ». La Sécurité routière retient l''inverse. Plus la vitesse est élevée, plus le champ visuel se rétrécit et plus la fatigue arrive vite.'
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, La fatigue et la conduite ; La vitesse"
- id: c-telephone-arret
  question: Puis-je utiliser mon téléphone en main, arrêté au feu rouge ou dans un bouchon ?
  reponse: 'Non : l’interdiction vaut dès que le véhicule est en circulation, même arrêté au feu ou dans un bouchon ; il faut
    être garé sur un emplacement autorisé.'
  explication: 'R412-6-1 : 135 € et 3 points. Si le téléphone est relevé en même temps qu''une autre infraction (vitesse,
    feu, priorité), le permis peut être retenu sur-le-champ puis suspendu (L224-1 I 7°).'
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R412-6-1 et L224-1
- id: c-cannabis-effets
  question: Quels effets le cannabis a-t-il sur la conduite, et combien de temps durent-ils ?
  reponse: Temps de réaction allongé, somnolence, trajectoire et distances mal maîtrisées ; les effets durent plusieurs heures,
    la détection bien plus longtemps.
  explication: Il est interdit de conduire après usage. Le dépistage et la vérification servent à établir cet usage ; ils
    ne mesurent pas une aptitude à conduire. Les effets peuvent se cumuler avec ceux de l’alcool ou de médicaments.
  theme: C
  sous_theme: deficiences
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2886"
- id: c-emotions
  question: Peut-on prendre le volant après une forte émotion (dispute, colère, mauvaise nouvelle) ?
  reponse: 'Mieux vaut attendre : sous le coup de l’émotion, on perçoit moins, on prend plus de risques et le temps
    de réaction s’allonge.'
  explication: Une émotion forte peut accaparer l’attention et favoriser une réaction impulsive. Si je ne suis pas
    disponible pour observer et décider calmement, je diffère le départ.
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, Les facteurs de risque ; Codes Rousseau"
- id: c-passagers-pression
  question: Mes passagers m'incitent à rouler plus vite ou à « passer à l'orange ». Que faire ?
  reponse: 'Refuser et garder mon allure : le conducteur est seul responsable ; la pression des passagers est un facteur reconnu
    de prise de risque.'
  explication: 'Le disque A signale aux autres un conducteur novice et réduit l''impatience des suiveurs. Refuser aussi de
    monter avec un conducteur qui a bu : désigner un « Sam ».'
  theme: C
  sous_theme: deficiences
  source: "securite-routiere.gouv.fr, Conseils aux conducteurs novices"
- id: c-suiveur-trop-pres
  question: Sur une route à double sens, le véhicule qui me suit roule à quelques mètres de mon pare-chocs. Que fais-je ?
  reponse: J’allonge mon intervalle avec le véhicule qui me précède et je laisse le suiveur me dépasser dès qu’il le peut
    ; je ne freine pas pour le repousser.
  explication: Freiner ou accélérer face à un suiveur collé provoque l'accident. En reculant mon point de freinage, je récupère
    la marge que lui n'a plus. Les 2 s de l'art. R412-12 se comptent devant moi, pas derrière.
  theme: C
  sous_theme: distances
  source: "Code de la route, art. R412-12 ; securite-routiere.gouv.fr, Les distances de sécurité"
- id: c-distance-arret-composantes
  question: 'Un obstacle apparaît. Pourquoi la distance nécessaire pour m’arrêter ne se limite-t-elle pas
    à la distance de freinage ?'
  reponse: 'Il faut ajouter la distance parcourue pendant mon temps de réaction : distance d’arrêt = réaction + freinage.'
  explication: 'Réduire la vitesse réduit les deux distances. La fatigue allonge surtout la réaction ; une faible
    adhérence allonge le freinage. Le raccourci « dizaines au carré » n’est qu’un ordre de grandeur :
    utiliser les données de l’exercice, sans en déduire une distance garantie en conduite.'
  theme: C
  sous_theme: distances
  source: "Cerema, Évaluation V80 (2020), annexe 2, https://www.onisr.securite-routiere.gouv.fr/sites/default/files/2020-07/Cerema-EvaluationV80-Juillet2020-Vdef3.pdf ; raccourci des supports de préparation"
  illustration:
    gen: distance_arret
    params:
      named: true
      rows:
      - reaction: 14
        freinage: 20
    legende: Pendant la réaction, je roule encore à pleine vitesse.
- id: c-telephone-5s
  question: 'À 50 km/h constants, je quitte la route des yeux pendant 5 s. Comment estimer la distance
    parcourue sans regarder, et quel ordre de grandeur cela donne-t-il ?'
  reponse: '50 ÷ 3,6 × 5 ≈ 70 m. Avec le raccourci « dizaines × 3 » : 15 × 5 = 75 m, une estimation acceptable.'
  explication: 'Retrouver le calcul compte davantage que réciter 70 m. Les 5 s sont une donnée de cet exercice,
    pas la durée fixe d’un SMS ; pendant ce temps, un danger peut apparaître sans être perçu.'
  theme: C
  sous_theme: vigilance
  source: 'Conversion des unités et calcul à vitesse constante ; Cerema, Évaluation V80 (2020), annexe 2'
- id: c-double-vitesse-arret
  theme: C
  sous_theme: distances
  question: 'À vitesse donnée : 10 m de réaction et 10 m de freinage. Je double la vitesse, avec le même temps de
    réaction et la même adhérence. Distance d’arrêt théorique ?'
  reponse: '60 m : 20 m de réaction + 40 m de freinage.'
  explication: La réaction double, le freinage quadruple ; la distance d’arrêt totale ne quadruple donc pas automatiquement.
  source: "Modèle physique à décélération constante ; Sécurité routière, vitesse"
  illustration:
    gen: distance_arret
    params:
      total: true
      rows:
      - label: v
        reaction: 10
        freinage: 10
      - label: 2 v
        reaction: 20
        freinage: 40
    legende: 'À vitesse double : réaction × 2, freinage × 4.'
- id: c-intervalle-repere
  theme: C
  sous_theme: distances
  question: Le véhicule devant passe un panneau. Je l’atteins une seconde après lui sur route sèche. Mon intervalle
    est-il suffisant ?
  reponse: 'Non : je laisse au moins deux secondes, davantage si les conditions l’exigent.'
  explication: Le repère fixe permet de contrôler l’intervalle sans estimer des mètres.
  source: Code de la route, R412-12
- id: c-alcool-unites-probatoire
  theme: C
  sous_theme: deficiences
  question: 'Permis probatoire : l’éthylomètre mesure 0,10 mg/L d’air expiré. Suis-je encore sous le seuil interdit
    ?'
  reponse: 'Non : le seuil interdit est atteint, correspondant à 0,2 g/L de sang.'
  explication: 'Lire l’unité et le mot « atteint » : la limite ne doit pas être atteinte.'
  source: Code de la route, R234-1
- id: c-occlusion-pieton
  theme: C
  sous_theme: vigilance
  question: Le véhicule blanc est arrêté ; la voie à sa gauche est libre. Puis-je le dépasser sans voir derrière lui ?
  reponse: 'Non : je dois d’abord m’assurer qu’aucun piéton n’est engagé. Je ralentis, prêt à m’arrêter avant
    le passage ; « je ne vois personne » ne signifie pas « personne ne traverse ».'
  explication: Le véhicule arrêté peut cacher un piéton. R414-5 impose cette vérification avant de dépasser à l’approche
    du passage ; je cède aussi à celui qui manifeste clairement l’intention de traverser (R415-11).
  source: "Code de la route, R414-5, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842217 ; R415-11"
