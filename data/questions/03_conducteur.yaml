- id: c-distance-obstacle-exercice
  theme: C
  sous_theme: applications
  question: L’obstacle est à 35 m. L’exercice donne 15 m de réaction puis 25 m de freinage jusqu’à l’arrêt.
    Puis-je m’immobiliser avant l’obstacle ?
  reponse: 'Non : il faut 40 m, soit 5 m de plus que la distance disponible.'
  explication: Un freinage possible ne signifie pas un arrêt possible avant l’obstacle. Les distances données
    priment sur une table mnémotechnique.
  source: 'Relation physique : arrêt = réaction + freinage ; calcul sur données explicites'
- id: c-virage-technique
  question: J'aborde un virage serré à gauche sur une route de campagne. Quand est-ce que je freine, et où je me place ?
  reponse: Je freine avant le virage, en ligne droite ; dans la courbe, allure stable et je reste près du bord droit,
    sans couper vers l'axe.
  explication: Freiner en courbe surcharge l'avant et peut faire décrocher l'arrière ; la force centrifuge pousse
    vers l'extérieur et croît avec le carré de la vitesse. Réaccélérer progressivement en sortie. Un véhicule peut
    arriver en face, masqué par le virage. Avant un virage à droite, je me décale vers le milieu de ma voie pour
    voir plus loin, sans m'approcher de l'axe.
  theme: C
  sous_theme: vigilance
  source: "REMC (compétence 2) ; securite-routiere.gouv.fr, La vitesse et la conduite"
  illustration:
    gen: virage_gauche
    params: {}
    legende: 'Dans un virage à gauche, je reste près du bord droit : l’intérieur cache ce qui arrive en face.'
