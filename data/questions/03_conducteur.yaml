# C — Le conducteur : questions de décision (v2). Les chiffres vivent dans data/faits/03_conducteur.yaml,
# les jugements VRAI/FAUX dans data/affirmations/03_conducteur.yaml.
- id: c-regarder-loin
  question: Pourquoi conseille-t-on de regarder loin devant soi en conduisant ?
  reponse: 'Pour anticiper : voir tôt les dangers, adapter sa vitesse en douceur et stabiliser sa trajectoire (le véhicule va où le regard se porte).'
  explication: 'Regarder juste devant le capot oblige à réagir tard et brutalement. La règle : regarder loin, balayer (près, côtés) et contrôler le rétroviseur intérieur toutes les 5 à 10 secondes environ.'
  theme: C
  sous_theme: perception
  source: REMC ; Codes Rousseau — L'exploration visuelle
- id: c-croisement-nuit-regard
  question: De nuit, un véhicule arrive en face avec ses phares. Où porter le regard pour le croiser en sécurité ?
  reponse: Vers la droite, le plus loin possible (bord de chaussée, ligne de rive), sans fixer ses feux ; et je ralentis.
  explication: 'Question officielle 2023 (Q20 : « je regarde vers la droite le plus loin possible » + « je ralentis » ; PAS « je regarde ses feux » ni « je conserve les feux de route »). Fixer les phares éblouit et attire le véhicule vers eux.'
  theme: C
  sous_theme: perception
  source: Sécurité routière — Exemples de nouvelles questions (Q20)
- id: c-eblouissement-duree
  question: Après un éblouissement (phares, soleil), combien de temps la vision met-elle à revenir ?
  reponse: 'Plusieurs secondes chez un jeune (≈ 10 s à 25 ans), jusqu''à 2 minutes après 40 ans — à 90 km/h, 25 m sont parcourus « à l''aveugle » chaque seconde.'
  explication: 'D''où le réflexe : ralentir dès qu''on est ébloui et regarder le bord droit de la chaussée. Le temps de récupération augmente avec l''âge.'
  theme: C
  sous_theme: perception
  source: securite-routiere.gouv.fr — Conduire la nuit ; Dépliant La vue
- id: c-angle-mort-definition
  question: Qu'est-ce que l'angle mort et comment le contrôle-t-on ?
  reponse: 'La zone latérale arrière invisible dans les rétroviseurs ; on la contrôle d''un regard direct par-dessus l''épaule du côté de la manœuvre — dernier regard avant de se déporter ou d''ouvrir une portière.'
  explication: 'Un deux-roues tient entièrement dans l''angle mort. Le contrôle est bref (moins d''une seconde) pour ne pas perdre la route de vue ; si un usager s''y trouve, on ne commence pas la manœuvre.'
  theme: C
  sous_theme: perception
  source: REMC ; securite-routiere.gouv.fr — Les angles morts
- id: c-ordre-controles-changement-file
  question: Sur une route à deux voies dans mon sens, je veux passer sur la voie de gauche. Dans quel ordre je procède ?
  reponse: 'Rétroviseur intérieur puis rétroviseur gauche, clignotant, contrôle de l''angle mort gauche (tête tournée), puis je me déporte progressivement à vitesse constante.'
  explication: 'Certaines écoles placent l''angle mort avant le clignotant ; ce que l''ETG attend : les rétroviseurs précèdent le clignotant, et l''angle mort est le dernier regard avant de tourner le volant.'
  theme: C
  sous_theme: vigilance
  source: Codeclic — L'angle mort ; Stych — Les contrôles ; Code de la route, art. R412-10
- id: c-clignotant-avant-ralentir
  question: Je vais tourner à droite à la prochaine intersection. Je mets mon clignotant avant ou après avoir ralenti ?
  reponse: 'Avant de ralentir, juste après le contrôle des rétroviseurs : ceux qui me suivent sont prévenus avant que je freine ; je ralentis ensuite progressivement.'
  explication: 'R412-10 : avertir avant tout changement de direction ou ralentissement. Un clignotant mis trop tôt (avant une autre rue ou une sortie intermédiaire) est ambigu : assez tôt, mais après la dernière intersection.'
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R412-10 ; En Voiture Simone — Angle mort et contrôles
- id: c-zone-attention-pluie
  question: Sous la pluie en agglomération, entre le rétroviseur gauche, une voiture au loin devant et des piétons à droite, où concentrer principalement son attention ?
  reponse: 'Sur les piétons, à droite : c''est le danger le plus proche et le plus probable ; le reste se surveille par balayage.'
  explication: 'Question officielle 2023 (Q9 : zone C, les piétons/voiture à droite). Principe : hiérarchiser les zones par proximité et vulnérabilité, sans cesser de balayer.'
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q9)
- id: c-enfant-masque
  question: Devant une école ou une rangée de voitures stationnées, quel risque spécifique lié aux enfants faut-il anticiper ?
  reponse: 'Qu''un enfant, plus petit qu''un capot et masqué par les véhicules stationnés, surgisse d''un coup entre deux voitures : je ralentis fortement et je me tiens prêt à m''arrêter.'
  explication: 'Question officielle 2023 (Q3 : « Un enfant peut être masqué par des véhicules en stationnement : OUI »). Sortie d''école, adultes qui attendent, car scolaire : autant d''indices qui imposent d''arriver déjà lent.'
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q3)
- id: c-trottinette-vulnerable
  question: Pourquoi un usager de trottinette électrique est-il particulièrement vulnérable ?
  reponse: Son équilibre est précaire (petites roues, freinage inégal) et son faible gabarit le rend peu détectable, surtout dans les angles morts et de nuit.
  explication: 'Question officielle 2023 (Q4 : équilibre précaire OUI, faible gabarit peu détectable OUI). Conséquence : distance latérale d''au moins 1 m en agglomération, pas de dépassement serré.'
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q4)
- id: c-cycliste-devant-depassement
  question: 'Je suis en train de dépasser un cycliste ; un véhicule arrive en face et je ne pourrai pas terminer en sécurité. Que fais-je ?'
  reponse: 'Je me replace à droite derrière le cycliste, sans accélérer ni poursuivre ; je le dépasserai quand la voie sera libre, en laissant 1 m (1,50 m hors agglomération).'
  explication: 'Question officielle 2023 (Q7), sans énoncé : photo (cycliste devant à droite, dépassement en cours) et trois propositions — « J''accélère / Je poursuis le dépassement / Je me replace à droite » → C. Le « véhicule en face » est l''interprétation la plus probable de la photo, pas un élément du texte officiel.'
  theme: C
  sous_theme: vigilance
  source: Sécurité routière — Exemples de nouvelles questions (Q7) ; Code de la route, art. R414-4
- id: c-retro-avant-freiner
  question: Pourquoi contrôler le rétroviseur intérieur avant de freiner ou de ralentir ?
  reponse: 'Pour savoir ce qui suit (deux-roues, véhicule trop proche) et adapter la façon de ralentir : frein moteur et freinage progressif si quelqu''un est collé derrière.'
  explication: Un vélo ou une moto dans le rétroviseur signifie qu'un freinage brusque le mettrait en danger. Contrôler « derrière » avant de freiner est un réflexe attendu dans les questions d'examen.
  theme: C
  sous_theme: vigilance
  source: Ornikar — Pièges à éviter ; REMC
- id: c-indice-feux-recul
  question: Une voiture stationnée devant moi a ses feux de recul (blancs) allumés. Qu'est-ce que j'anticipe ?
  reponse: 'Qu''elle va reculer ou sortir de sa place : je ralentis, je me tiens prêt à m''arrêter et je garde mes distances plutôt que de la dépasser au ras.'
  explication: 'Les feux de recul ne s''allument qu''en marche arrière (R416-20) : c''est un indice fiable. Mêmes indices d''un départ imminent : roues braquées vers la chaussée, conducteur installé au volant, clignotant. Celui qui quitte un stationnement doit avertir de son intention (R412-10) et céder le passage, mais l''ETG attend que j''anticipe.'
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R416-20 et R412-10 ; REMC — Anticiper
- id: c-indice-bus-arrete
  question: Un bus est arrêté à son arrêt, à droite, en ville. Quels dangers j'anticipe ?
  reponse: 'Des piétons qui traversent devant ou derrière le bus (masqués), et le bus qui peut redémarrer (clignotant) : je ralentis, je m''écarte et je le laisse repartir s''il l''annonce.'
  explication: 'En agglomération, je dois ralentir et au besoin m''arrêter pour laisser un véhicule de transport en commun quitter son arrêt (R412-11) : ce n''est pas une priorité du bus, c''est une obligation pour moi.'
  theme: C
  sous_theme: vigilance
  source: Code de la route, art. R412-11
- id: c-indice-ballon
  question: Un ballon roule sur la chaussée depuis le trottoir. Que fais-je ?
  reponse: 'Je freine fort et immédiatement (après un coup d''œil au rétroviseur) : un enfant va probablement le suivre sans regarder.'
  explication: 'Indice classique de l''examen : ballon, vélo d''enfant couché, cartable, portail d''école ouvert. La bonne réponse est toujours de ralentir/se tenir prêt à s''arrêter, jamais de klaxonner.'
  theme: C
  sous_theme: vigilance
  source: REMC — Anticiper ; securite-routiere.gouv.fr — Enfants
- id: c-indice-cycliste-regard
  question: Devant moi, un cycliste regarde par-dessus son épaule gauche. Qu'est-ce que cela annonce ?
  reponse: 'Qu''il va se déporter ou tourner à gauche : je ne le dépasse pas maintenant, je ralentis et je lui laisse la place.'
  explication: Un cycliste signale ses intentions par le bras et le regard, pas par un clignotant. Il peut aussi s'écarter pour éviter une plaque d'égout, des gravillons ou une portière.
  theme: C
  sous_theme: vigilance
  source: En Voiture Simone — Les vélos ; REMC
- id: c-indice-vehicule-stationne-portiere
  question: Je longe une file de voitures stationnées en ville. Où je me place et à quelle allure ?
  reponse: 'Je m''écarte d''au moins une largeur de portière (≈ 1 m) et je réduis ma vitesse : une portière peut s''ouvrir, un piéton surgir entre deux véhicules ou une voiture sortir de sa place.'
  explication: 'Je surveille les habitacles (têtes, feux de recul, roues braquées). L''emportiérage est un accident grave et fréquent pour les cyclistes ; à 30 km/h, la distance d''arrêt est bien plus courte qu''à 50.'
  theme: C
  sous_theme: vigilance
  source: securite-routiere.gouv.fr — Emportiérage ; REMC
- id: c-routine-monotonie
  question: Pourquoi les trajets quotidiens et les longues lignes droites sont-ils dangereux pour la vigilance ?
  reponse: 'La routine installe des automatismes et fait baisser l''attention : on ne « voit » plus les changements (nouveau panneau, piéton, travaux) — la plupart des accidents mortels ont lieu près du domicile.'
  explication: 'Antidote : balayer activement (loin, près, côtés, rétroviseurs), varier son regard, et traiter chaque intersection connue comme si elle était nouvelle — surtout sur le trajet fait tous les jours.'
  theme: C
  sous_theme: vigilance
  source: securite-routiere.gouv.fr — Port de la ceinture (trajets courts) ; Ornikar — Vigilance
- id: c-somnolence-que-faire
  question: Sur autoroute, je bâille, mes paupières sont lourdes et ma trajectoire flotte. Que fais-je ?
  reponse: 'Je m''arrête à la prochaine aire et je dors 15 à 20 minutes : ce sont des signes de somnolence, contre laquelle on ne peut pas lutter (micro-sommeils de 1 à 4 s).'
  explication: 'Fatigue (picotements des yeux, nuque raide, regard fixe) = une pause suffit ; somnolence (bâillements, paupières lourdes, oubli des derniers kilomètres) = dormir. Ne pas « tenir jusqu''à la sortie ».'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite
- id: c-fatigue-remedes-faux
  question: 'Café, fenêtre ouverte, musique forte : cela suffit-il pour continuer à conduire quand on est somnolent ?'
  reponse: 'Non : ces moyens ne retardent la somnolence que quelques minutes et donnent une fausse impression de vigilance. Seul le sommeil (sieste de 15-20 min) est efficace.'
  explication: 'Piège d''examen classique : « je bois un café et je repars » est une mauvaise réponse ; « je m''arrête sur une aire pour dormir » est la bonne.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite
- id: c-vitesse-fatigue
  question: Rouler vite fatigue-t-il plus que rouler lentement ?
  reponse: 'Oui : à vitesse élevée le cerveau doit traiter plus d''informations en moins de temps, ce qui génère du stress et accélère la fatigue et la perte de vigilance.'
  explication: 'Idée reçue à l''examen : « rouler lentement endort ». La Sécurité routière retient l''inverse. Plus la vitesse est élevée, plus le champ visuel se rétrécit et plus la fatigue arrive vite.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La fatigue et la conduite ; La vitesse
- id: c-telephone-arret
  question: Puis-je utiliser mon téléphone en main, arrêté au feu rouge ou dans un bouchon ?
  reponse: 'Non : l''interdiction vaut dès que le véhicule est en circulation, même arrêté au feu ou dans un bouchon ; pour téléphoner en main, il faut être garé sur un emplacement où l''arrêt est autorisé.'
  explication: 'R412-6-1 : 135 € et 3 points. Si le téléphone est relevé en même temps qu''une autre infraction (vitesse, feu, priorité), le permis peut être retenu sur-le-champ puis suspendu (L224-1 I 7°).'
  theme: C
  sous_theme: deficiences
  source: Code de la route, art. R412-6-1 et L224-1
- id: c-cannabis-effets
  question: Quels effets le cannabis a-t-il sur la conduite, et combien de temps durent-ils ?
  reponse: 'Temps de réaction allongé, somnolence, trajectoire mal tenue et distances mal perçues ; les effets durent plusieurs heures et le dépistage salivaire reste positif bien plus longtemps.'
  explication: 'Aucun seuil : toute trace détectée constitue le délit (L235-1 : 3 ans, 9 000 €, 6 points), et les effets s''additionnent à ceux de l''alcool ou d''un médicament.'
  theme: C
  sous_theme: deficiences
  source: securite-routiere.gouv.fr — La drogue et la conduite ; Code de la route, art. L235-1
- id: c-emotions
  question: Peut-on prendre le volant après une forte émotion (dispute, colère, mauvaise nouvelle) ?
  reponse: 'Mieux vaut attendre : sous le coup de l''émotion, on perçoit moins, on prend plus de risques (vitesse, dépassements) et le temps de réaction s''allonge.'
  explication: Le stress et la colère sont des « déficiences » au même titre que la fatigue. La réponse attendue à l'examen est de différer le trajet ou de se calmer avant de partir.
  theme: C
  sous_theme: deficiences
  importance: utile
  source: securite-routiere.gouv.fr — Les facteurs de risque ; Codes Rousseau
- id: c-passagers-pression
  question: Mes passagers m'incitent à rouler plus vite ou à « passer à l'orange ». Que faire ?
  reponse: 'Refuser et garder mon allure : le conducteur est seul responsable ; la pression des passagers (surtout chez les jeunes) est un facteur de prise de risque reconnu.'
  explication: 'Le disque A signale aux autres un conducteur novice et réduit l''impatience des suiveurs. Refuser aussi de monter avec un conducteur qui a bu : désigner un « Sam ».'
  theme: C
  sous_theme: deficiences
  importance: utile
  source: securite-routiere.gouv.fr — Conseils aux conducteurs novices
- id: c-suiveur-trop-pres
  question: Sur une route à double sens, le véhicule qui me suit roule à quelques mètres de mon pare-chocs. Que fais-je ?
  reponse: 'J''allonge mon propre intervalle avec le véhicule qui me précède et je laisse le suiveur me dépasser dès qu''il le peut ; je ne freine pas pour le faire reculer.'
  explication: 'Freiner ou accélérer face à un suiveur collé provoque l''accident. En reculant mon point de freinage, je récupère la marge que lui n''a plus. Les 2 s de l''art. R412-12 se comptent devant moi, pas derrière.'
  theme: C
  sous_theme: distances
  source: Code de la route, art. R412-12 ; securite-routiere.gouv.fr — Les distances de sécurité
