# D — Réglementation : les décisions que l'épreuve fait prendre. Les chiffres vivent dans
# data/faits/06_reglementation.yaml, les jugements dans data/affirmations/06_reglementation.yaml.
- id: d-controle-papiers-oublies
  question: 'Un agent me contrôle : je n''ai pas la carte grise du véhicule sur moi. Que se passe-t-il ?'
  reponse: Amende de 11 € et 5 jours pour présenter le document au commissariat ou à la gendarmerie ; sinon l’amende passe
    à 135 €.
  explication: Les documents exigés sont le permis (carte ou application France Identité) et le certificat d'immatriculation
    ; l'attestation d'assurance ne l'est plus depuis avril 2024 (contrôle par le fichier des véhicules assurés).
  theme: D
  sous_theme: documents
  source: Code de la route, art. R233-1 ; service-public.fr F2794
- id: d-vente-vehicule
  question: Je vends ma voiture de huit ans à un particulier, avec un contrôle technique favorable. Quels documents
    de vente lui remettre, et quelle démarche faire ?
  reponse: Carte grise barrée, datée (avec l’heure) et signée ; certificat de cession signé par nous deux ; certificat
    de situation administrative de moins de 15 jours ; procès-verbal du contrôle technique. Je déclare la cession sous 15 jours.
  explication: Le contrôle doit avoir moins de 6 mois lors de la demande de carte grise de l’acheteur. L’ANTS permet
    la déclaration et fournit un code de cession à lui transmettre ; Simplimmat permet aussi une démarche commune.
    Avec une contre-visite prescrite, le délai de 2 mois doit encore courir ; une défaillance critique exige réparation
    et contre-visite avant la vente à un particulier.
  theme: D
  sous_theme: documents
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F1707
- id: d-conduite-supervisee
  question: À 19 ans, après ma formation en auto-école, je veux rouler avec un accompagnateur avant l’épreuve pratique. De
    quelle filière s’agit-il, et que change-t-elle par rapport à l’AAC ?
  reponse: 'La conduite supervisée : dès 18 ans après l’ETG, avec l’accord de l’école, sans durée ni kilométrage minimal ;
    elle ne réduit pas le délai probatoire.'
  explication: Elle peut aussi être proposée après un échec à l’épreuve pratique. L’accompagnateur et l’assureur doivent donner
    leur accord, comme en AAC. La conduite encadrée est une troisième filière, réservée aux élèves en formation professionnelle
    dès 16 ans.
  theme: D
  sous_theme: permis
  source: Code de la route, art. R211-5-1 ; service-public.fr F2827
- id: d-permis-b-125
  question: J'ai le permis B depuis trois ans. Puis-je conduire un scooter de 125 cm³ ?
  reponse: 'Oui, après une formation de 7 heures : permis B depuis au moins 2 ans, motocyclette légère (125 cm³,
    11 kW).'
  explication: 'Sans cette formation (sauf pratique attestée avant 2011), la conduite d''une 125 avec le permis B
    n''est pas autorisée : 135 € et immobilisation possible. Un cyclomoteur de 50 cm³ se conduit avec le B sans formation.'
  theme: D
  sous_theme: permis
  source: Code de la route, art. R221-8 ; arrêté du 17 décembre 2010 modifié ; service-public F2828
- id: d-invalidation-repasser
  question: Permis invalidé pour solde de points nul. Dois-je repasser le code et la conduite ?
  reponse: Le code est à repasser. La conduite aussi, sauf si j’avais le permis depuis au moins 3 ans, si l’interdiction
    dure moins d’un an et si je respecte le délai de réinscription.
  explication: Pour une invalidation, Service Public demande la réinscription dans les 9 mois à compter de la remise
    du permis à la préfecture. Contrôles médical et psychotechnique requis. Je peux entreprendre les démarches pendant
    l’interdiction ; obtenir le nouveau permis exige d’attendre sa fin (6 mois, ou 1 an après une nouvelle invalidation
    dans les 5 ans).
  theme: D
  sous_theme: points
  source: 'Service Public — invalidation, étapes 3 à 8 : https://www.service-public.gouv.fr/particuliers/vosdroits/F1704
    ; R224-20'
- id: d-ct-critique
  theme: D
  sous_theme: controle_technique
  question: Le contrôle technique révèle une défaillance critique aujourd'hui. Jusqu'à quand puis-je conduire la voiture
    ?
  reponse: 'Jusqu''à ce soir seulement : la validité est limitée au jour du contrôle ; ensuite, je fais transporter
    le véhicule.'
  explication: Ne pas confondre les deux mois pour la contre-visite avec l’autorisation de circuler.
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F2878
- id: d-vitesse-40-49
  theme: D
  sous_theme: sanctions
  question: 'Excès de vitesse retenu de 40 à 49 km/h : combien de points sont retirés ?'
  reponse: 4 points.
  explication: Contravention de quatrième classe, amende forfaitaire de 135 € ; rétention et suspension possibles
    selon la procédure. À partir de 50 km/h, le régime du grand excès est différent.
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F19460
- id: d-suspension-invalidation
  theme: D
  sous_theme: permis
  question: Quelle différence entre suspension et invalidation pour solde de points nul ?
  reponse: La suspension interdit temporairement de conduire ; l’invalidation pour solde nul fait perdre la
    validité du permis et impose une procédure pour en obtenir un nouveau.
  explication: La rétention est une mesure conservatoire immédiate des forces de l’ordre. L’annulation judiciaire
    est décidée par un juge. Aucun de ces termes n’est synonyme d’un simple retrait de points.
  source: Service Public — https://www.service-public.gouv.fr/particuliers/vosdroits/F14836 ; https://www.service-public.gouv.fr/particuliers/vosdroits/F1704
