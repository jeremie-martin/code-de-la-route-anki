# D : Réglementation : les décisions que l'épreuve fait prendre. Les chiffres vivent dans
# data/faits/06_reglementation.yaml, les jugements dans data/affirmations/06_reglementation.yaml.
- id: d-controle-papiers-oublies
  question: 'Un agent me contrôle : je n''ai pas la carte grise du véhicule sur moi. Que se passe-t-il ?'
  reponse: Amende de 11 € et 5 jours pour présenter le document au commissariat ou à la gendarmerie ; sinon l’amende passe
    à 135 €.
  explication: Les documents exigés sont le permis (carte ou application France Identité) et le certificat d'immatriculation
    ; l'attestation d'assurance ne l'est plus depuis avril 2024 (contrôle par le fichier des véhicules assurés).
  theme: D
  sous_theme: documents
  source: Code de la route, art. R233-1 ; service-public.fr F2794
- id: d-conduite-supervisee
  question: À 19 ans, après avoir réussi l’ETG, je roule avec un accompagnateur avant l’épreuve pratique (conduite supervisée).
    Qu’est-ce que cette filière ne m’apporte pas, contrairement à l’AAC ?
  reponse: 'La réduction du délai probatoire (2 ans au lieu de 3) : l’AAC la donne, la conduite supervisée non. Elle n’impose
    ni durée ni kilométrage minimal.'
  explication: Possible dès 18 ans, après l’ETG, avec l’accord de l’école, de l’accompagnateur et de l’assureur ; elle peut
    aussi suivre un échec à l’épreuve pratique. La conduite encadrée est réservée aux élèves en formation professionnelle,
    dès 16 ans.
  theme: D
  sous_theme: permis
  source: Code de la route, art. R211-5-1 ; service-public.fr F21012 (conduite supervisée)
- id: d-permis-b-125
  question: J'ai le permis B depuis trois ans. Puis-je conduire un scooter de 125 cm³ ?
  reponse: 'Oui, après une formation de 7 heures : permis B depuis au moins 2 ans, motocyclette légère (125 cm³,
    11 kW).'
  explication: Sans cette formation (sauf pratique attestée avant 2011), le permis B n'autorise pas la conduite d'une 125 ; l'attestation se présente en cas de contrôle. Un cyclomoteur de 50 cm³ se conduit avec le B sans formation.
  theme: D
  sous_theme: permis
  source: Code de la route, art. R221-8 ; arrêté du 17 décembre 2010 modifié ; service-public F2828
- id: d-invalidation-repasser
  question: Permis invalidé pour solde de points nul. Dois-je repasser le code et la conduite ?
  reponse: Le code est à repasser. La conduite aussi, sauf si j’avais le permis depuis au moins 3 ans, si l’interdiction
    dure moins d’un an et si je respecte le délai de réinscription.
  explication: La réinscription doit intervenir dans un délai de 9 mois. Contrôles médical et psychotechnique requis. Je
    peux entreprendre les démarches pendant l’interdiction ; obtenir le nouveau permis exige d’attendre sa fin.
  theme: D
  sous_theme: points
  source: "Service Public, invalidation, étapes 3 à 8 : https://www.service-public.gouv.fr/particuliers/vosdroits/F1704 ; R224-20"
- id: d-ct-critique
  theme: D
  sous_theme: controle_technique
  question: Le contrôle technique révèle une défaillance critique aujourd'hui. Jusqu'à quand puis-je conduire la voiture
    ?
  reponse: 'Jusqu''à ce soir seulement : la validité est limitée au jour du contrôle ; ensuite, la voiture ne circule plus (réparation sur place ou dépanneuse).'
  explication: Ne pas confondre les deux mois pour la contre-visite avec l’autorisation de circuler.
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2878"
- id: d-vitesse-40-49
  theme: D
  sous_theme: sanctions
  question: 'Excès de vitesse retenu de 40 à 49 km/h : combien de points sont retirés ?'
  reponse: 4 points.
  explication: Contravention de quatrième classe, amende forfaitaire de 135 € ; rétention et suspension possibles
    selon la procédure. À partir de 50 km/h, le régime du grand excès est différent.
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F19460"
- id: d-suspension-invalidation
  theme: D
  sous_theme: permis
  question: 'Suspension ou invalidation pour solde de points nul : dans quel cas mon permis redevient-il valable à la fin
    de la mesure, sans en obtenir un nouveau ?'
  reponse: 'La suspension : c’est une interdiction temporaire de conduire, et le permis reste le mien. L’invalidation lui
    fait perdre sa validité : il faut en obtenir un nouveau, après le délai d’interdiction.'
  explication: La rétention est une mesure immédiate des forces de l’ordre, l’annulation une décision du juge ; aucun de
    ces termes ne désigne un simple retrait de points.
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F14836 ; https://www.service-public.gouv.fr/particuliers/vosdroits/F1704"
- id: d-conduite-malgre-suspension
  question: 'Le préfet a suspendu mon permis et la décision m’a été notifiée. Je conduis quand même pour aller travailler.
    Qu’est-ce que je risque ?'
  reponse: 'Un délit : jusqu’à 2 ans d’emprisonnement et 4 500 € d’amende, et la perte de la moitié de mes points (6).'
  explication: Peuvent s’y ajouter l’immobilisation et la confiscation du véhicule, une nouvelle suspension jusqu’à 3 ans,
    voire l’annulation du permis. Conduire pendant une rétention ou après une annulation est le même délit.
  theme: D
  sous_theme: permis
  source: Code de la route, art. L224-16
- id: d-bonus-malus
  question: 'Je provoque un accident dont je suis entièrement responsable. Que devient mon coefficient bonus-malus ?'
  reponse: 'Il augmente de 25 % : il est multiplié par 1,25 à l’échéance suivante.'
  explication: 'Responsabilité partagée : +12,5 %. Le coefficient est plafonné à 3,50. Chaque année sans accident responsable,
    il baisse de 5 %, jusqu’à 0,50 au mieux ; après trois ans à 0,50, un premier accident responsable n’entraîne pas de
    malus.'
  theme: D
  sous_theme: documents
  source: Code des assurances, art. A121-1 ; service-public.fr F2655
