- id: r-nuit-feux-croisement-route
  question: De nuit, hors agglomération, je roule en feux de route ; des phares apparaissent au loin en face. Que fais-je
    ?
  reponse: Je passe en feux de croisement assez tôt pour ne pas l'éblouir, et j'y reste tant que nous ne sommes pas croisés.
  explication: R416-6 impose aussi les feux de croisement quand on suit un véhicule à faible distance, sur une route éclairée
    et par visibilité réduite ; le passage doit se faire « suffisamment à l'avance » (III).
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-5 et R416-6
- id: r-nuit-suivre-vehicule-feux
  question: De nuit sur une route non éclairée, je rattrape une voiture et je roule à faible distance derrière elle.
    Quels feux ?
  reponse: Feux de croisement tant que je la suis de près (je l'éblouis par ses rétroviseurs) ; les feux de route
    quand l'écart se creuse.
  explication: 'Art. R416-6 II 1° b : feux de croisement quand on suit un autre véhicule à faible distance, sauf lors d''une
    manœuvre de dépassement.'
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-6
- id: r-nuit-gabarit-camion
  question: De nuit sur une route non éclairée, j’aperçois ceci au loin, bien avant des phares. Qu’en conclure ?
  reponse: 'Qu’un poids lourd arrive en face : je passe en feux de croisement dès maintenant.'
  explication: Les feux d’encombrement (dits de gabarit), en haut de la cabine, se voient de plus loin que les projecteurs, souvent avant un sommet de côte ou une courbe. Ils laissent le temps de basculer en feux de croisement sans éblouir un conducteur assis haut.
  theme: R
  sous_theme: nuit
  source: Code de la route, art. R416-6 et R313-10
  image:
    gen: gabarit_nuit
    params: {}
- id: r-nuit-vitesse-visibilite
  question: Pourquoi faut-il rouler moins vite de nuit, même sur une route connue et dégagée ?
  reponse: Pour pouvoir m’arrêter dans la distance effectivement visible, que l’éclairage, le contraste de l’obstacle et la
    météo limitent.
  explication: 'Je dois pouvoir m’arrêter dans la partie de route que je vois. Les feux de croisement n’ont qu’une portée minimale réglementaire de 30 m, et un obstacle sombre s’y détache tard : à 90 km/h, la distance d’arrêt dépasse ce que je distingue. D’où les feux de route dès que personne n’est ébloui.'
  theme: R
  sous_theme: nuit
  source: "Code de la route, R413-17, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000047794480/"
- id: r-pluie-feux
  question: Averse de jour sur une route hors agglomération, la visibilité baisse nettement. Dois-je allumer mes feux ?
  reponse: 'Oui, les feux de croisement : obligatoires dès que la visibilité est réduite par la météo, de jour comme de nuit.'
  explication: 'L’allumage automatique ne réagit pas toujours à la pluie de jour : vérifier le voyant vert. En agglomération bien éclairée, les feux de position peuvent suffire sous la pluie, sauf pour les motos (R416-6 II 3°). Par forte pluie, les feux de brouillard avant sont admis, les arrière non.'
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R416-4 et R416-6
- id: r-pluie-premieres-gouttes
  question: Il se met à pleuvoir après une longue période sèche. Pourquoi la chaussée est-elle le plus glissante à ce moment-là
    ?
  reponse: 'L’eau soulève le film de poussière, de gomme et d’hydrocarbures : l’adhérence chute dès les premières gouttes,
    avant que la chaussée soit détrempée.'
  explication: On ralentit et on allonge son intervalle dès le début de l'averse, sans attendre d'avoir « assez » d'eau sur
    la route.
  theme: R
  sous_theme: intemperies
  source: "Stych, Circuler par temps de pluie ; securite-routiere.gouv.fr, Conduire sous la pluie"
- id: r-aquaplaning
  question: Sur chaussée très mouillée, la direction devient soudain légère et le véhicule répond mal. Que faire face à un
    possible aquaplanage ?
  reponse: Je relâche progressivement l’accélérateur et garde une direction stable, sans freinage ni braquage brusque, pour
    retrouver l’adhérence.
  explication: 'Les pneus peuvent perdre le contact avec la chaussée sur un film d’eau. Une gerbe derrière un véhicule ne
    suffit pas à diagnostiquer un aquaplanage. Prévenir : allure réduite, pneus en état, intervalle accru.'
  theme: R
  sous_theme: intemperies
  source: "Ornikar, L'aquaplaning ; securite-routiere.gouv.fr, Conduire sous la pluie"
- id: r-brouillard-feux
  question: Par brouillard, quels feux dois-je utiliser ?
  reponse: Les feux de croisement (jamais les feux de route, qui se réfléchissent sur le brouillard), complétés au besoin
    des feux de brouillard avant et arrière.
  explication: 'Les feux de brouillard arrière s''éteignent dès que la visibilité redevient correcte : ils éblouissent ceux
    qui suivent. À l''arrêt dans le brouillard, feux de position.'
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R416-6 et R416-7
  comparaisons:
  - ref: voyant-brouillard-avant
    legende: 'Feux de brouillard avant : brouillard, neige ou forte pluie.'
  - ref: voyant-brouillard-arriere
    legende: 'Feu de brouillard arrière : brouillard ou neige ; à éteindre dès que la visibilité revient.'
- id: r-brouillard-intervalle
  question: Le brouillard réduit la visibilité à 40 m. La route est normalement limitée à 80. Quel plafond de vitesse appliquer
    ?
  reponse: 50 km/h au maximum, et moins si nécessaire pour pouvoir m’arrêter dans la distance visible.
  explication: Une limitation plus basse, par exemple 30, reste applicable. Augmenter l’intervalle ; 50 km/h n’est pas une
    vitesse à atteindre.
  theme: R
  sous_theme: intemperies
  source: "Code de la route, art. R413-1 à R413-5, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177128/"
- id: r-neige-conduite
  question: Je roule sur une route couverte de neige. Comment dois-je agir sur les commandes ?
  reponse: 'Je réduis fortement ma vitesse et j’augmente les distances, avec des commandes progressives : accélération, freinage
    et direction sans gestes brusques.'
  explication: 'Ordres de grandeur : sur neige, la distance de freinage peut être multipliée par quatre, sur verglas
    jusqu’à dix. J’anticipe très tôt, j’utilise le frein moteur et je braque peu ; un rétrogradage brusque fait aussi
    déraper.'
  theme: R
  sous_theme: intemperies
  source: "securite-routiere.gouv.fr, Conduire en hiver ; Codes Rousseau, Neige et brouillard"
- id: r-verglas-descente
  question: 'Chaussée verglacée dans une descente : quel rapport et quel frein ?'
  reponse: Un rapport bas engagé avant la descente, allure très lente, freinage très doux et progressif ; ni freinage brutal
    ni rétrogradage dans la pente. Si l’adhérence ne le permet pas, je renonce.
  explication: Le frein moteur peut lui aussi faire perdre l’adhérence. Ni ABS ni rapport court ne garantit de maîtriser une
    pente verglacée.
  theme: R
  sous_theme: intemperies
  source: "securite-routiere.gouv.fr, Conduire en hiver ; En Voiture Simone, Le verglas"
- id: r-deneigement-depassement
  question: Un engin de service hivernal (saleuse, lame) travaille devant moi sur la chaussée enneigée. Puis-je le dépasser
    ?
  reponse: 'Non : dépasser un engin de service hivernal en action est interdit ; devant lui, la chaussée n’est ni raclée ni
    salée.'
  explication: "Art. R414-17 (135 €). C’est un véhicule d’intérêt général bénéficiant de facilités de passage (R311-1) :
    je lui facilite le passage, sans qu’il soit prioritaire aux intersections. Il projette sel et neige ; je reste
    à bonne distance derrière lui."
  theme: R
  sous_theme: intemperies
  source: Code de la route, art. R414-17
- id: r-vent-lateral
  question: Vent latéral fort ; je dépasse un poids lourd sur un viaduc. Que se passe-t-il et que dois-je faire ?
  reponse: 'Abrité le long du camion, je suis déporté par la rafale en le dépassant : volant tenu fermement à deux mains,
    allure réduite, écart latéral élargi.'
  explication: Une rafale peut aussi surprendre à la sortie d’un tunnel ou à la fin d’une rangée d’arbres. Le triangle portant une manche à air annonce une zone exposée.
  theme: R
  sous_theme: intemperies
  source: "securite-routiere.gouv.fr, Le vent ; Ornikar, Conduire par grand vent"
  comparaisons:
  - ref: a24
    legende: Zone exposée au vent latéral.
  - ref: j7
    legende: 'Manche à air : direction et force du vent.'
- id: r-soleil-bas
  question: 'Soleil rasant de face au coucher : que fais-je ?'
  reponse: Je ralentis selon ma visibilité, j’augmente l’intervalle et j’utilise le pare-soleil avec un pare-brise propre.
  explication: Si le soleil est derrière moi, il peut éblouir l’usager venant en face. Allumer les feux de croisement aide les autres à me voir.
  theme: R
  sous_theme: intemperies
  source: "En Voiture Simone, Conduire face au soleil"
- id: r-tunnel-feux-jour
  question: 'Tunnel éclairé, en plein jour : dois-je allumer mes feux ?'
  reponse: 'Oui : j’allume les feux de croisement avant d’entrer, même si le tunnel est éclairé.'
  explication: Je dois voir et être vu malgré le changement de luminosité. Les feux de jour ne remplacent pas
    les feux de croisement ; je vérifie leur allumage au lieu de me fier au mode AUTO.
  theme: R
  sous_theme: tunnels
  source: "CETU, https://www.cetu.developpement-durable.gouv.fr/conduire-en-tunnel-a1597.html"
- id: r-tunnel-distance-arret
  question: Un tunnel affiche deux distances entre véhicules, l’une en circulation, l’autre à l’arrêt. La file
    s’immobilise devant moi. Quelle consigne appliquer ?
  reponse: 'La distance prévue à l’arrêt : je laisse cet espace libre au lieu de venir coller le véhicule précédent.'
  explication: 'Ce sont les valeurs affichées à l’entrée du tunnel qui font foi ; sans distance propre à l’arrêt, je
    garde la même qu’en circulation. Des plots bleus peuvent matérialiser l’intervalle (garder le nombre indiqué,
    souvent deux). Cet espace limite la propagation d’un incendie et laisse passer les secours.'
  theme: R
  sous_theme: tunnels
  source: "CETU, https://www.cetu.developpement-durable.gouv.fr/IMG/pdf/CETU-Note_Info_22_2011.pdf"
- id: r-tunnel-panne
  question: Mon véhicule tombe en panne dans un tunnel. Où me placer et que faire des clés ?
  reponse: Feux de détresse, garage (emplacement d’arrêt) le plus proche, moteur coupé, clés sur le contact et véhicule non
    verrouillé pour qu’on puisse le déplacer.
  explication: 'Je sors par la droite avec mon gilet et j''appelle depuis le poste d''une niche de sécurité : l''appel est
    localisé et l''exploitant voit le tunnel en vidéo.'
  theme: R
  sous_theme: tunnels
  source: "CETU, Conduire en tunnel ; securite-routiere.gouv.fr, Les tunnels"
  comparaisons:
  - ref: c8
    legende: Emplacement d’arrêt d’urgence.
  - ref: ce2a
    legende: 'Poste d’appel : l’appel est localisé.'
- id: r-tunnel-incendie
  question: Un véhicule brûle devant moi dans le tunnel et la fumée se propage. Que fais-je ?
  reponse: Je m’arrête à distance sur le côté, moteur coupé et clés laissées ; je rejoins à pied l’issue de secours la plus
    proche, dos à la fumée.
  explication: 'Les fumées tuent en quelques minutes : on ne reste jamais dans son véhicule et on ne rebrousse pas chemin
    en voiture. Les issues sont signalées en vert.'
  theme: R
  sous_theme: tunnels
  source: "CETU, Consignes en cas d'incendie ; securite-routiere.gouv.fr, Les tunnels"
  comparaisons:
  - ref: ce30a
    legende: Issue de secours à rejoindre à pied.
- id: r-tunnel-mon-vehicule-feu
  question: De la fumée sort de mon capot alors que je roule dans un tunnel ; la voiture avance encore. Où dois-je m’arrêter ?
  reponse: 'À l’air libre : tant que le véhicule peut rouler, je sors du tunnel avant de m’arrêter. Je ne m’arrête
    à l’intérieur que s’il ne peut plus avancer.'
  explication: 'Un véhicule en feu immobilisé enfume tout le tunnel et piège les usagers derrière moi. Si l’arrêt
    est inévitable : emplacement d’arrêt d’urgence, feux de détresse, moteur coupé et clés laissées, alerte depuis
    une niche de sécurité, puis évacuation par une issue de secours.'
  theme: R
  sous_theme: tunnels
  source: CETU, Conduire en tunnel ; securite-routiere.gouv.fr, Les tunnels
- id: r-pn-feu-rouge-clignotant
  question: À un passage à niveau, les feux rouges clignotent et la sonnerie retentit, mais la barrière n'est pas
    encore baissée. Que fais-je ?
  reponse: 'Je m''arrête : le feu rouge clignotant impose l''arrêt absolu, barrière ou non ; un train peut arriver
    dans les secondes.'
  explication: 'La sonnerie et les feux se déclenchent avant la descente des demi-barrières : les feux suffisent à imposer
    l''arrêt (135 €, 4 points).'
  theme: R
  sous_theme: passages_a_niveau
  source: Code de la route, art. R412-30 et R422-3
  image:
    gen: pn_face
    params:
      barriere: haute
- id: r-pn-engagement
  question: J'arrive sur un passage à niveau ouvert, mais la file de voitures est arrêtée juste après. Que fais-je
    ?
  reponse: Je m'arrête avant le passage et j'attends de pouvoir le franchir d'un trait, sans risquer d'y rester bloqué.
  explication: Art. R422-3 II. Beaucoup d'accidents viennent d'un véhicule bloqué sur les voies par un bouchon ; le dépassement
    est en outre interdit aux passages à niveau sans barrière ni demi-barrière (R414-12).
  theme: R
  sous_theme: passages_a_niveau
  source: "Code de la route, art. R422-3 ; SNCF Réseau, Sécurité aux passages à niveau"
  image:
    gen: pn_plan
    params:
      barrieres: hautes
      file: true
- id: r-pn-bloque
  question: Ma voiture reste immobilisée sur les rails et ne peut plus avancer. Que faire ?
  reponse: Faire sortir les occupants, s’éloigner des voies et alerter immédiatement (numéro affiché au passage à niveau,
    sinon le 112).
  explication: Si le véhicule peut encore rouler mais est enfermé par les barrières, les enfoncer pour dégager. Ne pas mélanger
    ce cas avec celui d’un véhicule incapable de bouger ; ne pas rester pour sauver la voiture.
  theme: R
  sous_theme: passages_a_niveau
  source: "SNCF Réseau, Que faire en cas d'immobilisation ; Code de la route, art. R422-3"
- id: r-pn-sans-barriere
  question: Un passage à niveau n’est signalé que par ceci, sans barrière ni feu. Comment procéder ?
  reponse: Ralentir fortement, regarder et écouter des deux côtés, et ne traverser que si aucun train n’approche ; dans le
    doute, s’arrêter.
  explication: 'Une croix simple annonce une voie, une croix double plusieurs voies : « un train peut en cacher un autre ».
    Le dépassement y est interdit (R414-12).'
  theme: R
  sous_theme: passages_a_niveau
  source: Code de la route, art. R422-3 et R414-12 ; IISR (G1, A8, J10)
  image_ref: g1
  comparaisons:
  - ref: g1a
    legende: 'Croix double : plusieurs voies ferrées ; un train peut en cacher un autre.'
- id: r-pn-barrieres-ouverture
  question: Les demi-barrières commencent à se relever mais les feux rouges clignotent encore. Quand puis-je passer
    ?
  reponse: 'Quand les feux sont éteints et les barrières immobiles : tant qu''ils clignotent, un second train peut
    arriver.'
  explication: Attendre l’ouverture complète et l’extinction des feux. Une fermeture prolongée peut avoir plusieurs causes
    ; elle ne donne aucune autorisation de passer. Signaler une anomalie depuis un lieu sûr.
  theme: R
  sous_theme: passages_a_niveau
  source: Code de la route, art. R422-3 ; SNCF Réseau
  image:
    gen: pn_face
    params:
      barriere: mi
- id: r-tram-priorite
  question: Croisement sans feu ni panneau ; ce tramway arrive sur ma gauche. Qui passe ?
  reponse: 'Le tramway : il est prioritaire sur tous les usagers, d’où qu’il vienne, car il ne peut ni s’écarter ni s’arrêter
    court.'
  explication: Art. R422-3 I. Seuls un agent ou un signal à prescription absolue l'arrêtent. On ne dépasse pas un tram à l'arrêt
    du côté où montent les voyageurs (R414-13).
  theme: R
  sous_theme: tramways
  source: Code de la route, art. R422-3 et R414-13 ; IISR 3e partie, art. 42-9 B 3°
  image:
    gen: intersection
    params:
      approaches:
        S:
          vehicle:
            colour: bleu
            me: true
          goes: straight
        W:
          vehicle:
            colour: jaune
            kind: tram
          goes: straight
- id: r-tram-traversee-degager
  question: Je dois traverser ces rails de tramway pour continuer tout droit ; la file devant moi est arrêtée. Que fais-je ?
  reponse: 'J’attends avant les rails de pouvoir les dégager entièrement : s’arrêter sur la plateforme est interdit et le
    tram ne peut pas m’éviter.'
  explication: La distance de freinage d'un tramway est très longue et il ne peut pas dévier.
  theme: R
  sous_theme: tramways
  source: "Code de la route, art. R422-3 et R417-11 ; coursdecode.com, Les tramways"
  image:
    gen: intersection
    params:
      rails:
      - E
      queue:
        branch: N
        count: 3
      approaches:
        S:
          vehicle:
            colour: bleu
            me: true
          goes: straight
- id: r-chantier-fleche-lumineuse
  image:
    gen: chantier_rabattement
    width: 960
    params:
      sign: {kind: sign, file: "France road sign B21a2.svg"}
  question: Sur cette chaussée d’autoroute, je roule vers le haut du dessin. De quel côté dois-je me rabattre, et comment préparer la manœuvre ?
  reponse: À gauche. Je ralentis, contrôle les rétroviseurs et l’angle mort, puis signale et me rabats dès que je peux le faire sans danger.
  explication: La flèche lumineuse indique le côté à rejoindre. Elle ne me donne pas priorité sur les véhicules de cette voie.
    Je prépare le rabattement en amont, sans attendre d’être au niveau du dispositif. Schéma hors échelle ; le détail montre le signal de face.
  theme: R
  sous_theme: chantiers
  source: "IISR, 8e partie, art. 133 F et annexes VI/VII (VC20250904) : FLR avec flèche KR43 ; arrêté du 4 septembre 2025, https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052200261"

- id: r-autoroute-sortie
  question: Ma sortie d'autoroute est annoncée. Où et quand dois-je ralentir ?
  reponse: Je prépare ma voie tôt et je ralentis sur la voie de décélération ; plus tôt et progressivement si le trafic, la
    visibilité ou une limitation l’exigent.
  explication: Ne pas maintenir artificiellement sa vitesse face à une file arrêtée ou une limitation. Contrôler derrière
    et anticiper évitent un freinage tardif. Une sortie manquée se rattrape à l’échangeur suivant.
  theme: R
  sous_theme: autoroute
  source: "Code de la route, R413-17, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000047794480/ ; R421-4"
  illustration:
    gen: bretelle
    params:
      mode: sortie
      label: voie de décélération
      vehicles:
      - lane: bretelle
        x: 330
        me: true
      - lane: droite
        x: 120
    legende: Je ralentis une fois sur cette voie, hors du flot de l’autoroute.
- id: r-autoroute-bau
  question: À quoi sert la bande d'arrêt d'urgence et qui peut l'emprunter ?
  reponse: Aux arrêts d’urgence (panne, malaise) et aux véhicules de secours ou d’exploitation ; y rouler, ou s’y arrêter
    pour téléphoner ou se reposer, est interdit.
  explication: 'Circuler sur la BAU : 135 € et 3 points. Sur certains tronçons, elle est ouverte à la circulation aux heures
    de pointe comme voie auxiliaire (signalisation dynamique).'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R412-8 et R421-7
- id: r-autoroute-panne
  question: Je tombe en panne sur autoroute. Que fais-je, dans l'ordre ?
  reponse: Feux de détresse, je me range au plus près du bord droit de la bande d’arrêt d’urgence, gilet enfilé avant de sortir,
    tout le monde évacue par la droite.
  explication: 'Roues braquées vers l''extérieur. Le triangle ne se pose pas s''il faut marcher sur la chaussée : on ne traverse
    jamais les voies d''une autoroute.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R421-7 et R416-19
  illustration:
    gen: autoroute_attente
    legende: Voiture au bord droit de la bande d’arrêt d’urgence ; occupants en gilet derrière la glissière.
- id: r-autoroute-panne-attendre
  question: Mon véhicule est arrêté sur la bande d'arrêt d'urgence et tout le monde est sorti. Où attendre les secours ?
  reponse: Derrière la glissière de sécurité, en arrière du véhicule, du côté d’où arrivent les voitures ; pour rejoindre la borne d’appel, je marche derrière la glissière, jamais sur la chaussée.
  explication: Rester dans la voiture, ou debout derrière elle, est ce qui tue lors d'une panne sur autoroute. Seul un dépanneur
    agréé peut y intervenir.
  theme: R
  sous_theme: autoroute
  source: "securite-routiere.gouv.fr, Panne sur autoroute ; Code de la route, art. R421-7"
  illustration:
    gen: autoroute_attente
    legende: Voiture sur la bande d’arrêt d’urgence ; occupants en gilet derrière la glissière, en arrière du véhicule.
- id: r-autoroute-usagers-interdits
  question: Quels usagers n'ont pas le droit de circuler sur autoroute ?
  reponse: Piétons et animaux, vélos, véhicules à moteur non immatriculés (trottinettes électriques), cyclomoteurs, petits tricycles et quadricycles à moteur (voiturettes comprises), tracteurs et engins agricoles ou de travaux publics.
  explication: 'Point commun : ils ne peuvent pas tenir l''allure du trafic ou y sont trop vulnérables. Ces usagers sont aussi interdits sur les routes réservées aux automobiles, signalées par une voiture de face sur fond bleu. Un élève en conduite accompagnée peut, lui, circuler sur autoroute.'
  theme: R
  sous_theme: autoroute
  source: Code de la route, art. R421-2
  comparaisons:
  - ref: c207
    legende: Début d’autoroute.
  - ref: c107
    legende: 'Route pour automobiles : mêmes usagers interdits.'
- id: r-autoroute-peage
  question: Comment choisir sa voie à l'approche d'un péage ?
  reponse: 'Tôt, d’après les pictogrammes : « t » orange pour le télépéage, carte bancaire, pièces ou péagiste ; une croix
    rouge signale une voie fermée.'
  explication: 'Voie « t » : au plus 30 km/h quand la voie l''affiche, sinon ralentir jusqu''à l''arrêt devant la barrière. Après
    le péage, chacun se réinsère en fermeture éclair ; attention aux agents à pied dans la zone.'
  theme: R
  sous_theme: autoroute
  source: "ASFA, Le péage ; IISR"
  comparaisons:
  - ref: c64d
    legende: 'Voie « t » : télépéage.'
  - ref: r21a
    legende: 'Croix rouge : voie fermée.'
- id: r-autoroute-fatigue-aires
  question: Sur autoroute, où puis-je m'arrêter pour faire une pause ?
  reponse: 'Sur une aire seulement : aire de repos (stationnement, détente) ou aire de service (carburant, restauration) ;
    la bande d’arrêt d’urgence n’est jamais un lieu de pause.'
  explication: Les aires sont annoncées par des panneaux à 2 000 m puis 1 000 m. Une pause toutes les 2 heures, et
    sans attendre dès les premiers signes de somnolence (sieste de 15 à 20 minutes).
  theme: R
  sous_theme: autoroute
  source: "ASFA, Les aires d'autoroute ; securite-routiere.gouv.fr, La fatigue"
- id: r-montagne-croisement-difficile
  question: 'Route de montagne étroite : un véhicule monte pendant que je descends et le croisement s''annonce difficile.
    Qui s''arrête ?'
  reponse: 'Moi : le véhicule qui descend s’arrête le premier, parce qu’il redémarrera plus facilement que celui qui monte.'
  explication: Art. R414-3 I. Sur une chaussée étroite, le véhicule de plus de 2 m de large ou de 7 m de long s'efface aussi
    devant les plus petits (R414-2).
  theme: R
  sous_theme: montagne
  source: Code de la route, art. R414-2 et R414-3
- id: r-montagne-marche-arriere
  question: Croisement impossible sur une route de montagne, deux voitures de même catégorie face à face. Laquelle doit reculer
    ?
  reponse: Celle qui descend, sauf si la manœuvre est manifestement plus facile pour celle qui monte (place d’évitement toute
    proche, par exemple).
  explication: Art. R414-3 III. Entre catégories différentes (R414-3 II), recule le véhicule seul face à un ensemble, le plus
    léger des deux, ou le camion de plus de 3,5 t face à un transport en commun.
  theme: R
  sous_theme: montagne
  source: Code de la route, art. R414-3
- id: r-descente-freinage
  question: Comment freiner dans une longue descente (par exemple à 15 %) ?
  reponse: Rapport inférieur pour le frein moteur, et freinage par intermittence (appuis francs puis relâche) plutôt
    que continu, pour éviter la surchauffe.
  explication: Un frein qui chauffe perd de son efficacité. Je choisis mon rapport avant la descente et j’adapte
    l’allure pour ne pas devoir freiner en continu ; les freinages restent maîtrisés, sans brusquer les commandes
    sur sol glissant.
  theme: R
  sous_theme: montagne
  source: "Sécurité routière, Exemples de nouvelles questions (Q18)"
- id: r-b26-pneus-equivalence
  question: Ma voiture possède quatre pneus hiver marqués 3PMSF et M+S. Ce panneau, sans panonceau, annonce une section enneigée. Dois-je monter des chaînes pour le respecter ?
  reponse: 'Non : les pneus hiver conformes sont admis en équivalence pour une voiture.'
  explication: 'Ce panneau exige un équipement en service sur la section, pas seulement détenu : pneus hiver 3PMSF
    montés ou chaînes posées. C’est la différence avec le panneau de zone hivernale, où détenir des chaînes à bord
    suffit.'
  theme: R
  sous_theme: montagne
  source: "IISR, art. 67-1, modifié par arrêté du 23 juin 2021, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12"
  image_ref: b26
- id: r-b26-chaines-complement
  question: Ce panneau est complété par « Chaînes à neige obligatoires ». Ma voiture a quatre pneus 3PMSF. Puis-je continuer sans chaînes montées ?
  reponse: 'Non : ce complément impose les chaînes ; l’équivalence des pneus hiver ne suffit plus.'
  explication: Monter les chaînes sur au moins deux roues motrices à un emplacement sûr, selon la notice, avant
    d’emprunter la section.
  theme: R
  sous_theme: montagne
  source: "IISR, art. 67-1, modifié par arrêté du 23 juin 2021, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12"
  image_ref: b26
