# E — Environnement : décisions d'écoconduite, pollution, écomobilité.
# Les chiffres vivent dans data/faits/11_environnement.yaml, les idées reçues dans data/affirmations/11_environnement.yaml.
- id: e-feu-rouge-anticipation
  question: Le feu passe au rouge à une centaine de mètres devant moi. Je maintiens mon allure pour freiner ensuite, ou je lève le pied tout de suite ?
  reponse: 'Je lève le pied tout de suite : en frein moteur l''injection est coupée, je ne consomme rien, je ménage mes freins et j''arrive peut-être au vert.'
  explication: 'Anticiper est le premier geste d''écoconduite : moins de freinages, donc moins de réaccélérations. À l''ETG, « je maintiens ma vitesse » est presque toujours la mauvaise réponse.'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; En Voiture Simone — Éco-conduite
- id: e-rapports-regime
  question: À quel régime passe-t-on les rapports pour consommer moins ?
  reponse: Vers 2 500 tr/min en essence et 2 000 tr/min en diesel ; on roule sur le rapport le plus élevé possible sans faire peiner le moteur (ex. 4e à 50 km/h en ville).
  explication: Un moteur qui tourne vite consomme et s'use plus ; à l'inverse, un régime trop bas (à-coups) l'abîme. La boîte automatique gère cela seule en mode normal ou éco.
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite
- id: e-moteur-arret
  question: Les barrières d'un passage à niveau viennent de se fermer devant moi. Je laisse tourner le moteur ?
  reponse: 'Non : dès qu''un arrêt dépasse 20 à 30 secondes, je coupe le moteur — c''est exactement ce que fait automatiquement le Stop & Start.'
  explication: Un moteur au ralenti consomme 0,5 à 1 L/h et pollue pour rien ; le redémarrage coûte moins que 20 s de ralenti. Laisser tourner le moteur d'un véhicule à l'arrêt sans nécessité est d'ailleurs interdit.
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; arrêté du 12 novembre 1963 (moteur tournant à l'arrêt)
- id: e-frein-moteur
  question: Qu'est-ce que le frein moteur et pourquoi l'utiliser ?
  reponse: 'Le ralentissement obtenu en levant le pied avec un rapport engagé, sans débrayer : injection coupée donc consommation nulle, freins ménagés et véhicule plus stable.'
  explication: 'Il s''emploie dès que l''on peut ralentir sans freiner, et il est indispensable en longue descente (question officielle 2023 : freinage par intermittence et frein moteur).'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; Sécurité routière — Exemples de nouvelles questions (Q18)
- id: e-climatisation-conso
  question: 'Été, embouteillage en ville par forte chaleur : climatisation ou vitres ouvertes ?'
  reponse: 'Les vitres : à faible allure, c''est la climatisation qui coûte le plus cher en carburant. Si je la garde, je la règle 4 à 5 °C sous la température extérieure.'
  explication: Un entretien régulier (filtre d'habitacle, fluide frigorigène) maintient son efficacité ; le fluide, gaz à fort effet de serre, ne se recharge que chez un professionnel.
  theme: E
  sous_theme: ecoconduite
  source: ADEME — La climatisation ; Codeclic — Conduite économique
- id: e-polluant-co2
  question: Pourquoi le CO₂ ne se traite-t-il pas comme les autres polluants d'un véhicule ?
  reponse: Ce n'est pas un gaz toxique mais le principal gaz à effet de serre ; il est proportionnel au carburant brûlé, donc aucun filtre ne le réduit — seule une consommation plus faible le fait.
  explication: Les transports pèsent près de 30 % des émissions françaises de gaz à effet de serre, la voiture particulière en tête. Les NOx et les particules, eux, se traitent par catalyseur, filtre à particules ou AdBlue.
  theme: E
  sous_theme: pollution
  source: ADEME ; Ministère de la Transition écologique — Qualité de l'air
- id: e-particules-usure
  question: En dehors de l'échappement, d'où viennent les particules fines émises par une voiture ?
  reponse: De l'usure des freins, des pneus et de la chaussée — plus de la moitié du total des particules dues au trafic routier.
  explication: D'où l'intérêt d'une conduite souple, qui use moins les freins, et de pneus bien gonflés. Particules fines et NOx nuisent à la santé (asthme, maladies cardio-vasculaires) ; le CO₂ au climat.
  theme: E
  sous_theme: pollution
  source: ADEME ; En Voiture Simone — Achat éco-responsable
- id: e-critair-classes
  question: Sur quoi repose la classe Crit'Air d'un véhicule ?
  reponse: 'Sur son type de motorisation et sa date de première mise en circulation, qui déterminent sa norme Euro — pas sur sa puissance ni sur sa consommation réelle.'
  explication: Une essence et un diesel de la même année n'ont donc pas la même classe. La vignette se commande sur certificat-air.gouv.fr et elle est exigée aussi bien en ZFE que lors d'un pic de pollution.
  theme: E
  sous_theme: pollution
  source: certificat-air.gouv.fr ; service-public.fr F33371
- id: e-zfe-definition
  question: Qu'est-ce qu'une ZFE (zone à faibles émissions mobilité) ?
  reponse: Une zone urbaine délimitée par des panneaux, où les véhicules les plus polluants ne peuvent pas circuler, en permanence ou à certaines heures, selon leur vignette Crit'Air.
  explication: 'Les restrictions varient selon la métropole et selon l''année : on vérifie les règles locales avant un trajet. L''entrée est signalée par le panneau de zone B56, avec un panonceau qui précise les vignettes Crit''Air concernées et les horaires.'
  theme: E
  sous_theme: pollution
  source: Code général des collectivités territoriales, art. L2213-4-1 ; service-public.fr F33371
- id: e-pic-pollution
  question: Que peut décider le préfet lors d'un épisode de pollution ?
  reponse: 'Instaurer la circulation différenciée, annoncée la veille : seules certaines vignettes Crit''Air circulent ; il peut aussi abaisser les vitesses maximales et dévier les poids lourds.'
  explication: Les mesures sont annoncées par les panneaux à messages variables, la radio et les médias ; leur non-respect coûte 68 €. Les transports en commun peuvent être rendus gratuits ou moins chers.
  theme: E
  sous_theme: pollution
  source: service-public.fr — Pic de pollution ; arrêtés préfectoraux
- id: e-bruit-sources
  question: Quelles nuisances sonores un conducteur peut-il éviter ?
  reponse: Le klaxon hors danger immédiat, un échappement modifié ou percé, et les accélérations à haut régime, surtout la nuit en agglomération.
  explication: Le bruit est une nuisance sanitaire (sommeil, stress) ; un échappement non conforme coûte 135 € et peut faire immobiliser le véhicule. Des radars sonores sont expérimentés depuis 2022.
  theme: E
  sous_theme: bruit
  source: Code de la route, art. R318-3 et R416-1 ; ADEME — Bruit
- id: e-entretien-dechets
  question: Que fait-on des huiles usagées, batteries et pneus usés ?
  reponse: On les rapporte en déchetterie ou chez un garagiste ou un distributeur, tenu de les reprendre — pas à la poubelle ni dans la nature.
  explication: Un litre d'huile pollue des milliers de litres d'eau ; les batteries contiennent du plomb et de l'acide. Laver sa voiture en station plutôt que dans la rue évite le rejet d'hydrocarbures dans les eaux pluviales.
  theme: E
  sous_theme: pollution
  source: ADEME — Déchets automobiles
- id: e-ecomobilite-choix
  question: Qu'est-ce que l'écomobilité ?
  reponse: Choisir pour chaque déplacement le mode le moins polluant possible — marche, vélo, transports en commun, covoiturage — et ne prendre la voiture seul que lorsque c'est nécessaire.
  explication: Sur les courtes distances urbaines, le vélo est souvent aussi rapide que la voiture. Autopartage, parcs relais et forfait mobilités durables complètent l'offre.
  theme: E
  sous_theme: ecomobilite
  source: ADEME — Se déplacer autrement
- id: e-covoiturage-voie
  question: Comment reconnaît-on une voie réservée au covoiturage ?
  reponse: Au losange blanc peint au sol ou affiché sur un panneau lumineux ; aux heures indiquées, elle est réservée au covoiturage (au moins deux personnes) et à quelques catégories admises, comme les taxis et les bus.
  explication: Signal déployé depuis 2020 (Lyon, Grenoble, périphérique parisien, A48/A13…). Y circuler sans y avoir droit coûte 135 € ; des caméras comptent les occupants.
  theme: E
  sous_theme: ecomobilite
  source: Code de la route, art. L411-8 ; IISR 9e partie (arrêté du 15 mars 2024) ; paris.fr
- id: e-electrique-avantages
  question: Quels sont l'avantage et la limite principale d'une voiture électrique ?
  reponse: Pas d’émission à l’échappement pendant la conduite ; en revanche, je dois prévoir autonomie et recharge
    selon le trajet.
  explication: Coût, masse et bilan environnemental dépendent du modèle, de l’usage et de la production d’énergie.
    Pneus et freins émettent aussi des particules.
  theme: E
  sous_theme: ecomobilite
  source: ADEME — Car Labelling ; service-public.fr
  tags:
  - revision::v3
  - revision::v3_1
- id: e-ve-recharge
  question: Que faut-il prévoir pour partir loin en voiture électrique ?
  reponse: 'Planifier les recharges : 20 à 40 minutes sur une borne rapide, plusieurs heures sur une prise domestique — et compter une autonomie nettement réduite par temps froid.'
  explication: Le chauffage, la vitesse et le froid font chuter l'autonomie ; on repère la borne suivante avant d'arriver en réserve, les bornes rapides étant surtout implantées sur les grands axes.
  theme: E
  sous_theme: ecomobilite
  importance: utile
  source: service-public.fr ; Code de la route, art. R417-10
- id: e-energies-alternatives
  question: Avant de choisir un véhicule au GPL, au GNV ou à l’hydrogène, que dois-je comparer pour mes trajets
    ?
  reponse: La disponibilité du carburant et des stations, l’autonomie, les coûts et le bilan environnemental de
    la filière.
  explication: Ces énergies ne garantissent pas toutes le même gain de bruit ou d’émissions ; distinguer carburant,
    mode de propulsion et production de l’énergie.
  theme: E
  sous_theme: ecomobilite
  importance: utile
  source: En Voiture Simone — Achat éco-responsable ; service-public.fr F33371
  tags:
  - revision::v3_1
- id: e-e85
  question: Qu'est-ce que le superéthanol E85 ?
  reponse: Un carburant contenant jusqu'à 85 % de bioéthanol, réservé aux véhicules « flex-fuel » ou équipés d'un boîtier homologué ; moins cher au litre, mais davantage consommé.
  explication: À ne pas confondre avec le SP95-E10, qui ne contient que 10 % d'éthanol et convient à la quasi-totalité des essences récentes. En cas d'erreur de carburant, on ne démarre pas et on fait vidanger le réservoir.
  theme: E
  sous_theme: ecomobilite
  importance: utile
  source: En Voiture Simone — Achat éco-responsable ; ADEME
