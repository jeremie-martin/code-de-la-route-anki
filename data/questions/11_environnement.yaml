- id: e-ecoconduite-principes
  question: Quels sont les principes de l'écoconduite ?
  reponse: Anticiper (regarder loin, lever le pied tôt, utiliser le frein moteur), accélérer en douceur, passer les rapports tôt, rouler à vitesse stable et modérée, couper le moteur aux arrêts prolongés, limiter la climatisation et les charges inutiles, entretenir le véhicule.
  explication: 'Gain typique : 10 à 15 % de carburant et moins d''usure des freins — sans rouler plus lentement en moyenne, car on freine moins.'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; securite-routiere.gouv.fr
- id: e-rapports-regime
  question: À quel régime passe-t-on les rapports pour consommer moins ?
  reponse: Vers 2 500 tr/min en essence et 2 000 tr/min en diesel ; on roule sur le rapport le plus élevé possible sans faire peiner le moteur (ex. 4e à 50 km/h en ville).
  explication: Un moteur qui tourne vite consomme et s'use plus ; à l'inverse, un régime trop bas (à-coups) l'abîme. La boîte automatique gère cela seule en mode normal/éco.
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite
- id: e-moteur-arret
  question: À partir de quelle durée d'arrêt vaut-il mieux couper le moteur ?
  reponse: Dès que l'arrêt dépasse environ 20 à 30 secondes (barrière, livraison, attente) — c'est ce que fait automatiquement le Stop & Start.
  explication: Un moteur au ralenti consomme (0,5 à 1 L/h) et pollue pour rien ; le redémarrage coûte moins que 20 s de ralenti. Laisser tourner le moteur d'un véhicule à l'arrêt sans nécessité est d'ailleurs interdit.
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; arrêté du 12 novembre 1963 (moteur tournant à l'arrêt)
- id: e-climatisation-conso
  question: Quel est l'effet de la climatisation sur la consommation ?
  reponse: Une surconsommation de l'ordre de 10 à 20 % en ville (jusqu'à 30 % sur les petits moteurs), moins sur route ; à grande vitesse, elle consomme moins que les fenêtres ouvertes (aérodynamique).
  explication: 'Bon usage : régler à ~5 °C sous la température extérieure, ventiler avant de l''allumer, l''entretenir (elle sert aussi à désembuer).'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — La climatisation
- id: e-vitesse-conso
  question: Sur autoroute, que gagne-t-on à rouler à 120 ou 110 km/h plutôt qu'à 130 ?
  reponse: Environ 10 % de carburant à 120 et 20 à 25 % à 110, pour quelques minutes de plus sur 100 km (≈ 4 min à 120).
  explication: 'La résistance de l''air augmente avec le carré de la vitesse : c''est le premier levier d''économie sur route. Rouler à vitesse stable (régulateur sur route plate) évite les accélérations coûteuses.'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite
- id: e-pneus-conso
  question: Quel est l'effet de pneus sous-gonflés sur la consommation et la sécurité ?
  reponse: Surconsommation (≈ +2 à 5 % pour −0,5 bar), usure accélérée et surtout risque d'échauffement et d'éclatement, distance de freinage allongée.
  explication: On vérifie la pression à froid une fois par mois et avant un long trajet, en ajoutant 0,2-0,3 bar si le véhicule est chargé.
  theme: E
  sous_theme: ecoconduite
  source: ADEME ; securite-routiere.gouv.fr — Les pneus
- id: e-frein-moteur
  question: Qu'est-ce que le frein moteur et pourquoi l'utiliser ?
  reponse: 'Le ralentissement obtenu en levant le pied de l''accélérateur avec un rapport engagé (sans débrayer) : consommation quasi nulle (injection coupée), freins ménagés, meilleure stabilité — indispensable en descente.'
  explication: 'Rouler au point mort (« en roue libre ») est dangereux et n''économise rien sur un moteur à injection. En descente longue : rapport inférieur + freinage par intermittence (question officielle 2023, Q18).'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Écoconduite ; Sécurité routière — Exemples de nouvelles questions (Q18)
- id: e-trajets-courts
  question: Pourquoi les trajets courts (< 3 km) sont-ils les plus polluants au kilomètre ?
  reponse: Le moteur froid consomme jusqu'à 50 % de plus et le catalyseur, inefficace tant qu'il n'est pas chaud, laisse passer les polluants ; les premiers kilomètres se font donc idéalement à pied, à vélo ou en transports en commun.
  explication: 'Inutile de faire chauffer le moteur à l''arrêt : on part doucement et il chauffe en roulant.'
  theme: E
  sous_theme: ecoconduite
  source: ADEME — Se déplacer autrement
- id: e-polluants
  question: Quels sont les principaux polluants émis par un véhicule thermique ?
  reponse: Le CO₂ (gaz à effet de serre, proportionnel au carburant brûlé), les oxydes d'azote NOx (surtout diesel), les particules fines (échappement mais aussi freins et pneus), le monoxyde de carbone CO et les hydrocarbures imbrûlés.
  explication: Les particules et NOx nuisent à la santé (asthme, maladies cardio-vasculaires) ; le CO₂ au climat. Les véhicules électriques n'émettent pas de gaz d'échappement mais produisent des particules d'usure.
  theme: E
  sous_theme: pollution
  source: ADEME ; Ministère de la Transition écologique — Qualité de l'air
- id: e-critair-classes
  question: Que classe la vignette Crit'Air, et combien y a-t-il de catégories ?
  reponse: 'Le niveau d''émissions polluantes du véhicule selon sa motorisation et sa date de mise en circulation : Crit''Air 0 (vert, électrique/hydrogène), 1 (violet : essence Euro 5-6, hybrides rechargeables, gaz), 2 (jaune), 3 (orange), 4 (bordeaux), 5 (gris) — plus les non classés (les plus anciens).'
  explication: 'Obligatoire pour circuler dans les ZFE et lors des pics de pollution (circulation différenciée) ; elle se commande en ligne (3,85 € en 2026, frais d''envoi inclus) et se colle sur le pare-brise. Absence de vignette dans une ZFE : 68 €.'
  theme: E
  sous_theme: pollution
  source: certificat-air.gouv.fr ; service-public.fr — Vignette Crit'Air
- id: e-zfe-definition
  question: Qu'est-ce qu'une ZFE (zone à faibles émissions mobilité) ?
  reponse: Une zone urbaine, délimitée par des panneaux, où la circulation (et parfois le stationnement) des véhicules les plus polluants est interdite, de façon permanente ou à certaines heures, selon leur vignette Crit'Air.
  explication: 'Les restrictions varient selon la métropole et l''année ; l''entrée est signalée par un panneau spécifique (B56) avec panonceau indiquant les Crit''Air interdits. Le Parlement avait voté leur suppression en 2025, censurée par le Conseil constitutionnel le 21 mai 2026 : les ZFE restent en vigueur ; les cartes et règles locales sont à vérifier avant un trajet.'
  theme: E
  sous_theme: pollution
  source: Code général des collectivités territoriales, art. L2213-4-1 ; service-public.fr — ZFE
- id: e-pic-pollution
  question: Que se passe-t-il lors d'un pic de pollution ?
  reponse: 'Le préfet peut abaisser les vitesses maximales (généralement de 20 km/h : 110 → 90, 90 → 70, 80 → 70), instaurer la circulation différenciée (seules certaines vignettes Crit''Air circulent), rendre gratuits ou moins chers les transports en commun et le stationnement résidentiel.'
  explication: Les mesures sont annoncées par les panneaux à messages variables, la radio et les médias ; leur non-respect est sanctionné (68 €).
  theme: E
  sous_theme: pollution
  source: Arrêté interpréfectoral (Île-de-France) ; service-public.fr — Pic de pollution
- id: e-bruit-sources
  question: Quelles sont les sources de bruit routier que le conducteur peut limiter ?
  reponse: Le klaxon (interdit hors danger immédiat), un échappement modifié ou défectueux, les accélérations brutales et les hauts régimes, la musique à volume élevé fenêtres ouvertes, le claquement de portières la nuit.
  explication: Le bruit est une nuisance sanitaire (sommeil, stress) ; un échappement non conforme est sanctionné (135 €) et peut entraîner l'immobilisation du véhicule. Radars sonores expérimentés depuis 2022.
  theme: E
  sous_theme: bruit
  source: Code de la route, art. R318-3 et R416-1 ; ADEME — Bruit
- id: e-entretien-dechets
  question: Que fait-on des huiles usagées, batteries et pneus usés ?
  reponse: 'On les rapporte en déchetterie ou chez un garagiste/distributeur (reprise obligatoire) : jamais à la poubelle, dans l''évier ou dans la nature.'
  explication: Un litre d'huile pollue des milliers de litres d'eau ; les batteries contiennent du plomb et de l'acide. Laver sa voiture en station plutôt que dans la rue évite le rejet d'hydrocarbures dans les eaux pluviales.
  theme: E
  sous_theme: pollution
  source: ADEME — Déchets automobiles
- id: e-ecomobilite-choix
  question: Qu'est-ce que l'écomobilité ?
  reponse: 'Choisir pour chaque trajet le mode de déplacement le moins polluant possible : marche, vélo (ou VAE), transports en commun, train, covoiturage, autopartage — et n''utiliser la voiture seul que quand c''est nécessaire.'
  explication: En France, la moitié des trajets en voiture font moins de 5 km. Le vélo est souvent le plus rapide en ville sur ces distances.
  theme: E
  sous_theme: ecomobilite
  source: ADEME — Se déplacer autrement
- id: e-covoiturage-voie
  question: Comment reconnaît-on une voie réservée au covoiturage, et qui peut l'emprunter ?
  reponse: 'Par le losange blanc (panneau et marquage au sol), parfois activé seulement à certaines heures : véhicules avec au moins 2 occupants, taxis, transports en commun, véhicules à très faibles émissions (Crit''Air 0).'
  explication: Signal déployé depuis 2020 (Lyon, Grenoble, Paris périphérique, A48/A13…). Y circuler seul est sanctionné (135 €) ; des caméras comptent les occupants.
  theme: E
  sous_theme: ecomobilite
  source: Code de la route, art. L411-8 ; IISR 9e partie (signalisation dynamique, arrêté du 15 mars 2024) ; paris.fr
- id: e-motorisations
  question: Quels avantages et limites des principales motorisations alternatives ?
  reponse: 'Électrique : zéro émission à l''échappement, silencieuse (danger pour les piétons), autonomie et recharge à planifier, lourde. Hybride : consommation réduite en ville. GPL/GNV : moins de particules et de NOx, réseau limité. Hydrogène : rare. E85 : essence contenant jusqu''à 85 % de bioéthanol, véhicule ou boîtier compatible.'
  explication: Un véhicule électrique doit émettre un son artificiel à basse vitesse (< 20 km/h) depuis 2021 pour être entendu des piétons. Le choix d'un véhicule se fait aussi selon son étiquette énergie/CO₂ (malus au-delà d'un seuil de CO₂ fixé chaque année).
  theme: E
  sous_theme: ecomobilite
  importance: utile
  source: ADEME — Car Labelling ; règlement (UE) 540/2014 (AVAS)
- id: e-ve-recharge
  question: Quelles précautions avec un véhicule électrique ?
  reponse: Planifier les recharges (bornes, temps de charge de 30 min en rapide à plusieurs heures à domicile), adapter sa conduite au silence du véhicule près des piétons, et tenir compte de son poids (freinage) ; le freinage régénératif ralentit dès qu'on lève le pied.
  explication: 'Une place de recharge est réservée aux véhicules en charge : y stationner sans recharger est un stationnement gênant (35 €, R417-10), avec mise en fourrière possible.'
  theme: E
  sous_theme: ecomobilite
  importance: utile
  source: service-public.fr ; Code de la route, art. R417-10
