- id: e-feu-rouge-anticipation
  question: Le feu passe au rouge à une centaine de mètres devant moi. Que fais-je de mon allure ?
  reponse: 'Je lève le pied tout de suite, rapport adapté : j’anticipe l’arrêt, je ménage les freins et j’évite une accélération
    inutile.'
  explication: 'Rapport engagé, pied levé, l’injection est généralement coupée : la consommation peut tomber à zéro. Arriver
    vite puis freiner fort gaspille l’énergie déjà payée ; en arrivant lentement, le feu est souvent repassé au vert avant
    que je m’arrête.'
  theme: E
  sous_theme: ecoconduite
  source: "ADEME, https://agirpourlatransition.ademe.fr/particuliers/economiser/carburant/ecoconduite-solution-consommer-moins-carburant-limiter-emissions-co2"
- id: e-vitesse-consommation
  question: Sur autoroute, pourquoi rouler à 110 plutôt qu’à 130 km/h réduit-il nettement la consommation, pour un temps de trajet à peine allongé ?
  reponse: 'La résistance de l’air croît avec le carré de la vitesse : à allure élevée, elle absorbe l’essentiel de l’énergie, et quelques km/h de moins la réduisent fortement.'
  explication: Le gain relatif dépend du véhicule, du vent et de la charge ; le temps perdu reste de quelques minutes sur un long trajet. Les mêmes mécanismes expliquent la surconsommation d’un coffre de toit ou de vitres ouvertes à grande vitesse.
  theme: E
  sous_theme: ecoconduite
  source: "Ministère de la Transition écologique, « Économies d’énergie : le vrai du faux » ; ADEME, écoconduite"
- id: e-rapports-regime
  question: En montée, le moteur peine après un passage au rapport supérieur pour économiser du carburant.
    Que fais-je ?
  reponse: Je rétrograde pour retrouver une reprise suffisante. Éviter le sur-régime ne signifie pas faire peiner le moteur.
  explication: Passer les rapports assez tôt lorsque les conditions le permettent, sans à-coups. Le bon rapport dépend
    du moteur, de la charge et de la pente ; l’indicateur de changement de rapport est une aide, pas un ordre prioritaire sur la situation.
  theme: E
  sous_theme: ecoconduite
  source: "Notice Kia, fonctionnement économique, https://ownersmanual.kia.com/docview/webhelp/doc/e654660e-4668-4ece-9479-cacf1bc87727/topics/chapter6_23.html"
- id: e-moteur-arret
  question: Les barrières d'un passage à niveau viennent de se fermer devant moi. Que fais-je du moteur ?
  reponse: Je le coupe pendant cet arrêt prolongé, ou je laisse agir le Stop & Start.
  explication: Le ralenti consomme sans faire avancer. Je garde les fonctions nécessaires à la sécurité (feux,
    désembuage) ; il n’y a pas de compte à rebours universel à appliquer à chaque arrêt dans la circulation.
  theme: E
  sous_theme: ecoconduite
  source: "ADEME, https://agirpourlatransition.ademe.fr/particuliers/economiser/carburant/ecoconduite-solution-consommer-moins-carburant-limiter-emissions-co2"
- id: e-frein-moteur
  question: Qu'est-ce que le frein moteur et pourquoi l'utiliser ?
  reponse: 'Le ralentissement obtenu en relâchant l’accélérateur avec un rapport engagé : il maîtrise l’allure et limite l’échauffement
    des freins en descente.'
  explication: 'Sur la plupart des moteurs à injection, l’alimentation est coupée en décélération avec un rapport
    engagé : la consommation peut tomber à zéro, alors qu’au point mort le moteur tourne au ralenti. Une électrique
    récupère de l’énergie de la même façon.'
  theme: E
  sous_theme: ecoconduite
  source: "ADEME, https://agirpourlatransition.ademe.fr/particuliers/economiser/carburant/ecoconduite-solution-consommer-moins-carburant-limiter-emissions-co2"
- id: e-climatisation-conso
  question: Ma voiture a stationné en plein soleil ; l’habitacle est brûlant. Que fais-je avant de compter sur la climatisation
    ?
  reponse: J’aère d’abord, portières ou vitres ouvertes quelques instants, pour évacuer l’air surchauffé ; puis je roule
    vitres fermées avec une climatisation modérée.
  explication: La climatisation n’a plus à refroidir l’air accumulé. Refroidir plus que nécessaire consomme de l’énergie
    ; garder un confort thermique compatible avec la vigilance. En ville, à faible allure, vitres ouvertes peuvent consommer
    moins.
  theme: E
  sous_theme: ecoconduite
  source: "ADEME, https://agirpourlatransition.ademe.fr/particuliers/economiser/carburant/ecoconduite-solution-consommer-moins-carburant-limiter-emissions-co2 ; notice Renault Captur, Air conditionné, https://www.user-manual.renault.com/sites/renault/files/Captur-1238-6_FRA.pdf"
- id: e-surconsommations-causes
  question: En dehors de ma façon de conduire, quels facteurs liés au véhicule augmentent la consommation ?
  reponse: La climatisation utilisée sans besoin, les accessoires de toit (résistance à l’air), une charge inutile et des
    pneus sous-gonflés.
  explication: 'Trois mécanismes : résistance à l’air, masse, résistance au roulement ; la climatisation ajoute une charge
    au moteur. Garder le désembuage nécessaire à la visibilité.'
  theme: E
  sous_theme: ecoconduite
  source: "ADEME ; Codeclic, Conduite économique ; Ornikar, Conduite écologique"
- id: e-polluant-co2
  question: Quelle différence d’effet entre le CO₂ et les autres polluants d’un véhicule (NOx, particules) ?
  reponse: Le CO₂ contribue au réchauffement climatique ; NOx et particules dégradent l’air respiré. Réduire l’un ne supprime
    pas les autres.
  explication: Pour un carburant donné, le CO₂ à l’échappement dépend de la quantité brûlée. Un filtre à particules ne piège
    pas ce gaz. Ne pas en déduire que le CO₂ serait inoffensif à toute concentration.
  theme: E
  sous_theme: pollution
  source: "ADEME, https://agirpourlatransition.ademe.fr/particuliers/economiser/carburant/ecoconduite-solution-consommer-moins-carburant-limiter-emissions-co2"
- id: e-particules-usure
  question: En dehors de l'échappement, d'où viennent les particules fines émises par une voiture ?
  reponse: De l’usure des freins, des pneus et de la chaussée, ainsi que de la remise en suspension des dépôts.
  explication: Même sans échappement, une voiture peut émettre des particules. Les proportions dépendent du périmètre étudié
    ; la décision utile est de limiter les trajets, accélérations et freinages inutiles.
  theme: E
  sous_theme: pollution
  source: "ADEME ; En Voiture Simone, Achat éco-responsable"
- id: e-critair-classes
  question: Sur quoi repose la classe Crit'Air d'un véhicule ?
  reponse: Sur la catégorie du véhicule, sa motorisation et sa norme Euro, ou à défaut sa date de première immatriculation.
  explication: La norme Euro et la date ne sont pas interchangeables dans tous les cas. Utiliser les données de la carte grise
    et le simulateur officiel ; Crit’Air ne mesure pas la consommation réelle.
  theme: E
  sous_theme: pollution
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F33371"
  illustration:
    gen: critair
    legende: Les six vignettes, de la classe E (électrique, hydrogène) à la classe 5.
- id: e-zfe-definition
  question: Qu'est-ce qu'une ZFE (zone à faibles émissions mobilité) ?
  reponse: Une zone urbaine délimitée par des panneaux où les véhicules les plus polluants (selon leur vignette Crit’Air)
    ne peuvent pas circuler, en permanence ou à certaines heures.
  explication: 'Je vérifie les règles locales avant un trajet : elles varient selon la ville et la date. Le panneau d’entrée de zone et son panonceau précisent les véhicules concernés, les vignettes Crit’Air admises et les horaires.'
  theme: E
  sous_theme: pollution
  source: Code général des collectivités territoriales, art. L2213-4-1 ; service-public.fr F33371
  comparaisons:
  - ref: b56
    legende: Entrée d’une zone à faibles émissions.
  - ref: m11d
    legende: 'Panonceau : véhicules et vignettes admis, horaires.'
- id: e-pic-pollution
  question: Que peut décider le préfet lors d'un épisode de pollution ?
  reponse: Restreindre la circulation selon les vignettes Crit'Air, abaisser les vitesses maximales (souvent de 20
    km/h) ou dévier les poids lourds, par arrêté local.
  explication: Les mesures sont annoncées par les préfectures et les panneaux à messages variables ; les vitesses
    et les catégories admises dépendent de l'arrêté du jour.
  theme: E
  sous_theme: pollution
  source: "service-public.fr, Pic de pollution ; arrêtés préfectoraux"
- id: e-bruit-sources
  question: Quelles nuisances sonores un conducteur peut-il éviter ?
  reponse: Les coups de klaxon inutiles, un échappement défectueux ou modifié et les accélérations bruyantes.
  explication: En agglomération, le klaxon se limite au danger immédiat ; hors agglomération, aux avertissements nécessaires.
    La nuit, privilégier les signaux lumineux, sauf nécessité absolue.
  theme: E
  sous_theme: bruit
  source: Code de la route, R416-1 et R416-2
- id: e-entretien-dechets
  question: Que fait-on des huiles usagées, batteries et pneus usés ?
  reponse: En déchetterie, ou chez un garagiste ou un distributeur tenu de les reprendre ; jamais à la poubelle ni dans la
    nature.
  explication: Un litre d'huile pollue des milliers de litres d'eau ; les batteries contiennent du plomb et de l'acide. Laver
    sa voiture en station plutôt que dans la rue évite le rejet d'hydrocarbures dans les eaux pluviales.
  theme: E
  sous_theme: pollution
  source: "ADEME, Déchets automobiles"
- id: e-ecomobilite-choix
  question: Qu'est-ce que l'écomobilité ?
  reponse: Choisir pour chaque déplacement le mode le moins polluant (marche, vélo, transports en commun, covoiturage) et
    ne prendre la voiture seul que si nécessaire.
  explication: Sur les courtes distances urbaines, le vélo est souvent aussi rapide que la voiture. Autopartage, parcs relais
    et forfait mobilités durables complètent l'offre.
  theme: E
  sous_theme: ecomobilite
  source: "ADEME, Se déplacer autrement"
- id: e-ve-recharge
  question: Que faut-il prévoir pour partir loin en voiture électrique ?
  reponse: 'Les bornes compatibles sur le trajet, leur puissance, le temps de recharge et une marge d''autonomie :
    le froid, la vitesse et le chauffage réduisent l''autonomie.'
  explication: Sur borne rapide, une recharge de 20 à 80 % prend souvent 20 à 40 minutes ; à domicile, plusieurs heures.
    Le chiffre dépend du véhicule et de la borne.
  theme: E
  sous_theme: ecomobilite
  source: service-public.fr ; Code de la route, art. R417-10
- id: e-energies-alternatives
  question: À l’usage, une voiture à hydrogène ne rejette que de la vapeur d’eau. Où se situe alors l’essentiel de son impact
    environnemental ?
  reponse: Dans la production de l’hydrogène, qui consomme beaucoup d’énergie.
  explication: GPL et GNV émettent moins de particules. Pour toutes ces filières, comparer aussi les stations disponibles,
    l’autonomie et les coûts. Distinguer carburant, propulsion et production de l’énergie.
  theme: E
  sous_theme: ecomobilite
  source: "En Voiture Simone, Achat éco-responsable ; service-public.fr F33371"
- id: e-e85
  question: Qu'est-ce que le superéthanol E85 ?
  reponse: Un carburant contenant jusqu’à 85 % de bioéthanol, réservé aux véhicules flex-fuel ou à boîtier homologué ; moins
    cher au litre, davantage consommé.
  explication: À ne pas confondre avec le SP95-E10, qui ne contient que 10 % d'éthanol et convient à la quasi-totalité des
    essences récentes. En cas d'erreur de carburant, on ne démarre pas et on fait vidanger le réservoir.
  theme: E
  sous_theme: ecomobilite
  source: "En Voiture Simone, Achat éco-responsable ; ADEME"
