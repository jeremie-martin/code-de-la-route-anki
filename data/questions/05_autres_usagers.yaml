- id: u-pieton-hors-passage
  question: Hors intersection, sans feu ni agent, un piéton s’engage perpendiculairement pour traverser.
    Le passage le plus proche est à 100 m ; nous nous voyons et je peux m’arrêter sans danger. Dois-je céder ?
  reponse: Oui, je le laisse traverser ; sa priorité ne dépend pas de la présence de bandes au sol.
  explication: >-
    L’absence de passage à moins de 50 m ne suffit pas à elle seule : visibilité, distances,
    vitesses et emplacement de la traversée comptent aussi. Même devant un piéton en infraction,
    je ralentis et évite de le mettre en danger.
  theme: U
  sous_theme: pietons
  source: "Code de la route, R412-37 à R412-39, R412-6 et R415-11, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037411323"
- id: u-pieton-canne-blanche
  question: Un piéton avec une canne blanche attend au bord de la chaussée. Que fais-je ?
  reponse: 'Je m’arrête et le laisse traverser, sans klaxonner : une personne malvoyante se repère au son et ne peut pas juger
    si je m’arrête.'
  explication: 'Même réflexe pour une personne en fauteuil, avec une poussette ou un déambulateur : anticiper, ralentir, laisser
    passer. Prudence accrue envers les usagers vulnérables (R412-6).'
  theme: U
  sous_theme: pietons
  source: "Code de la route, art. R412-6 et R415-11 ; securite-routiere.gouv.fr, Piétons"
- id: u-fausse-courtoisie-pieton
  question: Mon feu est vert ; un piéton attend au bord, son signal est rouge. Un véhicule me suit de près. Que
    fais-je ?
  reponse: 'Je passe normalement, en surveillant le piéton : m’arrêter sans que rien ne l’impose le mettrait en danger,
    ainsi que celui qui me suit.'
  explication: Le piéton s’engagerait en confiance sans voir le véhicule qui me dépasse ou me percute ; le suiveur
    ne comprend pas mon arrêt. Je cède le passage au piéton engagé ou qui manifeste l’intention de traverser là
    où il en a le droit (R415-11), pas par courtoisie.
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R412-30 et R415-11 ; REMC (fausse courtoisie)
- id: u-pieton-hors-agglo-cote
  question: Je suis piéton, hors agglomération, sans trottoir ni accotement praticable. De quel côté de la chaussée dois-je
    marcher ?
  reponse: Près du bord gauche, face aux véhicules, sauf danger particulier ; en fauteuil roulant ou en poussant un vélo,
    on tient la droite.
  explication: "Un cortège, un convoi ou une procession marche à droite, en laissant libre toute la moitié gauche (R412-42). La nuit, les vêtements clairs ou le gilet réfléchissant sont recommandés pour un piéton, mais ne sont pas obligatoires."
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R412-36 et R412-42
- id: u-zone-rencontre-pietons
  question: Je passe ce panneau ; un piéton marche au milieu de la chaussée devant moi. Que fais-je ?
  reponse: 'Je le suis à son allure, sans klaxonner : en zone de rencontre (20 km/h maximum), les piétons circulent sur toute
    la chaussée et ont priorité sur les véhicules.'
  explication: Dans l’aire piétonne, les véhicules autorisés pour la desserte roulent à l’allure du pas. Dans une zone 30, les priorités habituelles s’appliquent et les piétons utilisent les passages lorsqu’ils y sont tenus. Le double sens cyclable est la règle par défaut en zone 30 et en zone de rencontre.
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R110-2 et R415-11
  image_ref: b52
  comparaisons:
  - ref: b54
    legende: 'Aire piétonne : seuls les véhicules de desserte et les cycles, au pas.'
- id: u-enfants-sortie-ecole
  question: Un car de transport d'enfants (pictogramme enfants) est arrêté devant moi, feux de détresse allumés. Que fais-je
    ?
  reponse: 'Je réduis fortement ma vitesse, prêt à m’arrêter : des enfants peuvent surgir devant ou derrière le car ; je ne
    le dépasse qu’à très faible allure.'
  explication: 'R413-17 III 3° : vitesse réduite au croisement ou au dépassement d''un transport d''enfants pendant la montée
    ou la descente. Les feux de détresse du car sont le signal.'
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R413-17 ; arrêté du 2 juillet 1982 (transports d'enfants)
- id: u-fauteuil-roulant-chaussee
  question: Hors agglomération, une personne en fauteuil roulant circule sur la chaussée devant moi, près du bord droit. Que
    fais-je ?
  reponse: 'Je ralentis et la dépasse avec au moins 1,50 m (1 m en agglomération) : assimilée à un piéton, elle peut circuler
    sur la chaussée, à droite.'
  explication: 'R412-35 : les personnes en fauteuil roulant peuvent « dans tous les cas » circuler sur la chaussée ; R412-36
    : près du bord droit. Vitesse réduite au dépassement d''un piéton (R413-17).'
  theme: U
  sous_theme: pietons
  source: Code de la route, art. R412-34, R412-35, R412-36 et R414-4
- id: u-cyclistes-de-front
  question: De jour, sur route, deux cyclistes roulent de front devant moi et j'annonce mon intention de les dépasser. Que
    doivent-ils faire ?
  reponse: 'Se remettre en file simple : rouler de front est permis, mais la file simple s’impose dès qu’un véhicule annonce
    son dépassement ou à la nuit tombée.'
  explication: 'Exceptions : aires piétonnes, zones de rencontre et voies vertes (décret 2024-1074). Même en file, je garde
    1,50 m hors agglomération et je ne les serre pas.'
  theme: U
  sous_theme: cyclistes
  source: Code de la route, art. R431-7 et R414-4
- id: u-cycliste-tourner-droite
  image: {gen: cycliste_tourne_droite, width: 960}
  question: Je veux tourner à droite. Le cycliste arrive à ma hauteur et poursuit tout droit sur la piste ; aucun feu ni panneau ne règle la priorité. Qui doit attendre ?
  reponse: "Moi. Je laisse passer le cycliste avant de tourner : je vais couper la piste sur laquelle il circule."
  explication: Je contrôle le rétroviseur droit et l’angle mort avant de tourner. Le cycliste arrive à ma hauteur, mais cela ne me donne pas priorité pour traverser sa piste. La flèche près de ma voiture indique mon intention, pas une priorité.
  theme: U
  sous_theme: cyclistes
  source: "Code de la route, art. R415-3 III : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000039278135 ; R415-14"

- id: u-cycliste-bras-gauche
  question: Devant moi, en ville, un cycliste tend le bras gauche. Que fais-je ?
  reponse: 'Je ralentis et je le laisse se déporter et tourner, sans le dépasser par la gauche : le bras tendu annonce son
    changement de direction.'
  explication: 'Un regard par-dessus l''épaule gauche annonce la même chose. R414-6 II 1° : un usager qui a signalé qu''il
    se porte à gauche se dépasse par la droite, jamais par la gauche ; dans le doute, j''attends.'
  theme: U
  sous_theme: cyclistes
  source: "Code de la route, art. R412-10 et R414-6 ; En Voiture Simone, Les vélos"
- id: u-double-sens-cyclable
  question: Ces panneaux sont placés à l’autre entrée de la rue où je circule. Quel usager puis-je rencontrer en face ?
  reponse: 'Des cyclistes qui arrivent en face dans cette rue à sens unique (double-sens cyclable) : je me tiens à droite
    et je vérifie avant de tourner.'
  explication: Le double-sens cyclable est la règle par défaut dans les zones 30 et zones de rencontre, même sans panonceau
    ; il vaut aussi pour les trottinettes électriques.
  theme: U
  sous_theme: cyclistes
  source: Code de la route, art. R412-28-1 et R110-2
  image:
    gen: support_panneaux
    params:
      signs:
      - kind: sign
        file: France road sign B1.svg
        w: 120
      - kind: sign
        file: France road sign M9v1.svg
        w: 120
- id: u-edpm-ou-circuler
  question: Je suis en trottinette électrique, en agglomération, sur une avenue limitée à 50 km/h sans piste ni bande cyclable.
    Où dois-je rouler ?
  reponse: Sur la chaussée (limitée à 50 km/h au plus), en tenant ma droite, faute d’aménagement cyclable ; le trottoir n’est
    admis que sur autorisation locale, au pas.
  explication: 'Trottoir : seulement sur autorisation du maire, à l''allure du pas ; sinon je descends et je la pousse (je
    deviens piéton). Circuler hors des voies autorisées : 135 €.'
  theme: U
  sous_theme: edpm
  source: Code de la route, art. R412-43-1 ; service-public.fr F308
- id: u-edpm-pieton-ou-vehicule
  question: À une intersection sans signalisation, une trottinette électrique arrive à ma droite. Qui passe ?
  reponse: 'Elle : un EDPM est un véhicule soumis aux règles de priorité, pas un piéton, contrairement aux rollers, skates et trottinettes sans moteur.'
  explication: 'Un EDPM respecte aussi les feux et les sens interdits. Pour l''automobiliste : 1 m / 1,50 m au dépassement,
    prudence accrue (faible gabarit, équilibre précaire).'
  theme: U
  sous_theme: edpm
  source: Code de la route, art. R311-1, R412-34 et R415-5
- id: u-moto-vulnerabilite
  question: Je vais tourner à gauche ; une moto arrive en face, elle me semble encore loin. Que fais-je ?
  reponse: Je vérifie sa vitesse et sa distance sans me fier à sa petite silhouette ; en cas de doute sur le créneau, j’attends
    qu’elle passe.
  explication: Le gabarit étroit peut fausser l’appréciation. Une moto en face a la priorité sur mon virage à gauche ; une
    distance réellement suffisante reste nécessaire pour tourner sans la gêner.
  theme: U
  sous_theme: motos
  source: "securite-routiere.gouv.fr, Être visible à moto ; Code de la route, art. R415-4"
- id: u-interfiles
  question: 'Autoroute embouteillée, files ininterrompues : une moto remonte entre ma file et celle de gauche. Que fais-je ?'
  reponse: 'Je reste dans ma file en gardant l’espace latéral, et je contrôle rétroviseurs et angle mort avant tout changement
    de file : l’inter-files est légale ici.'
  explication: 'Décret 2025-33, en vigueur le 11 janvier 2025 : motos et tricycles d’au plus 1 m de large, autoroutes et routes à chaussées séparées ≥ 70 km/h, circulation dense, 50 km/h maximum (30 si une file est arrêtée).'
  theme: U
  sous_theme: motos
  source: Code de la route, art. R412-11-3 (décret n° 2025-33 du 9 janvier 2025)
