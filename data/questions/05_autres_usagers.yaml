        occludes: true
- id: u-matieres-dangereuses
  question: Que signifie cette plaque à l’arrière du camion, et qu’est-ce que cela change pour moi ?
  reponse: 'Il transporte des matières dangereuses : distance de sécurité accrue ; en cas d’accident, je n’approche pas et
    je signale la plaque aux secours.'
  explication: Sur la plaque orange numérotée, le haut renseigne le danger et le bas identifie la matière. Les losanges précisent le risque, par exemple inflammable ou toxique. Certaines routes ou certains tunnels sont interdits à ces transports ; je lis leur signalisation.
  theme: U
  sous_theme: poids_lourds
  source: Accord ADR ; IISR (B18)
  image:
    gen: plaque_orange
- id: u-tram-depasser
  question: Un tramway est arrêté à sa station et des voyageurs descendent de mon côté. Que fais-je ?
  reponse: 'Je m''arrête et j''attends : on ne dépasse pas un tramway à l''arrêt du côté où les voyageurs montent
    ou descendent.'
  explication: En marche, un tramway se dépasse par la droite si l'intervalle jusqu'au bord de la chaussée suffit ; par la gauche seulement sur une chaussée à sens unique ou si la moitié gauche de la chaussée reste libre (R414-6 II 2°). Le tram ne peut ni dévier ni freiner court.
  theme: U
  sous_theme: transports_commun
  source: Code de la route, art. R414-13 et R414-6
- id: u-voie-bus
  question: Avenue avec une voie « BUS » à ma droite ; je veux tourner à droite au prochain carrefour. Comment procéder
    ?
  reponse: 'Je reste sur ma voie et je n’entre dans la voie bus que là où sa ligne devient discontinue, juste avant le carrefour, en cédant aux bus : ailleurs, elle est interdite aux autres véhicules.'
  explication: 'S''y arrêter ou stationner : très gênant, 135 €. Un damier blanc au sol marque la traversée d''une voie bus
    à un carrefour.'
  theme: U
  sous_theme: transports_commun
  source: Code de la route, art. R412-7 et R417-11
  comparaisons:
  - ref: marq-couloir-bus
    legende: 'Couloir bus : ligne large et inscription au sol.'
  - ref: marq-damier-blanc
    legende: 'Damier : endroit où traverser la voie bus au carrefour.'
- id: u-vehicule-prioritaire-feu-rouge
  question: Arrêté au feu rouge, j'entends la sirène deux tons d'une ambulance du SAMU qui arrive derrière moi, gyrophare
    allumé. Que fais-je ?
  reponse: 'Je dégage le passage sans me mettre en danger : rangé sur le côté ou, si c’est le seul moyen, en franchissant
    le feu au pas, très prudemment.'
  explication: 'R415-12 : céder « en toutes circonstances » aux véhicules d''intérêt général prioritaires qui annoncent leur
    approche (refus : 135 €, 4 points). Jamais de manœuvre dangereuse pour les piétons.'
  theme: U
  sous_theme: vehicules_prioritaires
  source: "Code de la route, art. R415-12 ; securite-routiere.gouv.fr, Info/intox"
- id: u-ambulance-trois-tons
  question: Une ambulance de transport sanitaire arrive derrière moi, feux bleus à éclats et avertisseur trois tons en marche. Dois-je lui céder la priorité comme à des pompiers ?
  reponse: 'Non : elle bénéficie de facilités de passage, pas de la priorité. Je lui facilite le passage si je peux le faire sans danger.'
  explication: 'Deux tons, avec feux tournants : véhicule prioritaire, à qui je cède en toutes circonstances (R415-12). Trois tons : facilités de passage (R313-27, R313-34) ; je m''écarte ou je ralentis quand c''est sans danger, sans lui devoir la priorité à une intersection. Le mot « ambulance » ne suffit pas : l''avertisseur renseigne. Aucune manœuvre dangereuse.'
  theme: U
  sous_theme: vehicules_prioritaires
  source: Code de la route, art. R311-1, R313-27, R313-34 et R415-12
- id: u-gyrophare-orange
  question: Un véhicule avec un gyrophare orange (dépanneuse, engin agricole, engin de chantier) approche. Que signale ce gyrophare ?
  reponse: Un véhicule lent, encombrant ou en intervention, donc un danger à contourner prudemment ; il n'est pas
    prioritaire.
  explication: 'Gyrophare bleu + deux tons = prioritaire, on cède. Feux bleus à éclats + trois tons = facilités de passage (ambulance de transport sanitaire, par exemple), on facilite sans lui devoir la priorité. Exception au gyrophare orange : l’engin de service hivernal en action bénéficie de facilités de passage.'
  theme: U
  sous_theme: vehicules_prioritaires
  source: Code de la route, art. R313-27 et R313-28
- id: u-corridor-securite
  image: {gen: corridor_securite, width: 960}
  question: Sur autoroute, la dépanneuse est arrêtée, gyrophare orange allumé, et la voiture grise reste à ma hauteur. Comment protéger les intervenants ?
  reponse: Je ralentis et m’écarte autant que possible de la dépanneuse en restant dans ma voie. Je ne force pas le passage dans la voie occupée.
  explication: C’est le corridor de sécurité. Si le changement de voie est réalisable sans danger, je dois changer de voie après mes contrôles ; sinon, je garde le plus d’écart possible dans la mienne. Le ralentissement reste nécessaire dans les deux cas.
  theme: U
  sous_theme: vehicules_prioritaires
  source: "Code de la route, art. R412-11-1 et R413-17 : https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006159599"

- id: u-convoi-exceptionnel
  question: 'Un véhicule d’accompagnement « CONVOI EXCEPTIONNEL », gyrophares orange, me fait signe de ralentir : que faire ?'
  reponse: Ralentir, me ranger ou m’arrêter selon ses indications, ne pas m’engager dans l’intersection signalée, et ne dépasser
    le convoi que sur indication de l’accompagnateur.
  explication: 'Ne pas respecter les indications des véhicules de guidage d''un transport exceptionnel : 135 € (R433-2 III). Un convoi ou son accompagnement déjà engagé dans une intersection garde la priorité (R412-33).'
  theme: U
  sous_theme: vehicules_lents_animaux
  source: Code de la route, art. R433-17, R433-2 III et R412-33
- id: u-tracteur-depassement
  question: Un tracteur, gyrophare orange allumé, roule à 25 km/h devant moi sur une route à ligne discontinue, bonne visibilité,
    personne en face. Puis-je le dépasser ?
  reponse: 'Oui : le gyrophare orange signale un véhicule lent, pas une interdiction ; j’annonce mon dépassement en me méfiant
    d’un virage soudain vers un chemin.'
  explication: Un engin agricole est large, sort des champs sans visibilité et laisse de la boue ; ses clignotants sont parfois
    masqués par l'outil attelé.
  theme: U
  sous_theme: vehicules_lents_animaux
  source: "Code de la route, art. R313-28 et R414-4 ; Ornikar, Véhicules lents"
- id: u-cavalier-depassement
  question: Hors agglomération, un cavalier circule au bord droit de la route devant moi. Comment le dépasser ?
  reponse: 'Lentement, avec au moins 1,50 m d’écart (1 m en agglomération), sans klaxonner ni accélérer brusquement : un cheval
    effrayé peut faire un écart.'
  explication: 'R414-4 IV : distance latérale pour un cavalier ou un animal ; R413-17 III 11° : vitesse réduite au croisement
    ou au dépassement d''animaux. Tout animal doit avoir un conducteur (R412-44).'
  theme: U
  sous_theme: vehicules_lents_animaux
  source: Code de la route, art. R414-4, R413-17 et R412-44
- id: u-troupeau-animaux
  question: Sur une route de campagne, un troupeau de vaches conduit par un berger occupe toute la chaussée devant moi. Que
    fais-je ?
  reponse: Je ralentis fortement, m’arrête si nécessaire, sans klaxon ni appel de phares, et j’attends les indications du
    berger pour repartir au pas.
  explication: 'R413-17 III 11° : vitesse réduite au croisement ou au dépassement d''animaux. Un klaxon disperse un troupeau
    et fait paniquer les bêtes ; tout animal doit avoir un conducteur (R412-44).'
  theme: U
  sous_theme: vehicules_lents_animaux
  source: Code de la route, art. R413-17 et R412-44
- id: u-voiturette
  question: Une voiturette (quadricycle léger, sans permis B) roule à 45 km/h devant moi sur une route limitée à 80 km/h.
    Que dois-je en déduire ?
  reponse: 'Qu’elle ne peut pas aller plus vite (45 km/h par construction) et que son conducteur peut n’avoir que 14 ans :
    véhicule lent, dépassement sans forcer.'
  explication: "Une voiturette est interdite sur autoroute et voies rapides. Son conducteur peut manquer d'expérience ou avoir besoin de plus de temps pour réagir. Je lui laisse de la marge."
  theme: U
  sous_theme: vehicules_lents_animaux
  source: "Code de la route, art. R311-1 et R421-2 ; service-public.fr, Permis AM"
- id: u-moto-ecart-chaussee
  question: Le motard qui me précède se déporte brusquement vers le milieu de la voie à l'approche d'une plaque d'égout mouillée.
    Que fais-je ?
  reponse: 'Je garde ma distance sans profiter de l’espace libéré pour le dépasser : un deux-roues doit éviter plaques, gravillons
    et rails, qui le font chuter.'
  explication: 'Un motard « zigzague » pour rester sur une surface adhérente et pour être vu. Le vent latéral et l''appel
    d''air d''un camion le déportent aussi : on ne le serre jamais.'
  theme: U
  sous_theme: motos
  source: "Code en Poche, Les motos ; Code de la route, art. R414-4"
- id: u-pl-insertion-autoroute
  question: Sur autoroute, un poids lourd chargé met son clignotant pour s'insérer depuis une bretelle, à ma hauteur. Que
    fais-je ?
  reponse: Je facilite son insertion si possible, en ajustant mon allure ou en changeant de voie après contrôles, sans créer
    de danger pour autant.
  explication: Le poids lourd reste tenu de céder à l’insertion. Son accélération peut être limitée ; elle n’est pas identique
    pour tous les véhicules et toutes les bretelles.
  theme: U
  sous_theme: poids_lourds
  source: "Code de la route, art. R421-3 ; coursdecode, Les poids lourds"
- id: u-edpm-hors-agglo
  question: Je suis en trottinette électrique et je veux rejoindre le village voisin par une départementale limitée
    à 80 km/h. Est-ce permis ?
  reponse: 'Non : hors agglomération, un EDPM ne circule que sur les voies vertes et les pistes cyclables, sauf autorisation
    locale sur des routes limitées à 80 km/h au plus.'
  explication: 'Avec cette autorisation locale : casque attaché, gilet ou équipement rétro-réfléchissant, éclairage
    complémentaire et feux de position allumés jour et nuit. En agglomération, la chaussée limitée à 50 km/h est autorisée
    à défaut d’aménagement cyclable. Circuler hors des voies permises : 135 €.'
  theme: U
  sous_theme: edpm
  source: Code de la route, art. R412-43-1 II et III ; service-public.fr F308
  comparaisons:
  - ref: c115
    legende: Voie verte.
  - ref: b22a
    legende: Piste ou bande cyclable obligatoire.
- id: u-cycliste-avant-droite
  question: Je vais tourner à droite dans 30 m. Un cycliste roule devant moi, près du bord droit. Que fais-je ?
  reponse: Je reste derrière lui et je tourne après son passage ; le dépasser juste avant de tourner reviendrait à lui
    couper la route.
  explication: 'Un dépassement doit permettre de se rabattre sans gêner (R414-4). Avant de tourner à droite : rétroviseur
    droit et angle mort, en surveillant aussi les cyclistes qui me remontent par la droite.'
  theme: U
  sous_theme: cyclistes
  source: Code de la route, art. R414-4 et R415-3
