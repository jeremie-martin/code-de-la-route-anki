- id: u-pl-angles-morts
  question: Je suis à vélo, arrêté au feu rouge à droite d'un camion, à hauteur de sa portière. Son conducteur me voit-il
    ?
  reponse: 'Il peut ne pas me voir (angle mort) : je reste en retrait, hors de sa trajectoire, plutôt que de présumer qu’il
    m’a repéré.'
  explication: Un poids lourd a des angles morts devant, derrière et sur les deux côtés, surtout à droite. Voir son
    rétroviseur ne prouve pas qu’il me voit ; je ne m’installe pas à côté d’un camion qui pourrait tourner.
  theme: U
  sous_theme: poids_lourds
  source: "securite-routiere.gouv.fr, Vrai ou faux : angles morts"
  illustration:
    gen: pl_angles_morts
    params: {}
    legende: 'À hauteur de la cabine, côté droit : dans le plus grand angle mort du camion.'
- id: u-pl-tourne-droite
  question: Le camion devant moi vient de se déporter à gauche, clignotant droit en marche. Comment réagir à l’espace laissé à sa droite ?
  reponse: Il prépare probablement son virage à droite. Je reste derrière, sans m’engager dans cet espace.
  explication: 'Les roues arrière passent à l’intérieur de la trajectoire des roues avant : le camion peut avoir
    besoin de s’écarter avant de tourner. L’espace libre maintenant peut se refermer pendant le virage.
    Le clignotant indique une intention, pas une certitude sur la manœuvre exacte.'
  theme: U
  sous_theme: poids_lourds
  source: "Sécurité routière, fiche pédagogique 6, https://www.securite-routiere.gouv.fr/sites/default/files/2019-02/fiche_pedago_film_6.pdf"
  image: {gen: camion_virage, width: 960}
  illustration:
    gen: camion_roues
    width: 960
    legende: 'Les roues arrière coupent l’intérieur du virage : le camion a besoin de cette place.'
- id: u-pl-depasser-suivre
  question: 'Route à double sens : je souhaite dépasser ce poids lourd. Quelles précautions particulières ?'
  reponse: Rester plus loin pour voir la route qu’il masque, ne m’engager que si la longueur libre suffit (dépassement long),
    ne pas me rabattre trop tôt.
  explication: Il freine moins vite, projette de l'eau et crée un appel d'air. Hors agglomération, deux poids lourds qui se suivent à la même vitesse gardent au moins 50 m (R412-12).
  theme: U
  sous_theme: poids_lourds
  source: "Code de la route, art. R414-4 et R412-12 ; coursdecode, Les poids lourds"
