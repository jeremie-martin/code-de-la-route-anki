- id: s-remorque-seuil-750
  theme: S
  sous_theme: applications
  question: Voiture de PTAC 3 500 kg, remorque de PTAC 750 kg ; capacités techniques respectées. Le permis
    B seul suffit-il ?
  reponse: 'Oui : la remorque ne dépasse pas 750 kg de PTAC, même si la somme des PTAC atteint 4 250 kg.'
  explication: Le cas de la remorque au plus égale à 750 kg est distinct du cas d’une remorque plus lourde.
    Calculer seulement la somme dans tous les cas conduit à une erreur.
  source: Service Public, permis B — https://www.service-public.gouv.fr/particuliers/vosdroits/F2828
  tags:
  - revision::v4
  - competence::application
- id: s-remorque-seuil-800
  theme: S
  sous_theme: applications
  question: Voiture de PTAC 3 500 kg, remorque de PTAC 800 kg ; capacités techniques respectées. Le permis
    B seul suffit-il ?
  reponse: 'Non : au-delà de 750 kg pour la remorque, la somme des PTAC compte ; 4 300 kg dépasse même le plafond
    B96.'
  explication: Le cas de la remorque au plus égale à 750 kg est distinct du cas d’une remorque plus lourde.
    Calculer seulement la somme dans tous les cas conduit à une erreur.
  source: Service Public, permis B — https://www.service-public.gouv.fr/particuliers/vosdroits/F2828
  tags:
  - revision::v4
  - competence::application
- id: c-distance-freinage-mouille-exercice
  theme: C
  sous_theme: applications
  question: Un exercice donne 15 m de réaction et 25 m de freinage sur sol sec. Sur sol mouillé, il suppose
    le freinage doublé et la réaction inchangée. Quelle distance d’arrêt ?
  reponse: '65 m : 15 + (2 × 25).'
  explication: 'On ne double pas automatiquement la distance d’arrêt entière : la réaction et le freinage sont
    deux composantes. L’hypothèse chiffrée appartient à cet exercice.'
  source: 'Modèle physique : arrêt = réaction + freinage ; calcul sur données explicites'
  tags:
  - revision::v4
  - competence::application
- id: c-distance-obstacle-exercice
  theme: C
  sous_theme: applications
  question: L’obstacle est à 35 m. L’exercice donne 15 m de réaction puis 25 m de freinage jusqu’à l’arrêt.
    Puis-je m’immobiliser avant l’obstacle ?
  reponse: 'Non : il faut 40 m, soit 5 m de plus que la distance disponible.'
  explication: Un freinage possible ne signifie pas un arrêt possible avant l’obstacle. Les distances données
    priment sur une table mnémotechnique.
  source: 'Relation physique : arrêt = réaction + freinage ; calcul sur données explicites'
  tags:
  - revision::v4
  - competence::application
- id: l-cavalier-ligne-continue
  theme: L
  sous_theme: applications
  question: 'Hors agglomération, un cavalier avance devant moi. L’écart de 1,50 m demanderait de chevaucher
    une ligne continue. Bonne visibilité : puis-je invoquer l’exception prévue pour les vélos ?'
  reponse: 'Non : cette exception ne concerne pas le cavalier ; j’attends une possibilité légale et sûre.'
  explication: L’obligation d’écart latéral couvre plusieurs usagers, mais l’exception de chevauchement ne
    couvre que cycles, EDPM et cyclomobiles légers.
  source: Code de la route, R412-19 — https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842138/
  tags:
  - revision::v4
  - competence::application
- id: l-visuel-m12-edpm
  theme: L
  sous_theme: applications
  question: Je conduis une trottinette électrique (EDPM). Le feu est rouge et porte ce panonceau. Puis-je franchir
    la ligne d’effet du feu dans la direction fléchée ?
  reponse: Oui, dans la direction fléchée, en cédant aux piétons et aux véhicules bénéficiant du vert.
  explication: Le M12 vise les cycles, EDPM et cyclomobiles légers. L’autorisation dépend de la catégorie et
    de la direction ; elle ne donne pas priorité.
  source: Arrêté du 24 novembre 1967, article 2-1 — https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/
  tags:
  - revision::v4
  - competence::application
  - competence::lecture_image
  image_ref: m12
- id: l-visuel-m12-voiture
  theme: L
  sous_theme: applications
  question: Je conduis une voiture. Le feu est rouge et porte ce panonceau. Puis-je franchir la ligne d’effet
    du feu dans la direction fléchée ?
  reponse: Non. Le panonceau ne m’autorise pas à franchir le rouge ; j’attends le vert.
  explication: Le M12 vise les cycles, EDPM et cyclomobiles légers. L’autorisation dépend de la catégorie et
    de la direction ; elle ne donne pas priorité.
  source: Arrêté du 24 novembre 1967, article 2-1 — https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/
  tags:
  - revision::v4
  - competence::application
  - competence::lecture_image
  image_ref: m12
