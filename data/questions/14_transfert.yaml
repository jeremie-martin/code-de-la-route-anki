- id: m-visuel-pression-usuelle
  theme: M
  sous_theme: applications
  question: 'Même étiquette, charge usuelle et pneus froids. Je lis 2,6 bar dans le tableau : est-ce la valeur
    à appliquer aux quatre pneus ?'
  reponse: 'Non : 2,2 bar à l’avant et 2,1 bar à l’arrière pour cette charge.'
  explication: Une valeur présente dans la notice peut correspondre à une autre situation ; ne pas retenir
    le plus grand nombre par réflexe.
  source: Michelin — https://www.michelin.fr/auto/conseils/pression-pneus/gonfler-pneus
  tags:
  - revision::v4
  - competence::application
  - competence::lecture_document
