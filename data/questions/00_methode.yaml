- id: etg-bandeau-reponses
  question: Sur une question de l'ETG, comment sait-on s'il faut cocher une ou plusieurs réponses ?
  reponse: 'Le bandeau de la question l''indique : « une réponse » ou « plusieurs réponses ».'
  explication: 'Depuis 2023, ce n''est plus à deviner. « Plusieurs réponses » signifie au moins deux : il faut cocher toutes les bonnes et aucune mauvaise pour avoir le point.'
  theme: X
  sous_theme: lecture
  source: securite-routiere.gouv.fr — Nouvelle épreuve du code 2023 ; Codes Rousseau — Nouveautés 2026
- id: etg-pictogramme-point-de-vue
  question: Un pictogramme apparaît en haut à droite de la photo (piéton, vélo, moto, poids lourd…). Que signifie-t-il ?
  reponse: Que la question se place du point de vue de cet usager, pas de celui d'un automobiliste.
  explication: 'Piège classique : la photo est prise au guidon d''un vélo ou d''une trottinette, et les règles à appliquer sont celles de cet usager (piste cyclable, sas vélo, M12…). Toujours vérifier le pictogramme avant de répondre.'
  theme: X
  sous_theme: lecture
  source: Prépacode (ENPC) — Nouveau code 2023 ; Codes Rousseau — Nouveautés 2026
- id: etg-halo-jaune
  question: Dans une question de l'ETG, un véhicule de la photo est entouré/surligné en jaune. Pourquoi ?
  reponse: C'est le véhicule dont parle la question (« ce véhicule », « la voiture bleue »…).
  explication: Le repère de localisation (goutte/pin) joue le même rôle pour un lieu précis. Cela évite d'hésiter sur l'objet de la question.
  theme: X
  sous_theme: lecture
  source: securite-routiere.gouv.fr — Nouvelle épreuve du code 2023
- id: etg-je-peux-je-dois
  question: Quelle différence de lecture entre « Je peux… » et « Je dois… » dans une question de l'ETG ?
  reponse: « Je peux » demande si l'action est autorisée (règle + sécurité) ; « Je dois » demande si elle est obligatoire.
  explication: 'Exemple : feu vert et piéton engagé → « je peux passer » = non (danger) ; « je dois m''arrêter » = oui. Une action autorisée mais dangereuse se répond « non » à « je peux ».'
  theme: X
  sous_theme: lecture
  source: Méthode d'examen (synthèse des conseils Codes Rousseau, ENPC, Ornikar)
- id: etg-reflexe-securite
  question: Entre deux réponses plausibles à l'ETG, laquelle privilégier ?
  reponse: 'La plus sûre : celle qui réduit le risque (ralentir, vérifier ses rétroviseurs, laisser passer), jamais celle qui force le passage.'
  explication: La banque de questions valorise l'anticipation et la prudence. « Je klaxonne » en ville, « j'accélère pour passer », « je force le passage » sont presque toujours faux.
  theme: X
  sous_theme: lecture
  source: Méthode d'examen (synthèse des conseils Codes Rousseau, ENPC, Ornikar)
- id: etg-video-strategie
  question: 'Question vidéo à l''ETG : que faut-il observer pendant la vidéo ?'
  reponse: 'Tout ce qui peut créer un danger : piétons, cyclistes, portières, clignotants, feux, signalisation, et surtout ce qui change entre le début et la fin.'
  explication: 'La question porte presque toujours sur la bonne réaction face à un événement (véhicule qui déboîte, enfant qui traverse). Le chronomètre de 20 s démarre après la vidéo : on regarde d''abord, on lit ensuite.'
  theme: X
  sous_theme: lecture
  source: Ornikar — Les questions vidéo de l'examen du code ; Prépacode (ENPC)
- id: etg-question-suivante
  question: À l'ETG, peut-on revenir à une question précédente ou la sauter pour y revenir plus tard ?
  reponse: 'Non : chaque question doit être validée dans le temps imparti, sans retour possible.'
  explication: Si le temps s'écoule sans réponse, la question est comptée fausse. Mieux vaut répondre avec sa meilleure hypothèse que ne rien cocher.
  theme: X
  sous_theme: format
  source: En Voiture Simone — Examen du code 2026 ; Codes Rousseau
- id: etg-operateurs
  question: Où passe-t-on l'ETG depuis 2016 ?
  reponse: Dans un centre agréé géré par un opérateur privé (La Poste, SGS Objectif Code, Dekra, Bureau Veritas Code'nGo, Pearson Vue Point Code), sur tablette ou ordinateur, avec casque audio.
  explication: Inscription en ligne avec son numéro NEPH ; résultat « Favorable/Défavorable » avec le score sur 40, par e-mail, au plus tôt 24 h après. On peut se présenter en candidat libre sans auto-école.
  theme: X
  sous_theme: format
  importance: utile
  source: service-public.fr — Examen du code de la route ; En Voiture Simone — Examen 2026
- id: etg-forme-double-oui-non
  question: Quelle est la forme de question la plus fréquente dans la banque 2023 de l'ETG ?
  reponse: Deux affirmations sur la même photo, chacune à juger OUI ou NON (A/B puis C/D) — donc toujours « Plusieurs réponses », une lettre par ligne.
  explication: '11 des 20 exemples officiels ont cette forme (« Un enfant peut être masqué par des véhicules en stationnement : OUI/NON — Un enfant perçoit les dangers comme un adulte : OUI/NON »). Les deux affirmations sont notées ensemble : une seule erreur = 0 point pour la question. Elles ne sont pas forcément liées entre elles.'
  theme: X
  sous_theme: lecture
  source: Sécurité routière — Exemples de nouvelles questions (PDF, sept. 2023) ; En Voiture Simone — Questions pièges
- id: etg-adverbes
  question: Quels mots d'un énoncé de l'ETG changent tout le sens et méritent une relecture ?
  reponse: Les restrictions (« obligatoirement », « uniquement », « exclusivement »), les nuances de fréquence (« principalement », « le plus souvent »), les conditions en fin d'énoncé (« sauf si », « dans ce cas ») et les négations (« il n'est pas interdit de… » = c'est autorisé).
  explication: 'La nuance se trouve souvent en fin d''énoncé. Exemple officiel : « mon véhicule doit obligatoirement être équipé de 4 pneus hiver » (réponse OUI si je n''ai ni chaînes ni chaussettes à bord).'
  theme: X
  sous_theme: lecture
  source: Codeclic — Comment réussir le code ; En Voiture Simone — Questions pièges ; exemples officiels 2023
- id: etg-quand-s-inscrire
  question: À partir de quel niveau en examens blancs est-il raisonnable de réserver sa session d'ETG ?
  reponse: Quand on obtient régulièrement 37-38/40 (moins de 3 fautes) sur des séries chronométrées de 40 questions.
  explication: 'Le seuil réel est 35/40 ; la marge absorbe le stress et les questions inhabituelles. La Sécurité routière elle-même conseille de « repousser de quelques jours » si la préparation est à parfaire : en 2025, seuls 49 % des candidats ont réussi (59 % en première présentation).'
  theme: X
  sous_theme: strategie
  source: securite-routiere.gouv.fr — Objectifs et réglementation de l'examen du code ; bilan annuel 2025 des examens du permis ; Ornikar ; Codeclic
- id: etg-premiere-reponse
  question: Pendant l'épreuve, faut-il changer une réponse dont on doute au dernier moment ?
  reponse: 'Non, sauf si l''on a clairement repéré un élément manqué : on lit l''énoncé et toutes les propositions jusqu''au bout, on répond, on valide.'
  explication: 'Répondre trop vite est l''erreur n° 1 signalée par les opérateurs : utiliser les 20 secondes pour relire le bandeau (une/plusieurs réponses) et vérifier les rétroviseurs et l''arrière-plan de la photo.'
  theme: X
  sous_theme: strategie
  source: Codeclic — Conseils examen ; Dekra — 10 erreurs à éviter
