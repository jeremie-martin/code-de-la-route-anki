- id: etg-pictogramme-point-de-vue
  question: Un pictogramme apparaît en haut à droite de la photo (piéton, vélo, moto, poids lourd…). Que signifie-t-il ?
  reponse: Que la question se place du point de vue de cet usager, pas de celui d'un automobiliste.
  explication: 'Une photo prise au guidon d’un vélo ou d’une trottinette appelle les règles de cet usager : piste cyclable, sas vélo, autorisation de franchir un feu dans une direction donnée. Je vérifie le pictogramme avant de répondre.'
  theme: X
  sous_theme: lecture
  source: "Prépacode (ENPC), Nouveau code 2023 ; Codes Rousseau, Nouveautés 2026"
- id: etg-halo-jaune
  question: Dans une question de l'ETG, un véhicule de la photo est entouré/surligné en jaune. Pourquoi ?
  reponse: C'est le véhicule dont parle la question (« ce véhicule », « la voiture bleue »…).
  explication: 'Cela évite d’hésiter sur l’objet de la question : je relis ensuite l’énoncé à partir de ce véhicule. Dans ce deck, le cadre jaune désigne au contraire ma voiture (MOI) : à l’examen, il faut relire.'
  theme: X
  sous_theme: lecture
  source: "securite-routiere.gouv.fr, Nouvelle épreuve du code 2023"
- id: etg-je-peux-je-dois
  question: Quelle différence de lecture entre « Je peux… » et « Je dois… » dans une question de l’ETG (épreuve théorique
    générale, le code) ?
  reponse: 'Convention de l’épreuve : « Je peux » demande si l’action est à la fois autorisée et sûre ; « Je dois
    » demande si elle est obligatoire.'
  explication: 'Exemple : feu vert et piéton engagé → « je peux passer » = non (danger) ; « je dois m''arrêter » = oui. Une
    action autorisée mais dangereuse se répond « non » à « je peux ».'
  theme: X
  sous_theme: lecture
  source: Méthode d'examen (synthèse des conseils Codes Rousseau, ENPC, Ornikar)
- id: etg-video-strategie
  question: 'Question vidéo à l’ETG : à la fin, tout semble se jouer sur ce qui est à l’écran. Où peut se trouver l’indice
    décisif ?'
  reponse: 'Dans ce qui a défilé avant : un panneau déjà passé, un usager apparu dans un rétroviseur, une zone masquée.
    Je les repère pendant toute la vidéo.'
  explication: Observer le point de vue, la signalisation, les usagers et leurs mouvements ; ne pas fixer seulement l’événement
    le plus spectaculaire. Relier ensuite chaque proposition aux indices réellement vus.
  theme: X
  sous_theme: lecture
  source: "Méthode d’observation (synthèse pédagogique) ; Sécurité routière, préparation à l’examen"
- id: etg-forme-double-oui-non
  question: Une question de l'ETG présente deux affirmations sur la même photo, chacune à juger OUI/NON. Comment est-elle
    notée ?
  reponse: 'Tout ou rien : les deux affirmations doivent être justes pour avoir le point ; elles ne sont pas forcément liées
    entre elles.'
  explication: Juger séparément les deux affirmations, puis vérifier les lettres cochées.
  theme: X
  sous_theme: lecture
  source: "Sécurité routière, Exemples de nouvelles questions (PDF, sept. 2023) ; En Voiture Simone, Questions pièges"
- id: etg-negation
  question: 'Énoncé de l''ETG : « Il n''est pas interdit de tourner à droite. » Qu''est-ce que cela veut dire ?'
  reponse: 'Que c''est autorisé : une double négation (« pas interdit ») équivaut à une permission.'
  explication: Les négations et doubles négations sont une source d'erreur classique ; les reformuler mentalement en positif
    avant de juger l'affirmation.
  theme: X
  sous_theme: lecture
  source: "Codeclic, Comment réussir le code"
