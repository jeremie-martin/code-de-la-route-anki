- id: s-ceinture-obligation
  question: 'Contrôle routier : ni moi, au volant, ni mon passager de 30 ans ne sommes attachés. Qui perd des points ?'
  reponse: 'Moi seul : 135 € et 3 points. Mon passager majeur paie 135 € pour lui-même, sans retrait de points.'
  explication: 'La ceinture est due à toutes les places, avant comme arrière. Pour un passager de moins de 18 ans, c’est
    le conducteur qui paie l’amende, sans points. R412-1 II prévoit des dispenses limitées : morphologie inadaptée, certificat
    médical, taxi en service…'
  theme: S
  sous_theme: passagers
  source: Code de la route, art. R412-1, R412-1-1 et R412-2
- id: s-ceinture-50-kmh
  question: 'Choc frontal à 50 km/h : que devient un adulte non attaché ?'
  reponse: 'Il est projeté à la vitesse du véhicule et heurte l''habitacle ou les autres occupants : ses bras ne peuvent
    pas le retenir.'
  explication: 'Repère des supports de préparation : le choc équivaut à une chute du troisième étage, et le corps pèse « plusieurs tonnes » à l''instant du choc. Retenir la nécessité de la ceinture, pas une constante.'
  theme: S
  sous_theme: passagers
  source: "securite-routiere.gouv.fr, La ceinture de sécurité"
- id: s-femme-enceinte
  question: 'Une femme enceinte boucle sa ceinture : par où doit passer chaque sangle ?'
  reponse: Sangle basse sous le ventre, sur les hanches ; sangle haute entre les seins, à côté du ventre.
  explication: 'La grossesse ne dispense pas de la ceinture, sauf certificat médical : bien placée, c’est la meilleure protection
    du fœtus comme de la mère. Aucune sangle sur l’abdomen.'
  theme: S
  sous_theme: passagers
  source: "securite-routiere.gouv.fr, La ceinture de sécurité"
  illustration:
    gen: ceinture
    legende: Ceinture bien placée pendant la grossesse.
    params:
      variante: enceinte
- id: s-airbag-distance
  question: Je suis très près du volant. Pourquoi reculer le siège tout en gardant les commandes accessibles ?
  reponse: Pour laisser à l'airbag l'espace de se déployer, environ 25 cm entre le sternum et le volant, tout en atteignant
    les pédales.
  explication: Repère des supports de préparation ; la notice du véhicule précise la position. Une position trop proche
    transforme l'airbag en danger.
  theme: S
  sous_theme: passagers
  source: "securite-routiere.gouv.fr, S'installer au poste de conduite ; constructeurs"
- id: s-animaux
  question: Comment transporter un animal en voiture ?
  reponse: Attaché (harnais relié à la ceinture), en caisse, ou derrière un filet ou une grille dans le coffre ; jamais libre
    dans l’habitacle.
  explication: 'Un animal libre distrait le conducteur (35 €, contravention de 2e classe, R412-6 : possibilités de mouvement
    et champ de vision réduits) et devient un projectile en cas de choc. Ne jamais laisser un animal dans une voiture au soleil.'
  theme: S
  sous_theme: passagers
  source: Code de la route, art. R412-6 ; securite-routiere.gouv.fr
- id: s-surnombre
  question: Combien de personnes, conducteur compris, peuvent monter dans ma voiture ?
  reponse: 'Autant que de places assises, conducteur compris : c’est le nombre inscrit sur la carte grise (rubrique S.1)
    ; un enfant compte pour une place.'
  explication: Le surnombre est une contravention de 4e classe et coûte 3 points au conducteur (R412-1-1).
  theme: S
  sous_theme: passagers
  source: Code de la route, art. R412-1-1 ; service-public.fr, Certificat d’immatriculation (rubrique S.1) ; Stych, Installation
    des passagers
- id: s-enfant-moins-10-ans
  question: Dans quels cas un enfant de moins de 10 ans peut-il voyager sans dispositif de retenue homologué ?
  reponse: Si sa morphologie est adaptée au port de la ceinture, sur certificat médical d’exemption, ou en taxi et en transport en commun.
  explication: 'Hors de ces dérogations (R412-2 III), dispositif adapté jusqu’à 10 ans, à l’arrière sauf exceptions de R412-3. Sanction : 135 € pour le conducteur, sans retrait de points. La taille n’est pas le critère légal.'
  theme: S
  sous_theme: enfants
  source: "Code de la route, art. R412-2 et R412-3 ; service-public.fr, Transport d'enfants en voiture"
- id: s-siege-dos-route
  question: Peut-on installer un siège bébé dos à la route sur le siège passager avant ?
  reponse: 'Seulement si l’airbag frontal passager est désactivé : sinon son déploiement contre le siège peut tuer le bébé.'
  explication: Le dos à la route est le plus protecteur (tête et nuque soutenues lors d'un choc frontal) ; la norme i-Size
    l'impose jusqu'à 15 mois. Le voyant « airbag passager OFF » confirme la désactivation.
  theme: S
  sous_theme: enfants
  source: "Code de la route, art. R412-3 ; règlement ONU R129 (i-Size) ; securite-routiere.gouv.fr, Enfants en voiture"
  illustration:
    gen: siege_dos_route
    params: {}
    legende: Dos à la route, la tête du bébé est du côté de la planche de bord, là où l’airbag se déploie.
- id: s-groupes-sieges
  question: Un siège enfant est homologué R129 (i-Size). Sur quel critère de l’enfant son étiquette se lit-elle ?
  reponse: Sa taille, en centimètres, avec une masse maximale quand elle est indiquée ; l’ancienne norme R44 classait les
    sièges par poids.
  explication: 'R129 ne signifie pas toujours Isofix : certains modèles s’installent avec la ceinture. Les R44-03 et R44-04
    déjà possédés restent utilisables ; les R44 ne sont plus vendus neufs depuis septembre 2024. Je vérifie la compatibilité
    avec la voiture et la place choisie.'
  theme: S
  sous_theme: enfants
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F628 ; AWSR, https://www.awsr.be/securite-routiere/sieges-auto/"
- id: s-securite-enfant-portieres
  question: À quoi sert la « sécurité enfants » des portières arrière ?
  reponse: À empêcher l'ouverture des portes arrière depuis l'intérieur (et sur certains véhicules, le fonctionnement des
    lève-vitres arrière).
  explication: On l'active dès qu'un enfant voyage à l'arrière ; on fait descendre les enfants côté trottoir, et on ne laisse
    jamais un enfant seul dans le véhicule.
  theme: S
  sous_theme: enfants
  source: "securite-routiere.gouv.fr, Enfants en voiture"
- id: s-chargement-placement
  question: Comment répartit-on un chargement dans le véhicule ?
  reponse: Objets lourds en bas et le plus en avant possible (contre le dossier), légers au-dessus, le tout arrimé et pas
    plus haut que les dossiers.
  explication: Au choc, les objets non arrimés continuent leur mouvement et peuvent blesser. Il n’existe pas de conversion
    universelle de kilogrammes en « poids au choc » sans durée ou distance de décélération. Respecter charge, arrimage, pression
    et réglage des feux.
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R312-19 ; securite-routiere.gouv.fr
  illustration:
    gen: chargement_coffre
    params: {}
    legende: Le plus lourd au plancher, contre le dossier ; rien au-dessus du haut des dossiers (pointillés).
- id: s-chargement-depassement
  question: Une planche dépasse de 2 m à l'arrière de mon break. Puis-je rouler ainsi ?
  reponse: 'Oui, si le chargement est solidement arrimé et signalé : dispositif réfléchissant à l’arrière, complété d’un feu
    rouge la nuit ou par mauvaise visibilité.'
  explication: Le feu complète le réflecteur ; il ne le remplace pas. Le dépassement arrière est limité à 3 m et ne doit pas
    masquer plaque ni éclairage.
  dedup_ok:
  - s-chargement-chiffres
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R312-19 à R312-22
  illustration:
    gen: chargement_arriere
    params:
      depasse: 2
    legende: 'À l’extrémité : dispositif réfléchissant rouge, et feu rouge la nuit.'
- id: s-coffre-toit
  question: Coffre de toit monté, j’arrive à l’entrée d’un parking souterrain dont la hauteur est limitée. Que dois-je vérifier
    ?
  reponse: La hauteur totale de ma voiture avec le coffre, à comparer à la hauteur maximale affichée à l’entrée.
  explication: Le coffre ajoute une hauteur qu’on oublie une fois au volant. Je respecte aussi la charge maximale de toit
    indiquée par la notice.
  theme: S
  sous_theme: chargement
  source: "ADEME, Éco-conduite ; securite-routiere.gouv.fr"
- id: s-remorque-conduite
  question: Je tracte une caravane ; au passage d'un camion, elle se met à louvoyer. Que fais-je ?
  reponse: Je lève le pied progressivement et je tiens le volant droit, sans freinage brutal ni coup de volant, jusqu'à ce que l'ensemble se stabilise.
  explication: 'Le louvoiement vient surtout d''une vitesse excessive, d''une charge mal répartie ou d''un vent latéral. Prévenir : charge lourde en bas, sur l''essieu, poids sur la boule selon la notice, allure réduite. Tracter allonge aussi la distance d''arrêt et les dépassements, et élargit le gabarit (rétroviseurs additionnels si nécessaire).'
  theme: S
  sous_theme: chargement
  source: "securite-routiere.gouv.fr, Équipement de la voiture ; Stych, Chargement et remorque"
- id: s-securite-active-passive
  question: Quelle différence entre sécurité active et sécurité passive ?
  reponse: La sécurité active évite l’accident (freins, pneus, éclairage…) ; la sécurité passive limite les blessures quand
    il survient (ceinture, airbags…).
  explication: Sont actifs aussi la direction, les amortisseurs et toutes les aides à la conduite (ABS, ESP, aide au freinage
    d’urgence) ; sont passifs les prétensionneurs, les zones de déformation et l’habitacle rigide. Le classement Euro NCAP
    (5 étoiles) évalue les deux.
  theme: S
  sous_theme: equipements
  source: "securite-routiere.gouv.fr, Équipements de sécurité ; Euro NCAP"
- id: s-remorque-vitesses
  prerequis: [d-masses-definitions]
  question: 'Je tracte une remorque avec une voiture de PTAC inférieur à 3,5 t et de PTRA 4 t.
    Hors agglomération, quels plafonds de vitesse s’appliquent par temps sec, sans limitation plus basse ?'
  reponse: '90 km/h sur autoroute et sur route prioritaire à chaussées séparées par un terre-plein central ;
    80 km/h sur les autres routes.'
  explication: 'Avec une remorque, le PTRA supérieur à 3,5 t déclenche ces plafonds, même si l’ensemble roule
    peu chargé. Le PTRA est la masse maximale autorisée de l’ensemble, inscrite en F.3 sur la carte grise
    de la voiture. Une limitation plus basse ou les conditions de circulation peuvent imposer de ralentir davantage.'
  theme: S
  sous_theme: chargement
  source: "Code de la route, art. R413-8, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028436426 ; R413-1 et R413-4"
- id: s-remorque-seuil-750
  prerequis: [d-masses-definitions]
  theme: S
  sous_theme: applications
  question: Voiture de PTAC 3 500 kg, remorque de PTAC 750 kg ; capacités techniques respectées. Le permis
    B seul suffit-il ?
  reponse: 'Oui : la remorque ne dépasse pas 750 kg de PTAC, même si la somme des PTAC atteint 4 250 kg.'
  explication: Le cas de la remorque au plus égale à 750 kg est distinct du cas d’une remorque plus lourde.
    Calculer seulement la somme dans tous les cas conduit à une erreur.
  source: "Service Public, permis B, https://www.service-public.gouv.fr/particuliers/vosdroits/F2828"
- id: s-remorque-masse-reelle
  prerequis: [d-masses-definitions]
  theme: S
  sous_theme: applications
  question: 'La somme des PTAC dépasse 3 500 kg, avec une remorque de PTAC 1 000 kg. La remorque est vide :
    cela suffit-il à autoriser le permis B seul ?'
  reponse: 'Non : pour cette règle de permis, on additionne les PTAC, pas les masses réelles du jour.'
  explication: Le permis et les capacités techniques sont deux contrôles différents. Vider la remorque ne modifie
    pas son PTAC.
  source: "Service Public, https://www.service-public.gouv.fr/particuliers/vosdroits/F2828"
- id: s-surcharge-ptac
  question: 'Chargée pour les vacances, sans remorque, ma voiture pèse 2 050 kg. Carte grise : F.2 = 1 900 kg, F.3 = 2 800
    kg. Puis-je partir ainsi ?'
  reponse: 'Non : sans remorque, c’est le PTAC (F.2, 1 900 kg) que le poids réel ne doit pas dépasser ; le PTRA (F.3) concerne
    l’ensemble avec remorque. Je décharge.'
  explication: 'Surchargée, elle freine plus long et tient moins bien la route. Amende de 4e classe par tranche de 0,5 t
    de dépassement ; un agent peut exiger une pesée et immobiliser le véhicule.'
  theme: S
  sous_theme: chargement
  source: Code de la route, art. R312-2 et R325-8
