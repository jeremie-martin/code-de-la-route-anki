- id: s-remorque-cas-b
  theme: S
  sous_theme: remorque
  question: 'Voiture de PTAC 2 000 kg et remorque de PTAC 1 200 kg, capacités de traction respectées : le permis
    B suffit-il ?'
  reponse: 'Oui : la somme des PTAC est de 3 200 kg, donc au plus 3 500 kg.'
  explication: Le seuil de 750 kg n’est pas une limite absolue de remorque pour le permis B.
  source: Code de la route, R221-4
  tags:
  - revision::v3
  - competence::application
- id: s-remorque-cas-b96
  theme: S
  sous_theme: remorque
  question: 'Voiture de PTAC 2 400 kg et remorque de PTAC 1 500 kg, capacités de traction respectées : le permis
    B seul suffit-il ?'
  reponse: 'Non : 3 900 kg de somme des PTAC ; il faut au moins la mention B96.'
  explication: 'Pour une remorque de plus de 750 kg : au-delà de 3 500 et jusqu’à 4 250 kg, B96. On calcule sur
    les PTAC, même à vide.'
  source: Code de la route, R221-4 et R221-8
  tags:
  - revision::v3
  - competence::application
