- id: m-pression-etiquette
  theme: M
  sous_theme: pneus
  question: Voici l’étiquette de pression de ma voiture. Je pars en vacances, voiture chargée ; les pneus sont froids. Quelles
    pressions dois-je régler ?
  reponse: 'Celles de la ligne « pleine charge » : 2,6 bar à l’avant et 2,8 bar à l’arrière.'
  explication: On lit la préconisation correspondant au véhicule et aux pneus, plutôt que d’ajouter forfaitairement
    0,3 bar.
  source: "Michelin, https://www.michelin.fr/auto/conseils/pression-pneus/gonfler-pneus"
