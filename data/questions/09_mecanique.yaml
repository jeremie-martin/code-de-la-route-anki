- id: m-voyants-couleurs
  question: Que signifient les couleurs des voyants du tableau de bord ?
  reponse: 'Rouge : danger ou arrêt nécessaire ; orange : anomalie à contrôler ; vert ou bleu : fonction en service.'
  explication: La couleur annonce le degré ; le symbole et le message précisent la conduite à tenir. Certains rouges ne
    font que rappeler une ceinture non bouclée ou le frein de stationnement serré.
  theme: M
  sous_theme: tableau_de_bord
  source: "Codes Rousseau, Les voyants ; Ornikar, Voyants lumineux"
  debut: true
  comparaisons:
  - ref: voyant-huile
    legende: Pression d’huile.
  - ref: voyant-moteur
    legende: Anomalie moteur.
  - ref: voyant-croisement
    legende: Feux de croisement.
  - ref: voyant-route
    legende: Feux de route.
- id: m-pneus-usure-1-6
  question: Sur une voiture, quelle profondeur minimale doivent garder les rainures principales des pneus,
    et comment repérer cette limite ?
  reponse: Au moins 1,6 mm ; les témoins d’usure permettent de repérer la limite. Une jauge permet de mesurer la profondeur.
  explication: 'Contrôler à plusieurs endroits : une usure irrégulière peut laisser une zone trop usée.
    La profondeur ne suffit pas : toile apparente et déchirure profonde du flanc sont également interdites.
    Un pneu endommagé peut devoir être remplacé avant la limite d’usure.'
  theme: M
  sous_theme: pneus
  source: 'Code de la route, R314-1 ; arrêté du 18 juillet 2019, art. 5, https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000038995312'
  illustration:
    gen: pneu_usure
    legende: Quand la bande de roulement arrive au niveau du témoin, la limite est atteinte.
- id: m-pneu-hernie
  question: 'Avant de partir, je découvre une bosse apparue sur le flanc d’un pneu après un choc contre
    un trottoir. Ses rainures restent profondes. Puis-je partir avec ce pneu ?'
  reponse: 'Non : une hernie peut signaler une carcasse endommagée, avec risque de perte brutale de pression.'
  explication: 'Je fais remplacer le pneu ; si je ne peux pas monter une roue de secours selon la notice
    et en sécurité, j’appelle l’assistance. Une bonne profondeur de sculpture ne compense pas ce dommage.'
  theme: M
  sous_theme: pneus
  source: 'Michelin, Dommages aux flancs du pneu, https://www.michelin.fr/auto/conseils/changer-pneus/dommages-aux-flancs-des-pneus'
  image:
    gen: pneu_hernie
    params: {}
- id: m-niveau-huile
  question: Comment contrôle-t-on le niveau d'huile moteur ?
  reponse: 'Sur sol horizontal, moteur arrêté et selon la notice ; avec une jauge : essuyer, réinsérer puis lire ; le niveau
    reste entre mini et maxi.'
  explication: 'Le délai d’attente et les indications électroniques varient selon le véhicule. Un voyant rouge de pression
    n’est pas une simple mesure de niveau : arrêt en sécurité et consignes constructeur.'
  theme: M
  sous_theme: entretien
  source: "Ornikar, Huile moteur ; lepermislibre, Contrôler les niveaux"
  illustration:
    gen: jauge_huile
    params: {}
    legende: 'Jauge essuyée, réinsérée puis retirée : l’huile s’arrête entre min et max.'
- id: m-liquide-refroidissement
  question: Quand et où contrôler le niveau du liquide de refroidissement ?
  reponse: 'Moteur froid, sur le vase d’expansion : le niveau doit être entre mini et maxi ; l’appoint se fait avec le liquide
    antigel prévu par la notice.'
  explication: 'Chaud, le circuit est sous pression : l’ouvrir projette du liquide bouillant. Une baisse répétée du niveau
    appelle un contrôle du circuit.'
  theme: M
  sous_theme: entretien
  source: "Ornikar, Liquide de refroidissement"
- id: m-liquide-frein
  question: 'Le niveau du liquide de frein a baissé : que faut-il en conclure ?'
  reponse: 'Plaquettes usées ou fuite du circuit : je fais contrôler sans faire d''appoint à l''aveugle ; une pédale
    molle ou qui s''enfonce impose l''arrêt.'
  explication: Le liquide de frein se remplace périodiquement (souvent tous les 2 ans) car il absorbe l'humidité et
    perd son efficacité à chaud.
  theme: M
  sous_theme: entretien
  source: "Ornikar, Liquide de frein ; lepermislibre"
- id: m-freins-apres-lavage
  question: 'Je repars après avoir lavé la voiture. Quelle vérification faire avant de reprendre de la vitesse, et pourquoi ?'
  reponse: 'Tester le freinage à faible allure, dans un espace dégagé et sans gêner les autres :
    l’eau sur les freins peut retarder leur action.'
  explication: 'Des freinages contrôlés contribuent à sécher disques et garnitures. Je tiens compte du trafic
    derrière et suis la notice du véhicule. Si le freinage reste anormal, je m’arrête en sécurité et fais contrôler ;
    je ne suppose pas que toute perte d’efficacité vient de l’eau.'
  theme: M
  sous_theme: freinage
  source: "Volvo, Freins de route, rubrique Freinage sur route mouillée, https://www.volvocars.com/fr/support/car/v60-cross-country/15w17/article/b7763713f78f074bc0a801e8017136c8/"
- id: m-plaquettes-usure
  question: Quels signes annoncent des plaquettes de frein usées ?
  reponse: 'Un témoin d’usure qui s’allume au tableau de bord, ou un bruit métallique au freinage : je fais contrôler sans
    attendre.'
  explication: 'Le niveau de liquide de frein baisse aussi avec l’usure des plaquettes, mais cette baisse peut venir d’une
    fuite : elle se juge à part.'
  theme: M
  sous_theme: entretien
  source: "Ornikar, Plaquettes et amortisseurs ; Stych, Pannes et dysfonctionnements"
  comparaisons:
  - ref: voyant-plaquettes
    legende: Témoin d’usure des plaquettes.
- id: m-batterie-cables
  question: Ma batterie de démarrage est déchargée. Un autre automobiliste propose ses câbles ; que vérifier avant de les brancher ?
  reponse: Que les notices autorisent le dépannage pour les deux véhicules, avec une tension compatible et les points de branchement prévus.
  explication: La procédure et les bornes accessibles varient ; certains hybrides ne doivent pas servir de véhicule donneur.
    Respecter les polarités et l’ordre indiqué, éviter les étincelles ; en cas de batterie endommagée ou de doute sur la procédure, appeler l’assistance.
  theme: M
  sous_theme: entretien
  source: "Renault Clio 5, Batterie, dépannage (exemple constructeur), https://www.user-manual.renault.com/fr/d%C3%A9pannage/batterie-depannage"
- id: m-carburants-etiquettes
  question: Sur les pistolets de carburant et la trappe du véhicule, que signifie chacune de ces formes d’étiquette ?
  reponse: Rond = essence ; carré = gazole ; losange = gaz (GPL, GNV ou hydrogène).
  explication: Étiquetage européen depuis 2018, repris sur la trappe du véhicule. Le SP95-E10 convient à la plupart des essences
    depuis 2000 ; l'E85 exige un moteur flexfuel ou un boîtier homologué. Un diesel récent a un filtre à particules et souvent
    de l'AdBlue (bouchon bleu).
  theme: M
  sous_theme: entretien
  source: Norme EN 16942 (étiquetage 2018) ; TotalEnergies ; Ornikar
  image:
    gen: etiquettes_carburant
    verso: true
- id: m-erreur-carburant
  question: Je viens de faire le plein avec le mauvais carburant. Que faire ?
  reponse: 'Ne pas mettre le contact et faire vidanger le réservoir sur place : démarrer entraîne le carburant dans la pompe
    et l’injection.'
  explication: 'La forme des pistolets limite l''erreur sans l''empêcher (un pistolet essence entre dans un réservoir diesel,
    l''inverse non). L''essence dans un moteur diesel est le cas le plus grave : elle ne lubrifie pas la pompe à injection
    et la détruit. L''assurance ne couvre généralement pas cette erreur.'
  theme: M
  sous_theme: entretien
  source: "TotalEnergies, Erreur de carburant ; Ornikar, Carburants"
- id: m-boite-auto-positions
  question: Que signifient les positions P, R, N et D d'une boîte automatique ?
  reponse: P bloque la transmission pour stationner ; R est la marche arrière ; N le point mort ; D la marche avant.
  explication: On démarre en P ou N, pied sur le frein ; le pied gauche reste au repos.
  theme: M
  sous_theme: entretien
  source: "Stych, La boîte automatique ; service-public.fr F2828"
- id: m-freinage-urgence-abs
  question: Comment freiner en urgence avec un véhicule équipé de l'ABS ?
  reponse: Écraser la pédale à fond d’un coup et la maintenir malgré les vibrations, en braquant si nécessaire ; en boîte
    manuelle, débrayer en même temps.
  explication: L’ABS aide à conserver la capacité de diriger en évitant le blocage ; il ne garantit pas une distance plus
    courte sur tout revêtement. Ne pas pomper la pédale avec ABS. L’adhérence et la vitesse restent déterminantes.
  theme: M
  sous_theme: freinage
  source: "securite-routiere.gouv.fr, Dépliant vitesse ; Ornikar, ABS"
- id: m-freinage-sans-abs
  question: 'Véhicule sans ABS, freinage d’urgence : les roues se bloquent et le véhicule ne répond plus au volant.
    Que fais-je ?'
  reponse: Je relâche légèrement la pédale pour débloquer les roues, puis je réappuie fort, et je répète jusqu’à
    l’arrêt en gardant le cap.
  explication: 'Des roues bloquées glissent tout droit : le volant n’agit plus. Ce relâchement-réappui est ce que
    l’ABS fait automatiquement et très vite ; avec ABS, au contraire, on écrase la pédale et on la maintient.'
  theme: M
  sous_theme: freinage
  source: securite-routiere.gouv.fr, Les aides à la conduite (ADAS) ; REMC
- id: m-panne-freins
  question: 'Les freins ne répondent plus dans une descente : que faire ?'
  reponse: Je pompe la pédale, je rétrograde pour le frein moteur, j’avertis (détresse, klaxon) et je vise un dégagement
    ou une voie de détresse ; le frein de stationnement en dernier recours, progressivement.
  explication: Ne jamais couper le contact (plus d’assistance de direction ni de freinage) ni engager P ou N en mouvement
    (plus de frein moteur). Un frein de stationnement électrique a son propre mode d’urgence, décrit dans la notice.
  theme: M
  sous_theme: freinage
  source: "Stych, Pannes ; En Voiture Simone, Voies de détresse"
  comparaisons:
  - ref: c26a
    legende: Annonce d’une voie de détresse.
  - ref: marq-damier-rouge-blanc
    legende: Damier rouge et blanc à l’entrée de la voie de détresse.
- id: m-feux-jour-limite
  question: Que font exactement les feux de jour (feux diurnes) ?
  reponse: Ils rendent le véhicule visible de jour, surtout de l’avant ; ils ne remplacent pas les feux de croisement la nuit,
    en tunnel ou par visibilité insuffisante.
  explication: Selon le véhicule, les feux arrière peuvent rester éteints avec les feux de jour. Vérifier l’éclairage actif
    au lieu de se fier à la luminosité du tableau de bord.
  theme: M
  sous_theme: feux
  source: "Stych, Systèmes d'éclairage ; Code de la route, art. R416-6"
  comparaisons:
  - ref: voyant-feux-jour
    legende: 'Feux de jour : ils font voir la voiture, ils n’éclairent pas.'
  - ref: voyant-croisement
    legende: 'Feux de croisement : la nuit, en tunnel ou par mauvaise visibilité.'
- id: m-feux-reglage-hauteur
  question: À quoi sert la molette de réglage des feux (0 à 3) ?
  reponse: À adapter la hauteur du faisceau à la charge pour ne pas éblouir, à la position prescrite par la notice (certains
    véhicules corrigent seuls).
  explication: 'Plus la charge à l’arrière est importante, plus le numéro est élevé (0 = véhicule à vide) : la charge relève
    l’avant, et le faisceau éblouirait.'
  theme: M
  sous_theme: feux
  source: "Sécurité routière, Exemples de nouvelles questions (Q1) ; Ornikar, Réglage des feux"
  illustration:
    gen: feux_chargement
    params: {}
    legende: 'Chargée à l’arrière, la voiture lève le nez : sans correction, le faisceau monte et éblouit.'
- id: m-feux-arriere-controle
  question: Je ne vois pas mes feux stop ni mes feux arrière depuis le poste de conduite. Comment m’assurer qu’ils
    fonctionnent ?
  reponse: Je les fais vérifier par quelqu’un, ou je recule vers une vitrine ou un mur clair, contact mis, en appuyant
    sur la pédale de frein.
  explication: Un feu stop hors service prive ceux qui me suivent de l’annonce de mon freinage. Un dispositif d’éclairage
    ou de signalisation défaillant est une contravention de 3e classe (68 €), avec immobilisation possible la nuit.
  theme: M
  sous_theme: feux
  source: Code de la route, art. R313-2 à R313-11 ; REMC
- id: m-appel-phares
  question: Un conducteur arrêté me fait un appel de phares pour me laisser passer. Puis-je m'engager ?
  reponse: 'Seulement après mes propres contrôles : l’appel ne garantit ni que les autres voies sont libres ni que les autres
    me cèdent le passage.'
  explication: Un geste courtois n’attribue pas une priorité sur tout le carrefour. Chercher notamment le vélo, la moto ou
    le piéton masqué par le véhicule arrêté.
  theme: M
  sous_theme: feux
  source: "Code de la route, art. R416-1 et R416-2 ; Ornikar, L'appel de phares"
- id: s-esp-fonction
  question: À quoi sert l'ESP (contrôle électronique de stabilité) ?
  reponse: À corriger un début de dérapage en freinant des roues séparément et en réduisant le couple moteur, pour garder
    la trajectoire voulue.
  explication: 'Obligatoire sur les voitures neuves depuis 2014 en Europe. Il ne supprime pas les lois de la physique : à
    vitesse excessive dans un virage glissant, il ne peut rien. Son voyant clignote quand il travaille.'
  theme: M
  sous_theme: adas
  source: "securite-routiere.gouv.fr, Les aides à la conduite ; règlement (CE) 661/2009"
  comparaisons:
  - ref: voyant-esp
    legende: 'Voyant ESP : il clignote quand le système corrige un dérapage.'
- id: m-afu-aeb
  theme: M
  sous_theme: adas
  question: Quelle différence entre AFU et freinage automatique d’urgence (AEB) ?
  reponse: L’AFU amplifie un freinage d’urgence déclenché par le conducteur ; l’AEB peut déclencher un freinage
    après détection d’un risque de collision.
  explication: 'Ni l’un ni l’autre ne garantit l’évitement : rester attentif et prêt à freiner.'
  source: "CNSR, Comité des experts, aides à la conduite, https://www.securite-routiere.gouv.fr/sites/default/files/2024-06/les_aides_a_la_conduite_%28adas%29.pdf"
- id: s-regulateur-limiteur
  question: Quelle différence entre régulateur de vitesse simple et limiteur de vitesse ?
  reponse: Le régulateur simple maintient l’allure choisie sans appui sur l’accélérateur ; avec le limiteur, je dose l’accélérateur jusqu’au plafond réglé.
  explication: "Aucun des deux ne règle l’intervalle avec le véhicule devant : c’est la fonction du régulateur adaptatif.
    Je reste prêt à freiner. Le dépassement de la consigne et la désactivation dépendent du système ; un limiteur peut laisser la vitesse augmenter en descente."
  theme: M
  sous_theme: adas
  source: "CNSR, Les aides à la conduite, 2024 ; Renault, https://www.user-manual.renault.com/fr/la-conduite/limiteur-de-vitesse-4"
- id: s-ecall
  question: Après un choc grave, les occupants ne peuvent pas téléphoner. À quoi peut servir l’eCall fondé sur le 112 ?
  reponse: Il peut déclencher automatiquement un appel aux secours et transmettre la position du véhicule, même si personne ne peut parler.
  explication: "Un bouton permet aussi l’appel manuel. Si je peux parler, je précise les dangers et l’état des victimes :
    les données automatiques ne remplacent pas ce bilan. L’eCall ne protège pas les lieux et ne réalise pas les gestes de secours."
  theme: M
  sous_theme: adas
  source: "Union européenne, eCall, https://europa.eu/youreurope/citizens/travel/security-and-emergencies/emergency-assistance-vehicles-ecall/index_fr.htm"
- id: m-adas-responsabilite
  question: Mon véhicule a un détecteur d'angle mort et une alerte de franchissement de ligne. Puis-je m'y fier pour changer
    de voie ?
  reponse: 'Non : rétroviseurs, angle mort et clignotant restent à ma charge ; ces aides assistent le conducteur sans le remplacer,
    il reste seul responsable.'
  explication: 'C''est le principe officiel des ADAS : elles avertissent, corrigent ou évitent, mais ne surveillent pas à
    la place du conducteur. Marquage effacé, neige, forte pluie, soleil bas ou capteurs sales les mettent en défaut.'
  theme: M
  sous_theme: adas
  source: "securite-routiere.gouv.fr, ADAS"
- id: m-ldw-lka
  question: Quelle différence entre l’alerte de franchissement de ligne et l’aide au maintien de voie ?
  reponse: L’alerte (LDW) avertit d’une sortie involontaire de voie ; l’aide au maintien (LKA) peut aussi corriger la trajectoire.
  explication: Marquages effacés, pluie ou caméra masquée peuvent provoquer une absence de réaction ou une correction erronée,
    pas seulement une désactivation. Je garde le contrôle de la direction ; les limites et les consignes de désactivation figurent dans la notice.
  theme: M
  sous_theme: adas
  source: "Renault Megane Sedan, Aide au maintien de voie, https://www.user-manual.renault.com/fr/fonctions-daides-suppl%C3%A9mentaires-%C3%A0-la-conduite/aide-au-maintien-de-voie"
- id: m-allumage-automatique
  question: Les feux sont sur « AUTO » et il se met à pleuvoir en plein jour. Puis-je m'en remettre au système ?
  reponse: 'Je vérifie que les feux de croisement sont réellement allumés et je les commande moi-même au besoin : le mode
    AUTO ne réagit pas à toutes les pluies.'
  explication: Les capteurs et automatismes diffèrent selon les véhicules. Un tableau de bord éclairé ou des feux de jour
    actifs ne prouvent pas que les feux de croisement le sont.
  theme: M
  sous_theme: adas
  source: "securite-routiere.gouv.fr, ADAS ; Stych, Systèmes d'éclairage"
- id: m-conduite-automatisee
  question: Voiture à conduite partiellement automatisée (niveau 2), fonctions actives sur autoroute. Quel est le
    rôle du conducteur ?
  reponse: 'Surveiller en permanence la circulation et pouvoir reprendre les commandes immédiatement : l''attention
    n''est pas transférée au système.'
  explication: 'Au niveau 2, accélération et direction sont assistées mais le conducteur reste responsable : regard
    sur la route, mains disponibles, reprise immédiate. Seul un système de niveau 3 homologué, dans son domaine d’emploi,
    autorise à détourner l’attention, en restant prêt à reprendre la main à sa demande.'
  theme: M
  sous_theme: adas
  source: "Décret n° 2021-873 ; securite-routiere.gouv.fr, ADAS"
- id: m-panne-procedure-route
  question: 'Mon véhicule tombe en panne sur une route ordinaire : que faire dans l''ordre ?'
  reponse: Je signale et me range en sécurité ; gilet avant de sortir ; occupants à l’abri ; triangle à environ 30 m en amont, davantage si nécessaire, si sa pose ne m’expose pas.
  explication: L’exception de danger pour la pose du triangle existe aussi hors autoroute. Ne pas s’exposer sur une route
    étroite ou sans visibilité pour le poser.
  theme: M
  sous_theme: depannage
  source: "Code de la route, art. R416-19 ; securite-routiere.gouv.fr, Véhicule en panne"
  illustration:
    gen: panne_route
    params:
      label: ≈ 30 m
    legende: Voiture sur l’accotement, occupants à l’écart de la chaussée ; triangle en amont (distance non à l’échelle).
- id: m-changer-roue-securite
  question: Que faut-il mettre en place avant de lever le véhicule pour changer une roue ?
  reponse: Sol plat et stable hors circulation, frein de stationnement serré et rapport engagé, feux de détresse et gilet,
    cric au point de levage prévu.
  explication: 'Sur autoroute, on ne change pas de roue côté circulation : abri derrière la glissière et dépanneur
    agréé. Avec une galette, la vitesse inscrite sur l’équipement (souvent 80 km/h) s’applique jusqu’au garage.'
  theme: M
  sous_theme: depannage
  source: "Stych, Dépannages ; Code en Poche, Changer une roue"
- id: m-changer-roue-ecrous
  question: À quel moment desserre-t-on et resserre-t-on les écrous d'une roue ?
  reponse: Desserrer d’un quart de tour roue encore au sol (sinon elle tourne) ; serrer en croix une fois la roue redescendue
    et le véhicule reposé.
  explication: Le serrage en croix répartit l'effort et évite de voiler la jante. On fait vérifier le couple de serrage et
    la pression de la roue montée dès que possible.
  theme: M
  sous_theme: depannage
  source: "Stych, Dépannages ; Code en Poche, Changer une roue"
  illustration:
    gen: ecrous_croix
    params: {}
    legende: 'Serrage en croix : chaque écrou est suivi du plus éloigné.'
- id: m-crevaison-eclatement
  question: Un pneu éclate en roulant. Quelle réaction ?
  reponse: Je tiens fermement le volant sans freiner brutalement ; je lève le pied, je laisse le véhicule ralentir puis je
    me range doucement en sécurité.
  explication: 'Un freinage brusque sur un pneu éclaté déséquilibre le véhicule. Une fois arrêté : feux de détresse, gilet
    avant de sortir, et sur autoroute tout le monde derrière la glissière.'
  theme: M
  sous_theme: depannage
  source: "Stych, Dépannages"
- id: m-moteur-cale-direction
  question: Le moteur cale brusquement alors que je roule. Que deviennent la direction et les freins, et que fais-je
    ?
  reponse: 'La direction devient très dure et le freinage demande beaucoup plus d’effort : je tiens fermement le
    volant, j’appuie fort sur la pédale et je me range hors de la circulation.'
  explication: Les assistances de direction et de freinage dépendent du moteur. Les commandes répondent encore,
    au prix d’un effort bien supérieur. Je ne coupe pas le contact (l’antivol de direction pourrait se verrouiller)
    et j’allume les feux de détresse.
  theme: M
  sous_theme: depannage
  source: REMC (compétence 4) ; notices constructeur (direction assistée, servofrein)
- id: m-remorquage
  question: Sur route ordinaire après une panne, un ami propose de tirer ma voiture avec une corde jusqu’au garage. Que dois-je vérifier avant d’accepter ?
  reponse: Que la notice autorise le remorquage de ce véhicule, que direction et freins restent utilisables moteur coupé, et que les conditions sont réunies (conducteur titulaire du permis au volant, attache adaptée) ; sinon j’appelle l’assistance.
  explication: 'Moteur coupé, direction et freinage ne sont plus assistés : le véhicule remorqué reste conduit et
    freiné par un titulaire du permis. Barre rigide plutôt que corde, anneaux prévus par le constructeur, feux de
    détresse des deux véhicules, allure réduite ; la notice peut imposer un plateau (boîte automatique, électrique).
    Sur autoroute, seul un dépanneur agréé intervient.'
  theme: M
  sous_theme: depannage
