# M — La mécanique et les équipements : décisions de conduite.
# Les voyants eux-mêmes sont des cartes de reconnaissance (data/reconnaissance/voyants.yaml) :
# on ne les redouble pas ici. Les aides à la conduite (ADAS) vivent ici (fonction et limites) ;
# ce qui protège les occupants reste dans le thème S.
- id: m-voyants-couleurs
  question: Que signifient les couleurs des voyants du tableau de bord ?
  reponse: 'Rouge : danger ou défaillance grave, s''arrêter dès que possible en sécurité. Orange : anomalie ou fonction à surveiller, faire vérifier rapidement sans arrêt d''urgence. Vert ou bleu : information, une fonction ou des feux sont en service.'
  explication: 'À la mise du contact, tous les voyants s''allument brièvement : c''est l''autotest (un voyant qui ne s''allume pas est anormal). Exceptions au rouge : le frein à main serré (desserrer) et la batterie (rejoindre un garage sans couper le moteur).'
  theme: M
  sous_theme: tableau_de_bord
  source: Codes Rousseau — Les voyants ; Ornikar — Voyants lumineux
- id: m-pneus-pression-quand
  question: Quand et comment vérifie-t-on la pression des pneus ?
  reponse: À froid (plus de 2 h d'arrêt ou moins de 3 km parcourus), au moins une fois par mois et avant un long trajet, roue de secours comprise, à la valeur indiquée par le constructeur.
  explication: 'Valeur sur l''étiquette de portière, la trappe à carburant ou la notice. À chaud la pression monte : on ne dégonfle jamais un pneu chaud. Véhicule chargé ou autoroute : +0,2 à 0,3 bar (question officielle 2023, Q1).'
  theme: M
  sous_theme: pneus
  source: securite-routiere.gouv.fr — Pneus ; Michelin — Vérifier la pression
- id: m-pneus-usure-1-6
  question: À partir de quelle profondeur de sculpture un pneu doit-il être remplacé, et comment la vérifier ?
  reponse: 'À 1,6 mm (minimum légal) : les témoins d''usure moulés dans les rainures affleurent la bande de roulement ; on recommande de changer dès 3 mm (4 mm en hiver).'
  explication: 'Pneus lisses, toile apparente ou flanc coupé : 135 € et immobilisation. Une hernie ou une coupure sur le flanc impose le remplacement immédiat (un flanc ne se répare pas, contrairement à la bande de roulement). Sur un même essieu : mêmes marque, dimension et type.'
  theme: M
  sous_theme: pneus
  source: Code de la route, art. R314-1 ; arrêté du 18 juillet 2019
- id: m-niveau-huile
  question: Comment contrôle-t-on le niveau d'huile moteur ?
  reponse: 'Sur sol plat et moteur froid (ou dix minutes après l''arrêt) : je sors la jauge, je l''essuie, je la replonge et je lis ; le niveau doit rester entre mini et maxi.'
  explication: 'Trop d''huile provoque une surpression et une fumée bleue ; pas assez, la casse. Contrôle avant un long trajet. Le voyant rouge de pression d''huile, lui, impose l''arrêt immédiat.'
  theme: M
  sous_theme: entretien
  source: Ornikar — Huile moteur ; lepermislibre — Contrôler les niveaux
- id: m-liquide-refroidissement
  question: Quelle précaution essentielle avec le liquide de refroidissement ?
  reponse: 'Ne jamais ouvrir le bouchon du vase d''expansion moteur chaud (liquide sous pression à plus de 100 °C : brûlures graves) ; contrôler à froid, entre mini et maxi, avec un liquide antigel adapté (pas seulement de l''eau).'
  explication: 'Voyant température rouge = surchauffe : arrêt immédiat, moteur coupé, 30 min d''attente. Une baisse répétée du niveau signale une fuite. Le lave-glace se remplit lui aussi d''un produit antigel en hiver, jamais d''eau seule.'
  theme: M
  sous_theme: entretien
  source: Ornikar — Liquide de refroidissement
- id: m-liquide-frein
  question: 'Le niveau du liquide de frein a baissé : que faut-il en conclure ?'
  reponse: 'Soit les plaquettes sont usées, soit le circuit fuit : je fais contrôler sans compléter à l''aveugle ; une pédale molle ou qui s''enfonce impose l''arrêt.'
  explication: Le liquide de frein absorbe l'humidité et se remplace environ tous les deux ans. Voyant frein rouge allumé alors que le frein à main est desserré = niveau bas ou défaut du circuit.
  theme: M
  sous_theme: entretien
  source: Ornikar — Liquide de frein ; lepermislibre
- id: m-plaquettes-usure
  question: Quels signes annoncent des plaquettes de frein usées ?
  reponse: Un grincement métallique au freinage, un voyant orange d'usure et un niveau de liquide de frein qui baisse peu à peu ; le freinage devient moins efficace.
  explication: 'Des amortisseurs usés (la caisse rebondit plus d''une fois quand on appuie sur une aile) allongent aussi le freinage, jusqu''à 20 %. Les plaquettes se remplacent par essieu, avant que les disques ne soient attaqués.'
  theme: M
  sous_theme: entretien
  source: Ornikar — Plaquettes et amortisseurs ; Stych — Pannes et dysfonctionnements
- id: m-batterie-cables
  question: Dans quel ordre branche-t-on des câbles de démarrage ?
  reponse: 'Le rouge d''abord : borne + de la batterie à plat puis + de la donneuse ; ensuite le noir sur le − de la donneuse, et en dernier sur une masse métallique du véhicule en panne.'
  explication: On débranche dans l'ordre inverse. Batterie 12 V, durée de vie 4-5 ans. Le voyant batterie rouge en roulant signale un défaut de charge (alternateur, courroie), pas seulement une batterie vide.
  theme: M
  sous_theme: entretien
  importance: utile
  source: APRR — Utiliser des câbles de démarrage ; lepermislibre
- id: m-carburants-etiquettes
  question: Que signifient les étiquettes ronde, carrée et en losange sur les pistolets de carburant ?
  reponse: Rond = essence ; carré = gazole ; losange = gaz (GPL, GNV ou hydrogène).
  explication: 'Étiquetage européen depuis 2018, repris sur la trappe du véhicule. Le SP95-E10 convient à la plupart des essences depuis 2000 ; l''E85 exige un moteur flexfuel ou un boîtier homologué. Un diesel récent a un filtre à particules et souvent de l''AdBlue (bouchon bleu).'
  theme: M
  sous_theme: entretien
  importance: utile
  source: Norme EN 16942 (étiquetage 2018) ; TotalEnergies ; Ornikar
- id: m-erreur-carburant
  question: Je viens de faire le plein avec le mauvais carburant. Que faire ?
  reponse: 'Ne pas mettre le contact et faire vidanger le réservoir sur place : démarrer entraîne le mauvais carburant dans la pompe et l''injection et coûte une réparation lourde.'
  explication: 'La forme des pistolets limite l''erreur sans l''empêcher (un pistolet essence entre dans un réservoir diesel, l''inverse non). L''essence dans un moteur diesel est le cas le plus grave : elle ne lubrifie pas la pompe à injection et la détruit. L''assurance ne couvre généralement pas cette erreur.'
  theme: M
  sous_theme: entretien
  source: TotalEnergies — Erreur de carburant ; Ornikar — Carburants
- id: m-boite-auto-positions
  question: Que signifient les positions P, R, N et D d'une boîte automatique ?
  reponse: P bloque la transmission pour stationner ; R est la marche arrière ; N le point mort ; D la marche avant.
  explication: 'On démarre en P ou N, pied sur le frein ; on n''engage P ou R qu''à l''arrêt complet, on n''utilise jamais N en descente (plus de frein moteur) et le pied gauche reste au repos. Permis BVA : code 78, passerelle de 7 h vers la boîte manuelle.'
  theme: M
  sous_theme: entretien
  source: Stych — La boîte automatique ; service-public.fr F2828
- id: m-freinage-urgence-abs
  question: Comment freiner en urgence avec un véhicule équipé de l'ABS ?
  reponse: Écraser la pédale de frein à fond d'un coup et la maintenir sans relâcher malgré les vibrations, en braquant si nécessaire pour éviter l'obstacle ; avec une boîte manuelle, débrayer en même temps pour ne pas caler.
  explication: 'L''ABS empêche le blocage des roues et conserve la direction ; il ne raccourcit pas la distance de freinage. Sans ABS, des roues bloquées = perte de direction : freiner par à-coups (pompage).'
  theme: M
  sous_theme: freinage
  source: securite-routiere.gouv.fr — Dépliant vitesse ; Ornikar — ABS
- id: m-panne-freins
  question: 'Les freins ne répondent plus dans une descente : que faire ?'
  reponse: Rétrograder pour utiliser le frein moteur, serrer progressivement le frein de stationnement et viser une voie de détresse ; en dernier recours, frotter contre la glissière.
  explication: 'Le frein de stationnement agit sur les roues arrière : tiré d''un coup sec, il fait partir le véhicule en travers. Accélérateur bloqué : débrayer ou point mort, freiner, couper le contact sans verrouiller la direction.'
  theme: M
  sous_theme: freinage
  importance: utile
  source: Stych — Pannes ; En Voiture Simone — Voies de détresse
- id: m-feux-jour-limite
  question: Que font exactement les feux de jour (feux diurnes) ?
  reponse: 'Ils s''allument seuls au contact et n''éclairent qu''à l''avant en blanc : ils servent à être vu de jour, n''éclairent pas la route et n''allument pas les feux arrière.'
  explication: 'Obligatoires sur les voitures neuves de l''Union européenne depuis 2011. Dès que la visibilité baisse (pluie, crépuscule, tunnel), ils ne suffisent plus : il faut les feux de croisement, qui allument aussi les feux arrière.'
  theme: M
  sous_theme: feux
  source: Stych — Systèmes d'éclairage ; Code de la route, art. R416-6
- id: m-feux-reglage-hauteur
  question: À quoi sert la molette de réglage des feux (0 à 3) ?
  reponse: 'À abaisser le faisceau des feux de croisement quand le véhicule est chargé à l''arrière, pour ne pas éblouir : 0 à vide, cran supérieur à pleine charge.'
  explication: 'Question officielle 2023 (chargement important → « je règle la hauteur des feux »). Un véhicule chargé s''affaisse à l''arrière et le faisceau monte. Mauvais réglage : 68 € et contre-visite au contrôle technique.'
  theme: M
  sous_theme: feux
  source: Sécurité routière — Exemples de nouvelles questions (Q1) ; Ornikar — Réglage des feux
- id: m-appel-phares
  question: Un conducteur arrêté me fait un appel de phares pour me laisser passer. Puis-je m'engager ?
  reponse: 'Non : un appel de phares n''a aucune valeur réglementaire et ne donne aucune priorité. Je ne m''engage qu''après avoir vérifié moi-même que la voie est libre.'
  explication: 'De nuit, l''appel de phares est l''avertissement normal (allumage intermittent des feux, R416-2) ; le klaxon reste réservé à l''absolue nécessité, et en agglomération au seul danger immédiat (R416-1).'
  theme: M
  sous_theme: feux
  source: Code de la route, art. R416-1 et R416-2 ; Ornikar — L'appel de phares
- id: s-esp-fonction
  question: À quoi sert l'ESP (contrôle électronique de stabilité) ?
  reponse: À corriger un début de dérapage (sous-virage ou survirage) en freinant une ou plusieurs roues séparément et en réduisant le couple moteur, pour maintenir la trajectoire voulue.
  explication: 'Obligatoire sur les voitures neuves depuis 2014 en Europe. Il ne supprime pas les lois de la physique : à vitesse excessive dans un virage glissant, il ne peut rien. Son voyant clignote quand il travaille.'
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — Les aides à la conduite ; règlement (CE) 661/2009
- id: s-afu-fonction
  question: Qu'est-ce que l'AFU (aide au freinage d'urgence) ?
  reponse: Un système qui détecte un appui brusque sur la pédale de frein et applique immédiatement la pression maximale (car la plupart des conducteurs ne freinent pas assez fort en urgence) ; il peut allumer les feux de détresse.
  explication: À ne pas confondre avec le freinage automatique d'urgence (AEB), qui freine seul si le conducteur ne réagit pas à un obstacle détecté par radar ou caméra ; l'AEB équipe toutes les voitures neuves depuis juillet 2024.
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — Les aides à la conduite
- id: s-regulateur-limiteur
  question: Quelle différence entre régulateur et limiteur de vitesse ?
  reponse: Le régulateur maintient seul la vitesse choisie (pied levé) ; le limiteur empêche de dépasser la vitesse choisie mais c'est le conducteur qui accélère. Les deux se désactivent en freinant ou par un appui franc (kick-down pour le limiteur).
  explication: Le régulateur adaptatif (ACC) ajoute un radar qui conserve la distance avec le véhicule qui précède ; le régulateur simple, lui, ne voit rien devant lui.
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — Les aides à la conduite ; Codes Rousseau
- id: s-ecall
  question: Qu'est-ce que l'eCall ?
  reponse: 'L''appel d''urgence automatique : en cas de choc grave le véhicule appelle seul le 112 et transmet sa position ; un bouton SOS permet aussi de le déclencher à la main.'
  explication: Obligatoire sur les modèles homologués depuis le 31 mars 2018. Il appelle le 112, jamais le 15, et transmet la position, l'identifiant du véhicule et le nombre d'occupants. Il n'empêche pas de protéger les lieux et d'alerter soi-même.
  theme: M
  sous_theme: adas
  importance: utile
  source: Règlement (UE) 2015/758 ; securite-routiere.gouv.fr
- id: m-adas-responsabilite
  question: Mon véhicule a un détecteur d'angle mort et une alerte de franchissement de ligne. Puis-je m'y fier pour changer de voie ?
  reponse: 'Non : je contrôle mes rétroviseurs puis l''angle mort et je mets le clignotant ; ces aides assistent le conducteur et ne le remplacent pas, il reste seul responsable.'
  explication: 'C''est le principe officiel des ADAS : elles avertissent, corrigent ou évitent, mais ne surveillent pas à la place du conducteur. Marquage effacé, neige, forte pluie, soleil bas ou capteurs sales les mettent en défaut.'
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — ADAS
- id: m-ldw-lka
  question: Quelle différence entre l'alerte de franchissement de ligne et le maintien de voie ?
  reponse: L'alerte (LDW) prévient par un son ou une vibration quand je franchis une ligne sans clignotant ; le maintien de voie (LKA) corrige lui-même la trajectoire.
  explication: 'Les deux lisent le marquage au sol : une ligne effacée, couverte de neige ou noyée sous la pluie les désactive. Depuis juillet 2024, le maintien de voie d''urgence équipe toutes les voitures neuves (règlement GSR2).'
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — ADAS ; règlement (UE) 2019/2144
- id: m-allumage-automatique
  question: Les feux sont sur « AUTO » et il se met à pleuvoir en plein jour. Puis-je m'en remettre au système ?
  reponse: 'Non : le capteur réagit à la luminosité, pas à la pluie ; j''allume moi-même les feux de croisement et je vérifie le voyant vert au tableau de bord.'
  explication: 'Même prudence avec les essuie-glaces automatiques et l''assistant de feux de route. Sous la pluie, les seuls feux de jour laissent l''arrière du véhicule invisible pour ceux qui suivent.'
  theme: M
  sous_theme: adas
  source: securite-routiere.gouv.fr — ADAS ; Stych — Systèmes d'éclairage
- id: m-conduite-automatisee
  question: Avec un véhicule à conduite partiellement automatisée (niveau 2), le conducteur peut-il relâcher son attention ?
  reponse: 'Non : il garde les mains sur le volant et doit pouvoir reprendre la main à tout instant ; il reste responsable. Seuls les niveaux 3 et plus permettent de déléguer.'
  explication: 'Niveaux SAE : 0 aucune aide, 1 assistance, 2 partielle, 3 conditionnelle, 4 haute, 5 totale. En France, la conduite automatisée est encadrée depuis septembre 2022 (décret 2021-873).'
  theme: M
  sous_theme: adas
  importance: utile
  source: Décret n° 2021-873 ; securite-routiere.gouv.fr — ADAS
- id: m-panne-procedure-route
  question: 'Mon véhicule tombe en panne sur une route ordinaire : que faire dans l''ordre ?'
  reponse: Feux de détresse, je me range à droite hors de la chaussée si possible, j'enfile le gilet avant de sortir, je fais descendre les passagers à l'écart et je pose le triangle à 30 m.
  explication: 'Le triangle se place plus loin avant un virage ou un sommet de côte. Sur autoroute, on ne le pose pas si cela expose : tout le monde derrière la glissière et appel depuis la borne (tous les 2 km).'
  theme: M
  sous_theme: depannage
  source: Code de la route, art. R416-19 ; securite-routiere.gouv.fr — Véhicule en panne
- id: m-changer-roue-securite
  question: Que faut-il mettre en place avant de lever le véhicule pour changer une roue ?
  reponse: Un sol plat et stable hors de la circulation, le frein de stationnement serré avec un rapport engagé, les feux de détresse et le gilet, le cric au point de levage prévu.
  explication: 'Jamais sur la bande d''arrêt d''urgence d''une autoroute : on appelle le dépanneur agréé depuis la borne. Avec la galette montée, on vérifie sa pression (souvent élevée) et on reste à 80 km/h.'
  theme: M
  sous_theme: depannage
  importance: utile
  source: Stych — Dépannages ; Code en Poche — Changer une roue
- id: m-changer-roue-ecrous
  question: À quel moment desserre-t-on et resserre-t-on les écrous d'une roue ?
  reponse: On les desserre d'un quart de tour roue encore au sol, sinon elle tourne ; on termine le serrage en croix une fois la roue redescendue et le véhicule reposé.
  explication: Le serrage en croix répartit l'effort et évite de voiler la jante. On fait vérifier le couple de serrage et la pression de la roue montée dès que possible.
  theme: M
  sous_theme: depannage
  importance: utile
  source: Stych — Dépannages ; Code en Poche — Changer une roue
- id: m-crevaison-eclatement
  question: Un pneu éclate en roulant. Quelle réaction ?
  reponse: Je tiens fermement le volant sans freiner brutalement ; je lève le pied, je laisse le véhicule ralentir puis je me range doucement en sécurité.
  explication: 'Un freinage brusque sur un pneu éclaté déséquilibre le véhicule. Une fois arrêté : feux de détresse, gilet avant de sortir, et sur autoroute tout le monde derrière la glissière.'
  theme: M
  sous_theme: depannage
  source: Stych — Dépannages
- id: m-remorquage
  question: Un ami propose de me remorquer après une panne. Est-ce possible ?
  reponse: Sur route oui, avec une barre ou une corde homologuée, feux de détresse allumés et un conducteur au volant du véhicule tracté ; sur autoroute c'est interdit.
  explication: 'Moteur coupé, la direction et les freins n''ont plus d''assistance : ils durcissent. Sur autoroute, seul un dépanneur agréé intervient (il arrive sous 30 minutes, tarif réglementé).'
  theme: M
  sous_theme: depannage
  importance: utile
  source: lepermislibre — Remorquer un véhicule en panne ; securite-routiere.gouv.fr — Véhicule en panne
