- id: u-edpm-regle-locale
  theme: U
  sous_theme: edpm
  question: À trottinette électrique en ville, une règle locale impose casque et équipement rétro-réfléchissant
    de jour. Puis-je appliquer seulement la règle nationale moins stricte ?
  reponse: 'Non : je respecte aussi cette obligation locale.'
  explication: Depuis août 2026, Paris et la petite couronne imposent ces équipements. Vérifier les prescriptions
    locales, sans transformer cette mesure en règle nationale.
  source: Service Public — https://www.service-public.gouv.fr/particuliers/actualites/A19037
