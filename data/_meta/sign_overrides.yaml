agent-bras-tendu-face:
  signification: 'Bras tendu(s) à l''horizontale : les usagers qui voient l''agent de face ou de dos s''arrêtent ; ceux qui
    le voient de profil passent.'
  conduite: null
  complement: L’ordre reste valable quand l’agent baisse les bras.
agent-bras-leve:
  signification: 'Bras levé verticalement : « attention, arrêt » pour tous, sauf ceux déjà engagés dans l''intersection, qui
    la dégagent.'
  complement: Équivalent du jaune puis du rouge pour tout le monde. Les injonctions de l'agent prévalent sur les feux et les
    panneaux.
sr3a:
  signification: 'Panneau d''information annonçant une zone de contrôle automatisé de la vitesse : « Pour votre sécurité,
    contrôles automatiques ».'
  conduite: Vérifier et respecter la limitation en vigueur ; ce panneau ne permet pas de déduire la distance exacte jusqu’au
    radar.
  complement: 'Panneau non obligatoire : les radars ne sont plus systématiquement annoncés. Les panneaux SR informent sans
    rien prescrire.'
j1:
  signification: Balise blanche à collier rétroréfléchissant blanc, implantée à l'extérieur d'un virage pour en matérialiser
    le tracé.
  complement: null
  piege: La bande blanche repère un virage ; la bande rouge repère une intersection. La balise à bande noire oblique guide le long du bord de la chaussée.
  comparaisons:
  - ref: j3
    legende: 'Bande rouge : intersection.'
  - ref: j6
    legende: 'Bande noire : guidage le long de la chaussée.'
j3:
  piege: La bande rouge repère une intersection ; la bande blanche, un virage. Cette balise ne dit pas qui est prioritaire.
  complement: null
  comparaisons:
  - ref: j1
    legende: 'Bande blanche : virage.'
j4:
  signification: 'Balise à chevron(s) blanc(s) sur fond bleu, à l''extérieur d''un virage dangereux : la pointe indique le
    sens du virage.'
  complement: null
  piege: Les chevrons sur fond bleu guident dans un virage. Les flèches blanches divergentes sur fond vert signalent une séparation de courants de circulation.
  comparaisons:
  - ref: j14a
    legende: 'Flèches divergentes : séparation de courants de circulation.'
j6:
  signification: Piquets blancs (1 m) espacés le long de l'accotement, portant une bande noire oblique et un catadioptre blanc.
  piege: La bande noire oblique et le réflecteur blanc guident le long de la chaussée. Une bande blanche repère un virage ; une bande rouge, une intersection.
  complement: null
  comparaisons:
  - ref: j1
    legende: 'Bande blanche : virage.'
  - ref: j3
    legende: 'Bande rouge : intersection.'
j10:
  signification: Balises blanches à trois, deux puis une bande rouge oblique, placées à 150 m, 100 m et 50 m du passage à
    niveau (hors agglomération).
  conduite: 'Ralentir progressivement : à la balise à une seule bande, le passage à niveau est à 50 m.'
  complement: La première balise, à trois bandes, accompagne le panneau annonçant le passage à niveau. Ces balises peuvent manquer en agglomération.
feu-rouge:
  signification: 'Arrêt absolu : interdiction de franchir la ligne d''effet des feux, y compris pour tourner à droite.'
  conduite: S'arrêter avant la ligne d'arrêt, sans empiéter sur le passage piéton ni le sas vélo ; attendre le vert.
  complement: Sans ligne au sol, l'arrêt se fait à l'aplomb du feu.
  piege: Pas de « tourne à droite au rouge » en France. Les roues au-delà de la ligne, c'est déjà un feu grillé.
feu-jaune-fixe:
  signification: 'Annonce l''imminence du rouge : arrêt obligatoire, sauf si l''on ne peut plus s''arrêter dans des conditions
    de sécurité suffisantes.'
  conduite: Freiner et s'arrêter si c'est possible sans danger ; sinon franchir sans accélérer.
  complement: 'Officiellement « jaune » : le Code ne parle pas d''orange. Franchir alors qu''on pouvait s''arrêter : 35 €,
    sans retrait de points.'
  piege: 'Ne jamais accélérer pour « passer à l''orange » : le jaune impose l''arrêt, sauf impossibilité.'
feu-vert:
  signification: Passage autorisé, à condition que l'intersection soit dégagée et en cédant le passage aux piétons engagés.
  conduite: Ne s'engager que si l'on peut dégager le carrefour ; en tournant, céder aux piétons et aux véhicules d'en face.
  complement: Il n'existe pas de feu vert clignotant en France.
  piege: Le vert ne donne pas la priorité sur les piétons ; il prévaut sur un STOP ou un cédez-le-passage placé dessous.
feu-jaune-clignotant:
  signification: Passage prudent, en respectant les panneaux de priorité et les autres règles de priorité.
  conduite: Ralentir et appliquer le panneau placé sous le feu (STOP, cédez-le-passage) ou, à défaut, la priorité à droite.
  complement: 'Au milieu : feux momentanément mis au clignotant. En bas : il peut remplacer le vert dans un cycle normal,
    ce n’est pas forcément une panne.'
  piege: Un feu jaune clignotant seul sur un panneau (R1) n'est qu'un renfort d'attention, pas un régime de priorité.
feu-rouge-clignotant:
  signification: "Un ou deux feux rouges alternés imposent l'arrêt absolu devant un danger : passage à niveau, pont mobile, sortie de pompiers ou traversée de tram."
  conduite: S'arrêter avant le feu et attendre son extinction ; au passage à niveau, ne jamais contourner les demi-barrières.
  complement: null
  piege: 'Ne jamais franchir même si rien n''est visible : le train peut arriver dans quelques secondes.'
r12:
  signification: 'Feux pour piétons à deux couleurs, sans jaune : silhouette rouge = traversée interdite, silhouette verte
    = traversée autorisée.'
  conduite: 'En voiture : céder le passage aux piétons engagés, même si leur feu vient de passer au rouge.'
  complement: null
  piege: Vert autorise à commencer la traversée ; au rouge, ne pas s’engager. En voiture, laisser finir les piétons déjà engagés.
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
r13:
  signification: Le symbole du vélo ou du bus indique à quels usagers ce feu s’adresse.
  conduite: En voiture, je suis le feu destiné à ma voie, pas le feu portant un vélo ou un bus. À vélo, je suis le feu avec le symbole vélo.
  complement: 'Un feu pour les vélos peut leur donner le départ avant les autres véhicules : je ne démarre pas en voiture tant que mon propre feu reste rouge.'
r14:
  signification: 'Feux tricolores dont les trois feux portent une flèche : ils ne concernent que les usagers qui vont dans
    cette direction.'
  conduite: Se placer dans la voie de sa direction et obéir au feu fléché ; céder quand même aux piétons.
  piege: Ne pas confondre avec R16, la flèche jaune clignotante (passer en cédant le passage).
  complement: null
r16:
  signification: 'Flèche jaune clignotante à côté d''un feu tricolore : les usagers allant dans cette direction peuvent passer,
    même au rouge, sans aucune priorité.'
  conduite: Céder le passage aux piétons et aux véhicules qui ont le vert avant de tourner ; s'arrêter si nécessaire.
  complement: Souvent pour le tourne-à-droite. Sans R16, tourner à droite au rouge reste interdit.
  piege: 'Flèche jaune clignotante : autorisation conditionnelle, sans priorité sur les usagers dont on coupe la trajectoire.'
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
r17:
  signification: 'Feux réservés aux bus et tramways, en barres blanches : barre verticale = passage, disque = arrêt imminent,
    barre horizontale = arrêt.'
  conduite: 'En voiture, suivre son propre feu ; se méfier d''un bus dont la barre est verticale : il va passer.'
  complement: null
marq-ligne-annonce:
  nom: Ligne d'annonce d'une ligne continue (T3) avec flèches de rabattement
  signification: 'Traits longs et intervalles courts, accompagnés de flèches obliques : une ligne continue commence bientôt,
    il faut se rabattre à droite et ne plus entreprendre de dépassement.'
  piege: 'Les flèches de rabattement (trois, espacement décroissant) ne désignent pas une direction : elles ordonnent de se
    rabattre.'
marq-ligne-continue:
  signification: 'Ligne blanche continue : interdiction de la franchir et de la chevaucher.'
  conduite: Ne pas dépasser ni la franchir ; on peut la chevaucher pour dépasser un cycliste ou un EDPM, avec visibilité.
  complement: 'Exception R412-19 : la chevaucher, sans la franchir, pour dépasser un cycle, un EDPM ou un cyclomobile léger.'
  piege: 'Franchir une ligne continue : 135 € et 3 points ; la chevaucher : 135 € et 1 point.'
marq-ligne-discontinue-t1:
  signification: 'Ligne discontinue à grands intervalles : je peux la franchir pour dépasser ou changer de direction si les autres conditions le permettent.'
  conduite: Dépasser seulement si la visibilité le permet, et terminer avant la ligne d'annonce ou la ligne continue.
  complement: null
  piege: 'Une ligne discontinue autorise le franchissement mais n''oblige à rien : le dépassement reste soumis aux règles
    générales.'
marq-ligne-dissuasion:
  signification: 'Ligne discontinue à intervalles courts : elle dissuade de dépasser. Je ne dépasse qu’un véhicule lent, avec assez de visibilité et de place.'
  conduite: Ne pas dépasser un véhicule à allure normale ; dépasser un tracteur, un cyclomoteur ou un engin lent reste possible.
  complement: Fréquente sur routes sinueuses et à l’approche des sorties d’autoroute.
marq-ligne-mixte:
  signification: 'Ligne continue accolée à une ligne discontinue : c''est la ligne la plus proche de mon véhicule qui s''applique.'
  conduite: 'Discontinue de mon côté : je peux dépasser ; continue de mon côté : c''est interdit.'
  complement: 'R412-20 : la ligne discontinue doit être la plus proche AU DÉBUT de la manœuvre, qui doit s''achever avant
    la fin de la partie discontinue.'
marq-fleches-directionnelles:
  signification: 'Flèches blanches peintes dans une voie avant une intersection : elles imposent la direction à suivre depuis
    cette voie.'
  conduite: Choisir sa voie à l'avance ; trompé de voie, suivre la direction imposée et faire demi-tour plus loin.
  complement: Voies de présélection et de sortie. Avec une ligne continue entre les voies, changer de voie est interdit.
marq-ligne-stop:
  signification: 'Large ligne blanche continue (50 cm) en travers de la voie : c''est à elle, et non au panneau STOP, que
    l''arrêt se fait.'
  complement: null
  piege: Ligne transversale CONTINUE = STOP ; ligne transversale DISCONTINUE (T'2) = cédez-le-passage.
marq-ligne-cedez:
  signification: 'Ligne blanche discontinue en travers de la voie : je cède le passage avant de la franchir, sans arrêt obligatoire si la voie est libre.'
  complement: Se trouve aussi aux entrées de giratoire et en fin de voie d’insertion.
  piege: Les triangles blancs au sol signalent en France un ralentisseur, pas un cédez-le-passage.
marq-ligne-effet-feux:
  signification: 'Ligne blanche discontinue fine, en travers de la voie avant un feu : c''est là que l''on s''arrête au rouge.'
  conduite: S'arrêter avant cette ligne au rouge ou au jaune, sans empiéter sur le passage piéton ni le sas vélo.
  complement: Sans marquage, l'arrêt se fait avant le passage piéton, sinon à l'aplomb du feu.
  piege: Franchir la ligne d'effet des feux au rouge = feu grillé (135 €, 4 points), même en s'arrêtant ensuite.
marq-passage-pietons:
  nom: Passage pour piétons (marquage au sol)
  signification: Bandes blanches parallèles à l'axe de la chaussée matérialisant la traversée des piétons ; s'y arrêter ou
    y stationner est interdit.
  conduite: Céder le passage au piéton engagé ou qui manifeste l'intention de traverser ; ne pas dépasser un véhicule arrêté
    devant.
  complement: Arrêt et stationnement interdits dans les 5 m en amont du passage.
  piege: 'Refus de priorité à un piéton : 135 € et 6 points.'
marq-passage-cyclistes:
  signification: Traversée de chaussée réservée aux cyclistes, matérialisée par deux rangées de carrés blancs de 50 cm.
  conduite: Je contrôle la traversée avant de tourner et respecte les priorités indiquées, notamment un éventuel cédez-le-passage.
  piege: 'En ligne droite, c’est la signalisation du carrefour qui fixe la priorité, pas le marquage. Mais en tournant,
    je cède aux cyclistes de la piste que je coupe (R415-3 et R415-4).'
marq-zebra:
  signification: 'Zone hachurée blanche interdite à la circulation, à l''arrêt et au stationnement : îlot peint, biseau, musoir.'
  conduite: Ne pas y circuler, y stationner ni s'en servir pour dépasser ou tourner.
  complement: Zébra bordé d'une ligne continue = infranchissable ; bordé d'une ligne discontinue = franchissable en cas de
    nécessité.
marq-ligne-rive:
  signification: 'Ligne discontinue au bord de la chaussée : elle sépare la chaussée de l’accotement.'
  conduite: Rester à gauche de la ligne ; on peut la franchir pour s'arrêter sur l'accotement ou entrer dans une propriété.
  complement: Continue, elle signale un accotement impraticable ou interdit à l'arrêt.
  piege: 'Je repère d’abord sa position : la ligne de rive longe le bord de la chaussée ; une ligne axiale sépare les sens de circulation.'
marq-ligne-bau-t4:
  signification: Ligne discontinue à très longs traits (39 m) et vides de 13 m délimitant la bande d'arrêt d'urgence.
  conduite: Ne pas circuler sur la BAU ; garder deux traits avec le véhicule précédent (un trait = danger).
  complement: 'À 130 km/h, deux traits ≈ 90 m, soit un peu plus de 2 secondes. Circuler sur la BAU : 135 €, 3 points.'
marq-voie-insertion:
  signification: Ligne discontinue large séparant une voie d’insertion ou de sortie de la chaussée principale.
  conduite: 'Voie d''accélération : prendre la vitesse du trafic et s''insérer en cédant le passage. Voie de décélération
    : freiner dedans.'
  complement: null
  piege: 'La largeur des traits aide à reconnaître une voie spéciale. Je regarde aussi où mène la voie : rejoindre la circulation ou en sortir ne demande pas la même manœuvre.'
marq-bande-cyclable:
  signification: Voie réservée aux cyclistes sur la chaussée, repérée par une ligne discontinue large et un symbole de vélo.
  conduite: Ne pas y rouler ni y stationner ; contrôler l'angle mort avant de la couper pour tourner à droite.
  complement: Pour les cyclistes, le rond bleu rend l’aménagement obligatoire ; le carré bleu le conseille. La bande peut être à contresens de la circulation générale.
  piege: 'Bande cyclable = sur la chaussée ; piste cyclable = séparée de la chaussée. S''y arrêter : 135 €.'
marq-couloir-bus:
  signification: Voie réservée aux autobus, repérée par une ligne large et l’inscription « BUS ».
  conduite: Ne pas y circuler ni y stationner ; la traverser seulement pour tourner, si la ligne est discontinue.
  complement: Le panneau de voie réservée précise les usagers autorisés. Une ligne continue ne se franchit pas. Certains couloirs sont à contresens.
  piege: 'Y circuler : 135 € (R412-7) ; s’y arrêter ou y stationner : « très gênant », 135 € (R417-11).'
marq-sas-velo:
  signification: Espace réservé aux cyclistes entre deux lignes d'effet des feux (3 à 5 m), à un carrefour à feux.
  conduite: 'En voiture ou à moto : s''arrêter à la première ligne, jamais dans le sas.'
  complement: Il permet aux cyclistes de se placer devant, bien visibles, et de démarrer les premiers.
  piege: 'S’engager dans le sas quand on risque d’y rester bloqué est une infraction (R415-2) ; franchir la ligne
    d’arrêt des voitures au rouge, c’est un feu grillé : 135 € et 4 points.'
marq-cvcb:
  signification: 'Chaussée étroite sans ligne axiale : une voie centrale à double sens pour les véhicules et deux rives pour
    les cyclistes.'
  conduite: Rouler au centre, pas sur la rive ; pour croiser, se déporter après avoir vérifié l'absence de cycliste.
  complement: null
marq-ligne-jaune-zigzag:
  conduite: Ne pas s'y arrêter, même brièvement ; ne pas gêner le bus qui repart.
  complement: Aux arrêts de bus. S’y arrêter ou stationner est un stationnement gênant, avec fourrière possible.
  piege: 'Un couloir bus, lui, est très gênant : 135 €.'
marq-livraison:
  signification: 'Emplacement réservé à l''arrêt pour chargement/déchargement : ligne jaune discontinue, croix jaune et inscription
    « LIVRAISON ».'
  complement: Certaines aires (ligne discontinue simple) sont ouvertes au stationnement la nuit (20 h – 7 h), dimanches et
    fêtes ; les aires à double ligne restent réservées 24 h/24.
marq-ralentisseur-triangles:
  signification: Trois triangles blancs (« dents de requin »), pointes dans le sens de la circulation, peints sur la rampe
    d'un ralentisseur.
  complement: En France, les triangles blancs au sol signalent un ralentisseur, pas un cédez-le-passage.
a2b:
  complement: null
  piege: Le triangle annonce le ralentisseur ; le carré bleu en indique l’emplacement.
  conduite: Je ralentis avant le ralentisseur et respecte la limitation affichée, souvent 30 km/h.
  comparaisons:
  - ref: c27
    legende: 'Carré bleu : le ralentisseur est ici.'
a7:
  conduite: Ralentir, être prêt à s'arrêter ; ne jamais s'engager si l'on risque d'être immobilisé sur les voies.
  complement: null
  piege: Le dépassement n'est interdit qu'aux passages à niveau SANS barrière ni demi-barrière (R414-12).
a9b:
  signification: 'Annonce la traversée de voies de tramways : le tramway est prioritaire, il ne peut ni freiner court ni s''écarter.'
  conduite: Ralentir, regarder des deux côtés et lui céder le passage, même sur une route prioritaire.
  complement: null
a13b:
  nom: Passage pour piétons (annonce du danger)
  complement: null
  comparaisons:
  - ref: c20a
    legende: 'Carré bleu : le passage est ici.'
  - ref: a13a
    legende: 'Deux enfants : lieu fréquenté par des enfants.'
a16:
  signification: Annonce une descente dangereuse ; le nombre indiqué (ex. 10 %) est le pourcentage de pente.
  conduite: Rétrograder pour utiliser le frein moteur ; en montagne, le véhicule qui descend facilite le croisement.
  complement: null
  piege: 'Le pourcentage est la pente, pas une vitesse : 10 % = 10 m de dénivelé pour 100 m.'
a18:
  signification: Annonce qu'après une section à sens unique ou à chaussées séparées, la circulation redevient bidirectionnelle
    sur la même chaussée.
  conduite: 'Serrer à droite : la partie gauche de la chaussée n''est plus une voie dans mon sens.'
  complement: Seul panneau de danger implanté à l'endroit même du danger, et non 150 m avant.
  piege: 'Les deux flèches opposées dans le triangle annoncent une circulation à double sens : je dois désormais attendre des véhicules en face.'
a24:
  signification: 'Annonce une zone exposée à des vents latéraux violents : pont, viaduc, plaine, sortie de tunnel.'
  conduite: Ralentir, tenir le volant à deux mains, garder ses distances des véhicules hauts et des deux-roues.
  complement: Une manche à air peut préciser l’endroit exposé et montrer la direction et la force du vent.
  piege: Le symbole est ROUGE, exception parmi les symboles noirs des panneaux de danger.
d-couleur-bleu:
  complement: 'Code des couleurs : bleu = autoroute ; vert = grande liaison ; blanc = itinéraire local ; jaune = déviation
    ; marron = touristique.'
b31:
  conduite: Reprendre la vitesse réglementaire de la route et les manœuvres à nouveau autorisées.
  signification: Fin des interdictions signalées imposées aux véhicules en mouvement.
  piege: Ne met pas fin aux interdictions d’arrêt ou de stationnement ; les règles générales restent applicables.
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
c6:
  conduite: "Ne pas s'arrêter sur l'emplacement. En agglomération, ralentir et au besoin s'arrêter pour laisser le bus quitter son arrêt lorsqu'il annonce son départ par le clignotant (R412-11)."
  complement: Zigzag jaune au sol.
c12:
  signification: 'La chaussée est à sens unique : tous les véhicules circulent dans le sens de la flèche ; le demi-tour y
    est impossible.'
  conduite: Rester à droite, sauf pour tourner à gauche ou dépasser ; attention aux cyclistes à contresens si double-sens
    cyclable.
  complement: À l’autre extrémité, un sens interdit empêche les véhicules d’entrer face à moi.
  piege: La flèche sur fond bleu carré indique un sens unique ; dans un rond bleu, elle impose d’aller tout droit.
  comparaisons:
  - ref: b21b
    legende: 'Rond bleu : tout droit obligatoire.'
c18:
  signification: Dans ce passage étroit, j’ai la priorité sur les véhicules venant en sens inverse.
  complement: En face, le panneau rond bordé de rouge impose aux autres véhicules de me céder le passage.
  piege: 'Ma direction est celle de la flèche vers le haut. La flèche rouge descendante représente le sens opposé : c’est lui qui cède.'
  comparaisons:
  - ref: b15
    legende: 'De l’autre côté : le sens opposé doit céder.'
c20a:
  nom: Passage pour piétons (panneau de position)
  signification: Position d'un passage pour piétons matérialisé au sol.
  conduite: Céder le passage aux piétons engagés ou qui manifestent l'intention de traverser ; ne pas dépasser devant un passage.
  complement: Arrêt et stationnement interdits dans les 5 m en amont du passage ; les emplacements matérialisés y sont tolérés
    jusqu’à fin 2026.
  piege: Le triangle annonce un passage pour piétons plus loin ; le carré bleu en indique l’emplacement.
  comparaisons:
  - ref: a13b
    legende: 'Triangle : passage pour piétons plus loin.'
c25a:
  complement: 'Illustration simplifiée : la ligne des routes à chaussées séparées (110 km/h) n’est pas représentée.'
  piege: null
  signification: Rappel des limitations générales de vitesse en France, selon le type de route.
  conduite: Tenir compte aussi des limitations locales, de la météo et du permis probatoire.
c27:
  complement: Au sol, trois triangles blancs sur la rampe.
  piege: Le triangle annonce le ralentisseur ; le carré bleu en indique l’emplacement.
  comparaisons:
  - ref: a2b
    legende: 'Triangle : le ralentisseur est plus loin.'
c28:
  signification: Annonce une réduction du nombre de voies (ex. de 3 à 2, de 2 à 1).
  complement: null
  piege: Celui dont la voie disparaît doit s'insérer ; celui qui reste dans la voie qui continue est prioritaire.
c50:
  complement: "Dans l'exemple ci-contre, la mention locale autorise l'arrêt sur le trottoir. C'est une exception : sans cette autorisation, l'arrêt sur le trottoir est très gênant (135 €)."
c65a:
  signification: 'Péage « en flux libre » (sans barrière, plaques lues sous un portique) : indique les moyens de paiement.'
  conduite: Ne pas s'arrêter sous le portique ; payer sous 72 h en ligne, en point de vente ou par télépéage.
  complement: 'Sans barrière : le paiement se fait après le passage, dans le délai indiqué.'
c107:
  signification: 'Début d''une route pour automobiles réservée aux véhicules à moteur : interdite aux piétons, cycles, cyclomoteurs
    et véhicules lents.'
  conduite: S'insérer par la voie d'accélération ; ni arrêt, ni stationnement, ni demi-tour, ni marche arrière.
  complement: 'Hors agglomération : 110 km/h sur chaussées séparées par terre-plein central, 80 sur une voie par sens sans
    séparateur ni relèvement ; appliquer les limites plus basses et les conditions météo/probatoires.'
  piege: 'Le panneau ne fixe pas à lui seul la vitesse maximale : lire la route, les limitations et les conditions.'
c111:
  signification: 'Entrée d''un tunnel : feux de croisement obligatoires, demi-tour, arrêt et stationnement interdits hors
    aires d''urgence.'
  conduite: J’allume les feux de croisement, retire mes lunettes de soleil et garde au moins deux secondes d’écart, ou davantage si un panneau impose une distance supérieure.
  complement: null
  piege: 'Carré bleu (indication) mais il emporte de vraies obligations : feux de croisement, pas de demi-tour, pas d''arrêt.'
c207:
  signification: 'Début d''autoroute : route réservée aux véhicules à moteur rapides, sans croisement à niveau ; arrêt, demi-tour
    et marche arrière interdits.'
  conduite: S'insérer par la voie d'accélération en cédant le passage, rouler à droite, ne pas circuler sur la BAU.
  complement: 130 km/h (110 sous la pluie, 110 en permis probatoire) ; 80 minimum sur la voie de gauche.
  piege: 'Le symbole de pont indique une autoroute. La voiture vue de face indique une route réservée aux automobiles : elle n’est pas forcément une autoroute.'
  comparaisons:
  - ref: c107
    legende: 'Voiture de face : route réservée aux automobiles.'
b0:
  piege: Le cercle rouge vide interdit la circulation dans les deux sens. Le disque rouge à barre blanche interdit d’entrer par ce côté.
  comparaisons:
  - ref: b1
    legende: 'Barre blanche : entrée interdite par ce côté.'
b1:
  signification: 'Interdiction de s''engager : la voie est à sens unique dans l''autre sens. Tous les véhicules, cycles compris,
    sauf panonceau.'
  conduite: Je ne m’engage pas. Une exception « sauf vélos » peut autoriser les cyclistes à emprunter cette entrée.
  complement: Dans les zones 30 et zones de rencontre, des cyclistes peuvent arriver en face (double-sens cyclable).
  piege: Le cercle rouge vide interdit la circulation dans les deux sens ; la barre blanche interdit l’entrée par ce côté.
  comparaisons:
  - ref: b0
    legende: 'Cercle vide : circulation interdite dans les deux sens.'
b1j:
  signification: 'Sens interdit renforcé par un fond jaune, notamment sur les bretelles de sortie : je ne m’engage pas.'
  complement: Sur les bretelles de sortie, face aux usagers qui pourraient s'y engager par erreur.
  piege: 'Ici le fond jaune n''est pas une signalisation temporaire : c''est un renforcement (carré, exception à la forme
    ronde des B).'
b2c:
  complement: Même sans ce panneau, le demi-tour est interdit sur autoroute, route express et dans un tunnel. Il ferait aussi circuler à contresens dans une rue à sens unique.
b3:
  signification: Interdiction de dépasser les véhicules à moteur, sauf les deux-roues motorisés sans side-car.
  conduite: Rester derrière voitures, camions, tracteurs ; on peut encore dépasser une moto solo, un cyclomoteur, un cycliste.
  complement: null
  piege: 'Sur les panneaux d''interdiction de dépasser, la voiture ROUGE est à gauche : c''est celle qui dépasserait.'
b6a1:
  signification: Stationnement interdit du côté du panneau, jusqu'à la prochaine intersection. L'arrêt reste autorisé.
  conduite: Ne pas stationner ; on peut s'arrêter pour déposer un passager ou charger rapidement.
  complement: null
  piege: Une barre interdit le stationnement ; deux barres en croix interdisent aussi l’arrêt. Le panneau de fin de toutes les interdictions ne met pas fin à cette règle de stationnement.
  comparaisons:
  - ref: b6d
    legende: 'Croix rouge : arrêt et stationnement interdits.'
b6a2:
  signification: Stationnement interdit du côté du panneau du 1er au 15 du mois ; autorisé de ce côté du 16 à la fin.
  conduite: Du 1er au 15, se garer de l'autre côté.
  complement: Changement de côté le 15 et le dernier jour du mois, entre 20 h 30 et 21 h.
  piege: Les chiffres portés sont les jours où le stationnement est INTERDIT de ce côté.
b6a3:
  conduite: Du 16 à la fin du mois, se garer de l'autre côté.
  complement: Changement de côté le 15 et le dernier jour du mois, entre 20 h 30 et 21 h.
b6d:
  complement: null
  piege: 'Équivalent au sol : ligne jaune CONTINUE sur la bordure (arrêt interdit) ; jaune discontinue = stationnement interdit
    seulement.'
b14:
  signification: Interdiction de dépasser la vitesse indiquée, à partir du panneau.
  conduite: Être déjà à cette vitesse au niveau du panneau ; c'est un maximum, pas une consigne.
  complement: Posée sur un panneau de danger, elle ne vaut que pour ce danger.
  piege: Pour une vitesse, le rond rouge fixe un maximum, le rond bleu un minimum et le carré bleu une vitesse conseillée.
  comparaisons:
  - ref: b25
    legende: 'Rond bleu : vitesse minimale.'
  - ref: c4a
    legende: 'Carré bleu : vitesse conseillée.'
b15:
  signification: 'Dans un passage étroit, céder le passage aux véhicules venant en sens inverse : la priorité est à ceux d''en
    face.'
  complement: De l’autre côté du passage étroit, le panneau carré bleu donne la priorité au sens opposé.
  piege: 'Ma direction est celle de la flèche vers le haut : elle est rouge, je cède le passage.'
  comparaisons:
  - ref: c18
    legende: 'De l’autre côté : le sens opposé a la priorité.'
b16:
  complement: Hors panneau, le klaxon est interdit en agglomération sauf danger immédiat ; de nuit, avertir par appels de
    phares.
e31:
  signification: 'Nom d''un lieu traversé qui n''est pas une agglomération : lieu-dit, hameau, forêt, col, pont. Aucune règle
    particulière.'
  complement: null
  piege: Lettres ITALIQUES blanches sur fond noir = lieu-dit ; lettres droites noires sur fond blanc bordé de rouge = agglomération.
  conduite: 'Ce panneau ne change pas la limitation : je conserve celle applicable à la route, sauf autre panneau de vitesse.'
eb10:
  signification: 'Entrée d''agglomération : à partir du panneau, 50 km/h sauf indication, priorité à droite en l''absence
    de signalisation, klaxon interdit sauf danger.'
  conduite: Être à 50 km/h au niveau du panneau ; redoubler d'attention (piétons, cyclistes, intersections).
  complement: null
  piege: Un E31 (lieu-dit, lettres italiques blanches sur fond noir) ne limite PAS la vitesse à 50.
b21-1:
  complement: Placé en face de l'usager, au-delà de l'endroit où il doit tourner.
  piege: 'Flèche horizontale : je tourne avant le panneau. Flèche coudée : je tourne à la prochaine intersection.'
  comparaisons:
  - ref: b21c1
    legende: 'Flèche coudée : à la prochaine intersection.'
b22a:
  signification: Piste ou bande obligatoire pour les cycles concernés ; les EDPM et cyclomobiles légers doivent aussi l’utiliser
    dans les conditions prévues.
  conduite: 'En voiture : ne pas y rouler ni s''y arrêter ; attention aux cyclistes en la coupant pour tourner.'
  complement: 'Un panonceau peut l’ouvrir aux cyclomoteurs. S’y arrêter ou stationner : très gênant, 135 €.'
  piege: Pour les cyclistes, le rond bleu impose la piste ; le carré bleu la conseille.
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
  comparaisons:
  - ref: c113
    legende: 'Carré bleu : conseillé aux cyclistes.'
b25:
  signification: Obligation de circuler au moins à la vitesse indiquée, sauf si les conditions ne le permettent pas.
  complement: null
  piege: Rond BLEU avec chiffre = vitesse MINIMALE ; rond rouge = maximale.
b26:
  conduite: En voiture, vérifier les pneus et le complément du panneau ; avec « Chaînes à neige obligatoires », monter les
    chaînes avant la section.
  complement: null
  piege: Chaînes dans le coffre ne suffisent pas si le véhicule doit être équipé de chaînes montées.
  signification: 'Équipement hivernal en service : chaînes sur au moins deux roues motrices, ou pneus hiver admis en équivalence
    pour les catégories prévues.'
  source: "Arrêté du 23 juin 2021, art. 7 (IISR 67-1) ; D314-8, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12"
b27a:
  signification: Voie réservée aux autobus et cars de lignes régulières ; interdite aux autres véhicules, sauf catégories
    autorisées par panonceau.
  conduite: Ne pas y circuler ni y stationner ; on peut la traverser pour tourner ou accéder à un immeuble.
  complement: null
  piege: 'Exception au « rond bleu = obligation » : les bus ne sont pas obligés d''emprunter le couloir.'
ab1:
  signification: 'Annonce une intersection où s''applique la priorité à droite : je cède aux véhicules venant de ma droite.'
  conduite: Ralentir, contrôler à droite et céder le passage ; ne pas compter sur sa propre priorité.
  complement: null
  piege: 'Le panneau ne crée pas la règle, il la rappelle : la priorité à droite s''applique aussi sans panneau.'
ab2:
  signification: Annonce une intersection où je suis prioritaire sur les routes transversales, pour cette intersection seulement.
  conduite: 'Continuer sans ralentir inutilement, mais rester vigilant : un usager peut griller son STOP.'
  complement: null
  piege: Le triangle donne la priorité à la prochaine intersection seulement. Le losange jaune indique une route prioritaire jusqu’au panneau de fin.
  comparaisons:
  - ref: ab6
    legende: 'Losange jaune : route prioritaire.'
ab3a:
  signification: À l'intersection, céder le passage aux véhicules circulant sur la route croisée ou rejointe, sans obligation
    de s'arrêter.
  conduite: Ralentir, contrôler, s'arrêter à la ligne discontinue si nécessaire, et ne s'engager qu'en sécurité.
  complement: Se trouve aussi en fin de voie d’insertion et aux entrées de giratoire.
  piege: La pointe vers le bas permet de reconnaître le cédez-le-passage, même de dos. Si un feu fonctionne, je suis ses indications.
ab4:
  signification: Arrêt complet à la ligne ; sans ligne, à la limite de la chaussée abordée. Puis céder le passage aux véhicules
    de l’autre route.
  conduite: Immobiliser les roues, même si la voie semble libre.
  complement: Un feu en fonctionnement prévaut sur ce panneau de priorité.
  piege: Le panneau est reconnaissable de dos à sa forme octogonale.
  source: "Code de la route, R415-6, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842245/"
ab5:
  complement: null
  piege: 'Je ne m’arrête pas devant ce signal avancé : l’arrêt se fait au STOP annoncé plus loin.'
  signification: Annonce un STOP à la distance indiquée, souvent 150 m.
ab6:
  signification: 'Je suis sur une route prioritaire : les routes transversales cèdent le passage jusqu’au panneau de fin de priorité, le losange jaune barré.'
  conduite: Continuer sans ralentir inutilement ; céder quand même aux piétons, tramways et véhicules prioritaires en intervention.
  complement: null
  piege: 'Un STOP ou un cédez-le-passage rencontré ensuite l''emporte : le panneau le plus récent s''applique.'
  comparaisons:
  - ref: ab7
    legende: 'Losange barré : fin du caractère prioritaire.'
ab25:
  signification: 'Annonce un carrefour à sens giratoire : les usagers déjà engagés dans l''anneau sont prioritaires.'
  conduite: Ralentir, céder le passage à l'anneau, clignotant gauche si je dépasse la moitié, clignotant droit avant de sortir.
  complement: null
  piege: À l’entrée d’un giratoire avec cédez-le-passage, je laisse passer ceux qui circulent dans l’anneau. Sur une intersection circulaire sans ce régime, la priorité à droite peut donner priorité aux entrants.
b6b2:
  signification: 'Entrée d''une zone à stationnement alterné semi-mensuel : du 1er au 15 côté impair, du 16 à la fin côté
    pair.'
  conduite: Changer de côté le 15 et le dernier jour du mois, entre 20 h 30 et 21 h.
  complement: 'Mémo : « 1 » est impair.'
b30:
  signification: 'Entrée d’une zone 30 : 30 km/h dans les rues de la zone, jusqu’au panneau de sortie de zone.'
  conduite: Rouler à 30 km/h maximum ; s'attendre à des cyclistes à contresens et à des aménagements (plateaux, chicanes).
  complement: Double-sens cyclable par défaut.
  piege: Le rond « 30 » limite la vitesse sur la section concernée ; le panneau « ZONE 30 » s’applique aussi après les intersections, jusqu’à la sortie de zone.
  comparaisons:
  - ref: b14
    legende: 'Rond de vitesse : une section, sans portée de zone.'
b52:
  signification: 'Entrée d''une zone de rencontre : piétons prioritaires sur toute la chaussée, vitesse limitée à 20 km/h,
    stationnement sur emplacements seulement.'
  conduite: Rouler à 20 km/h maximum et céder le passage aux piétons, sans qu'ils aient à s'écarter.
  complement: Double-sens cyclable par défaut.
  piege: 'Trois vitesses : aire piétonne = allure du pas ; zone de rencontre = 20 ; zone 30 = 30.'
b54:
  signification: 'Entrée d''une aire piétonne : zone affectée aux piétons, qui y sont prioritaires ; seuls les véhicules autorisés
    y circulent, à l''allure du pas.'
  conduite: Ne pas y entrer sans autorisation (panonceau) ; sinon rouler au pas, priorité absolue aux piétons.
  complement: null
  piege: 'L’aire piétonne se parcourt à l’allure du pas pour les véhicules autorisés. Dans une zone de rencontre, le panneau montre aussi une voiture et « 20 » : les véhicules y circulent à 20 km/h au maximum.'
  comparaisons:
  - ref: b52
    legende: 'Zone de rencontre : 20 km/h, piétons prioritaires.'
b56:
  signification: 'Entrée d’une zone à faibles émissions : l’accès dépend de la vignette Crit’Air et des conditions indiquées sur le panonceau.'
  conduite: Vérifier sa vignette Crit'Air et les horaires du panonceau ; ne pas entrer si le véhicule est concerné (68 €).
  complement: Un panonceau précise les catégories, jours et heures concernés.
b58:
  signification: Zone de montagne où, du 1er novembre au 31 mars, il faut des pneus hiver marqués 3PMSF ou détenir des chaînes
    pour deux roues motrices.
  conduite: 'Vérifier son équipement avant d''entrer : pneus hiver, ou chaînes/chaussettes dans le coffre.'
  complement: Le marquage M+S seul ne suffit plus depuis le 1er novembre 2024.
  piege: 'La zone impose un équipement hivernal pendant la période indiquée. Le panneau rond bleu avec une roue chaînée porte sur l’équipement à utiliser sur la section : je lis aussi son éventuel complément.'
  source: "Arrêté du 23 juin 2021, art. 7 (IISR 67-1) ; D314-8, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043775737/2024-11-12"
  comparaisons:
  - ref: b26
    legende: 'Roue chaînée : équipement en service sur la section.'
m2:
  piege: Sans flèches, « 150 m » indique où commence le danger. Avec les deux flèches, « 150 m » indique la longueur de la section concernée.
  comparaisons:
  - ref: m1
    legende: 'Sans flèches : distance avant le danger.'
m6i:
  conduite: 'Ne pas occuper l''emplacement avec un véhicule non électrique ou hors recharge : stationnement gênant (R417-10
    III 3°), 35 € et mise en fourrière possible.'
m7:
  signification: 'Schéma de l''intersection abordée : les branches prioritaires sont en trait large, les non prioritaires
    en trait fin.'
  conduite: 'Lire le schéma : suis-je sur la branche prioritaire (trait large) ? D''où viennent les autres ?'
  complement: Le trait épais montre l’itinéraire prioritaire. La branche qui part du bas correspond à mon arrivée au carrefour.
m8d:
  nom: Section d'application vers la droite (flèche horizontale)
  signification: 'Flèche horizontale vers la droite : la section où s''applique la prescription s''étend à droite du panneau
    ; la distance éventuelle précise sa longueur.'
  complement: null
m9v1:
  signification: La prescription ne s’applique pas aux cycles, aux EDPM ni aux cyclomobiles légers.
  conduite: Sous un sens interdit, anticiper ces usagers venant en face ; vérifier la voie avant de tourner.
  complement: L’exception peut aussi être écrite avec le mot « SAUF » et le symbole d’un vélo.
m9z:
  signification: 'Panonceau à inscription libre : « RAPPEL », « SAUF RIVERAINS », « PAR TEMPS DE PLUIE », « SORTIE D''USINE
    »…'
  complement: « RAPPEL » sous un panneau de vitesse confirme que la limitation continue, notamment après une intersection.
m10b:
  complement: Cartouche placé AU-DESSUS du panneau qu'il complète (exception parmi les panonceaux) ; il ne s'applique qu'à
    ce panneau.
m12:
  signification: Sous un feu imposant l’arrêt, autorise cycles, EDPM et cyclomobiles légers à passer dans les directions fléchées,
    en cédant le passage.
  conduite: 'En voiture : attendre le vert ; anticiper les usagers autorisés à passer et leurs trajectoires.'
  complement: 'Céder aux piétons et aux véhicules bénéficiant du vert. EDPM : par exemple une trottinette électrique.'
  piege: 'Ne donne ni priorité ni autorisation aux voitures, motos ou cyclomoteurs ordinaires. Le signal lumineux R19 a un
    champ différent : les cyclistes.'
g1:
  signification: 'Croix de Saint-André : passage à niveau à une voie, sans barrière ni signalisation automatique. Panneau
    de position, au niveau des rails.'
  conduite: Je regarde et écoute des deux côtés ; je ne franchis qu’en l’absence de train. Un STOP associé impose l’arrêt.
  complement: Un triangle avec une locomotive annonce le passage à niveau sans barrières. Une croix simple indique une voie ferrée ; une croix double, plusieurs voies.
  piege: Dépassement interdit aux passages à niveau sans barrière ni demi-barrière (R414-12), même avec signalisation automatique.
  comparaisons:
  - ref: g1a
    legende: 'Croix double : plusieurs voies ferrées.'
g1bis:
  signification: 'Croix de Saint-André complétée d''un feu rouge clignotant (R24) et d''une sonnerie : passage à niveau sans
    barrière, à signalisation automatique.'
  complement: null
ak5:
  conduite: Je ralentis, respecte la limitation affichée et suis le balisage ainsi que les instructions des signaleurs.
  complement: 'Le triangle « travaux » appelle à ralentir mais ne fixe pas de vitesse chiffrée : je lis les panneaux de limitation associés.'
k2:
  image:
    gen: barriere_k2
  complement: null
k8:
  signification: 'Balise blanche à chevron rouge implantée en tête de chantier ou de déviation : elle indique de quel côté
    contourner.'
  complement: null
kr11:
  signification: Feux tricolores mobiles réglant une circulation alternée sur voie unique en chantier ; mêmes règles que les
    feux permanents.
  conduite: S'arrêter au rouge même sans personne en face ; ne pas s'engager au vert si la voie n'est pas dégagée.
  complement: null
triangle-presignalisation:
  signification: Triangle rouge rétroréfléchissant à placer sur la chaussée pour signaler un véhicule immobilisé. Obligatoire
    à bord avec le gilet.
  conduite: "Mettre le gilet avant de sortir et allumer les feux de détresse. Placer le triangle au moins 30 m en amont, sauf si sa pose m'expose au danger."
  complement: 'Sur autoroute, ne pas poser le triangle si cela met en danger : priorité à l''évacuation derrière la glissière.'
  piege: Absence à bord = 11 € ; ne pas revêtir le gilet ou ne pas présignaler = 135 €.
vr-losange-debut:
  signification: 'Losange blanc au-dessus d''une voie : voie réservée, aux heures indiquées, aux bus, aux taxis et au covoiturage
    (« 2+ » ou « 3+ »).'
  conduite: Ne pas l'emprunter seul à bord (135 €) ; losange éteint ou hors horaires, la voie est ouverte à tous.
  complement: Un panonceau précise le nombre minimal d’occupants et les horaires.
  piege: Sans panonceau, le losange vaut bus + taxis + covoiturage 2+.
agent-geste-avancer:
  signification: Un va-et-vient du bras dans le sens de la circulation invite à avancer ou à accélérer ; un bras pointé indique
    où aller.
sr3e:
  signification: 'Pictogramme radar + rappel de la vitesse maximale : contrôle automatisé, souvent un radar tronçon (vitesse
    moyenne).'
j11:
  signification: Balise blanche souple implantée sur une ligne continue pour en empêcher le franchissement.
  complement: null
j12:
  signification: Balise verte implantée sur le marquage d'une divergence (bretelle de sortie) pour renforcer la perception
    du musoir.
  complement: null
j13:
  signification: Balise à bandes obliques bleues et blanches signalant un obstacle permanent proche de la chaussée.
  complement: Les bandes bleues et blanches signalent un obstacle permanent ; les dispositifs rouges et blancs servent aux obstacles temporaires.
a1a:
  complement: Le sens de la flèche indique le sens du virage.
b21b:
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
  piege: Le rond bleu impose d’aller tout droit. La flèche vers le haut dans un carré bleu indique un sens unique, sans imposer d’aller tout droit à chaque intersection.
  comparaisons:
  - ref: c12
    legende: 'Carré bleu : sens unique.'
b21c1:
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
b21d1:
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
b21d2:
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
b21e:
  signification: À la prochaine intersection, tourner à droite ou à gauche ; interdit d'aller tout droit.
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
c24b:
  conduite: Se placer à l'avance dans la voie de sa direction ; une fois engagé, on doit la suivre.
  complement: null
c51a:
  signification: Annonce une section d'autoroute où la vitesse maximale est modulée dynamiquement par panneaux à messages
    variables.
  complement: null
ce29:
  conduite: 'En tunnel : se garer, couper le moteur, laisser les clés, rejoindre l''issue de secours.'
ak17:
  conduite: Ralentir, se préparer à s'arrêter ; ne pas passer au rouge même si la voie semble libre.
kd8:
  signification: Panneau jaune schématisant un basculement de circulation (passage sur la chaussée opposée, déport de voies).
  conduite: 'Suivre la trajectoire indiquée et ralentir : on peut rouler sur la chaussée opposée.'
  complement: null
k5a:
  signification: Cône rouge et blanc délimitant un chantier ou un obstacle temporaire, posé en file pour guider.
  conduite: Rester dans l'espace laissé libre ; ne pas franchir la file de cônes.
  complement: null
k10b:
  signification: La face rouge du piquet tenu par le signaleur m’impose l’arrêt.
  complement: null
m4e:
  complement: Utilisé sur les voies réservées à losange pour préciser le nombre minimal d'occupants.
m6a:
  signification: 'Le stationnement, ou l’arrêt si le panneau l’interdit aussi, est gênant : le véhicule peut être mis en fourrière.'
m6c:
  signification: Indique la durée maximale de stationnement avec disque (zone bleue) et les horaires d'application.
j5:
  signification: 'Balise carrée bleue à large flèche blanche oblique, en tête d''un îlot ou d''un terre-plein : passer à droite.'
  complement: En tête d’îlot, souvent à l’entrée d’un giratoire.
  conduite: Je passe à droite de la balise.
j14a:
  signification: Balise en demi-cercle vert à deux flèches blanches divergentes, en tête de musoir (sortie d'autoroute, bifurcation).
  conduite: Décider tôt de sa direction ; ne jamais franchir le musoir ni faire marche arrière.
  complement: null
r21c:
  signification: 'Flèche jaune clignotante inclinée vers le bas au-dessus d''une voie : cette voie est fermée, se rabattre
    du côté indiqué.'
  complement: null
marq-chevrons:
  signification: Chevrons blancs peints dans l'axe des voies (autoroutes, tunnels) pour matérialiser la distance de sécurité.
  piege: Ces marques sont peintes sur la chaussée. Les chevrons sur fond bleu au bord de la route guident dans un virage ; ceux sur fond vert signalent une séparation de voies.
marq-plateau-sureleve:
  signification: 'Ralentisseur trapézoïdal : rampes d''accès et plateau plat sur toute la largeur de la chaussée, souvent
    avec passage piéton surélevé.'
  complement: Rencontré en agglomération, zones 30 et zones de rencontre.
marq-ligne-jaune-discontinue:
  signification: 'Ligne jaune discontinue sur la bordure ou en rive : stationnement interdit, arrêt autorisé.'
a3:
  conduite: Je ralentis et reste dans ma voie. Si deux véhicules ne peuvent pas se croiser, je lis les panneaux de priorité et ne m’engage que si je peux dégager.
a8:
  conduite: Ralentir fortement, regarder et écouter ; ne franchir que si aucun train n'est visible ni audible.
  complement: La croix de Saint-André marque le passage lui-même ; un STOP peut la surmonter.
a14:
  signification: Annonce un danger sans symbole spécifique ; le texte du panonceau en précise la nature.
c29c:
  piege: Sur une route à trois voies, la voie du milieu appartient au sens qui a deux flèches.
b8:
  piege: Le camion vise le transport de marchandises. Un nombre de tonnes dans le rond rouge vise le poids réel du véhicule, quelle que soit sa catégorie.
  signification: Accès interdit aux véhicules de transport de marchandises, camions et camionnettes. Un panonceau de tonnage peut restreindre l’interdiction aux véhicules dont le poids maximal autorisé dépasse la valeur indiquée.
  comparaisons:
  - ref: b13
    legende: 'Tonnage : limite de poids réel, toutes catégories.'
b13:
  signification: Accès interdit aux véhicules dont le PTAC (ou le PTRA d'un ensemble) dépasse le nombre indiqué (ex. 3,5 t).
  conduite: 'Peut concerner un camping-car ou une voiture + remorque : se référer à la carte grise (F.2/F.3).'
b21c2:
  conduite: Se placer à gauche, clignotant gauche, et céder le passage aux véhicules venant en face.
  complement: Placé avant l'intersection, pas à l'endroit où l'on tourne.
k10a:
  complement: 'Le même piquet a deux faces : verte pour passer, rouge pour s’arrêter. Je suis celle que le signaleur me présente.'
  signification: La face verte du piquet tenu par le signaleur m’autorise à passer dans l’alternat de chantier.
  comparaisons:
  - ref: k10b
    legende: 'Face rouge : arrêt obligatoire.'
kc1:
  signification: 'Panneau rectangulaire jaune à inscription informant d''une situation temporaire : « ROUTE BARRÉE », « CIRCULATION
    ALTERNÉE », « CHAUSSÉE DÉFORMÉE »…'
  conduite: 'Lire et appliquer : « route barrée » = déviation ; « absence de marquage » = serrer à droite.'
  complement: null
m11d:
  signification: Sous le panneau de zone à faibles émissions, indique les catégories de véhicules concernées, les vignettes Crit’Air admises après « SAUF », et les jours et heures d’application.
  conduite: Comparer sa vignette Crit'Air aux catégories affichées après « SAUF » avant d'entrer.
  piege: Les vignettes dessinées sont celles qui peuvent entrer, pas celles qui sont interdites.
c115:
  signification: Voie verte réservée notamment aux piétons, cycles, EDPM, cyclomobiles légers et cavaliers, avec dérogations
    locales possibles.
  conduite: En voiture, ne pas y entrer sans autorisation. Les usagers admis partagent l’espace en protégeant les plus vulnérables.
  complement: null
  piege: Une trottinette électrique n’est pas interdite du seul fait de son moteur.
  source: "Code de la route, R110-2, R411-3-2 et R412-43-1, https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006143859"
c64d:
  signification: Voie de péage pour les véhicules munis d’un badge de télépéage.
  conduite: 'Suivre la limitation affichée : un passage à 30 km/h exige une voie signalée pour cela, sinon ralentir jusqu’à
    l’arrêt si nécessaire.'
  complement: null
  piege: null
  source: "Arrêté du 24 novembre 1967, art. 4, 5 et 7, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/2025-04-25"
marq-damier-blanc:
  conduite: 'Ne pas bloquer la traversée. Lire les feux et les priorités : le damier seul ne donne pas une priorité générale
    au bus.'
d20:
  signification: 'Panneau de direction en position : la pointe indique la voie à prendre au carrefour.'
  complement: null
d30:
  signification: 'Signalisation avancée : la flèche indique la direction de sortie à préparer.'
  complement: Anticiper le placement sans changer brutalement de voie ; suivre le tracé et la signalisation.
d40:
  complement: Lire la flèche et, si elle est affichée, la distance. Ne pas confondre l’annonce avec le panneau de position
    au carrefour.
  image:
    commons: D43.svg
  signification: Annonce avant l’intersection la direction à suivre pour les destinations indiquées ; je prépare ma voie à
    l’avance.
m9c:
  signification: L’inscription « Cédez le passage » rappelle le sens du triangle inversé situé au-dessus.
  complement: null
da40:
  image:
    gen: direction_voies
  nom: "Affectation des voies par direction (schéma simplifié)"
  signification: 'Les flèches vers le bas désignent les voies : sur ce schéma, deux voies pour Paris et la voie de droite
    pour Lyon.'
  conduite: Choisir sa voie assez tôt, après contrôles ; ne pas couper les autres voies au dernier moment.
  complement: 'Schéma simplifié : les destinations servent à lire l’affectation des voies.'
m9v2:
  signification: La prescription ne s’applique pas aux cycles, aux EDPM ni aux cyclomobiles légers.
  conduite: Sous un sens interdit, anticiper ces usagers venant en face ; vérifier la voie avant de tourner.
b9b:
  signification: Accès interdit aux cycles, aux EDPM et aux cyclomobiles légers.
  piege: 'Avec le même symbole de vélo : rond rouge = accès interdit ; rond bleu = piste obligatoire ; carré bleu = piste conseillée ; triangle = débouché de cyclistes.'
  comparaisons:
  - ref: b22a
    legende: 'Rond bleu : piste obligatoire.'
  - ref: c113
    legende: 'Carré bleu : piste conseillée.'
  - ref: a21
    legende: 'Triangle : débouché de cyclistes.'
m4d1:
  signification: 'Catégorie désignée : cycles, EDPM et cyclomobiles légers.'
  complement: 'Sous une interdiction : en précise les destinataires. Sous une obligation ou une indication : signale que cette
    catégorie est également concernée.'
  piege: Le pictogramme vélo ne signifie pas que seuls les vélos sont concernés.
c113:
  signification: Piste ou bande cyclable conseillée pour les cycles à deux ou trois roues.
  conduite: 'En voiture : ne pas y circuler ni s’y arrêter.'
  complement: Les trottinettes électriques et cyclomobiles légers doivent l’emprunter, sauf décision locale contraire signalée. Un panonceau avec un cyclomoteur peut aussi autoriser ces véhicules.
  piege: Conseillée pour un vélo ne signifie pas facultative pour tous les usagers autorisés.
c1b:
  complement: null
b27b:
  complement: null
b6b4:
  complement: null
b19:
  complement: null
b22b:
  complement: null
j7:
  complement: La manche à air précise l’endroit exposé, en complément du triangle annonçant un vent latéral.
r21b:
  complement: null
marq-ligne-jaune-continue:
  complement: Jaune continue = arrêt et stationnement interdits ; jaune discontinue = stationnement interdit, arrêt possible.
  signification: 'Ligne jaune continue sur la bordure ou en rive de chaussée : arrêt et stationnement interdits.'
marq-losange-vr:
  complement: null
  signification: Losange blanc peint dans l'axe d'une voie réservée (covoiturage, transports en commun, taxis) sur voie rapide,
    en complément du panneau à losange.
a2a:
  complement: Deux bosses représentent une déformation de la chaussée ; une seule bosse annonce un ralentisseur aménagé.
  comparaisons:
  - ref: a2b
    legende: 'Une seule bosse : ralentisseur aménagé.'
a17:
  complement: Un feu jaune clignotant peut être ajouté au sommet du panneau pour renforcer l’alerte.
d60:
  complement: null
b33:
  signification: 'Fin de la limitation de vitesse indiquée : la vitesse maximale redevient celle du régime général de la route
    (agglomération 50, route 80 ou 90 selon la section, chaussées séparées par un terre-plein 110, autoroute 130).'
  complement: 'Après la fin de limitation, la vitesse n’est pas libre : la limite générale de la route et les autres limitations applicables restent à respecter.'
c1a:
  complement: null
  conduite: 'Je me gare sur les emplacements autorisés et lis les panonceaux : usagers concernés, conditions et direction du parking.'
c4a:
  complement: Carré bleu = indication (conseil) ; rond rouge = interdiction (maximum) ; rond bleu = obligation (minimum).
c5:
  complement: null
c8:
  complement: Un arrêt hors urgence sur cet emplacement est interdit.
  conduite: Je n’y stationne qu’en cas de panne ou d’urgence ; les panonceaux peuvent signaler un poste d’appel ou un extincteur.
c13a:
  complement: null
c20c:
  complement: null
c24a:
  complement: Sert notamment à signaler un double-sens cyclable (vélo à contresens) ou un couloir bus à contresens.
c24c:
  complement: null
c25b:
  complement: 'Jeune conducteur (permis probatoire) : 110 sur autoroute, 100 sur route à chaussées séparées, 80 sur route.'
c26a:
  complement: Damier rouge et blanc au sol à l’entrée.
c29a:
  complement: null
c29b:
  complement: null
  conduite: Je n’utilise la voie de gauche que pour dépasser et me rabats avant la fin du créneau de dépassement annoncé.
c30:
  complement: null
c64a:
  complement: null
c208:
  complement: null
b2a:
  complement: Vaut pour la prochaine intersection.
  piege: L’interdiction vise la prochaine intersection. Une flèche dans un rond rouge interdit une direction ; dans un rond bleu, elle impose une direction.
b2b:
  complement: Vaut pour la prochaine intersection.
b3a:
  complement: null
b4:
  complement: null
b5b:
  complement: null
eb20:
  complement: null
e42:
  complement: 'Couleur des cartouches : rouge = A/N (État), jaune = D (département), blanc = C/VC (commune), vert = E (Europe).'
b21a1:
  complement: Placé sur l’obstacle lui-même (tête d’îlot, entrée de giratoire, refuge).
b21a2:
  complement: Placé sur l’obstacle lui-même.
ab3b:
  complement: null
  signification: Annonce un cédez-le-passage à la distance indiquée, souvent 150 m.
  piege: 'Le panonceau donne seulement une distance : cédez-le-passage à venir. S’il porte aussi « STOP », il annonce un arrêt obligatoire plus loin.'
  comparaisons:
  - ref: ab5
    legende: 'Avec « STOP » : arrêt obligatoire plus loin.'
ab7:
  complement: null
b6b1:
  complement: null
b6b3:
  complement: Le marquage au sol de la zone bleue peut être bleu.
b51:
  complement: null
g1a:
  complement: null
  signification: 'Croix double : passage à niveau à plusieurs voies ferrées, sans barrières. Un train peut en cacher un autre.'
  conduite: Je regarde et écoute des deux côtés, respecte un éventuel STOP et ne franchis que si aucune voie ferrée ne présente de danger et si je peux dégager entièrement.
k1:
  complement: null
kd10:
  complement: null
  signification: 'Annonce une réduction du nombre de voies disponibles : je repère les voies qui ferment et prépare mon changement de voie à la distance indiquée.'
kd22:
  complement: null
kd42:
  complement: null
vr-losange-fin:
  complement: null

a13a:
  piege: 'Deux enfants qui courent : lieu fréquenté par des enfants. Le piéton sur des bandes annonce, lui, un passage pour piétons.'
  comparaisons:
  - ref: a13b
    legende: 'Un piéton sur des bandes : passage pour piétons annoncé.'
a1c:
  conduite: Je ralentis et reste à droite sur toute la section ; un panonceau peut préciser la longueur de la succession de virages.
a21:
  piege: 'Avec un vélo, la forme change le sens : triangle = danger ; rond bleu = piste obligatoire ; carré bleu = piste conseillée ; rond rouge = accès interdit.'
  comparaisons:
  - ref: b9b
    legende: 'Rond rouge : accès interdit aux cycles.'
  - ref: b22a
    legende: 'Rond bleu : piste obligatoire.'
  - ref: c113
    legende: 'Carré bleu : piste conseillée.'
b7a:
  piege: 'Voiture et moto : les cyclomoteurs restent admis. Avec un troisième symbole de cyclomoteur, tous les véhicules à moteur sont interdits.'
  comparaisons:
  - ref: b7b
    legende: 'Trois symboles : tous les véhicules à moteur.'
b17:
  piege: Le nombre suivi de « m » est une distance à garder, pas une vitesse. C’est particulièrement utile dans les tunnels.
b34:
  signification: Fin de l’interdiction de dépasser signalée auparavant. Je ne dépasse que si la visibilité, les marquages et le trafic le permettent.
b40:
  signification: Fin de la piste ou bande obligatoire pour les cycles ; les cyclistes réintègrent la chaussée.
d50:
  conduite: Je prépare ma sortie et me rabats progressivement à droite après contrôles ; je repère le numéro de sortie.
m1:
  complement: Le nombre indique la distance jusqu’au danger ou au lieu annoncé. Sous un cédez-le-passage, il annonce l’intersection plus loin ; sous un panneau de service, il indique la distance jusqu’au service.
m4d2:
  signification: Le panneau s’applique aux cyclomoteurs. Sous un panneau de piste cyclable obligatoire, il étend l’usage de la piste aux cyclomoteurs.
m4f:
  complement: Sous un panneau interdisant les véhicules de transport de marchandises, le tonnage précise le poids maximal autorisé au-delà duquel l’interdiction s’applique.
m5:
  signification: Sous le triangle inversé, l’inscription « STOP » et la distance annoncent l’endroit où je devrai marquer l’arrêt.
m6b:
  signification: 'Précise les jours où le stationnement est interdit de ce côté : « du 1er au 15 » ou « du 16 à la fin du mois ».'
m9d:
  signification: 'Sous le panneau de passage pour piétons, indique un passage surélevé : je ralentis avant le plateau.'
m11b1:
  signification: 'Précise les périodes d’application du panneau placé au-dessus : par exemple les horaires d’une aire piétonne ou la période d’équipement hivernal.'
marq-zone-bleue:
  signification: 'Emplacements délimités en bleu : stationnement gratuit à durée limitée, avec disque. Je lis les horaires et la durée autorisée sur les panneaux.'
marq-damier-rouge-blanc:
  complement: Ce marquage se trouve à l’entrée des voies de détresse.
c26b:
  conduite: En cas de défaillance des freins, j’emprunte la voie de détresse pour immobiliser le véhicule ; je la laisse libre en circulation normale.
ce15a:
  conduite: Sur autoroute, je repère la distance jusqu’à la station pour anticiper le ravitaillement.
ce15i:
  conduite: Je n’occupe un emplacement réservé à la recharge que pour recharger un véhicule électrique.
ak3:
  signification: Annonce un rétrécissement temporaire de la chaussée ; le dessin précise si la voie se resserre à droite, à gauche ou des deux côtés.
  conduite: Je ralentis, me replace et respecte l’alternat indiqué par les panneaux, le signaleur ou les feux temporaires.
ak22:
  conduite: Je ralentis, augmente les distances et évite de dépasser ou de croiser à vive allure sur les gravillons.
