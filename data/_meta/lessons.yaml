- theme: X
  titre: Lire, décider, puis vérifier chaque proposition
  principe: >-
    Commencer par identifier de quel usager on parle, ce qu’il veut faire et ce qui est réellement visible.
    Distinguer une permission (« je peux »), une obligation (« je dois ») et une précaution utile.
    Une réponse se justifie par un indice de la scène et une règle, pas par le mot qui paraît le plus prudent.
  exemple: >-
    Un feu vert autorise le passage, mais un piéton engagé ou une sortie de carrefour bouchée peut imposer
    d’attendre. Répondre séparément à « le feu est vert » et « je peux m’engager maintenant ».
  transfert: >-
    Sur une série nouvelle, nommer après correction l’indice manqué : point de vue, signal, trajectoire,
    masque ou mot de l’énoncé. Dans Anki, une justification devinée ne vaut pas une règle retrouvée.
- theme: L
  titre: Combiner les règles au lieu d’en choisir une seule
  principe: >-
    Lire le destinataire d’un signal, son point de départ et sa portée. Pour une manœuvre, vérifier aussi
    les priorités, les trajectoires et l’espace libre. Le droit de passer et la possibilité de passer
    sans danger sont deux conditions nécessaires. Une limitation est un plafond, pas une allure à maintenir.
  exemple: >-
    Une ligne discontinue permet son franchissement, mais pas un dépassement sans visibilité.
    Un panonceau de distance annonce où commence le danger ; un panonceau d’étendue indique sa longueur.
    Une fin de limitation ponctuelle rétablit les règles applicables à la route, pas une vitesse libre.
  transfert: >-
    Après une erreur, préciser quelle condition changerait la réponse : signal, côté de la ligne,
    catégorie d’usager, visibilité, trafic ou portée de la prescription.
- theme: C
  titre: Garder du temps et de l’espace pour réagir
  principe: >-
    La voiture avance avant même le début du freinage : distance d’arrêt = distance de réaction + distance
    de freinage. Vitesse, attention et adhérence n’agissent pas de la même manière. Les distances fournies
    dans un exercice sont des données ; une table approximative n’est jamais une garantie en circulation.
  exemple: >-
    Avec 15 m pendant la réaction et 25 m de freinage, l’arrêt prend 40 m. Si le freinage double et la
    réaction reste identique, il faut 65 m, pas 80. Une zone masquée exige une marge même si aucun usager
    n’est encore visible. Un seuil légal d’alcool ne définit pas une absence de risque.
  transfert: >-
    Distinguer règle oubliée et indice non vu. L’alcool, la distraction et la somnolence ne se compensent
    pas par de « bons réflexes » ; modifier le trajet ou interrompre la conduite si nécessaire.
- theme: R
  titre: Adapter la conduite aux contraintes de la route
  principe: >-
    Météo, relief, rails, tunnel et autoroute changent l’adhérence, la visibilité ou les possibilités
    d’évitement. Chercher en amont l’action qui reste possible : ralentir, attendre, renoncer ou rejoindre
    un endroit protégé. Lire la signalisation locale plutôt que réciter une distance universelle.
  exemple: >-
    À un passage à niveau ouvert, une file arrêtée juste après les rails impose d’attendre avant les rails.
    Dans un tunnel, une niche avec téléphone aide à alerter ; une issue de secours sert à évacuer.
    Une sortie d’autoroute manquée se rattrape plus loin, jamais par marche arrière.
  transfert: >-
    Dans une scène nouvelle, identifier d’abord ce qui empêcherait de s’arrêter, de dégager ou de se mettre
    à l’abri. Un équipement d’hiver ne supprime pas le besoin d’adapter l’allure.
- theme: U
  titre: Anticiper ce que les autres peuvent faire ou ne pas voir
  principe: >-
    Chercher la trajectoire possible, le masque visuel et la marge dont l’autre usager a besoin.
    Un piéton, un cycliste, un deux-roues et un poids lourd n’ont ni le même gabarit ni les mêmes contraintes.
    Ne pas présumer que l’autre m’a vu, ni qu’un signal d’intention garantit sa trajectoire.
  exemple: >-
    Pour tourner à droite en traversant une piste cyclable parallèle, vérifier aussi derrière à droite
    et céder au cycliste concerné. À côté d’un camion, voir un rétroviseur ne prouve pas que son conducteur
    m’a repéré ; son arrière peut couper l’espace intérieur du virage.
  transfert: >-
    Sur les photos et vidéos, chercher ce qui pourrait surgir d’un masque : bus, véhicule stationné,
    enfant derrière un objet ou deux-roues dans un angle mort. La priorité n’autorise pas à provoquer un choc.
- theme: D
  titre: Distinguer droit de conduire, documents et conséquences
  principe: >-
    Permis, assurance et contrôle technique répondent à des questions différentes : qui peut conduire,
    quels dommages sont couverts, et si les contrôles du véhicule sont valides. Une amende forfaitaire,
    un retrait de points, une rétention, une suspension et une invalidation ne sont pas interchangeables.
  exemple: >-
    Être assuré au tiers indemnise les dommages causés aux autres, pas automatiquement ma voiture.
    Une défaillance critique au contrôle technique ne laisse pas les mêmes possibilités qu’une défaillance
    majeure. Une peine maximale encourue n’est pas une peine automatiquement prononcée.
  transfert: >-
    Lire la catégorie, le délai et le mot exact de la question. Pour une statistique, vérifier année,
    territoire et dénominateur ; pour une démarche, consulter sa source actualisée.
- theme: A
  titre: Choisir l’aide selon l’état de la victime
  principe: >-
    Protéger sans se mettre en danger, alerter et secourir. Donner le lieu précis, les dangers et l’état
    des victimes ; suivre les instructions de l’opérateur. Une victime qui ne répond pas doit être évaluée
    selon sa respiration : des gasps ne sont pas une respiration normale.
  exemple: >-
    Une personne inconsciente après un malaise sans traumatisme, qui respire normalement, relève de la PLS
    et de la surveillance. Une victime qui ne respire pas normalement relève de l’alerte, de la RCP et du DAE.
    Après un traumatisme, ne pas appliquer mécaniquement la même mobilisation : suivre les secours.
  transfert: >-
    Reconnaître le cas dans une carte ne prouve pas savoir réaliser le geste. Une formation pratique de
    secours permet d’apprendre les gestes et de les faire corriger. Ne pas s’exposer au trafic pour poser un triangle.
- theme: P
  titre: Préparer les contrôles avant le mouvement
  principe: >-
    Les réglages servent à atteindre les commandes et à voir ; les contrôles servent à vérifier que
    la manœuvre reste sûre. Régler le siège avant les rétroviseurs. Avant de quitter le véhicule,
    l’immobiliser puis contrôler le côté où l’on ouvre, même si l’on ne voit rien dans le rétroviseur.
  exemple: >-
    Une portière gauche exige de vérifier derrière à gauche. L’ouverture avec la main opposée facilite
    la rotation du corps, mais ne remplace pas le regard. Un enfant descend de préférence côté trottoir.
  transfert: >-
    Dans une voiture inconnue, utiliser les repères fonctionnels et la notice. Une caméra ou un rétroviseur
    bien réglé ne remplace pas la recherche d’un obstacle bas ou masqué.
- theme: M
  titre: Lire le symbole, la situation et la notice
  principe: >-
    Un voyant doit être interprété avec son symbole, le moment où il s’allume et les symptômes.
    Pour l’entretien, appliquer la préconisation du véhicule : charge, essieu, température ou échéance
    peuvent changer la réponse. Une aide à la conduite a une fonction précise et des limites.
  exemple: >-
    Le témoin de batterie allumé avant le démarrage n’a pas la même portée que s’il apparaît en roulant.
    Sur une étiquette de pression, lire la bonne ligne de charge et les colonnes avant/arrière.
    L’ABS évite le blocage des roues ; l’AFU et l’AEB n’ont pas le même déclenchement.
  transfert: >-
    Chercher dans une scène l’information qui manque avant de conclure. Ne pas transformer « orange »
    en autorisation générale de continuer ni une valeur d’exercice en prescription pour sa propre voiture.
- theme: S
  titre: Retenir les occupants et respecter les masses
  principe: >-
    Ceinture, siège enfant, appuie-tête et airbag se complètent. Le dispositif doit être adapté et utilisé
    correctement ; un objet libre continue son mouvement lors d’un choc. Pour une remorque, distinguer
    ce que le permis autorise des capacités techniques et des masses effectivement admissibles.
  exemple: >-
    Un siège bébé dos à la route à l’avant exige la désactivation de l’airbag frontal correspondant.
    Pour le permis B, traiter d’abord le cas d’une remorque de PTAC au plus 750 kg ; au-delà, examiner la
    somme des PTAC. Alléger la remorque ne change pas le PTAC inscrit sur sa carte grise.
  transfert: >-
    Sur une image, regarder l’installation réelle, pas seulement la présence d’une ceinture ou d’un siège.
    Dans un calcul de remorque, nommer les masses utilisées avant de les additionner.
- theme: E
  titre: Économiser sans réduire les marges de sécurité
  principe: >-
    Anticiper évite des accélérations et freinages inutiles. Un rapport adapté, l’entretien et la réduction
    des charges ou accessoires inutiles limitent la consommation. Les conseils dépendent du véhicule et
    des conditions ; ils ne doivent jamais dégrader la visibilité, la vigilance ou la maîtrise de l’allure.
  exemple: >-
    Lever le pied tôt à l’approche d’un feu ménage les freins. Descendre au point mort retire le frein
    moteur. Éteindre un dégivrage encore nécessaire à la visibilité n’est pas une bonne économie.
    Une voiture électrique n’émet pas de gaz à l’échappement mais conserve d’autres impacts.
  transfert: >-
    Distinguer CO₂, polluants de l’air et énergie consommée. Une vignette Crit’Air classe le véhicule ;
    la règle locale indique s’il peut circuler à cet endroit et à cet horaire.
