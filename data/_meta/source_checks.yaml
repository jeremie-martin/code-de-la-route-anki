- id: finition-2026-09-23
  consulte_le: '2026-09-23'
  url: https://www.securite-routiere.gouv.fr/dangers-de-la-route/la-fatigue-et-la-conduite
  portee: 'Nouvelles cartes de fin de deck. Sécurité routière : « sur l’autoroute, un accident mortel sur trois est associé à la somnolence », pause toutes les deux heures, périodes monotones propices à la somnolence ; Fondation VINCI Autoroutes (hypovigilance) : la monotonie d’un environnement prévisible et répétitif fait baisser la vigilance. APRR (https://voyage.aprr.fr/aide-contact/mon-voyage-sur-autoroute/securite-et-prevention/que-dois-je-faire-si-je-croise-un) : ralentir, augmenter les distances, ne pas doubler, éviter la voie rapide, s’arrêter sur une aire proche ; alerte 107.7 et panneaux à messages. service-public F2655 et Code des assurances A121-1 : +25 % par accident responsable, +12,5 % en responsabilité partagée, −5 % par an, plancher 0,50. Code de la route R312-2 (poids réel ≤ PTAC ; 4e classe par tranche de 0,5 t) et R325-8 (pesée, immobilisation). Autocollant angles morts (R313-32-1, décret 2020-1396) : fichier Commons « Angles morts sur un camion.svg ».'
  notes: [c-monotonie-autoroute, r-contresens-signale, d-bonus-malus, s-surcharge-ptac, u-pl-angles-morts-chiffres]
