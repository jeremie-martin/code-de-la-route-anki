- id: audit-tunnel-feux
  consulte_le: '2026-09-22'
  url: https://www.cetu.developpement-durable.gouv.fr/conduire-en-tunnel-a1597.html
  portee: 'Page CETU mise à jour le 31 octobre 2025, texte consulté par téléchargement HTTP après échec du navigateur de recherche : feux de croisement à l’entrée, distances particulières et respect des consignes. Retrait de l’explication non étayée par la réverbération.'
  notes: [r-tunnel-feux-jour]
- id: comparaison-livre-remorque-vitesses
  consulte_le: '2026-09-22'
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028436426
  portee: 'R413-8 relu en ligne, avec R413-1, R413-4 et R413-8-1 dans la section Vitesse : PTRA supérieur à 3,5 t pour un ensemble, 90 sur autoroute, 90 sur route prioritaire à chaussées séparées pour le cas léger retenu, 80 sur les autres routes hors agglomération. Les exemples distinguent ce critère des PTAC utilisés pour le permis ; aucun plafond de poids lourd supérieur à 12 t généralisé aux voitures.'
  notes: [s-remorque-vitesses, s-remorque-permis-vitesse]
- id: comparaison-livre-freins-mouilles
  consulte_le: '2026-09-22'
  url: https://www.volvocars.com/fr/support/car/v60-cross-country/15w17/article/b7763713f78f074bc0a801e8017136c8/
  portee: 'Rubrique Freinage sur route mouillée lue dans le texte indexé du moteur de recherche (accès direct refusé) : retard possible après pluie prolongée ou lavage, freinage pour sécher et prise en compte du trafic. Carte de précaution, sans dosage ni nombre universel de freinages ; notice propre au véhicule conservée comme référence pratique.'
  notes: [m-freins-apres-lavage]
- id: comparaison-livre-siege-compatibilite
  consulte_le: '2026-09-22'
  url: https://www.awsr.be/securite-routiere/sieges-auto/
  portee: 'Agence wallonne pour la Sécurité routière : choix selon taille et poids, compatibilité voiture, installation suivant la notice, existence de R129 avec ceinture seule, fin de vente neuve R44 en septembre 2024 sans interdiction des sièges déjà possédés. Seuls ces éléments techniques européens sont utilisés, pas les règles belges de transport des enfants. Fiche française F628 également consultée pour R44-03/04 ; son raccourci R129 = i-Size/ISOFIX ne sert pas à généraliser la fixation.'
  notes: [s-groupes-sieges]
- id: comparaison-livre-controle-technique
  consulte_le: '2026-09-22'
  url: https://www.service-public.gouv.fr/particuliers/vosdroits/F2878
  portee: 'Comparaison avec le chapitre 9 du livre : S = défaillance majeure, validité deux mois ; R = critique, validité limitée au jour du contrôle. Cartes existantes conservées ; la ligne R du livre confond majeure et critique.'
  notes: [d-ct-critique, aff-d-ct-defaillance-majeure]
- id: audit-tunnel-distances-plurielles
  consulte_le: '2026-09-22'
  url: https://www.cetu.developpement-durable.gouv.fr/IMG/pdf/CETU-Note_Info_22_2011.pdf
  portee: 'Note technique historique, p. 2 et 7 : utilité de l’espacement à l’arrêt et distinction distances en circulation/à l’arrêt selon l’ouvrage. Sert à expliquer le mécanisme ; aucune valeur locale de 2011 n’est présentée comme une obligation actuelle.'
  notes: [r-tunnel-distance-arret]
- id: audit-pietons-traversee-conditions
  consulte_le: '2026-09-22'
  url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006177125/
  portee: 'Texte consulté de R412-37 à R412-39 : seuil de 50 m, visibilité et vitesses, prolongement des trottoirs aux intersections, interdiction de traverser le carrefour en diagonale sans passage prévu ; exceptions des aires piétonnes et zones de rencontre. Le seuil seul ne prouve pas une traversée régulière.'
  notes: [l-passage-pieton-50m, u-pieton-hors-passage, aff-u-pieton-passage-50m]
- id: audit-pietons-priorite-reguliere
  consulte_le: '2026-09-22'
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037411323
  portee: 'R415-11 consulté : priorité au piéton engagé régulièrement ou manifestant clairement cette intention. La situation de la question précise les conditions de traversée ; elle ne déduit plus la régularité du seul éloignement du passage.'
  notes: [u-pieton-hors-passage]
- id: audit-voyants-contact-roulage
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/chapitre1-faites-connaissance-avec-votre-v%C3%A9hicule/temoins-lumineux
  portee: 'Notice Clio 5 phase 1 consultée : allumage au contact/démarrage puis extinction, airbag absent au contact, huile et batterie en roulage ; surchauffe avec bref ralenti avant arrêt moteur. Exemple constructeur qui réfute les consignes universelles, pas procédure applicable à tous les véhicules. Contrôle du niveau seul insuffisant pour banaliser une alerte de pression.'
  notes: [p-demarrage-point-mort, voyant-huile, voyant-batterie, voyant-temperature, aff-m-autotest-voyants]
- id: audit-aides-fonctions
  consulte_le: '2026-09-22'
  url: https://www.securite-routiere.gouv.fr/sites/default/files/2024-06/les_aides_a_la_conduite_%28adas%29.pdf
  portee: 'PDF CNSR téléchargé et texte lu : hétérogénéité des systèmes, limites de perception, tableaux AFU/AEB et régulateurs. La comparaison AFU/AEB remplace le rappel AFU redondant ; pas de nouveau contrôle du calendrier GSR2.'
  notes: [m-afu-aeb, s-regulateur-limiteur]
- id: audit-regulateur-simple
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/la-conduite/regulateur-de-vitesse-10
  portee: 'Notice Renault consultée : régulation simple et conditions d’utilisation, circulation dense et chaussée glissante. Le contexte des deux affirmations précise désormais non adaptatif ; aucune règle universelle de désactivation par débrayage.'
  notes: [aff-m-regulateur-obstacle, aff-m-regulateur-conditions]
- id: audit-limiteur-descente
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/la-conduite/limiteur-de-vitesse-4
  portee: 'Notice consultée : consigne susceptible d’être dépassée en forte descente. Cet exemple suffit à réfuter la garantie universelle ; ne pas généraliser l’absence de freinage à tous les limiteurs.'
  notes: [s-regulateur-limiteur, aff-m-limiteur-descente]
- id: audit-acc-obstacle-decouvert
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/la-conduite/regulateur-de-vitesse-adaptatif-0
  portee: 'Notice Austral, édition 7 avril–14 juillet 2025 : accélération et freinage, limites quand le véhicule suivi déboîte et découvre un véhicule arrêté, absence de freinage d’urgence par l’ACC. Cas transposé sans enseigner les seuils propres au modèle.'
  notes: [aff-m-regulateur-adaptatif]
- id: audit-maintien-voie
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/fonctions-daides-suppl%C3%A9mentaires-%C3%A0-la-conduite/aide-au-maintien-de-voie
  portee: 'Notice Megane Sedan depuis novembre 2025 : correction de direction, mauvaises conditions pouvant produire une correction erronée ou absente. Retrait de la désactivation présentée comme automatique et du calendrier réglementaire accessoire.'
  notes: [m-ldw-lka]
- id: audit-angle-mort-controles
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/content/xjk/driving/additional-driving-aid-functions/avertisseur-dangle-mort
  portee: 'Notice Express : périmètre, capteurs, conditions de détection et limites. Retrait de l’affirmation selon laquelle le regard par-dessus l’épaule serait la seule vérification fiable ; rétroviseurs et contrôle direct se complètent.'
  notes: [aff-m-angle-mort-moto]
- id: audit-ecall-bilan
  consulte_le: '2026-09-22'
  url: https://europa.eu/youreurope/citizens/travel/security-and-emergencies/emergency-assistance-vehicles-ecall/index_fr.htm
  portee: 'Fiche UE consultée : appel automatique ou manuel au 112, localisation et communication vocale. Ne plus garantir la transmission du nombre d’occupants ; recentrer le rappel sur l’utilité de l’appel et le bilan humain.'
  notes: [s-ecall]
- id: audit-batterie-compatibilite
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/d%C3%A9pannage/batterie-depannage
  portee: 'Notice Clio 5 (septembre 2025–mars 2026) consultée : tension identique, bornes déportées, interdiction d’utiliser la version E-tech full hybrid comme donneuse. Exemple constructeur justifiant la vérification des deux notices, sans imposer son ordre de branchement à tous les véhicules.'
  notes: [m-batterie-cables]
- id: audit-installation-verrouillage
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/si%C3%A8ges-avant/sieges-avant-4
  portee: 'Notice lue : verrouillage après réglage, véhicule à l’arrêt. Remplace la généralisation non étayée sur les bras croisés. Notice Trafic « Ceintures de sécurité avant » (édition juillet 2025–février 2026) également lue pour adapter la position avant la ceinture ; le cas des miroirs après déplacement du siège est une application géométrique, pas un ordre réglementaire.'
  notes: [aff-p-siege-verrouille, p-ordre-installation]
- id: audit-retroviseurs-installation
  consulte_le: '2026-09-22'
  url: https://www.user-manual.renault.com/fr/r%C3%A9trovision/retroviseurs-1
  portee: 'Notice lue : distances apparentes, zones du miroir extérieur, levier jour/nuit ou atténuation automatique. Repères pédagogiques de cadrage conservés et bornés au miroir classique/terrain plat ; retrait de deux images qui donnaient la réponse et de l’exclusivité non étayée du miroir intérieur pour juger les distances.'
  notes: [p-retro-interieur, p-retro-exterieurs, aff-p-retro-interieur-nuit]
- id: audit-stationnement-immobilisation
  consulte_le: '2026-09-22'
  url: https://www.nissan.fr/etre-proprietaire-d-une-nissan/manuels-utilisation/manuels/iom/juke/0f16/e0/2024/stationnement-3.shtml
  portee: 'Notice Juke 2024 lue : roues avec/sans bordure, rapport et frein, distinction Stop & Start/contact coupé. Notice Renault Megane 4 « Levier de vitesses, frein à main » et R417-8 sur Légifrance également lus. Conseils techniques applicables au cas décrit, pas procédure identique pour tous les véhicules. Schéma de pente retiré : direction ambiguë et roues déjà braquées au recto.'
  notes: [p-pente-roues, p-pente-vitesse, p-quitter-checklist, aff-p-boite-auto-position-p]
- id: audit-absence-enfant
  consulte_le: '2026-09-22'
  url: https://www.securite-civile.interieur.gouv.fr/actualites/actualites/fortes-chaleurs-canicule-quels-sont-bons-reflexes-a-adopter-pour-preserver-sa-sante
  portee: 'Conseil officiel lu : enfant/animal au soleil, danger même pour une courte absence. Notice Nissan ci-dessus lue pour les autres dangers sans surveillance ; texte indexé Ameli « Canicule : la protection spécifique des personnes à risque » pour les fenêtres ouvertes (accès direct en échec). Retrait du couple 70 °C/20 min et de la généralisation sur la transpiration des animaux.'
  notes: [p-enfants-seuls]
- id: audit-objets-vol
  consulte_le: '2026-09-22'
  url: https://www.interieur.gouv.fr/fr/Archives/Archives-de-la-rubrique-Ma-securite/Avec-votre-vehicule/Contre-les-vols-de-voitures-et-d-accessoires-les-bons-reflexes
  portee: 'Page archivée du 12 mai 2015 lue, uniquement les conseils de prévention : emporter documents/valeurs, fermer et verrouiller, objets hors de vue. Retrait de la causalité automatique objet visible/effraction et de l’inutilité absolue d’un rangement à l’arrivée ; pas de validation des démarches administratives anciennes de la page.'
  notes: [p-quitter-objets]
- id: audit-chantier-anticipation
  consulte_le: '2026-09-22'
  url: https://www.bison-fute.gouv.fr/IMG/pdf/Chantiers_en_cours.pdf
  portee: 'Conseils de conduite lus : vigilance dès la première signalisation annonçant les travaux, réduction de vitesse et respect des indications. Consultation limitée à ces conseils, sans reprendre les chiffres du dépliant ni valider une implantation réglementaire de chantier.'
  notes: [r-chantier-approche]
