  portee: 'Code consolidé au 10/09/2026 : R223-8 IV (décret 2025-1437, demande de remboursement ou d’interruption du recouvrement dans les 15 jours ouvrables après le stage), R413-19 (80 km/h à gauche seulement si circulation fluide, visibilité et adhérence suffisantes), R412-43-3 II, R412-1-1, R311-1 6.15 et 4.1.3 (EDPM, cyclomobile léger), R413-17 III 3°, R234-1 ; arrêté du 2 juillet 1982, annexe 7 (fond jaune, listel et pictogramme bleu nuit) ; C29a présignalisation d’un créneau 2 × 2 voies ou d’une section à chaussées séparées, avec panonceau M1.'
  notes: [d-probatoire-3-points, aff-r-autoroute-voie-gauche-80, u-velo-chiffres, b9b, u-enfants-sortie-ecole, c29a, c24a, c24c, c-alcool-seuils-sang]
- id: pieton-canne-blanche-2026-09-23
  consulte_le: '2026-09-23'
  url: https://www.legifrance.gouv.fr/codes/texte_lc/LEGITEXT000006074228/
  portee: 'Code consolidé au 10/09/2026 : aucune disposition propre aux piétons aveugles ou à la canne blanche (recherche « canne », « aveugle », « malvoyant ») ; R415-11 (céder au piéton qui s’engage ou manifeste clairement l’intention de traverser) et R412-6 (prudence accrue envers les plus vulnérables) s’appliquent. La règle « canne levée = arrêt partout » relève du droit suisse (OCR), pas du Code français.'
  notes: [u-pieton-canne-blanche]
- id: c107-arrete-1967-vitesse
  consulte_le: '2026-09-23'
  url: https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000829916/
  portee: 'L’arrêté du 24 novembre 1967 (version du 25/04/2025) dit encore que la route à accès réglementé (C107) est limitée à 110 km/h « sauf indication contraire » ; le décret, postérieur et supérieur (R413-2 I : 110 sur les routes à deux chaussées séparées par un terre-plein, 80 sur les autres), l’emporte. Le deck enseigne R413-2 : C107 ne fixe pas à lui seul 110 km/h.'
  notes: [c107, conf-c107-c207, l-c107-route-simple, l-c107-route-separee]
- id: l237-1-decret-liste-2026-09-23
  consulte_le: '2026-09-23'
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054724812
  portee: 'L237-1 (loi 2026-798) : ivresse manifeste, usage manifeste de stupéfiants et consommation manifeste d’une substance psychoactive « figurant sur une liste établie […] par décret en Conseil d’État ». Au 23/09/2026, ce décret n’est pas publié (questions écrites à l’Assemblée nationale en attente) : le 3° n’est pas encore applicable, aucune substance n’est nommée par la carte.'
  notes: [d-alcool-delit]

