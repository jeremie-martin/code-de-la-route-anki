- id: tram-priorite-iisr
  consulte_le: '2026-09-23'
  url: https://www.msr25.doubs.developpement-durable.gouv.fr/IMG/pdf/iisr_3eme_partie_intersections_et_regimes_de_priorite.pdf
  portee: 'R422-3 I (Code consolidé au 10/09/2026) soumet les tramways sur chaussée aux prescriptions absolues et aux agents ; l’IISR 3e partie (art. 42-9 B 3°, carrefours à feux) lit ce même article comme donnant la priorité de passage aux tramways : feux éteints ou au jaune clignotant général, la route prioritaire qui croise les voies perd ce caractère, perte signalée en amont. Règle du deck maintenue, source complétée.'
  notes: [r-tram-priorite, scn-tram-droite-moi-prioritaire]
