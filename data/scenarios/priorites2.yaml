# Thème L : Scénarios de priorité complémentaires (réponses vérifiées par build/priority.py)

- id: scn-stop-trois-vehicules
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: stop}
      E: {vehicle: {colour: rouge}, goes: straight}
      W: {vehicle: {colour: vert}, goes: left}
  check: {order: [E, W, S]}
  question: Les véhicules suivent les flèches. Dans quel ordre passent-ils ?
  reponse: 'Rouge, puis verte, puis moi : mon STOP me fait céder aux deux ; la verte tourne à gauche et cède à la rouge qui vient en face.'
  explication: 'Mon STOP ne change rien entre les véhicules de la route transversale : ils se départagent par leurs propres
    règles.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-6 et R415-4"
- id: scn-cedez-face-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      N: {vehicle: {colour: rouge}, goes: left}
      E: {vehicle: {colour: vert}, goes: straight, sign: cedez}
  check: {order: [S, N, E]}
  question: "Les véhicules suivent les flèches. Quel est l'ordre de passage ?"
  reponse: 'Moi, puis la rouge, puis la verte : la verte a un cédez-le-passage ; la rouge tourne à gauche et me cède.'
  explication: Le cédez-le-passage de la verte vaut envers tous les véhicules de la route transversale, quel que soit leur
    côté, même la rouge, qui tourne à gauche et n’a pas de panneau.
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-7 et R415-4"
- id: scn-prioritaire-droite-arrive
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: prioritaire
      E:
        vehicle:
          colour: rouge
        goes: straight
        sign: cedez
  check:
    pair:
    - S
    - E
    - avant
  question: "Dois-je céder le passage à la voiture rouge ?"
  reponse: 'Non : je suis sur une route prioritaire (losange jaune) et la rouge a un cédez-le-passage.'
  explication: 'Le losange jaune indique une route prioritaire jusqu’au losange barré : la position de la rouge à
    ma droite ne change rien, son cédez-le-passage lui impose d’attendre.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-7 ; IISR (AB6)
- id: scn-fin-prioritaire
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: fin_prioritaire}
      E: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Qui passe en premier à cette intersection ?"
  reponse: 'La rouge : le losange barré que je viens de passer met fin à la route prioritaire ; la priorité à droite s''applique.'
  explication: Le losange jaune barré annonce la fin du caractère prioritaire. Sans autre signalisation, la priorité à droite s’applique ; le triangle avec une croix noire peut la rappeler.
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 ; IISR (AB7)"
- id: scn-feu-vert-pieton
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right, sign: feu_vert}
      W: {vehicle: {colour: rouge}, goes: straight, sign: feu_rouge}
    crosswalks: [E]
    pedestrian: E
  question: "Je suis la flèche. Qui passe en premier, le piéton ou moi ?"
  reponse: "Le piéton : le feu vert ne me donne pas la priorité sur les piétons engagés ou qui manifestent l'intention de traverser la rue abordée."
  explication: "R415-11 (135 €, 6 points). Même règle pour un cycliste sur une bande cyclable que je coupe. La rouge, au feu rouge, attend."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-11"
- id: scn-tram-droite-moi-prioritaire
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: prioritaire}
      E: {vehicle: {colour: jaune, kind: tram}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Le tramway et moi arrivons en même temps. Qui passe en premier ?"
  reponse: "Le tramway : il est prioritaire sur tous les usagers, même sur une route à caractère prioritaire."
  explication: "R422-3 : priorité aux véhicules sur rails. Seuls une signalisation qui le lui impose (feux, panneau) ou un agent peuvent l'arrêter. Il ne peut ni dévier ni freiner court."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R422-3 ; IISR 3e partie, art. 42-9 B 3°"
- id: scn-t-intersection-droite
  kind: intersection
  spec:
    branches: [N, S, E]
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: left}
  check: {pair: [S, E, apres]}
  question: "Intersection en T sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "La rouge : elle vient de ma droite et la priorité à droite s'applique même dans une intersection en T."
  explication: 'Beaucoup de candidats croient que la route « qui continue » est prioritaire : sans panneau, non. Seule une signalisation (STOP, cédez-le-passage, panneau de priorité, feux, agent) ou une sortie de chemin de terre ou de parking changerait l’ordre.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-agent-bras-leve
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: feu_vert}
      E: {vehicle: {colour: rouge}, goes: straight, sign: feu_rouge}
    agent: bras_leve
  question: Mon feu est vert. L'agent au centre du carrefour fait le geste montré dans le médaillon. Que fais-je ?
  reponse: 'Je m''arrête : bras levé = arrêt pour tous les usagers, sauf ceux déjà engagés ; les ordres de l''agent priment sur les feux.'
  explication: "R411-28. Le bras levé annonce en général un changement de sens de passage ; on attend le geste suivant."
  theme: L
  sous_theme: agents
  source: "Code de la route, art. R411-28"
- id: scn-pompiers-face-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: feu_vert
      N:
        vehicle:
          colour: rouge
          kind: pompiers
          siren: true
        goes: left
        sign: feu_vert
  check:
    pair:
    - S
    - N
    - apres
  question: Feu vert pour moi ; en face, un véhicule de pompiers (sirène, gyrophare) tourne à sa gauche, coupant
    ma route. Qui passe ?
  reponse: 'Les pompiers : un véhicule prioritaire en intervention passe avant tout le monde, même s''il tourne
    à gauche et même si j''ai le feu vert.'
  explication: 'R415-12 : céder « en toutes circonstances ». Je m''arrête et je lui laisse le carrefour,
    sans manœuvre dangereuse.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-12
- id: scn-pd-droite-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: left}
  check: {pair: [S, E, apres]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "La rouge : elle vient de ma droite. La règle du tourne-à-gauche ne la fait céder qu'aux véhicules qui arrivent en face d'elle, pas à moi."
  explication: Priorité à droite (R415-5), quelle que soit la direction prise par le véhicule de droite. Je ralentis et
    je la laisse tourner.
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-4"
- id: scn-t-moi-branche
  kind: intersection
  spec:
    branches: [E, W, S]
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, avant]}
  question: "Intersection en T sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "Moi : je suis à sa droite. Sans panneau, la route « qui continue » n'est pas prioritaire."
  explication: 'La forme en T ne change pas la priorité à droite entre routes ordinaires : la rouge vient de ma gauche
    et me cède le passage. Un panneau de priorité, une sortie de parking ou un chemin de terre changeraient l’analyse.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-moi-sortie-parking
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, private: true}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, apres]}
  question: "Je sors d'un parking pour traverser la rue. Qui passe en premier, la voiture rouge ou moi ?"
  reponse: 'La rouge : en débouchant d’une aire de stationnement sur la rue, je cède aux véhicules des deux côtés.'
  explication: Cette obligation vaut aussi pour un parking ouvert au public. Je franchis le trottoir à très faible
    allure en laissant passer les piétons ; la priorité à droite ne joue pas en ma faveur.
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-9 et R415-11"
- id: scn-pd-cycliste-droite
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: vert, kind: bike}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Intersection sans signalisation. Dois-je céder le passage au cycliste ?"
  reponse: "Oui : la priorité à droite vaut pour tout véhicule, vélo compris. Je ralentis et je le laisse passer."
  explication: "R415-5 ne distingue pas les catégories de véhicules : un cycliste, une trottinette électrique ou un cyclomoteur venant de droite ont la priorité. Sa vulnérabilité impose en plus une prudence accrue (R412-6) : ne pas s'engager en comptant sur son freinage."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R412-6"
- id: scn-giratoire-autre-entree
  kind: roundabout
  spec:
    giratoire: true
    vehicles:
      - {pos: S, colour: bleu, me: true, goes: left, distance: 20}
      - {pos: W, colour: rouge, goes: straight, distance: 22}
  question: "L'anneau est vide et je veux prendre la troisième sortie. Puis-je m'engager avant la voiture rouge ?"
  reponse: 'Oui : à ce giratoire (cédez-le-passage aux entrées), je ne cède qu''aux véhicules déjà dans l''anneau. Une fois engagé, c''est la rouge qui me cédera le passage.'
  explication: "R415-10 : priorité aux usagers qui circulent sur l'anneau ; un véhicule arrêté à une autre entrée n'y est pas encore. Conseil : clignotant gauche à l'entrée puisque je dépasse la moitié de l'anneau, puis clignotant droit avant ma sortie, en contrôlant à droite."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-10"
- id: scn-deux-stops-face
  kind: intersection
  spec:
    approaches:
      N:
        goes: left
        sign: stop
        vehicle:
          colour: rouge
      S:
        goes: straight
        sign: stop
        vehicle:
          colour: bleu
          me: true
  check:
    pair:
    - S
    - N
    - avant
  question: "Les deux voitures ont marqué l'arrêt à leur ligne et la route transversale est libre. Les véhicules suivent les flèches. Qui repart en premier ?"
  reponse: 'Moi : entre nous deux, celui qui tourne à gauche cède à celui qui vient en face.'
  explication: 'Nos deux STOP règlent la priorité avec la route transversale, pas entre nous : on revient à la règle du
    tourne-à-gauche (R415-4). C’est la réponse attendue à l’exemple officiel de 2023 (Q2).'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-4 et R415-6 ; Sécurité routière, Exemples de nouvelles questions (Q2)"
