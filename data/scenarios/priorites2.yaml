# Thème L — Scénarios de priorité complémentaires (réponses vérifiées par build/priority.py)

- id: scn-stop-trois-vehicules
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: stop}
      E: {vehicle: {colour: rouge}, goes: straight}
      W: {vehicle: {colour: vert}, goes: left}
  check: {order: [E, W, S]}
  question: "J'ai un STOP. Sur la route transversale, la rouge (à ma droite) va tout droit et la verte (à ma gauche) tourne à sa gauche. Dans quel ordre passent les véhicules ?"
  reponse: "Rouge, puis verte, puis moi."
  explication: "Au STOP, je passe après tous les véhicules de la route prioritaire, quel que soit leur sens. Entre eux : la verte tourne à gauche et cède donc à la rouge qui vient en face."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-6 et R415-4"
- id: scn-cedez-face-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      N: {vehicle: {colour: rouge}, goes: left}
      E: {vehicle: {colour: vert}, goes: straight, sign: cedez}
  check: {order: [S, N, E]}
  question: "Je vais tout droit ; en face, la rouge tourne à sa gauche ; à ma droite, la verte a un cédez-le-passage. Ordre de passage ?"
  reponse: "Moi, puis la rouge, puis la verte."
  explication: "La verte cède à tous (cédez-le-passage), même si elle est à ma droite. La rouge tourne à gauche et cède à moi qui viens en face. La verte passe en dernier, après la rouge qui est sur la route prioritaire."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-7 et R415-4"
- id: scn-prioritaire-droite-arrive
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: prioritaire
      E:
        vehicle:
          colour: rouge
        goes: straight
        sign: cedez
  check:
    pair:
    - S
    - E
    - avant
  question: Je suis sur une route prioritaire (losange jaune). Une voiture arrive de ma droite. Dois-je lui
    céder le passage ?
  reponse: Non. La voiture rouge doit me céder le passage.
  explication: 'Le losange jaune (AB6) vaut jusqu''au panneau de fin (AB7). Je garde un œil sur la rouge :
    « prioritaire » n''exonère pas de prudence.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-7 ; IISR (AB6)
- id: scn-fin-prioritaire
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: fin_prioritaire}
      E: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Je viens de passer un losange jaune barré (fin de route prioritaire). Une voiture arrive de ma droite à l'intersection suivante. Qui passe ?"
  reponse: "La rouge : la fin de route prioritaire rétablit la priorité à droite."
  explication: "AB7 = fin du caractère prioritaire ; sans autre panneau, la règle générale s'applique (R415-5). Un AB1 (croix) peut rappeler la priorité à droite."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 ; IISR (AB7)"
- id: scn-feu-vert-pieton
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right, sign: feu_vert}
      W: {vehicle: {colour: rouge}, goes: straight, sign: feu_rouge}
    crosswalks: [E]
    pedestrian: E
    caption: "Un piéton traverse la rue où je tourne"
  question: "Feu vert, je tourne à droite ; un piéton traverse la rue dans laquelle je m'engage. Qui passe ?"
  reponse: "Le piéton : le feu vert ne me donne pas la priorité sur les piétons engagés ou qui manifestent l'intention de traverser la rue abordée."
  explication: "Article R415-11 (135 €, 6 points). Même règle pour un cycliste sur une bande cyclable que je coupe. La rouge, au feu rouge, attend."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-11"
- id: scn-tram-droite-moi-prioritaire
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: prioritaire}
      E: {vehicle: {colour: jaune, kind: tram}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Je suis sur une route prioritaire ; un tramway arrive sur ma droite. Qui passe ?"
  reponse: "Le tramway : il est prioritaire sur tous les usagers, même sur une route à caractère prioritaire."
  explication: "Article R422-3 : priorité aux véhicules sur rails. Seuls des feux propres au tram ou un agent peuvent l'arrêter. Il ne peut ni dévier ni freiner court."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R422-3"
- id: scn-t-intersection-droite
  kind: intersection
  spec:
    branches: [N, S, E]
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: left}
  check: {pair: [S, E, apres]}
  question: "Intersection en T sans signalisation : la route se prolonge tout droit et une rue débouche à ma droite ; la voiture rouge en sort pour tourner à sa gauche. Qui passe ?"
  reponse: "La rouge : elle vient de ma droite et la priorité à droite s'applique même dans une intersection en T."
  explication: "Beaucoup de candidats croient que la route « qui continue » est prioritaire : sans panneau, non. Seuls un STOP, un cédez-le-passage ou une sortie de chemin/parking changeraient l'ordre."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-agent-bras-leve
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: feu_vert}
      E: {vehicle: {colour: rouge}, goes: straight, sign: feu_rouge}
    agent: bras_leve
  question: "Mon feu est vert, mais l'agent au centre du carrefour lève le bras verticalement. Que fais-je ?"
  reponse: "Je m'arrête : bras levé = arrêt pour tous les usagers, et les ordres de l'agent priment sur les feux."
  explication: "Article R411-28. Le bras levé annonce en général un changement de sens de passage ; on attend le geste suivant."
  theme: L
  sous_theme: agents
  source: "Code de la route, art. R411-28"
- id: scn-pompiers-face-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: feu_vert
      N:
        vehicle:
          colour: rouge
          kind: pompiers
          siren: true
        goes: left
        sign: feu_vert
  check:
    pair:
    - S
    - N
    - apres
  question: Feu vert pour moi ; en face, un véhicule de pompiers (sirène, gyrophare) tourne à sa gauche, coupant
    ma route. Qui passe ?
  reponse: 'Les pompiers : un véhicule prioritaire en intervention passe avant tout le monde, même s''il tourne
    à gauche et même si j''ai le feu vert.'
  explication: 'Article R415-12 : céder « en toutes circonstances ». Je m''arrête et je lui laisse le carrefour,
    sans manœuvre dangereuse.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-12
- id: scn-pd-droite-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: left}
  check: {pair: [S, E, apres]}
  question: "Intersection sans signalisation. La voiture rouge, à ma droite, tourne à sa gauche et va couper ma route. Qui passe en premier ?"
  reponse: "La rouge : elle vient de ma droite. La règle du tourne-à-gauche ne la fait céder qu'aux véhicules qui arrivent en face d'elle, pas à moi."
  explication: "Priorité à droite (R415-5), quelle que soit la direction prise par le véhicule de droite. Le tourne-à-gauche (R415-4) impose de céder aux véhicules venant en sens inverse : pour la rouge, ce serait un véhicule venant de ma gauche. Je ralentis et je la laisse tourner."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-4"
- id: scn-t-moi-branche
  kind: intersection
  spec:
    branches: [E, W, S]
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, avant]}
  question: "Intersection en T sans signalisation : ma rue débouche sur la route transversale et je tourne à droite ; la voiture rouge arrive de ma gauche. Qui passe en premier ?"
  reponse: "Moi : je suis à sa droite. Sans panneau, la route « qui continue » n'est pas prioritaire."
  explication: "Priorité à droite (R415-5), même en T et même pour celui qui débouche d'une rue. Seuls un STOP, un cédez-le-passage ou une sortie de chemin de terre, de parking ou de voie privée changeraient l'ordre. Je vérifie que la rouge ralentit avant de m'engager."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-moi-sortie-parking
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, private: true}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, apres]}
  question: "Je sors d'un parking pour traverser la rue ; la voiture rouge arrive de ma gauche. Qui passe en premier ?"
  reponse: "La rouge : en sortant d'un lieu non ouvert à la circulation publique, je cède le passage à tous, même à ceux qui viennent de ma gauche."
  explication: "R415-9 : le conducteur qui débouche d'un parking, d'une station-service, d'un chemin de terre ou d'une voie privée cède le passage à tout autre véhicule, et aux piétons du trottoir qu'il franchit (R415-11). La priorité à droite ne joue pas en ma faveur ici."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-9 et R415-11"
- id: scn-pd-cycliste-droite
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: vert, kind: bike}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Intersection sans signalisation : un cycliste arrive de ma droite. Dois-je lui céder le passage ?"
  reponse: "Oui : la priorité à droite vaut pour tout véhicule, vélo compris. Je ralentis et je le laisse passer."
  explication: "R415-5 ne distingue pas les catégories de véhicules : un cycliste, une trottinette électrique ou un cyclomoteur venant de droite ont la priorité. Sa vulnérabilité impose en plus une prudence accrue (R412-6) : ne pas s'engager en comptant sur son freinage."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R412-6"
- id: scn-giratoire-autre-entree
  kind: roundabout
  spec:
    giratoire: true
    vehicles:
      - {pos: S, colour: bleu, me: true, goes: left, distance: 20}
      - {pos: W, colour: rouge, goes: straight, distance: 22}
  question: "Carrefour à sens giratoire (AB25 + cédez-le-passage). L'anneau est vide ; la voiture rouge attend à l'entrée située à ma gauche. Je veux prendre la troisième sortie. Puis-je m'engager ?"
  reponse: "Oui : je ne cède qu'aux véhicules déjà dans l'anneau. Une fois engagé, c'est la rouge qui me cédera le passage à son entrée."
  explication: "R415-10 : priorité aux usagers qui circulent sur l'anneau ; un véhicule arrêté à une autre entrée n'y est pas encore. Clignotant gauche à l'entrée puisque je dépasse la moitié de l'anneau, puis clignotant droit avant ma sortie, en contrôlant à droite."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-10"
