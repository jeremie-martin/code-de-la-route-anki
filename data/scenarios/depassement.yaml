  question: Un rétrécissement ne laisse passer qu’un véhicule à la fois ; une voiture arrive en face. Qui passe ?
  reponse: 'Moi : mon panneau carré bleu me donne la priorité sur le sens opposé. La voiture rouge doit attendre avant le passage étroit.'
  explication: "Priorité ne veut pas dire passage forcé : si la voiture rouge s'est déjà engagée, je la laisse sortir du rétrécissement. Piège : la couleur (rouge = je cède, bleu = je passe) et la flèche qui correspond à mon sens."
  theme: L
  sous_theme: croisement
  source: "IISR 5e partie (C18) ; Code de la route, art. R414-1"
