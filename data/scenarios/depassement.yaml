  question: "Le véhicule devant moi ralentit, clignotant gauche, pour entrer dans la rue à gauche. Puis-je le dépasser par la gauche ?"
  reponse: 'Non. Par la gauche, jamais : il a annoncé qu’il tourne à gauche. Par la droite non plus ici : à cette intersection sans signalisation qui me donne la priorité, et sans place, j’attends derrière lui.'
  explication: Un véhicule qui a signalé qu’il tourne à gauche se dépasse par la droite (R414-6). Mais à une intersection, dépasser autre chose qu’un deux-roues n’est permis que si les usagers des autres routes doivent me céder le passage (STOP, cédez-le-passage, route prioritaire), ou si des feux ou un agent règlent le carrefour (R414-11).
  theme: L
  sous_theme: depassement
  source: "Code de la route, art. R414-6 et R414-11"
