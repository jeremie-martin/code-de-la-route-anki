  question: Un rétrécissement ne laisse passer qu’un véhicule à la fois ; une voiture arrive en face. Qui passe ?
  reponse: 'Elle : mon panneau rond m’impose de céder le passage au sens opposé. Je m’arrête avant le rétrécissement.'
  explication: 'La flèche rouge vers le haut représente mon sens : je cède. De l’autre côté, le panneau carré bleu donne la priorité à la voiture rouge. Je reste avant le passage étroit pour lui laisser la place.'
  theme: L
  sous_theme: croisement
  source: "IISR 4e et 5e parties (B15, C18) ; Code de la route, art. R414-1"
- id: scn-crois-c18-je-passe
  kind: road
  spec:
    lanes: 2
