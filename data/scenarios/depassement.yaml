  question: "Bouchon sur autoroute ; ma sortie est à 500 m sur la droite. Puis-je emprunter la bande d'arrêt d'urgence pour la rejoindre ?"
  reponse: 'Non : la bande d''arrêt d''urgence est réservée aux urgences et aux secours (135 €, 3 points). Je reste
    dans ma file, feux de détresse si je suis le dernier.'
  explication: "R412-8. Sur certains tronçons, la bande d'arrêt d'urgence est ouverte à la circulation aux heures de pointe comme voie auxiliaire, mais seulement sur signalisation lumineuse explicite (flèche verte au-dessus de la voie)."
  theme: L
  sous_theme: positionnement
  source: "Code de la route, art. R412-8 et R416-18"
