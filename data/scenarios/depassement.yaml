  question: "Une voiture est en train de me dépasser. Que dois-je faire ?"
  reponse: "Serrer à droite sans accélérer, et ne surtout pas me déporter à gauche ; au besoin ralentir légèrement pour faciliter son rabattement."
  explication: "Accélérer quand on est dépassé : 135 €, 2 points (R414-16). Je ne dépasse pas non plus un véhicule qui est lui-même en train de dépasser."
  theme: L
  sous_theme: depassement
  source: "Code de la route, art. R414-16"
- id: scn-dep-passage-pieton
  kind: road
  spec:
    lanes: 2
    axis: discontinue
    vehicles:
      - {lane: 1, y: 15, colour: bleu, me: true}
      - {lane: 1, y: 45, colour: gris, kind: truck, occludes: true}
    extras:
      - {kind: passage_pieton, y: 62}
  question: 'Le camion devant moi est arrêté avant le passage piéton. Je ne vois aucun piéton depuis ma voiture
    bleue. Puis-je le dépasser ?'
  reponse: Non. Le camion me masque une partie du passage ; je reste derrière, prêt à céder le passage et à m’arrêter.
  explication: 'Pour dépasser à l’approche d’un passage piéton, je dois pouvoir m’assurer qu’aucun piéton n’y est engagé.
    Ne pas en voir ne suffit pas quand la vue est masquée. Les hachures montrent ce que le camion cache dans ce schéma,
    sans affirmer qu’un piéton s’y trouve ni garantir la visibilité partout ailleurs.'
  theme: L
  sous_theme: depassement
  source: "Code de la route, R414-5, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842217"
