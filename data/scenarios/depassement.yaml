      colour: gris
  question: Les autres conditions du dépassement sont réunies. Le marquage me permet-il de commencer à dépasser ?
  reponse: 'Non : la ligne de mon côté est continue. Le sens opposé dispose d’une ligne discontinue, mais ses
    conducteurs doivent aussi vérifier toutes les conditions de sécurité.'
  explication: 'R412-20 : on ne franchit une ligne mixte que si la ligne discontinue est de son côté
    au début de la manœuvre, et la manœuvre doit être terminée avant la fin de la discontinue.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-20
