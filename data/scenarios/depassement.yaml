  question: Un engin agricole roule à 25 km/h devant moi ; bonne visibilité, personne en face. Puis-je le dépasser ?
  reponse: 'Oui : je peux dépasser cet engin très lent si je peux terminer la manœuvre sans danger.'
  explication: La ligne de dissuasion est discontinue. Elle déconseille le dépassement des véhicules à allure
    normale, souvent trop long pour la visibilité disponible. Elle peut annoncer une ligne continue.
  theme: L
  sous_theme: depassement
  source: IISR 7e partie, art. 113 ; Code de la route, art. R412-18
