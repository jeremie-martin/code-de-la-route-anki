  question: "Le véhicule devant moi ralentit, clignotant gauche, pour entrer dans la rue à gauche. Puis-je le dépasser par la gauche ?"
  reponse: 'Non : jamais par la gauche un véhicule qui a annoncé qu''il tourne à gauche ; par la droite si la place
    le permet, sinon j''attends.'
  explication: "Un véhicule qui tourne à gauche se dépasse par la droite (R414-6). À une intersection, dépasser n'est permis que si je suis prioritaire, si des feux ou un agent règlent le carrefour, ou pour dépasser un deux-roues (R414-11)."
  theme: L
  sous_theme: depassement
  source: "Code de la route, art. R414-6 et R414-11"
