  question: Le camion roule lentement. (1) Le marquage autorise-t-il à le dépasser ? (2) Puis-je le dépasser maintenant ?
  reponse: '(1) Oui : la ligne est discontinue. (2) Non : le sommet de côte masque la route en face ; sans visibilité suffisante, le dépassement est interdit.'
  explication: 'R414-11. Le marquage n''est pas une garantie de visibilité : c''est au conducteur de juger.
    Un véhicule peut surgir derrière le sommet à 80 km/h.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-11
