  question: Le camion roule lentement ; bonne visibilité, personne en face ni derrière. Le marquage permet-il
    de le dépasser ?
  reponse: 'Oui : le marquage l’autorise, sous réserve d’une visibilité et d’un espace suffisants pour dépasser
    puis me rabattre sans gêner.'
  explication: 'Conditions de R414-4 : visibilité suffisante, personne ne me dépasse, écart de vitesse
    suffisant, retour sans gêner. Un camion se dépasse sur une longue distance : ne pas s''engager sans marge.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-4 et R412-18
