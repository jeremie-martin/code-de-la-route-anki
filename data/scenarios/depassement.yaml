  question: Le camion devant moi est arrêté avant le passage piéton. Je ne vois aucun piéton depuis ma place. Puis-je le dépasser ?
  reponse: Non. Le camion me masque une partie du passage ; je reste derrière, prêt à céder le passage et à m’arrêter.
  explication: Pour dépasser à l’approche d’un passage piéton, je dois pouvoir m’assurer qu’aucun piéton n’y est engagé. Ne pas en voir ne suffit pas quand la vue est masquée.
  theme: L
  sous_theme: depassement
  source: "Code de la route, R414-5, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842217"
