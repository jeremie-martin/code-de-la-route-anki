  question: "Je ralentis, clignotant gauche, pour tourner dans la rue à gauche. Dans le rétroviseur, une voiture est déjà en train de me dépasser. Puis-je tourner maintenant ?"
  reponse: "Non : j'attends qu'elle m'ait dépassé ; me déporter à gauche maintenant la couperait."
  explication: "R412-10 impose d'avertir ; le clignotant ne dispense pas de vérifier que je peux tourner sans danger, et celui qui est sur le point d'être dépassé serre à droite (R414-16). Le clignotant annonce, il n'autorise pas : rétroviseur puis angle mort gauche avant de se déporter, même si l'autre n'aurait pas dû me dépasser par la gauche après mon signal (R414-6)."
  theme: L
  sous_theme: depassement
  source: "Code de la route, art. R412-10, R414-16 et R414-6"
