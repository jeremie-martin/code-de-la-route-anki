  question: La route au-delà de la zone indiquée est masquée. Puis-je dépasser le camion maintenant ?
  reponse: 'Non : sans visibilité suffisante vers l''avant (sommet de côte, virage), le dépassement est interdit
    sur une chaussée à double sens, même avec une ligne discontinue.'
  explication: 'Article R414-11. Le marquage n''est pas une garantie de visibilité : c''est au conducteur de juger.
    Un véhicule peut surgir derrière le sommet à 90 km/h.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-11
