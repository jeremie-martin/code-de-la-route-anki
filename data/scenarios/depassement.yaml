  question: La voiture rouge arrive trop vite pour que je termine avant son arrivée. Puis-je dépasser le camion
    maintenant ?
  reponse: 'Non : je n''emprunte la voie de gauche que si personne n''arrive en face sur toute la longueur du dépassement.'
  explication: 'Article R414-7. Un dépassement de camion demande plusieurs centaines de mètres : la voiture rouge
    arriverait avant que je me rabatte.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R414-7
