  question: Le camion roule lentement ; bonne visibilité, personne en face ni derrière. Le marquage permet-il
    de le dépasser ?
  reponse: 'Non : dépasser ce camion demanderait de franchir ou chevaucher la ligne continue, ce qui est interdit
    ici.'
  explication: 'L’exception de chevauchement pour dépasser un cycle, un EDPM ou un cyclomobile léger ne concerne
    pas ce camion. Hors exception : 3 points pour franchissement, 1 pour chevauchement.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-19
