  question: Hors agglomération, bonne visibilité, personne en face ni en train de me dépasser. Un simple chevauchement
    permettrait de laisser 1,50 m au cycliste puis de revenir sans gêner. Puis-je dépasser ?
  reponse: 'Oui : l’exception autorise le chevauchement pour dépasser un cycle, si toutes les conditions de
    sécurité sont réunies. Elle n’autorise pas le franchissement complet.'
  explication: 'Exception de R412-19 (2015) : chevauchement autorisé pour dépasser un cycle, un
    EDPM ou un cyclomobile léger, dans les conditions de sécurité de R414-4. Avec un véhicule en face ou sans
    visibilité, j''attends derrière.'
  theme: L
  sous_theme: depassement
  source: Code de la route, art. R412-19 et R414-4
