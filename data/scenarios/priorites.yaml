# Thème L : Scénarios de priorité (schémas générés, réponses vérifiées par build/priority.py)
# Convention : « MOI » = voiture bleue cerclée de jaune, toujours en bas (approche S). Les flèches indiquent l'intention.
# check.order = ordre calculé attendu (lettres d'approche : N, E, S, W) ; check.pair = [a, b, avant|apres|independant].

# ---------- Priorité à droite ----------
- id: scn-pd-droite-tout-droit
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Intersection sans aucune signalisation. Je passe avant ou après la voiture rouge ?"
  reponse: "Après : elle vient de ma droite."
  explication: "Sans signalisation, c'est la priorité à droite (R415-5). Je ralentis à l'approche pour pouvoir m'arrêter, je cède le passage, puis je passe."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-pd-gauche-tout-droit
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, avant]}
  question: "Intersection sans signalisation. Je passe avant ou après la voiture rouge ?"
  reponse: "Avant : elle vient de ma gauche, je suis à sa droite."
  explication: 'Priorité à droite : le rouge, qui vient de ma gauche, doit me céder le passage. Rien à ma droite,
    aucun panneau : je passe.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-pd-trois-vehicules
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: straight}
      N: {vehicle: {colour: vert}, goes: straight}
  check: {order: [N, E, S]}
  question: "Intersection sans signalisation, trois véhicules. Dans quel ordre passent-ils ?"
  reponse: "Vert, puis rouge, puis moi."
  explication: "Le vert n'a personne à sa droite : il passe en premier. Le rouge cède au vert (à sa droite) puis passe. Je cède au rouge (à ma droite) et je passe en dernier."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-pd-trois-vehicules-2
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      W: {vehicle: {colour: rouge}, goes: straight}
      N: {vehicle: {colour: vert}, goes: straight}
  check: {order: [S, W, N]}
  question: "Intersection sans signalisation, trois véhicules. Dans quel ordre passent-ils ?"
  reponse: "Moi, puis rouge, puis vert."
  explication: "Personne à ma droite : je passe en premier. Le rouge (à gauche) me cède le passage, puis passe avant le vert qui est à sa gauche. Le vert cède au rouge qui vient de sa droite."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5"
- id: scn-pd-je-tourne-gauche-face
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: left}
      N: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, N, apres]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "La rouge : en tournant à gauche, je coupe sa trajectoire, je dois la laisser passer."
  explication: "Règle du tourne-à-gauche (R415-4) : celui qui tourne à gauche cède le passage aux véhicules venant en face, qu'ils aillent tout droit ou tournent à droite. Je me place près de l'axe, clignotant, et j'attends au centre sans gêner."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-4"
- id: scn-pd-face-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      N: {vehicle: {colour: rouge}, goes: left}
  check: {pair: [S, N, avant]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "Moi : c'est elle qui coupe ma trajectoire."
  explication: "Le véhicule qui tourne à gauche cède le passage à ceux d'en face. Je vérifie qu'elle s'arrête bien avant de m'engager : un conducteur pressé peut « forcer »."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-4"
- id: scn-pd-je-tourne-gauche-droite-arrive
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: left}
      E: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, E, apres]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "La rouge : elle vient de ma droite."
  explication: "Priorité à droite, quelle que soit ma direction. Tourner à gauche est la manœuvre qui cède à presque tout le monde : véhicules de droite (priorité à droite) et véhicules d'en face (tourne-à-gauche)."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-4"
- id: scn-pd-je-tourne-gauche-gauche-arrive
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: left}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, avant]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "Moi : je suis à sa droite."
  explication: La priorité à droite joue en ma faveur ; le tourne-à-gauche m'oblige à céder aux véhicules venant d'en face,
    aux usagers d'une piste cyclable que je traverse et aux piétons de la rue que j'aborde. Je m'assure que le rouge ralentit,
    puis je tourne.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-5 et R415-4
- id: scn-pd-les-deux-tournent-droite
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right}
      N: {vehicle: {colour: rouge}, goes: right}
  check: {pair: [S, N, independant]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui doit céder le passage ?"
  reponse: "Personne : nos trajectoires ne se croisent pas, nous pouvons tourner en même temps."
  explication: "Deux véhicules qui se font face et tournent chacun à droite ne se gênent pas. Je surveille tout de même un piéton qui traverserait la rue où je m'engage."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 (aucun conflit de trajectoires)"
- id: scn-pd-face-tourne-droite-moi-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: left}
      N: {vehicle: {colour: rouge}, goes: right}
  check: {pair: [S, N, apres]}
  question: "Intersection sans signalisation. Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: "La rouge : elle a la priorité sur moi qui tourne à gauche, et elle n'a pas à traverser la chaussée."
  explication: "Tourner à gauche = céder le passage à tous les véhicules d'en face (tout droit ou à droite). Je la laisse s'engager, puis je tourne derrière elle."
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-4"

# ---------- STOP, cédez-le-passage, route prioritaire ----------
- id: scn-stop-moi
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: stop
      W:
        vehicle:
          colour: rouge
        goes: straight
  check:
    pair:
    - S
    - W
    - apres
  question: Les véhicules suivent les flèches. Dois-je passer avant ou après la voiture rouge, et pourquoi ?
  reponse: 'Après : mon STOP m''impose de m''arrêter complètement à la ligne et de céder le passage à la rouge, comme
    à tout véhicule de la route transversale.'
  explication: 'Le STOP annule la priorité à droite à mon détriment : je cède aux véhicules des deux côtés. L''arrêt
    doit être total (roues immobiles) au niveau de la ligne, même si la voie semble libre.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-6
- id: scn-stop-autre
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
      E:
        vehicle:
          colour: rouge
        goes: straight
        sign: stop
  check:
    pair:
    - S
    - E
    - avant
  question: Les véhicules suivent les flèches. Dois-je passer avant ou après la voiture rouge, et pourquoi ?
  reponse: 'Moi : la rouge a un STOP ; elle doit s’arrêter et me céder le passage, même si elle vient de ma droite.'
  explication: Un panneau de priorité remplace la priorité à droite ; il ne vise que les usagers de la route où il est implanté.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-6 et R415-7
- id: scn-cedez-moi-gauche-arrive
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: right, sign: cedez}
      W: {vehicle: {colour: rouge}, goes: straight}
  check: {pair: [S, W, apres]}
  question: "Les véhicules suivent les flèches. Puis-je m'engager avant la voiture rouge ?"
  reponse: 'Non : mon cédez-le-passage m’impose de laisser passer la rouge, même si je tourne à droite : elle va occuper
    la voie où je m’engage.'
  explication: 'Le cédez-le-passage n’impose pas l’arrêt : si la route était libre, je m’engagerais sans m’arrêter.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-7"
- id: scn-route-prioritaire-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: left, sign: prioritaire}
      N: {vehicle: {colour: rouge}, goes: straight, sign: prioritaire}
      E: {vehicle: {colour: vert}, goes: straight, sign: stop}
  check: {order: [N, S, E]}
  question: "Les véhicules suivent les flèches. Quel est l'ordre de passage ?"
  reponse: 'Rouge, puis moi, puis verte : je suis prioritaire (losange) mais je cède à la rouge qui vient d''en face ; la verte a un STOP.'
  explication: 'Le losange règle la priorité avec les routes transversales, pas entre les deux sens de la route prioritaire
    : entre la rouge et moi, c’est la règle du tourne-à-gauche (R415-4).'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-4 et R415-6"
- id: scn-deux-stops
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight, sign: stop}
      E: {vehicle: {colour: rouge}, goes: straight, sign: stop}
  check: {pair: [S, E, apres]}
  question: Les deux voitures ont marqué l’arrêt à leur ligne ; aucun autre véhicule n’approche. Qui repart en premier ?
  reponse: 'La rouge : nous avons chacun un STOP ; entre deux véhicules arrêtés au STOP, la priorité à droite s''applique.'
  explication: 'Chaque STOP oblige à céder aux véhicules de l’autre route. Ici, chacun est sur la route de l’autre et aucun texte ne nous départage : on revient à la règle générale (R415-5), et la rouge, à ma droite, repart la première.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-6"
- id: scn-sortie-parking
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
      E:
        vehicle:
          colour: rouge
        goes: straight
        private: true
  check:
    pair:
    - S
    - E
    - avant
  question: "La voiture rouge et moi arrivons en même temps. La priorité à droite s'applique-t-elle ?"
  reponse: Non. En sortant du parking, la voiture rouge doit me céder le passage.
  explication: 'R415-9 : celui qui débouche d''un accès non ouvert à la circulation publique, d''un chemin de terre ou d''une aire de stationnement doit céder le passage à tout autre véhicule. Il franchit le trottoir au pas, en laissant passer les piétons.'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R415-9 et R415-11
- id: scn-feu-vert-tourne-gauche
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: left
        sign: feu_vert
      N:
        vehicle:
          colour: rouge
        goes: straight
        sign: feu_vert
      E:
        vehicle:
          colour: vert
        goes: straight
        sign: feu_rouge
  check:
    order:
    - N
    - S
    - E
  question: Les véhicules suivent les flèches. Quel est l’ordre de passage, et quel indice tranche entre moi et
    la voiture rouge ?
  reponse: "Rouge, puis moi, puis verte (quand son feu passera au vert). Ce qui tranche entre la rouge et moi : je tourne à gauche et elle vient d'en face."
  explication: Le feu vert m'autorise à passer, mais en tournant à gauche je cède aux véhicules d'en face. Je m'avance au centre de l'intersection avec mon clignotant et je termine mon virage dès que c'est libre, même si mon feu passe au jaune.
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-33 et R415-4
- id: scn-feu-orange-clignotant
  kind: intersection
  spec:
    approaches:
      S:
        vehicle:
          colour: bleu
          me: true
        goes: straight
        sign: feu_orange_clignotant
      E:
        vehicle:
          colour: rouge
        goes: straight
        sign: feu_orange_clignotant
  question: "Les véhicules suivent les flèches. Qui passe en premier ?"
  reponse: 'La rouge : feux au jaune clignotant = prudence et retour aux panneaux ou, sans panneau, à la priorité
    à droite.'
  explication: 'Le jaune clignotant n’est pas un feu vert : il signale que les feux ne règlent plus la circulation (R412-32).'
  theme: L
  sous_theme: priorites
  source: Code de la route, art. R412-32 et R415-5
  check:
    pair:
    - S
    - E
    - apres
- id: scn-agent-bras-tendus-profil
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      E: {vehicle: {colour: rouge}, goes: straight}
    agent: bras_tendus_NS
  check: {pair: [S, E, avant]}
  question: Un agent règle la circulation. D'après sa position et celle de ses bras, puis-je passer ?
  reponse: 'Oui : je le vois de profil, dans l''axe de ses bras tendus ; la rouge, qui le voit de face, doit s''arrêter.'
  explication: "Bras tendus = barrière pour ceux qui voient l'agent de face ou de dos ; passage pour ceux qui le voient de profil. Bras levé vertical = arrêt pour tous, sauf ceux déjà engagés ou qui ne peuvent plus s'arrêter sans danger. L'agent prime sur les feux et les panneaux."
  theme: L
  sous_theme: agents
  source: "Code de la route, art. R411-28"
- id: scn-agent-bras-tendus-face
  kind: intersection
  spec:
    approaches:
      S: {vehicle: {colour: bleu, me: true}, goes: straight}
      W: {vehicle: {colour: rouge}, goes: straight}
    agent: bras_tendus_EW
  check: {pair: [S, W, apres]}
  question: "Un agent règle la circulation. La voiture rouge passe-t-elle avant moi ?"
  reponse: 'Oui : l''agent me fait face, bras tendus en travers de ma route, ce qui m''arrête ; la rouge, qui le voit de profil, est libérée.'
  explication: "De face ou de dos, bras tendus = arrêt. La priorité à droite ne compte plus quand un agent règle la circulation : seuls ses gestes décident."
  theme: L
  sous_theme: agents
  source: "Code de la route, art. R411-28"

# ---------- Giratoire / rond-point ----------
- id: scn-giratoire-cedez
  kind: roundabout
  spec:
    giratoire: true
    vehicles:
      - {pos: S, colour: bleu, me: true, goes: straight, distance: 20}
      - {pos: inside, angle: 225, colour: rouge}
  question: "Puis-je m'engager avant la voiture rouge ?"
  reponse: 'Non : les entrées portent un cédez-le-passage, c''est un carrefour à sens giratoire ; je cède aux véhicules déjà dans l''anneau.'
  explication: Avant ma sortie, je contrôle les autres usagers puis mets mon clignotant droit.
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-10 ; IISR (AB25)"
- id: scn-rond-point-priorite-droite
  kind: roundabout
  spec:
    giratoire: false
    vehicles:
      - {pos: S, colour: bleu, me: true, goes: straight, distance: 20}
      - {pos: inside, angle: 225, colour: rouge}
  question: "Puis-je m'engager avant la voiture rouge ?"
  reponse: 'Oui, si elle me laisse passer : les triangles à croix noire, sans cédez-le-passage, annoncent la priorité à droite, et j''arrive à sa droite. Je vérifie qu''elle ralentit.'
  explication: 'C’est l’inverse d’un giratoire dont les entrées portent un cédez-le-passage (R415-10) : sans lui, la règle
    générale (R415-5) s’applique aussi à l’entrée de l’anneau.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-10 ; IISR"
- id: scn-rond-point-dans-anneau
  kind: roundabout
  spec:
    giratoire: false
    vehicles:
      - {pos: inside, angle: 300, colour: bleu, me: true}
      - {pos: E, colour: rouge, goes: straight, distance: 20}
  question: "Je circule dans l'anneau. Qui passe en premier, la voiture rouge ou moi ?"
  reponse: 'La rouge : sans cédez-le-passage ni STOP aux entrées, la priorité à droite s''applique, et elle arrive à ma droite.'
  explication: 'Conséquence peu intuitive de la priorité à droite : dans un tel rond-point, je cède à chaque entrée sur ma droite, même si je suis déjà engagé. Au carrefour à sens giratoire, c''est l''inverse.'
  theme: L
  sous_theme: priorites
  source: "Code de la route, art. R415-5 et R415-10"
