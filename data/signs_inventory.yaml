- code: C111
  categorie: indication
  nom: Entrée d'un tunnel
  signification: 'Indique l''entrée d''un tunnel. Obligations liées : allumer les feux de croisement, interdiction
    de faire demi-tour, de s''arrêter ou de stationner hors emplacements d''arrêt d''urgence ; respecter les distances
    de sécurité (souvent B17).'
  conduite_a_tenir: Allumer les feux de croisement, retirer les lunettes de soleil, garder ses distances (au moins
    2 s ; ou l'intervalle du B17), ne pas dépasser si interdit, en cas d'arrêt d'urgence couper le moteur et allumer
    les feux de détresse.
  implantation: À l'entrée des tunnels de plus de 300 m (obligatoire) ; panonceau M10z avec le nom du tunnel, M2
    avec la longueur.
  fin: C112
  forme_couleur: 'carré bleu : entrée de tunnel blanche'
