- code: EB10
  categorie: localisation
  nom: Entrée d'agglomération
  signification: 'Indique l''entrée dans une agglomération : dès ce panneau, les règles propres à l''agglomération
    s''appliquent (vitesse limitée à 50 km/h sauf indication, priorité à droite en l''absence de signalisation,
    klaxon interdit sauf danger, feux de croisement obligatoires de nuit...).'
  conduite_a_tenir: Réduire à 50 km/h au niveau du panneau (avant s'il faut ralentir), redoubler d'attention (piétons,
    cyclistes, intersections).
  implantation: À la limite de l'agglomération, surmonté d'un cartouche de route (E41-E44). Seuls B14 (< 50 km/h),
    AB6, AB7, B30, B52, E31, E32 peuvent être sur le même support.
  fin: EB20
