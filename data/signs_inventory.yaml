    C27 (position), B14 30 et triangles blancs.
  conduite_a_tenir: Franchir à 30 km/h maximum, perpendiculairement, sans freiner sur la bosse ; ne pas dépasser.
  implantation: Agglomération, zones 30, aires de repos.
