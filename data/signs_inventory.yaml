- code: C207
  categorie: indication
  nom: Début d'une section d'autoroute
  signification: 'Début d''autoroute : route réservée aux véhicules à moteur rapides (interdite aux piétons, cycles,
    cyclomoteurs, tracteurs, véhicules ne pouvant dépasser 40 km/h), sans croisement à niveau. Vitesse maximale
    130 km/h (110 par temps de pluie, 110 permis probatoire, 50 si visibilité < 50 m), minimale 80 km/h sur la voie
    la plus à gauche par conditions normales. Interdits : arrêt, stationnement, marche arrière, demi-tour, circulation
    sur la bande d''arrêt d''urgence.'
