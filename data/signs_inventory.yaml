  categorie: danger
  nom: Chaussée rétrécie par la droite
  signification: Annonce un rétrécissement de la chaussée par la droite.
  conduite_a_tenir: Ralentir, contrôler le rétroviseur gauche avant de se décaler, ne pas dépasser.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
