    du tunnel / du chantier / du pont ; SR3d = pictogramme radar seul (avec panonceau M9k pour les voies réservées,
    M9l pour le bruit) ; SR3e = radar + rappel de vitesse (contrôle de vitesse moyenne / radar tronçon).
