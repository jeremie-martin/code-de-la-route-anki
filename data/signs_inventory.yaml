- code: C107
  categorie: indication
  nom: Route à accès réglementé
  signification: 'Début d''une route (voie express, route pour automobiles) réservée aux véhicules à moteur circulant
    à plus de 40 km/h : interdite aux piétons, cycles, cyclomoteurs, tracteurs, véhicules à traction animale. Interdiction
    d''arrêt, de stationnement, de demi-tour et de marche arrière. Vitesse maximale 110 km/h si 2×2 voies avec séparateur
    (100 par temps de pluie), 80 sur route bidirectionnelle.'
  conduite_a_tenir: S'insérer à l'aide de la voie d'accélération ; ne pas s'arrêter sur la chaussée ; respecter
    la limite (souvent 110 ou 90 selon panneau).
