  notes: ''
- code: MARQ-ligne-jaune-continue
  categorie: marquage
  nom: 'Ligne jaune continue (sur bordure ou en rive) : arrêt interdit'
  signification: 'Ligne jaune continue peinte sur la bordure du trottoir ou en rive de chaussée : interdiction de
    s''arrêter et de stationner (équivalent au sol du panneau B6d).'
