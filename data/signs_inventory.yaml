  nom: Triangle de présignalisation (véhicule en panne ou accidenté)
  signification: Triangle rouge rétroréfléchissant que tout conducteur doit placer sur la chaussée pour signaler
    son véhicule immobilisé (panne, accident) sur la route, en complément des feux de détresse. Équipement obligatoire
    à bord avec le gilet haute visibilité.
  conduite_a_tenir: 'Enfiler le gilet avant de sortir, placer le triangle à 30 m au moins en amont du véhicule (davantage
    si la visibilité est réduite ; sur autoroute, ne pas le poser si cela expose à un danger : rester derrière la
    glissière), allumer les feux de détresse.'
  implantation: Au moins 30 m en amont du véhicule (plus loin si visibilité réduite, virage, sommet de côte), sauf
    danger pour soi (autoroute).
  fin: ''
  forme_couleur: triangle rouge rétroréfléchissant posé au sol
  confusions:
  - FEU-detresse
  - K1
  importance: essentiel
  wikimedia_file: ''
  notes: 'Gilet + triangle obligatoires (amende 135 € si absents ou non utilisés). Sur autoroute, la pose du triangle
    est déconseillée si elle met en danger : priorité à l''évacuation derrière la glissière.'
- code: R11
  categorie: feux
  nom: Signal tricolore circulaire (feu tricolore)
  signification: 'Feu de circulation à trois feux circulaires : rouge en haut, jaune au milieu, vert en bas (R11v).
    Il règle la circulation aux intersections et prévaut sur les panneaux de priorité (AB) et le marquage, mais
    pas sur les injonctions d''un agent.'
  conduite_a_tenir: 'Rouge : arrêt absolu avant la ligne d''effet des feux ; jaune fixe : arrêt sauf si l''on ne
    peut s''arrêter sans danger ; vert : passage si l''intersection est dégagée (ne pas s''engager si l''on risque
    d''y rester bloqué) en cédant le passage aux piétons qui traversent.'
  implantation: À droite de la chaussée, à hauteur de la ligne d'effet des feux, souvent répété en face (feu de
    répétition) et en petit format à hauteur du conducteur (répétiteur bas).
  fin: ''
  forme_couleur: 'trois feux circulaires verticaux : rouge (haut), jaune (milieu), vert (bas)'
  confusions:
  - FEU-rouge
  - FEU-jaune-fixe
  - FEU-vert
  - FEU-jaune-clignotant
  - R13
  - R14
  importance: essentiel
  wikimedia_file: ''
  notes: 'Hiérarchie : agent > feux > panneaux > marquage. Un feu vert ne donne pas la priorité sur les piétons
    engagés ni sur les véhicules déjà dans le carrefour. Feu rouge grillé : 4 points, 135 €. Le feu vert ne clignote
    jamais en France.'
- code: FEU-rouge
  categorie: feux
  nom: Feu rouge fixe
  signification: 'Interdiction absolue de franchir la ligne d''effet des feux (ou l''aplomb du feu s''il n''y a
    pas de ligne) : arrêt obligatoire, y compris pour tourner à droite (sauf signal R19 ou panonceau M12 pour les
    cyclistes uniquement).'
  conduite_a_tenir: S'arrêter avant la ligne d'arrêt (ligne T'2 discontinue) sans empiéter sur le passage piéton
    ni le sas vélo ; attendre le vert. Un véhicule prioritaire en intervention peut franchir le rouge avec prudence.
  implantation: ''
  fin: ''
  forme_couleur: feu circulaire rouge fixe (en haut du signal tricolore)
  confusions:
  - FEU-rouge-clignotant
  - FEU-jaune-fixe
  - R19
  importance: essentiel
  wikimedia_file: ''
  notes: On ne « tourne pas à droite au rouge » en France (contrairement aux États-Unis). Le franchissement de la
    ligne (roues au-delà) au rouge est déjà une infraction, même sans traverser.
- code: FEU-jaune-fixe
  categorie: feux
  nom: Feu jaune fixe
  signification: 'Annonce l''imminence du rouge : arrêt obligatoire, sauf si le conducteur ne peut plus s''arrêter
    dans des conditions de sécurité suffisantes (trop proche du feu, freinage brutal dangereux).'
  conduite_a_tenir: Freiner et s'arrêter si c'est possible sans danger ; sinon franchir sans accélérer. Ne jamais
    accélérer pour « passer à l'orange ».
  implantation: ''
  fin: ''
  forme_couleur: feu circulaire jaune fixe (au milieu du signal tricolore)
  confusions:
  - FEU-jaune-clignotant
  - FEU-rouge
  importance: essentiel
  wikimedia_file: ''
  notes: 'Officiellement « jaune » (le Code ne parle pas d''orange). Franchir un feu jaune fixe alors qu''on pouvait
    s''arrêter : 35 €, pas de retrait de points. Il n''y a pas de jaune après le rouge en France (pas de rouge+jaune
    comme en Allemagne).'
- code: FEU-vert
  categorie: feux
  nom: Feu vert
  signification: Autorisation de passer, à condition que l'intersection soit dégagée et en cédant le passage aux
    piétons engagés et aux véhicules qui terminent leur traversée. Il ne dispense pas de céder le passage en tournant
    (véhicules venant en face quand on tourne à gauche, piétons sur le passage).
  conduite_a_tenir: S'engager seulement si l'on peut franchir le carrefour sans s'y immobiliser ; regarder à gauche
    et à droite malgré le vert (usagers qui grillent le feu, véhicules prioritaires).
  implantation: ''
  fin: ''
  forme_couleur: feu circulaire vert fixe (en bas du signal tricolore)
  confusions:
  - FEU-jaune-clignotant
  - R14
  - R21b
  importance: essentiel
  wikimedia_file: ''
  notes: 'Piège : « feu vert clignotant » n''existe pas en France. Un feu vert avec un panneau AB4 ou AB3a : le
    feu prévaut, on passe sans s''arrêter.'
- code: FEU-jaune-clignotant
  categorie: feux
  nom: Feu jaune clignotant
  signification: 'Feu jaune clignotant (seul, ou sur le feu du milieu d''un R11 hors service, ou R11j où il remplace
    le vert) : passage autorisé avec prudence ; les règles de priorité redeviennent celles des panneaux (STOP, cédez-le-passage,
    AB6) ou, à défaut, la priorité à droite.'
  conduite_a_tenir: Ralentir, appliquer la signalisation verticale ou la priorité à droite, céder le passage aux
    piétons ; considérer l'intersection comme non gérée par les feux.
  implantation: ''
  fin: ''
  forme_couleur: feu circulaire jaune clignotant (seul ou au milieu d'un tricolore)
  confusions:
  - FEU-jaune-fixe
  - FEU-rouge-clignotant
  - R15
  - R16
  importance: essentiel
  wikimedia_file: ''
  notes: 'Jaune clignotant = feux hors service ou mode de nuit : on revient aux panneaux (un STOP sous le feu s''applique
    alors). Un feu jaune clignotant sur un panneau (R1) n''est qu''un renfort d''attention.'
- code: FEU-rouge-clignotant
  categorie: feux
  nom: Feu rouge clignotant (signal d'arrêt R24)
  signification: 'Feu rouge clignotant (un ou deux feux alternés) : interdiction absolue de passer, comme un feu
    rouge fixe, devant un obstacle ou un danger particulier : passage à niveau, pont mobile, sortie de pompiers,
    traversée de tramway ou de voie de bus, avalanche, tunnel fermé.'
  conduite_a_tenir: S'arrêter avant le feu et attendre son extinction ; au passage à niveau, ne pas contourner les
    demi-barrières ; ne repartir que lorsque les barrières sont relevées et le feu éteint.
  implantation: Aux passages à niveau (G1bis, G2), ponts mobiles, casernes de pompiers, aires de danger aérien,
    entrées de tunnels.
  fin: ''
  forme_couleur: un ou deux feux circulaires rouges clignotants (alternés)
  confusions:
  - FEU-rouge
  - FEU-jaune-clignotant
  - G2
  - G1bis
  importance: essentiel
  wikimedia_file: ''
  notes: 'Ne jamais franchir un feu rouge clignotant, même si rien n''est visible : le train peut arriver dans quelques
    secondes.'
- code: R11j
  categorie: feux
  nom: Signal tricolore avec jaune clignotant à la place du vert
  signification: 'Signal tricolore où le vert est remplacé par un jaune clignotant : quand le feu du bas clignote,
    passage autorisé en respectant les panneaux de priorité de l''intersection (souvent un cédez-le-passage ou une
    priorité à droite).'
  conduite_a_tenir: Passer avec prudence en appliquant la priorité indiquée par les panneaux.
  implantation: ''
  fin: ''
  forme_couleur: signal tricolore dont le feu du bas est jaune clignotant
  confusions:
  - FEU-jaune-clignotant
  - R11
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: R12
  categorie: feux
  nom: Signal bicolore pour piétons
  signification: 'Feux pour piétons à deux couleurs : silhouette rouge (traversée interdite) et silhouette verte
    (traversée autorisée), sans jaune ; le vert peut clignoter ou passer directement au rouge. Un décompteur de
    temps peut y être associé (2022) ; R12m : version piétons + cycles.'
  conduite_a_tenir: 'Piéton : ne pas s''engager au rouge ; si le rouge apparaît en cours de traversée, terminer
    la traversée sans courir (les véhicules doivent laisser finir). Conducteur : céder le passage aux piétons engagés
    même quand leur feu passe au rouge.'
  implantation: De part et d'autre du passage piéton, souvent avec bouton d'appel ou dispositif sonore pour malvoyants.
  fin: ''
  forme_couleur: 'deux feux : silhouette de piéton rouge (haut) et verte (bas)'
  confusions:
  - R25
  - R13
  - C20a
  importance: essentiel
  wikimedia_file: ''
  notes: Le code correct du feu piéton est R12 (R25 est le signal STOP piéton des traversées de tramway). Pas de
    jaune pour les piétons.
- code: R13
  categorie: feux
  nom: Signaux tricolores modaux (bus R13b, cyclistes R13c)
  signification: 'Feux tricolores portant un pictogramme (bus pour R13b, vélo pour R13c) : ils ne s''adressent qu''à
    la catégorie représentée, qui doit les respecter à la place du feu général ; le vert peut être remplacé par
    un jaune clignotant (R13bj/R13cj).'
  conduite_a_tenir: Un conducteur de voiture ignore les feux modaux et suit le R11 ; un cycliste suit le feu vélo
    (petit feu tricolore avec pictogramme).
  implantation: ''
  fin: ''
  forme_couleur: feux tricolores portant un pictogramme (bus ou vélo)
  confusions:
  - R11
  - R15
  - R19
  - R17
  importance: utile
  wikimedia_file: ''
  notes: Les feux vélo (R13c) sont souvent placés bas, près des sas vélo, avec quelques secondes d'avance (départ
    anticipé).
- code: R14
  categorie: feux
  nom: Signaux tricolores directionnels (feux à flèches)
  signification: 'Feux tricolores dont les trois feux portent une flèche (tourne-à-gauche R14tg, direct R14d, tourne-à-droite
    R14td, ou combinaisons) : ils ne concernent que les usagers qui vont dans la direction de la flèche. Flèche
    verte = passage autorisé dans cette direction, en principe sans conflit avec les autres flux (mouvements opposés
    arrêtés) ; flèche rouge = interdit dans cette direction ; jamais de jaune clignotant à la place du vert.'
  conduite_a_tenir: Se placer dans la voie de la direction voulue et obéir au feu fléché correspondant ; une flèche
    verte de tourne-à-gauche signifie que le trafic en face est arrêté (mais céder aux piétons éventuels).
  implantation: Au-dessus ou à côté des voies de présélection.
  fin: ''
  forme_couleur: feux tricolores en forme de flèche (rouge, jaune, verte)
  confusions:
  - R11
  - R16
  - FEU-vert
  - C24b
  importance: essentiel
  wikimedia_file: ''
  notes: 'Piège : la flèche verte (R14) donne un passage protégé ; la flèche jaune clignotante (R16) n''est qu''une
    autorisation de passer en cédant le passage.'
- code: R15
  categorie: feux
  nom: Signal d'anticipation modal (bus R15b, cycles R15c)
  signification: 'Feu jaune clignotant portant un pictogramme (BUS ou vélo), associé à un feu tricolore : il autorise
    cette catégorie à passer (en cédant le passage) alors que le feu principal est rouge ou va changer.'
  conduite_a_tenir: 'Ne concerne pas les voitures : rester au rouge.'
  implantation: ''
  fin: ''
  forme_couleur: feu jaune clignotant avec pictogramme BUS ou vélo
  confusions:
  - R16
  - R19
  - R13
  importance: rare
  wikimedia_file: ''
  notes: ''
- code: R16
  categorie: feux
  nom: Signal d'anticipation directionnel (flèche jaune clignotante)
  signification: 'Feu jaune clignotant en forme de flèche (à droite, tout droit ou à gauche), associé à un feu tricolore
    : quand il clignote, les usagers allant dans cette direction peuvent passer, même au feu rouge, mais en cédant
    le passage aux piétons et aux véhicules qui ont le vert (pas de priorité).'
  conduite_a_tenir: Tourner dans la direction de la flèche jaune clignotante seulement après avoir cédé le passage
    aux piétons qui traversent et aux véhicules de l'autre flux ; s'arrêter si nécessaire.
  implantation: À côté ou sous le feu tricolore, souvent pour le tourne-à-droite.
  fin: ''
  forme_couleur: feu jaune clignotant en forme de flèche (droite, tout droit ou gauche)
  confusions:
  - R14
  - FEU-jaune-clignotant
  - R19
  - FEU-rouge
  importance: essentiel
  wikimedia_file: ''
  notes: 'Différence clé : flèche VERTE (R14) = passage protégé et prioritaire ; flèche JAUNE clignotante (R16)
    = passage possible en cédant le passage. Sans R16, tourner à droite au rouge est interdit.'
- code: R17
  categorie: feux
  nom: Signal pour véhicules de transport en commun (feux à barres blanches)
  signification: 'Feux réservés aux bus (et tramways) en site propre, composés de trois feux blancs sur fond noir
    : barre verticale (en bas) = passage autorisé ; disque (au milieu, parfois clignotant) = arrêt imminent (équivalent
    du jaune) ; barre horizontale (en haut) = arrêt. R18 : version directionnelle avec barre inclinée à gauche ou
    à droite.'
  conduite_a_tenir: 'Ne concerne que les bus/tramways : les autres conducteurs suivent leur propre feu ; à un site
    propre, se méfier d''un bus qui a une barre verticale (il va passer).'
  implantation: Aux traversées de sites propres bus/tram.
  fin: ''
  forme_couleur: 'trois feux blancs sur fond noir : barre horizontale (haut), disque (milieu), barre verticale (bas)'
  confusions:
  - R13
  - R11
  - A9b
  importance: utile
  wikimedia_file: ''
  notes: 'Mémo : barre verticale = « feu vert » du bus ; barre horizontale = « feu rouge » ; disque = « jaune ».'
- code: R19
  categorie: feux
  nom: Signal d'autorisation conditionnelle de franchissement pour cycles
  signification: 'Feu jaune clignotant portant un pictogramme vélo et une flèche, associé au feu tricolore : autorise
    les cyclistes à franchir le feu rouge dans la direction indiquée en cédant le passage aux piétons et aux autres
    usagers (équivalent lumineux du panonceau M12).'
  conduite_a_tenir: 'En voiture : rien ne change, le rouge s''impose ; s''attendre à voir des cyclistes passer.'
  implantation: ''
  fin: ''
  forme_couleur: feu jaune clignotant avec pictogramme vélo et flèche
  confusions:
  - M12
  - R16
  - R15
  - R13
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: R21a
  categorie: feux
  nom: 'Signal d''affectation de voie : croix rouge'
  signification: 'Croix de Saint-André rouge fixe placée au-dessus d''une voie (autoroute, tunnel, péage, pont)
    : interdiction d''emprunter cette voie.'
  conduite_a_tenir: Quitter la voie dès que possible en sécurité ; ne jamais y circuler tant que la croix est allumée.
  implantation: Sur portique au-dessus de chaque voie.
  fin: ''
  forme_couleur: croix de Saint-André rouge lumineuse au-dessus d'une voie
  confusions:
  - R21b
  - R21c
  - KD10
  importance: essentiel
  wikimedia_file: ''
  notes: Croix rouge = voie fermée ; flèche verte vers le bas = voie ouverte ; flèche jaune oblique clignotante
    = se rabattre sur la voie indiquée.
- code: R21b
  categorie: feux
  nom: 'Signal d''affectation de voie : flèche verte vers le bas'
  signification: 'Flèche verte fixe pointant vers le bas au-dessus d''une voie : autorisation de circuler sur cette
    voie.'
  conduite_a_tenir: Rester ou se placer dans cette voie.
  implantation: Sur portique.
  fin: ''
  forme_couleur: flèche verte lumineuse pointant vers le bas au-dessus d'une voie
  confusions:
  - R21a
  - R21c
  importance: essentiel
  wikimedia_file: ''
  notes: ''
- code: R21c
  categorie: feux
  nom: 'Signal d''affectation de voie : flèche jaune oblique clignotante'
  signification: 'Flèche jaune clignotante inclinée à 45° vers le bas (à droite R21cd, à gauche R21cg) au-dessus
    d''une voie : annonce la fermeture de cette voie et oblige à se rabattre sur la voie adjacente indiquée.'
  conduite_a_tenir: Changer de voie dans le sens de la flèche dès que possible, sans manœuvre brusque.
  implantation: Sur portique, en amont de la croix rouge.
  fin: ''
  forme_couleur: flèche jaune clignotante oblique (45°) vers le bas, à droite ou à gauche
  confusions:
  - R21a
  - R21b
  - KD10
  importance: essentiel
  wikimedia_file: ''
  notes: ''
- code: R22
  categorie: feux
  nom: Signal tricolore de contrôle de flot (régulation d'accès)
  signification: 'Feu tricolore implanté sur une bretelle d''accès à une voie rapide pour limiter le débit d''entrée
    (régulation) : mêmes couleurs qu''un R11 (R22v) ou avec jaune clignotant (R22j).'
  conduite_a_tenir: S'arrêter au rouge sur la bretelle, s'insérer au vert.
  implantation: Sur les bretelles d'entrée régulées.
  fin: ''
  forme_couleur: signal tricolore (ou avec jaune clignotant) sur bretelle d'accès
  confusions:
  - R11
  - R23
  importance: rare
  wikimedia_file: ''
  notes: ''
- code: R23
  categorie: feux
  nom: Signal bicolore de contrôle individuel (vert/rouge)
  signification: 'Deux feux (vert en bas, rouge en haut, ou jaune clignotant/rouge) contrôlant le passage véhicule
    par véhicule à un poste : péage, douane, parking, accès régulé.'
  conduite_a_tenir: Avancer au vert, s'arrêter au rouge.
  implantation: Aux barrières de péage, douanes, parkings.
  fin: ''
  forme_couleur: 'deux feux : rouge (haut) et vert ou jaune clignotant (bas)'
  confusions:
  - R22
  - B5c
  - C64a
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: R24
  categorie: feux
  nom: Signal d'arrêt (feu rouge clignotant)
  signification: Signal composé d'un ou deux feux rouges clignotants imposant l'arrêt devant un obstacle ou un danger
    particulier (passage à niveau, pont mobile, sortie de véhicules de pompiers, traversée de site propre).
  conduite_a_tenir: Arrêt absolu tant que le feu clignote.
  implantation: Voir FEU-rouge-clignotant.
  fin: ''
  forme_couleur: feu circulaire rouge clignotant (souvent deux feux alternés)
  confusions:
  - FEU-rouge-clignotant
  - G2
  - G1bis
  importance: essentiel
  wikimedia_file: ''
  notes: Code officiel du feu rouge clignotant.
- code: R25
  categorie: feux
  nom: Signal d'arrêt pour piétons (traversée de tramway)
  signification: 'Pictogramme rouge de piéton surmontant un « STOP » rouge clignotant : interdit aux piétons de
    traverser une voie réservée aux tramways ou aux bus en site propre lorsqu''un véhicule approche.'
  conduite_a_tenir: 'Piéton : attendre l''extinction du signal.'
  implantation: Aux traversées piétonnes des voies de tramway.
  fin: ''
  forme_couleur: pictogramme rouge de piéton au-dessus d'un « STOP » rouge clignotant
  confusions:
  - R12
  - A9b
  - C20c
  importance: rare
  wikimedia_file: ''
  notes: Ne pas confondre avec le feu piéton ordinaire (R12).
- code: R1
  categorie: feux
  nom: Feu de balisage et d'alerte (jaune clignotant sur panneau)
  signification: 'Feu jaune clignotant fixé au sommet d''un panneau de danger, d''un signal avancé de priorité ou
    d''une balise J4 pour renforcer sa perception (R1j de jour, R1n de nuit, R1jn) ; R2 : version pour la signalisation
    temporaire ; R2d : feux à défilement.'
  conduite_a_tenir: Redoubler d'attention sur le danger signalé ; ce feu n'impose pas d'arrêt.
  implantation: Au sommet du panneau ; interdit sur les panneaux de prescription (sauf B4/B5), d'indication ou de
    direction.
  fin: ''
  forme_couleur: feu jaune clignotant rond au sommet d'un panneau ou d'une balise J4
  confusions:
  - FEU-jaune-clignotant
  - A17
  - J4
  importance: utile
  wikimedia_file: ''
  notes: Un feu jaune clignotant sur un panneau STOP n'existe pas ; sur un AB5 (annonce de STOP) oui.
- code: FEU-decompte
  categorie: feux
  nom: Décompteur de temps (feux piétons ou véhicules)
  signification: Afficheur numérique associé à un feu (autorisé pour les piétons par l'arrêté du 13 juin 2022) indiquant
    le temps restant de la phase en cours (vert ou rouge).
  conduite_a_tenir: 'Information seulement : les règles du feu restent inchangées.'
  implantation: ''
  fin: ''
  forme_couleur: afficheur numérique vert ou rouge associé au feu
  confusions:
  - R12
  importance: rare
  wikimedia_file: ''
  notes: ''
- code: FEU-tunnel-fermeture
  categorie: feux
  nom: Feux et barrières de fermeture de tunnel
  signification: À l'entrée des tunnels, feux rouges (R24) et barrières (XK3) peuvent fermer l'ouvrage en cas d'incident
    ; les signaux d'affectation de voies R21 y règlent l'usage des voies.
  conduite_a_tenir: Ne jamais entrer dans un tunnel fermé par un feu rouge ; suivre les consignes des panneaux à
    messages variables.
  implantation: ''
  fin: ''
  forme_couleur: feux rouges clignotants et barrière à l'entrée du tunnel
  confusions:
  - R24
  - R21a
  - C111
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: FEU-detresse
  categorie: feux
  nom: 'Feux de détresse (warning) : signal des autres usagers'
  signification: 'Les feux de détresse (quatre clignotants) d''un véhicule signalent un danger : véhicule immobilisé
    ou en panne, ralentissement brutal, bouchon, remorquage, convoi lent. Un véhicule qui les allume avertit ceux
    qui le suivent.'
  conduite_a_tenir: 'Les allumer en cas de panne, d''arrêt forcé ou d''arrivée sur un bouchon (puis les éteindre
    une fois la file constituée derrière soi) ; en voyant un véhicule à feux de détresse : ralentir, s''écarter.'
  implantation: ''
  fin: ''
  forme_couleur: les quatre clignotants orange du véhicule allumés simultanément
  confusions:
  - TRIANGLE-PRESIGNALISATION
  - AK30
  importance: essentiel
  wikimedia_file: ''
  notes: Un véhicule en panne se signale par feux de détresse + triangle à 30 m + gilet ; un véhicule remorqué doit
    aussi avoir ses feux de détresse.
- code: FEU-vert-clignotant
  categorie: feux
  nom: Feu vert clignotant (n'existe pas en France)
  signification: 'Piège d''examen : le feu vert clignotant n''existe pas dans la signalisation française (il existe
    dans d''autres pays, par exemple en Autriche, au Mexique ou en Russie, pour annoncer la fin du vert). En France,
    le vert passe directement au jaune fixe.'
  conduite_a_tenir: Si une question évoque un « feu vert clignotant », la bonne réponse est en général qu'il n'existe
    pas en France.
  implantation: ''
  fin: ''
  forme_couleur: n'existe pas en France
  confusions:
  - FEU-vert
  - FEU-jaune-clignotant
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: PMV
  categorie: feux
  nom: Panneaux à messages variables et signaux dynamiques (X…)
  signification: 'Panneaux lumineux (à messages variables, PMV) affichant des signaux dynamiques codés X (XB14 limitation
    de vitesse, XA/XAK dangers et bouchons, XB3 interdiction de dépasser, XC50 messages littéraux, XKD affectation
    de voies, R21 croix/flèches) : ils ont la même valeur que les panneaux fixes et prévalent sur eux lorsqu''ils
    sont allumés (limitation plus restrictive, fermeture de voie).'
  conduite_a_tenir: Respecter le signal affiché (ex. XB14 « 90 » sur autoroute par brouillard ou trafic dense) ;
    un PMV éteint n'impose rien.
  implantation: Portiques d'autoroutes, tunnels, voies rapides urbaines.
  fin: ''
  forme_couleur: panneau lumineux noir à pictogrammes blancs/jaunes (ou couleurs inversées)
  confusions:
  - C51a
  - R21a
  - AK30
  - B14
  importance: utile
  wikimedia_file: ''
  notes: Pictogrammes généralement blanc/jaune sur fond noir (couleurs inversées), sauf B0 et B1 qui gardent leurs
    couleurs.
- code: MARQ-ligne-continue
  categorie: marquage
  nom: Ligne continue (axiale ou séparative de voies)
  signification: 'Ligne blanche continue séparant les sens de circulation ou des voies : il est interdit de la franchir
    ou de la chevaucher. Seule exception (article R412-19, depuis 2015) : la chevaucher (sans la franchir) pour
    dépasser un cycle, un engin de déplacement personnel motorisé ou un cyclomobile léger, si la visibilité est
    suffisante et en respectant l''écart de sécurité (1 m en agglomération, 1,5 m hors agglomération).'
  conduite_a_tenir: Ne pas dépasser, ne pas tourner à gauche en la franchissant (sauf ligne mixte côté discontinu).
    On peut la chevaucher, sans la franchir, uniquement pour dépasser un cycliste ou un engin de déplacement personnel.
  implantation: Sur les sections sans visibilité (virages, sommets de côte), à l'approche des intersections et des
    îlots ; largeur 2u (3u ou 5u sur routes larges).
  fin: ''
  forme_couleur: ligne blanche continue, largeur 2u (10 à 15 cm)
  confusions:
  - MARQ-ligne-discontinue-T1
  - MARQ-ligne-mixte
  - MARQ-ligne-annonce
  - MARQ-ligne-dissuasion
  - MARQ-ligne-rive
  importance: essentiel
  wikimedia_file: ''
  notes: 'Franchir une ligne continue (R412-19) : 135 € et 3 points ; la chevaucher : 135 € et 1 point. Le code
    ne prévoit aucune autre exception écrite (entrer dans une propriété ou contourner un obstacle relève au mieux
    de la tolérance / de l''état de nécessité, jamais d''un droit).'
- code: MARQ-ligne-discontinue-T1
  categorie: marquage
  nom: Ligne discontinue axiale T1 (3 m de trait, 10 m de vide)
  signification: 'Ligne discontinue de guidage la plus courante hors agglomération : traits de 3 m espacés de 10
    m. Elle sépare les sens ou les voies et peut être franchie pour dépasser ou changer de direction, si la manœuvre
    est sûre.'
  conduite_a_tenir: Dépasser uniquement si la visibilité et le trafic le permettent, et terminer le dépassement
    avant la fin de la ligne discontinue (avant la ligne d'annonce / continue).
  implantation: Section courante des routes bidirectionnelles.
  fin: ''
  forme_couleur: traits blancs de 3 m espacés de 10 m, largeur 2u
  confusions:
  - MARQ-ligne-continue
  - MARQ-ligne-dissuasion
  - MARQ-ligne-annonce
  - MARQ-ligne-T'1
  importance: essentiel
  wikimedia_file: ''
  notes: 'Rapport plein/vide 1/3. Une ligne discontinue autorise le franchissement mais n''oblige à rien : le dépassement
    reste soumis aux règles générales (visibilité, sens inverse libre, pas d''intersection...).'
- code: MARQ-ligne-T'1
  categorie: marquage
  nom: Ligne discontinue axiale T'1 (1,5 m de trait, 5 m de vide)
  signification: 'Variante de la ligne T1 à modulation réduite (1,5 m / 5 m, même rapport 1/3), utilisée en agglomération
    et sur les routes étroites ou sinueuses ; même signification : franchissable.'
  conduite_a_tenir: Comme T1.
  implantation: Agglomération, routes étroites.
  fin: ''
  forme_couleur: traits blancs de 1,5 m espacés de 5 m
  confusions:
  - MARQ-ligne-discontinue-T1
  importance: rare
  wikimedia_file: ''
  notes: 'Signification identique à T1 ; seule l''échelle change. À VÉRIFIER : l''IISR l''appelle aussi « ligne
    axiale de modulation réduite ».'
- code: MARQ-ligne-dissuasion
  categorie: marquage
  nom: Ligne de dissuasion T3 (3 m de trait, 1,33 m de vide)
  signification: 'Ligne discontinue à traits longs et rapprochés (3 m / 1,33 m, largeur 3u) qui déconseille fortement
    le dépassement : il n''est autorisé que pour dépasser un véhicule lent (tracteur, cyclomoteur, cycliste, engin
    de voirie, véhicule roulant très lentement avec feux de détresse). Sur autoroute, à l''approche des sorties,
    elle dissuade de se rabattre au dernier moment.'
  conduite_a_tenir: Ne pas dépasser un véhicule roulant à allure normale ; dépasser seulement un véhicule lent,
    avec une visibilité suffisante.
  implantation: Routes étroites ou sinueuses, approche des sorties d'autoroute, voies pour véhicules lents.
  fin: ''
  forme_couleur: traits blancs de 3 m espacés de 1,33 m, largeur 3u (plus large que la ligne axiale)
  confusions:
  - MARQ-ligne-annonce
  - MARQ-ligne-discontinue-T1
  - MARQ-ligne-continue
  - MARQ-bande-cyclable
  importance: essentiel
  wikimedia_file: ''
  notes: Rapport plein/vide 3 (traits beaucoup plus longs que les vides). Franchissable légalement, mais réservé
    aux dépassements de véhicules lents. La même modulation T3 (largeur 5u) délimite les bandes cyclables, couloirs
    bus et voies pour véhicules lents.
- code: MARQ-ligne-annonce
  categorie: marquage
  nom: Ligne d'annonce (d'avertissement) d'une ligne continue, avec flèches de rabattement
  signification: 'Ligne discontinue à traits longs et rapprochés (modulation T3, largeur 2u) accompagnée de flèches
    de rabattement, qui annonce l''approche d''une ligne continue : il ne faut plus entamer de dépassement, et terminer
    celui en cours.'
  conduite_a_tenir: Se rabattre avant la ligne continue ; ne pas commencer de dépassement.
  implantation: Avant chaque ligne continue, sur une centaine de mètres.
  fin: ''
  forme_couleur: traits blancs de 3 m espacés de 1,33 m (T3, largeur 2u) + flèches de rabattement
  confusions:
  - MARQ-fleches-rabattement
  - MARQ-ligne-dissuasion
  - MARQ-ligne-continue
  importance: essentiel
  wikimedia_file: ''
  notes: 'Piège : ligne d''annonce (T3 avec flèches de rabattement, annonce une ligne continue) vs ligne de dissuasion
    (T3 plus large, sans flèches, sur une longue section). Les flèches de rabattement lèvent l''ambiguïté.'
- code: MARQ-ligne-mixte
  categorie: marquage
  nom: Ligne mixte (continue doublée d'une discontinue)
  signification: 'Ligne continue accolée à une ligne discontinue : les conducteurs situés du côté de la ligne discontinue
    peuvent la franchir (dépasser, tourner) ; ceux situés du côté de la ligne continue ne le peuvent pas. C''est
    la ligne la plus proche du véhicule qui compte.'
  conduite_a_tenir: 'Regarder quelle ligne est la plus proche de sa voie : discontinue = franchissable, continue
    = interdit. Terminer la manœuvre avant que la ligne de son côté devienne continue.'
  implantation: Sections où le dépassement n'est possible que dans un sens (visibilité dissymétrique).
  fin: ''
  forme_couleur: ligne blanche continue accolée à une ligne discontinue
  confusions:
  - MARQ-ligne-continue
  - MARQ-ligne-discontinue-T1
  importance: essentiel
  wikimedia_file: ''
  notes: 'Règle R412-20 : on peut franchir une ligne discontinue si elle est la plus proche de son véhicule AU DÉBUT
    de la manœuvre, à condition de terminer la manœuvre avant la fin de la partie discontinue.'
- code: MARQ-fleches-rabattement
  categorie: marquage
  nom: Flèches de rabattement
  signification: Flèches blanches légèrement courbées vers la droite, peintes sur la chaussée, indiquant qu'il faut
    se rabattre sur la voie de droite car un dépassement va devenir impossible (ligne continue, fin de voie, réduction
    de voies). Elles sont intercalées dans la ligne d'annonce.
  conduite_a_tenir: Terminer son dépassement et se rabattre à droite ; ne pas entreprendre de dépassement. Si la
    flèche pointe dans l'autre sens, elle concerne les véhicules d'en face.
  implantation: Trois flèches successives avant une ligne continue ou une fin de créneau de dépassement.
  fin: ''
  forme_couleur: flèches blanches courbes (inclinées vers la droite) sur la chaussée
  confusions:
  - MARQ-fleches-directionnelles
  - MARQ-ligne-annonce
  - C30
  importance: essentiel
  wikimedia_file: ''
  notes: Flèche COURBE = rabattement (se rabattre) ; flèche DROITE = direction obligatoire de la voie (sélection).
- code: MARQ-fleches-directionnelles
  categorie: marquage
  nom: Flèches directionnelles (de sélection / d'affectation de voie)
  signification: 'Flèches blanches droites (tout droit, à gauche, à droite, ou combinées) peintes dans une voie
    à l''approche d''une intersection : elles indiquent la ou les directions que doivent suivre les véhicules qui
    circulent dans cette voie. Une fois engagé dans la voie, on doit suivre la direction indiquée.'
  conduite_a_tenir: Choisir sa voie à l'avance selon sa direction ; ne pas changer de voie une fois la ligne devenue
    continue ; si l'on s'est trompé de voie, suivre la direction imposée et faire demi-tour plus loin.
  implantation: Voies de présélection avant les intersections, voies de sortie.
  fin: ''
  forme_couleur: flèches blanches droites (simples ou doubles) dans l'axe des voies
  confusions:
  - MARQ-fleches-rabattement
  - C24b
  - B21b
  importance: essentiel
  wikimedia_file: ''
  notes: Avec des flèches au sol et une ligne continue entre les voies, changer de voie est interdit.
- code: MARQ-ligne-stop
  categorie: marquage
  nom: 'Ligne d''arrêt (STOP) : ligne transversale continue'
  signification: 'Large ligne blanche continue (50 cm) tracée en travers de la voie, associée au panneau STOP (AB4)
    : c''est à cette ligne, et non au panneau, que l''arrêt doit être marqué. L''inscription « STOP » peut être
    peinte en amont.'
  conduite_a_tenir: S'arrêter complètement les roues avant la ligne, sans la dépasser, puis céder le passage.
  implantation: Au niveau du panneau AB4, à la limite de la chaussée abordée.
  fin: ''
  forme_couleur: ligne blanche continue transversale de 50 cm de large
  confusions:
  - MARQ-ligne-cedez
  - MARQ-ligne-effet-feux
  - AB4
  importance: essentiel
  wikimedia_file: ''
  notes: Ligne CONTINUE transversale = STOP ; ligne DISCONTINUE transversale (T'2) = cédez-le-passage. Le marquage
    doit accompagner le panneau (l'un ne va pas sans l'autre).
- code: MARQ-ligne-cedez
  categorie: marquage
  nom: 'Ligne de cédez-le-passage : ligne transversale discontinue'
  signification: 'Ligne blanche discontinue (traits de 50 cm espacés de 50 cm, largeur 50 cm) tracée en travers
    de la voie, associée au panneau AB3a : limite à ne pas franchir sans avoir cédé le passage ; arrêt uniquement
    si nécessaire.'
  conduite_a_tenir: Ralentir, contrôler, s'arrêter à la ligne si un véhicule arrive, sinon passer sans s'arrêter.
  implantation: Au niveau du panneau AB3a, aux entrées de giratoire, en fin de voie d'insertion.
  fin: ''
  forme_couleur: ligne blanche discontinue transversale (traits 50 cm / vides 50 cm, largeur 50 cm)
  confusions:
  - MARQ-ligne-stop
  - MARQ-ligne-effet-feux
  - AB3a
  importance: essentiel
  wikimedia_file: ''
  notes: Les « dents de requin » (triangles blancs pointe vers le conducteur) que l'on voit parfois en France pour
    un cédez-le-passage ne sont pas un marquage réglementaire de l'IISR (utilisé en Belgique/Pays-Bas) ; en France
    les triangles réglementaires signalent un ralentisseur. À VÉRIFIER pour les aménagements cyclables.
- code: MARQ-ligne-effet-feux
  categorie: marquage
  nom: Ligne d'effet des feux (ligne d'arrêt aux feux)
  signification: 'Ligne blanche discontinue fine (traits de 50 cm espacés de 50 cm, largeur 15 cm) tracée en travers
    de la voie avant un feu tricolore ou un passage à niveau à feux : elle matérialise l''endroit où les véhicules
    doivent s''arrêter au rouge. Sans marquage, l''arrêt se fait avant le passage piéton s''il y en a un, sinon
    à l''aplomb du feu.'
  conduite_a_tenir: S'arrêter avant cette ligne au feu rouge ou jaune, sans empiéter sur le passage piéton ni le
    sas vélo.
  implantation: Avant le feu (ou avant le passage piéton), et une seconde ligne 3 à 5 m en amont si sas vélo.
  fin: ''
  forme_couleur: ligne blanche discontinue transversale fine (traits 50 cm / vides 50 cm, largeur 15 cm)
  confusions:
  - MARQ-ligne-cedez
  - MARQ-ligne-stop
  - MARQ-sas-velo
  importance: essentiel
  wikimedia_file: ''
  notes: Franchir la ligne d'effet des feux au rouge = feu rouge grillé (4 points), même si le véhicule s'arrête
    ensuite au milieu du carrefour.
- code: MARQ-passage-pietons
  categorie: marquage
  nom: Passage pour piétons
  signification: Bandes blanches parallèles à l'axe de la chaussée (2,50 m de long, 50 cm de large, espacées de
    50 cm) matérialisant un passage réservé aux piétons ; les piétons y sont prioritaires dès qu'ils sont engagés
    ou manifestent l'intention de traverser. Interdiction de s'y arrêter ou de stationner, et de stationner 5 m
    en amont.
  conduite_a_tenir: Céder le passage aux piétons engagés ou manifestant l'intention de traverser (s'arrêter si besoin)
    ; ne pas dépasser un véhicule arrêté ou ralentissant devant un passage ; ne pas s'immobiliser sur le passage
    même en cas de bouchon.
  implantation: Aux traversées ; annoncé par A13b, position C20a.
  fin: ''
  forme_couleur: bandes blanches parallèles à l'axe de la route (2,50 m × 0,50 m, espacées de 0,50 m)
  confusions:
  - C20a
  - A13b
  - MARQ-passage-cyclistes
  importance: essentiel
  wikimedia_file: ''
  notes: 'Refus de priorité à un piéton : 6 points, 135 €. Un piéton doit utiliser le passage s''il est à moins
    de 50 m.'
- code: MARQ-passage-cyclistes
  categorie: marquage
  nom: Traversée cyclable (passage pour cyclistes)
  signification: Traversée de chaussée réservée aux cyclistes matérialisée par des carrés (ou pointillés) blancs
    de 50 cm de part et d'autre ; le cycliste qui l'emprunte reste soumis aux règles de priorité du carrefour (panneaux,
    feux), sauf si un cédez-le-passage ou un STOP impose aux voitures de céder.
  conduite_a_tenir: Contrôler la traversée avant de tourner ; céder le passage aux cyclistes si la signalisation
    le prévoit (souvent AB3a pour les voitures) ; sinon le cycliste n'est pas automatiquement prioritaire comme
    un piéton.
  implantation: En prolongement des pistes cyclables aux intersections.
  fin: ''
  forme_couleur: carrés (pointillés) blancs de 50 cm de part et d'autre de la traversée
  confusions:
  - MARQ-passage-pietons
  - C20c
  - A21
  importance: essentiel
  wikimedia_file: ''
  notes: 'Piège : contrairement au passage piéton, le passage cycliste ne confère pas la priorité par lui-même ;
    c''est la signalisation (feux, AB3a, priorité à droite) qui la fixe.'
- code: MARQ-zebra
  categorie: marquage
  nom: Zébra (hachures blanches)
  signification: 'Zone hachurée blanche (hachures obliques bordées d''une ligne continue) matérialisant un espace
    interdit à la circulation, à l''arrêt et au stationnement : îlot séparateur peint, biseau de raccordement, musoir,
    terre-plein.'
  conduite_a_tenir: Ne pas y circuler, ne pas y stationner, ne pas s'en servir pour dépasser ou tourner ; on peut
    exceptionnellement s'y arrêter en cas de panne. Certaines hachures bordées d'une ligne discontinue sont franchissables
    en cas de nécessité.
  implantation: Îlots, divergents de sortie d'autoroute, approches d'intersection.
  fin: ''
  forme_couleur: hachures blanches obliques bordées d'une ligne
  confusions:
  - MARQ-ligne-continue
  - J5
  - J11
  importance: essentiel
  wikimedia_file: ''
  notes: Zébra bordé d'une ligne continue = infranchissable ; bordé d'une ligne discontinue = franchissable si nécessaire.
- code: MARQ-ligne-rive
  categorie: marquage
  nom: 'Ligne de rive (T2 : 3 m de trait, 3,5 m de vide) et rive continue'
  signification: Ligne blanche discontinue de rive (T2, 3 m / 3,5 m, largeur 3u) ou continue délimitant le bord
    de la chaussée et l'accotement. Elle guide la nuit ; la rive continue signale que l'accotement est impraticable
    ou qu'on ne doit pas s'y arrêter (sauf urgence) ; T'3 (20 m / 6 m) aux abords des carrefours et dans les bretelles.
  conduite_a_tenir: Rester à gauche de la ligne de rive ; ne pas rouler sur l'accotement ; on peut la franchir pour
    s'arrêter sur l'accotement (si autorisé) ou entrer dans une propriété.
  implantation: Bord droit (et gauche sur chaussées séparées) des routes ; sur autoroute, c'est la ligne T4.
  fin: ''
  forme_couleur: 'ligne blanche de rive : discontinue T2 (3 m / 3,5 m, largeur 3u) ou continue'
  confusions:
  - MARQ-ligne-BAU-T4
  - MARQ-ligne-discontinue-T1
  - MARQ-voie-insertion
  importance: utile
  wikimedia_file: ''
  notes: 'La ligne de rive ne sépare pas des voies de circulation : sa modulation (T2) est différente de l''axiale
    (T1) pour éviter la confusion la nuit.'
- code: MARQ-ligne-BAU-T4
  categorie: marquage
  nom: 'Ligne délimitant la bande d''arrêt d''urgence (T4 : 39 m de trait, 13 m de vide)'
  signification: 'Ligne discontinue à très longs traits (39 m) et vides de 13 m délimitant la bande d''arrêt d''urgence
    sur autoroute et routes à chaussées séparées. Elle sert de repère de distance de sécurité : à 130 km/h, garder
    au moins deux traits (≈ 90 m, soit un peu plus de 2 secondes) avec le véhicule précédent.'
  conduite_a_tenir: 'Ne pas circuler sur la BAU (réservée aux arrêts d''urgence et aux secours) ; utiliser les traits
    pour vérifier sa distance de sécurité : « un trait = danger, deux traits = sécurité ».'
  implantation: Section courante des autoroutes.
  fin: ''
  forme_couleur: traits blancs de 39 m espacés de 13 m (largeur 3u) sur autoroute
  confusions:
  - MARQ-ligne-rive
  - MARQ-chevrons
  - C207
  importance: essentiel
  wikimedia_file: ''
  notes: 'Circuler sur la BAU : 135 €, 3 points. La distance de sécurité de 2 s à 130 km/h ≈ 73 m.'
- code: MARQ-chevrons
  categorie: marquage
  nom: Chevrons de distance de sécurité
  signification: 'Chevrons blancs peints dans l''axe des voies (autoroutes, tunnels) et espacés de façon à matérialiser
    la distance de sécurité : il faut laisser au moins deux chevrons entre soi et le véhicule qui précède.'
  conduite_a_tenir: Garder deux chevrons visibles entre son véhicule et celui de devant.
  implantation: Sections d'autoroute et tunnels où les accidents en chaîne sont fréquents.
  fin: ''
  forme_couleur: chevrons blancs peints dans l'axe de la voie, espacés régulièrement
  confusions:
  - MARQ-ligne-BAU-T4
  - B17
  importance: utile
  wikimedia_file: ''
  notes: Ne pas confondre avec les chevrons des balises J4 (virage) ou des musoirs J14b.
- code: MARQ-voie-insertion
  categorie: marquage
  nom: Ligne de délimitation des voies d'insertion, de décélération et d'entrecroisement (T2 5u)
  signification: 'Ligne discontinue large (T2 : 3 m / 3,5 m, largeur 5u) séparant une voie d''accélération, de décélération
    ou d''entrecroisement de la chaussée principale ; les traits larges signalent une voie spéciale.'
  conduite_a_tenir: 'Voie d''accélération : accélérer pour atteindre la vitesse du trafic et s''insérer en cédant
    le passage (le conducteur déjà sur l''autoroute est prioritaire mais doit faciliter l''insertion). Voie de décélération
    : s''y engager dès son début puis freiner dedans, pas sur la voie principale.'
  implantation: Entrées et sorties d'autoroute et de routes à chaussées séparées ; voies de stockage pour tourner.
  fin: ''
  forme_couleur: traits blancs larges (5u) de 3 m espacés de 3,5 m (T2)
  confusions:
  - MARQ-ligne-rive
  - MARQ-ligne-discontinue-T1
  - AB3a
  importance: essentiel
  wikimedia_file: ''
  notes: Une ligne discontinue LARGE à traits courts délimite une voie spéciale (insertion, sortie, stockage, bus)
    ; une ligne discontinue FINE à longs vides (T1) sépare deux voies ordinaires.
- code: MARQ-bande-cyclable
  categorie: marquage
  nom: Bande cyclable (ligne T3 5u + pictogramme vélo)
  signification: 'Voie réservée aux cyclistes sur la chaussée, délimitée par une ligne discontinue large à traits
    longs (T3 : 3 m / 1,33 m, largeur 5u) et souvent un pictogramme vélo peint. Interdit aux autres véhicules d''y
    circuler, de s''y arrêter ou d''y stationner (sauf pour la traverser en tournant, en cédant le passage aux cyclistes).'
  conduite_a_tenir: Ne pas y rouler ni y stationner ; contrôler l'angle mort avant de la couper pour tourner à droite
    ; une bande cyclable peut être à contresens (double-sens cyclable).
  implantation: Sur la chaussée, côté droit ; signalisation par B22a (obligatoire) ou C113 (conseillée).
  fin: ''
  forme_couleur: ligne discontinue large T3 (3 m / 1,33 m, 5u) + pictogramme vélo blanc
  confusions:
  - B22a
  - C113
  - MARQ-couloir-bus
  - MARQ-ligne-dissuasion
  importance: essentiel
  wikimedia_file: ''
  notes: Stationnement sur bande cyclable = très gênant (135 €). Une bande cyclable est sur la chaussée ; une piste
    cyclable est séparée de la chaussée.
- code: MARQ-couloir-bus
  categorie: marquage
  nom: Couloir réservé aux bus (ligne T3 5u + inscription BUS)
  signification: Voie réservée aux autobus, délimitée par une ligne discontinue large (T3 5u) ou une ligne continue,
    avec l'inscription « BUS » (et parfois « TAXI ») au sol. Interdite aux autres véhicules sauf catégories autorisées
    par panonceau. Ligne continue = infranchissable ; ligne discontinue = traversable pour tourner ou accéder à
    une propriété.
  conduite_a_tenir: Ne pas y circuler ni y stationner ; la traverser seulement pour tourner (si ligne discontinue),
    en cédant le passage aux bus. Dans un carrefour, un damier blanc peut prolonger le couloir.
  implantation: En agglomération ; signalisation verticale B27a / C24a.
  fin: ''
  forme_couleur: ligne large T3 5u (ou continue) + inscription BUS
  confusions:
  - B27a
  - MARQ-bande-cyclable
  - MARQ-ligne-jaune-zigzag
  - MARQ-damier-blanc
  importance: essentiel
  wikimedia_file: ''
  notes: 'Circuler dans un couloir bus : 135 €. Certains couloirs sont à contresens de la circulation générale.'
- code: MARQ-damier-blanc
  categorie: marquage
  nom: Damier blanc (continuité d'un couloir bus dans un carrefour)
  signification: Damier blanc peint dans un carrefour pour matérialiser la continuité d'un couloir de bus ou d'une
    voie de tramway à travers l'intersection.
  conduite_a_tenir: Ne pas s'y immobiliser ; céder le passage aux bus/tramways.
  implantation: Dans les carrefours traversés par un site propre.
  fin: ''
  forme_couleur: damier blanc dans le carrefour
  confusions:
  - MARQ-couloir-bus
  - MARQ-damier-rouge-blanc
  importance: rare
  wikimedia_file: ''
  notes: 'À VÉRIFIER : usage local (IISR 7e partie, marquage des voies réservées).'
- code: MARQ-voie-vehicules-lents
  categorie: marquage
  nom: Voie pour véhicules lents (ligne T3 5u + panneau « véhicules lents »)
  signification: Voie supplémentaire à droite dans les montées, délimitée par une ligne T3 5u, réservée et obligatoire
    pour les véhicules ne pouvant dépasser 60 km/h (poids lourds, caravanes) afin de ne pas gêner la circulation
    ; annoncée par un panneau B29 « véhicules lents » avec panonceau M3a.
  conduite_a_tenir: Si l'on roule à 60 km/h ou moins (ex. avec caravane), emprunter cette voie ; sinon rester sur
    la voie normale et ne pas utiliser la voie lente pour dépasser par la droite.
  implantation: Côtes des routes à forte déclivité.
  fin: ''
