  wikimedia_file: France road sign EB10.svg
  notes: 'Seul un B14 inférieur à 50 (30, 40) peut être sur le même support que l''EB10 ; il vaut alors pour toute
    l''agglomération. Un 70 (relèvement) est implanté après l''EB10 et ne vaut que sur la route concernée, jusqu''à
    la prochaine intersection ou au B33. Un E31 (lieu-dit, lettres italiques) ne limite PAS la vitesse à 50 : ce
    n''est pas une agglomération au sens du code.'
