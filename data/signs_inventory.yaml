  conduite_a_tenir: Ralentir, être prêt à s'arrêter ; un troupeau peut occuper toute la chaussée.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (vache)
