- code: MARQ-sas-velo
  categorie: marquage
  nom: Sas vélo (sas cyclable)
  signification: 'Espace réservé aux cyclistes entre deux lignes d''effet des feux (3 à 5 m), matérialisé par un
    pictogramme vélo, à un carrefour à feux : les voitures s''arrêtent à la ligne arrière, les cyclistes se placent
    devant, bien visibles, pour démarrer avant les véhicules motorisés.'
  conduite_a_tenir: 'En voiture ou à moto : s''arrêter à la première ligne (arrière), ne jamais s''immobiliser dans
    le sas (135 €, 4 points comme un franchissement de ligne d''arrêt).'
  implantation: Carrefours à feux en agglomération (créés en 1998, généralisés depuis 2015).
  fin: ''
