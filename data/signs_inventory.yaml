- code: SR-INTERFILE
  categorie: autre
  nom: Panneau d'information sur la circulation inter-files (deux-roues motorisés)
  signification: Panneau d'information (type SR, 2021) rappelant les règles de la circulation inter-files des deux-roues
    motorisés, expérimentée sur certaines voies rapides (entre les deux voies les plus à gauche, trafic congestionné,
    50 km/h maximum, panonceau M4c « en inter-files »).
  conduite_a_tenir: 'Automobiliste : rouler au centre de sa voie, contrôler ses rétroviseurs avant tout changement
