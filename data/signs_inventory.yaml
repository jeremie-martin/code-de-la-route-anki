  wikimedia_file: ''
  notes: Les cyclomoteurs n'ont accès au sas que si l'autorité locale l'autorise (décret 2015).
- code: MARQ-CVCB
  categorie: marquage
  nom: Chaussée à voie centrale banalisée (« chaucidou »)
  signification: Chaussée étroite sans ligne axiale, comportant une voie centrale unique à double sens pour les
    véhicules motorisés et deux bandes latérales (rives) destinées aux cyclistes. Les véhicules circulent au centre
    et, pour se croiser, se déportent temporairement sur les rives en cédant le passage aux cyclistes.
  conduite_a_tenir: Rouler au centre ; lors d'un croisement, se déporter à droite sur la bande latérale seulement
    après s'être assuré de l'absence de cycliste, puis revenir au centre. Ne pas rouler en permanence sur la rive.
  implantation: Routes étroites hors et en agglomération ; signalée par un panneau d'information (C24a / C50) et
    souvent une limitation de vitesse.
  fin: ''
