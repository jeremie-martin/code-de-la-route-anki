- code: MARQ-ralentisseur-triangles
  categorie: marquage
  nom: Marquage d'un ralentisseur (triangles blancs)
  signification: 'Trois triangles blancs (« dents de requin ») disposés sur le ralentisseur, pointes dans le sens
    de la circulation, dans l''axe de chaque voie : ils signalent un dos-d''âne ; sur les plateaux et coussins,
    les triangles couvrent les rampes. Non obligatoire en zone 30.'
  conduite_a_tenir: Ralentir à 30 km/h maximum avant de franchir.
  implantation: Sur la rampe du ralentisseur ; signalisation verticale A2b puis C27.
