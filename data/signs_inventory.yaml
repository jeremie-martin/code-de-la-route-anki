    aérien.'
  conduite_a_tenir: S'arrêter si nécessaire, regarder et écouter des deux côtés ; franchir sans s'arrêter sur les
    voies uniquement si aucun train n'est visible ou audible ; si un AB4 (STOP) surmonte la croix, arrêt obligatoire.
