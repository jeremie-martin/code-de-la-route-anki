- code: MARQ-ralentisseur-dos-d-ane
  categorie: marquage
  nom: Ralentisseur de type dos-d'âne
  signification: Bosse en profil circulaire (hauteur 10 cm, longueur 4 m) implantée sur toute la largeur de la chaussée
