- code: A15b
  categorie: danger
  nom: Passage d'animaux sauvages
  signification: Annonce un endroit fréquenté par des animaux sauvages (cerfs, sangliers, chevreuils) susceptibles
    de traverser, surtout à l'aube et au crépuscule.
  conduite_a_tenir: Ralentir, surveiller les bas-côtés ; en cas d'animal sur la route, freiner sans donner de coup
    de volant brusque.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus. Souvent complété d''un panonceau
    M2 d''étendue (ex. « 5 km »).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (cerf bondissant)
  confusions:
  - A15a1
  - A15c
  importance: essentiel
  wikimedia_file: France road sign A15b.svg
  notes: 'Piège : animaux sauvages (cerf) vs domestiques (vache). Une variante avec un lynx existe localement.'
- code: A15c
  categorie: danger
  nom: Passage de cavaliers
  signification: Annonce un endroit où des cavaliers sont susceptibles de traverser ou de circuler.
  conduite_a_tenir: Ralentir, ne pas klaxonner ni effrayer les chevaux, dépasser avec un large écart et à faible
    vitesse.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (cavalier)
  confusions:
  - A15a1
  - A15b
  - B22c
  importance: utile
  wikimedia_file: France road sign A15c.svg
  notes: ''
- code: A16
  categorie: danger
  nom: Descente dangereuse
  signification: Annonce une descente à forte pente ; le pourcentage indiqué (ex. 10 %) est la pente (dénivelé de
    10 m pour 100 m parcourus).
  conduite_a_tenir: Rétrograder pour utiliser le frein moteur, ne pas surchauffer les freins, contrôler sa vitesse
    ; en montagne, le véhicule descendant facilite le croisement (il doit s'arrêter/reculer si nécessaire).
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (pente avec pourcentage)
  confusions:
  - C26a
  - M9j1
  importance: essentiel
  wikimedia_file: France road sign A16.svg
  notes: Le pourcentage est la pente, pas une vitesse. 10 % = 10 m de dénivelé pour 100 m. Le frein moteur est recommandé.
- code: A17
  categorie: danger
  nom: Annonce de feux tricolores
  signification: Annonce des feux de signalisation tricolores (carrefour à feux) souvent masqués ou inattendus (hors
    agglomération, sortie de virage).
  conduite_a_tenir: Ralentir, se préparer à s'arrêter ; anticiper le passage au jaune.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (feux tricolores rouge-jaune-vert)
  confusions:
  - AK17
  importance: essentiel
  wikimedia_file: France road sign A17.svg
  notes: 'Version temporaire jaune : AK17 (feux de chantier). Un feu jaune clignotant R1 peut être ajouté au sommet
    du panneau pour renforcer l''alerte.'
- code: A18
  categorie: danger
  nom: Circulation dans les deux sens
  signification: Annonce qu'après une section à sens unique ou à chaussées séparées, la circulation se fait à nouveau
    dans les deux sens sur la même chaussée.
  conduite_a_tenir: Serrer à droite, ne plus utiliser la partie gauche de la chaussée comme une voie de circulation
    dans son sens.
  implantation: Implanté au début de la section à double sens (à hauteur du danger), et non 150 m avant comme les
    autres panneaux de danger.
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (deux flèches opposées)
  confusions:
  - C12
  - B1
  - C24a
  importance: essentiel
  wikimedia_file: France road sign A18.svg
  notes: 'Piège : c''est le seul panneau de danger implanté à l''endroit même du danger (pas à 150 m). Ne pas confondre
    avec la fin de sens unique (pas de panneau spécifique) ou avec C24a.'
- code: A19
  categorie: danger
  nom: Risque de chute de pierres
  signification: Annonce un risque de chute de pierres depuis un talus ou une falaise, ou la présence de pierres
    sur la chaussée.
  conduite_a_tenir: Ralentir, surveiller la chaussée et le talus, ne pas s'arrêter dans la zone.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (pierres dévalant)
  confusions:
  - A4
  importance: utile
  wikimedia_file: France road sign A19.svg
  notes: Le côté du talus dessiné indique d'où viennent les pierres.
- code: A20
  categorie: danger
  nom: Débouché sur un quai ou une berge
  signification: Annonce que la route débouche sur un quai, une berge ou un plan d'eau non protégé (risque de chute
    dans l'eau).
  conduite_a_tenir: Ralentir fortement, ne pas manœuvrer ou stationner près du bord.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (voiture tombant dans l'eau)
  confusions:
  - A6
  importance: utile
  wikimedia_file: France road sign A20.svg
  notes: ''
- code: A21
  categorie: danger
  nom: Débouché de cyclistes venant de droite ou de gauche
  signification: Annonce un endroit où des cyclistes débouchent fréquemment sur la chaussée (sortie de piste cyclable,
    traversée).
  conduite_a_tenir: Ralentir, contrôler les côtés ; laisser au moins 1 m (agglo) ou 1,5 m (hors agglo) lors du dépassement
    d'un cycliste.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (cycliste)
  confusions:
  - C113
  - B22a
  - B9b
  - C20c
  importance: essentiel
  wikimedia_file: France road sign A21.svg
  notes: 'Piège : triangle = danger (cyclistes qui débouchent) ; rond bleu = piste obligatoire (B22a) ; carré bleu
    = piste conseillée (C113) ; rond rouge = interdit aux cycles (B9b).'
- code: A23
  categorie: danger
  nom: Traversée d'une aire de danger aérien
  signification: 'Annonce la traversée d''une zone où des aéronefs volent à basse altitude (proximité d''un aérodrome)
    : risque de surprise ou d''effet de souffle.'
  conduite_a_tenir: Ne pas se laisser distraire ni s'arrêter ; respecter les feux rouges clignotants s'il y en a.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (avion)
  confusions:
  - A24
  importance: rare
  wikimedia_file: France road sign A23.svg
  notes: ''
- code: A24
  categorie: danger
  nom: Vent latéral
  signification: Annonce une zone exposée à des vents latéraux violents (pont, viaduc, plaine, sortie de tunnel)
    ; le panneau est souvent complété par une manche à air (J7) qui montre la force et la direction du vent.
  conduite_a_tenir: Ralentir, tenir fermement le volant à deux mains, garder ses distances des véhicules hauts (poids
    lourds, caravanes) et des deux-roues, anticiper la fin d'un abri (pile de pont, camion).
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (manche à air rouge et blanche)
  confusions:
  - J7
  - A23
  importance: essentiel
  wikimedia_file: France road sign A24.svg
  notes: Le symbole du panneau est rouge (exception parmi les symboles noirs des panneaux de danger). La manche
    à air J7 balise l'endroit précis.
- code: AB1
  categorie: intersection_priorite
  nom: Intersection où s'applique la priorité à droite
  signification: Annonce une intersection où le conducteur doit céder le passage aux véhicules venant de sa droite
    (règle générale de priorité à droite), et où il a la priorité sur ceux venant de sa gauche.
  conduite_a_tenir: Ralentir, contrôler à droite et céder le passage aux véhicules venant de droite ; ne pas compter
    sur la priorité.
  implantation: 'Signal avancé : environ 150 m avant l''intersection hors agglomération ; 0 à 30 m en agglomération
    (sans panonceau de distance sauf si > 150 m).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge (pointe en haut), symbole noir (croix en X)
  confusions:
  - AB2
  - A14
  - AB25
  importance: essentiel
  wikimedia_file: France road sign AB1.svg
  notes: 'Piège : AB1 (croix X, je cède à droite) ≠ AB2 (barre verticale épaisse, je suis prioritaire à cette intersection
    seulement). Ce panneau ne crée pas la règle, il la rappelle : la priorité à droite s''applique aussi sans panneau.'
- code: AB2
  categorie: intersection_priorite
  nom: Intersection avec une route non prioritaire (priorité ponctuelle)
  signification: Annonce une intersection où le conducteur est prioritaire par rapport aux véhicules venant des
    routes transversales (ils ont un STOP ou un cédez-le-passage). La priorité ne vaut que pour cette intersection.
  conduite_a_tenir: 'Continuer en restant vigilant : la priorité n''exclut pas la prudence (un usager peut griller
    son STOP). Ne pas ralentir inutilement.'
  implantation: 'Signal avancé : environ 150 m avant l''intersection hors agglomération ; 0 à 30 m en agglomération.
    Peut être complété par un panonceau M7 (schéma de l''intersection, branches prioritaires en trait épais).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge (pointe en haut), symbole noir (barre verticale épaisse coupée d'une
    barre fine)
  confusions:
  - AB1
  - AB6
  - M7
  importance: essentiel
  wikimedia_file: France road sign AB2.svg
  notes: Priorité PONCTUELLE (une seule intersection), contrairement à AB6 (route prioritaire sur tout l'itinéraire).
    Avec panonceau M7, le trait large montre les branches prioritaires.
- code: AB3a
  categorie: intersection_priorite
  nom: Cédez le passage
  signification: À l'intersection, le conducteur doit céder le passage aux véhicules circulant sur la route qu'il
    va croiser ou rejoindre, sans obligation de s'arrêter s'il peut passer sans gêner.
  conduite_a_tenir: Ralentir, contrôler à gauche et à droite, s'arrêter si nécessaire à la ligne discontinue (T'2)
    ou à hauteur du panneau, et ne s'engager qu'en sécurité.
  implantation: 'Implanté à hauteur de l''intersection, au niveau de la ligne discontinue de cédez-le-passage (marquage
    obligatoire : ligne T''2 de 50 cm de trait / 50 cm de vide, largeur 50 cm). Aussi en fin de voie d''insertion
    (autoroute) et aux entrées de giratoire.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, pointe en bas, sans symbole
  confusions:
  - AB3b
  - AB4
  - AB5
  - AB1
  - M9c
  importance: essentiel
  wikimedia_file: France road sign AB3a.svg
  notes: 'Seul panneau de danger/priorité triangulaire pointe en bas : reconnaissable par sa forme même de dos ou
    couvert de neige. L''arrêt n''est pas obligatoire si la voie est libre. Sur feux tricolores : les feux prévalent
    ; le panneau ne s''applique que feux éteints ou au jaune clignotant.'
- code: AB3b
  categorie: intersection_priorite
  nom: Signal avancé de cédez-le-passage
  signification: Annonce un cédez-le-passage (AB3a) situé à la distance indiquée par le panonceau M1 (le plus souvent
    150 m).
  conduite_a_tenir: Ralentir progressivement, se préparer à céder le passage à l'intersection annoncée.
  implantation: Environ 150 m avant l'intersection hors agglomération (répété à mi-distance si placé à plus de 200
    m). Distance sur panonceau M1.
  fin: ''
  forme_couleur: triangle blanc bordé de rouge pointe en bas + panonceau M1 de distance
  confusions:
  - AB3a
  - AB5
  - M1
  importance: essentiel
  wikimedia_file: France road sign AB3b.svg
  notes: AB3b = AB3a + panonceau de distance M1. Ne pas confondre avec AB5 (STOP à 150 m, panonceau M5).
- code: AB4
  categorie: intersection_priorite
  nom: Arrêt à l'intersection (STOP)
  signification: Obligation de marquer l'arrêt absolu à la limite de la chaussée abordée (ligne blanche continue),
    puis de céder le passage aux véhicules circulant sur l'autre route, dans les deux sens.
  conduite_a_tenir: S'arrêter complètement (roues immobilisées) à la ligne continue, même si la voie semble libre
    ; regarder gauche-droite-gauche ; s'engager seulement quand c'est sûr. À un STOP, on n'est jamais prioritaire.
  implantation: Implanté à l'endroit où le conducteur doit s'arrêter, à hauteur de la ligne d'arrêt continue (largeur
    50 cm). Peut surmonter un panneau G1 à un passage à niveau (arrêt obligatoire avant les voies). Obligatoirement
    accompagné du marquage au sol.
  fin: ''
  forme_couleur: octogone rouge, bord blanc, inscription STOP blanche
  confusions:
  - AB5
  - AB3a
  - B4
  - B5a
  importance: essentiel
  wikimedia_file: France road sign AB4.svg
  notes: 'Seul panneau octogonal en France : reconnaissable de dos. L''arrêt se fait à la ligne (pas au panneau)
    ; sans ligne, à la limite de la chaussée abordée. Non-respect : 4 points, 135 €. Aux feux : le feu prévaut sur le STOP (feu
    vert = passer sans s''arrêter ; feu jaune clignotant ou éteint = STOP applicable).'
- code: AB5
  categorie: intersection_priorite
  nom: Signal avancé de STOP
  signification: Annonce un panneau STOP (AB4) situé à la distance indiquée par le panonceau M5 (le plus souvent
    150 m).
  conduite_a_tenir: Ralentir, se préparer à marquer l'arrêt à l'intersection annoncée.
  implantation: Environ 150 m avant le STOP hors agglomération ; distance portée par le panonceau M5 (« STOP 150
    m »).
  fin: ''
  forme_couleur: triangle blanc bordé de rouge pointe en bas + inscription STOP + panonceau M5
  confusions:
  - AB3b
  - AB4
  - M5
  importance: essentiel
  wikimedia_file: France road sign AB5.svg
  notes: Le panneau AB5 ne demande pas de s'arrêter à son niveau ; l'arrêt se fait au STOP 150 m plus loin.
- code: AB6
  categorie: intersection_priorite
  nom: Route à caractère prioritaire
  signification: 'Indique que la route sur laquelle on circule est prioritaire : à toutes les intersections suivantes
    (jusqu''au panneau AB7), les véhicules venant des routes transversales doivent céder le passage.'
  conduite_a_tenir: Continuer en restant attentif ; ne pas ralentir inutilement aux intersections mais rester prêt
    à réagir. La priorité ne dispense pas de céder le passage aux piétons, tramways, véhicules prioritaires en intervention.
  implantation: Placé au début de la route prioritaire et rappelé après les intersections importantes et à l'entrée
    des agglomérations (peut être sur le même support qu'EB10).
  fin: AB7
  forme_couleur: carré jaune posé sur la pointe (losange), bordé de blanc
  confusions:
  - AB7
  - AB2
  - AB25
  importance: essentiel
  wikimedia_file: France road sign AB6.svg
  notes: 'Losange jaune plein = route prioritaire ; losange barré = fin. Ne pas confondre le caractère prioritaire
    de la route (AB6, toute la route) avec la priorité ponctuelle (AB2, une intersection). Un STOP ou cédez-le-passage
    vaut malgré un AB6 antérieur : un panneau plus récent s''applique.'
- code: AB7
  categorie: intersection_priorite
  nom: Fin de route à caractère prioritaire
  signification: Indique la fin du caractère prioritaire de la route ; à partir de là, sauf signalisation contraire,
    la règle générale de la priorité à droite s'applique.
  conduite_a_tenir: 'Redoubler de vigilance aux intersections suivantes : céder le passage aux véhicules venant
    de droite en l''absence de signalisation.'
  implantation: Implanté à l'endroit où cesse le caractère prioritaire ; souvent à l'entrée d'agglomération, sur
    le même support qu'EB10.
  fin: ''
  forme_couleur: losange jaune bordé de blanc barré d'une bande noire
  confusions:
  - AB6
  - B31
  importance: essentiel
  wikimedia_file: France road sign AB7.svg
  notes: ''
- code: AB25
  categorie: intersection_priorite
  nom: Carrefour à sens giratoire
  signification: 'Annonce un carrefour à sens giratoire : les usagers déjà engagés dans l''anneau sont prioritaires
    ; chaque entrée est munie d''une ligne discontinue de cédez-le-passage (et du panneau AB3a, obligatoire hors
    agglomération, facultatif en agglomération).'
  conduite_a_tenir: Ralentir, céder le passage aux véhicules dans l'anneau, s'engager quand c'est possible, circuler
    dans le sens antihoraire (par la droite), clignotant droit avant de sortir, clignotant gauche uniquement si
    l'on va prendre une sortie au-delà de la moitié.
  implantation: 'Signal avancé : environ 150 m avant hors agglomération, à proximité immédiate en agglomération.
    En position : AB3a + ligne discontinue à chaque entrée ; l''îlot central porte souvent une balise J5 ou un panneau
    B21a1 (contournement par la droite).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge (pointe en haut), symbole noir (trois flèches en cercle)
  confusions:
  - AB3a
  - B21a1
  - J5
  - AB1
  importance: essentiel
  wikimedia_file: France road sign AB25.svg
  notes: 'Il n''existe plus de panneau rond bleu « sens giratoire obligatoire » en France (B21f supprimé en 1984).
    Piège : « carrefour à sens giratoire » (AB25 + AB3a : priorité à l''anneau) ≠ « rond-point » sans cédez-le-passage
    (rare, ex. place de l''Étoile à Paris) où la priorité à droite s''applique : celui qui entre est prioritaire.
    Sur un giratoire à deux voies, on utilise la voie de droite pour sortir aux premières sorties.'
- code: B0
  categorie: interdiction
  nom: Circulation interdite à tout véhicule dans les deux sens
  signification: Interdiction de circuler à tout véhicule (avec ou sans moteur, y compris les cycles), dans les
    deux sens. Seuls les piétons peuvent passer.
  conduite_a_tenir: Ne pas s'engager. Un panonceau peut prévoir des exceptions (« sauf riverains », « sauf livraisons
    »).
  implantation: Placé à l'endroit où commence l'interdiction ; répété après chaque intersection (sauf voies privées
    et chemins de terre).
  fin: ''
  forme_couleur: rond blanc bordé de rouge, sans symbole
  confusions:
  - B1
  - B7b
  - B31
  importance: essentiel
  wikimedia_file: France road sign B0.svg
  notes: 'Piège : B0 (blanc, cercle rouge vide) = interdit à TOUT véhicule dans les DEUX sens ; B1 (rouge, barre
    blanche) = sens interdit dans UN sens. Ne pas confondre avec B31 (fin de toutes interdictions : blanc, barre
    noire oblique).'
- code: B1
  categorie: interdiction
  nom: Sens interdit à tout véhicule
  signification: 'Interdiction de s''engager dans cette voie : elle est à sens unique dans l''autre sens. Concerne
    tous les véhicules, cycles compris, sauf panonceau.'
  conduite_a_tenir: 'Ne pas s''engager. Avec le panonceau M9v1/M9v2 (« sauf vélo »), les cyclistes peuvent l''emprunter
    à contresens (double-sens cyclable) : attention en croisant ou en tournant.'
  implantation: Placé à l'entrée de la voie (à l'endroit où commence l'interdiction), généralement des deux côtés
    de la chaussée.
  fin: ''
  forme_couleur: rond rouge, barre horizontale blanche
  confusions:
  - B0
  - C12
  - B1j
  - A18
  - M9v1
  importance: essentiel
  wikimedia_file: France road sign B1.svg
  notes: 'L''autre extrémité de la rue porte un C12 (sens unique). Le double-sens cyclable est la règle par défaut
    dans les zones 30 et zones de rencontre depuis le décret 2008-754 (généralisation au 1er juillet 2010), étendue
    en 2015 (décret 2015-808) à toutes les voies limitées à 30 km/h ou moins : le B1 y est complété par M9v2. Fichier
    Commons « France road sign B1+M9.svg » existe pour le B1 + panonceau.'
- code: B1j
  categorie: interdiction
  nom: Sens interdit sur bretelle (fond jaune)
  signification: 'Panneau B1 inscrit dans un carré jaune : rappel renforcé du sens interdit sur les bretelles de
    sortie d''autoroute ou de route à chaussées séparées, pour éviter les prises à contresens.'
  conduite_a_tenir: 'Ne jamais s''engager : on remonte une bretelle de sortie à contresens.'
  implantation: Sur les bretelles de sortie d'autoroute/route à chaussées séparées, face aux usagers qui pourraient
    s'y engager par erreur.
  fin: ''
  forme_couleur: rond rouge à barre blanche sur carré jaune
  confusions:
  - B1
  - KC1
  importance: utile
  wikimedia_file: France road sign B1j.svg
  notes: Le fond jaune n'indique pas ici une signalisation temporaire mais un renforcement (panneau carré, exception
    à la forme ronde des B). Créé en 2008 pour lutter contre les contresens.
- code: B2a
  categorie: interdiction
  nom: Interdiction de tourner à gauche à la prochaine intersection
  signification: Il est interdit de tourner à gauche à la prochaine intersection.
  conduite_a_tenir: Continuer tout droit ou tourner à droite ; ne pas tourner à gauche même si la voie paraît libre.
  implantation: Placé avant l'intersection concernée (à une distance appropriée), et non à l'endroit même.
  fin: ''
  forme_couleur: 'rond blanc bordé de rouge, symbole noir : flèche coudée vers la gauche barrée de rouge'
  confusions:
  - B2b
  - B2c
  - B21c2
  - B21-2
  importance: essentiel
  wikimedia_file: France road sign B2a.svg
  notes: 'Piège : l''interdiction ne vaut que pour LA prochaine intersection. Rond rouge = interdiction ; rond bleu
    (B21) = obligation.'
- code: B2b
  categorie: interdiction
  nom: Interdiction de tourner à droite à la prochaine intersection
  signification: Il est interdit de tourner à droite à la prochaine intersection.
  conduite_a_tenir: Continuer tout droit ou tourner à gauche.
  implantation: Placé avant l'intersection concernée.
  fin: ''
  forme_couleur: 'rond blanc bordé de rouge, symbole noir : flèche coudée vers la droite barrée de rouge'
  confusions:
  - B2a
  - B2c
  - B21c1
  importance: essentiel
  wikimedia_file: France road sign B2b.svg
  notes: ''
- code: B2c
  categorie: interdiction
  nom: Interdiction de faire demi-tour
  signification: Interdiction de faire demi-tour sur la route suivie, jusqu'à la prochaine intersection.
  conduite_a_tenir: Ne pas faire demi-tour ; continuer et changer de direction plus loin.
  implantation: Placé avant la section où s'applique l'interdiction.
  fin: ''
  forme_couleur: 'rond blanc bordé de rouge, symbole noir : flèche en U barrée de rouge'
  confusions:
  - B2a
  - B2b
  - C12
  importance: essentiel
  wikimedia_file: France road sign B2c.svg
  notes: Le demi-tour est par ailleurs interdit sans panneau sur autoroute, dans les tunnels (C111), sur les ponts,
    en cas de visibilité insuffisante et sur les voies à sens unique.
- code: B3
