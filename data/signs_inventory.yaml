- code: SR3a
  categorie: autre
  nom: Panneau d'annonce de radar automatique fixe (« Pour votre sécurité, contrôles automatiques »)
  signification: 'Panneau d''information à fond jaune/gris annonçant, à l''avance, une zone de contrôle automatisé
    de la vitesse (radar fixe) : « Pour votre sécurité – contrôles automatiques », avec pictogramme de radar.'
  conduite_a_tenir: 'Vérifier sa vitesse : le radar est à quelques centaines de mètres ; il n''y a aucune obligation
    nouvelle, la limitation en vigueur s''applique.'
  implantation: 'Quelques centaines de mètres avant un radar fixe (panneau non obligatoire : les radars ne sont
    plus systématiquement annoncés).'
  fin: ''
  forme_couleur: rectangle vertical blanc bordé de jaune, bandeaux gris avec texte, pictogramme de radar et de véhicules
