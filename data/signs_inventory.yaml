# Inventaire de la signalisation routière française pour le permis B (ETG / code de la route).
# Généré le 2026-09-21. Sources principales : Wikipédia FR (pages « Panneau de signalisation routière … en France »,
# « Liste des signaux routiers … », « Liste des panonceaux … », « Feux et signaux lumineux routiers en France »,
# « Signalisation routière horizontale en France »), qui citent l'Instruction interministérielle sur la
# signalisation routière (IISR) et l'arrêté du 24 novembre 1967 modifié ; Légifrance (arrêté du 24 août 2020
# modifié sur les voies réservées) ; Wikimedia Commons (noms de fichiers). Voir docs/research/signs-notes.md.
# Champs : code, categorie, nom, signification, conduite_a_tenir, implantation, fin, forme_couleur, confusions,
# importance (essentiel | utile | rare), wikimedia_file (à vérifier par script), notes, variants (optionnel).
# Catégories : danger | intersection_priorite | interdiction | obligation | fin_prescription | prescription_zonale (ajoutée :
# panneaux d'entrée ET de sortie de zone B6b/B50, B30/B51, B52/B53, B54/B55, B56/B57, B58/B59) | indication | indication_service |
# direction | localisation | panonceau | balise | temporaire | passage_a_niveau | voie_reservee | marquage | feux | autre.
# Les mentions « À VÉRIFIER » signalent un point non confirmé par une source primaire.
- code: A1a
  categorie: danger
  nom: Virage à droite
  signification: Annonce un virage à droite dangereux (visibilité réduite, rayon serré).
  conduite_a_tenir: Ralentir avant le virage, serrer à droite, ne pas dépasser, adapter l'allure à la visibilité.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir
  confusions:
  - A1b
  - A1c
  - A1d
  - J4
  importance: essentiel
  wikimedia_file: France road sign A1a.svg
  notes: Le sens de la flèche indique le sens du virage. Le danger commence 150 m après le panneau hors agglomération
    (50 m en agglomération).
- code: A1b
  categorie: danger
  nom: Virage à gauche
  signification: Annonce un virage à gauche dangereux.
  conduite_a_tenir: Ralentir, serrer à droite (ne pas couper le virage), ne pas dépasser.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir
  confusions:
  - A1a
  - A1c
  - A1d
  importance: essentiel
  wikimedia_file: France road sign A1b.svg
  notes: ''
- code: A1c
  categorie: danger
  nom: Succession de virages dont le premier est à droite
  signification: Annonce une succession de virages, le premier étant à droite.
  conduite_a_tenir: Ralentir, rester à droite sur toute la section ; un panonceau M2 peut préciser la longueur de
    la section sinueuse.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir
  confusions:
  - A1d
  - A1a
  importance: essentiel
  wikimedia_file: France road sign A1c.svg
  notes: 'Piège : c''est le premier virage dessiné (en bas) qui donne le sens ; ici le premier est à droite.'
- code: A1d
  categorie: danger
  nom: Succession de virages dont le premier est à gauche
  signification: Annonce une succession de virages, le premier étant à gauche.
  conduite_a_tenir: Ralentir, rester à droite sur toute la section.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir
  confusions:
  - A1c
  - A1b
  importance: essentiel
  wikimedia_file: France road sign A1d.svg
  notes: ''
- code: A2a
  categorie: danger
  nom: Cassis ou dos-d'âne
  signification: Annonce une déformation naturelle ou accidentelle de la chaussée (creux « cassis » ou bosse « dos-d'âne
    ») qui n'est pas un aménagement volontaire.
  conduite_a_tenir: Ralentir fortement ; risque de perte d'adhérence et de dommages au véhicule.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (deux bosses)
  confusions:
  - A2b
  - C27
  - AK2
  importance: essentiel
  wikimedia_file: France road sign A2a.svg
  notes: 'A2a (deux bosses) = déformation de la route ; A2b (une bosse) = ralentisseur construit volontairement.
    Version temporaire : AK2.'
- code: A2b
  categorie: danger
  nom: Ralentisseur de type dos-d'âne
  signification: Annonce un ralentisseur aménagé de type dos-d'âne (bosse) destiné à faire ralentir les véhicules.
  conduite_a_tenir: Ralentir à la vitesse indiquée par le panneau B14 qui l'accompagne généralement (30 km/h).
  implantation: 'Utilisé exclusivement en agglomération (le ralentisseur dos-d''âne n''est autorisé qu''en agglomération)
    : 0 à 50 m avant le ralentisseur, le plus souvent 50 m. Hors zone 30, il est suivi du panneau de position C27
    au niveau du ralentisseur.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (une bosse)
  confusions:
  - A2a
  - C27
  importance: essentiel
  wikimedia_file: France road sign A2b.svg
  notes: Un ralentisseur dos-d'âne se trouve uniquement en agglomération (ou sur voies limitées à 30 km/h). A2b
    = annonce (danger), C27 = position (indication carrée bleue).
- code: A3
  categorie: danger
  nom: Chaussée rétrécie
  signification: Annonce un rétrécissement de la chaussée par les deux côtés.
  conduite_a_tenir: Ralentir, se replacer au centre de sa voie ; en cas de rétrécissement à une seule voie, appliquer
    la règle du croisement (B15/C18 s'ils sont présents, sinon courtoisie et prudence).
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir
  confusions:
  - A3a
  - A3b
  - AK3
  - B15
  - C18
  importance: essentiel
  wikimedia_file: France road sign A3.svg
  notes: ''
