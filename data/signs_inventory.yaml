  notes: ''
- code: AGENT-injonction-arret
  categorie: autre
  nom: 'Agent ou véhicule de police : ordre de s''arrêter / de se ranger (contrôle)'
  signification: 'Un agent (gilet, brassard, disque « STOP POLICE ») ou un véhicule de police/gendarmerie (gyrophare,
    panneau lumineux « SUIVEZ » / « POLICE, STOP » / « GENDARMERIE ») peut ordonner à un conducteur de s''arrêter
    ou de le suivre : refus d''obtempérer = délit.'
  conduite_a_tenir: Ralentir, se ranger en sécurité à l'endroit indiqué, couper le moteur, présenter permis, carte
    grise (certificat d'immatriculation) et attestation d'assurance.
  implantation: ''
  fin: ''
  forme_couleur: gestes d'un agent (police, gendarmerie, signaleur) réglant la circulation
  confusions:
  - AGENT-bras-leve
  - K10b
  importance: utile
  wikimedia_file: ''
  notes: Le refus d'obtempérer est un délit (jusqu'à 2 ans de prison, 15 000 €, 6 points).
- code: AGENT-signaleur-chantier
  categorie: autre
  nom: Signaleur de chantier ou de course (piquet K10, fanion K1)
  signification: 'Les personnels de chantier et les signaleurs agréés (courses cyclistes, convois exceptionnels)
    peuvent régler la circulation avec un piquet K10 (face rouge K10b = arrêt, face verte K10a = passer) ou un fanion
    K1 : leurs indications doivent être respectées comme celles d''un agent.'
  conduite_a_tenir: S'arrêter à la face rouge, passer à la face verte, respecter la limitation du chantier.
  implantation: ''
  fin: ''
  forme_couleur: gestes d'un agent (police, gendarmerie, signaleur) réglant la circulation
  confusions:
  - K10b
  - K10a
  - K1
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: AGENT-vehicule-prioritaire
  categorie: autre
  nom: Véhicules prioritaires en intervention (gyrophare bleu + deux-tons)
  signification: Les véhicules d'intérêt général prioritaires (police, gendarmerie, douane, pompiers, SAMU/SMUR)
    en intervention avec gyrophare bleu ET avertisseur sonore deux-tons ont priorité sur tous les autres usagers,
    feux et panneaux compris ; les véhicules à feux bleus « bénéficiant de facilités de passage » (ambulances privées,
    EDF/GDF, transports de fonds, dépanneuses sur autoroute avec gyrophare orange…) doivent seulement être facilités.
  conduite_a_tenir: 'Leur céder le passage : se ranger à droite, ralentir ou s''arrêter, ne jamais les suivre de
    près ; ne pas franchir un feu rouge pour les laisser passer sauf si cela est possible sans danger (tolérance)
    ; sur autoroute, dégager la voie de gauche. Gyrophare orange = véhicule lent ou d''entretien : ne donne aucune
    priorité mais impose la prudence.'
  implantation: ''
  fin: ''
  forme_couleur: gestes d'un agent (police, gendarmerie, signaleur) réglant la circulation
  confusions:
  - FEU-rouge
  - FEU-detresse
  importance: essentiel
  wikimedia_file: ''
  notes: 'Bleu + sirène = priorité absolue ; bleu seul (sans sirène) = facilité de passage ; orange = signalement
    d''un danger (convoi, dépanneuse, engin), pas de priorité. Gêner un véhicule prioritaire : 4 points, 135 €.'
- code: VR-LOSANGE-DEBUT
  categorie: voie_reservee
  nom: Début de voie réservée (panneau à losange blanc)
  signification: 'Panneau carré (bleu ou noir/blanc selon version statique ou dynamique) portant un losange blanc,
    placé au-dessus ou à côté d''une voie de route à chaussées séparées : la voie est réservée, aux heures indiquées,
    aux véhicules de transport en commun, aux taxis et aux véhicules transportant un nombre minimal d''occupants
    (covoiturage, « 2+ » ou « 3+ » sur panonceau M4e), et selon les cas aux véhicules à très faibles émissions (Crit''Air
    0 / vignette verte) et aux véhicules « autopartage » ; un panneau SR en amont détaille les catégories autorisées.'
  conduite_a_tenir: Ne pas emprunter la voie si l'on est seul à bord d'un véhicule thermique (amende 135 €) ; quand
    le losange est éteint (voie dynamique) ou hors des horaires du panonceau M11b, la voie est ouverte à tous. Respecter
    la vitesse (souvent B14 associé).
  implantation: 'Panneau de position au début de la voie (première fois au-dessus de la voie), rappel après chaque
    échangeur, panonceau M3a/M3d de position, M4e (« 3+ »), M11b2 (horaires). Présignalisation par C24a à 150 m
    minimum ; panneau d''information SR en amont ; marquage : ligne T3 5u (permanente) ou T1 2u (horaires), losanges
    blancs au sol.'
  fin: VR-LOSANGE-FIN
  forme_couleur: carré bleu (statique) ou panneau à messages variables noir (dynamique) avec un losange blanc
  confusions:
  - VR-LOSANGE-FIN
  - VR-SR-INFO
  - B27a
  - C24a
  - MARQ-losange-VR
  importance: essentiel
  wikimedia_file: Panneau de début de voie réservée aux véhicules à occupation multiple.svg
  notes: 'Signalisation EXPÉRIMENTALE (arrêté du 24 août 2020, modifié 2024 et 2025, prolongée par l''arrêté du
    28 juillet 2026 jusqu''à six ans et trois mois, soit fin 2026) : pas de code IISR définitif à ce jour (Wikipedia
    : « référence inconnue »). Par défaut (sans panonceau) le losange = voie réservée bus + taxis + covoiturage
    2+. Déployée à Lyon (M6/M7), Grenoble, Paris (A1/A13, jeux olympiques 2024), Strasbourg, Nantes... Souvent enseignée
    dans les cours de code depuis 2021.'
- code: VR-LOSANGE-FIN
  categorie: voie_reservee
  nom: Fin de voie réservée (losange barré)
  signification: 'Panneau carré portant un losange blanc barré d''une diagonale rouge : fin de la voie réservée
    ; la voie redevient ouverte à tous.'
  conduite_a_tenir: La voie peut de nouveau être empruntée par tous les véhicules.
  implantation: À la fin de la section, sur le terre-plein central ou au-dessus des voies.
  fin: ''
  forme_couleur: carré bleu (ou PMV) avec losange blanc barré de rouge
  confusions:
  - VR-LOSANGE-DEBUT
  importance: utile
  wikimedia_file: Panneau de fin de voie réservée aux véhicules à occupation multiple en France.svg
  notes: ''
