- code: MARQ-ligne-jaune-zigzag
  categorie: marquage
  nom: 'Ligne jaune en zigzag : arrêt de bus'
  signification: 'Ligne jaune en zigzag peinte le long du trottoir matérialisant un arrêt d''autobus : interdiction
    de s''y arrêter et d''y stationner pour les autres véhicules.'
  conduite_a_tenir: Ne pas s'arrêter ni stationner sur le zigzag, même brièvement ; ne pas gêner le bus qui repart.
