- code: MARQ-livraison
  categorie: marquage
  nom: Aire de livraison (ligne jaune T'2 + croix jaune + inscription LIVRAISON)
  signification: 'Emplacement réservé à l''arrêt des véhicules effectuant un chargement/déchargement : ligne jaune
    discontinue et croix diagonale jaune, avec l''inscription « LIVRAISON ». Depuis 2010, certaines aires (ligne
    discontinue simple) sont ouvertes au stationnement des particuliers la nuit (20 h – 7 h), dimanches et fêtes
    ; les aires « sanctuarisées » (double ligne discontinue) restent réservées 24 h/24.'
  conduite_a_tenir: Ne pas y stationner (arrêt bref possible pour un chargement) sauf horaires autorisés sur les
    aires partagées.
  implantation: En agglomération.
  fin: ''
  forme_couleur: ligne jaune discontinue + croix jaune + inscription LIVRAISON
  confusions:
  - MARQ-ligne-jaune-discontinue
  - B6a1
  - M6f
  importance: utile
  wikimedia_file: ''
  notes: ''
- code: MARQ-marquage-temporaire-jaune
  categorie: marquage
  nom: Marquage temporaire jaune (chantier)
  signification: 'En zone de travaux, les lignes et flèches temporaires sont peintes en jaune : elles remplacent
