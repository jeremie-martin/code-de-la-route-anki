- code: MARQ-coussin-berlinois
  categorie: marquage
  nom: Coussin berlinois
  signification: 'Ralentisseur en forme de coussin n''occupant que le centre de la voie : les voitures doivent le
    franchir en le chevauchant, tandis que les bus (voies larges) et les vélos passent de part et d''autre sans
    être gênés. Signalé comme une surélévation (C27) avec triangles.'
  conduite_a_tenir: Ralentir (30 km/h), centrer le véhicule sur le coussin ; ne pas se déporter pour l'éviter par
    le côté (dangereux pour les cyclistes).
  implantation: Agglomération, itinéraires bus.
  fin: ''
  forme_couleur: coussin surélevé au centre de la voie, triangles blancs
  confusions:
