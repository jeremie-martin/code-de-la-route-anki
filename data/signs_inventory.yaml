    : les mêmes gestes s''appliquent (bâton levé = arrêt, mouvement de balancement = avancer). Un coup de sifflet
    attire l''attention pour renforcer un geste.'
  conduite_a_tenir: Suivre les gestes du bâton comme ceux du bras.
  implantation: ''
  fin: ''
  forme_couleur: gestes d'un agent (police, gendarmerie, signaleur) réglant la circulation
