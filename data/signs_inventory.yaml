- code: A4
  categorie: danger
  nom: Chaussée particulièrement glissante
  signification: Annonce une section de route où l'adhérence est particulièrement réduite (pluie, verglas, gravillons,
    boue, feuilles, revêtement lisse).
  conduite_a_tenir: Ralentir avant la section, éviter les freinages et accélérations brusques, augmenter les distances
    de sécurité.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus. Peut être complété par un panonceau
    M9 (« verglas fréquent », « par temps de pluie »...).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (voiture qui dérape)
  confusions:
  - AK4
  - A19
  importance: essentiel
  wikimedia_file: France road sign A4.svg
  notes: ''
- code: A6
  categorie: danger
  nom: Pont mobile
  signification: Annonce un pont mobile (pont levant, tournant, basculant) susceptible d'interrompre la circulation.
  conduite_a_tenir: Ralentir, se préparer à s'arrêter ; respecter les feux rouges clignotants (R24) et barrières.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (pont-levis)
  confusions:
  - A7
  - A20
  importance: utile
  wikimedia_file: France road sign A6.svg
  notes: ''
- code: A7
  categorie: danger
  nom: Passage à niveau muni de barrières ou demi-barrières
  signification: Annonce un passage à niveau gardé par des barrières ou demi-barrières (automatiques ou manuelles).
  conduite_a_tenir: Ralentir, être prêt à s'arrêter ; ne jamais franchir quand le feu rouge clignote ou que les
    barrières s'abaissent ; ne pas s'engager si l'on risque d'être immobilisé sur les voies.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus. Complété par les balises J10
    (3, 2 puis 1 bande rouge à 150, 100 et 50 m hors agglomération). En agglomération, balises J10 facultatives.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (barrière)
  confusions:
  - A8
  - A9b
  - A6
  - G1
  - G2
  importance: essentiel
  wikimedia_file: France road sign A7.svg
  notes: 'Sur les voies électrifiées, un panonceau M9b « voie ferrée électrifiée » peut compléter A7/A8. Dépassement
    interdit aux traversées de voies ferrées non munies de barrières ou de demi-barrières (R414-12) : avec barrières,
    l''interdiction générale ne s''applique pas.'
- code: A8
  categorie: danger
  nom: Passage à niveau sans barrière ni demi-barrière
  signification: Annonce un passage à niveau non gardé (sans barrières), avec ou sans signalisation automatique
    lumineuse.
  conduite_a_tenir: Ralentir fortement, regarder et écouter ; s'arrêter à la croix de Saint-André (G1) si un train
    approche ou si un STOP (AB4) l'exige ; ne franchir que si aucun train n'est visible ni audible.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus. Complété par les balises J10
    (3, 2 puis 1 bande rouge). Panneau de position G1/G1a à hauteur des voies, parfois accompagné d''un AB4 (STOP).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (locomotive)
  confusions:
  - A7
  - A9b
  - G1
  - G1a
  importance: essentiel
  wikimedia_file: France road sign A8.svg
  notes: ''
- code: A9a
  categorie: danger
  nom: Traversée de voie de véhicules routiers des services réguliers de transport en commun
  signification: Annonce la traversée d'une voie réservée aux bus (site propre bus), créé par l'arrêté du 12 décembre
    2018.
  conduite_a_tenir: Ralentir, regarder des deux côtés ; les bus circulant sur le site propre peuvent surgir.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (bus)
  confusions:
  - A9b
  - C20b
  - A7
  importance: rare
  wikimedia_file: France Road Sign A9a.png
  notes: Panneau récent (2018). Souvent accompagné de feux R24 (rouge clignotant) qui imposent l'arrêt.
- code: A9b
  categorie: danger
  nom: Traversée de voies de tramways
  signification: 'Annonce la traversée de voies de tramways (le tramway est prioritaire : il ne peut ni freiner
    court ni s''écarter).'
  conduite_a_tenir: Ralentir, regarder des deux côtés et céder le passage au tramway, qui est toujours prioritaire
    (même sur une route à caractère prioritaire).
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (tramway)
  confusions:
  - A9a
  - A7
  - A8
  - C20c
  importance: essentiel
  wikimedia_file: France road sign A9.svg
  notes: Fichier Commons nommé A9 (ancien code A9, devenu A9b en 2018). Le tramway est prioritaire à toutes les
    intersections sauf signalisation contraire (feux).
- code: A13a
  categorie: danger
  nom: Endroit fréquenté par les enfants
  signification: Annonce un endroit fréquenté par les enfants (école, colonie, terrain de jeux).
  conduite_a_tenir: Ralentir fortement (souvent limité à 30 km/h), être prêt à s'arrêter ; les enfants sont imprévisibles.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (deux enfants qui courent)
  confusions:
  - A13b
  - A14
  importance: essentiel
  wikimedia_file: France road sign A13a.svg
  notes: 'Piège classique : A13a (enfants) ≠ A13b (passage pour piétons).'
- code: A13b
  categorie: danger
  nom: Passage pour piétons
  signification: Annonce un passage pour piétons (passage protégé) situé 150 m plus loin hors agglomération (50
    m en agglomération).
  conduite_a_tenir: Ralentir, être prêt à s'arrêter pour laisser traverser les piétons engagés ou manifestant l'intention
    de traverser ; ne pas dépasser un véhicule qui ralentit ou s'arrête devant le passage.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus. Panneau de position au niveau
    du passage : C20a (carré bleu).'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (piéton sur passage)
  confusions:
  - A13a
  - C20a
  importance: essentiel
  wikimedia_file: France road sign A13b.svg
  notes: Le piéton régulièrement engagé ou manifestant clairement l'intention de traverser a la priorité (R415-11).
- code: A14
  categorie: danger
  nom: Autres dangers
  signification: Annonce un danger qui n'est pas représenté par un panneau spécifique ; la nature du danger est
    précisée par un panonceau M9 (« sortie d'usine », « route inondable », « nids de poule »...).
  conduite_a_tenir: Ralentir et lire le panonceau ; sans panonceau, redoubler de vigilance.
  implantation: 'Hors agglomération : 100 à 200 m avant le danger, le plus souvent 150 m (200 m sur autoroute).
    En agglomération : 0 à 50 m, le plus souvent 50 m. Un panonceau M1 précise la distance si elle est différente.
    Toujours à droite de la chaussée, éventuellement répété à gauche ou au-dessus.'
  fin: ''
  forme_couleur: triangle blanc bordé de rouge, symbole noir (point d'exclamation)
  confusions:
  - AK14
  - A4
  importance: essentiel
  wikimedia_file: France road sign A14.svg
  notes: C'est le seul panneau de danger permanent qui doit normalement être complété par un panonceau explicatif.
- code: A15a1
  categorie: danger
  nom: Passage d'animaux domestiques (bovins)
  signification: Annonce un endroit fréquenté par des animaux domestiques (troupeaux de vaches, moutons) susceptibles
