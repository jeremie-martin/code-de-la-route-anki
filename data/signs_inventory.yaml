    à très faibles émissions, autopartage) et éventuellement les horaires.
  conduite_a_tenir: Lire les catégories autorisées avant de s'engager dans la voie à losange.
  implantation: En amont de la voie réservée (arrêté du 24 août 2020).
  fin: ''
