<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approved Signal reference</title>
<style>
body{margin:24px;background:#eceeea;color:#20343c;font:16px/1.5 system-ui,sans-serif}
header{max-width:900px}h1{font-size:24px;margin-bottom:8px}
label{display:inline-block;margin:8px 18px 8px 0}select{font:inherit;padding:6px;max-width:90vw}
.pair{display:flex;flex-wrap:wrap;gap:24px}iframe{display:block;width:430px;height:932px;border:0;background:white}
article{max-width:100%;overflow:auto}h2{font-size:16px}
</style>
<header><h1>Approved Signal reference</h1>
<p>Frozen lab samples, not the latest production deck. Front and back use the exact exported CSS at 430 × 932 CSS pixels. Scroll inside long cards.</p>
<label>Sample <select id="sample"></select></label>
<label>Appearance <select id="appearance"><option value="">Light</option><option value="nightMode night_mode">Dark</option></select></label>
<p id="status" role="status"></p></header>
<main class="pair"><article><h2>Front</h2><iframe id="front" title="Signal front" sandbox="allow-same-origin"></iframe></article>
<article><h2>Back</h2><iframe id="back" title="Signal back" sandbox="allow-same-origin"></iframe></article></main>
<script>
Promise.all([fetch('signal.css').then(r=>r.text()),fetch('samples.json').then(r=>r.json())]).then(([css,cards])=>{
 const select=document.querySelector('#sample'),appearance=document.querySelector('#appearance');
 cards.forEach((c,i)=>select.add(new Option(c.id,i)));
 function render(){
   const card=cards[Number(select.value)],night=appearance.value;
   for(const face of ['front','back'])document.getElementById(face).srcdoc=
    '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<base href="'+location.href+'"><style>html,body{margin:0}.card{box-sizing:border-box;min-height:100vh}img{object-fit:contain}'+css+
    '</style><body class="'+night+'"><main class="card '+night+'">'+card[face]+'</main></body></html>';
 }
 select.onchange=appearance.onchange=render;render();
}).catch(e=>document.querySelector('#status').textContent='Serve this directory over HTTP to load the reference: '+e.message);
</script></html>
