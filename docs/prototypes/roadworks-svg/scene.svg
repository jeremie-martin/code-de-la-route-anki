<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title>Approche d’un chantier : vue schématique</title>
<desc>La voiture bleue monte dans la voie de droite. Un panneau de travaux sur l’accotement droit précède une rangée de cônes qui réduit progressivement cette voie, sans empiéter sur la voie opposée.</desc>
<metadata>Scene drawn for Code de la route Anki, 2026. AK5 artwork: Roulex 45, Wikimedia Commons, CC BY-SA 3.0. https://commons.wikimedia.org/wiki/File:France_road_sign_AK5.svg</metadata>
